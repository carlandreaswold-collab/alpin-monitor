<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>
    <div class="season" id="season-badge"></div>
    <span class="readonly-badge">👁 Lesevisning</span>
    <span class="updated">Oppdatert 9.11., 10:30</span>
  </div>
  <div class="filter-rows"><div class="filter-row" id="cat-row"></div></div>
  <div class="search-row">
    <input class="search-input" type="search" id="search" placeholder="Søk i titler, utøvere…">
    <select class="athlete-select" id="country-select"><option value="">Alle land</option></select>
    <select class="athlete-select" id="athlete-select"><option value="">Alle utøvere</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="main">
  <div id="feed"></div>
  <div class="sidebar">
    <div class="section-label" id="spik-label">Spik-liste</div>
    <div id="spik-list"></div>
  </div>
</div>

<script>
const CATS = [{"id":"viktig","label":"⚡ Viktig"},{"id":"sportslig","label":"🎿 Sportslig"},{"id":"nyheter","label":"📰 Nyhet"},{"id":"goy","label":"😄 Gøy"},{"id":"nerding","label":"🔬 Nerding"},{"id":"kjendis","label":"🌟 Kjendis"},{"id":"naert","label":"🤝 Nært og nyttig"}];
const ARTICLES = [{"id":122950,"source_name":"Neveitalia","country":"ITA","title_no":"SKI TEST: Dynastar bekrefter Gold Medal-utmerkelse","title_orig":"SKI TEST: Dynastar conferma una Gold Medal","summary_no":"Dynastar befester sin posisjon i ski-testen og mottar nok en ettertraktet Gold Medal-utmerkelse.","spik_no":"Dynastar mottar nok en Gold Medal-utmerkelse i den italienske ski-testen NeveItalia, der testteamet har prøvd ti modeller for sesongen 2026/27. Det franske skimerket, med røtter tilbake til 1956 og sterke tradisjoner innen alpint rennkjøring, befester dermed sin posisjon blant de mest anerkjente produsentene. Årets test løfter spesielt Speed-linjen frem, der Speed Course Master GS R22 fikk utmerkelsen «Scelto dai Tester» for sin presisjon og sporkontroll i GS-kategorien.","url":"https://www.neveitalia.it/test/news/ski-test-dynastar-conferma-la-gold-medal","pub_date":"2026-11-09T09:50:00.000Z","fetched_at":"2026-11-09 10:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122487,"source_name":"SkinEWS","country":"SUI","title_no":"Ti sveitsiske kvinner klar for Levi","title_orig":"Zweistellig – zehn Schweizerinnen in Levi am Start","summary_no":"Hele ti sveitsiske alpinister stiller til start i Levi, et imponerende tosifret antall for Sveits.","spik_no":"Hele ti sveitsiske kvinner er påmeldt til slalåmåpningen i Levi, noe som er et imponerende antall for nasjonen. Sveits har de siste årene styrket seg betydelig i tekniske disipliner på kvinnesiden, med profiler som Wendy Holdener og Michelle Gisin i spissen. Et tosifret startfelt signaliserer god bredde i det sveitsiske landslaget og økt konkurransetrykk internt.","url":"https://www.skinews.ch/news/2026/zweistellig-schweizerinnen-start/","pub_date":"2026-11-09T09:07:22.000Z","fetched_at":"2026-11-09 09:32:44","lang_orig":"de","category":null,"athletes":"Camille Rast,Lara Gut-Behrami,Michelle Gisin,Wendy Holdener","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":122471,"source_name":"Neveitalia","country":"ITA","title_no":"Popovic utgår fra Levi etter ny kneopersjon – fem kroater i renn","title_orig":"Leona Popovic costretta a rinunciare a Levi dopo un altro intervento al ginocchio sinistro, ecco i 5 croati in pista","summary_no":"Leona Popovic er tvunget til å stå over Levi-rennet etter en ny operasjon i venstre kne. Fem kroater stiller likevel til start.","spik_no":"Leona Popovic må stå over Levi-åpningen etter en ny operasjon i venstre kne, et alvorlig tilbakeslag for den kroatiske slalåmstjernen. Popovic er en av de fremste slalåmkjørerne i verdenscupen og har flere pallplasseringer på merittlisten. Kroatia stiller likevel med fem utøvere i Levi, et land som har en sterk tradisjon i tekniske disipliner takket være profiler som Janica Kostelić og Ivica Kostelić fra en tidligere generasjon.","url":"https://www.neveitalia.it/sport/scialpino/news/leona-popovic-costretta-a-rinunciare-a-levi-dopo-un-altro-intervento-al-ginocchio-sinistro-ecco-i-5-croati-in-pista","pub_date":"2026-11-09T08:35:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":"Leona Popovic","athlete_nations":["CRO"],"also_sources":[],"norwegian":false},{"id":122473,"source_name":"Neveitalia","country":"ITA","title_no":"Podiespillet starter i Levi: to slalåmrenn kan endre rankingen før Val di Fassa","title_orig":"Il Gioco dei Podi riparte da Levi: due slalom per cambiare le classifiche e inseguire la Val di Fassa","summary_no":"Levi åpner en ny runde i podiespillet med to slalåmrenn som kan rokke ved stillingene i jakten på Val di Fassa.","spik_no":"Levi åpner slalåmsesongen i Verdenscupen med to renn – damenes lørdag 14. november og herrenes søndag 15. november. Den finske alpinbyen i Lappland er et fast innslag på Verdenscupkalenderen og har gjennom årene vært scene for overraskende resultater. For fantasispillet «Il Gioco dei Podi» hos Neveitalia er Levi-rennet det første store sjansespillet etter åpningen i Sölden, der gigantslalåmen bød på overraskelser blant kvinnene men ga mer forutsigbare resultater blant mennene.","url":"https://www.neveitalia.it/sport/fantasy/giocodeipodi/news/il-gioco-dei-podi-riparte-da-levi-due-slalom-per-cambiare-le-classifiche-e-inseguire-la-val-di-fassa","pub_date":"2026-11-09T07:30:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122476,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen vinner igjen og åpner svensk trippel i andre slalåm i Storklinten – Hansson og Wissting på pallen","title_orig":"Jakobsen cala il bis e apre la tripletta svedese nel secondo slalom a Storklinten: sul podio anche Hansson e Wissting","summary_no":"Jakobsen doblet seg med ny seier i Storklinten og sørget for svensk trippel på pallen, foran Hansson og Wissting.","spik_no":"Kristoffer Jakobsen vant begge FIS-slalåmrennene i Storklinten og sørget for svensk trippel i søndagens renn, der Hansson og Wissting fulgte på pallen. Den 32 år gamle svenske spesialisten hadde en tung Verdenscup-sesong i fjor der han knapt scoret poeng, men viser nå sterk form en uke før sesongåpningen i Levi. Belgiernes Armand Marchant, som nesten tok sin første seier i Gurgl forrige sesong, deltok bare i lørdagens renn og endte da som toer, over ett sekund bak Jakobsen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/jakobsen-cala-il-bis-e-apre-la-tripletta-svedese-nel-secondo-slalom-a-storklinten-sul-podio-anche-hansson-e-wissting","pub_date":"2026-11-08T10:35:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":"sportslig","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122477,"source_name":"Neveitalia","country":"ITA","title_no":"SKI TEST: alle Blizzard-ski testet for deg","title_orig":"SKI TEST: tutti i Blizzard provati per voi!","summary_no":"En grundig gjennomgang av samtlige Blizzard-ski som er testet denne sesongen.","spik_no":"Neveitalia har testet 14 Blizzard-ski for sesongen 2026/27, og Firebird-linjen dominerer sortimentet med to nye toppmodeller. Firebird Race Type LT er en ny GS-ski beregnet på brede buer og erfarne kjørere med kraft og teknikk, mens Firebird Race Type MT retter seg mot allround-performance med racingegenskaper. Firebird WRC fikk utmerkelsen «Valgt av testerne» og roses for sin stabilitet, spigelfeste og aggressive kjøreegenskaper.","url":"https://www.neveitalia.it/test/news/ski-test-tutti-i-blizzard-provati-per-voi","pub_date":"2026-11-08T09:30:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122478,"source_name":"Neveitalia","country":"ITA","title_no":"Valérie Grenier i gang med kjerneøvelser to uker etter operasjon: – Jeg har fortsatt ambisjoner for karrieren","title_orig":"Primi esercizi di core per Valérie Grenier, che torna a parlare due settimane dopo l'intervento: \"Ho ancora ambizioni per la mia carriera\"","summary_no":"To uker etter inngrepet er Grenier i gang med rehabilitering og forsikrer at hun ikke er ferdig med alpinkarrieren.","spik_no":"Kanadiske Valérie Grenier er i gang med rehabilitering to uker etter korsband- og meniskoperasjon i høyre kne – en skade hun pådro seg uten å falle, bare en uke før sesongåpningen i Sölden. Det er hennes andre alvorlige kneoperasjon på under tre år, etter det alvorlige ulykken i Cortina i 2024. Grenier hadde store ambisjoner for inneværende sesong etter at hun vant gigantslalåm for tredje gang i karrieren under finalene i Hafjell i vår, men er nå henvist til en lang vei tilbake.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/primi-esercizi-di-core-per-valerie-grenier-che-torna-a-parlare-due-settimane-dopo-l-intervento-ho-ancora-ambizioni-per-la-mia-c","pub_date":"2026-11-08T08:25:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":122479,"source_name":"Neveitalia","country":"ITA","title_no":"Sesongen starter i Copper Mountain – norske utøvere med første treningsdag i Nakiska under ledelse av Sejersted","title_orig":"Mentre comincia la stagione a Copper Mountain, ieri a Nakiska il primo giorno in pista dei norge guidati da Sejersted","summary_no":"Mens Copper Mountain åpner sesongen, hadde det norske laget sin første dag på pisten i Nakiska med Sejersted som leder.","spik_no":"Det norske alpinlandslaget hadde sin første treningsdag på pisten i Nakiska i Canada under ledelse av Adrian Sejersted, mens den nordamerikanske sesongen formelt åpnet i Copper Mountain i Colorado. Den 32 år gamle Sejersted, som tok VM-bronse i super-G, er en av ankerpunktene i det norske fartslaget og returnerte til Verdenscup-pallen i utfor på Beaver Creek forrige sesong etter fem års pause. Aleksander Aamodt Kilde var ikke til stede i Nakiska, mens Moeller og Sellaeg var med i troppen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/mentre-comincia-la-stagione-a-copper-mountain-ieri-a-nakiska-il-primo-giorno-in-pista-dei-norge-guidati-da-sejersted","pub_date":"2026-11-08T07:25:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122480,"source_name":"Neveitalia","country":"ITA","title_no":"SKI TEST: seksten Atomic-ski testet – kjente modeller og nyheter vurdert","title_orig":"SKI TEST: sedici Atomic testati per voi, tra conferme e nuove proposte","summary_no":"Seksten Atomic-ski er satt under lupen, med en blanding av etablerte modeller og nye alternativer for sesongen.","spik_no":"Neveitalia har testet 16 Atomic-ski for sesongen 2026/27, og Redster-linjen utmerker seg med fem utmerkelser som «Valgt av testerne» og én Gold Medal. Redster G9 RS Revoshock ble valgt som beste racecarver GS-ski for sin stabilitet og presisjonen i høy fart, mens den nye Volant-linjen styrker piste-sortimentet. Atomic er et av de mest brukte merkene blant Verdenscup-utøvere og har lang tradisjon for å forsyne rennkjørere på toppnivå.","url":"https://www.neveitalia.it/test/news/ski-test-sedici-atomic-testati-per-voi-tra-conferme-e-nuove-proposte","pub_date":"2026-11-07T15:25:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122481,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen foran Marchant i FIS-slalåm i Storklinten – store navn i aksjon før Levi","title_orig":"Jakobsen davanti a Marchant, lo slalom FIS a Storklinten è da firme \"pesanti\" prima di Levi","summary_no":"Storklinten-slalåmen samlet tunge navn før Levi-rennet, med Jakobsen som vinner foran Marchant.","spik_no":"Kristoffer Jakobsen dominerte det første FIS-slalåmrennet i Storklinten i Sverige, og slo belgiske Armand Marchant med over ett sekund. Den 32 år gamle svenske veteranen hadde en svak Verdenscup-sesong i 2024/25 der en 13.-plass i Kitzbühel var sesongens beste resultat, og viste dermed sterk form med en uke igjen til Levi-åpningen. Blant damene vant unge norske Holen, og arrangementet fungerer som et viktig oppkjøringsrenn for nasjonale tropper som trener i regionen før Verdenscup-starten.","url":"https://www.neveitalia.it/sport/scialpino/news/jakobsen-davanti-a-marchant-lo-slalom-fis-a-storklinten-e-da-firme-pesanti-prima-di-levi","pub_date":"2026-11-07T14:00:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122482,"source_name":"Neveitalia","country":"ITA","title_no":"To uker etter Søldenshocken er Julia Scheib tilbake på snøen i Hippach – forbereder Killington","title_orig":"A due settimane dallo shock di Soelden, ecco Julia Scheib in pista sotto la neve di Hippach: la stiriana prepara Killington","summary_no":"Den østerrikske alpinisten Scheib er tilbake på ski i Hippach, bare to uker etter den dramatiske hendelsen i Sölden, med Killington som neste mål.","spik_no":"Julia Scheib er tilbake på ski i Hippach i Zillertal, to uker etter at hun røk ut i første omgang i Sölden da hun lå an til å kjøre fort nok til å vinne. Den østerrikske stirianeren regnes som klar favoritt i gigantslalåm og var kuppet av Verdenscupen i fjor da hun vant spesialitetsglobe. Neste mål er Killington i Vermont 29. november, der Scheib var syvende i 2023 men røk ut siste gang det ble kjørt gigant på «Superstar»-løypa.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/a-due-settimane-dallo-shock-di-soelden-ecco-julia-scheib-in-pista-sotto-la-neve-di-hippach-la-stiriana-prepara-killington","pub_date":"2026-11-07T13:20:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":"Julia Scheib","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":122488,"source_name":"SkinEWS","country":"SUI","title_no":"Feller hopper over Levi – Pertl tar plassen","title_orig":"Manuel Feller verzichtet auf den Levi-Start, Adrian Pertl rückt nach","summary_no":"Manuel Feller trekker seg fra rennet i Levi, og Adrian Pertl rykker opp på laget som erstatning.","spik_no":"Manuel Feller trekker seg fra slalåmrennet i Levi, og Adrian Pertl rykker inn som erstatning på det østerrikske laget. Feller er en av Østerrikes mest meritterte slalåmkjørere og vant slalåmcupen sammenlagt i 2023/24-sesongen. Pertl er en teknisk sterk kjører som selv har vært på pallen i verdenscupen, og er et naturlig valg som reserve for det østerrikske alpinlandslaget.","url":"https://www.skinews.ch/news/2026/manuel-feller-verzichtet/","pub_date":"2026-11-07T11:21:53.000Z","fetched_at":"2026-11-09 09:32:44","lang_orig":"de","category":null,"athletes":"Adrian Pertl,Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":122451,"source_name":"Ski Racing","country":"INT","title_no":"USAs regionale utviklingsprogram gjøres klart for vinteren","title_orig":"U.S. Regional Development Program Prepares for Winter","summary_no":"Det amerikanske regionale utviklingsprogrammet i alpint forbereder seg til den kommende vintersesongen.","spik_no":"Det amerikanske regionale utviklingsprogrammet (RDP) for alpint har hatt en aktiv sesongforberedelse med treningsleire i Ushuaia, New Zealand og Corralco, samt innendørs is- og brevreening i Europa. Over 80 utøvere fra 25 klubber har deltatt i programmet denne høsten, og i fjor økte andelen amerikanske juniorutøvere rangert blant verdens 300 beste med over 20 prosent. Det amerikanske herrelandslaget deler nå førsteplassen med Italia i internasjonale juniorsammenligninger, og programmet retter seg nå mot NorAm Cup-sesongen.","url":"https://skiracing.com/u-s-regional-development-program-prepares-for-winter/","pub_date":"2026-11-06T22:58:13.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122452,"source_name":"Ski Racing","country":"INT","title_no":"USSS Central Division legger frem alpinkalender for 2026–27","title_orig":"USSS Central Division 2026–27 Alpine Race Calendar: CR1, CR2 and CR3","summary_no":"USSS Central Division har offentliggjort rennkalenderen for alpinsesongen 2026–27, med CR1-, CR2- og CR3-løp.","spik_no":"USSS Central Division har offentliggjort alpinkalenderen for 2026/27-sesongen, som spenner fra desember til mars og inkluderer FIS-renn, FIS Entry League og regionale løp fordelt på tre soner: CR1 (Minnesota og Dakotas), CR2 (Wisconsin og Illinois-området) og CR3 (Michigan og Ohio-regionen). En viktig nyhet for sesongen er at alle FIS-deltakere nå må bruke kuttsikker beskyttelse med minst 3-stjerners sertifisering. Kalenderutgivelsen gjør det mulig for utøvere og familier å planlegge sesongen på tvers av de ulike nivåene og regionene.","url":"https://skiracing.com/central-division-2026-27-alpine-race-calendar/","pub_date":"2026-11-06T21:14:23.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122453,"source_name":"Ski Racing","country":"INT","title_no":"Møt Lionel Agoutin – mannen bak Ski World Cup-bannerne","title_orig":"Meet Lionel Agoutin, the Man Behind the Ski World Cup Banners","summary_no":"Lionel Agoutin er personen som lager de ikoniske bannerne langs traseen under alpinske verdenscuprenn.","spik_no":"Lionel Agoutin er mannen bak de fargerike bannerne som preger tribunene under alpinske verdenscuprenn verden over. Den franske entusiasten driver Alpine Ski World Cup Fan Community og lager bannerne selv – med nasjonale teamfarger og portretter av utøvere fra hele startfeltet. Bannerne er ikke et kommersielt produkt fra FIS eller forbundene, men resultatet av én manns dedikasjon til sporten og fellesskapet rundt den. Agoutin er et kjent ansikt i verdenscupen og har blant annet blitt fotografert sammen med stjerner som Lindsey Vonn.","url":"https://skiracing.com/meet-lionel-agoutin-the-man-behind-the-ski-world-cup-banners/","pub_date":"2026-11-06T20:19:31.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":"goy","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":121331,"source_name":"Neveitalia","country":"ITA","title_no":"Fem fartskjørere i Europa Cup-troppen til treningsleir i Pitztal","title_orig":"Cinque velocisti del team Coppa Europa per una settimana abbondante a Pitztal. Le prime discese del circuito a S. Caterina","summary_no":"Fem fartsspesialister fra Europa Cup-laget samles til en drøy uke med trening i Pitztal. De første utforrennene i kretsen arrangeres i Santa Caterina.","spik_no":"Fem italienske Europa Cup-fartsspesialister samles til treningsleir på Pitztal-breen i Tirol fra 8. til 16. november. Utøverne Emanuel Lamp, Leonardo Rigamonti, Luca Ruffinoni, Glauco Antonioli og Pietro Broglio trener under ledelse av teknisk direktør Massimo Carca, med tidligere Verdenscup-utøver Matteo Marsaglia blant trenerstaben. Pitztal er et populært tidligsesongsalternativ for alpin trening ettersom breen gir snøsikre forhold allerede om høsten. Sesongens første Europa Cup-utforrenn er satt til Santa Caterina, og rennsessongen ventes å komme i gang for fullt mot midten av desember.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/cinque-velocisti-del-team-coppa-europa-per-una-settimana-abbondante-a-pitztal-le-prime-discese-del-circuito-a-s-caterina","pub_date":"2026-11-06T16:00:00.000Z","fetched_at":"2026-11-06 16:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":121025,"source_name":"SkinEWS","country":"SUI","title_no":"Olympiamester Michaela Dorfmeister støtter innendørs skihall","title_orig":"Olympiasiegerin Michaela Dorfmeister macht sich für eine Skihalle stark","summary_no":"Den tidligere olympiske mesteren Michaela Dorfmeister går inn for bygging av en innendørs skihall.","spik_no":"Den østerrikske alpinlegenden Michaela Dorfmeister støtter planene om å bygge en innendørs skihall. Dorfmeister er en av Østerrikes mest meritterte alpinister og vant to gull under OL i Torino i 2006, i utfor og super-G. Etter karrieren har hun engasjert seg i alpinsportens utvikling, og hennes støtte til innendørsskianlegg kan bidra til å sikre rekruttering og trening uavhengig av snøforhold – noe som er stadig mer aktuelt i en tid med klimaendringer.","url":"https://www.skinews.ch/news/2026/olympiasiegerin-michaela-dorfmeister/","pub_date":"2026-11-06T15:39:53.000Z","fetched_at":"2026-11-06 15:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":120733,"source_name":"ORF Sport","country":"AUT","title_no":"Rusty-Jake Rodriguez sikrer seg Grand Slam-billett","title_orig":"Rusty-Jake Rodriguez schnappt sich Grand-Slam-Ticket","summary_no":"Rusty-Jake Rodriguez har kvalifisert seg til Grand Slam i alpint.","spik_no":"Artikkelteksten handler om darts, ikke alpint – Rusty-Jake Rodriguez kvalifiserte seg til PDC Grand Slam i darts i Wolverhampton, ikke til et alpinarrangement. Siden dette ikke er en alpinsak, finnes det ingen relevant bakgrunn å gi fra alpinsporten. Det ser ut til å ha oppstått en feil i kildematerialet som er sendt inn.","url":"https://sport.orf.at/stories/3164594/","pub_date":"2026-11-06T15:08:17.000Z","fetched_at":"2026-11-06 15:15:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":120607,"source_name":"Expressen","country":"SWE","title_no":"Damlandslaget med marerittstart i VM","title_orig":"Damkronornas mardrömsstart i VM","summary_no":"Det svenske damlandslaget i alpint fikk en svært dårlig start på verdensmesterskapet.","spik_no":"Det svenske damlandslaget i ishockey fikk en svært tung start på VM i Herning, og lå under 0–3 mot Canada etter første periode. Målene ble scoret av Jessie Eldridge, Emily Clark og Rebecca Leslie. Sverige regnes som en av de sterkere nasjonene i internasjonal damishockey, men møter et canadisk lag som tradisjonelt dominerer VM-turneringene. Svenske Lina Ljungblom erkjente at laget måtte løfte seg betraktelig med pucken for å holde seg i kampen.","url":"https://www.expressen.se/sport/hockey/damkronornas-mardromsstart-i-vm/","pub_date":"2026-11-06T14:51:29.000Z","fetched_at":"2026-11-06 15:00:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":119580,"source_name":"Neveitalia","country":"ITA","title_no":"Wiley Maple avslutter karrieren med utforkjøringene i Beaver Creek","title_orig":"Wiley Maple saluterà il circo bianco con le discese di Beaver Creek: 19° a Kitz pochi mesi fa, il veterano USA ha deciso di fermarsi","summary_no":"Den erfarne amerikanske alpinisten Wiley Maple legger opp og avslutter karrieren under utforkjøringene i Beaver Creek. Han ble nummer 19 i Kitzbühel for noen måneder siden.","spik_no":"Wiley Maple avslutter karrieren under utforkjøringene i Beaver Creek 3.–4. desember — i sitt eget hjemfylke Colorado. Den 36 år gamle amerikaneren, som er født nettopp i Colorado, har lenge vært utenfor det nasjonale støtteapparatet og måtte finansiere sesongen selv. At han likevel klarte 19.-plass på den beryktet krevende Streif i Kitzbühel denne sesongen, understreker klassen hans. Hans beste resultat gjennom karrieren var en 12.-plass i utfor i Bormio for tre år siden.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/wiley-maple-salutera-il-circo-bianco-con-le-discese-di-beaver-creek-19-a-kitz-pochi-mesi-fa-il-veterano-usa-ha-deciso-di-fermar","pub_date":"2026-11-06T13:20:00.000Z","fetched_at":"2026-11-06 13:30:02","lang_orig":"it","category":null,"athletes":"Wiley Maple","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":119117,"source_name":"Neveitalia","country":"ITA","title_no":"Ski-testkalenderen for Pool Sci Italia er klar – starter i Pampeago 28.–29. november","title_orig":"Ufficiale il calendario degli ski test del Pool Sci Italia. Si parte da Pampeago il 28 e 29 novembre","summary_no":"Den offisielle testkalenderen for Pool Sci Italia er bekreftet. Åpningen skjer i Pampeago 28. og 29. november.","spik_no":"Pool Sci Italia har bekreftet testkalenderen for sesongen, og åpningen skjer i Pampeago i Val di Fiemme 28.–29. november 2026. Arrangementet, kalt Prove Libere Tour, gir skiinteresserte muligheten til å teste over 500 par ski fra ni merker – deriblant Atomic, Fischer, Head og Rossignol – gratis og side om side på samme piste. Nytt av året er at turen avsluttes i april i Val Senales med «Future Days». Neveitalia er mediepartner og dekker alle etappene.","url":"https://www.neveitalia.it/ski/valdifiemmelatemar/news/ufficiale-il-calendario-degli-ski-test-del-pool-sci-italia-si-parte-da-pampeago-il-28-e-29-novembre","pub_date":"2026-11-06T12:30:26.000Z","fetched_at":"2026-11-06 12:45:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":118795,"source_name":"Neveitalia","country":"ITA","title_no":"Nøkkelsamling i Val Senales for Italias toppløpere før verdenscupstart","title_orig":"Dall'inizio della prossima settimana un raduno chiave in Val Senales per i big azzurri, poi sarà Coppa del Mondo","summary_no":"Italias beste alpinister samles i Val Senales fra starten av neste uke for en viktig treningsleir, før verdenscupsesongen sparkes i gang.","spik_no":"Italias snowboard parallell-lag samles på Val Senales-breen i Sør-Tirol fra mandag 9. til fredag 13. november for en viktig treningsleir, kun to uker før den internasjonale sesongen åpner i Kina. Teknisk direktør Cesare Pisoni har innkalt fjorten utøvere fra A-landslaget, blant dem rutinerte navn som Maurizio Bormolini, Roland Fischnaller og Aaron March, som alle har vært faste poengfigurer på verdenscuptouren i en årrekke. Val Senales er et av Alpenes mest brukte høyfjellssentre for tidlig sesongtrening og benyttes jevnlig av flere nasjoner på grunn av stabile snøforhold på breen.","url":"https://www.neveitalia.it/snowboard/news/dall-inizio-della-prossima-settimana-un-raduno-chiave-in-val-senales-per-i-big-azzurri-poi-sara-coppa-del-mondo","pub_date":"2026-11-06T12:10:00.000Z","fetched_at":"2026-11-06 12:15:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":118811,"source_name":"SkinEWS","country":"SUI","title_no":"Jakob Eisner: Fra verdenscupdebut til tvungen pause","title_orig":"Jakob Eisner – erst das Weltcup-Debüt, jetzt die Zwangspause","summary_no":"Jakob Eisner rakk knapt å debutere i verdenscupen før han ble tvunget til å ta en ufrivillig pause fra konkurransene.","spik_no":"Den 23 år gamle østerrikske teknikkspesialisten Jakob Eisner fikk en drømmestart på sesongen da han debuterte i verdenscupen under åpningsrennet i Sölden 25. oktober, men måtte kort etter legge inn en ufrivillig pause på grunn av skade. Eisner, som kommer fra Kärnten, klarte ikke å kvalifisere seg videre etter første omgang i Sölden, der han noterte seg som nummer 59. Overgangen fra lovende debut til skadebenken illustrerer hvor tøff og uforutsigbar veien opp i verdenscupens toppsjikt kan være for unge alpinister.","url":"https://www.skinews.ch/news/2026/eisner-weltcup-zwangspause/","pub_date":"2026-11-06T12:03:57.000Z","fetched_at":"2026-11-06 12:15:04","lang_orig":"de","category":null,"athletes":"Jakob Eisner","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":118472,"source_name":"Neveitalia","country":"ITA","title_no":"Huetter og lagvenninner forbereder seg til Beaver Creek på kanadisk snø","title_orig":"Huetter e compagne verso Beaver Creek... sulle nevi di Nakiska: dal 18 novembre le austriache in Canada","summary_no":"De østerrikske alpinistene innleder Canada-oppholdet på Nakiska fra 18. november, som oppkjøring til Beaver Creek.","spik_no":"Det østerrikske kvinnelandslaget reiser til Nakiska i Canada fra 18. november for å forberede seg til sesongåpningen i utfor og super-G på Birds of Prey-løypen i Beaver Creek 11.–13. desember. Cornelia Hütter er et av lagets største navn i fartsdisiplinene – hun vant utforrennet i Beaver Creek for to år siden foran Sofia Goggia. Laget har allerede hatt en produktiv oppkjøringsperiode på Sölden-breen, med fokus på super-G, og noen av gigantistene har i tillegg trent i Mayrhofen-Hippach.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/huetter-e-compagne-verso-beaver-creek-sulle-nevi-di-nakiska-dal-18-novembre-le-austriache-in-canada","pub_date":"2026-11-06T11:40:00.000Z","fetched_at":"2026-11-06 11:45:03","lang_orig":"it","category":null,"athletes":"Marco Schwarz","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":118346,"source_name":"SkinEWS","country":"SUI","title_no":"Wiley Maple avslutter karrieren for andre gang","title_orig":"Wiley Maple beendet seine Karriere zum zweiten Mal","summary_no":"Den amerikanske alpinisten Wiley Maple legger opp for andre gang i sin karriere.","spik_no":"Wiley Maple, 36 år gammel fartsspesialist fra Aspen i Colorado, avslutter sin karriere for andre gang. Han legger opp under World Cup-rennene i Beaver Creek 3.–4. desember, etter å ha deltatt i totalt 105 verdenscuprenn og representert USA under OL i 2018. Maple trakk seg første gang i 2020 på grunn av helseproblemer, men valgte siden å gjøre comeback. Nå setter han endelig strek for en lang karriere på øverste nivå i alpint.","url":"https://www.skinews.ch/news/2026/beendet-karriere-zweiten/","pub_date":"2026-11-06T11:27:11.000Z","fetched_at":"2026-11-06 11:30:04","lang_orig":"de","category":null,"athletes":"Wiley Maple","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":117378,"source_name":"Neveitalia","country":"ITA","title_no":"Bassino: – Føler meg allerede mye bedre i utfor, men har ting å jobbe med i storslalåm","title_orig":"\"Nella velocità mi trovo già molto meglio, in gigante devo sistemare un po' di cose\": ecco Bassino tra Diavolezza e Pitztal","summary_no":"Marta Bassino reflekterer over formen sin mellom treningsopphold på Diavolezza og Pitztal, og ser fremgang i utforøvelsene.","spik_no":"Marta Bassino sier hun allerede kjenner klar fremgang i fartsdisiplinene, men at hun har ting å rette på i storslalåm. Den italienske alpinisten fra Cuneo er i full sesongforberedelse og har de siste ukene trent ved gletsjerne Diavolezza og Pitztal, blant annet sammen med Sofia Goggia og Asja Zenere. Bassino er regjerendes verdenscupvinner i storslalåm fra 2020–21-sesongen og har de senere sesongene satset mer på fartsdisiplinene. Neste store mål er Killington-rennet i Nord-Amerika.","url":"https://www.neveitalia.it/sport/scialpino/femmi ategory":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":116658,"source_name":"Neveitalia","country":"ITA","title_no":"Hirscher tilbake i slalåmbakken i Gurgl – kan dette bli comebackarenaen?","title_orig":"Hirscher torna a fare slalom a Gurgl: sulla pista di gara del 22 novembre, sarà quello lo stadio del rientro?","summary_no":"Marcel Hirscher er tilbake på slalåmtrening i Gurgl, på den samme pisten der verdenscuprennet 22. november skal avholdes. Blir dette hans offisielle comeback?","spik_no":"Marcel Hirscher er observert på slalåmtrening i Gurgl i Østerrike, på den samme pisten der verdenscuprennet er planlagt 22. november. Hirscher, som dominerte alpinsporten med åtte strake sammenlagttitler i verdenscupen frem til han la opp i 2019, gjorde comeback i fjor sesong under nederlandsk flagg. Han har ennå ikke fått vist sitt beste etter comebacket, og spekulasjonene går nå på om Gurgl kan bli scenen for hans første virkelige gjenkomst på toppnivå.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/hirscher-torna-a-fare-slalom-a-gurgl-sulla-pista-di-gara-del-22-novembre-sara-quello-lo-stadio-del-rientro","pub_date":"2026-11-05T13:20:00.000Z","fetched_at":"2026-11-06 08:54:55","lang_orig":"it","category":null,"athletes":"Marcel Hirscher","athlete_nations":["NED"],"also_sources":[],"norwegian":false},{"id":110536,"source_name":"Neveitalia","country":"ITA","title_no":"Bassino, Goggia og Pirovano samlet på Pitztal – andre treningsdag i gang","title_orig":"Con Bassino a Pitztal ci sono anche Goggia e Pirovano (e i discesisti del team maschile): oggi la seconda giornata in pista","summary_no":"Marta Bassino trener på Pitztal sammen med Sofia Goggia og Laura Pirovano, samt herrelandslagets utforere. I dag er andre treningsdag på programmet.","spik_no":"Den italienske alpinlandsbyen Pitztal er et populært treningssted på isbre tidlig i sesongen, og her samles nå tre av Italias fremste alpinister: Marta Bassino, Sofia Goggia og Laura Pirovano. Bassino er en allsidig tekniker med VM-gull i parallellslalåm, mens Goggia er en av verdens beste utforere med OL-gull fra Pyeongchang 2018. At de trener sammen med herrelandslagets utforere tyder på felles bruk av banekapasitet og treningsressurser i sesongoppkjøringen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/con-bassino-a-pitztal-ci-sono-anche-goggia-e-pirovano-e-i-discesisti-del-team-maschile-oggi-la-seconda-giornata-in-pista","pub_date":"2026-11-04T18:20:00.000Z","fetched_at":"2026-11-04 20:00:03","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":110538,"source_name":"Neveitalia","country":"ITA","title_no":"Aicher forbereder Levi og Gurgl på Kaunertal","title_orig":"Super Aicher dove prepara Levi e Gurgl? La bavarese lavora a Kaunertal con le giovani compagne di nazionale","summary_no":"Tyske Aicher trener til Levi- og Gurgl-rennene på Kaunertal-isbreen sammen med unge lagvenninner.","spik_no":"Tyske Emma Aicher bruker Kaunertal-isbreen i Østerrike til å forberede seg til de første teknikkrhomework i Levi og Gurgl, to av de tidligste verdenscuprennene på høsten. Aicher, som er en av Tysklands mest lovende unge slalåm- og storslalåmkjørere, trener her sammen med unge lagvenninner. Kaunertal er et mye brukt treningssenter for alpinlandslag fordi isbreen gir snøsikre forhold gjennom hele sommeren og høsten.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/super-aicher-dove-prepara-levi-e-gurgl-la-bavarese-lavora-a-kaunertal-con-le-giovani-compagne-di-nazionale","pub_date":"2026-11-04T14:50:00.000Z","fetched_at":"2026-11-04 20:00:03","lang_orig":"it","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":110615,"source_name":"SVT Sport","country":"SWE","title_no":"Isak Bjerkebo reagerer på spesielle bilder","title_orig":"Isak Bjerkebo reagerar på speciella bilderna","summary_no":"Den norske alpinisten Isak Bjerkebo reagerer på noen oppsiktsvekkende bilder som har dukket opp.","spik_no":"Denne saken handler ikke om alpinist Isak Bjerkebo, men om en norsk fotballspiller med samme navn som spiller for IFK Sirius i svensk Allsvenskan. 23-åringen fikset et straffespark og scoret i 1–0-seieren mot Halmstad, men bilder fra situasjonen fikk ham til å le – det så nemlig ut som han bevisst søkte kontakt med motstanderens hånd. Bjerkebo selv benekter det, men innrømmer at det ser mistenkelig ut.","url":"https://www.svt.se/sport/fotboll/isak-bjerkebo-reagerar-pa-speciella-bilderna","pub_date":"2026-11-03T23:03:23.000Z","fetched_at":"2026-11-04 20:00:06","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":109865,"source_name":"Ski Racing","country":"INT","title_no":"Dobbelt olympisk mester Michelle Gisin legger opp som 32-åring","title_orig":"Two-time Olympic champion Michelle Gisin retires at 32","summary_no":"Sveitsiske Michelle Gisin, todobbelt olympisk mester, avslutter karrieren som 32-åring.","spik_no":"Sveitsiske Michelle Gisin annonserte tirsdag sin karriereslutt i en pressekonferanse på Titlis over Engelberg, knapt et år etter at en alvorlig treningskræsj i St. Moritz satte en stopper for sesongen. I ulykken i desember 2025 pådro hun seg skader i nakkevirvlene, håndleddet og kneet, inkludert brudd på korsbåndet og det mediale kollateralbåndet. Gisin, som vant olympisk gull i alpint kombinert både i Pyeongchang 2018 og Beijing 2022, rakk 291 verdenscupstarter og 21 individuelle pallplasser på tvers av fem disipliner i løpet av en 14 år lang karriere.","url":"https://skiracing.com/two-time-olympic-champion-michelle-gisin-retires-at-32/","pub_date":"2026-11-03T21:18:31.000Z","fetched_at":"2026-11-03 21:30:01","lang_orig":"en","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":109643,"source_name":"Expressen","country":"SWE","title_no":"Svensk raseri mot det nye systemet: «Katastrofe»","title_orig":"Svenska ilskan mot nya systemet: ”Katastrof”","summary_no":"Svenske alpinister reagerer med sterk kritikk mot det nye systemet og betegner det som en katastrofe.","spik_no":"Svenske utøvere raser mot WADAs nye system for oppholdsrapportering, kalt Athlete Center, som skal erstatte det gamle Adams-systemet fra februar. Friidrettsprofilen Perseus Karlström er blant de skarpeste kritikerne og beskriver den nye portalen som en «total katastrofe». Systemet krever at toppidrettsutøvere daglig rapporterer hvor de befinner seg, slik at dopingkontrollanter kan gjennomføre uanmeldte tester — tre bomturer på tolv måneder gir automatisk dopingutestengelse. Karlström frykter at det tungvinte nye systemet vil føre til flere feilregistreringer og urettferdige utestengelser.","url":"https://www.expressen.se/sport/friidrott/svenska-ilskan-mot-nya-systemet-katastrof/","pub_date":"2026-11-03T20:58:17.000Z","fetched_at":"2026-11-03 21:00:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":107787,"source_name":"Neveitalia","country":"ITA","title_no":"Ospelt hadde ingen valg – «men fra 2028/29 kan mye endre seg»","title_orig":"Scelte obbligate per Ospelt, \"ma dal 2028/29 potranno cambiare molte cose\". Parola al presidente FIS","summary_no":"FIS-presidenten forklarer hvorfor Ospelt sto overfor tvungne valg, men antyder at situasjonen kan endre seg betydelig fra sesongen 2028/29.","spik_no":"FIS-president Alexander Ospelt forklarer at flere av hans beslutninger som ny leder av skiforbundet har vært tvungne, men at mye kan endre seg fra sesongen 2028/29. Ospelt, som er advokat fra Liechtenstein, tok over presidentposten 11. juni 2024 etter å ha vunnet valget med kun én stemmes margin. Han har beskrevet en visjon om å gjøre verdenscupen mer lik fotballens Champions League, og antyder at Sölden-åpningen kan utvides til fire renn fra 2028. En kritisk økonomisk situasjon i FIS er ifølge kilder bakteppet for de pålagte valgene han har måttet ta.","url":"https://www.neveitalia.it/sport/scialpino/news/scelte-obbligate-per-ospelt-ma-dal-2028-29-potranno-cambiare-molte-cose-parola-al-presidente-fis","pub_date":"2026-11-03T18:00:00.000Z","fetched_at":"2026-11-03 18:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":107606,"source_name":"Ski Racing","country":"INT","title_no":"Rocky Mountain Division lanserer alpin-kalender for 2026–27","title_orig":"Rocky Mountain Division releases 2026-27 alpine race calendar","summary_no":"Rocky Mountain Division har offentliggjort rennkalenderen for alpinsesongen 2026–27.","spik_no":"Rocky Mountain Division har offentliggjort alpinkalenderen for sesongen 2026–27, med sesongstart på Aspen Highlands 30. november–1. desember. Kalenderen strekker seg til 15. april og omfatter FIS-, FISU-, SYNC Cup- og ungdomsrenn over hele regionen, inkludert det populære Holiday Classic på Vail i desember og regionale FIS-mesterskap på Copper Mountain i mars. Rocky Mountain Division er en av de viktigste divisjonene i US Ski and Snowboard-systemet, og fungerer som et sentralt utviklingsløp for unge amerikanske alpinister. En ny regel denne sesongen krever at alle FIS-utøvere må bruke kutt-resistente underplagg med minst tre stjerners klassifisering.","url":"https://skiracing.com/rocky-mountain-division-releases-2026-27-alpine-race-calendar/","pub_date":"2026-11-03T17:51:01.000Z","fetched_at":"2026-11-03 18:00:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":106499,"source_name":"Neveitalia","country":"ITA","title_no":"Gisin forklarer hvorfor hun la opp: «Jeg var ikke lenger trygg på de siste fem prosentene»","title_orig":"\"Sarei tornata al mio 95%, non ero più sicura di quel 5% per competere. A St. Moritz ho deciso\": Gisin spiega i motivi del suo addio","summary_no":"Michelle Gisin avslørte at hun hadde kommet seg til 95 prosent av toppformen, men ikke lenger følte seg trygg nok til å konkurrere. Beslutningen tok hun i St. Moritz.","spik_no":"Michelle Gisin kunngjorde sin karriereslutt 3. november, og forklarte at hun hadde kommet seg til 95 prosent av toppformen etter skader, men ikke lenger følte seg trygg nok på de siste fem prosentene til å konkurrere på høyeste nivå. Beslutningen tok hun i St. Moritz. Sveitseren hadde en karriere på nesten 14 år i verdenscupen, med 290 starter, 21 paller og seier i slalåmen i Semmering – samt to olympiske gull. Hun er gift med den italienske alpinisten Luca De Aliprandini og skal være TV-ekspert under VM i Crans-Montana.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sarei-tornata-al-mio-95-non-ero-piu-sicura-di-quel-5-per-competere-a-st-moritz-ho-deciso-gisin-spiega-i-motivi-del-suo-addio","pub_date":"2026-11-03T16:10:00.000Z","fetched_at":"2026-11-03 16:15:01","lang_orig":"it","category":null,"athletes":"Lara Gut-Behrami,Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":106018,"source_name":"Neveitalia","country":"ITA","title_no":"Val di Fassa-ambassadører klar for Sölden – med Colturi og Aicher i spissen","title_orig":"La Val di Fassa simbolo delle \"Piste Azzurre\" e i suoi ambassador volano a Soelden, a partire da Colturi e Aicher. E pure Radamus...","summary_no":"Val di Fassa, kjent for sine blå løyper, sender sine ambassadører til Sölden, blant dem Colturi, Aicher og Radamus.","spik_no":"Val di Fassa-regionen i Trentino sender sine ambassadører til åpningsrunden av verdenscupen i Sölden, og de to fremste profilene leverte umiddelbart. Lara Colturi, som representerer Albania og er datter av den tidligere alpinisten Giorgio Colturi, ble nummer to i kvinnenes storslalåm – bare ett hundredels sekund bak Paula Moltzan. Tyske Emma Aicher kompletterte podiet på tredjeplass, mens amerikaneren River Radamus, som har sterke bånd til Val di Fassa fra junior-VM i 2019, ble nummer fire.","url":"https://www.neveitalia.it/sport/scialpino/news/la-val-di-fassa-simbolo-delle-piste-azzurre-e-i-suoi-ambassador-volano-a-soelden-a-partire-da-colturi-e-aicher-e-pure-radamus","pub_date":"2026-11-03T15:25:00.000Z","fetched_at":"2026-11-03 15:30:02","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi,River Radamus","athlete_nations":["ALB","GER","USA"],"also_sources":[],"norwegian":false},{"id":105538,"source_name":"Neveitalia","country":"ITA","title_no":"Bassino til Pitztal – Borsotti, Della Vite og Talacci trener i Val Senales","title_orig":"Bassino a Pitztal, il trio formato da Borsotti, Della Vite e Talacci torna ad allenarsi in Val Senales","summary_no":"Marta Bassino reiser til Pitztal, mens trioen Borsotti, Della Vite og Talacci gjenopptar treningen i Val Senales.","spik_no":"Den italienske alpinistgruppen splitter treningsleiren: Marta Bassino drar til Pitztal i Østerrike for å trene storslalåm, mens Giovanni Borsotti, Lara Della Vite og Simon Talacci gjenopptar treningen på Val Senales-breen i Italia. Bassino, som er dobbelt verdensmester i super-G og parallell, trente forrige uke på Diavolezza og forbereder seg mot Killington – der hun for sju år siden tok sin første verdenscupseier. Etter storslalåm-treningsblokken er planen at hun skal over til fartsdisiplinene på Copper Mountain.","url":"https://www.neveitalia.it/sport/scialpino/news/bassino-a-pitztal-il-trio-formato-da-borsotti-della-vite-e-talacci-torna-ad-allenarsi-in-val-senales","pub_date":"2026-11-03T14:40:00.000Z","fetched_at":"2026-11-03 14:45:02","lang_orig":"it","category":null,"athletes":"Filippo Della Vite,Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":104069,"source_name":"Ski Racing","country":"INT","title_no":"Tre venner med ett felles mål: Gjøre alpint videoinnhold lettere tilgjengelig","title_orig":"Three Friends, One Shared Goal: Making Ski Racing Video Easier to Access","summary_no":"Tre venner har gått sammen om å gjøre videoer fra alpint skiløp enklere å finne og se for alle interesserte.","spik_no":"Tre venner – Sean Doucette, Peter Zawadzki og Jeremy Stonier – har grunnlagt selskapet YULLR, som skal gjøre det enklere å få tak i videoopptak fra alpintrening og -renn. Systemet bruker automatiserte kameraer som fanger opp kjøring og gjør opptakene tilgjengelige på nett mens utøverne fortsatt er på fjellet. Problemet de vil løse er velkjent i alpinmiljøet: trenere har allerede mer enn nok å gjøre med kursoppsett, portar og tidtaking, og videoen ender ofte opp som en ekstraopp­gave etter en lang treningsdag – da utøverne kanskje har mistet interessen for å se seg selv.","url":"https://skiracing.com/three-friends-one-shared-goal-making-ski-racing-video-easier-to-access/","pub_date":"2026-11-03T12:32:29.000Z","fetched_at":"2026-11-03 12:45:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":103411,"source_name":"Sportschau","country":"GER","title_no":"327 dager etter fall: Olympiamester Gisin avslutter karrieren","title_orig":"327 Tage nach Sturz: Olympiasiegerin Gisin beendet Karriere","summary_no":"Michelle Gisin, olympisk mester i alpint, har avsluttet karrieren sin 327 dager etter at hun pådro seg en alvorlig skade i et fall.","spik_no":"Michelle Gisin avslutter karrieren 327 dager etter et alvorlig fall under utfortrening i St. Moritz i desember 2025, der hun så vidt unngikk å bli lam. Den 32 år gamle sveitsiske allrounderen er dobbel olympisk mester i kombinasjon, med gull fra både Pyeongchang 2018 og Beijing 2022, der hun i tillegg tok bronse i super-G. Fallet påførte henne alvorlige skader i nakken, håndleddet og kneet, og hun måtte gjennom flere operasjoner. Gisin sier i en uttalelse til det sveitsiske skiforbundet at beslutningen modnet parallelt med rehabiliteringen, og at hun nå er «svært glad» for valget hun har tatt.","url":"https://www.sportschau.de/wintersport/ski-alpin/olympiasiegerin-gisin-beendet-karriere,ski-alpin-gisin-100.html","pub_date":"2026-11-03T11:29:21.000Z","fetched_at":"2026-11-03 11:30:07","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":103287,"source_name":"Neveitalia","country":"ITA","title_no":"SC Courmayeur tar imot Brignone igjen: – En forelder holder alltid døren åpen","title_orig":"\"Un genitore lascia sempre la porta aperta, Fede è rimasta la ragazza che ama sciare in libertà\": lo S.C. Courmayeur riaccoglie Brignone","summary_no":"Federica Brignone ønskes velkommen tilbake til skiklubben SC Courmayeur, som beskriver henne som jenta som alltid har elsket å stå fritt på ski.","spik_no":"Federica Brignones hjemklubb SC Courmayeur ønsker henne hjertelig velkommen tilbake og beskriver henne som «jenta som alltid har elsket å stå fritt på ski». Nyheten kommer dagen etter at Brignone kunngjorde at hun forlater sin stilling i Carabinieri, den italienske militærenheten mange alpinister er tilknyttet. Den 34-årige alpinisten fra La Salle er Italias mestvinnende utøver gjennom tidene med to olympiske gull og over 30 verdenscupseire, og er nå i gang med oppkjøringen mot en ny comeback-sesong etter skade.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-genitore-lascia-sempre-la-porta-aperta-fede-e-rimasta-la-ragazza-che-ama-sciare-in-liberta-lo-sc-courmayeur-riaccoglie-brign","pub_date":"2026-11-03T11:25:00.000Z","fetched_at":"2026-11-03 11:30:02","lang_orig":"it","category":"naert","athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":103387,"source_name":"RTV SLO","country":"SLO","title_no":"Olympisk mester Michelle Gisin avslutter karrieren 11 måneder etter fall","title_orig":"Olimpijska prvakinja Michelle Gisin 11 mesecev po padcu končala kariero","summary_no":"Den olympiske mesteren Michelle Gisin har valgt å avslutte sin aktive karriere, elleve måneder etter at hun ble skadet i et alvorlig fall.","spik_no":"Michelle Gisin bekrefter karriereslutten elleve måneder etter at hun veltet stygt under utfortrening i St. Moritz i desember 2025. Den 32-årige sveitseren er en av alpinhistoriens mest allsidige utøvere, med to olympiske gull i kombinasjon fra henholdsvis 2018 og 2022, samt to VM-medaljer og pallplasseringer i samtlige disipliner i verdenscupen. Etter fallet, som nesten resulterte i lammelse, gjennomgikk hun flere operasjoner på nakke, håndledd og kne. At hun nå trekker seg, kommer ikke som en overraskelse etter omfanget av skadene.","url":"https://www.rtvslo.si/sport/olimpijska-prvakinja-michelle-gisin-11-mesecev-po-padcu-koncala-kariero/798885","pub_date":"2026-11-03T11:24:50.000Z","fetched_at":"2026-11-03 11:30:05","lang_orig":"sl","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":103013,"source_name":"ORF Sport","country":"AUT","title_no":"OL-vinner Gisin legger opp","title_orig":"Olympiasiegerin Gisin zieht Schlussstrich","summary_no":"Olympiamester Michelle Gisin setter strek over karrieren som alpinist.","spik_no":"Michelle Gisin avslutter karrieren med umiddelbar virkning etter at hun aldri kom seg tilbake etter et alvorlig fall i Abfahrttreningen i St. Moritz i desember 2025, der hun pådro seg skader i nakkevirvlene, håndleddet og kneet — og var nær ved å bli lam. Den 32 år gamle sveitseren vant OL-gull i alpint kombinasjon i både Pyeongchang 2018 og Beijing 2022, pluss OL-bronse i super-G i 2022. I løpet av 292 verdenscuprenn sto hun 22 ganger på pallen og vant individuelt én gang, i slalåm på Semmering i desember 2020 — samme bakke der hun hadde hatt sin verdenscupdebut i 2012.","url":"https://sport.orf.at/stories/3164414/","pub_date":"2026-11-03T10:54:27.000Z","fetched_at":"2026-11-03 11:00:05","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":102530,"source_name":"ORF Sport","country":"AUT","title_no":"Olympiamester Gisin avslutter karrieren","title_orig":"Olympiasiegerin Gisin beendet ihre Karriere","summary_no":"Alpinisten Michelle Gisin, som har vunnet olympisk gull, legger opp og avslutter sin aktive karriere som alpinist.","spik_no":"Michelle Gisin avslutter karrieren etter et alvorlig treningsfall i desember 2025 og kommer ikke tilbake til verdenscupen. Den sveitsiske allroundkjøreren tok to olympiske gull i kombinasjon, i Pyeongchang 2018 og Beijing 2022, og la til bronse i super-G i Beijing. I VM vant hun sølv i kombinasjon i 2017 og bronse i 2021. I løpet av 291 verdenscupstarter hentet hun 22 pallplasseringer og to seirer.","url":"https://sport.orf.at/stories/3164412/","pub_date":"2026-11-03T10:11:01.000Z","fetched_at":"2026-11-03 10:15:39","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":102661,"source_name":"SkinEWS","country":"SUI","title_no":"Gisin legger opp – avslutter karrieren","title_orig":"Das wars – Michelle Gisin beendet ihre Karriere","summary_no":"Michelle Gisin har annonsert at hun avslutter sin aktive karriere som alpinist.","spik_no":"Michelle Gisin annonserte 3. november 2026 at hun avslutter sin aktive karriere som alpinist, 327 dager etter et alvorlig fall under treningen til utforrennet i St. Moritz i desember 2025. 32-åringen fra Engelberg er todobbelt olympisk mester og en av Sveits mest allsidige alpinister gjennom tidene, med seirer i både kombinasjon, super-G og slalåm i verdenscupen. Med henne legger den siste av søsknene Gisin opp – søsteren Dominique sluttet i mars 2015 og broren Marc i november 2020. Familien Gisin har vært en av de mest markante alpinfamiliene i internasjonal alpinhistorie.","url":"https://www.skinews.ch/news/2026/michelle-beendet-karriere/","pub_date":"2026-11-03T10:05:24.000Z","fetched_at":"2026-11-03 10:30:05","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":102343,"source_name":"Neveitalia","country":"ITA","title_no":"Michelle Gisin legger opp – avslutter en enestående karriere","title_orig":"Il percorso di Michelle Gisin si conclude qui: ufficiale il ritiro della due volte olimpionica. \"Un viaggio incredibile\"","summary_no":"To ganger olympisk mester Michelle Gisin har offisielt kunngjort sin pensjonering fra alpint. Sveitseren omtaler karrieren som en utrolig reise.","spik_no":"Michelle Gisin, 32 år, har kunngjort at hun avslutter karrieren etter et alvorlig fall i utforrennet i St. Moritz 11. desember 2025. Sveitseren vant to olympiske gull, begge i kombinasjon – i Pyeongchang 2018 og Beijing 2022 – og tok også OL-bronse i super-G i 2022. Hun oppnådde tredjeplass i verdenscupsammenlagt sesongen 2020/21 og rakk 290 verdenscupstarter, med pall i samtlige disipliner. Gisin omtaler selv karrieren som «en utrolig reise».","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/il-percorso-di-michelle-gisin-si-conclude-qui-ufficiale-il-ritiro-della-due-volte-olimpionica-un-viaggio-incredibile","pub_date":"2026-11-03T09:50:00.000Z","fetched_at":"2026-11-03 10:00:02","lang_orig":"it","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":101375,"source_name":"Neveitalia","country":"ITA","title_no":"Fra Braathen til Shiffrin: Sölden-stjernene trener på Val Senales – nye løyper åpnet","title_orig":"Da Braathen a Shiffrin, i protagonisti di Sölden scelgono la Val Senales. Nuove piste aperte sul ghiacciaio","summary_no":"Alpinstjerner som Lucas Braathen og Mikaela Shiffrin har valgt Val Senales som treningsarena. Nye løyper er åpnet på breen foran sesongen.","spik_no":"Val Senales-breen i Sør-Tyrol bekrefter sin status som en av alpinsportens viktigste treningsarenaer: hele 18 av de 30 best plasserte utøverne i åpningsrennene i Sölden hadde forberedt seg nettopp her. Blant dem var Lucas Braathen, som vant herrenes storslalåm i Sölden, og Mikaela Shiffrin. Nye løyper er åpnet på breen, og 28. november er det planlagt åpning av nedenforliggende løyper, noe som utvider treningsmulighetene ytterligere frem mot sesongen.","url":"https://www.neveitalia.it/ski/valsenales/news/da-braathen-a-shiffrin-i-protagonisti-di-solden-scelgono-la-val-senales-nuove-piste-aperte-sul-ghiacciaio","pub_date":"2026-11-03T08:26:04.000Z","fetched_at":"2026-11-03 08:30:02","lang_orig":"it","category":null,"athletes":"Lucas Braathen,Mikaela Shiffrin","athlete_nations":["BRA","USA"],"also_sources":[],"norwegian":false},{"id":100903,"source_name":"SkinEWS","country":"SUI","title_no":"Ny utmerkelse til tredobbel olympisk mester Franjo von Allmen","title_orig":"Nächste Auszeichnung für Dreifach-Olympiasieger Franjo von Allmen","summary_no":"Franjo von Allmen, som vant tre olympiske gull, mottar nok en prestisjetung utmerkelse.","spik_no":"Franjo von Allmen er kåret til «Årets idrettsutøver i kantonen Bern 2026», nok en prestisjetung utmerkelse til den sveitsiske alpinisten. 25-åringen fra Berner Oberland tok tre olympiske gull og har hatt en formidabel sesong. Kantonen Bern deler hvert år ut prisen til utøvere som har nådd pallen i VM, EM eller andre høyprofilerte internasjonale konkurranser, og over 50 medaljevinnere ble hedret ved årets utdeling.","url":"https://www.skinews.ch/news/2026/naechste-auszeichnung-olympiasieger/","pub_date":"2026-11-03T07:42:46.000Z","fetched_at":"2026-11-03 07:45:04","lang_orig":"de","category":null,"athletes":"Franjo von Allmen","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":100827,"source_name":"RTV SLO","country":"SLO","title_no":"Houthi-raketter tvang asiatisk mesterskap fra januar til desember 2027","title_orig":"Rakete hutijev prestavile azijsko prvenstvo z januarja na december 2027","summary_no":"Asiatisk mesterskap i alpint er blitt flyttet fra januar til desember 2027 som følge av houthi-rakettangrep.","spik_no":"Det asiatiske alpinmesterskapet er flyttet fra januar til desember 2027 på grunn av houthi-rakettangrep i regionen. Houthi-bevegelsen i Jemen har siden 2023 gjennomført en rekke angrep mot skip og mål i Rødehavet og omkringliggende områder, noe som har skapt usikkerhet og sikkerhetsproblemer for arrangementer i nærheten. Det er uvanlig at geopolitiske konflikter direkte påvirker internasjonale alpinarrangementer, og beslutningen understreker hvor stor rekkevidden av konflikten har blitt.","url":"https://www.rtvslo.si/sport/rakete-hutijev-prestavile-azijsko-prvenstvo-z-januarja-na-december-2027/798849","pub_date":"2026-11-03T07:07:24.000Z","fetched_at":"2026-11-03 07:30:05","lang_orig":"sl","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":93021,"source_name":"ORF Sport","country":"AUT","title_no":"Nyvinninger skal løfte Kraft til topps","title_orig":"Neuerungen sollen Kraft an Spitze führen","summary_no":"Nye grep og endringer skal bidra til å bringe Kraft til topplasseringer i alpinsporten.","spik_no":"Stefan Kraft går inn i sin 15. verdenscupseong med ny teknikk og nytt skiutstyr etter en skuffende olympisk sesong. Den 33 år gamle østerrikeren, som er tredobbelt verdensmester og tidligere vinner av verdenscupen sammenlagt, brukte sommeren på intensive treningstester og vindtunnelarbeid. Han har erkjent at det snek seg inn feil i hoppingen de siste to årene, men er nå optimistisk etter at fysiske tester viser bedre resultater enn på lenge. Kraft har uttalt at han sikter mot å fortsette frem til vinter-OL i 2030.","url":"https://sport.orf.at/stories/3164080/","pub_date":"2026-11-02T19:30:40.000Z","fetched_at":"2026-11-02 19:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":91335,"source_name":"Neveitalia","country":"ITA","title_no":"Fem dager i Val Senales for de italienske Europa Cup-kvinnene","title_orig":"Cinque giorni in Val Senales per le azzurre del team Coppa Europa, da Bieler e Mathiou a Pomaré e D'Antonio","summary_no":"Det italienske Europa Cup-laget for kvinner gjennomfører en fem dagers treningssamling i Val Senales, med utøvere som Bieler, Mathiou, Pomaré og D'Antonio.","spik_no":"Det italienske Europa Cup-laget for kvinner gjennomfører en fem dagers treningssamling på isbreen i Val Senales i Sør-Tirol, fra 3. til 7. november. Åtte utøvere er kalt inn av teknisk direktør Gianluca Rulfi, blant dem Tatum Bieler og Sophie Mathiou, som nettopp deltok i sesongåpningen i Sölden. Giada D'Antonio og Ambra Pomaré er også med, men som en del av rehabiliteringen etter skader — Alessia Guerinoni er i en lignende situasjon, nesten ett år etter sin ulykke. Val Senales er et populært treningssted for alpinister tidlig i sesongen takket være høydeisbreen som gir snøsikre forhold allerede i oktober og november.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/cinque-giorni-in-val-senales-per-le-azzurre-del-team-coppa-europa-da-bieler-e-mathiou-a-pomare-e-d-antonio","pub_date":"2026-11-02T17:05:00.000Z","fetched_at":"2026-11-02 17:15:01","lang_orig":"it","category":null,"athletes":"Ambra Pomaré","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":91299,"source_name":"Sportschau","country":"GER","title_no":"To år etter skrekkfallet – Sarrazin klar for comeback","title_orig":"Zwei Jahre nach Horror-Sturz - Sarrazin vor Rückkehr","summary_no":"To år etter et alvorlig fall er Alexis Sarrazin klar for å gjøre comeback i alpinsporten.","spik_no":"To år etter det dramatiske fallet i Bormio er franske Cyprien Sarrazin klar for å returnere til verdenscupen. Den 32 år gamle franskmannen pådro seg alvorlige hodeskader under en treningskjøring på Stelvio-løypa 27. desember 2024, men slapp unna varige hjerne- eller nevrologiske skader. Han var med på det franske treningsleiret i Argentina i september, og sikter nå mot åpningsrennene i USA i slutten av november og begynnelsen av desember. Sarrazin understreker at han vil avgjøre kvelden før hvert renn om han er klar nok til å starte.","url":"https://www.sportschau.de/wintersport/ski-alpin/zwei-jahre-nach-horror-sturz-sarrazin-vor-rueckkehr,ski-alpin-sarrazin-comeback-100.html","pub_date":"2026-11-02T16:46:20.000Z","fetched_at":"2026-11-02 17:00:05","lang_orig":"de","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":91055,"source_name":"ORF Sport","country":"AUT","title_no":"Sarrazin sikter mot comeback i Copper Mountain","title_orig":"Sarrazin peilt Comeback in Copper Mountain an","summary_no":"Cyprien Sarrazin planlegger å gjøre comeback i Copper Mountain etter en periode utenfor konkurransesirkusen.","spik_no":"Cyprien Sarrazin planlegger comeback i Copper Mountain i slutten av november, to år etter at han pådro seg alvorlige hodeskader i et treningsfall i Bormio i desember 2024. 32-åringen lå flere dager i koma etter ulykken på Stelvio-bakken og har vært borte fra konkurransesirkuset siden. Treningssamling i Argentina har gitt ham tro på at kroppen er klar, og han er «ganske optimistisk» med tanke på å stille i super-G og storslalåm i Copper Mountain — og eventuelt utfor i Beaver Creek uken etter. Sarrazin var i storform sesongene før ulykken og vant blant annet to verdenscupnedrenn i Bormio i januar 2024.","url":"https://sport.orf.at/stories/3164395/","pub_date":"2026-11-02T16:30:24.000Z","fetched_at":"2026-11-02 16:45:04","lang_orig":"de","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":90846,"source_name":"Neveitalia","country":"ITA","title_no":"Sarrazin er tilbake: – 99 prosent sikker på start i Copper etter 701 dager","title_orig":"Sarrazin sta tornando, lo start a Copper ormai è certo dopo 701 giorni: \"Al 99% ci sarò, sta funzionando tutto al meglio\"","summary_no":"Cyprien Sarrazin bekrefter at han er klar for comeback i Copper Mountain etter 701 dagers fravær, og melder at alt fungerer optimalt.","spik_no":"Cyprien Sarrazin bekrefter at han er 99 prosent sikker på å stille til start i super-G i Copper Mountain 28. november – etter 701 dager borte fra verdenscupen. Den franske fartsspesialisten pådro seg alvorlige hodeskader i et stygt fall under utfortreningen i Bormio i desember 2023, og var nær ved å miste livet. Sarrazin var i storform før ulykken og vant begge utforrennene i Kitzbühel i januar 2024. Treningskjøringen i Val Senales den siste uken skal ifølge ham selv ha gitt svært gode tider og riktige følelser foran comebacket.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/sarrazin-sta-tornando-lo-start-a-copper-ormai-e-certo-dopo-701-giorni-al-99-ci-saro-sta-funzionando-tutto-al-meglio","pub_date":"2026-11-02T16:15:00.000Z","fetched_at":"2026-11-02 16:30:03","lang_orig":"it","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":90053,"source_name":"Neveitalia","country":"ITA","title_no":"Federica Brignone forlater C.S. Carabinieri og returnerer til Sci Club Courmayeur","title_orig":"Federica Brignone saluta il C.S. Carabinieri: \"Ho deciso di congedarmi e tornerò in pista con lo Sci Club Courmayeur\"","summary_no":"Federica Brignone har besluttet å ta avskjed fra C.S. Carabinieri og vil heretter konkurrere under Sci Club Courmayeur.","spik_no":"Federica Brignone forlater C.S. Carabinieri og vil fra sesongen 2026/27 konkurrere under Sci Club Courmayeur – klubben hun vokste opp med i Valle d'Aosta. Den 34 år gamle italieneren er en av de største alpinistene i historien, med to olympiske gull, og ble så sent som i desember forfremmet til grad av «Maresciallo» i Carabinieri for sine sportslige meritter. Brignone er fortsatt i rehabilitering etter operasjon, men markerer nå et symbolsk skifte mot karrierens sluttfase ved å returnere til røttene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/federica-brignone-saluta-il-cs-carabinieri- iv spiller en viktig rolle for utøvere uten store nasjonale forbund i ryggen.","url":"https://skiracing.com/someone-in-your-corner-inside-world-cup-dreams-mentorship-program/","pub_date":"2026-11-02T13:44:15.000Z","fetched_at":"2026-11-02 14:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":89467,"source_name":"Neveitalia","country":"ITA","title_no":"Italienske utforskjørere trener i Pitztal frem til fredag","title_orig":"C'è Pitztal nel menu dei discesisti azzurri: fino a venerdì Casse, Franzoni e soci in allenamento sulle nevi austriache","summary_no":"Casse, Franzoni og resten av det italienske utforlaget er i Pitztal i Østerrike for treningssamling frem til fredag.","spik_no":"Det italienske utforlaget, med Mattia Casse og Giovanni Franzoni i spissen, er samlet til treningsleir i Pitztal i Østerrike frem til fredag. Pitztal-breen er et populært treningsområde tidlig i sesongen og brukes av flere nasjoner for å bygge form og teknisk grunnlag før Verdenscupåpningen. Italia har de siste sesongene utviklet seg til en solid utfernasjon, og Casse er blant de mest erfarne løperne i den fartsdominerte disiplinen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/c-e-pitztal-nel-menu-dei-discesisti-azzurri-fino-a-venerdi-casse-franzoni-e-soci-in-allenamento-sulle-nevi-austriache","pub_date":"2026-11-02T13:25:00.000Z","fetched_at":"2026-11-02 14:15:02","lang_orig":"it","category":null,"athletes":"Giovanni Franzoni","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":89468,"source_name":"Neveitalia","country":"ITA","title_no":"Kan Cochran-Siegle bli sesongens store overraskelse?","title_orig":"\"RCS\" può fare saltare il banco? Cochran-Siegle punta ad una gran stagione, per tanti motivi ora è un atleta ritrovato e... pericolosissimo","summary_no":"Ryan Cochran-Siegle sikter mot en sterk sesong og beskrives som en farlig utfordrer etter å ha funnet tilbake til toppformen.","spik_no":"Amerikaneren Ryan Cochran-Siegle blir fremhevet som en av sesongenes potensielle store overraskelser etter å ha jobbet seg tilbake til toppform. Han vant sin eneste verdenscupseier i super-G i Bormio i desember 2020 og tok VM-sølv i super-G i Cortina 2021, men har siden slitt med skader som har begrenset resultatene. Med fornyet selvtillit beskrives 34-åringen nå som en farlig utfordrer i de raske disiplinene.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/rcs-puo-fare-saltare-il-banco-cochran-siegle-punta-ad-una-gran-stagione-per-tanti-motivi-ora-e-un-atleta-ritrovato-e-pericolosi","pub_date":"2026-11-02T11:00:00.000Z","fetched_at":"2026-11-02 14:15:02","lang_orig":"it","category":null,"athletes":"Ryan Cochran-Siegle","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":89483,"source_name":"SkinEWS","country":"SUI","title_no":"Ytterligere tre utøvere slutter etter sesongen 2025/26","title_orig":"Auch dieses Trio tritt 2026/27 nicht mehr an","summary_no":"Også dette trioen vil ikke fortsette konkurransekarrieren fra og med sesongen 2026/27.","spik_no":"Tre alpinister avslutter karrieren etter sesongen 2025/26: latviske Liene Bondare og de britiske søsknene Charlotte og Robert Holmes. Robert Holmes, som fyller 25 år i 2026, deltok på Ungdoms-OL i Sveits i 2020, men har aldri slått gjennom på øverste nivå i verdenscupen. Alle tre beskrives som utøvere som har viet seg fullt til alpinsporten, men uten å ha nådd den store offentlige oppmerksomheten.","url":"https://www.skinews.ch/news/2026/dieses-tritt-nicht/","pub_date":"2026-11-02T08:23:29.000Z","fetched_at":"2026-11-02 14:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":84412,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrikske alpinister holder kontakten med toppen","title_orig":"Austrianerinnen halten Anschluss an Spitze","summary_no":"De østerrikske alpinistinnene holder seg i nærheten av
