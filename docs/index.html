<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>
    <div class="season" id="season-badge"></div>
    <span class="readonly-badge">👁 Lesevisning</span>
    <span class="updated">Oppdatert 20.11., 12:00</span>
  </div>
  <div class="filter-rows"><div class="filter-row" id="cat-row"></div></div>
  <div class="search-row">
    <input class="search-input" type="search" id="search" placeholder="Søk i titler, utøvere…">
    <select class="athlete-select" id="country-select"><option value="">Alle land</option></select>
    <select class="athlete-select" id="athlete-select"><option value="">Alle utøvere</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="main">
  <div id="feed"></div>
  <div class="sidebar">
    <div class="section-label" id="spik-label">Spik-liste</div>
    <div id="spik-list"></div>
  </div>
</div>

<script>
const CATS = [{"id":"viktig","label":"⚡ Viktig"},{"id":"sportslig","label":"🎿 Sportslig"},{"id":"nyheter","label":"📰 Nyhet"},{"id":"goy","label":"😄 Gøy"},{"id":"nerding","label":"🔬 Nerding"},{"id":"kjendis","label":"🌟 Kjendis"},{"id":"naert","label":"🤝 Nært og nyttig"}];
const ARTICLES = [{"id":195707,"source_name":"SkinEWS","country":"SUI","title_no":"Oscar Heine overtar Manuel Fellers startplass i Gurgl","title_orig":"Oscar Heine übernimmt den Gurgl-Startplatz von Manuel Feller","summary_no":"Oscar Heine rykker inn og overtar startplassen til Manuel Feller i alpinrennet i Gurgl.","spik_no":"Manuel Feller er ikke klar for start i hjemmerennet i Gurgl, og Oscar Heine rykker inn på det østerrikske slalåmlaget. 34 år gamle Feller fra Tirol gjennomførte riktignok trening fredag, men var ikke fornøyd med resultatet og valgte å stå over. Feller er en av Østerrikes mest profilerte slalåmkjørere og har vunnet flere verdenscuprenner, så fraværet hans i et hjemmerenn er et merkbart tap for vertsnasjonens lag.","url":"https://www.skinews.ch/news/2026/uebernimmt-startplatz-manuel/","pub_date":"2026-11-20T09:55:56.000Z","fetched_at":"2026-11-20 10:00:03","lang_orig":"de","category":null,"athletes":"Manuel Feller,Oscar Heine","athlete_nations":["AUT","GER"],"also_sources":[],"norwegian":false},{"id":195590,"source_name":"ORF Sport","country":"AUT","title_no":"Feller avstår fra hjemslalåmen","title_orig":"Feller verzichtet auf Heimslalom","summary_no":"Manuel Feller har valgt å ikke stille til start i hjemslalåmen.","spik_no":"Manuel Feller avstår fra helgens hjemslalåm i Gurgl etter at treningskjøringene fredag ikke ga tilstrekkelig trygghet – østerrikeren sier selv at han bare er «ved 85 prosent». Den 34 år gamle tiroleren har vært plaget av kroniske rygg- og skiveproblemer over lengre tid og måtte av samme grunn også melde forfall til saisongsåpningen i Levi. Feller vant sammenlagtcupen i slalåm sesongen 2023/24 og planlegger nå comebacken til herreslalåmen i Val d'Isère 13. desember.","url":"https://sport.orf.at/stories/3165167/","pub_date":"2026-11-20T09:43:44.000Z","fetched_at":"2026-11-20 09:45:04","lang_orig":"de","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":195534,"source_name":"Neveitalia","country":"ITA","title_no":"Feller bekrefter fravær i Gurgl – Vinatzer starter søndag","title_orig":"Ufficiale il \"no\" di Feller allo slalom di Gurgl dopo l'ultimo test: Vinatzer domenica partirà nei 15","summary_no":"Det er offisielt at Feller ikke deltar i slalåmen i Gurgl etter siste test. Vinatzer vil søndag starte blant de 15 første.","spik_no":"Det er nå offisielt bekreftet at Manuel Feller ikke stiller i søndagens herreslalåm i Gurgl, etter at en siste test på hjemmesnøen ikke overbevisste ham om at han er klar. Feller vant nettopp på Kirchenkar-løypen i Gurgl da rennet ble arrangert for første gang i 2023, noe som gjør fraværet ekstra bittert. I hans sted er unggutten Oscar Heine bekreftet på startlisten, han som allerede debuterte i Levi. For italiensk del er nyheten at Alex Vinatzer vil starte blant de 15 første søndag.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/ufficiale-il-no-di-feller-allo-slalom-di-gurgl-dopo-l-ultimo-test-vinatzer-domenica-partira-nei-15","pub_date":"2026-11-20T09:35:00.000Z","fetched_at":"2026-11-20 09:45:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Manuel Feller","athlete_nations":["AUT","ITA"],"also_sources":[],"norwegian":false},{"id":195358,"source_name":"Neveitalia","country":"ITA","title_no":"Tøffe forhold i Gurgl – bedring ventet til morgendagens slalåm","title_orig":"A Gurgl condizioni toste, ma per lo slalom di domani in miglioramento. La vigilia delle big","summary_no":"Forholdene i Gurgl er krevende, men det ventes bedring til slalåmrennet som arrangeres fredag. Favorittene er i gang med forberedelsene.","spik_no":"Forholdene i den østerrikske landsbyen Gurgl er krevende foran helgens slalåmrenn, men bedring ventes til fredag. Gurgl har vært en relativt ny destinasjon på verdenscupkalenderen og arrangerer renn på høy høyde i Ötztal-alpene, noe som kan gi ustabilt vær tidlig i sesongen. Rennledelsen og favorittene er likevel i gang med forberedelsene, og forholdene er ventet å stabilisere seg til konkurransen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/a-gurgl-condizioni-toste-ma-per-lo-slalom-di-domani-in-miglioramento-la-vigilia-delle-big","pub_date":"2026-11-20T08:40:00.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":195360,"source_name":"Neveitalia","country":"ITA","title_no":"Tommaso Sala operert i høyre kne – kan nå planlegge ny rehabiliteringsplan","title_orig":"Intervento al ginocchio destro effettuato, Tommaso Sala può pensare ad un nuovo percorso di recupero","summary_no":"Tommaso Sala har gjennomgått en operasjon på høyre kne og kan nå se fremover mot en ny restitusjonsprosess.","spik_no":"Den italienske slalåmkjøreren Tommaso Sala har gjennomgått en operasjon på høyre kne og kan nå legge en plan for rehabiliteringen. Sala har vært en del av det italienske landslaget og har hentet resultater i verdenscupen i tekniske disipliner, men har slitt med skader som har hindret kontinuitet i karrieren. En vellykket operasjon er første steg, men veien tilbake til konkurransenivå vil kreve flere måneder med systematisk opptrening.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/intervento-al-ginocchio-destro-effettuato-tommaso-sala-puo-pensare-ad-un-nuovo-percorso-di-recupero","pub_date":"2026-11-20T07:15:00.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"it","category":null,"athletes":"Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":195337,"source_name":"Ski Racing","country":"INT","title_no":"Vinterens fokus: Hvordan en alpinski-skole hjalp to utøvere til college-skiing","title_orig":"Winter in Focus: How Winter Sports School Helped Two Racers Reach College Skiing","summary_no":"To unge alpinister forteller hvordan en vinterskole for vintersport hjalp dem å nå college-nivå i alpint.","spik_no":"To unge alpinister forteller hvordan en vinterskole med spesialisert alpintrening hjalp dem å nå college-nivå i USA. College-skiing er en viktig utviklingsarena i Nord-Amerika, der universiteter rekrutterer lovende utøvere og tilbyr dem strukturert trening kombinert med utdanning. For mange unge alpinister utenfor den tradisjonelle verdenscupbanen er dette en alternativ vei til toppidrett.","url":"https://skiracing.com/winter-in-focus-how-winter-sports-school-helped-two-racers-reach-college-skiing/","pub_date":"2026-11-19T22:30:30.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":194719,"source_name":"SVT Sport","country":"SWE","title_no":"Gjennombrudd for Eddie Genborg med imponerende seier","title_orig":"Islossning för Eddie Genborg i mäktig kross","summary_no":"Eddie Genborg opplevde endelig gjennombrudd med en stor og imponerende seier i alpint.","spik_no":"Artikkelen handler ikke om alpint, men om ishockey: 19 år gamle Eddie Genborg scoret hattrick og leverte totalt fem poeng da Timrå slo Örebro 8–2 i SHL. Genborg, som er draftet av Detroit Red Wings, var med på å vinne junior-VM-gull for Sverige forrige sesong og ventes å spille en sentral rolle i årets junior-VM. Gjennombruddet kommer etter at han innledet sesongen skadet.","url":"https://www.svt.se/sport/ishockey/islossning-for-eddie-genborg-i-maktig-kross","pub_date":"2026-11-19T20:56:43.000Z","fetched_at":"2026-11-19 21:00:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":193038,"source_name":"Neveitalia","country":"ITA","title_no":"Killington bekreftet: Kvinnekonkurranser tilbake på «Superstar»","title_orig":"Killington ok, ufficiale la conferma delle gare femminili sulla \"Superstar\" due anni dopo l'ultima volta","summary_no":"Det er offisielt bekreftet at de kvinnelige alpinrennene vender tilbake til Killington-bakken «Superstar», to år etter sist gang rennene ble arrangert der.","spik_no":"Killington i Vermont er offisielt bekreftet som vertskap for to kvinnekonkurranser i alpint – storslalåm og slalåm – helgen 28.–29. november. Det er første gang rennene arrangeres på «Superstar»-bakken siden 2024, da konkurransen ble preget av Mikaela Shiffrin-dramaet, mens svenske Sara Hector vant storslalåmen og sveitsiske Camille Rast tok sin første seier i slalåmen dagen etter. Killington har vært en av de mest populære stoppene på verdenscupen de siste årene, med stort publikumsoppmøte og en særegen feststemning på østkysten av USA.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/killington-ok-ufficiale-la-conferma-delle-gare-femminili-sulla-superstar-due-anni-dopo-l-ultima-volta","pub_date":"2026-11-19T18:40:00.000Z","fetched_at":"2026-11-19 18:45:03","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":191434,"source_name":"Neveitalia","country":"ITA","title_no":"Mélanie Meillard operert i høyre kne: – Nå begynner arbeidet","title_orig":"Mélanie Meillard operata al ginocchio destro, la ripartenza da zero per tornare ancora: \"Ora comincia il lavoro\"","summary_no":"Mélanie Meillard har gjennomgått en operasjon i høyre kne og starter rehabiliteringen fra scratch. – Nå begynner arbeidet, sier hun.","spik_no":"Sveitsiske Mélanie Meillard er operert i høyre kne etter at hun pådro seg brudd på korsbåndet og skader i meniskene under trening i Levi, bare timer før sesongåpningen i verdenscupen. 28-åringen starter nå rehabiliteringen fra null og har allerede varslet at hun mister ski-VM hjemme i Sveits. Meillard, som er spesialist i tekniske disipliner og tidligere har kjempet i toppen av verdenscupen i slalåm og storslalåm, sikter mot comeback til sesongen 2027/28. – Nå begynner arbeidet, sier hun selv.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/melanie-meillard-operata-al-ginocchio-destro-la-ripartenza-da-zero-per-tornare-ancora-ora-comincia-il-lavoro","pub_date":"2026-11-19T16:20:00.000Z","fetched_at":"2026-11-19 16:30:02","lang_orig":"it","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":190442,"source_name":"SVT Sport","country":"SWE","title_no":"Se klassiske bilder fra Sverigepremiären i 1985","title_orig":"Se klassiska bilderna från Sverigepremiären 1985","summary_no":"Et tilbakeblikk på klassiske bilder fra Sveriges alpinpremiere i 1985.","spik_no":"SVT Sport har gravd frem arkivbilder fra den svenske langrennssesongens åpning i Bruksvallarna i 1985. Bildene viser blant annet Gunde Svan som sjokkerer omgivelsene med et par gigantiske staver, og temperaturen var høy rundt den nye teknikken som skapte splittelse i skisportmiljøet. Svan var på denne tiden en av verdens dominerende langrennsløpere og vant fire OL-gull i karrieren. Sakens innhold er langrenn, ikke alpin, og det finnes lite alpint stoff å arbeide ut fra her.","url":"https://www.svt.se/sport/langdskidor/se-klassiska-bilderna-fran-sverigepremiaren-1985","pub_date":"2026-11-19T15:17:26.000Z","fetched_at":"2026-11-19 15:21:56","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":190192,"source_name":"Neveitalia","country":"ITA","title_no":"FIS NJR åpnet i Solden med storslalåm – Girtler og Rifesser i italiensk form","title_orig":"A Solda l'apertura FIS NJR con i giganti e timbri azzurri di Girtler e Rifesser: ora gli slalom","summary_no":"FIS NJR-sesongen åpnet i Solden med storslalåmrenn, der italienske utøvere Girtler og Rifesser markerte seg. Neste på programmet er slalåmrennene.","spik_no":"FIS NJR-sesongen åpnet i Solden (Sulden) med storslalåmrenn på Kanzel-løypen på Ortles-Cevedale-breen, der sørtyrolske utøvere satte sitt preg på åpningshelgen. Leonie Girtler, født 2006 og fra Sør-Tirol, vant damefeltet med 26 hundredelers margin foran slovakiske Tamara Dorkova, mens herrenes første renn gikk til norske Fredrik Andersen. FIS NJR (Nations Junior Ranking) er en viktig juniorturneringsserie i alpint, og åpningen i Solden er regnet som en klassiker på den internasjonale juniorkalenderen. Neste ut er slalåmrennene som avslutter den firetagers samlingen.","url":"https://www.neveitalia.it/sport/scialpino/news/a-solda-l-apertura-fis-njr-con-i-giganti-e-timbri-azzurri-di-girtler-e-rifesser-ora-gli-slalom","pub_date":"2026-11-19T15:10:00.000Z","fetched_at":"2026-11-19 15:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":186114,"source_name":"Neveitalia","country":"ITA","title_no":"Slovenia stiller med tre utøvere i Gurgl til lørdagens slalåm","title_orig":"La Slovenia con un terzetto a Gurgl: Neja Dvornik, positiva a Levi, con Slokar e Tomsic per lo slalom di sabato","summary_no":"Slovenia stiller med Neja Dvornik, som imponerte i Levi, samt Slokar og Tomsic til slalåmrennet i Gurgl lørdag.","spik_no":"Slovenia stiller med tre utøvere i slalåmrennet i Gurgl lørdag: Neja Dvornik, Andreja Slokar og Ana Tomsic. Dvornik, født 2001, imponerte i Levi og er tilbake på den samme pisten i Gurgl der hun skadet seg under oppvarmingen for et år siden. Slokar er i retur etter skade og rykket ut i første omgang i Levi, mens hun fortsatt starter fra en utvidet andregruppa. Caterina Sinigoi og Anja Oplotnik er ikke med til Østerrike denne helgen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/la-slovenia-con-un-terzetto-a-gurgl-neja-dvornik-positiva-a-levi-con-slokar-e-tomsic-per-lo-slalom-di-sabato","pub_date":"2026-11-19T10:20:00.000Z","fetched_at":"2026-11-19 10:30:04","lang_orig":"it","category":null,"athletes":"Andreja Slokar,Neja Dvornik","athlete_nations":["SLO"],"also_sources":[],"norwegian":false},{"id":184229,"source_name":"Neveitalia","country":"ITA","title_no":"Phenix lanserer replika av Sveriges VM-drakt","title_orig":"Phenix, dalla Coppa del Mondo alle piste di casa: ecco la replica della divisa svedese","summary_no":"Phenix gjør den svenske alpinlandslags-drakten fra verdenscupen tilgjengelig for vanlige skiløpere, slik at fansen kan kle seg som sine favoritter på hjemmebakken.","spik_no":"Phenix lanserer en publikumsversjon av det svenske alpinlandslagets offisielle drakt for sesongen 2026/27, kalt Svezia AW26-kolleksjonen. Drakten er designet etter plaggene som brukes av blant andre Sara Hector og resten av det svenske landslaget i verdenscupen. En av nyhetene er det såkalte WIRE Ventilation System, der glidelåsene er flyttet til forsiden slik at luftsirkulasjonen kan reguleres uten å åpne drakten helt. Phenix har vært offisiell leverandør for det svenske alpinlandslaget og er kjent for å kombinere konkurranseteknologi med produkter tilgjengelig for vanlige skiløpere.","url":"https://www.neveitalia.it/materiali/abbigliamento/news/phenix-dalla-coppa-del-mondo-alle-piste-di-casa-ecco-la-replica-della-divisa-svedese","pub_date":"2026-11-19T07:56:35.000Z","fetched_at":"2026-11-19 08:00:03","lang_orig":"it","category":"goy","athletes":"Sara Hector","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":184053,"source_name":"Neveitalia","country":"ITA","title_no":"To dager til Gurgl, mens Shiffrin trener slalåm med Killington i tankene","title_orig":"Due giorni a Gurgl, e intanto Shiffrin torna a fare slalom a Copper pensando a Killington. E in super-g...","summary_no":"Mikaela Shiffrin er tilbake på slalåmtrening i Copper Mountain med tanke på Killington, mens rennkalenderen nærmer seg Gurgl om to dager.","spik_no":"Mikaela Shiffrin er tilbake på slalåmtrening i Copper Mountain i Colorado og satser på Killington som sitt sesongdebut i disiplinen – ikke Gurgl, som arrangerer verdenscupslalåm om to dager. Shiffrin har dominert Gurgl totalt og vunnet begge ganger løpet har vært arrangert for kvinner. I Colorado trener hun på tre disipliner samtidig, og forteller smilende at hun nylig gjennomførte skikkelig super-G-trening med hopp på 35–40 meter – noe hun ikke har gjort på fire år. Killington, der hun er en stor publikumsfavoritt, er ventet å bli hennes første slalåmstart denne sesongen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/due-giorni-a-gurgl-e-intanto-shiffrin-torna-a-fare-slalom-a-copper-pensando-a-killington-e-in-super-g","pub_date":"2026-11-19T07:20:00.000Z","fetched_at":"2026-11-19 07:47:22","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":181420,"source_name":"Ski Racing","country":"INT","title_no":"Fra skistøvelinnlegg til sikkerhetsputer: LISKI ser på utstyrets neste liv","title_orig":"From Ski Boot Liners to Safety Padding, LISKI Looks at Equipment’s Next Life","summary_no":"LISKI undersøker hvordan alpint utstyr som skistøvelinnlegg og sikkerhetsputer kan få et nytt liv etter endt bruk.","spik_no":"Italienske LISKI, en av verdens ledende produsenter av alpinsikringsutstyr, undersøker hvordan brukt alpinutstyr kan få nytt liv fremfor å kastes. I samarbeid med Tecnica Group og resirkuleringsselskapet ReMat har de utviklet produktet Greenmat, der materiale fra utslitte skistøvelinnlegg brukes i beskyttelsesputer langs løypene. Prosjektet er en del av en bredere innsats for å redusere avfall i produksjon og transport av sikringsutstyr. Utfordringen er at skistøvelinnlegg består av ulike skumtyper, tekstiler og lim, noe som gjør resirkulering teknisk krevende.","url":"https://skiracing.com/from-ski-boot-liners-to-safety-padding-liski-looks-at-equipments-next-life/","pub_date":"2026-11-18T18:39:53.000Z","fetched_at":"2026-11-18 18:45:03","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":180229,"source_name":"Neveitalia","country":"ITA","title_no":"Kan vi tro på en «ny» Vinatzer? Storslalåmrennene i Colorado kan gi svarene","title_orig":"Si può credere in un \"nuovo\" Vinatzer? Sì, con i giganti in Colorado (dove fece benissimo nel 2025) che daranno tante risposte","summary_no":"Alex Vinatzer har muligheten til å bevise sitt potensial under storslalåmrennene i Colorado, der han presterte sterkt i 2025.","spik_no":"Alex Vinatzer fra Gröden har aldri vunnet et verdenscuprenn, men han nærmet seg gjentatte ganger i 2025 — ni hundredeler bak Noel i slalåm i Kitzbühel og andreplass i storslalåm i Beaver Creek, bak Marco Odermatt. Den 27 år gamle italieneren imponerte i Levi i åpningshelgen med en av karrierens beste omganger, og Colorado-rennene i Copper Mountain og Beaver Creek ses nå som en viktig lakmustest på om han endelig har funnet den tekniske stabiliteten som tidligere har sviktet. Dette er den niende sesongen hans i verdenscupen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/si-puo-credere-in-un-nuovo-vinatzer-si-con-i-giganti-in-colorado-dove-fece-benissimo-nel-2025-che-daranno-tante-risposte","pub_date":"2026-11-18T16:55:00.000Z","fetched_at":"2026-11-18 17:00:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":180209,"source_name":"Ski Racing","country":"INT","title_no":"FIS' sikkerhetskode for skitrening: 10 viktige punkter for trenere","title_orig":"FIS Ski Training Safety Code: 10 Takeaways for Coaches","summary_no":"FIS har utarbeidet en sikkerhetskode for skitrening, og her er de ti viktigste punktene alle trenere bør kjenne til.","spik_no":"FIS lanserte 18. november 2026 en frivillig sikkerhetskode for trening på snø, med ti anbefalinger rettet mot trenere, lag, utøvere og skianlegg. Koden tar blant annet for seg hvem som kan stanse et løyp, hvordan nødsituasjoner koordineres fra start, og krav til daglig sjekk av sikkerhetsinstallasjoner. Bakgrunnen er behovet for felles retningslinjer når flere lag deler samme bakke, noe som er vanlig i treningsleirer og i forkant av verdenscuprenn. Koden gjelder på alle nivåer, fra klubbtrening til internasjonale konkurranser.","url":"https://skiracing.com/fis-ski-training-safety-code-10-takeaways-for-coaches/","pub_date":"2026-11-18T16:50:08.000Z","fetched_at":"2026-11-18 17:00:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":179572,"source_name":"Neveitalia","country":"ITA","title_no":"Deromedis og co. samles i Livigno – Val Thorens åpner cupen i desember","title_orig":"Deromedis, Tomasoni, Galli & Co., si torna a Livigno per il prossimo raduno: dall'8 all'11 dicembre Val Thorens per il via di coppa","summary_no":"Det italienske landslaget returnerer til Livigno for neste samling, før verdenscupen sparkes i gang i Val Thorens fra 8. til 11. desember.","spik_no":"Det italienske skicross-landslaget, med profiler som Dominik Deromedis, Jole Galli og Davide Tomasoni, samles i Livigno fra 21. til 25. november som siste forberedelse før sesongstart. Laget har allerede gjennomført treningsleir i Chile i september og treninger på Stelvio og Val Senales. Verdenscupen åpner i Val Thorens 8.–11. desember, en tradisjonell åpningsarena for skicross med doble renn. Deromedis er regjerende verdensmester og en av de fremste skicross-utøverne i verden, og mye oppmerksomhet vil naturlig nok rettes mot ham når cupen starter.","url":"https://www.neveitalia.it/freestyle/news/deromedis-tomasoni-galli-co-si-torna-a-livigno-per-il-prossimo-raduno-dall-8-all-11-dicembre-val-thorens-per-il-via-di-coppa","pub_date":"2026-11-18T15:55:00.000Z","fetched_at":"2026-11-18 16:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178591,"source_name":"Neveitalia","country":"ITA","title_no":"Ambisiøst italiensk slalåmlag til Europacupen","title_orig":"Da Sola a Mathiou, da Carolli a Bieler, sarà ambiziosa l'Italslalom di Coppa Europa. D'Antonio non gareggerà","summary_no":"Italia stiller med et ambisiøst slalåmlag i Europacupen, men D'Antonio er ikke med.","spik_no":"Italia stiller med et ambisiøst slalåmlag i Europacupen, selv om D'Antonio ikke er med i troppen. Europacupen fungerer som det viktigste steget mellom FIS-renn og Verdenscup, og er en sentral arena for utvikling av neste generasjons alpinister. Italia har tradisjonelt hatt sterke slalåmkjørere og bruker Europacupen aktivt til å modne talenter mot Verdenscupnivå.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/da-sola-a-mathiou-da-carolli-a-bieler-sara-ambiziosa-l-italslalom-di-coppa-europa-d-antonio-non-gareggera","pub_date":"2026-11-18T14:05:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178593,"source_name":"Neveitalia","country":"ITA","title_no":"Kranjska Gora i gang med kunstsnø – herrerenn åpner 2027-sesongen","title_orig":"Primo freddo e Kranjska Gora già lavora a tutta: neve artificiale sulla \"Podkoren-3\", le gare maschili apriranno il 2027","summary_no":"Kranjska Gora har startet snøproduksjon på Podkoren-3-løypen, og herrekonkurransene vil åpne sesongen i 2027.","spik_no":"Kranjska Gora er i gang med kunstsnøproduksjon på den klassiske Podkoren-3-løypen, og herrekonkurransene er satt til å åpne 2027-sesongen der. Den slovenske skibyen har lange tradisjoner som Verdenscup-arrangør, særlig kjent for Vitranc-rennet i storslalåm og slalåm. Kunstsnøanlegg er blitt avgjørende for å sikre tidlig sesongstart uavhengig av naturlige snøforhold.","url":"https://www.neveitalia.it/sport/scialpino/news/primo-freddo-e-kranjska-gora-gia-lavora-a-tutta-neve-artificiale-sulla-podkoren-3-le-gare-maschili-apriranno-il-2027","pub_date":"2026-11-18T13:05:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178595,"source_name":"Neveitalia","country":"ITA","title_no":"To tyske trioer i Gurgl – Aicher jakter ledelse i cupen","title_orig":"Due terzetti in casa Germania sulla \"Kirchenkar\": sabato a Gurgl il timone per Aicher che cerca l'allungo in coppa","summary_no":"Tyskland stiller med to trioer på Kirchenkar-løypen i Gurgl, der Aicher søker å øke ledelsen i Europacupen.","spik_no":"Tyskland stiller med to komplette trioer til slalåmrennet i Gurgl, der Fabian Aicher ønsker å befeste ledelsen sin i Europacup-sammendraget. Kirchenkar-løypen i Gurgl er kjent for tekniske utfordringer og har raskt blitt en populær arena siden den kom inn på Europacup-programmet. Aicher har vært en av de mest konstante tyske profilene i Europacupen og peker seg ut som en kandidat til Verdenscup-gjennombrudd.","url":"https://www.neveitalia.it/sport/scialpino/news/due-terzetti-in-casa-germania-sulla-kirchenkar-sabato-a-gurgl-il-timone-per-aicher-che-cerca-l-allungo-in-coppa","pub_date":"2026-11-18T11:40:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":178607,"source_name":"SkinEWS","country":"SUI","title_no":"Melanie Meillard skuffet over sin skjebne","title_orig":"Melanie Meillard hadert mit ihrem Schicksal","summary_no":"Den sveitsiske alpinisten Melanie Meillard sliter med å forsone seg med en vanskelig situasjon i karrieren sin.","spik_no":"Sveitsiske Melanie Meillard har pådratt seg et nytt korsbåndbrudd i forberedelsene til Verdenscup-slalåmen i Levi, og mister dermed hele 2026/27-sesongen. For 28-åringen fra Neuchâtel er det særlig bittert fordi hun også går glipp av VM på hjemmebane i Wallis. Meillard har slitt med alvorlige skader gjennom karrieren og er en kjent allrounder som tidligere har konkurrert i både slalåm og storslalåm på Verdenscup-nivå.","url":"https://www.skinews.ch/news/2026/melanie-meillard-schicksal/","pub_date":"2026-11-18T11:04:43.000Z","fetched_at":"2026-11-18 14:29:04","lang_orig":"de","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":178608,"source_name":"SkinEWS","country":"SUI","title_no":"Lena Dürr optimistisk foran slalåmen i Gurgl","title_orig":"Lena Dürrs Zuversicht im Hinblick auf den Gurgl-Slalom","summary_no":"Lena Dürr ser frem til slalåmrennet i Gurgl med stor optimisme.","spik_no":"Lena Dürr stiller optimistisk til start i slalåmrennet i Gurgl på Kirchenkar-løypen. Den tyske slalåmspesialisten har de siste sesongene etablert seg blant verdens beste i disiplinen og har flere pallplasseringer i Verdenscup. Gurgl har blitt en fast post på den tidlige delen av alpinkalenderen og gir utøverne mulighet til å bygge på resultater fra Levi-åpningen.","url":"https://www.skinews.ch/news/2026/duerrs-zuversicht-hinblick/","pub_date":"2026-11-18T10:35:41.000Z","fetched_at":"2026-11-18 14:29:04","lang_orig":"de","category":null,"athletes":"Lena Dürr","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":178598,"source_name":"Neveitalia","country":"ITA","title_no":"Kun sju nordmenn til Gurgl – Steen Olsen ikke med","title_orig":"Solo sette norge a Gurgl, con McGrath (qui due podi) per risalire assieme a Kristoffersen e Haugan. Non c'è Steen Olsen","summary_no":"Bare sju norske utøvere reiser til Gurgl, der McGrath tidligere har tatt to pallplasser. Kristoffersen og Haugan leder an, men Steen Olsen er ikke med.","spik_no":"Bare sju norske utøvere reiser til Gurgl for slalomrennene 21.–22. november, tre færre enn til åpningsrennene i Levi. Henrik Kristoffersen og Timon Haugan leder troppen, mens Mina Fuerst Holtmann er eneste norske kvinne. Alexander Steen Olsen er ikke med – han sto også over Levi og Sölden på grunn av fysiske problemer, og neste mål skal etter planen være storslalåmen i Copper Mountain 29. november. Aidan McGrath har to pallplasser fra Gurgl tidligere og er blant dem som reiser.","url":"https://www.neveitalia.it/sport/scialpino/news/solo-sette-norge-a-gurgl-con-mcgrath-qui-due-podi-per-risalire-assieme-a-kristoffersen-e-haugan-non-c-e-steen-olsen","pub_date":"2026-11-18T10:05:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":"Alexander Steen Olsen,Atle Lie McGrath,Henrik Kristoffersen,Mina Fürst Holtmann,Timon Haugan","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":178599,"source_name":"Neveitalia","country":"ITA","title_no":"Beaver Creek-rennene utsatt på grunn av snømangel","title_orig":"Beaver Creek e un posticipo necessario per salvarsi, c'è pochissima neve per le 7 gare sulla \"Birds of Prey\"","summary_no":"Det er svært lite snø ved Beaver Creek, og de planlagte sju rennene på «Birds of Prey»-løypa er utsatt for å redde arrangementet.","spik_no":"Rennene på den klassiske «Birds of Prey»-løypa i Beaver Creek er utsatt på grunn av kritisk lite snø i Colorado. FIS-tekniker Trinkl melder at det er enda dårligere snøforhold enn på samme tid i fjor, og forberedelsene av løypa er langt fra fullført. Val Gardena pekes ut som den primære reserveløsningen dersom Beaver Creek ikke blir klar i tide. Utøvere som Marco Odermatt har i mellomtiden valgt å bli i Sankt Moritz for å trene under bedre forhold.","url":"https://www.neveitalia.it/sport/scialpino/news/beaver-creek-e-un-posticipo-necessario-per-salvarsi-c-e-pochissima-neve-per-le-7-gare-sulla-birds-of-prey","pub_date":"2026-11-18T09:25:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":["ORF Sport"],"norwegian":false},{"id":178601,"source_name":"Neveitalia","country":"ITA","title_no":"Gurgl i toppform, men trues av super-G-renn på Rettenbach i Sölden","title_orig":"Gurgl prontissima in condizioni top, ma il futuro è in pericolo a causa di... Soelden: \"I super-g sul Rettenbach ci mettono a rischio\"","summary_no":"Gurgl er i utmerket stand og klar for renn, men arrangørene frykter at super-G-løpene på Rettenbachbreen i Sölden setter stedets fremtid i fare.","spik_no":"Gurgl og Kirchenkar-løypa er i strålende stand foran slalomrennene 21.–22. november, den fjerde gangen alpinverdenscupen besøker den lille tirolske landsbyen. Likevel bekymrer arrangørene seg for fremtiden: Alban Scheiber, leder for den lokale organisasjonskomiteen, advarer om at planene om å legge super-G-renn til Rettenbachbreen i Sölden kan tvinge Gurgl ut av Verdenscup-kalenderen. FIS har foreløpig ikke presentert en langsiktig kalenderplan som gir arrangørene forutsigbarhet utover ett år.","url":"https://www.neveitalia.it/sport/scialpino/news/gurgl-prontissima-in-condizioni-top-ma-il-futuro-e-in-pericolo-a-causa-di-soelden-i-super-g-sul-rettenbach-ci-mettono-a-rischio","pub_date":"2026-11-18T08:30:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178602,"source_name":"Neveitalia","country":"ITA","title_no":"Liensberger tilbake på ski – Courchevel mest aktuelt for comeback","title_orig":"Liensberger ancora sugli sci, ma il rientro è abbastanza lontano: Courchevel, a quasi un anno dal crac, l'ipotesi più concreta","summary_no":"Katharina Liensberger er tilbake på ski, men returen til konkurranser er fortsatt langt unna. Courchevel, nesten ett år etter skaden, er det mest realistiske målet.","spik_no":"Østerrikske Katharina Liensberger er tilbake på ski etter at hun pådro seg en alvorlig kneskade på trening 2. januar 2026. Liensberger, som er dobbelt verdensmester i slalåm fra Cortina 2021, trener nå på pistene i Mayrhofen i Zillertal og beskrives som i riktig retning – men comebacket er fortsatt langt unna. Nattslalåmen i Courchevel 22. desember, nesten ett år etter hennes siste konkurranse i Semmering, er det mest konkrete målet for retur til Verdenscupen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/liensberger-ancora-sugli-sci-ma-il-rientro-e-abbastanza-lontano-courchevel-a-quasi-un-anno-dal-crac-l-ipotesi-piu-concreta","pub_date":"2026-11-18T08:00:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":"Katharina Liensberger","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":178573,"source_name":"Ski Racing","country":"INT","title_no":"Den usynlige veggen: Om konkurranseangst i alpint","title_orig":"The Invisible Wall: Race-Day Anxiety in Ski Racing","summary_no":"En artikkel belyser fenomenet konkurranseangst blant alpinister og hvordan den mentale barrieren på renndagen kan påvirke prestasjoner.","spik_no":"En personlig artikkel i Ski Racing-magasinet setter søkelyset på konkurranseangst i alpint – den mentale barrieren mange utøvere møter i startboksen til tross for grundig forberedelse. Forfatteren, som har drevet med skiløp i tolv år, beskriver hvordan adrenalinet i startøyeblikket kan snu til lammende nervøsitet og forestillinger om feil – en tilstand han kaller «den usynlige veggen». Mentalt press og prestasjonsangst er et tema som har fått stadig mer oppmerksomhet i toppidretten, og i alpint er det særlig relevant gitt sportens krav til risikovillighet og konsentrasjon.","url":"https://skiracing.com/the-invisible-wall-race-day-anxiety-in-ski-racing/","pub_date":"2026-11-17T18:46:22.000Z","fetched_at":"2026-11-18 14:29:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178727,"source_name":"Sportschau","country":"GER","title_no":"Slalåm på grensen: «Alle er helt maxed out»","title_orig":"Slalom am Limit: \"Die sind alle so maxed out\"","summary_no":"Slalåmkjøringen er presset til det ytterste, og utøverne går på absolutt maksimalt nivå.","spik_no":"Slalåmsporten er blitt så jevn og ekstremdrevet at selv en 13.-plass til Linus Straßer i Levi ga grunnlag for refleksjon: «Nivået som vises her er rett og slett perverst», sa tyskeren etter åpningsrennet. I tolv slalåmrenn forrige sesong – inkludert OL – var det åtte forskjellige vinnere, et tall som illustrerer bredden i feltet. Tidligere slalåmkjører Sebastian Holzmann oppsummerer det slik: «Det er blitt et lotteri – alle er raske, det handler bare om hvem som gjør færrest feil.»","url":"https://www.sportschau.de/wintersport/ski-alpin/slalom-am-limit-die-sind-alle-so-maxxed-out,ski-alpin-slalom-am-limit-100.html","pub_date":"2026-11-17T17:27:32.000Z","fetched_at":"2026-11-18 14:29:07","lang_orig":"de","category":null,"athletes":"Linus Straßer","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":178237,"source_name":"Neveitalia","country":"ITA","title_no":"Valentina Greggio tilbake på snøtrening i Cervinia","title_orig":"Riprende la preparazione sulla neve di sua maestà Valentina Greggio: con Herin e Capello lavoro a Cervinia","summary_no":"Alpinstjernen Valentina Greggio har gjenopptatt snøtreningen i Cervinia sammen med trenerne Herin og Capello.","spik_no":"Valentina Greggio har gjenopptatt snøtreningen på Cervinia-breen i Aostadalen, denne gangen sammen med de mannlige landslagsløperne Joel Herin og Samuele Capello. Den italienske fartsstjernen fra Verbania, født i 1991, avsluttet forrige sesong med en fullstendig dominans: hun vant sin åttende verdenscup sammenlagt, forsvarte VM-tittelen i Vars og satte ny verdensrekord i april med 248,270 km/t. Treningsblokken på Cervinia-breen strekker seg over tre dager, fra 18. til 20. november.","url":"https://www.neveitalia.it/sport/speedskiing/news/riprende-la-preparazione-sulla-neve-di-sua-maesta-valentina-greggio-con-herin-e-capello-lavoro-a-cervinia","pub_date":"2026-11-17T13:55:00.000Z","fetched_at":"2026-11-17 14:00:01","lang_orig":"it","category":null,"athletes":"Valentina Greggio","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":177883,"source_name":"Neveitalia","country":"ITA","title_no":"To måneder til drømmetrilogien på Olympia delle Tofane: billetter til Cortina World Cup nå i salg","title_orig":"Due mesi al trittico da sogno sull'Olympia delle Tofane: da poche ore sono in vendita i biglietti per la Cortina World Cup","summary_no":"Det er to måneder til de etterlengtede verdenscuprennet i Cortina d'Ampezzo, og billettene ble lagt ut for salg for bare noen timer siden.","spik_no":"Billetter til verdenscuphelgen i Cortina d'Ampezzo 15.–17. januar 2027 er nå lagt ut for salg. Programmet på den klassiske Olympia delle Tofane-løypa består av to utforkjøringer og ett super-G for kvinner — et såkalt «trittico» eller trippel. Cortina er et av de mest tradisjonsrike stoppene på kvinnenes verdenscup i utfor, og løypa har vært arena i over 30 år. Neste sesongs renn kommer etter at Cortina nettopp var OL-arenaen for alpint under vinter-OL 2026.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/due-mesi-al-trittico-da-sogno-sull-olympia-delle-tofane-da-poche-ore-sono-in-vendita-i-biglietti-per-la-cortina-world-cup","pub_date":"2026-11-17T13:15:00.000Z","fetched_at":"2026-11-17 13:30:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":177529,"source_name":"Neveitalia","country":"ITA","title_no":"Seksten italienske alpinister trener i Copper – Shiffrin forkjølet på Speed Center","title_orig":"Prosegue a Copper il lavoro dei 16 azzurri impegnati e nello Speed Center c'è una Shiffrin raffreddata","summary_no":"Seksten italienske utøvere fortsetter treningsarbeidet i Copper, mens Mikaela Shiffrin dukket opp på Speed Center med forkjølelse.","spik_no":"Seksten italienske alpinister er i gang med treningsarbeid på Copper Mountain i Colorado, og gruppen vokser til 23 utøvere i løpet av uken når hastighetsgruppen under trener Johnny Feltrin ankommer fra Solda. Mikaela Shiffrin, som er regjerende verdenscupvinner og bor i nærheten, har trent på Speed Center til tross for en forkjølelse og beskriver arbeidsforholdene som fantastiske. De tolv italienske herrene er også i gang og skal debutere i verdenscupen på samme Copper Mountain 28. november. Blant damene som allerede trener er fartsspesialistene Sofia Goggia, Laura Pirovano og Marta Bassino.","url":"https://www.neveitalia.it/sport/scialpino/news/prosegue-a-copper-il-lavoro-dei-16-azzurri-impegnati-e-nello-speed-center-c-e-una-shiffrin-raffreddata","pub_date":"2026-11-17T12:45:00.000Z","fetched_at":"2026-11-17 13:00:02","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":177177,"source_name":"Neveitalia","country":"ITA","title_no":"Sesongen sparkes i gang i Solda onsdag: Livata arrangerer FIS NJR i skyggen av Ortles","title_orig":"A Solda scatta mercoledì la stagione su nevi italiane: il Livata organizza le FIS NJR all'ombra dell'Ortles","summary_no":"Sesongen på italiensk snø åpner i Solda onsdag, der Livata arrangerer FIS NJR-renn ved foten av Ortles.","spik_no":"Sesongåpningen på italiensk snø skjer i Solda onsdag, der Sci Club Livata arrangerer FIS NJR-renn i skyggen av Ortles-Cevedale-massivet. Totalt åtte renn fordelt over fire dager på pisten Kanzel – storslalåm onsdag og torsdag, slalåm fredag og lørdag – med deltakere fra hele Italia og internasjonalt. Arrangementet, kalt Trofeo Energiapura, har ifølge Livatas leder Franco Malci blitt en fast tradisjon som markerer starten på den tekniske konkurransesesongen. Solda på 1900 meters høyde i Sør-Tirol er et populært tidligsesong-arrangement nettopp fordi breene sikrer stabile snøforhold allerede i november.","url":"https://www.neveitalia.it/sport/scialpino/news/a-solda-scatta-mercoledi-la-stagione-su-nevi-italiane-il-livata-organizza-le-fis-njr-all-ombra-dell-ortles","pub_date":"2026-11-17T12:15:00.000Z","fetched_at":"2026-11-17 12:30:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":176649,"source_name":"Neveitalia","country":"ITA","title_no":"Manuel Feller åpner for deltakelse i Gurgl: «Bestemmer snart – trenger trening»","title_orig":"Manuel Feller lascia la porta aperta sulla presenza a Gurgl: \"Deciderà a breve, gli serve allenamento\"","summary_no":"Manuel Feller holder muligheten åpen for å stille til start i Gurgl, men understreker at han trenger mer trening før en endelig beslutning tas.","spik_no":"Manuel Feller holder muligheten åpen for å stille til start i slalåmrennet i Gurgl, men trenger mer trening før en endelig avgjørelse tas. Østerrikeren er i retur etter en ny rygkoperasjon og gikk glipp av åpningsrennet i Levi. Feller vant slalåmcupen sammenlagt i sesongen 2023/24 og tok seieren i Kitzbühel sist vinter, og er en nøkkelspiller i det østerrikske «Wunderteam». Avgjørelsen hans er også avgjørende for om italienske Alex Vinatzer får plass i den andre kvalifiseringsgruppen i Gurgl.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/manuel-feller-lascia-la-porta-aperta-sulla-presenza-a-gurgl-decidera-a-breve-gli-serve-allenamento","pub_date":"2026-11-17T11:50:00.000Z","fetched_at":"2026-11-17 11:55:43","lang_orig":"it","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":176409,"source_name":"RTV SLO","country":"SLO","title_no":"Nasjonsmester Nika Bobnar tar steget opp til verdenscupen","title_orig":"Državna prvakinja Nika Bobnar se seli v svetovno serijo","summary_no":"Den slovenske nasjonsmesteren Nika Bobnar rykker opp og skal nå konkurrere i verdenscupen i alpint.","spik_no":"Den slovenske nasjonsmesteren Nika Bobnar tar steget opp til verdenscupen i alpint. Slovenia har en sterk alpintradisjon med utøvere som Ilka Štuhec, som har vunnet VM-gull og verdenscupkugler i utfor, som inspirasjon. Bobnar har markert seg på nasjonalt nivå og er nå klar for den internasjonale eliteserien. Opprykket til verdenscupen er et betydelig steg i karrieren for den unge sloveneren.","url":"https://www.rtvslo.si/sport/drzavna-prvakinja-nika-bobnar-se-seli-v-svetovno-serijo/800382","pub_date":"2026-11-17T11:21:54.000Z","fetched_at":"2026-11-17 11:30:05","lang_orig":"sl","category":null,"athletes":"Nika Bobnar","athlete_nations":["SLO"],"also_sources":[],"norwegian":false},{"id":176122,"source_name":"Neveitalia","country":"ITA","title_no":"Sorì: Ny app for å booke alpinske treningsbakker","title_orig":"Nasce Sorì, l’applicazione per prenotare le piste da allenamento di sci alpino","summary_no":"Sorì er en ny applikasjon som lar brukere booke treningsbakker for alpint ski på en enkel og effektiv måte.","spik_no":"Sorì er en ny app som lar alpintrenere booke treningsbakker enkelt og raskt, uten å måtte ringe skisentrene direkte. Appen er utviklet av 25 år gamle Alessio Gottardi fra Moena i Val di Fassa – alpintrener på nivå II i det italienske skiforbundet FISI og medisinstudent ved Universitetet i Ferrara. Navnet «Sorì» betyr «enkelt» på ladino, språket som snakkes i Val di Fassa. Appen gir tilgang til en oversikt over alle italienske skisentre og er myntet særlig på trenere som reiser med klubber til ukjente anlegg.","url":"https://www.neveitalia.it/sport/scialpino/news/nasce-sori-l-applicazione-per-prenotare-le-piste-di-allenamento-di-sci-alpino","pub_date":"2026-11-17T11:00:00.000Z","fetched_at":"2026-11-17 11:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":176004,"source_name":"ORF Sport","country":"AUT","title_no":"Feller usikker på start i Gurgl-slalåm","title_orig":"Feller lässt Start in Gurgl-Slalom offen","summary_no":"Manuel Feller har ikke bestemt seg for om han vil stille til start i slalåmen i Gurgl.","spik_no":"Manuel Feller er usikker på om han stiller til start i slalåmen i Gurgl denne helgen, etter at han manglet i Levi-åpningen grunnet treningsunderskudd – særlig kondisjonsmessig. Den 34 år gamle tiroleren var Østerrikes store slalåmhåp forrige sesong og er en av de jevneste toppkjørerne i verdenscupen, men ÅSF-herrene fikk en tung sesongstart da kun Johannes Strolz kom i mål som nr. 22 i Levi, der Lucas Pinheiro Braathen vant. Sportlig leder Christian Mitter erkjenner at laget er i gjeld til resultatene, og et hjemme-verdenscuprenn i Gurgl gir mulighet til oppreisning.","url":"https://sport.orf.at/stories/3165035/","pub_date":"2026-11-17T10:46:08.000Z","fetched_at":"2026-11-17 11:00:04","lang_orig":"de","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":175772,"source_name":"Neveitalia","country":"ITA","title_no":"Franzoni åpenhjertig: «Tvilen på om jeg kan bekrefte meg selv får meg til å stadig heve lista»","title_orig":"Franzoni a cuore aperto: \"I dubbi che ho sulla possibilità di confermarmi mi portano ad alzare sempre l'asticella\"","summary_no":"Franzoni deler åpenhjertig om sin indre tvil og hvordan usikkerheten om å bekrefte egne prestasjoner motiverer ham til å kontinuerlig strekke seg høyere.","spik_no":"Den italienske alpinisten Giovanni Franzoni åpner seg om den indre tvilen som driver ham til å stadig strekke seg høyere. 25-åringen fra Brescia hadde en gjennombruddssesong i 2023/24, der han vant utforkjøringen i Kitzbühel og tok sølv i OL-utforen i Beijing. Han trener for øyeblikket med det italienske fartslaget i Copper Mountain, etter å ha begynt sesongen med en utgang i andre omgang i storslalåmen i Søelden. Franzoni skal i løpet av vinteren kjøre doble renn i utfor, super-G og storslalåm ved Copper Mountain og Beaver Creek.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/franzoni-a-cuore-aperto-i-dubbi-che-ho-sulla-possibilita-di-confermarmi-mi-portano-ad-alzare-sempre-l-asticella","pub_date":"2026-11-17T10:35:00.000Z","fetched_at":"2026-11-17 10:45:02","lang_orig":"it","category":null,"athletes":"Giovanni Franzoni","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":175613,"source_name":"SkinEWS","country":"SUI","title_no":"Feller-start i Gurgl: Ja? Nei? Kanskje!","title_orig":"Feller-Start in Gurgl: Ja? Nein? Vielleicht!","summary_no":"Det er fortsatt usikkert om Manuel Feller stiller til start i Gurgl. Spørsmålet om han deltar forblir ubesvart.","spik_no":"Det er fortsatt usikkert om Manuel Feller stiller til start i hjemmerennet i Gurgl 22. november – avgjørelsen tas i siste liten. Feller er en av Østerrikes fremste slalomkjørere og vant slalomcupen sammenlagt i sesongen 2023/24, men har slitt med skader som har påvirket forberedelsene. Gurgl-rennet er et av de mest prestisjefylte for østerrikske utøvere, med krevende Kirchenkar-løype og stort hjemmepublikum, og landslaget trenger ham i kampen om viktige verdenscuppoeng etter sesongåpningen i Levi.","url":"https://www.skinews.ch/news/2026/feller-start-vielleicht/","pub_date":"2026-11-17T10:17:09.000Z","fetched_at":"2026-11-17 10:30:04","lang_orig":"de","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":175422,"source_name":"Neveitalia","country":"ITA","title_no":"Østerrike bekreftet til Gurgl – Feller ute, Vinatzer starter blant topp 15","title_orig":"Ufficiale l'Austria per Gurgl con Truppe stella e l'assenza di Feller, che porterà Vinatzer a partire nei 15","summary_no":"Østerrike har bekreftet troppen til Gurgl med sterke profiler, men uten Manuel Feller. Hans fravær åpner for at Henrik Vinatzer kan starte blant de første 15.","spik_no":"Østerrike stiller med et sterkt lag til slalåmrennet i Gurgl, men uten Manuel Feller, som regjerende verdensmester i slalåm er en av de fremste favorittene i verdenstoppen. Hans fravær får direkte konsekvenser for startrekkefølgen: italienske Henrik Vinatzer rykker opp og får starte blant de første 15, noe som gir ham fordelen av bedre spor. For Østerrikes herrelag blir Feller-fraværet en ekstra utfordring etter at de skuffet i sesongåpningens slalåm, og det er nå Noel Gstrein og Marco Schwarz som må bære lasset.","url":"https://www.neveitalia.it/sport/scialpino/news/ufficiale-l-austria-per-gurgl-con-truppe-stella-e-l-assenza-di-feller-che-portera-vinatzer-a-partire-nei-15","pub_date":"2026-11-17T10:10:00.000Z","fetched_at":"2026-11-17 10:15:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Katharina Truppe,Manuel Feller","athlete_nations":["AUT","GER","ITA"],"also_sources":[],"norwegian":false},{"id":175071,"source_name":"Neveitalia","country":"ITA","title_no":"Disse italienerne er uttatt til Europa Cup-åpningen i Suomu – Bendotti med etter Levi og Gurgl","title_orig":"Definiti gli azzurri per l'opening di Coppa Europa a Suomu: ci sarà anche Bendotti dopo Levi e Gurgl in CdM","summary_no":"Det italienske alpinlandslaget er uttatt til Europa Cup-åpningen i Suomu, og Bendotti er inkludert etter verdenscupstarter i Levi og Gurgl.","spik_no":"Det italienske alpinlandslaget har tatt ut ti utøvere til Europa Cup-åpningen i Suomu, Finland, der det arrangeres to slalomrenn 25. og 26. november. Blant de uttatte er Matteo Bendotti, som nylig debuterte i verdenscupen med starter i Levi og Gurgl – han reiser til Suomu etter at verdenscuphelgen er ferdig, sammen med Corrado Barbera og Edoardo Saracco. Teknisk direktør Massimo Carca har også tatt ut Stefano Pizzato og Francesco Zucchini, som begge vant FIS-slalomrenn i Diavolezza kort tid før uttaket. Europa Cup fungerer som den viktigste rekrutteringsarenaen under verdenscupen, og for unge løpere som Bendotti er det mulighet til å bygge erfaring og poeng.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/definiti-gli-azzurri-per-l-opening-di-coppa-europa-a-suomu-ci-sara-anche-bendotti-dopo-levi-e-gurgl-in-cdm","pub_date":"2026-11-17T09:35:00.000Z","fetched_at":"2026-11-17 09:45:02","lang_orig":"it","category":null,"athletes":"Bendotti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":174895,"source_name":"Neveitalia","country":"ITA","title_no":"Kroatia stiller med fem kort til Gurgl","title_orig":"Con una Ljutic ritrovata e la presenza di Popovic (ma anche un bel Kolega), la Croazia si propone con cinque punte per Gurgl","summary_no":"Med en gjenfunnet Ljutic og bidrag fra Popovic og Kolega stiller Kroatia sterkt til alpine renn i Gurgl.","spik_no":"Kroatia stiller med fem utøvere til slalomrennene i Gurgl, og inkluderer en tilbakevendt Leona Popovic, som mistet åpningsrennet i Levi etter å ha blitt operert i kneet i september. På damesiden har Zrinka Ljutic vunnet slalomcupen sammenlagt i sesongen 2024/25 og er lagets fremste kort, mens Samuel Kolega, Filip Zubcic og Rodes utgjør herrenes bidrag. Kroatia er en av alpinverdenens mest overraskende suksesshistorier i slalom, med Ivica Kostelic og nå en ny generasjon som holder nasjonen på verdenskartet.","url":"https://www.neveitalia.it/sport/scialpino/news/con-una-ljutic-ritrovata-e-la-presenza-di-popovic-ma-anche-un-bel-kolega-la-croazia-si-propone-con-cinque-punte-per-gurgl","pub_date":"2026-11-17T09:15:00.000Z","fetched_at":"2026-11-17 09:30:02","lang_orig":"it","category":null,"athletes":"Leona Popovic,Zrinka Ljutic","athlete_nations":["CRO"],"also_sources":[],"norwegian":false},{"id":174423,"source_name":"ORF Sport","country":"AUT","title_no":"Tenåringer erobrer de store scenene","title_orig":"Teenager erobern die großen Bühnen","summary_no":"Unge tenåringer gjør seg bemerket på de store arenaene innen alpint.","spik_no":"Unge tenåringer gjør seg bemerket på store internasjonale arenaer, og det østerrikske eksempelet som trekkes fram er fotballspilleren Luca Weinhandl fra Sturm Graz. 17-åringen debuterer for det østerrikske A-landslaget i fotball og blir den fjerde yngste debutanten siden 1945 – bare David Alaba, Hans Buzek og Yusuf Demir har vært yngre. Weinhandl var også del av det østerrikske U17-laget som vant sølv i VM i november 2025. Artikkelen bruker dette som eksempel på at unge talenter nå tar plass på de aller største scenene i idretten.","url":"https://sport.orf.at/stories/3165015/","pub_date":"2026-11-17T08:38:36.000Z","fetched_at":"2026-11-17 08:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":173667,"source_name":"Neveitalia","country":"ITA","title_no":"Etter Levi-magien har Aicher bestemt seg: reinsdyret heter Adam – nå vil Emma ha verdenscupen","title_orig":"Dopo la magia di Levi, Aicher ha deciso: la renna si chiama... Adam. E ora Emma vuole la Coppa del Mondo","summary_no":"Etter et magisk renn i Levi har Emma Aicher navngitt reinsdyret sitt Adam. Nå har den tyske alpinisten satt seg som mål å vinne verdenscupen.","spik_no":"Emma Aicher vant slalåmen i Levi og navnga reinsdyret sitt Adam – en tradisjon der vinneren får symbolsk eierskap til et reinsdyr i Lappland. Den 23 år gamle bayerske alpinisten tok dermed sin første verdenscupseier i karrieren, og erklærer nå at hun sikter mot den store krystallkula. Aicher leder verdenscupen sammenlagt sammen med Lara Colturi, og neste mål er storslalåmen i Gurgl. Forrige sesong ble hun nummer ni sammenlagt – nå virker ambisjonene langt høyere.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/dopo-la-magia-di-levi-aicher-ha-deciso-la-renna-si-chiama-adam-e-ora-emma-vuole-la-coppa-del-mondo","pub_date":"2026-11-17T07:35:00.000Z","fetched_at":"2026-11-17 07:45:01","lang_orig":"it","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":166145,"source_name":"Ski Racing","country":"INT","title_no":"Jared Goldberg deler sin verdenscupreise på Snowbird","title_orig":"Jared Goldberg Shares His World Cup Journey at Snowbird","summary_no":"Jared Goldberg forteller om sin vei gjennom verdenscupen og hva det betyr å konkurrere på Snowbird.","spik_no":"Jared Goldberg avsluttet sin aktive karriere etter 14 sesonger på verdenscupnivå og er nå tilbake på Snowbird som assistenttrener, primært for utøvere i U14-gruppen. Goldberg vokste selv opp på Snowbird, lærte seg alpint der som fireåring etter at familien flyttet fra Boston til Utah, og ble trent av Bridger Call – som i dag er daglig leder ved Snowbird Sports Education Foundation. I et møte med juniorene oppfordret Goldberg de unge til å fokusere på én dag av gangen fremfor å drømme om OL eller verdenscup, et råd som springer ut av hans egen erfaring som eliteutøver gjennom et og et halvt tiår.","url":"https://skiracing.com/jared-goldberg-shares-his-world-cup-journey-at-snowbird/","pub_date":"2026-11-16T20:57:26.000Z","fetched_at":"2026-11-16 21:00:02","lang_orig":"en","category":null,"athletes":"Jared Goldberg","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":165465,"source_name":"Neveitalia","country":"ITA","title_no":"Klarsignal for Copper Mountain: super-G og storslalåm for menn 28.–29. november","title_orig":"Luce verde per Copper Mountain: il 28-29 novembre super-g e gigante maschili per aprire la campagna americana","summary_no":"Copper Mountain åpner den amerikanske alpinsesonen med super-G og storslalåm for herrer 28. og 29. november.","spik_no":"FIS har bekreftet at Copper Mountain i Colorado arrangerer verdenscuprenn for herrer 28. og 29. november, med super-G og storslalåm. Det er andre år på rad stedet er på verdenscupprogrammet, men i denne sesongen kun for menn – kvinnene returnerer i stedet til Killington. I fjor vant Marco Odermatt og Thomas Brennsteiner på Copper Mountain, og norske interesser hadde også noe å glede seg over: Vinatzer gikk til topps i storslalåm mens Bosca var åttende i super-G. Snøkontrollen er bestått etter nylige snøfall og god banepreparering.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/luce-verde-per-copper-mountain-il-28-29-novembre-super-g-e-gigante-maschili-per-aprire-la-campagna-americana","pub_date":"2026-11-16T19:55:00.000Z","fetched_at":"2026-11-16 20:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":164091,"source_name":"Ski Racing","country":"INT","title_no":"Matt Whitcomb overtar ledelsen av Burke Mountain Academy","title_orig":"Matt Whitcomb to Lead Burke Mountain Academy as Jesse Hunt Takes Expanded Athletics Role","summary_no":"Matt Whitcomb skal lede Burke Mountain Academy, mens Jesse Hunt går inn i en utvidet rolle innen atletikk.","spik_no":"Matt Whitcomb, i dag landslagssjef for det amerikanske langrennslandslaget, overtar som rektor ved Burke Mountain Academy i Vermont fra 1. juli 2027. Han begynte som trener ved skolen for over to tiår siden, og beskriver stillingen som drømmejobben. Jesse Hunt, tidligere alpindirektør for US Ski Team og sportsdirektør ved BMA siden 2022, rykker samtidig opp til executive director of athletics med ansvar for blant annet utøverøkonomi og lengre treningssesonger i Vermont.","url":"https://skiracing.com/matt-whitcomb-to-lead-burke-mountain-academy-as-jesse-hunt-takes-expanded-athletics-role/","pub_date":"2026-11-16T17:57:32.000Z","fetched_at":"2026-11-16 18:00:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":164181,"source_name":"SVT Sport","country":"SWE","title_no":"SVTs ekspert hyller Tilde Grillfors: – Hun viser vei","title_orig":"SVT:s expert hyllar Tilde Grillfors: ”Går in och visar vägen”","summary_no":"SVTs alpinekspert roser Tilde Grillfors for hennes prestasjon og fremhever at hun går foran som et godt eksempel.","spik_no":"Dette er en ishockeysak, ikke alpin – artikkelen handler om at 18 år gamle Tilde Grillfors scoret det avgjørende straffeskuddet da Sverige tok VM-bronse mot Finland i ishockey. Damkronornas forrige VM-medalje kom i 2007, to år før Grillfors ble født. SVTs ekspert Johanna Lagus roste henne i strålende ordelag og var selv i tårer etter bronseseieren, som hun beskrev som historisk stor for svensk damishockey.","url":"https://www.svt.se/sport/ishockey/svts-expert-hyllar-tilde-grillfors-gar-in-och-visar-vagen","pub_date":"2026-11-16T17:42:42.000Z","fetched_at":"2026-11-16 18:00:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":163858,"source_name":"ORF Sport","country":"AUT","title_no":"Sverige sikret VM-bronse","title_orig":"Schwedinnen sichern sich WM-Bronze","summary_no":"Det svenske laget sikret seg bronsemedalje i verdensmesterskapet i alpint.","spik_no":"Det svenske ishockeylaget sikret seg bronsemedalje i VM, men dette er ikke fra alpint – artikkelteksten handler om svensk ishockey for kvinner, ikke alpint. Sverige slo Finland 2–1 på straffeslag i bronsekampen i Herning, Danmark. Det er landets tredje VM-bronse i ishockey, etter medaljer i 2005 og 2007. Ingen relevant alpininnhold er tilgjengelig i denne saken.","url":"https://sport.orf.at/stories/3165018/","pub_date":"2026-11-16T17:28:07.000Z","fetched_at":"2026-11-16 17:30:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":163508,"source_name":"ORF Sport","country":"AUT","title_no":"Også Schmid utgår – Jungwirth og Weinhandl debuterer","title_orig":"Auch Schmid fällt aus, Debüts von Jungwirth und Weinhandl","summary_no":"Schmid er også bekreftet utgått, mens Jungwirth og Weinhandl er klare for sine debuts i alpint.","spik_no":"Dette er en fotballsak, ikke alpint – artikkelen handler om det østerrikske landslaget i Nations League, der Romano Schmid har reist hjem av private grunner og keeper Lukas Jungwirth samt 17-åringen Luca Weinhandl er klare for sine landslagsdebuter. Saken har ingen tilknytning til alpint eller vintersport.","url":"https://sport.orf.at/stories/3165017/","pub_date":"2026-11-16T16:45:52.000Z","fetched_at":"2026-11-16 17:00:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":163142,"source_name":"Neveitalia","country":"ITA","title_no":"Frankrike stiller med 13 utøvere til slalåmrennene i Gurgl","title_orig":"La Francia col piedo di fiducia verso Gurgl, dove vinse Rassat un anno fa: ecco i 13 atleti per i prossimi slalom","summary_no":"Frankrike reiser til Gurgl med stor selvtillit etter Rassats seier der for ett år siden. 13 utøvere er uttatt til de kommende slalåmrennene.","spik_no":"Frankrike stiller med 13 utøvere til slalåmrennene i Gurgl neste helg, og reiser dit med god selvtillit etter en sterk helg i Levi. På damessiden utmerket Marion Chevrier og Marie Lamure seg med henholdsvis 6.- og 7.-plass i Finland – begge karrierebeste resultater. På herresiden er Clément Noël, som tok 2.-plass i Levi-åpningen, og Paco Rassat, som vant i Gurgl for ett år siden, de fremste medaljehåpene.","url":"https://www.neveitalia.it/sport/scialpino/news/la-francia-col-piedo-di-fiducia-verso-gurgl-dove-vinse-rassat-un-anno-fa-ecco-i-13-atleti-per-i-prossimi-slalom","pub_date":"2026-11-16T16:15:00.000Z","fetched_at":"2026-11-16 16:30:01","lang_orig":"it","category":null,"athletes":"Clement Noel","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":162675,"source_name":"SkinEWS","country":"SUI","title_no":"Ti poeng og en planendring for Charlotte Lingg","title_orig":"Zehn Punkte und eine Planänderung für Charlotte Lingg","summary_no":"Charlotte Lingg sikret seg ti verdenscuppoeng og måtte samtidig endre sine opprinnelige planer.","spik_no":"Charlotte Lingg, som konkurrerer for Liechtenstein, satte karrierebeste i verdenscupslalåmen i Levi med en 21.-plass og ti poeng – noe som også førte til en endring i hennes opprinnelige planer fremover. Den 27 år gamle Zermatt-utøveren tok resultatet til tross for bagasjekaoset som oppsto under reisen til Lappland, der deler av utstyret hennes kom frem forsinket. Liechtenstein er et lite alpinland som tradisjonelt har hatt enkeltutøvere på høyt nivå, og Lingg representerer denne tradisjonen med en lovende utvikling på verdenscupnivå.","url":"https://www.skinews.ch/news/2026/punkte-planaenderung-charlotte/","pub_date":"2026-11-16T15:35:21.000Z","fetched_at":"2026-11-16 15:45:04","lang_orig":"de","category":null,"athletes":"Charlotte Lingg","athlete_nations":["LIE"],"also_sources":[],"norwegian":false},{"id":160956,"source_name":"Expressen","country":"SWE","title_no":"Sally Sivertsson fikk kreft: «Som en bombe»","title_orig":"Sally Sivertsson fick cancer: ”Som en bomb”","summary_no":"Alpinisten Sally Sivertsson forteller om sjokket da hun fikk kreftdiagnosen.","spik_no":"Artikkelteksten handler om den svenske håndballspilleren Sally Sivertsson, ikke en alpinist. Det ser ut til å være feil artikkel koblet til saken. Sally Sivertsson er datter av den legendariske håndballspilleren Thomas Sivertsson og fikk en kreftdiagnose i 2023, men er altså håndballspiller – ikke alpinist. NRK Sport alpint bør verifisere om det finnes en alpinist med samme navn før dette eventuelt brukes på lufta.","url":"https://www.expressen.se/sport/handboll/sally-sivertsson-fick-cancer-som-en-bomb/","pub_date":"2026-11-16T13:58:49.000Z","fetched_at":"2026-11-16 14:15:06","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":160517,"source_name":"Neveitalia","country":"ITA","title_no":"Sveitsisk trio klar for Gurgl: Meillard, Nef og Yule angriper «Kirchenkar»","title_orig":"Team confermato per gli svizzeri protagonisti a Gurgl: Meillard, Nef e Yule il trio d'attacco sulla \"Kirchenkar\"","summary_no":"Sveits stiller med Loïc Meillard, Tanguy Nef og Daniel Yule i Gurgl, der trioen er klar for kamp på den krevende «Kirchenkar»-løypen.","spik_no":"Sveits stiller med samme tropp i Gurgl som i Levi, med Loïc Meillard som flaggbærer etter at han tok pallplass i Finland. Meillard, 30 år fra Hérémence, er inne i en god periode og jakter sitt tredje strake pallresultat denne sesongen – på «Kirchenkar»-løypen i Tirol har han imidlertid slitt, med en femteplass i 2024 og to utløp i annen omgang som eneste meritter. Tanguy Nef hadde også en femteplass i Gurgl for ett år siden, mens veteranen Daniel Yule fullførte som 16. i Levi og håper på bedre betalt i Østerrike.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/team-confermato-per-gli-svizzeri-protagonisti-a-gurgl-meillard-nef-e-yule-il-trio-d-attacco-sulla-kirchenkar","pub_date":"2026-11-16T13:35:00.000Z","fetched_at":"2026-11-16 13:45:02","lang_orig":"it","category":null,"athletes":"Daniel Yule,Loïc Meillard,Tanguy Nef","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":160259,"source_name":"Expressen","country":"SWE","title_no":"Vinnersuksess for Magnus Nygren","title_orig":"Vinstsuccé för Magnus Nygren","summary_no":"Magnus Nygren markerte seg med en imponerende seier i alpint.","spik_no":"Denne saken handler ikke om alpint, men om ishockeystjernen Magnus Nygren som vant stort på travspillet V85. Nygren, kjent som Tre Kronor-profil på isen, vant i august over 43 000 svenske kroner på travtipping, og slo til igjen i helgen med en totalgevinst på 391 345 kroner. Saken har ingen tilknytning til alpinsport og er ikke relevant som bakgrunnsnotat for NRK Sport alpint.","url":"https://www.expressen.se/sport/trav/vinstsucce-for-magnus-nygren/","pub_date":"2026-11-16T13:10:14.000Z","fetched_at":"2026-11-16 13:15:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":159469,"source_name":"Neveitalia","country":"ITA","title_no":"Sveits stiller med kun åtte utøvere i Gurgl – Rast og Holdener vil innløse seg","title_orig":"Contingente ridotto a 8 unità anche per la Svizzera presente a Gurgl: Rast e Holdener per il riscatto","summary_no":"Sveits møter opp med et redusert lag på åtte utøvere i Gurgl, der Rast og Holdener er klare for å slå tilbake.","spik_no":"Sveits stiller med kun åtte utøvere i slalåmen i Gurgl, der de mangler den skadde Mélanie Meillard for resten av sesongen etter at hun rev over korsbåndet og menisken i høyre kne under oppkjøringen til Levi. Camille Rast, som er verdensmester i slalåm og hadde to tredjeplasser i Gurgl fra før, og Wendy Holdener er utpekt som lagets ledere og ønsker begge å slå tilbake etter skuffende resultater. Også Anuk Braendli er utelatt sammenlignet med Levi-stafetten, da hun prioriterer Europa Cup. Michelle Hoepli er med etter å ha satt personlig rekord i forrige renn.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/contingente-ridotto-a-8-unita-anche-per-la-svizzera-presente-a-gurgl-rast-e-holdener-per-il-riscatto","pub_date":"2026-11-16T12:10:00.000Z","fetched_at":"2026-11-16 12:15:01","lang_orig":"it","category":null,"athletes":"Camille Rast,Melanie Meillard,Wendy Holdener","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":159118,"source_name":"Neveitalia","country":"ITA","title_no":"Kun åtte italienske alpinister til Gurgl – Peterlini og Della Mea leder an","title_orig":"\"Tite\" Sola dirottata sulla Coppa Europa, saranno solo 8 le azzurre in gara a Gurgl: guidano Peterlini e Della Mea","summary_no":"Det italienske kvinnelaget omdirigeres til Europacupen, og bare åtte utøvere stiller til start i Gurgl med Peterlini og Della Mea i spissen.","spik_no":"Italia stiller med kun åtte utøvere i slalåmen i Gurgl lørdag, der Martina Peterlini og Lara Della Mea leder troppen. Beatrice «Tite» Sola, som var Italias beste i Levi, er sendt til Europacupen i stedet. Gurgl-bakken «Kirchenkar» har bare vært arrangert for kvinner to ganger tidligere, og begge gangene endte med samme podium: Shiffrin øverst, foran Colturi og Rast. Mikaela Shiffrin er heller ikke denne gangen til stede – hun returnerer i Killington.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/tite-sola-dirottata-sulla-coppa-europa-saranno-solo-8-le-azzurre-in-gara-a-gurgl-guidano-peterlini-e-della-mea","pub_date":"2026-11-16T11:35:00.000Z","fetched_at":"2026-11-16 11:45:01","lang_orig":"it","category":null,"athletes":"Martina Peterlini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":158807,"source_name":"Neveitalia","country":"ITA","title_no":"Andre episode av «Ghiaccio Verde»: direktesending med Paolo De Chiesa om verdenscupen","title_orig":"Seconda puntata stagionale di \"Ghiaccio Verde\": alle 18.30 la diretta con Paolo De Chiesa per tutti i temi della CdM","summary_no":"Andre episode av sesongens «Ghiaccio Verde» sendes direkte klokken 18.30 med Paolo De Chiesa, som tar opp alle temaer knyttet til verdenscupen.","spik_no":"Det italienske alpinprogrammet «Ghiaccio Verde» på Neveitalia sender sin andre episode av sesongen direkte klokken 18.30, med den profilerte alpinekspert og tidligere verdenscupløper Paolo De Chiesa som gjest. Programmet tar opp høydepunktene fra slalomrennene i Levi, der tyske Emma Aicher vant damenes slalom foran Lara Colturi, mens Lucas Pinheiro Braathen tok seieren for herrene. Braathen, som representerer Brasil etter å ha skiftet nasjonalitet fra Norge, fulgte dermed opp sin tidligere gigantslalomseier i Sölden. De Chiesa er kjent som «skistemmen» i Italia og en fast stemme i alpindebatten.","url":"https://www.neveitalia.it/sport/scialpino/pagelle/news/ghiaccio-verde-del-16-novembre-2026-con-paolo-de-chiesa","pub_date":"2026-11-16T11:10:00.000Z","fetched_at":"2026-11-16 11:15:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":158458,"source_name":"Sportschau","country":"GER","title_no":"Direktesending: Vintersport på Das Erste","title_orig":"Livestream: Wintersport im Ersten","summary_no":"Vintersport sendes direkte på den tyske TV-kanalen Das Erste.","spik_no":"Das Erste sender vintersport direkte gjennom sin Sportschau-plattform, som dekker disipliner som skiskyting, skihopp og alpint. Den tyske offentlige kringkasteren har lange tradisjoner for å sende vintersport og er en av de viktigste visningsflatene for sporten i det tyske markedet. Sportschau.de tilbyr også direktestrømming på nett, noe som gjør innholdet tilgjengelig for et bredt publikum utover tradisjonell TV.","url":"https://www.sportschau.de/wintersport/wintersport-im-ersten,livestream-wintersport-im-ersten-108.html","pub_date":"2026-11-16T10:45:51.000Z","fetched_at":"2026-11-16 11:00:06","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":158163,"source_name":"Neveitalia","country":"ITA","title_no":"Italia bekrefter troppen til Gu
