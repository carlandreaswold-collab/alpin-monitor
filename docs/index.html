<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>
    <div class="season" id="season-badge"></div>
    <span class="readonly-badge">👁 Lesevisning</span>

  </div>

    <input class="search-input" type="search" id="search" placeholder="Søk i titler, utøvere…">
    <select class="athlete-select" id="country-select"><option value="">Alle land</option></select>
    <select class="athlete-select" id="athlete-select"><option value="">Alle utøvere</option></select>

</div>

<div class="main">
  <div id="feed"></div>
  <div class="sidebar">
    <div class="section-label" id="spik-label">Spik-liste</div>
    <div id="spik-list"></div>
  </div>
</div>

<script>
const CATS = [{"id":"viktig","label":"⚡ Viktig"},{"id":"sportslig","label":"🎿 Sportslig"},{"id":"nyheter","label":"📰 Nyhet"},{"id":"goy","label":"😄 Gøy"},{"id":"nerding","label":"🔬 Nerding"},{"id":"kjendis","label":"🌟 Kjendis"},{"id":"naert","label":"🤝 Nært og nyttig"}];
const ARTICLES = [{"id":239788,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen jubler etter comeback: Vant slalåm i Suomu","title_orig":"L'urlo di Jakobsen per rinascere: lo svedese firma il secondo slalom di CE a Suomu, Pizzato di nuovo miglior azzurro","summary_no":"Svenske Jakobsen vant sitt andre kontinentalcup-slalåm i Suomu. Pizzato var igjen beste italiener.","spik_no":"Kristoffer Jakobsen vant sitt andre kontinentalcup-slalåm i finske Suomu, og markerte et tydelig comeback etter en lengre periode med skader. Den svenske slalåmspesialisten kom fra 11. plass etter første omgang – med startnummer 52 – og kjørte seg helt til topps, kun 8 hundredeler foran landsmannen Gustav Wissting. Wissting har vært i storform i åpningen av sesongen og imponerte med en 17. plass i Levi-slalåmen med startnummer 82.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/l-urlo-di-jakobsen-per-rinascere-lo-svedese-firma-il-secondo-slalom-di-ce-a-suomu-pizzato-di-nuovo-miglior-azzurro","pub_date":"2026-11-26T11:40:00.000Z","fetched_at":"2026-11-26 11:45:02","lang_orig":"it","category":null,"athletes":"Kristoffer Jakobsen,Stefano Pizzato","athlete_nations":["ITA","SWE"],"also_sources":[],"norwegian":false},{"id":239500,"source_name":"SVT Sport","country":"SWE","title_no":"Pernilla Wiberg: «Beste sesongstart på veldig lenge»","title_orig":"Pernilla Wiberg: ”Bästa säsongsstarten på väldigt länge”","summary_no":"Den svenske alpinstjernen Pernilla Wiberg mener hun har hatt sin beste sesongstart på svært lenge.","spik_no":"Pernilla Wiberg, svensk alpinlegende og SVT-ekspert, roser den svenske sesongstarten som den beste på svært lenge. Høydepunktet så langt er at Sara Hector og Anna Swenn Larsson begge sto på pallen i Østerrike – første gang to svenske kvinner deler pall i verdenscupen på tolv år. På herresiden har Fabian Ax Swartz levert en fjerde- og en sjetteplass, og Gustav Wissting gjennomførte en historisk opphenting fra startnummer 82. Wiberg selv vant fire store kulegull og 24 verdenscuprenn i sin aktive karriere på 1990-tallet.","url":"https://www.svt.se/sport/alpint/pernilla-wiberg-basta-sasongsstarten-pa-valdigt-lange","pub_date":"2026-11-26T11:03:08.000Z","fetched_at":"2026-11-26 11:15:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":239251,"source_name":"Neveitalia","country":"ITA","title_no":"Det første pallen i utforkjøring med «DH Lions» – Pichler og Agerer hedrer Fede","title_orig":"Quel primo podio nella disciplina regina con le \"DH Lions\", le grandi amiche Pichler e Agerer: ancora grazie Fede","summary_no":"Pichler og Agerer minnes sin første pallplass i utforkjøring sammen med «DH Lions», og retter en varm takk til sin gode venninne Fede.","spik_no":"Kjersti Pichler og Nina Agerer hedrer venninnen Federica Brignone etter lagets første pallplass i utforkjøring med grupperingen kalt «DH Lions». Brignone er primært kjent for storslalåm og super-G, men har i mange år jobbet seg mot en seier i utforkjøring. Den 14. januar 2018 i Bad Kleinkirchheim tok hun sin første utfarpall, med andreplass bak Goggia og foran Nadia Fanchini. Sju år senere, i januar 2025, tok hun omsider sin første utfarseier – i St. Anton og Garmisch-Partenkirchen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/quel-primo-podio-nella-disciplina-regina-con-le-dh-lions-le-grandi-amiche-pichler-e-agerer-ancora-grazie-fede","pub_date":"2026-11-26T10:50:00.000Z","fetched_at":"2026-11-26 11:00:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":237014,"source_name":"Neveitalia","country":"ITA","title_no":"– Davide viet livet sitt til det: Ninna Quario om Fede i Cervinia","title_orig":"\"Davide le ha dedicato la vita, con Fede a Cervinia ho capito che non ce la faceva più\": parla Ninna Quario","summary_no":"Ninna Quario åpner opp om øyeblikket hun skjønte at Davide ikke lenger klarte å fortsette, etter en tur til Cervinia med Fede.","spik_no":"Ninna Quario, trolig en nær venn eller samboer til Davide – omtalt i forbindelse med Federica Brignones avskjed – åpner opp om det smertefulle øyeblikket de innså at livet på toppen var over. Brignone er kjent som en utøver som har ofret enormt for sporten, og de menneskene rundt henne har fulgt den krevende reisveien på nært hold. Artikkelen gir et personlig og følelsesladet innblikk i hva det innebærer å støtte en toppidrettsutøver gjennom de tøffe valgene karrierens slutt medfører.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/davide-le-ha-dedicato-la-vita-con-fede-a-cervinia-ho-capito-che-non-ce-la-faceva-piu-parla-ninna-quario","pub_date":"2026-11-26T07:55:00.000Z","fetched_at":"2026-11-26 08:15:03","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":237015,"source_name":"Neveitalia","country":"ITA","title_no":"Familien Radici kjøper 70 prosent av LISKI – italiensk sikkerhetspioner på ski","title_orig":"La famiglia Radici acquisisce il 70% di LISKI, eccellenza italiana nella sicurezza sulle piste da sci","summary_no":"Familien Radici overtar 70 prosent av LISKI, et ledende italiensk selskap innen sikkerhetsutstyr for skianlegg.","spik_no":"Familien Radici overtar 70 prosent av LISKI, et italiensk selskap med lang tradisjon innen sikkerhetsutstyr for skianlegg – blant annet nett, porter og rekkverk brukt over hele verden. Radici-familien er en velstående industrislekt fra Bergamo-regionen, kjent fra tekstil- og kjemikaliesektoren, og dette oppkjøpet representerer en investering i den bredere skibransjen. LISKI er en sentral leverandør til verdenscuparrangementer og kommersielle skianlegg, og eierskiftet kan påvirke selskapets videre ekspansjon og produktutvikling.","url":"https://www.neveitalia.it/materiali/aziende/news/la-famiglia-radici-acquisisce-il-70-di-liski-eccellenza-italiana-nella-sicurezza-sulle-piste-da-sci","pub_date":"2026-11-26T07:25:13.000Z","fetched_at":"2026-11-26 08:15:03","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":237016,"source_name":"Neveitalia","country":"ITA","title_no":"Fra historisk pall i Bansko til dobbeltseier i St. Moritz – Curtoni takker Brignone","title_orig":"Dal podio storico di Bansko alla doppietta a St. Moritz davanti a Shiffrin, Curtoni e la sua Brignone: \"Fede, grazie per questi anni\"","summary_no":"Elena Curtoni ser tilbake på karrierehøydepunkter og retter en hjertelig takk til lagvenninne Federica Brignone.","spik_no":"Elena Curtoni, den italienske utforspesialisten, ser tilbake på karrierehøydepunkter og hyller lagvenninnen Federica Brignone i forbindelse med sistnevntes karriereslutt. Curtoni husker spesielt sin historiske pallplass i Bansko og dobbeltseieren i St. Moritz som sentrale øyeblikk, og krediterer Brignone for å ha betydd mye for hennes utvikling som utøver. De to har vært en del av det sterke italienske dame-landslaget som i mange år har dominert verdenscupen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/dal-podio-storico-di-bansko-alla-doppietta-a-st-moritz-davanti-a-shiffrin-curtoni-e-la-sua-brignone-fede-grazie-per-questi-anni","pub_date":"2026-11-26T06:50:00.000Z","fetched_at":"2026-11-26 08:15:03","lang_orig":"it","category":null,"athletes":"Federica Brignone,Mikaela Shiffrin","athlete_nations":["ITA","USA"],"also_sources":[],"norwegian":false},{"id":237017,"source_name":"Neveitalia","country":"ITA","title_no":"Bassino, Pirovano og Zenere – nå er det deres tur. Amerika roper: Takk, Fedolla","title_orig":"Bassino, Pirovano, Zenere, ora tocca a voi. Dagli States un grido univoco: \"Solo grazie, Fedolla\"","summary_no":"Med Brignones avgang rettes søkelyset mot neste generasjon italienske alpinister, mens beundrere fra USA hyller Federica med takknemlige ord.","spik_no":"Med Federica Brignones avgang er det klart at en ny generasjon italienske alpinister må ta over stafettpinnen. Marta Bassino, Laura Pirovano og Asja Zenere pekes ut som de fremste kandidatene til å bære det italienske flagget videre i verdenscupen. Brignone, som vant sammenlagtcupen i 2020 og satte rekorder for italienske kvinner i alpint, har vært en enorm inspirasjonskilde – og hyldestene fra amerikanske fans understreker hennes internasjonale stjernestatus.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/bassino-pirovano-zenere-ora-tocca-a-voi-dagli-states-un-grido-univoco-solo-grazie-fedolla","pub_date":"2026-11-25T21:15:00.000Z","fetched_at":"2026-11-26 08:15:03","lang_orig":"it","category":null,"athletes":"Federica Brignone,Laura Pirovano,Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":237018,"source_name":"Neveitalia","country":"ITA","title_no":"Zazzi utsetter comeback etter skade: – Vi ses i Gardena","title_orig":"Pietro Zazzi torna a casa dal Colorado e rinvia il rientro in CdM: \"La tibia fa male ma sono veloce, ci vediamo in Gardena\"","summary_no":"Pietro Zazzi reiser hjem fra Colorado og utsetter sin retur til verdenscupen. Italieneren sliter med skinnebenet, men er optimistisk foran Gardena-rennet.","spik_no":"Den italienske fartsspesialisten Pietro Zazzi reiser hjem fra treningsoppholdet i Colorado etter å ha fått problemer med skinnebenet, og utsetter dermed sin retur til verdenscupen. Zazzi har slitt med skader som har hindret ham i å være en fast del av verdenscupfeltet, og slike tilbakeslag er dessverre ikke uvanlige for utfor- og super-G-løpere. Han er likevel optimistisk og sikter mot å være klar til rennene i Val Gardena, en av de mest prestisjetunge utforklassikerne på menns verdenscupkalender.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/pietro-zazzi-torna-a-casa-dal-colorado-e-rinvia-il-rientro-in-cdm-la-tibia-fa-male-ma-sono-veloce-ci-vediamo-in-gardena","pub_date":"2026-11-25T20:45:00.000Z","fe nes avskjed: – Håper jeg inspirerer dem","title_orig":"Fede 2.0: \"Le compagne mi hanno commosso, spero di lasciare loro la voglia di fare questa vita al 100%, ma divertendosi\"","summary_no":"Federica Brignone ble rørt av lagvenninnenes varme ord ved avskjeden. – Jeg håper jeg kan gi dem lyst til å leve dette livet fullt ut, men med glede, sier hun.","spik_no":"Federica Brignone ble tydelig rørt da hun mottok varme avskjedshilsener fra lagvenninnene etter at hun kunngjorde karrieresluttet. 36-åringen uttrykte håp om at hennes livsvalg og dedikasjon kan inspirere den neste generasjonen av italienske alpinister til å forfølge drømmene sine med glede, ikke bare plikt. Brignone, som vokste opp i en familie med sterke alpinrøtter – moren Maria Rosa Quario var selv alpinist – har alltid fremhevet gleden ved sporten som sentral for sin egen motivasjon.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/fede-20-le-compagne-mi-hanno-commosso-spero-di-lasciare-loro-la-voglia-di-fare-questa-vita-al-100-ma-divertendosi","pub_date":"2026-11-25T17:35:00.000Z","fetched_at":"2026-11-26 08:15:03","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":237156,"source_name":"Sportschau","country":"GER","title_no":"Ski-stjerne Brignone avslutter karrieren på grunn av vedvarende smerter","title_orig":"Ski-Star Brignone beendet wegen anhaltender Schmerzen Karriere","summary_no":"Alpinstjernen Brignone legger opp etter å ha slitt med vedvarende smerter som har gjort det umulig å fortsette karrieren.","spik_no":"Den italienske alpinstjernen Federica Brignone, 36, legger opp etter vedvarende smerter i kneet som gjør det umulig å fortsette karrieren. Hun brakk legg og skinneben og rev over korsbåndet under et stygt fall i april 2025, men kom tilbake til OL i Cortina d'Ampezzo i februar 2026 og vant gull i både super-G og storslalåm – i tillegg til å bære Italias flagg under åpningsseremonien. Et nytt },{"id":236471,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn og Shiffrin hyllet Brignone: – Et av historiens største comebacks","title_orig":"Vonn e Shiffrin, messaggi da brividi per Federica. \"A Cortina ci hai regalato uno dei più grandi ritorni della storia\"","summary_no":"Lindsey Vonn og Mikaela Shiffrin sendte rørende meldinger til Federica Brignone og hyllet hennes historiske comeback i Cortina.","spik_no":"Lindsey Vonn og Mikaela Shiffrin var blant de mange store alpinstjernene som hyllet Federica Brignone etter at italieneren kunngjorde sin karriereslutt onsdag 25. november 2026. Vonn, som selv kjemper for å komme tilbake etter en alvorlig skade i februar, kalte Brignones opptreden i Cortina for «et grandios comeback som alltid vil leve i oss». Også Tina Maze, Viktoria Rebensburg og Giuliano Razzoli var blant dem som sendte meldinger til 36-åringen, som vant OL-gull på hjemmebane bare ti måneder etter å ha brukket leggen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/vonn-e-shiffrin-messaggi-da-brividi-per-federica-a-cortina-ci-hai-regalato-uno-dei-piu-grandi-ritorni-della-storia","pub_date":"2026-11-25T15:45:00.000Z","fetched_at":"2026-11-25 16:00:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Lindsey Vonn,Mikaela Shiffrin","athlete_nations":["ITA","USA"],"also_sources":[],"norwegian":false},{"id":236109,"source_name":"Neveitalia","country":"ITA","title_no":"Takk, Fede – FISI og Roda tar farvel: «Et stort tap for bevegelsen»","title_orig":"Grazie Fede, il primo saluto è quello della FISI e di Roda. \"Una grande perdita per il movimento, ti auguriamo ogni bene per la vita\"","summary_no":"Det italienske skiforbundet FISI og Roda retter en varm avskjedshilsen til Federica og ønsker henne alt godt videre i livet.","spik_no":"Federica Brignone har annonsert sin umiddelbare karriereslutt etter treningsdager i Cervinia, og det italienske skiforbundet FISI og president Flavio Roda omtaler avgangen som «et stort mycket smärta”","summary_no":"Den italienske alpinisten Federica Brignone legger opp og begrunner beslutningen med at smertene har blitt for store.","spik_no":"Federica Brignone bekrefter karriereslutten i en melding på sosiale medier, der hun skriver at hun fortsatt kjenner for mye smerte til å returnere til konkurransepistene. Den 36 år gamle italieneren tok sine to olympiske gull under Milano-Cortina-lekene i 2026 på hjemmebane, noe som ble et høydepunkt i en ekstraordinær karriere. Brignone er en av svært få alpinister som har vunnet verdenscuprenn i alle de klassiske tekniske og fartsdisiplinene, og hun vant også sammenlagtcupen i 2020.","url":"https://www.svt.se/sport/alpint/federica-brignone-avslutar-karriaren-for-mycket-smarta","pub_date":"2026-11-25T14:55:27.000Z","fetched_at":"2026-11-25 15:00:05","lang_orig":"sv","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":235622,"source_name":"ORF Sport","country":"AUT","title_no":"Dobbelt-olympiamester Brignone legger opp","title_orig":"Doppel-Olympiasiegerin Brignone hört auf","summary_no":"Federica Brignone, som har vunnet to olympiske gull, avslutter sin karriere som alpinist.","spik_no":"Federica Brignone avslutter karrieren etter at et venstre ben hun pådro seg under et fall i Val di Fassa i april 2025 ikke har grodd godt nok. 36-åringen kunngjorde beslutningen på Instagram og forklarer at smertene fortsatt er for sterke til å konkurrere. Det dramatiske ved avskjeden er at Brignone gikk til topps i begge sine øvelser – super-G og storslalåm – under OL i Milano/Cortina i februar 2026, bare måneder etter den alvorlige skaden. Med to OL-gull, ett VM-gull og en sammenlagttittel i verdenscupen er hun en av de mest dekorerte alpinistene Italia har hatt.","url":"https://sport.orf.at/stories/3165422/","pub_date":"2026-11-25T14:47:22.000Z","fetched_at":"2026-11-25 14:59:23","lang_orig":"de","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":235385,"source_name":"Neveitalia","country":"ITA","title_no":"Brignone med sjokkbeskjed: Legger opp","title_orig":"Fede, l'annuncio shock: Brignone si ritira. \"La gamba mi fa troppo male, ho deciso di finire la mia carriera. Aprirò un ultimo cancelletto\"","summary_no":"Federica Brignone kunngjør at hun avslutter karrieren på grunn av for sterke smerter i beinet, men vil åpne én siste startport.","spik_no":"Federica Brignone kunngjør at hun avslutter alpinkarrieren etter for sterke smerter i beinet, men vil åpne én siste startport. Den 34 år gamle italieneren er den mest meritterte alpinisten i italiensk skihistorie, med over 30 verdenscupseire og sammenlagtseieren i verdenscupen 2019–20. Brignone tok også OL-gull i kombinasjon i 2022, og har vært aktiv i alle disipliner gjennom karrieren. Testdagene i Cervinia ga ikke de svarene hun håpet på, og beslutningen ble tatt via en videobeskjed til det italienske skiforbundet FISI.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/fede-l-annuncio-shock-brignone-si-ritira-la-gamba-mi-fa-troppo-male-ho-deciso-di-finire-la-mia-carriera-apriro-un-ultimo-cancel","pub_date":"2026-11-25T14:35:00.000Z","fetched_at":"2026-11-25 14:45:02","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":235023,"source_name":"Neveitalia","country":"ITA","title_no":"Store verdenscupbegivenheter i Sør-Tirol: Val Gardena og Alta Badia i rampelyset","title_orig":"I grandi eventi altoatesini della CdM maschile lanciati tra una Val Gardena pre Mondiale e l'Alta Badia con lo slalom-novità","summary_no":"De store herreverdenscupene i Sør-Tirol presenteres, med Val Gardena som oppkjøring til VM og en ny slalomkonkurranse i Alta Badia.","spik_no":"Val Gardena og Alta Badia presenterte nylig sitt felles program for fire dager med herreverdenscup i desember, der det går super-G og utfor på Saslong 18.–19. desember, fulgt av storslalåm og en ny nattslalåm på Gran Risa i Alta Badia. Val Gardena-løpene fungerer som ekstra viktig oppkjøring med tanke på at Saslong-traseen skal være VM-arena i 2031. Østerrikeren Max Franz, som vant sitt første verdenscuprenn nettopp i Val Gardena for ti år siden, vil ha en sentral rolle under prisutdelingene.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/i-grandi-eventi-altoatesini-della-cdm-maschile-lanciati-tra-una-val-gardena-pre-mondiale-e-l-alta-badia-con-lo-slalom-novita","pub_date":"2026-11-25T14:10:00.000Z","fetched_at":"2026-11-25 14:15:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":234754,"source_name":"Expressen","country":"SWE","title_no":"Skiforbundet endrer reglene etter OL-furoren","title_orig":"Skidlandslaget ändrar reglerna efter ilskan på OS","summary_no":"Det svenske alpinlandslaget endrer sine interne regler etter at sinne og misnøye oppsto under de olympiske leker.","spik_no":"Det svenske langrennslandslaget endrer sine interne uttaksregler etter den kraftige kritikken som oppsto under OL i vinter. Kjernen i striden var at landslagsledelsen sendte hjem flere løpere tidlig i mesterskapet, og da Frida Karlsson og Jonna Sundling ble syke, kunne Sverige stille med bare to utøvere i damenes fem mil. TV 2s ekspert Petter Skinstad kalte det «en skandale uten sidestykke» og mente det nesten var grunn til oppsigelse. Nå skal landslagstrenere med egne bindinger til utøvere tre tilbake ved uttaksavgjørelser.","url":"https://www.expressen.se/sport/langdskidor/skidlandslaget-andrar-reglerna-efter-ilskan-pa-os/","pub_date":"2026-11-25T13:40:05.000Z","fetched_at":"2026-11-25 13:45:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":234661,"source_name":"Neveitalia","country":"ITA","title_no":"Mont-Tremblant-skuffelsen: Kravene for verdenscup ikke oppfylt – Quebec tilbake i 2027","title_orig":"Tutta la delusione di Mont-Trémblant: \"Non è stato possibile soddisfare i requisiti da CdM\". Nel dicembre 2027 si tornerà in Québec","summary_no":"Mont-Tremblant klarte ikke å oppfylle kravene til et verdenscuparrangement, men Quebec-stedet ventes å være tilbake på kalenderen i desember 2027.","spik_no":"Mont-Tremblant i Quebec måtte avlyse sine planlagte verdenscuprenn i storslalåm 5.–6. desember på grunn av for lite snø, og klarte ikke å oppfylle FIS sine krav til arrangementet. Bakken «Flying Mile» debuterte i verdenscupen i 2023, da Federica Brignone vant og ble en publikumsfavoritt i det skiglade lokalsamfunnet, mens rennet i 2024 gikk bedre snømessig. Stedet er allerede lovet tilbake på kalenderen i desember 2027, men FIS jobber nå med å finne alternativ for de to avlyste storslalåmrennene denne sesongen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/tutta-la-delusione-di-mont-tremblant-non-e-stato-possibile-soddisfare-i-requisiti-da-cdm-nel-dicembre-2027-si-tornera-in-quebec","pub_date":"2026-11-25T13:35:00.000Z","fetched_at":"2026-11-25 13:45:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":233792,"source_name":"VG","country":"NOR","title_no":"Norsk alpinstjerne mister ny verdenscuphelg","title_orig":"Norsk alpinstjerne mister ny verdenscuphelg","summary_no":"","spik_no":"Alexander Steen Olsen mister nok en verdenscuphelg og er ikke med i Norges uttak til konkurransene i Copper Mountain og Killington. Teknikk-spesialisten trakk seg fra både åpningsrennet i Sölden og slalåmen i Levi, og trenger fortsatt mer tid på å bli 100 prosent klar etter en kneoperasjon som kostet ham hele OL-sesongen 2025/26. 25-åringen fra Bærum vant sin første verdenscupseier i slalåm i 2023 og regnes som en av Norges største talenter i de tekniske disiplinene.","url":"https://www.vg.no/sport/i/bk5pov/alexander-steen-olsen-mister-ny-verdenscuphelg?utm_medium=rss","pub_date":"2026-11-25T12:24:57.000Z","fetched_at":"2026-11-25 12:45:04","lang_orig":"no","category":null,"athletes":"Alexander Steen Olsen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":233575,"source_name":"Neveitalia","country":"ITA","title_no":"Redusert tropp for Wunderteam: Scheib vil ta revansj i Killington – Astner fortsatt ute","title_orig":"Contingente ridotto per il Wunderteam: Scheib vuole il riscatto a Killington, ancora out Astner. Truppe guida le slalomiste","summary_no":"Østerrike stiller med redusert tropp i Killington, der Scheib er klar for revansj mens Astner fortsatt er skadet. Truppe leder an blant slalomistene.","spik_no":"Østerrike stiller med sterkt redusert tropp til Killington, der Julia Scheib er lagets store håp i storslalåm etter en skuffende sesongåpning i Sölden. Nina Astner er igjen skadet – denne gangen med en delvis korsbåndskade – etter at hun allerede mistet Sölden-rennet. Blant slalåmistene er Katharina Liensberger og Katharina Gallhuber fortsatt ute med skader, og det er Katharina Truppe som leder an. Scheib vant storslalåm-cupen forrige sesong og er høymotivert for å ta revansj etter sesongstarten.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/contingente-ridotto-per-il-wunderteam-scheib-vuole-il-riscatto-a-killington-ancora-out-astner-truppe-guida-le-slalomiste","pub_date":"2026-11-25T12:20:00.000Z","fetched_at":"2026-11-25 12:30:02","lang_orig":"it","category":null,"athletes":"Julia Scheib,Katharina Truppe,Nina Astner","athlete_nations":["AUT","GER"],"also_sources":[],"norwegian":false},{"id":233555,"source_name":"Ski Racing","country":"INT","title_no":"PwC Tremblant verdenscup avlyst på grunn av manglende snøproduksjon","title_orig":"PwC Tremblant World Cup Canceled After Limited Snowmaking Windows","summary_no":"Verdenscuprennet i Tremblant er avlyst etter at begrensede muligheter for kunstsnøproduksjon gjorde arrangementet umulig å gjennomføre.","spik_no":"Verdenscuprennet i Mont-Tremblant i Quebec, planlagt til 5. og 6. desember 2026, er avlyst etter at kalde nok perioder for kunstsnøproduksjon har vært svært begrenset de siste ukene. Arrangørene og Alpine Canada konkluderte med at løypekvaliteten ikke ville tilfredsstille FIS sine krav til sikkerhet og konkurransenivå. Avlysningen er et tilbakeslag særlig for kanadiske utøvere, som skulle ha fått konkurrere foran hjemmepublikum. Tremblant har vært en fast del av verdenscupkalenderen og pleier å trekke stor interesse i det alpininteresserte Quebec.","url":"https://skiracing.com/pwc-tremblant-world-cup-canceled-after-limited-snowmaking-windows/","pub_date":"2026-11-25T12:19:46.000Z","fetched_at":"2026-11-25 12:30:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":233410,"source_name":"SkinEWS","country":"SUI","title_no":"EC: Perfekt sesongstart for Hugo Desgrippes","title_orig":"EC: Perfekter Saisonstart für Hugo Desgrippes","summary_no":"Hugo Desgrippes leverte en imponerende start på sesongen i europacupen og slo til med en perfekt åpning.","spik_no":"Den franske slalåmkjøreren Hugo Desgrippes vant åpningsrennet i europacupen i Suomu i Finland, og starter dermed sesongen 2026/27 på aller beste vis. 26-åringen tok sin fjerde strake europacup-pall i slalåm på tvers av sesonger, og fortsetter der han slapp etter å ha vunnet den sammenlagte slalåmcupen i europacupen forrige sesong. Desgrippes er et av de fremste navnene i europacupen på tekniske disipliner, og har ambisjoner om å etablere seg på verdenscupnivå.","url":"https://www.skinews.ch/news/2026/perfekter-saisonstart-desgrippes/","pub_date":"2026-11-25T12:00:24.000Z","fetched_at":"2026-11-25 12:15:03","lang_orig":"de","category":null,"athletes":"Hugo Desgrippes","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":233032,"source_name":"Neveitalia","country":"ITA","title_no":"Desgrippes vant første Europa Cup-slalåm i Suomu","title_orig":"Hugo Desgrippes non sbaglia, è francese il primo slalom di Coppa Europa a Suomu; top ten per Pizzato e Barbera","summary_no":"Hugo Desgrippes sikret fransk seier i det første Europa Cup-slalåmrennet i Suomu. Pizzato og Barbera tok seg inn på topp ti.","spik_no":"Den 26 år gamle franskmannen Hugo Desgrippes vant det første Europa Cup-slalåmrennet i finske Suomu, og tok dermed sin andre seier totalt i Europa Cup-sirkuset. Han ledet etter første omgang og holdt unna for svenske Wissting, som tok andreplassen, mens unge norske Kvael fulgte på tredjeplass. For Italia ble Stefano Pizzato nummer syv og Corrado Barbera nummer ti etter en sterk opphenting. Det kjøres et nytt slalåmrenn i Suomu torsdag.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/hugo-desgrippes-non-sbaglia-e-francese-il-primo-slalom-di-coppa-europa-a-suomu-top-ten-per-pizzato-e-barbera","pub_date":"2026-11-25T11:40:00.000Z","fetched_at":"2026-11-25 11:45:02","lang_orig":"it","category":null,"athletes":"Gustav Wissting,Stefano Pizzato","athlete_nations":["ITA","SWE"],"also_sources":[],"norwegian":false},{"id":232907,"source_name":"ORF Sport","country":"AUT","title_no":"Nina Astner pådro seg korsbåndskade under trening","title_orig":"Nina Astner erlitt im Training Kreuzbandeinriss","summary_no":"Den østerrikske alpinisten Nina Astner har pådratt seg et korsbåndsbrudd under trening.","spik_no":"Østerrikske Nina Astner har pådratt seg et fremre korsbåndsbrudd under storslalåmtrening i Østerrike, og må dermed stå over resten av sesongen. Den 26 år gamle tiroleren var allerede uheldig i høst, da et treningsfall i oktober ga henne en benbruise i høyre legg som gjorde at hun gikk glipp av sesongåpningen i Sölden. Skaden kommer på et dårlig tidspunkt for Østerrike, som nå stiller med et svekket lag i teknikkdisiplinene fremover.","url":"https://sport.orf.at/stories/3165415/","pub_date":"2026-11-25T11:27:55.000Z","fetched_at":"2026-11-25 11:30:07","lang_orig":"de","category":null,"athletes":"Nina Astner","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":232686,"source_name":"SkinEWS","country":"SUI","title_no":"Kneskade tvinger Nina Aster til pause","title_orig":"Eine Knieverletzung zwingt Nina Aster zu einer Pause","summary_no":"Nina Aster må ta en pause fra konkurransene etter å ha pådratt seg en kneskade.","spik_no":"Nina Astner må stå over Verdenscup-helgen i Killington etter å ha pådratt seg en kneskade, og Østerrike stiller dermed med et begrenset lag på kun åtte utøvere totalt for de to rennene i Vermont. Astner er en av de mer lovende østerrikske teknikkutøverne og har vært en del av ÖSV-troppen de siste sesongene. Skaden kommer på et uheldig tidspunkt, tidlig i sesongen, og gjør at hun går glipp av viktige Verdenscup-poeng.","url":"https://www.skinews.ch/news/2026/knieverletzung-zwingt-aster/","pub_date":"2026-11-25T11:11:00.000Z","fetched_at":"2026-11-25 11:15:04","lang_orig":"de","category":null,"athletes":"Nina Astner","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":232670,"source_name":"Neveitalia","country":"ITA","title_no":"G.S. Fiamme Gialle henter sju nye utøvere – blant dem D'Antonio og Zorzi","title_orig":"Il G.S. Fiamme Gialle accoglie altri sette atleti: tra di loro Giada D'Antonio, Sofia Amigoni, Edoardo Zorzi e Marco Pinzani","summary_no":"Det italienske idrettslaget G.S. Fiamme Gialle har tatt opp sju nye utøvere, deriblant Giada D'Antonio, Sofia Amigoni, Edoardo Zorzi og Marco Pinzani.","spik_no":"Det italienske militæridrettslaget G.S. Fiamme Gialle har tatt opp sju nye utøvere fra vinteridrettene, blant dem alpinistene Giada D'Antonio (f. 2009) og Edoardo Zorzi, samt sofía Amigoni og Marco Pinzani. Fiamme Gialle, tilknyttet den italienske finansvakten Guardia di Finanza, er en av de viktigste støtteordningene for italienske vinteridrettsutøvere og gir unge talenter mulighet til å kombinere en militær karriere med toppidrett. Opptaket skjer gjennom en seleksjonsprosess der internasjonale og nasjonale resultater er avgjørende, og representerer en betydelig trygghet for utøvere som ellers ville hatt begrenset finansiering.","url":"https://www.neveitalia.it/sport/eventi/news/il-gs-fiamme-gialle-accoglie-altri-sette-atleti-tra-di-loro-giada-d-antonio-sofia-amigoni-edoardo-zorzi-e-marco-pinzani","pub_date":"2026-11-25T11:10:00.000Z","fetched_at":"2026-11-25 11:15:02","lang_orig":"it","category":"naert","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":232129,"source_name":"Neveitalia","country":"ITA","title_no":"Italia satser på Franzoni og Paris i super-G i Copper","title_orig":"Definito l'ottovolante azzurro per il super-g di Copper, si punta su Franzoni e Paris. Gigantisti, stesse scelte di Soelden","summary_no":"Det italienske alpinlandslaget har tatt ut troppen til super-G i Copper, med Franzoni og Paris i fokus. I storslalåm velges samme lag som i Sølden.","spik_no":"Italia stiller med åtte utøvere i super-G i Copper Mountain, der Dominik Paris og Giovanni Franzoni er de fremste satsingene. Paris er en av tidenes mest meritterte italienske utfartskjørere med over 20 World Cup-seire og VM-gull i utfor, men har slitt med skader de siste sesongene. Franzoni er et av de store unge talentene i det italienske landslaget. Copper Mountain-rennene markerer starten på fartsdisiplinene for herrer i World Cup-sesongen 2025/26.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/definito-l-ottovolante-azzurro-per-il-super-g-di-copper-si-punta-su-franzoni-e-paris-gigantisti-stesse-scelte-di-soelden","pub_date":"2026-11-25T10:15:00.000Z","fetched_at":"2026-11-25 10:30:02","lang_orig":"it","category":null,"athletes":"Dominik Paris,Giovanni Franzoni","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":231269,"source_name":"Neveitalia","country":"ITA","title_no":"Desgrippes dominerte første omgang i Europacup-åpningen i Suomu – Pizzato leverte solid","title_orig":"Desgrippes fa il vuoto nella 1^ manche che apre la Coppa Europa maschile a Suomu: positivo Pizzato","summary_no":"Desgrippes tok kommandoen i første omgang da herrenes Europacup åpnet i Suomu. Pizzato leverte en positiv innsats.","spik_no":"Franskmannen Hugo Desgrippes dominerte første omgang av Europacup-åpningen i finske Suomu, med 45 hundredeler ned til rumenske Nickco Palamaras på andreplass og norske Elias Kvael på tredjeplass. Desgrippes, født i 2000, har tidligere vunnet i Europacup-kretsen, blant annet i Baqueira-Beret forrige sesong, og regnes som et av de fremste talentene i den franske alpinlandslaget-pipelinen. Italienske Pizzato leverte en solid innsats med sjuendeplass etter første omgang, mens den avgjørende andreetappen starter klokken 12.00.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/desgrippes-fa-il-vuoto-nella-1-manche-che-apre-la-coppa-europa-maschile-a-suomu-positivo-pizzato","pub_date":"2026-11-25T09:00:00.000Z","fetched_at":"2026-11-25 09:15:02","lang_orig":"it","category":null,"athletes":"Nickco Palamaras,Stefano Pizzato","athlete_nations":["GER","ITA"],"also_sources":[],"norwegian":false},{"id":231362,"source_name":"RTV SLO","country":"SLO","title_no":"Damenes storslalom i Tremblant avlyst på grunn av snømangel","title_orig":"Ženska veleslaloma v Tremblantu odpadla zaradi premalo snega","summary_no":"Begge damenes storslalomrenn i Tremblant er avlyst etter at det viste seg å være for lite snø.","spik_no":"Begge damenes storslalomrenn i Mont-Tremblant i Canada er avlyst fordi det er for lite snø på løypene. Tremblant har vært en fast post på verdenscupkalenderen for damer, og avlysninger på grunn av snømangel understreker en vedvarende utfordring for vintersportarrangementer i Nord-Amerika tidlig i sesongen. Det er foreløpig uklart om rennene vil bli erstattet med alternative arrangement andre steder.","url":"https://www.rtvslo.si/sport/zenska-veleslaloma-v-tremblantu-odpadla-zaradi-premalo-snega/801171","pub_date":"2026-11-25T08:58:26.000Z","fetched_at":"2026-11-25 09:15:05","lang_orig":"sl","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230589,"source_name":"Neveitalia","country":"ITA","title_no":"Norge med stjerner og striper: Moeller og McGrath angriper i Copper, Stjernesund er spissen i Killington","title_orig":"Norvegia a... stelle e strisce: i vichinghi all'attacco di Copper con Moeller e McGrath, a Killington la punta è Stjernesund","summary_no":"Det norske alpinlandslaget stiller med amerikanskfødte profiler i Copper Mountain, mens Thea Louise Stjernesund er Norges fremste kort i Killington.","spik_no":"Det norske alpinlandslaget stiller med amerikanskfødte profiler Fredrik Moeller og Atle Lie McGrath i Copper Mountain, mens Thea Louise Stjernesund er Norges fremste kort i storslalåm i Killington. Moeller, født i 2000 og oppvokst i USA, er spesialist i super-G og ventes endelig fri fra fysiske problemer, mens McGrath deltar i storslalåm sammen med Haugan og Kristoffersen. Aleksander Aamodt Kilde, som skadet seg alvorlig nettopp i Copper Mountain for to sesonger siden, er ikke med i troppen.","url":"https://www.neveitalia.it/sport/scialpino/news/norvegia-a-stelle-e-strisce-i-vichinghi-all-attacco-di-copper-con-moeller-e-mcgrath-a-killington-la-punta-e-stjernesund","pub_date":"2026-11-25T08:35:00.000Z","fetched_at":"2026-11-25 08:38:15","lang_orig":"it","category":null,"athletes":"Atle Lie McGrath,Thea Louise Stjernesund","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":230605,"source_name":"SkinEWS","country":"SUI","title_no":"Europacup-slalåm for menn i Suomu (FIN) – direkte","title_orig":"Europacup-Slalom der Männer in Suomu (FIN) live","summary_no":"Europacup-slalåmen for menn i Suomu i Finland sendes direkte.","spik_no":"Det kjøres Europacup-slalåm for menn i Suomu i Finland onsdag 25. november. Suomu er et lite alpinsenter i Lappland og har vært en fast arrangørsted i Europacupen, som fungerer som den nest høyeste nivået i internasjonal alpinsport under verdenscupen. For mange unge løpere er Europacupen den viktigste arenaen for å kjempe seg opp mot verdenscupnivå.","url":"https://www.skinews.ch/video/2026/europacup-slalom-maenner-suomu/","pub_date":"2026-11-25T08:28:28.000Z","fetched_at":"2026-11-25 08:38:17","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230645,"source_name":"ORF Sport","country":"AUT","title_no":"Damereslaløpene i Mont-Tremblant avlyst","title_orig":"Damen-Riesentorläufe in Mont-Tremblant abgesagt","summary_no":"Damenesenes storslalåmrenn i Mont-Tremblant er avlyst.","spik_no":"De to planlagte verdenscup-storslalåmrennene for kvinner i Mont-Tremblant 5. og 6. desember er avlyst på grunn av snømangel. FIS bekreftet avlysningen onsdag og opplyser at det jobbes med å finne en erstatningsarena. Neste helg er det Killington som står for tur med storslalåm lørdag og slalåm søndag, før sesongens første fartsuker i Beaver Creek venter 11.–13. desember.","url":"https://sport.orf.at/stories/3165408/","pub_date":"2026-11-25T07:37:12.000Z","fetched_at":"2026-11-25 08:38:18","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230591,"source_name":"Neveitalia","country":"ITA","title_no":"Ingen snø i Mont-Tremblant – nok en bitter avlysning. FIS jobber med plan B","title_orig":"Non c'è neve a Mont-Trémblant, come nel 2024 è una cancellazione amarissima. La FIS lavora al piano B, ma...","summary_no":"Mangel på snø tvinger frem en ny avlysning i Mont-Tremblant, akkurat som i 2024. FIS jobber med en alternativ løsning.","spik_no":"De to verdenscup-storslalåmrennene for kvinner i Mont-Tremblant er avlyst for andre gang på tre sesonger – også i 2024 ble Canada-etappen strøket på grunn av snømangel. FIS hadde planlagt snøkontroll torsdag, men gikk ut med avlysningen allerede onsdag morgen fordi prognosene var for dårlige. Forbundet jobber nå med en plan B og forsøker å finne en erstatningsarena til de samme datoene 5.–6. desember, før fartsuken i Beaver Creek.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/non-c-e-neve-a-mont-tremblant-come-nel-2024-e-una-cancellazione-amarissima-la-fis-lavora-al-piano-b-ma","pub_date":"2026-11-25T07:25:00.000Z","fetched_at":"2026-11-25 08:38:15","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230627,"source_name":"VG","country":"NOR","title_no":"Verdenscuprenn avlyst etter snømangel","title_orig":"Verdenscuprenn avlyst etter snømangel","summary_no":"","spik_no":"Verdenscuprennene i storslalåm for kvinner i Mont-Tremblant 5. og 6. desember er avlyst på grunn av snømangel. FIS oppgir at snøkanonene kjøres på nattestid, men at plussgrader og lett regn om dagen gjør det umulig å bygge opp løypa. Forbundet jobber med å finne en alternativ arrangørby for de to rennene. Neste helg kjører alpinkvinnene storslalåm og slalåm i Killington i Vermont.","url":"https://www.vg.no/sport/i/9Bv9br/verdenscuprenn-avlyst-etter-snoemangel?utm_medium=rss","pub_date":"2026-11-25T07:20:52.000Z","fetched_at":"2026-11-25 08:38:18","lang_orig":"no","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230606,"source_name":"SkinEWS","country":"SUI","title_no":"Avlyst – ingen verdenscup-storslalåm i Tremblant","title_orig":"Abgesagt – keine Weltcup-Riesenslaloms in Tremblant","summary_no":"Verdenscup-rennene i storslalåm i Tremblant er avlyst og vil ikke bli gjennomført.","spik_no":"De to verdenscup-storslalåmrennene for kvinner i Mont-Tremblant 5. og 6. desember er avlyst på grunn av utilstrekkelig snø. Snøkanonene har gått for fullt om natten, men plussgrader og regn om dagen har gjort det umulig å forberede løypa på den kjente \"Flying Mile\"-traseen. FIS søker nå etter en alternativ arrangørby for de samme datoene. Avlysningen er en gjentakelse av situasjonen fra 2024, da Canada-etappen også ble strøket.","url":"https://www.skinews.ch/news/2026/abgesagt-riesenslaloms-tremblant/","pub_date":"2026-11-25T07:12:35.000Z","fetched_at":"2026-11-25 08:38:17","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230695,"source_name":"Expressen","country":"SWE","title_no":"Caijsa Hennemann etter dramaet i Polen: – Det var grusomt","title_orig":"Caijsa Hennemann efter dramat i Polen: ”Det var hemskt”","summary_no":"Alpinisten Caijsa Hennemann forteller åpenhjertig om det dramatiske som skjedde under konkurransen i Polen og beskriver opplevelsen som grusom.","spik_no":"Den svenske alpinisten Caijsa Hennemann beskriver opplevelsen fra en konkurranse i Polen som grusom, og forteller åpenhjertig om et dramatisk hendelsesforløp. Hennemann er en av Sveriges mest lovende unge alpinister og har konkurrert på høyt nivå i Europa de siste årene. Detaljer om hva som faktisk skjedde er foreløpig ikke kjent fra artikkelteksten, men Hennemanns egne ord tyder på at episoden var betydelig og preget henne sterkt.","url":"https://www.expressen.se/sport/tennis/caijsa-hennemann-efter-dramat-i-polen-det-var-hemskt/","pub_date":"2026-11-24T22:22:10.000Z","fetched_at":"2026-11-25 08:38:18","lang_orig":"sv","category":null,"athletes":"Caijsa Hennemann","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":227275,"source_name":"Ski Racing","country":"INT","title_no":"Slik hjelper Steamboat Mountain School og Steamboat Springs Winter Sports Club familier med alpint","title_orig":"How Steamboat Mountain School and Steamboat Springs Winter Sports Club Help Families Make Ski Racing Work","summary_no":"Steamboat Mountain School og Steamboat Springs Winter Sports Club tilbyr familier gode rammer for å kombinere skolegang og alpintrening på høyt nivå.","spik_no":"Steamboat Mountain School og Steamboat Springs Winter Sports Club i Colorado tilbyr et integrert opplegg der unge alpinister kan kombinere skolegang og trening på høyt nivå. Steamboat Springs er et av USAs fremste alpinmiljøer og har fostret en rekke landslagsutøvere gjennom nettopp denne modellen, der koordinering mellom akademikere og idrett står sentralt. For familier som Brady-familien fra Cincinnati – uten alpinbakgrunn selv – gir et slikt miljø muligheten til å satse seriøst uten at utøveren må ofre verken utdanning eller fellesskap.","url":"https://skiracing.com/how-steamboat-mountain-school-and-steamboat-springs-winter-sports-club-help-families-make-ski-racing-work/","pub_date":"2026-11-24T18:57:14.000Z","fetched_at":"2026-11-24 19:00:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":225994,"source_name":"Ski Racing","country":"INT","title_no":"Kyle Negomirs VM-drøm startet i bakkene på Copper Mountain","title_orig":"Kyle Negomir’s World Cup Dream Started on This Copper Mountain Hill","summary_no":"Kyle Negomirs vei mot verdenscupen begynte på skibakken på Copper Mountain.","spik_no":"Kyle Negomir fra Littleton, Colorado, er tilbake på Copper Mountain – den samme bakken der han som 8-åring lekte at han kjørte verdenscup. Nå stiller han til start i Stifel Copper Cup super-G 28. november med et ekte verdenscupstoppur. Det er et følelsesladet comeback etter at Negomir fullførte på 10.-plass i OL-utforkjøringen i Bormio – hans olympiske debut. Veien dit gikk gjennom en tung kneskade som holdt ham utenfor Beijing-OL i 2022, der lagkameratene Ryan Cochran-Siegle og River Radamus henholdsvis vant sølv og ble nummer fire i GS.","url":"https://skiracing.com/kyle-negomir-copper-mountain/","pub_date":"2026-11-24T17:26:26.000Z","fetched_at":"2026-11-24 17:30:02","lang_orig":"en","category":null,"athletes":"Kyle Negomir","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":224734,"source_name":"Neveitalia","country":"ITA","title_no":"Rast og Holdener leder det sveitsiske laget i Killington","title_orig":"Rast e Holdener, Killington è sempre stata dolcissima: le punte elvetiche guidano il team anche nel Vermont","summary_no":"Wendy Holdener og Michelle Rast er Sveits' fremste kort i Killington, et sted som alltid har vært godt for sveitsiske alpinister.","spik_no":"Wendy Holdener og Camille Rast leder det sveitsiske laget inn til slalåm og storslalåm i Killington i Vermont denne helgen. Killington har historisk sett vært et godt sted for Sveits: Holdener har stått på pallen i slalåm de fire siste gangene på «Superstar»-løypa, inkludert seier i 2022, mens Rast vant sin aller første verdenscupseier nettopp her i fjor. Rast åpnet sesongen solid i Sölden, men slet noe i andre omgang i storslalåmen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/rast-e-holdener-killington-e-sempre-stata-dolcissima-le-punte-elvetiche-guidano-il-team-anche-nel-vermont","pub_date":"2026-11-24T16:20:00.000Z","fetched_at":"2026-11-24 16:30:02","lang_orig":"it","category":null,"athletes":"Camille Rast,Wendy Holdener","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":224262,"source_name":"SVT Sport","country":"SWE","title_no":"Lisa Nyberg gjør comeback etter 15 måneder: – Kunne ikke bøye beina","title_orig":"Lisa Nyberg gör comeback efter 15 månader: ”Kunde inte böja benen”","summary_no":"Lisa Nyberg er tilbake i konkurranseform etter 15 måneder borte. Svenske alpinisten har slitt med alvorlige skader som gjorde det umulig å bøye beina.","spik_no":"Lisa Nyberg gjør comeback i verdenscupen denne helgen etter 15 måneder borte fra konkurranse. Den 24 år gamle svenske slalåmkjøreren skadet kneet alvorlig under et forsesongstreningsleir i fjor – skaden omfattet korsbåndet, begge meniskene og brusk, og krevde operasjoner på begge bena. Nyberg lå sengeliggende i ukesvis og klarte ikke å bøye beina i den første tiden etter operasjonen. I desember 2025 gjennomgikk hun ytterligere et inngrep, og har gradvis bygget opp styrken gjennom sommeren frem mot comebacket.","url":"https://www.svt.se/sport/alpint/lisa-nyberg-gor-comeback-efter-15-manader-kunde-inte-boja-benen","pub_date":"2026-11-24T15:49:28.000Z","fetched_at":"2026-11-24 16:00:04","lang_orig":"sv","category":null,"athletes":"Lisa Nyberg","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":223776,"source_name":"RTV SLO","country":"SLO","title_no":"Andreja Slokar hopper over amerikaturné: ett skritt tilbake for to fremover","title_orig":"Andreja Slokar izpušča ameriško turnejo: korak nazaj za dva naprej","summary_no":"Slovenske Andreja Slokar velger å stå over den amerikanske alpinturné i et strategisk grep for å komme sterkere tilbake.","spik_no":"Slovenska slalomspesialist Andreja Slokar velger å hoppe over den amerikanske alpinturnen og satser i stedet på å bygge seg opp til resten av sesongen. Slokar er en av Slovenias fremste alpinister og har vunnet World Cup-renn i slalåm, men har slitt med å finne stabilt toppnivå. Et bevisst valg om å stå over renn er uvanlig i alpinsporten, men kan gi gevinst når det gjelder fysisk overskudd og teknisk forberedelse frem mot vinterens viktigste konkurranser.","url":"https://www.rtvslo.si/sport/andreja-slokar-izpusca-amerisko-turnejo-korak-nazaj-za-dva-naprej/801119","pub_date":"2026-11-24T15:16:42.000Z","fetched_at":"2026-11-24 15:30:04","lang_orig":"sl","category":null,"athletes":"Andreja Slokar","athlete_nations":["SLO"],"also_sources":[],"norwegian":false},{"id":222564,"source_name":"Neveitalia","country":"ITA","title_no":"Mange italienske alpinister samlet i Solda til europacuptrening","title_orig":"Solda accoglie tantissimi azzurri: velocisti dei team femminile e maschile di Coppa Europa in pista","summary_no":"Både herrer og damer fra det italienske europacuplaget er i Solda for å trene på pisten.","spik_no":"Det italienske europacuplaget samler både herrer og damer til fartstrening i Solda i Sør-Tirol denne uken. På dameside er blant andre Camilla Vanni, Sofia Parravicini og Ambra Pomaré i arbeid, mens herrelaget med Emanuel Lamp, Leonardo Rigamonti og Pietro Broglio avslutter sitt opphold torsdag 26. november. Solda, som ligger ved foten av Ortler-massivet, er et klassisk italiensk treningssted for alpinister om høsten, og samlingene markerer den siste forberedelsen før europacupsesongen starter.","url":"https://www.neveitalia.it/sport/scialpino/news/solda-accoglie-tantissimi-azzurri-velocisti-dei-team-femminile-e-maschile-di-coppa-europa-in-pista","pub_date":"2026-11-24T13:55:00.000Z","fetched_at":"2026-11-24 14:00:02","lang_orig":"it","category":null,"athletes":"Ambra Pomaré","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":221649,"source_name":"Neveitalia","country":"ITA","title_no":"Tigeren er tilbake: Brignone på ski igjen etter 91 dager","title_orig":"La tigre è tornata, di nuovo! A 91 giorni dall'intervento, Federica Brignone in pista oggi a Cervinia","summary_no":"Federica Brignone er tilbake på ski bare 91 dager etter operasjonen, og trente i dag på pisten i Cervinia.","spik_no":"Federica Brignone er tilbake på ski 91 dager etter en operasjon i venstre bein, der hun fikk fjernet osteosyntesemateriell, og trente mandag på glacieret ved Cervinia i sin hjemregion Valle d'Aosta. Den 35 år gamle italieneren, som vant den samlede verdenscupen i 2020 og 2025 samt to OL-gull i Milano-Cortina 2026, har hatt en svært vanskelig høst — et forsøk på å teste skiene 30. juli gikk ikke bra og utløste beslutningen om ny operasjon. Nordamerika-rundene er trolig uaktuelle, og når hun kan debutere konkurransemessig i sesongen 2026/27 er fortsatt uklart.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/la-tigre-e-tornata-di-nuovo-a-91-giorni-dall-intervento-federica-brignone-in-pista-oggi-a-cervinia","pub_date":"2026-11-24T12:35:00.000Z","fetched_at":"2026-11-24 12:45:02","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":220551,"source_name":"Neveitalia","country":"ITA","title_no":"Her er de italienske kvinnene som utfordrer «Superstjernen»","title_orig":"Ufficiali le azzurre che sfideranno la \"Superstar\": dal rientro di Goggia alla fame di Rossetti, si presenta l'Italdonne","summary_no":"Italia presenterer sitt kvinnelag, med Sofia Goggia tilbake etter skade og en sulten Rossetti klar for utfordringen.","spik_no":"Italia presenterer sitt kvinnelag til verdenscuphelgen i Killington, Vermont, der den ikoniske «Superstar»-løypa er tilbake på programmet etter to års fravær. Høydepunktet er Sofia Goggias sesongdebut — den regjerende olympiske utforkjøringsmesteren har øvet seg opp ved Copper Mountain og er klar for å kjempe i storslalåm lørdag. Italia stiller med elleve startnumre i storslalåm og ni i slalåm, der Marta Bassino og Federica Brignone normalt er lagets fremste kort i tekniske øvelser.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/ufficiali-le-azzurre-che-sfideranno-la-superstar-dal-rientro-di-goggia-alla-fame-di-rossetti-si-presenta-l-italdonne","pub_date":"2026-11-24T11:40:00.000Z","fetched_at":"2026-11-24 11:43:41","lang_orig":"it","category":null,"athletes":"Marta Rossetti,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":220646,"source_name":"Expressen","country":"SWE","title_no":"Ken Fagerberg er død – ble 37 år","title_orig":"Ken Fagerberg är död – blev 37 år","summary_no":"Den svenske alpinisten Ken Fagerberg er død, bare 37 år gammel.","spik_no":"Artikkelteksten handler ikke om alpinisten Ken Fagerberg, men om den svenske fotballspilleren Ken Fagerberg, som ble funnet død i sengen sin på Færøyene mandag, 37 år gammel. Fagerberg fikk sitt gjennombrudd i Örgryte IS i 2007 og spilte senere i flere danske klubber før han vendte tilbake til Sverige. Han har i intervjuer åpent fortalt om problemer med alkohol og rusmidler gjennom karrieren. Dødsårsaken er foreløpig uklar.","url":"https://www.expressen.se/sport/fotboll/ken-fagerberg-ar-dod--blev-37-ar/","pub_date":"2026-11-24T11:29:10.000Z","fetched_at":"2026-11-24 11:43:44","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":220002,"source_name":"Neveitalia","country":"ITA","title_no":"Schwarz dobbeltstart, Eichberger tilbake og Brennsteiners triumfbakke: Østerrike klart for Copper","title_orig":"Doppio impegno per Schwarz, il ritorno di Eichberger e la pista del trionfo di Brennsteiner: ecco l'Austria per Copper","summary_no":"Østerrike stiller med et bredt lag til Copper Mountain, med Schwarz i dobbelt oppdrag, comeback for Eichberger og en bakke der Brennsteiner tidligere har triumfert.","spik_no":"Østerrike stiller med et bredt lag til Copper Mountain, der Marco Schwarz er aktuell i to disipliner og Stefan Eichberger gjør comeback etter en alvorlig kneskade han pådro seg i Val Gardena i desember i fjor. Eichberger, som fyller 26 år nettopp nå, er klar for super-G-åpningen lørdag 28. november. Vincent Kriechmayr, som ble nummer to i Colorado i fjor, gjør sesongdebut, mens veteranen Stefan Brennsteiner stiller i kjempesvingen der han har tatt sin eneste verdenscupseier.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/doppio-impegno-per-schwarz-il-ritorno-di-eichberger-e-la-pista-del-trionfo-di-brennsteiner-ecco-l-austria-per-copper","pub_date":"2026-11-24T11:05:00.000Z","fetched_at":"2026-11-24 11:15:02","lang_orig":"it","category":null,"athletes":"Marco Schwarz,Stefan Brennsteiner","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":219652,"source_name":"SkinEWS","country":"SUI","title_no":"Østerrike stiller med tolv utøvere i Copper Mountain","title_orig":"Österreich in Copper Mountain mit einem Dutzend Athleten am Start","summary_no":"Det østerrikske alpinlandslaget stiller med et dusin utøvere til konkurransene i Copper Mountain.","spik_no":"Østerrike stiller med tolv utøvere totalt i Copper Mountain, der det er satt opp Super-G lørdag og storslalåm søndag 28.–29. november. Patrick Feurstein er blant de få som er nominert til begge renn, og han sikret den siste startplassen i Super-G. Det øste mars 2026 er et realistisk mål etter achillesseneskaden han pådro seg i Chile. 34-åringen var gjest på ServusTV og avviste tidlig enhver tanke om karriereslutt – dette til tross for at det er hans andre alvorlige skade på under tre år, etter knetragedien i Wengen i januar 2024. Kvitfjell-rennene 6.–7. mars er de siste fartsdistansene før verdenscupfinalen, og Kilde ser på dem som en mulig oppkjøring mot neste sesong.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/da-kilde-arrivano-ottime-notizie-potrebbe-rientrare-per-la-tappa-di-kvitfjell-a-marzo-e-un-opzione-realistica","pub_date":"2026-11-24T10:05:00.000Z","fetched_at":"2026-11-24 10:15:03","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":218369,"source_name":"Neveitalia","country":"ITA","title_no":"SKI-TEST: Völkls nyheter for neste sesong","title_orig":"SKI TEST: le novità della prossima stagione in casa Völkl","summary_no":"En gjennomgang av Völkls nye skimodeller og nyheter som er klare for kommende sesong.","spik_no":"Völkl presenterer nye skimodeller for sesongen 2026/27, og det italienske testpanelet NeveItalia har prøvekjørt elleve modeller fra produsentens sortiment. Høydepunktet er den nye Racetiger GS Master, en racingski med opphav fra konkurranseavdelingen, som beskrives som svært stabil i høy fart, men krever god teknikk og fysisk form. Racetiger SL og den nye allround-modellen Racetiger MC Blue mottar begge utmerkelsen «Valgt av testerne» — for henholdsvis kjøreegenskaper og komfort. Völkl er et av de store alpinmerkene med lang tradisjon innen både konkurranseski og breddemarkedet.","url":"https://www.neveitalia.it/test/news/ski-test-le-novita-della-prossima-stagione-in-casa-volkl","pub_date":"2026-11-24T09:10:00.000Z","fetched_at":"2026-11-24 09:15:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":218063,"source_name":"ORF Sport","country":"AUT","title_no":"Kilde planlegger comeback som forløper i Kvitfjell","title_orig":"Kilde plant Comeback als Vorläufer in Kvitfjell","summary_no":"Aleksander Aamodt Kilde planlegger å gjøre comeback som forløper under rennet i Kvitfjell.","spik_no":"Aleksander Aamodt Kilde planlegger å komme tilbake på verdenstoppen som forløper under Kvitfjell-rennet 6. eller 7. mars 2027. 34-åringen pådro seg et achillessenebrudd under trening i Chile i midten av oktober, og sier rehabiliteringen går fremover – han kan nå trene med større vekter og bevege seg mer fritt. Kilde, som har 21 verdenscupseire og to OL-medaljer, har vært hardt rammet av skader de siste årene; senest et alvorlig fall i Wengen-utforkjøringen i januar 2024 som skadet både legg og skulder.","url":"https://sport.orf.at/stories/3165363/","pub_date":"2026-11-24T08:47:54.000Z","fetched_at":"2026-11-24 09:00:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":["RTV SLO"],"norwegian":true},{"id":217842,"source_name":"SkinEWS","country":"SUI","title_no":"Nick Rickenbach (21) velger ny vei utenfor løypene","title_orig":"Nick Rickenbach (21) schlägt einen neuen Weg abseits der Pisten ein","summary_no":"Den 21 år gamle alpinisten Nick Rickenbach har valgt å legge om kursen og satser på noe nytt utenfor skibakken.","spik_no":"Den 21 år gamle sveitsiske alpinisten Nick Rickenbach legger opp på grunn av helseproblemer, og avslutter dermed en kort karriere i ung alder. Rickenbach, som kommer fra Schwyz og konkurrerte i de raske disiplinene samt storslalåm, var en del av Swiss Skis C-lag. Han beskriver det selv som en «vanskelig, følelsesmessig krevende, men riktig avgjørelse». C-laget i Sveits er et utviklingsprogram for unge lovende utøvere, og det er uvanlig å avslutte karrieren så tidlig i denne fasen.","url":"https://www.skinews.ch/news/2026/rickenbach-schlaegt-abseits/","pub_date":"2026-11-24T08:41:43.000Z","fetched_at":"2026-11-24 08:45:03","lang_orig":"de","category":null,"athletes":"Nick Rickenbach","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":217645,"source_name":"Neveitalia","country":"ITA","title_no":"Via Buffalo mot Killington: De italienske alpinistene krysser USA foran lørdagens storslalåm","title_orig":"Volo su Buffalo e poi direzione Killington: le azzurre attraversano gli Stati Uniti verso il gigante di sabato","summary_no":"De italienske alpinistjentene er på vei til Killington via Buffalo for å forberede seg til lørdagens storslalåmrenn i USA.","spik_no":"Det italienske alpinlandslaget for kvinner er på vei til Killington i Vermont via Buffalo, der de skal delta i verdenscupens storslalåm lørdag. Kvartetten – Asja Zenere, Marta Bassino, Laura Pirovano og Sofia Goggia – har tilbrakt nesten to uker på treningssenteret i Copper Mountain i Colorado. Killington har en særlig plass i italiensk alpinhistorie: Bassino vant her i 2019, og Goggia tok sitt første verdenscuppall på denne bakken for ti år siden. Zenere gikk inn i reisen som lagets beste i åpningsrennet i Sölden.","url":"https://www.neveitalia.it/sport/scialpino/news/volo-su-buffalo-e-poi-direzione-killington-le-azzurre-attraversano-gli-stati-uniti-verso-il-gigante-di-sabato","pub_date":"2026-11-24T08:25:00.000Z","fetched_at":"2026-11-24 08:30:02","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":216202,"source_name":"Neveitalia","country":"ITA","title_no":"Sveriges nordamerikanske kampanje: Lisa Nyberg tilbake for tre storslalåmrenn","title_orig":"La campagna nordamericana della Svezia: torna Lisa Nyberg per i 3 giganti, Hector fu \"Superstar\" nel 2024","summary_no":"Sverige innleder sin nordamerikanske kampanje med Lisa Nyberg tilbake i troppen, mens Hector var en «Superstar» under 2024-sesongen.","spik_no":"Lisa Nyberg er tilbake i den svenske troppen etter over halvannet år med fravær, og skal delta i tre storslalåmrenn i Nord-Amerika – i Killington og Mont-Tremblant. Nyberg er datter av den tidligere alpinisten Pernilla Wiberg, som vant OL-gull og VM-titler på 1990-tallet. Sara Hector, som hadde en strålende sesong i 2024, leder an i det svenske kvinnelaget i storslalåm og kommer til Nord-Amerika i storform etter gode resultater i Gurgl. Felix Monsen er Sveriges fremste kort på herresiden i de raske disiplinene i Copper Mountain og Beaver Creek.","url":"https://www.neveitalia.it/sport/scialpino/news/la-campagna-nordamericana-della-svezia-torna-lisa-nyberg-per-i-3-giganti-hector-fu-superstar-nel-2024","pub_date":"2026-11-24T06:55:00.000Z","fetched_at":"2026-11-24 07:00:02","lang_orig":"it","category":null,"athletes":"Sara Hector","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":210754,"source_name":"Ski Racing","country":"INT","title_no":"Dr. Haley Perlus om mental trening i alpint","title_orig":"Dr. Haley Perlus on Training the Mental Side of Ski Racing","summary_no":"Dr. Haley Perlus deler sin ekspertise om hvordan alpinister kan trene den mentale siden av skiracing for å prestere bedre i konkurranser.","spik_no":"Dr. Haley Perlus, som har en PhD i idrettspsykologi, blir ny fast bidragsyter for Ski Racing Media og vil dele ekspertise om mental trening i alpint. Perlus har lang erfaring med å jobbe med utøvere på alle nivåer, og artikkelen peker på at mental trening fortsatt innføres for sent i mange utøveres karriere — ofte først etter skader. Idrettspsykologi har fått stadig større plass i toppidretten, men i alpint er fagfeltet ifølge bidragsyteren fremdeles underutnyttet i den daglige treningsstrukturen.","url":"https://skiracing.com/dr-haley-perlus-on-training-the-mental-side-of-ski-racing/","pub_date":"2026-11-24T00:43:22.000Z","fetched_at":"2026-11-24 00:45:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":207978,"source_name":"Ski Racing","country":"INT","title_no":"Killington World Cup Foundation deler ut over 250.000 dollar i ski-stipender","title_orig":"Killington World Cup Foundation Awards $250K+ in Ski Grants","summary_no":"Killington World Cup Foundation har tildelt mer enn 250.000 dollar i stipender til skiidretten.","spik_no":"Killington World Cup Foundation har tildelt over 250.000 dollar i stipender til 12 skiområder og ideelle organisasjoner i fem nordøstlige delstater i USA. En uvanlig finansieringskilde bidro tungt: 150.000 dollar kom fra salget av de originale gondolkabinene fra Skyeship-taubanen, som ble auksjonert bort sommeren 2025. Stiftelsen, som er knyttet til verdenscuprennet Stifel Killington Cup, bidro med ytterligere 100.000 dollar fra egne midler etter å ha gjennomgått hele 44 søknader. Midlene skal blant annet dekke taubane-reparasjoner, ny løypeprepperingsmaskin og snøproduksjonsutstyr.","url":"https://skiracing.com/killington-world-cup-foundation-grants-2026/","pub_date":"2026-11-23T21:38:34.000Z","fetched_at":"2026-11-23 21:45:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206655,"source_name":"Neveitalia","country":"ITA","title_no":"Blir Colturi Shiffrins største rival i søndagens slalåm i Killington?","title_orig":"Sarà Colturi la prima rivale di Shiffrin domenica? Probabile, Mikaela resta la grande favorita per lo slalom di Killington","summary_no":"Lara Colturi pekes ut som den fremste utfordreren til Mikaela Shiffrin i slalåmen i Killington søndag, men Shiffrin er fortsatt klar favoritt.","spik_no":"Lara Colturi ble utpekt som den fremste utfordreren til Mikaela Shiffrin foran slalåmen i Killington. Den 20 år gamle Colturi, som kjører for Albania, imponerte tidlig i sesongen med sterke resultater i slalåm og viste i Sölden at hun kan matche verdens beste. Shiffrin har historisk dominert på Killington, der hun har vunnet en rekke ganger og det amerikanske hjemmepublikumet alltid møter henne med enorm begeistring.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sara-colturi-la-prima-rivale-di-shiffrin-domenica-probabile-mikaela-resta-la-grande-favorita-per-lo-slalom-di-killington","pub_date":"2026-11-23T19:30:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":"Lara Colturi,Mikaela Shiffrin","athlete_nations":["ALB","USA"],"also_sources":[],"norwegian":false},{"id":206635,"source_name":"Ski Racing","country":"INT","title_no":"FIS godkjenner herrerenn i Beaver Creek i 2026","title_orig":"FIS Clears 2026 Men’s Stifel Birds of Prey Races at Beaver Creek","summary_no":"FIS har gitt klarsignal for Stifel Birds of Prey-rennene for menn i Beaver Creek i 2026-sesongen.","spik_no":"FIS ga grønt lys for Stifel Birds of Prey-rennene for menn i Beaver Creek i 2026-sesongen. Beaver Creek er en av de mest tradisjonsrike arenaene på herresirkusen, og Birds of Prey-løypen regnes som en av de mest krevende utforløypene i verdenscupen. Godkjenningen fra FIS var avhengig av at snø- og banestandarder ble oppfylt innen fastsatte frister, noe arrangørene altså klarte.","url":"https://skiracing.com/fis-clears-2026-mens-stifel-birds-of-prey-races-at-beaver-creek/","pub_date":"2026-11-23T18:29:22.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206657,"source_name":"Neveitalia","country":"ITA","title_no":"Sarrazin klar for comeback – ni franskmenn tatt ut til lørdag, én debutant fra Kroatia","title_orig":"Sarrazin, è tutto pronto per il gran rientro: \"Cyp\" tra i 9 francesi convocati per sabato, un esordiente nella Croazia","summary_no":"Cyprien Sarrazin er blant ni franske utøvere tatt ut til lørdagens renn, og Kroatia stiller med en debutant.","spik_no":"Cyprien Sarrazin var blant ni franske utøvere tatt ut til lørdagens renn i Beaver Creek, og comebacket hans ble fulgt med stor interesse. Den franske fartskjøreren har vært en av de mest spennende profilene i verdenscupen og har tidligere vist seg som en utfordrer i både utfor og super-G. I tillegg stilte Kroatia med en debutant, noe som understreker at alpinsporten stadig rekrutterer utøvere fra nye nasjoner.","url":"https://www.neveitalia.it/sport/scialpino/news/sarrazin-e-tutto-pronto-per-il-gran-rientro-cyp-tra-i-9-francesi-convocati-per-sabato-un-esordiente-nella-croazia","pub_date":"2026-11-23T18:15:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":206712,"source_name":"ORF Sport","country":"AUT","title_no":"Sarrazin tatt ut til super-G i Copper Mountain","title_orig":"Sarrazin für Super-G in Copper Mountain nominiert","summary_no":"Franske Cyprien Sarrazin er nominert til super-G-rennet i Copper Mountain i verdenscupen.","spik_no":"Cyprien Sarrazin er nominert til super-G-rennet i Copper Mountain og gjør dermed sitt etterlengtede comeback i alpint verdenscup, nesten to år etter at han pådro seg en hjerneblødning under en treningsulykke i Bormio i desember 2024. Den 32 år gamle franskmannen var blant verdens beste fartskjørere før skaden og vant begge utfor-rennene i Kitzbühel i 2024. Rennet i Copper Mountain lørdag blir hans første verdenscupstart siden ulykken.","url":"https://sport.orf.at/stories/3165353/","pub_date":"2026-11-23T18:12:14.000Z","fetched_at":"2026-11-23 19:52:44","lang_orig":"de","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":206714,"source_name":"ORF Sport","country":"AUT","title_no":"ØSV-laget håper på «oversjøisk effekt»","title_orig":"ÖSV-Team hofft auf „Übersee-Effekt“","summary_no":"Det østerrikske alpinlandslaget håper at rennene i USA vil gi dem en positiv «oversjøisk effekt» og bedre resultater.","spik_no":"Det østerrikske alpinlandslaget har hatt en skuffende sesongstart og sitter med kun én pallplass etter seks renn – Katharina Truppes tredjeplass i slalomen i Levi. I Gurgl endte damenes slalom uten østerrikere i topp ti, noe alpinsjef Christian Mitter betegnet som et negativt lavpunkt. Laget håper nå på en såkalt \"oversjøisk effekt\" når de reiser til Nord-Amerika, en effekt som historisk sett har gitt mange lag et løft utenfor hjemmebane. Joshua Sturm pekes ut som en av de lyspunktene fra en ellers vanskelig sesongstart.","url":"https://sport.orf.at/stories/3165328/","pub_date":"2026-11-23T17:59:39.000Z","fetched_at":"2026-11-23 19:52:44","lang_orig":"de","category":null,"athletes":"Katharina Truppe","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":206768,"source_name":"RTV SLO","country":"SLO","title_no":"Sarrazin tilbake i verdenscupen etter nesten to år","title_orig":"Sarrazin se po skoraj dveh letih vrača na tekme svetovnega pokala","summary_no":"Den franske alpinisten Sarrazin gjør comeback i verdenscupen etter en fravær på nesten to år.","spik_no":"Franske Cyprien Sarrazin er klar for comeback i verdenscupen nesten to år etter et alvorlig fall under trening i Bormio i desember 2024, der han pådro seg blant annet en hjerneblødning. Sarrazin var i 2024 en av alpinens mest formsterke utøvere og vant to påfølgende utfor-renn i Kitzbühel. Comebacket markerer slutten på en lang og krevende rehabiliteringsprosess for 32-åringen, som nå er nominert til super-G i Copper Mountain.","url":"https://www.rtvslo.si/sport/sarrazin-se-po-skoraj-dveh-letih-vraca-na-tekme-svetovnega-pokala/801030","pub_date":"2026-11-23T17:49:56.000Z","fetched_at":"2026-11-23 19:52:45","lang_orig":"sl","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":206716,"source_name":"ORF Sport","country":"AUT","title_no":"Grønt lys for verdenscuprenn i Beaver Creek","title_orig":"Grünes Licht für Weltcup-Bewerbe in Beaver Creek","summary_no":"Verdenscuprennene i Beaver Creek er offisielt godkjent og klare til gjennomføring.","spik_no":"FIS har godkjent snøf
