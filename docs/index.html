:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":28576,"source_name":"Neveitalia","country":"ITA","title_no":"Fire nye dager på Stelvio for Ambra Pomaré – også fem Europa Cup-fartskjørere på breen","title_orig":"Altri quattro giorni allo Stelvio per Ambra Pomaré, sul ghiacciaio pure un quintetto di velocisti del team Coppa Europa","summary_no":"Ambra Pomaré fortsetter treningskjøringen på Stelvio-breen i ytterligere fire dager. Også en gruppe på fem fartskjørere fra Europa Cup-laget er på plass på isbreen.","spik_no":"Ambra Pomaré, den italienske alpinisten født i 2004, fortsetter rehabiliteringen på Stelvio-breen mellom 15. og 18. oktober etter en alvorlig skade hun pådro seg i februar – da hun styrtet som løypeåpner under olympisk prøvegigantslalom hjemme i Cortina. Treningskjøringen skjer under veiledning av coach Weiss som del av et individuelt rehabiliteringsopplegg. Samtidig er fem Europa Cup-fartskjørere – Lamp, Ruffinoni, Antonioli, Broglio og Rigamonti – på Stelvio frem til 20. oktober under ledelse av teknisk direktør Max Carca.","url":"https://www.neveitalia.it/sport/scialpino/news/altri-quattro-giorni-allo-stelvio-per-ambra-pomare-sul-ghiacciaio-pure-un-quintetto-di-velocisti-del-team-coppa-europa","pub_date":"2026-10-14T10:00:00.000Z","fetched_at":"2026-10-14 10:15:01","lang_orig":"it","category":null,"athletes":"Ambra Pomaré","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":27875,"source_name":"Neveitalia","country":"ITA","title_no":"Brignone åpner seg før comeback: «I Cervinia hadde jeg smerter i hver sving»","title_orig":"Brignone si apre prima del ritorno: \"A Cervinia dolore ad ogni curva, ora miglioro. Shiffrin? Mi è già capitato di non capire le sue scelte\"","summary_no":"Federica Brignone forteller om smertene hun slet med i Cervinia, og sier hun nå er i bedring. Hun kommenterer også Shiffrins valg.","spik_no":"Federica Brignone åpner seg om smertene hun slet med under Cervinia-rennene, der hun forteller at hun hadde vondt i hver eneste sving. Den italienske dobbeltvinneren fra OL i Milano-Cortina 2026 er fortsatt i rekonvalesens, men melder at bedringen er på vei, og comeback er ventet om et par uker. I intervjuet kommenterer hun også at hun ikke alltid har forstått Mikaela Shiffrins valg — noe hun sier heller ikke er nytt, siden hun reagerte på det samme da Shiffrin trakk seg fra Coppa del Mondo-kampen i 2024, som Brignone til slutt vant.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/brignone-si-apre-prima-del-ritorno-a-cervinia-dolore-ad-ogni-curva-ora-miglioro-shiffrin-mi-e-gia-capitato-di-non-capire-le-sue","pub_date":"2026-10-14T06:40:00.000Z","fetched_at":"2026-10-14 08:45:04","lang_orig":"it","category":null,"athletes":"Federica Brignone,Mikaela Shiffrin","athlete_nations":["ITA","USA"],"also_sources":[],"norwegian":false},{"id":25650,"source_name":"Ski Racing","country":"INT","title_no":"Zermatt sikter mot VM-Cup-comeback i mars 2028 på Gornergrat","title_orig":"Zermatt World Cup Comeback Targets March 2028 on Gornergrat","summary_no":"Zermatt planlegger å gjenoppta verdenscuprennet i alpint på Gornergrat i mars 2028.","spik_no":"Zermatt og Swiss-Ski planlegger et herrenesutforrenn på Gornergrat i mars 2028, etter at alle åtte planlagte renn på Gran Becca-løypen ble avlyst i 2022- og 2023-sesongen. Den opprinnelige Matterhorn Cervino Speed Opening-løypen krysset grensen mellom Sveits og Italia, men ble rammet av regn og snømangel som gjorde nedre del av løypen uforsvarlig. Det nye alternativet legger rennet på norsk jord alene, fra Gornergrat, og er foreløpig oppført på FIS sin provisoriske kalender for 2027–28 – men godkjenning gjenstår.","url":"https://skiracing.com/zermatt-world-cup-comeback-targets-march-2028-on-gornergrat/","pub_date":"2026-10-13T21:02:12.000Z","fetched_at":"2026-10-13 21:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":24955,"source_name":"Ski Racing","country":"INT","title_no":"Petra Vlhovás nye start: Tilbake i Sölden og avduking av statue i hjembyen","title_orig":"Petra Vlhová’s New Beginning: Sölden Return, Hometown Statue Unveiled","summary_no":"Petra Vlhová er klar for comeback i Sölden, samtidig som en statue av den slovakiske stjernen ble avduket i hjembyen hennes.","spik_no":"Petra Vlhová er klar for comeback i verdenscupen når sesongen åpner i Sölden 24. oktober – nesten tre år etter hennes siste verdenscupstart. Den slovakiske stjernen gjennomgikk to operasjoner og langvarig rehabilitering etter en alvorlig kneskade i 2023, men returnerte til konkurranse under vinter-OL i 2026. Hun har hentet inn østerrikske Mario Rafetzeder som ny sjefstrener, som tidligere har jobbet med de britiske og finske landslag. Hjembyen Liptovský Mikuláš markerte comebacket med avduking av en statue til hennes ære.","url":"https://skiracing.com/petra-vlhovas-new-beginning-solden-return-hometown-statue-unveiled/","pub_date":"2026-10-13T19:34:08.000Z","fetched_at":"2026-10-13 19:45:01","lang_orig":"en","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":23905,"source_name":"Neveitalia","country":"ITA","title_no":"Snø i Zermatt: Frankrike trener i fart, Sarrazin på plass torsdag","title_orig":"A Zermatt c'è neve per allenarsi sulle discipline veloci: Allegre guida i francesi, da giovedì in pista Sarrazin","summary_no":"Det er nok snø i Zermatt til fartstrening. Frankrike ledes av Allegre, mens Sarrazin er ventet på plass torsdag.","spik_no":"Det franske fartslandslaget utnytter 30 centimeter nysnø i Zermatt til trening på Theodulbreen, med Nils Allegre som lagets ledende navn i denne fasen. Cyprien Sarrazin, en av fjorårets store overraskelser med seier i både utfor og super-G i Bormio, er ventet til trening torsdag. Forholdene på breene har vært vanskelige gjennom sommeren, og Zermatt er blitt et viktig alternativ for fartsspesialistene før åpningen i Copper Mountain 28. november.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/a-zermatt-c-e-neve-per-allenarsi-sulle-discipline-veloci-allegre-guida-i-francesi-da-giovedi-in-pista-sarrazin","pub_date":"2026-10-13T15:25:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":23906,"source_name":"Neveitalia","country":"ITA","title_no":"Østerrikes åpningslag nesten klart: 12 utøvere sikre, intern kvalifisering fredag","title_orig":"Il Wunderteam per l'opening di casa è in gran parte fatto (6 uomini e 6 donne già certi), venerdì la qualificazione interna","summary_no":"Seks menn og seks kvinner er allerede sikret plass på det østerrikske laget til hjemmeåpningen. Fredag avgjøres de siste plassene.","spik_no":"Østerrike stiller med tolv utøvere allerede sikret plass til hjemmeåpningen i Sölden 24.–25. oktober, mens de siste plassene avgjøres i intern kvalifisering fredag. Blant herrene trekkes Stefan Brennsteiner, Raphael Haaser og Marco Schwarz frem som sikre navn etter gode resultater i Sölden i fjor, mens Kriechmayr-situasjonen fremdeles er uklar. På kvinnesiden kjemper fem utøvere om tre gjenstående plasser i et lag der Østerrike disponerer ni startnummer.","url":"https://www.neveitalia.it/sport/scialpino/news/il-wunderteam-per-l-opening-di-casa-e-in-gran-parte-fatto-6-uomini-e-6-donne-gia-certi-venerdi-la-qualificazione-interna","pub_date":"2026-10-13T14:10:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":23908,"source_name":"Neveitalia","country":"ITA","title_no":"To renn i 2026/27-verdenscupen langt fra sikre – store arbeider gjenstår i Narvik","title_orig":"Ci sono due gare tutt'altro che sicure nella coppa 2026/27: a Narvik, ultima tappa prima delle finali, ci sono tantissimi lavori da fare","summary_no":"To verdenscuprenn i sesongen 2026/27 er usikre. I Narvik, siste stopp før finalen, gjenstår det betydelig arbeid på anlegget.","spik_no":"Verdenscupstoppet i Narvik 12.–13. mars 2027, planlagt med utfor og super-G for kvinner, er ennå ikke offisielt bekreftet av FIS, og betydelige anleggsarbeider gjenstår. Narvik ble tildelt VM i 2029 – det første noensinne på norsk snø – og har også nylig arrangert junior-VM. FIS-direktør Peter Gerdol har allerede nevnt Kvitfjell som mulig erstatning dersom Narvik ikke er klar i tide.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/ci-sono-due-gare-tutt-altro-che-sicure-nella-coppa-2026-27-a-narvik-ultima-tappa-prima-delle-finali-ci-sono-tantissimi-lavori-d","pub_date":"2026-10-13T12:30:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":23920,"source_name":"SkinEWS","country":"SUI","title_no":"Første tropp klar til sesongåpningen i Sölden","title_orig":"Das erste Aufgebot für den Saisonstart in Sölden ist da","summary_no":"Det første uttaket til sesongstarten i Sölden er offentliggjort og alpinsesongen kan snart begynne.","spik_no":"Italia er første nasjon ute med troppen til sesongåpningen i Sölden, der herrenes storslalåm kjøres 25. oktober på Rettenbachbreen. Sölden har vært fast åpningsarena for verdenscupen siden 2000 og er kjent for krevende forhold tidlig i sesongen. Blant de sju italienske herrene som er tatt ut, er rutinerte Luca de Aliprandini. For kvinnelaget er plassene foreløpig ikke endelig fordelt.","url":"https://www.skinews.ch/news/2026/aufgebot-saisonstart-soelden/","pub_date":"2026-10-13T11:44:32.000Z","fetched_at":"2026-10-13 17:53:12","lang_orig":"de","category":null,"athletes":"Luca De Aliprandini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":23921,"source_name":"SkinEWS","country":"SUI","title_no":"Hun kommer, han går – «utbytte av utøvere» hos sponsor Red Bull","title_orig":"Sie kommt, er geht – ein „Athletenaustausch“ bei Sponsor Red Bull","summary_no":"Red Bull gjennomfører et slags utøtterbytte, der én alpinist forlater og en annen blir hentet inn som ny ambassadør.","spik_no":"Red Bull henter inn 17 år gamle italienske Anna Trocker som ny hodesponsorkanditat, mens en erfaren italiener forlater energidrikk-gigantens løperstall. Ut fra taggene i artikkelen er det Alex Vinatzer som mister plassen. Red Bull er kjent for å kombinere støtte til etablerte toppnavn som Lindsey Vonn, Dominik Paris og Henrik Kristoffersen med satsing på lovende ungdommer, slik de tidligere har gjort med kroatiske Zrinka Ljutic og tyske Emma Aicher.","url":"https://www.skinews.ch/news/2026/athletenaustausch-sponsor-bull/","pub_date":"2026-10-13T08:43:19.000Z","fetched_at":"2026-10-13 17:53:12","lang_orig":"de","category":null,"athletes":"Ester Ledecka,Henrik Kristoffersen,Lindsey Vonn,Sofia Goggia","athlete_nations":["CZE","ITA","NOR","USA"],"also_sources":[],"norwegian":true},{"id":23913,"source_name":"Neveitalia","country":"ITA","title_no":"Giada D'Antonio: – Skader har lært meg mye, nå er jeg smertefri","title_orig":"\"Scio senza dolore, l'infortunio mi ha insegnato tanto\": Giada D'Antonio ora in Senales, probabile il debutto in Coppa Europa","summary_no":"Den italienske alpinisten Giada D'Antonio trener i Senales etter skade og er aktuell for debut i Europa-cupen denne sesongen.","spik_no":"Den italienske alpinisten Giada D'Antonio, født 2009, sier hun nå er smertefri etter korsbåndsskaden hun pådro seg 14. februar i trening i Dobbiaco – midt under OL-perioden. Etter nesten sju måneder med rehabilitering ved J Medical i Torino er hun tilbake på snø og trener nå i Val Senales. Planen er et mulig debut i Europa-cupen allerede fra åpningsrennene i Levi 21.–22. november, før hun vender tilbake til verdenscupsirkuset.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/scio-senza-dolore-l-infortunio-mi-ha-insegnato-tanto-giada-d-antonio-ora-in-senales-probabile-il-debutto-in-coppa-europa","pub_date":"2026-10-13T07:50:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":"naert","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":23915,"source_name":"Neveitalia","country":"ITA","title_no":"Nattlig befaring i regnvær på Gran Risa foran spesielt slalåmrenn","title_orig":"Sotto la pioggia dell'Alta Badia, il sopralluogo notturno sulla Gran Risa dove ci sarà uno slalom davvero... speciale","summary_no":"Under kraftig regnvær i Alta Badia ble det gjennomført en nattlig befaring på Gran Risa-løypen, der det ventes et særegent slalåmrenn.","spik_no":"I Alta Badia ble det gjennomført nattlig befaring på Gran Risa-løypen i kraftig regn, som forberedelse til noe nytt i verdenscupkalenderen: 21. desember arrangeres for første gang en nattslalåm på den legendariske bakken. Tidligere har Gran Risa hatt fem utgaver av parallellavsalåm under kunstig lys, men fra denne sesongen er det klassisk slalåm som tar over søndagskvelden, dagen etter den tradisjonsrike storslalåmen. Billettsalget starter torsdag.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/sotto-la-pioggia-dell-alta-badia-il-sopralluogo-notturno-sulla-gran-risa-dove-ci-sara-uno-slalom-davvero-speciale","pub_date":"2026-10-13T06:30:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":22150,"source_name":"Neveitalia","country":"ITA","title_no":"Mikaela Shiffrin trener i Val Senales – kan Rettenbach bli stedet for comeback i storslalåm?","title_orig":"Mikaela Shiffrin è in Val Senales verso l'opening... e se fosse il Rettenbach il teatro del ritorno alla vittoria in gigante?","summary_no":"Mikaela Shiffrin forbereder seg til sesongåpningen i Val Senales. Spekulasjoner går på om Rettenbach-bakken kan bli arenaen for hennes etterlengtede comeback i storslalåm.","spik_no":"Mikaela Shiffrin trener på Val Senales-breen i forkant av sesongåpningen i Sölden 24. oktober, og spekulasjonene går på om Rettenbach-bakken kan bli stedet for hennes comeback i storslalåm. Den 29 år gamle amerikaneren har ikke vunnet i storslalåm på nesten tre år, etter at hun pådro seg en alvorlig kneskade i Killington i november 2023. Ironisk nok har Rettenbach vært et lykkebringende sted for Shiffrin tidligere – her tok hun sin første verdenscupseier i storslalåm i 2014, og har vunnet disiplinens sesongåpner der to ganger siden.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/mikaela-shiffrin-e-in-val-senales-verso-l-opening-e-se-fosse-il-rettenbach-il-teatro-del-ritorno-alla-vittoria-in-gigante","pub_date":"2026-10-12T17:15:00.000Z","fetched_at":"2026-10-12 17:30:02","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":21610,"source_name":"ORF Sport","country":"AUT","title_no":"Shiffrin velger nye veier","title_orig":"Shiffrin geht neue Wege","summary_no":"Mikaela Shiffrin tar nye grep og prøver nye tilnærminger i sin videre karriere.","spik_no":"Mikaela Shiffrin vil redusere antallet slalomrenn denne sesongen og heller satse mer på storslalåm og super-G. Amerikaneren vant forrige sesong sitt sjette sammenlagtcup i verdenscupen – samme antall som rekordholderen Annemarie Moser-Pröll – og sier hun aksepterer at dette valget kan koste henne tittelen. Over 1000 av hennes 1534 poeng forrige sesong kom i slalåm. «Jeg har fortjent mer frihet», sier Shiffrin, som med 100-talls verdenscupseirer er den mestvinnende alpinisten gjennom tidene.","url":"https://sport.orf.at/stories/3163382/","pub_date":"2026-10-12T16:00:17.000Z","fetched_at":"2026-10-12 16:15:04","lang_orig":"de","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":21462,"source_name":"SkinEWS","country":"SUI","title_no":"Intervju med Mikaela Shiffrin på Atomic Media Day 2026","title_orig":"Interview mit Mikaela Shiffrin am Atomic Media Day 2026","summary_no":"Mikaela Shiffrin stilte til intervju under Atomic Media Day 2026.","spik_no":"Mikaela Shiffrin stilte til intervju under Atomic Media Day 2026, der sesongforberedelsene til 2026/27 sto på agendaen. Shiffrin er utøveren med flest verdenscupseirer noen gang — over 97 individuelle seirer — og representerer utstyrsmerket Atomic. Etter en alvorlig kneskade i desember 2023 som holdt henne utenfor store deler av forrige sesong, er forberedelsene til kommende sesong særlig etterlengtede for både utøveren og fansen.","url":"https://www.skinews.ch/video/2026/interview-mikaela-shiffrin/","pub_date":"2026-10-12T15:46:27.000Z","fetched_at":"2026-10-12 16:00:04","lang_orig":"de","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":21180,"source_name":"Sportschau","country":"GER","title_no":"Emma Aicher: Etter sportsprisen sikter hun mot Shiffrin","title_orig":"Emma Aicher: Auf Sportpreis folgt der Angriff auf Shiffrin","summary_no":"Emma Aicher har mottatt en sportspris og retter nå blikket mot Mikaela Shiffrin i alpinsporten.","spik_no":"Den 22 år gamle tyske alpinisten Emma Aicher mottok nylig den bayerske sportsprisen for en «fremragende idrettskarriere», og har nå erklært at hun sikter mot Mikaela Shiffrin og den store krystallkula. I forrige sesong var Aicher bare 87 poeng bak Shiffrin i sammendraget – noe som ville ha gjort henne til den første tyske sammenlagtvinneren siden Maria Höfl-Riesch i 2010/11. Aicher, som er utdannet ved skiinternatets i Berchtesgaden, debuterte i verdenscupen på sin 18-årsdag og gikk direkte til poeng. Etter flere sesonger med nesten-resultater slo hun for alvor til i Kvitfjell i mars 2025.","url":"https://www.sportschau.de/regional/br/br-emma-aicher-auf-sportpreis-folgt-der-angriff-auf-shiffrin-102.html","pub_date":"2026-10-12T15:11:42.000Z","fetched_at":"2026-10-12 15:15:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Mikaela Shiffrin","athlete_nations":["GER","USA"],"also_sources":[],"norwegian":false},{"id":20437,"source_name":"ORF Sport","country":"AUT","title_no":"Amerikanske trenere overtar nasjonale flagglag","title_orig":"US-Trainer übernehmen heimische Flag-Nationalteams","summary_no":"Amerikanske trenere har tatt over ansvaret for sine hjemlige nasjonale flagglag i alpint.","spik_no":"Dette handler ikke om alpint, men om flag-football: Det østerrikske American Football-forbundet har ansatt fire amerikanske trenere til å lede sine flagglag etter at både herre- og dametrener trakk seg. Bakgrunnen er skuffende resultater, særlig herrenes 15.-plass og sisteplass i VM i Düsseldorf. Flag-football blir olympisk disiplin for første gang i Los Angeles i 2028, og Østerrike ønsker å hevde seg internasjonalt i forkant av dette.","url":"https://sport.orf.at/stories/3163532/","pub_date":"2026-10-12T13:35:39.000Z","fetched_at":"2026-10-12 13:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":18994,"source_name":"Neveitalia","country":"ITA","title_no":"Sju italienske alpinister klare for sesongåpningen i Sölden","title_orig":"Già definiti i 7 azzurri per l'opening maschile: a Soelden guidano Vinatzer, Della Vite e De Aliprandini, Franzoni ci prova","summary_no":"Italia har plukket ut sju utøvere til åpningsrennet i Sölden. Vinatzer, Della Vite og De Aliprandini leder an, mens Franzoni også forsøker å hevde seg.","spik_no":"Italia stiller med sju utøvere i herrenes åpningsslalåm i Sölden søndag 25. oktober, der Alex Vinatzer leder troppen. Vinatzer ble nummer fem på samme sted for to år siden og er Italias fremste teknikkspesialist. Filippo Della Vite og Luca De Aliprandini er begge rutinerte storslalåmkjørere på høyt nivå, mens Giovanni Borsotti, Simon Talacci, Tobias Kastlunger og Franzoni utgjør resten av troppen som håper å markere seg i verdenscupens første renn.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/gia-definiti-i-7-azzurri-per-l-opening-maschile-a-soelden-guidano-vinatzer-della-vite-e-de-aliprandini-franzoni-ci-prova","pub_date":"2026-10-12T10:35:00.000Z","fetched_at":"2026-10-12 10:45:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Filippo Della Vite,Giovanni Franzoni,Luca De Aliprandini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":17878,"source_name":"Neveitalia","country":"ITA","title_no":"Det italienske landslaget på vei til Rettenbach – Bassino og Pirovano trente på Stelvio","title_orig":"Selezione azzurra verso il Rettenbach, dove già ci si allena. Ieri allo Stelvio la ripresa dei lavori di Bassino e Pirovano","summary_no":"Det italienske alpinlandslaget forbereder seg til Rettenbach, mens Bassino og Pirovano gjenopptok treningen på Stelvio.","spik_no":"Det italienske alpinlandslaget samles gradvis på Rettenbach-breen i Sölden, der forberedelsene til åpningsrennene 24.–25. oktober er i sluttfasen. Marta Bassino og Laura Pirovano gjenopptok treningen sin på Stelvio onsdag, mens en rekke løpere fra det tekniske laget allerede er på plass i Ötztal. Rettenbach-breen er tilgjengelig for trening frem til lørdag 17. oktober, da løypa overtas av FIS to dager etter en snøkontroll.","url":"https://www.neveitalia.it/sport/scialpino/news/selezione-azzurra-verso-il-rettenbach-dove-gia-ci-si-allena-ieri-allo-stelvio-la-ripresa-dei-lavori-di-bassino-e-pirovano","pub_date":"2026-10-12T08:10:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":17879,"source_name":"Neveitalia","country":"ITA","title_no":"Grenier møtte hindringer på veien mot Sölden: skadet i Ushuaia, nå i Val Senales","title_orig":"Per Valérie Grenier un intoppo sulla strada per Soelden: infortunio a Ushuaia, ripresa allo Stelvio e ora... Val Senales","summary_no":"Valérie Grenier pådro seg en skade i Ushuaia og har trent på Stelvio, og er nå i Val Senales foran åpningsrennet i Sölden.","spik_no":"Canadiske Valérie Grenier avslørte at hun skadet brusk i sterno-klavikularleddet under en treningsfall i storslalåm på sommersamlingen i Ushuaia i Argentina, en skade som kostet henne rundt to uker av oppkjøringen. 1996-modellen måtte nøye seg med rehabilitering og friski mot slutten av Argentina-blokken, men er nå tilbake på snø i Italia og trener i Val Senales foran åpningsrennet i Sölden. Grenier regnes som en av de mer allsidige løperne på den kanadiske troppen og er spesielt sterk i de tekniske disiplinene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/per-valerie-grenier-un-intoppo-sulla-strada-per-soelden-infortunio-a-ushuaia-ripresa-allo-stelvio-e-ora-val-senales","pub_date":"2026-10-12T07:25:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":"sportslig","athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":17881,"source_name":"Neveitalia","country":"ITA","title_no":"Sola, Carolli, Klotz og flere italienske kvinner trener i Val Senales fra onsdag","title_orig":"Sola, Carolli, Klotz, Guerinoni, Bieler e D'Antonio in Val Senales da mercoledì: le azzurre del team Coppa Europa al lavoro","summary_no":"Det italienske Europa Cup-laget med Sola, Carolli, Klotz, Guerinoni, Bieler og D'Antonio samles i Val Senales for treningssamling fra onsdag.","spik_no":"Det italienske Europa Cup-lagets tekniske damegruppe samles i Val Senales mellom 14. og 17. oktober for fire dagers storslalåmtrening på breen. Beatrice Sola, Tatum Bieler, Francesca Carolli, Alessia Guerinoni, Victoria Klotz og Giada D'Antonio er innkalt av teknisk direktør Gianluca Rulfi, og gruppen gjennomfører atletiske tester på Mapei-senteret før de reiser til Sør-Tirol. D'Antonio, som er født i 2009, deltar foreløpig i rehabiliteringsøyemed, men har allerede vært i aktivitet på Stelvio de siste ukene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sola-carolli-klotz-guerinoni-bieler-e-d-antonio-in-val-senales-da-mercoledi-le-azzurre-del-team-coppa-europa-al-lavoro","pub_date":"2026-10-11T13:50:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":17882,"source_name":"Neveitalia","country":"ITA","title_no":"Sofia om sin form: «Det går bedre nå – jeg vil forstå nivået mitt på pisten»","title_orig":"Sofia, raccontaci come stai: \"Ora va meglio, solo in pista capirò il mio livello e potrò fissare gli obiettivi. Come nel 2024 ho perso tanto\"","summary_no":"Sofia åpner opp om sin situasjon og sier det går bedre, men at hun trenger å kjøre på pisten for å forstå sitt nivå og sette mål.","spik_no":"Sofia Goggia åpner opp om en svært krevende sommer, der hun etter hjemkomst fra Ushuaia pådro seg et dobbelt virus som rammet nervesystemet og påførte henne invalidiserende smerter – noe hun beskriver som det verste hun har opplevd i karrieren. Den flerfoldige verdenscupvinneren og olympiske mesteren i utfor sier hun har gjort store fremskritt den siste uken, men at hun trenger å kjøre på pisten for å forstå sitt reelle nivå. Neste stopp er Stelvio, og deretter håper hun på intensivt arbeid i novemberblokken i Copper Mountain.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sofia-goggia-al-microfono-di-dario-puppo-fisi-media-day-2026","pub_date":"2026-10-11T12:50:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":"naert","athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":17883,"source_name":"Neveitalia","country":"ITA","title_no":"Brignone med ubrytelig kampånd: «Selv om jeg har vunnet alt, endrer ikke det min innstilling»","title_orig":"Brignone e il solito spirito indomabile: \"Anche se ho vinto tutto non cambia l'approccio, resto competitiva e voglio raggiungere ancora qualcosa di difficile\". Parla la bi olimpionica a NEVEITALIA","summary_no":"Dobbelt olympisk mester Federica Brignone forteller til NEVEITALIA at hun fortsatt brenner for konkurransen og ønsker å oppnå nye vanskelige mål.","spik_no":"Federica Brignone understreker at verken OL-gull eller de øvrige merittene hennes endrer innstillingen hennes til konkurransen – hun vil fortsatt nå nye, krevende mål. Den 35 år gamle La Salle-løperen opererte kneet 25. august, men er snart klar for snø igjen og nærmer seg en sesong hun erkjenner vil by på usikkerhet. En dokumentarfilm om Brignone har premiere 21. oktober, og VM i Crans-Montana er et naturlig høydepunkt i en vinter der hun ønsker å skifte fokus fra skadene og bare «kjøre sine svinger».","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/federica-brignone-al-microfono-di-dario-puppo-fisi-media-day-2026","pub_date":"2026-10-11T10:50:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":17886,"source_name":"Neveitalia","country":"ITA","title_no":"Vinatzer og co. mellom Sölden og Pitztal – fartskjørerne samles på Stelvio med Bassino, Pirovano og Goggia","title_orig":"Tra Soelden e Pitztal l'avvicinamento all'opening per Vinatzer e compagni. I velocisti allo Stelvio con Bassino, Pirovano e... Goggia","summary_no":"De italienske teknikkutøverne forbereder seg til åpningsrennet i Sölden, mens fartsspesialistene trener på Stelvio sammen med Bassino, Pirovano og Goggia.","spik_no":"De italienske teknikkutøverne, med Alex Vinatzer i spissen, veksler mellom treningsøkter i Sölden og Pitztal i den siste oppkjøringsfasen før åpningsrennet 24.–25. oktober. Fartsspesialistene er samlet på Stelvio, der Marta Bassino, Laura Pirovano og Sofia Goggia alle er i gang med trening under ulike forutsetninger, etter at Goggia har vært igjennom en sykdomspreget sommer. Rettenbach og Stelvio-blokkene er typisk avgjørende siste sjanse for de italienske løperne til å finpusse formen før verdenscupsesongen settes i gang.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/tra-soelden-e-pitztal-l-avvicinamento-all-opening-per-vinatzer-e-compagni-i-velocisti-allo-stelvio-con-bassino-pirovano-e-goggi","pub_date":"2026-10-11T08:30:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Laura Pirovano,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":17888,"source_name":"Neveitalia","country":"ITA","title_no":"Laura Pirovano til NEVEITALIA: «Jeg føler meg mer bevisst – jeg manglet bare litt selvtillit»","title_orig":"\"Mi sento più consapevole, per sbloccarmi mancava solo quel pizzico di fiducia\": Laura Pirovano si racconta a NEVEITALIA per un inverno di conferme","summary_no":"Laura Pirovano åpner opp om sin utvikling og sier økt selvtillit har vært nøkkelen til å løse opp potensialet sitt foran en ny vinter.","spik_no":"Laura Pirovano forteller at økt selvtillit har vært avgjørende for hennes utvikling, og at hun nå føler seg mer bevisst i sin tilnærming til sporten. Den italienske alpinisten har tidligere vist glimt av solid kapasitet, særlig i utforkjøring og super-G, men har hatt ujevne resultater på Verdenscup-nivå. Med en ny sesong i vente virker Pirovano innstilt på å ta et steg opp, og utsagnet om at hun «bare manglet litt selvtillit» antyder at den tekniske plattformen lenge har vært på plass.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/laura-pirovano-al-microfono-di-dario-puppo-fisi-media-day-2026","pub_date":"2026-10-11T06:55:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":null,"athletes":"Laura Pirovano","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":17892,"source_name":"SkinEWS","country":"SUI","title_no":"Alice Robinson i søkelyset på flere fronter","title_orig":"Alice Robinson gleich mehrfach im Fokus","summary_no":"Alpinstjernen Alice Robinson er aktuell på flere områder og vekker stor oppmerksomhet.","spik_no":"Alice Robinson er aktuell på flere fronter foran den nye sesongen: hun er kåret til «Årets alpinske skiløper» i New Zealand og er viet en større reportasje i et amerikansk magasin. 24-åringen fra New Zealand er en av de mest spennende profilene i alpint og stiller til start i Sölden med 138 verdenscuprennet i bagasjen. I forrige sesong endte hun på 5.-plass totalt, ble nummer to i super-G-cupen bak Sofia Goggia, og vant tre renn.","url":"https://www.skinews.ch/news/2026/robinson-gleich-mehrfach/","pub_date":"2026-10-10T12:47:14.000Z","fetched_at":"2026-10-12 08:58:25","lang_orig":"de","category":null,"athletes":"Alice Robinson","athlete_nations":["NZL"],"also_sources":[],"norwegian":false},{"id":17893,"source_name":"SkinEWS","country":"SUI","title_no":"Østerrikske alpinstjerner presenterer nye drakter","title_orig":"ÖSV-Asse präsentieren ihre neue Bekleidung","summary_no":"ØSV-profilene stilte opp og viste frem lagets nye konkurransedraktsett foran sesongen.","spik_no":"Det østerrikske skiforbundet (ØSV) presenterte nye konkurransedraktsett for alle lag under en moteshow i PlusCity i Pasching, to uker før seriestarten i Sölden. I det som er en VM-vinter, har Ski Austria inngått samarbeid med to nye bekledningspartnere: italienske Colmar for alpin- og paraskiteamene og polske 4F for hopp, kombinert og skicross. Alpindraktene er bygget rundt Østerrikes tradisjonelle rød-hvite farger, supplert med mørkere fargetoner.","url":"https://www.skinews.ch/news/2026/oesv-praesentieren-bekleidung/","pub_date":"2026-10-10T10:44:00.000Z","fetched_at":"2026-10-12 08:58:25","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":17857,"source_name":"Ski Racing","country":"INT","title_no":"Airbags påkrevd i Nor-Am fartsdisipliner: Dette må utøverne vite","title_orig":"Airbags Required for Nor-Am Speed Races: What Athletes Need to Know","summary_no":"Airbags blir obligatorisk utstyr i Nor-Am-renn i fartsdisipliner, og her er det utøverne trenger å vite om de nye reglene.","spik_no":"Fra sesongen 2026/27 er airbag-protektorer obligatorisk utstyr i alle fartsdisipliner i Nor-Am Cup og høyere nivåer, inkludert verdenscup – både i konkurranse og under offisiell trening. Regelverket er nedfelt i FIS' utstyrsspesifikasjoner og krever at protektoren bærer et uavtagbart godkjenningsstempel og at det elektroniske systemet er aktivert; det er ikke nok å bare ha den på seg. For utøvere i Nord-Amerika er første frist 7. desember, når offisiell utforkjøringstrening starter i Copper Mountain i Colorado.","url":"https://skiracing.com/nor-am-airbag-rule-2026-27/","pub_date":"2026-10-09T23:56:46.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":17858,"source_name":"Ski Racing","country":"INT","title_no":"Stifel Sun Valley Finals 2027: Verdenscup-alpint returnerer til Idaho","title_orig":"Stifel Sun Valley Finals 2027: World Cup Racing Returns to Idaho","summary_no":"Verdenscupen i alpint vender tilbake til Sun Valley i Idaho i 2027 med Stifel Finals.","spik_no":"Stifel Sun Valley Finals vender tilbake til Idaho 18.–25. mars 2027, og avslutter verdenscupsesongen med alle fire alpindisipliner for begge kjønn. Sun Valley arrangerte sitt første verdenscupfinale i 2025, da Mikaela Shiffrin vant slalåmen som sitt 101. verdenscuprenn og Henrik Kristoffersen sikret slalåmgloben. De to planlagte utforrennene i 2025 ble imidlertid avlyst på grunn av vind, og «Challenger»-løypa kan dermed få sin ekte racingdebut i 2027.","url":"https://skiracing.com/stifel-sun-valley-finals-2027-world-cup-racing-returns-to-idaho/","pub_date":"2026-10-09T18:06:05.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"en","category":null,"athletes":"Lena Dürr,Mikaela Shiffrin","athlete_nations":["GER","USA"],"also_sources":[],"norwegian":false},{"id":17651,"source_name":"Ski Racing","country":"INT","title_no":"Luca de Aliprandini snakker om storslalåm, det italienske laget og håpet om comeback","title_orig":"Luca de Aliprandini Talks Giant Slalom, the Italian Team and His Hopes for a Comeback","summary_no":"Den italienske alpinisten Luca de Aliprandini åpner opp om storslalåm, sitt forhold til det italienske landslaget og planene om å returnere til toppen av sporten.","spik_no":"Luca de Aliprandini åpner opp om en skuffende forrige sesong, der han falt ut av verdens topp 30 i storslalåm, og snakker om planene om å arbeide seg tilbake til elitenivå. Italieneren har vært en av de mest stabile storslalåmkjørerne i over 15 år på verdenscuptouren og tok sitt beste karriereresultat med VM-sølv i storslalåm i Cortina 2021. Han er også gift med sveitsiske Michelle Gisin, som selv jobber med comeback etter skade. I podkasten kommenterer han også nyheter som Marco Schwarzs beslutning om å droppe slalåm og Mikaela Shiffrins reduserte slalåmsatsing.","url":"https://skiracing.com/luca-de-aliprandini-talks-giant-slalom-the-italian-team-and-his-hopes-for-a-comeback/","pub_date":"2026-10-09T11:46:46.000Z","fetched_at":"2026-10-09 12:00:02","lang_orig":"en","category":null,"athletes":"Luca De Aliprandini,Manuel Feller,Marco Schwarz,Mikaela Shiffrin","athlete_nations":["AUT","ITA","USA"],"also_sources":[],"norwegian":false},{"id":17378,"source_name":"ORF Sport","country":"AUT","title_no":"Goggia beskriver personlig lidelseshistorie","title_orig":"Goggia schildert persönliches Martyrium","summary_no":"Den italienske alpinisten Sofia Goggia åpner opp om sitt personlige martyrium.","spik_no":"Sofia Goggia beskriver sommeren 2026 som den tøffeste og smertefulleste perioden i karrieren sin. Den 33 år gamle italienske fartsspesialisten ble først smittet av Chikungunya-viruset via et myggstikk, og ble deretter rammet av Parvovirus B19, noe som førte til kraftige nevrologiske symptomer og avbrudd i treningsleiren i Ushuaia i Sør-Amerika. Goggia fortalte i et ORF-intervju at hun blant annet fikk problemer med å snakke. Til tross for utfordringene vant hun Super-G-cupen sammenlagt sist sesong, og er regnet som en av verdens beste utøvere i de raske disiplinene.","url":"https://sport.orf.at/stories/3163391/","pub_date":"2026-10-09T11:03:37.000Z","fetched_at":"2026-10-09 11:15:13","lang_orig":"de","category":"naert","athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":16898,"source_name":"Neveitalia","country":"ITA","title_no":"Vlhova bekrefter comeback: – Det er en ny begynnelse","title_orig":"Vlhova dice... sì! Petra sarà al cancelletto di Soelden, quasi 3 anni dopo l'ultima volta in coppa: \"E' un nuovo inizio, ora sono felice\"","summary_no":"Petra Vlhova stiller til start i Sölden, nesten tre år etter sitt siste verdenscuprenn. – Nå er jeg lykkelig, sier slovaken.","spik_no":"Petra Vlhova bekrefter at hun stiller til start i sesongåpningen i Sölden 24. oktober – nesten tre år etter at hun skadet kneet alvorlig i januar 2024. Den slovakiske stjernen vant verdenscupen sammenlagt i 2021, er olympisk mester fra Beijing 2022 og har også verdensmestertittelen på merittlisten. Comebacket skjer under ny trener Mario Rafetzeder, og Vlhova sier hun har lagt om mentaliteten: – Jeg skal nyte reisen, men det betyr ikke at jeg ikke vil vinne.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/vlhova-dice-si-petra-sara-al-cancelletto-di-soelden-quasi-3-anni-dopo-l-ultima-volta-in-coppa-e-un-nuovo-inizio-ora-sono-felice","pub_date":"2026-10-09T10:15:00.000Z","fetched_at":"2026-10-09 10:30:02","lang_orig":"it","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":16707,"source_name":"Neveitalia","country":"ITA","title_no":"Shiffrin: – Verdenscupen blir prioritet igjen hvis jeg er konkurransedyktig til midten av sesongen","title_orig":"\"Se a metà stagione avrò fatto buone gare e sarò competitiva, allora la Coppa del Mondo tornerà ad essere una priorità\": Shiffrin si racconta a Rebensburg","summary_no":"Mikaela Shiffrin åpner seg i et intervju med Rebensburg og forklarer at Verdenscupen vil bli en prioritet igjen dersom hun presterer godt i første halvdel av sesongen.","spik_no":"Mikaela Shiffrin sier i et intervju med tidligere alpinstjerne Viktoria Rebensburg at verdenscupen igjen vil bli en prioritet dersom hun er konkurransedyktig til midten av sesongen. Den 31 år gamle amerikaneren planlegger en sesong med større fokus på storslalåm, og velger å stå over de to første slalåmrennene. Shiffrin er den mestervinnende utøveren i verdenscuphistorien med over 90 seire og seks store krystallkuler – og en syvende er ikke utelukket.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/se-a-meta-stagione-avro-fatto-buone-gare-e-saro-competitiva-allora-la-coppa-del-mondo-tornera-ad-essere-una-priorita-shiffrin-s","pub_date":"2026-10-09T09:50:00.000Z","fetched_at":"2026-10-09 10:00:02","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":16012,"source_name":"franceinfo","country":"FRA","title_no":"Lindsey Vonn fortsatt under rehabilitering, men offisielt påmeldt til verdenscupen 2026–2027","title_orig":"Lindsey Vonn toujours convalescente mais officiellement engagée pour la Coupe du monde de ski 2026-2027","summary_no":"Lindsey Vonn er fortsatt i rehabilitering, men har offisielt meldt seg på til verdenscupsesongen 2026–2027 i alpint.","spik_no":"Lindsey Vonn, 41 år gammel, er offisielt påmeldt til verdenscupsesongen 2026–2027, til tross for at hun fortsatt er i rehabilitering etter et alvorlig fall under vinter-OL i Milano-Cortina i februar 2026. Fallet var så dramatisk at legene skal ha diskutert amputasjon, men Vonn valgte å kjempe seg tilbake. Den amerikanske alpinlegenden kom opprinnelig ut av pensjonisttilværelsen i 2023 etter en kneoperasjon, og er den mest meritterte utøveren i verdenscuphistorien med 82 seire. En eventuell comeback-sesong ville gjøre henne til en av tidenes eldste verdenscupløpere.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/lindsey-vonn-toujours-convalescente-mais-officiellement-engagee-pour-la-coupe-du-monde-de-ski-2026-2027_8229775.html#xtor=RSS-3-%5Bgeneral%5D","pub_date":"2026-10-09T09:16:56.000Z","fetched_at":"2026-10-09 09:20:14","lang_orig":"fr","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":15683,"source_name":"Neveitalia","country":"ITA","title_no":"Norge avviser Red Bull-kritikk: «En fordel for alle» – McGrath vil drømme videre","title_orig":"Si presenta la Norvegia \"spegnendo\" le polemiche per l'accordo con Red Bull: \"Un vantaggio per tutti\". E McGrath vuole sognare ancora","summary_no":"Det norske alpinlandslaget avviser polemikken rundt Red Bull-avtalen og kaller den en fordel for alle involverte. McGrath ser fortsatt store ambisjoner for fremtiden.","spik_no":"Det norske alpinlandslaget avviste kritikken mot sponsoravtalen med Red Bull på sesongpresentasjonen i Oslo og kalte samarbeidet en fordel for alle involverte. Kritikken har vært rettet mot Skiforbundet for å ha inngått avtale med energidrikk-giganten. Laget, som markedsfører seg som «Attacking Vikings», ruster seg nå mot VM i Crans-Montana denne vinteren og ser frem mot hjemme-VM i Narvik i 2029. Atle Lie McGrath, Henrik Kristoffersen og Timon Haugan er blant stjernene som stiller seg bak avtalen.","url":"https://www.neveitalia.it/sport/scialpino/news/si-presenta-la-norvegia-spegnendo-le-polemiche-per-l-accordo-con-red-bull-un-vantaggio-per-tutti-e-mcgrath-vuole-sognare-ancora","pub_date":"2026-10-09T09:15:00.000Z","fetched_at":"2026-10-09 09:15:40","lang_orig":"it","category":null,"athletes":"Atle Lie McGrath","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":15540,"source_name":"Sportschau","country":"GER","title_no":"Skiløpere kritiserer FIS-planer","title_orig":"Skifahrerinnen kritisieren FIS-Pläne","summary_no":"Kvinnelige alpinister har gått ut med kritikk mot planene til det internasjonale skiforbundet FIS.","spik_no":"Kvinnelige alpinister, deriblant tyske Emma Aicher og Kira Weidle-Winkelmann, kritiserer FIS-planene om å utvide verdenscupkalenderen. Aicher sier rett ut at kalenderen «egentlig er full» fra midten av november til slutten av mars. Debatten kommer i kjølvannet av et turbulent FIS-år, der president Johan Eliasch ble avsatt med én stemmes margin på kongressen i juni, og der nye FIS-sjef Alexander Ospelt blant annet har foreslått å holde ski-VM hvert år unntatt OL-år.","url":"https://www.sportschau.de/regional/br/br-skifahrerinnen-kritisieren-fis-plaene-der-kalender-ist-voll-108.html","pub_date":"2026-10-09T09:07:29.000Z","fetched_at":"2026-10-09 09:08:38","lang_orig":"de","category":null,"athletes":"Emma Aicher,Kira Weidle-Winkelmann","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":14901,"source_name":"Neveitalia","country":"ITA","title_no":"Sofia Goggia åpner seg: – Min største frykt er å ikke tro nok på meg selv","title_orig":"Sofia Goggia in esclusiva: \"La mia più grande paura è non riuscire a credere abbastanza in me stessa. Ho ancora fame e ambizione\"","summary_no":"Den italienske alpinstjernen Sofia Goggia innrømmer at selvtvil er hennes største utfordring. Hun understreker at hun fortsatt har sult og ambisjoner.","spik_no":"Sofia Goggia innrømmer at hennes største frykt er å ikke tro nok på seg selv, men understreker at hun fortsatt har sult og ambisjoner. Den italienske utforkjøreren er en av verdens beste i fart og vant OL-gull i utfor i Pyeongchang 2018, men har gjennom karrieren kjempet med alvorlige skader som har satt henne på sidelinjen gjentatte ganger. I et intervju på Atomic Media Day 2026 sier hun at hun ønsker å nå resultater hun ennå ikke langen: ”Bara kör”","summary_no":"Trenerne har en klar plan for å få supertalentet tilbake i form: å bare sende vedkommende utfor bakken uten å tenke for mye.","spik_no":"Denne saken handler om svensk kvinnefotball, ikke alpint – artikkelteksten omhandler fotballspilleren Felicia Schröder og det svenske landslaget. Det finnes derfor ikke relevant alpinkontekst å bygge på. Schröder ble solgt fra BK Häcken til Real Madrid og skal ifølge rapporter ha blitt den dyreste kvinnelige fotballspilleren i verden, men har ennå ikke scoret for Sverige på elleve landskamper.","url":"https://www.svt.se/sport/fotboll/planen-for-att-fa-i-gang-supertalangen-bara-kor","pub_date":"2026-10-09T06:30:18.000Z","fetched_at":"2026-10-09 06:36:58","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":10178,"source_name":"Ski Racing","country":"INT","title_no":"Henrik Kristoffersen bruker Protern for å finne hvor farten vinnes og tapes","title_orig":"Henrik Kristoffersen Uses Protern to Find Where Speed Is Gained and Lost","summary_no":"Henrik Kristoffersen benytter analyseverktøyet Protern for å identifisere hvor han vinner og taper tid i løypene.","spik_no":"Henrik Kristoffersen bruker GPS-baserte analyseverktøyet Protern for å kartlegge nøyaktig hvor han vinner og taper fart i løypene – noe tradisjonelle mellomtider, gjerne 15 sekunder fra hverandre, ikke kan gi svar på. Kristoffersen, som har 34 verdenscupseirer, 102 pallplasser, fem disiplinkuler og to VM-gull på merittlisten, jobber tett med faren og treneren Lars. Protern gir dem mulighet til å se hastigheten på ethvert punkt i løypa, slik at selv små tekniske feil kan kvantifiseres og brukes i videre utvikling.","url":"https://skiracing.com/henrik-kristoffersen-uses-protern-to-find-where-speed-is-gained-and-lost/","pub_date":"2026-10-08T20:32:34.000Z","fetched_at":"2026-10-08 20:45:02","lang_orig":"en","category":"nerding","athletes":"Henrik Kristoffersen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":9693,"source_name":"ORF Sport","country":"AUT","title_no":"Moro har høyeste prioritet for Feller","title_orig":"Spaß hat für Feller oberste Priorität","summary_no":"For alpinisten Manuel Feller er det å ha det gøy på ski det viktigste av alt.","spik_no":"Manuel Feller hopper over sesongåpningen i Sölden i slutten av oktober og fokuserer utelukkende på slalåm mot slutten av karrieren. Østerrikeren har hatt et turbulent 2026 – han vant endelig hjemme i Kitzbühel i januar og tok OL-sølv i lagkombinasjon med Vincent Kriechmayr i Bormio, men ble deretter operert for prolaps. Rehabiliteringen har vært tung, og Feller har slitt med motivasjonen etter at ekstra treningsbelastning gjentatte ganger resulterte i nye smerter. Nå er det å glede seg over skikjøringen igjen som gjelder.","url":"https://sport.orf.at/stories/3163370/","pub_date":"2026-10-08T19:06:17.000Z","fetched_at":"2026-10-08 19:15:11","lang_orig":"de","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":9136,"source_name":"Ski Racing","country":"INT","title_no":"Markus Waldner trekker seg som rennleder for herres verdenscup","title_orig":"Markus Waldner Steps Down as Men’s World Cup Race Director","summary_no":"Markus Waldner har trukket seg fra stillingen som rennleder for herrenes verdenscup i alpint.","spik_no":"Markus Waldner trekker seg som rennleder for herrenes verdenscup i alpint etter 12 år i stillingen som FIS' øverste rennsjef på herresiden. Den italienske alpineksperten begrunnet avgjørelsen med akkumulert press og at han ikke lenger hadde energi og overskudd til å gå inn i en ny full sesong slik han ønsket. Waldner var en sentral figur i internasjonal alpinisme lenge før han nådde verdenstoppen, med erfaring fra blant annet Sør-Amerika Cup og Europa Cup. Jobben hans plasserte ham i hjertet av avgjørelser om renn kunne gjennomføres, og han var et kjent ansikt for TV-seere verden over – selv om mange ikke kjente navnet hans.","url":"https://skiracing.com/markus-waldner-steps-down-as-mens-world-cup-race-director/","pub_date":"2026-10-08T17:39:28.000Z","fetched_at":"2026-10-08 18:00:04","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":8522,"source_name":"Neveitalia","country":"ITA","title_no":"Atomics vakre gest: «Babi» Greppi hyllet ved siden av Goggia på Media Day","title_orig":"Il bellissimo gesto di Atomic: al Media Day ecco \"Babi\" Greppi al fianco di Goggia. \"Sono stati anni meravigliosi\"","summary_no":"Atomic viste en fin gest da «Babi» Greppi fikk stå side om side med Sofia Goggia under Media Day. «Det har vært fantastiske år», uttalte han.","spik_no":"Under Atomics tradisjonelle Media Day i Altenmarkt fikk den italienske skismøreren «Babi» Greppi en hederlig plass ved siden av Sofia Goggia – et anerkjennende selskap fra utstyrsmerket til en mann som har jobbet tett med utøveren gjennom mange år. Greppi selv beskrev samarbeidet som «fantastiske år». Goggia er en av alpinverdenens fremste utforkjørere og har vunnet OL-gull og flere store kultrenn, og skismørernes rolle i suksessen hennes er betydelig. Atomic samlet hele sin stjerneflokk i Altenmarkt, inkludert Mikaela Shiffrin, som nylig sikret merket nok en sammenlagttittel i Verdenscupen.","url":"https://www.neveitalia.it/sport/scialpino/news/il-bellissimo-gesto-di-atomic-al-media-day-ecco-babi-greppi-al-fianco-di-goggia-sono-stati-anni-meravigliosi","pub_date":"2026-10-08T16:00:00.000Z","fetched_at":"2026-10-08 16:15:08","lang_orig":"it","category":null,"athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":7649,"source_name":"Neveitalia","country":"ITA","title_no":"Travel todagersperiode for FISI: Media Day i Milano og valg i Verona","title_orig":"Arriva una due giorni campale in casa FISI: domani il Media Day a Milano, tra meno di 48 ore le attese elezioni a Verona","summary_no":"FISI står overfor en travel periode med Media Day i Milano i morgen og etterlengtet valg i Verona om under 48 timer.","spik_no":"Det italienske skiforbundet FISI går inn i en travel todagersperiode med Media Day i Milano fredag og forbundsledervalg i Verona lørdag. På Media Day ved Teatro Armani stiller alle olympiske medaljører og verdenscupvinnere fra sesongen 2025/26. Valget lørdag formiddag er etterlengtet, men utfallet er usikkert — presidenkandidat Roda trenger to tredjedelers flertall, og ballottasje mellom Noris og Bortoluzzi er ikke utelukket.","url":"https://www.neveitalia.it/sport/eventi/news/arriva-una-due-giorni-campale-in-casa-fisi-domani-il-media-day-a-milano-tra-meno-di-48-ore-le-attese-elezioni-a-verona","pub_date":"2026-10-08T13:50:00.000Z","fetched_at":"2026-10-08 14:00:10","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":7094,"source_name":"SkinEWS","country":"SUI","title_no":"FIS-rennsjef Markus Waldner gir fra seg stillingen","title_orig":"FIS-Renndirektor Markus Waldner gibt sein Amt in neue Hände","summary_no":"FIS-rennsjef Markus Waldner overlater sitt embete til nye hender.","spik_no":"Markus Waldner gir fra seg stillingen som FIS-rennsjef for herrealpin etter rundt tolv år i rollen. Den 63 år gamle sørtirolerens har vært en sentral figur i Verdenscupen, og var mannen som forklarte utsettelser og avlysninger når forholdene ikke tillot racing. I løpet av sesongen 2026/27 skal han lære opp sin etterfølger og kan fortsette å bidra i FIS i en annen funksjon.","url":"https://www.skinews.ch/news/2026/renndirektor-markus-waldner-haende/","pub_date":"2026-10-08T12:17:34.000Z","fetched_at":"2026-10-08 12:30:03","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":6893,"source_name":"Neveitalia","country":"ITA","title_no":"FISI om Franzoso-etterforskningen: – Saken henlagt med CONIs godkjenning","title_orig":"La FISi e la nota sulle indagini legate alla morte di Franzoso: \"Archiviazione con parere favorevole del CONI, abbiamo chiesto anche un supplemento di indagini\"","summary_no":"Det italienske skiforbundet FISI kommenterer etterforskningen knyttet til Franzosos død, og opplyser at saken er henlagt med CONIs støtte, men at de har bedt om ytterligere undersøkelser.","spik_no":"Det italienske skiforbundet FISI bekrefter at etterforskningen knyttet til fartsspesialist Matteo Franzosos dødsfall er henlagt, med støtte fra den italienske olympiske komiteen CONI, men at forbundet selv har bedt om ytterligere undersøkelser. Franzoso omkom under trening i Chile 13. september 2025, og saken har skapt debatt etter at mediegruppen Nord Est Multimedia publiserte opplysninger om mulige feil begått av det tekniske støtteapparatet. FISI har nå gått ut med en offisiell uttalelse for å klargjøre sin posisjon, trolig også for å dempe spekulasjoner i forkant av forbundets valgmøte 10. oktober 2026.","url":"https://www.neveitalia.it/sport/scialpino/news/la-fisi-e-la-nota-sulle-indagini-legate-alla-morte-di-franzoso-archiviazione-con-parere-favorevole-del-coni-abbiamo-chiesto-anc","pub_date":"2026-10-08T11:45:00.000Z","fetched_at":"2026-10-08 12:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":6829,"source_name":"VG","country":"NOR","title_no":"Skitopp gir seg etter 12 år: – Presset hopet seg opp","title_orig":"Skitopp gir seg etter 12 år: – Presset hopet seg opp","summary_no":"","spik_no":"Markus Waldner trekker seg som FIS-renndirektør for alpint for menn etter 12 år i rollen, bare uker før verdenscupsesongen åpner i Sölden 24. oktober. Italieneren begrunner avgangen med at presset har hopet seg opp til et punkt der han ikke lenger føler han har energi til å gjennomføre en full sesong. Damenes renndirektør Peter Gerdol tar over hans oppgaver inntil videre. I Norge er Waldner først og fremst kjent som mannen som avlyste renn og håndterte kritikk etter skadeomganger på krevende løyper.","url":"https://www.vg.no/sport/i/d77l4q/alpint-markus-waldner-gir-seg-som-renndirektoer-i-fis","pub_date":"2026-10-08T11:33:46.000Z","fetched_at":"2026-10-08 11:45:13","lang_orig":"no","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":6622,"source_name":"Neveitalia","country":"ITA","title_no":"Kristoffersen og Hirscher tilbake fra Sør-Amerika – og god sponsornyheter for Norge","title_orig":"Kristoffersen e Hirscher, i vecchi rivali rientrano da Cile e Argentina. E per il norge c'è una bella notizia legata allo sponsor...","summary_no":"Henrik Kristoffersen og Marcel Hirscher er tilbake etter treningsopphold i Chile og Argentina, samtidig som det meldes om positive sponsornyheter for det norske landslaget.","spik_no":"Henrik Kristoffersen og Marcel Hirscher er begge tilbake i Europa etter treningsopphold i Sør-Amerika, der Kristoffersen testet nytt HEAD-materiell i Chile mens Hirscher trente i Argentina. De to gamle rivalene kan møtes igjen i åpningsrennet i Sölden, der Kristoffersen tok andreplass for to sesonger siden. En stor nyhet er at det norske skiforbundet har inngått avtale med Red Bull som sponsor – ironisk nok ettersom det var nettopp en strid om Red Bull-sponsing som for ti år siden satte Kristoffersen og forbundet opp mot hverandre i en langvarig juridisk konflikt.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/kristoffersen-e-hirscher-i-vecchi-rivali-rientrano-da-cile-e-argentina-e-per-il-norge-c-e-una-bella-notizia-legata-allo-sponsor","pub_date":"2026-10-08T11:10:00.000Z","fetched_at":"2026-10-08 11:15:10","lang_orig":"it","category":null,"athletes":"Henrik Kristoffersen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":6434,"source_name":"Neveitalia","country":"ITA","title_no":"Waldner trekker seg som FIS-løpsdirektør: – Har ikke motivasjonen til en ny sesong","title_orig":"Clamoroso, Markus Waldner si è dimesso dalla carica di race director FIS: \"Non ho la mentalità necessaria per un'altra stagione\"","summary_no":"Markus Waldner har overraskende trukket seg fra stillingen som løpsdirektør i FIS. Han begrunner avgjørelsen med at han ikke har den rette innstillingen for en ny sesong.","spik_no":"Markus Waldner har overraskende trukket seg som FIS-løpsdirektør for herrealpint, bare drøyt to uker før sesongåpningen i Sölden. Waldner, som har ledet herrenes Verdenscup-program siden 2014, begrunner avgjørelsen med at han mangler den rette motivasjonen og mentale innstillingen til en ny sesong. I en overgangsfase vil Peter Gerdol, som til daglig er løpsdirektør for damealpint, overta ansvaret for herrearrangementene. FIS jobber med å finne en permanent løsning så raskt som mulig.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/clamoroso-markus-waldner-si-e-dimesso-dalla-carica-di-race-director-fis-non-ho-la-mentalita-necessaria-per-un-altra-stagione","pub_date":"2026-10-08T10:40:00.000Z","fetched_at":"2026-10-08 10:45:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":6482,"source_name":"ORF Sport","country":"AUT","title_no":"Waldner slutter som FIS-løpsdirektør","title_orig":"Waldner hört als FIS-Renndirektor auf","summary_no":"Markus Waldner gir seg som løpsdirektør i Det internasjonale skiforbundet FIS.","spik_no":"Markus Waldner trekker seg som løpsdirektør for herrenes alpine Verdenscup i FIS. Sørtirolereren har hatt stillingen siden 2014 og har dermed hatt ansvaret for programsetting, løpsledelse og sikkerhetsavgjørelser i tolv sesonger. Han vil bistå sin etterfølger gjennom hele sesongen 2026/27 i en overgangsperiode. Waldner forklarer avgangen med at presset har bygget seg opp over år til et punkt der han ikke lenger har energien eller den rette innstillingen til å gjøre jobben slik han selv ønsker.","url":"https://sport.orf.at/stories/3163351/","pub_date":"2026-10-08T10:31:25.000Z","fetched_at":"2026-10-08 10:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":5933,"source_name":"Neveitalia","country":"ITA","title_no":"Saken mot Franzoso henlagt, men «klanderverdig atferd fra forbundets teknikere»","title_orig":"Il caso Franzoso archiviato, ma \"per la sua morte ci sarebbero stati da parte dei tecnici federali comportamenti censurabili\"","summary_no":"Saken om Franzosos død er henlagt, men det konkluderes med at forbundets teknikere skal ha opptrådt på en klanderverdig måte i forbindelse med dødsfallet.","spik_no":"Saken mot det italienske skiforbundets teknikere etter Matteo Franzosos død er henlagt, men påtalemyndigheten i CONI konkluderte med at forbundets teknikere opptrådte på en klanderverdig måte i forbindelse med dødsfallet. Franzoso, en italiensk utforløper født i 1999, omkom 15. september 2023 på en klinikk i Santiago i Chile, to dager etter at han pådro seg fatale skader under en samling med landslaget på La Parva. Familien har offentlig gitt uttrykk for at de følte seg forlatt av forbundet, og brorens klubb Genoa inviterte ham til kamp for å hedre minnet om Matteo på ettårsdagen for ulykken.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/il-caso-franzoso-archiviato-ma-per-la-sua-morte-ci-sarebbero-stati-da-parte-dei-tecnici-federali-comportamenti-censurabili","pub_date":"2026-10-08T09:20:00.000Z","fetched_at":"2026-10-08 09:30:11","lang_orig":"it","category":"viktig","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":5913,"source_name":"SVT Sport","country":"SWE","title_no":"Caroline Andersson husker ingenting etter krasjen: – Fem dager uten minner","title_orig":"Caroline Andersson blank efter kraschen: ”Inga minnen på fem dagar”","summary_no":"Den svenske alpinisten Caroline Andersson har ingen minner fra en periode på fem dager etter krasjen hun var involvert i.","spik_no":"Den svenske syklisten Caroline Andersson har ingen minner fra en periode på fem dager etter den alvorlige krasjen under sykkel-VM i Montreal for ti dager siden. 25-åringen pådro seg brudd i venstre kragebein og bekken, to ansiktsfrakturer og fire mindre hjerneblødninger i ulykken, og sover nå 16 timer i døgnet som del av rehabiliteringen. Tross skadeomfanget er Andersson fast bestemt på å komme tilbake til toppnivå. Saken er ikke tilknyttet alpint, men viser alvoret i ekstremskader innen vintersport og sykling på høyt nivå.","url":"https://www.svt.se/sport/cykel/caroline-andersson-blank-efter-kraschen-inga-minnen-pa-fem-dagar","pub_date":"2026-10-08T09:10:06.000Z","fetched_at":"2026-10-08 09:15:13","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":5488,"source_name":"Neveitalia","country":"ITA","title_no":"Mange italienske alpinister klar for tester ved Centro Mapei","title_orig":"Tantissimi azzurri pronti ai test al Centro Mapei, da 6 velocisti di CdM alle ragazze delle discipline tecniche","summary_no":"Et stort antall italienske utøvere gjør seg klar til tester ved Centro Mapei, blant dem seks utfor-løpere fra verdenscupen og flere tekniske utøvere på kvinnesiden.","spik_no":"Et stort antall italienske alpinister gjennomfører fysiske tester ved Centro Mapei i Olgiate Olona som del av oppkjøringen til neste sesong. Seks utøvere fra verdenscupgruppen i de raske disiplinene er involvert — Marco Abbruzzese, Benjamin Alliod, Gregorio Bernardi, Niccolò Molteni, Max Perathoner og Pietro Zazzi — og testes under ledelse av kondisjonstrener Davide Verga. Centro Mapei er et anerkjent idrettsvitenskapelig senter som det italienske skiforbundet jevnlig benytter i sin sesongforberedelse.","url":"https://www.neveitalia.it/sport/scialpino/news/tantissimi-azzurri-pronti-ai-test-al-centro-mapei-da-6-velocisti-di-cdm-alle-ragazze-delle-discipline-tecniche","pub_date":"2026-10-08T08:15:00.000Z","fetched_at":"2026-10-08 08:15:14","lang_orig":"it","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":5526,"source_name":"VG","country":"NOR","title_no":"Etter skrekkskaden: Vonn tatt ut på USAs verdenscuplag","title_orig":"Etter skrekkskaden: Vonn tatt ut på USAs verdenscuplag","summary_no":"","spik_no":"Lindsey Vonn er tatt ut på USAs verdenscuplag til kommende sesong, til tross for at et comeback i løpene virker praktisk talt utelukket. Under årets vinter-OL i Cortina d'Ampezzo pådro hun seg et komplisert brudd i leggbeinet og risikerte amputasjon. En ny operasjon i november, der metallplater skal fjernes og korsbåndet repareres, ventes å kreve seks måneder med rehabilitering. Vonn, som vant OL-gull i utfor i 2010, kom tilbake til sporten foran 2024/25-sesongen med Aksel Lund Svindal som trener, og ledet verdenscupen i utfor da ulykken inntraff.","url":"https://www.vg.no/sport/i/WggbxG/etter-skrekkskaden-vonn-tatt-ut-paa-usas-verdenscuplag","pub_date":"2026-10-08T08:08:33.000Z","fetched_at":"2026-10-08 08:15:16","lang_orig":"no","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":5213,"source_name":"Neveitalia","country":"ITA","title_no":"Italienske parallellkjørere tilbake på Stelvio neste uke","title_orig":"Anche la prossima settimana allo Stelvio per gli azzurri del parallelo: tutti i big di CdM tornano in pista","summary_no":"De italienske parallellspesialistene fortsetter treningen på Stelvio neste uke, og samtlige store Verdenscup-utøvere vender tilbake til pisten.","spik_no":"De italienske parallellspesialistene i snowboard samles på Stelvio-breen 12.–16. oktober, i forberedelsene til verdenscupsesongen som åpner i Kina i slutten av november. Troppen ledes av Maurizio Bormolini, som er forsvarende innehaver av alle de mannlige krystallkulene i parallellgreinene. Stelvio er et sentralt treningssted for alpinister og snowboardkjørere på denne tiden av året takket være breen, som gir tilgang til snø tidlig i sesongen.","url":"https://www.neveitalia.it/snowboard/news/anche-la-prossima-settimana-allo-stelvio-per-gli-azzurri-del-parallelo-tutti-i-big-di-cdm-tornano-in-pista","pub_date":"2026-10-08T07:30:00.000Z","fetched_at":"2026-10-08 07:42:55","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":5284,"source_name":"SVT Sport","country":"SWE","title_no":"Lindsey Vonn tatt ut til landslaget – etter OL-krasjen","title_orig":"Lindsey Vonn uttagen till landslaget – efter kraschen i OS","summary_no":"Lindsey Vonn er overraskende nominert til det amerikanske alpinlandslaget etter sitt dramatiske fall under OL.","spik_no":"Lindsey Vonn er tatt ut til det amerikanske alpinlandslaget etter det dramatiske fallet i OL-utforkjøringen i Cortina d'Ampezzo tidligere i år, der hun pådro seg et komplekst brudd i venstre leggbein. Farenhennes uttalte etter ulykken at han mente karrieren var over, men forbundet har altså valgt å inkludere henne i troppen. Vonn, som har 84 verdenscupseire og fire sammenlagtseirer, avsluttet opprinnelig karrieren i 2019 før hun overraskende kom tilbake i 2024 – og må nå gjennom ytterligere en operasjon i november.","url":"https://www.svt.se/sport/alpint/lindsey-vonn-uttagen-till-landslagstruppen-efter-kraschen-i-os","pub_date":"2026-10-07T19:01:40.000Z","fetched_at":"2026-10-08 07:42:58","lang_orig":"sv","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":5269,"source_name":"ORF Sport","country":"AUT","title_no":"Vonn overraskende nominert til det amerikanske verdenscuplaget","title_orig":"Vonn überraschend für US-Weltcup-Team nominiert","summary_no":"Lindsey Vonn er uventet tatt ut til det amerikanske alpinlandslaget for verdenscupen.","spik_no":"Lindsey Vonn er overraskende nominert til det amerikanske alpinlandslaget for verdenscupsesongen 2026–27, til tross for at hun fortsatt er under rehabilitering etter et alvorlig fall under OL-utforkjøringen i Cortina i februar. Den 41 år gamle stjernen pådro seg et komplekst brudd i venstre leggbein, og en planlagt operasjon i november skal fjerne metall og erstatte korsbåndet – noe som gjør comeback tidligst aktuelt i sesongen 2027–28. FIS har allerede bekreftet at Vonn, som har 84 verdenscupseire, vil få wildcard om hun velger å returnere.","url":"https://sport.orf.at/stories/3163341/","pub_date":"2026-10-07T18:25:07.000Z","fetched_at":"2026-10-08 07:42:58","lang_orig":"de","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":["Sportschau"],"norwegian":false},{"id":5214,"source_name":"Neveitalia","country":"ITA","title_no":"Kan Haugan overraske i Sölden? Nordmannen trener strålende og sikter mot toppen i storslalåm","title_orig":"E se a Soelden... sorprendesse Haugan? Il vichingo si allena alla grande e vuole tornare davanti anche in gigante","summary_no":"Timon Haugan er i storform under forberedelsene og drømmer om å utfordre i toppen når Verdenscup-sesongen åpner i Sölden.","spik_no":"Timon Haugan er i god form under sesongforberedelsene og sikter mot en sterk åpning i storslalåm når verdenscupen starter i Sölden 25. oktober. Den 29-årige nordmannen har avsluttet to åpningsrenn i Sölden på 12.-plass, og har hatt ryggen under kontroll i treningsperioden fra New Zealand og videre på bre. Haugan er primært en slalåmkjører, men artikkelen peker på at lagets sterkeste kort i Sölden likevel kan være Atle Lie McGrath, som har avsluttet de to siste utgavene av åpningsrennet på tredjeplass.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/e-se-a-soelden-sorprendesse-haugan-il-vichingo-si-allena-in-senales-e-vuole-tornare-davanti-anche-in-gigante","pub_date":"2026-10-07T17:55:00.000Z","fetched_at":"2026-10-08 07:42:55","lang_orig":"it","category":null,"athletes":"Timon Haugan","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":5215,"source_name":"Neveitalia","country":"ITA","title_no":"Ledecka åpner seg: nytt team, nytt utstyr og usikkerhet rundt snowboardet","title_orig":"Torna a parlare Ledecka e... svela tutto: nuovo staff e approccio a HEAD col sorriso: \"Lo snowboard? Vediamo...\"","summary_no":"Ester Ledecka avslører at hun har skiftet støtteapparat og begynt samarbeidet med HEAD med et smil, men er fortsatt usikker på snowboard-satsingen.","spik_no":"Ester Ledecka, den tsjekkiske trippel-olympiske mesteren i alpint og snowboard, starter en ny sesong med betydelige endringer – hun har byttet til utstyrsleverandøren HEAD og hentet inn nytt støtteapparat med Karlheinz Pichler og Gernot Grasser som nye teknikere. Fjoråret var skuffende: bare ett alpinpodium og en overraskende kvartfinaleelliminering i snowboard-PGS under OL i Livigno, der hun jaktet sitt tredje strake OL-gull i disiplinen. Ledecka er usikker på omfanget av snowboard-satsingen fremover og antyder at dette vil avklares underveis.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/torna-a-parlare-ledecka-e-svela-tutto-nuovo-staff-e-approccio-a-head-col-sorriso-lo-snowboard-vediamo","pub_date":"2026-10-07T17:20:00.000Z","fetched_at":"2026-10-08 07:42:55","lang_orig":"it","category":null,"athletes":"Ester Ledecka","athlete_nations":["CZE"],"also_sources":[],"norwegian":false},{"id":5193,"source_name":"Ski Racing","country":"INT","title_no":"Det amerikanske alpinlandslaget for 2026–27 er klart","title_orig":"2026-27 Stifel U.S. Ski Team Announced: Full Alpine Roster","summary_no":"Det amerikanske skiforbundet har offentliggjort den fullstendige alpintroppen i Stifel U.S. Ski Team for sesongen 2026–27.","spik_no":"Det amerikanske skiforbundet har offentliggjort en alpintropp på 49 utøvere for sesongen 2026–27, fordelt på 26 kvinner og 23 menn. Mikaela Shiffrin er med, men med et endret program der hun kjører færre slalåmrenn, mens Breezy Johnson entrer sesongen som forsvarende olympisk og verdensmester i utfor. Lindsey Vonn er overraskende nominert til A-laget, til tross for at hun fortsatt rehabiliterer seg etter OL-fallet og ikke ventes å komme tilbake på ren før tidligst sesongen 2027–28.","url":"https://skiracing.com/2026-27-stifel-u-s-ski-team-announced-full-alpine-roster/","pub_date":"2026-10-07T17:17:19.000Z","fetched_at":"2026-10-08 07:42:54","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":5271,"source_name":"ORF Sport","country":"AUT","title_no":"Shiffrin og co. legger inn en gir","title_orig":"Shiffrin und Co. treten auf Belastungsbremse","summary_no":"Mikaela Shiffrin og flere andre alpinstjerner velger å begrense belastningen sin i den kommende perioden.","spik_no":"Mikaela Shiffrin bekreftet tirsdag at hun kommer til å kjøre bare et utvalg slalåmrenn i den kommende verdenscupsesongen, og kaller det selv en «erforskningssesong». Den 31-årige amerikaneren, som har 110 verdenscupseire og er den mestervinnende alpinisten gjennom tidene, ønsker å flytte fokus bort fra den disiplinerte rennrytmen som har preget 16 år med karriere. Samme tendens ses i det østerrikske laget, der Manuel Feller og Marco Schwarz også har valgt å redusere rennprogrammet sitt.","url":"https://sport.orf.at/stories/3163320/","pub_date":"2026-10-07T17:04:57.000Z","fetched_at":"2026-10-08 07:42:58","lang_orig":"de","category":null,"athletes":"Manuel Feller,Marco Schwarz,Mikaela Shiffrin","athlete_nations":["AUT","USA"],"also_sources":[],"norwegian":false},{"id":5126,"source_name":"SkinEWS","country":"SUI","title_no":"De endelige amerikanske troppene har fått flere tilskudd","title_orig":"Die definitiven US-Kader haben noch Zuwachs bekommen","summary_no":"De amerikanske alpintroppene er blitt utvidet med nye løpere etter at de endelige laguttakene ble offentliggjort.","spik_no":"Det amerikanske alpinforbundet har utvidet sine endelige tropper med nye løpere etter at de offisielle laguttakene ble offentliggjort. USA har tradisjonelt hatt sterke alpinlag på både herre- og damesiden, med profiler som Mikaela Shiffrin og tidligere Bode Miller som flaggbærere. Tilskuddene til troppen kan handle om skadeutfall, unge løpere som har kvalifisert seg gjennom resultater, eller taktiske vurderinger fra forbundet foran en ny sesong.","url":"https://www.skinews.ch/news/2026/definitiven-zuwachs-bekommen/","pub_date":"2026-10-07T16:39:39.000Z","fetched_at":"2026-10-07 16:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":5005,"source_name":"Neveitalia","country":"ITA","title_no":"Lindsey Vonn står over hele 2026/27-sesongen, men forblir i det amerikanske skiforbundet","title_orig":"Lindsey Vonn ai box per l'intero 2026/27, ma inserita nei quadri federali: ufficializzato l'US Ski Team","summary_no":"Lindsey Vonn vil ikke konkurrere i sesongen 2026/27, men er offisielt bekreftet som en del av US Ski Teams tropp.","spik_no":"Lindsey Vonn står over hele 2026/27-sesongen, men er offisielt bekreftet som del av det amerikanske skiforbundets tropp. Den 40 år gamle amerikaneren kom tilbake til konkurransesirkuset i desember 2024 etter flere år med skader, og avsluttet karrieren nok en gang i mars 2025. Vonn er den mest dekorerte alpinisten i amerikansk skihistorie med 82 verdenscupseire og olympisk gull i utfor fra Vancouver 2010, og hennes tilknytning til US Ski Team opprettholdes trolig av kommersielle og ambassadørmessige årsaker.","url":"https://www.neveitalia.it/sport/scialpino/news/lindsey-vonn-ai-box-per-l-intero-2026-27-ma-inserita-nei-quadri-federali-ufficializzato-l-us-ski-team","pub_date":"2026-10-07T16:25:00.000Z","fetched_at":"2026-10-07 16:30:02","lang_orig":"it","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":4817,"source_name":"Neveitalia","country":"ITA","title_no":"Trinkl, Plancker og Hladnik inspiserte VM-løypa «La Ciampinoi»","title_orig":"Non solo la tappa di CdM, ma anche l'ispezione su \"La Ciampinoi\" mondiale per Trinkl, Plancker e Hladnik","summary_no":"Foruten function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';
  if (days <= 45) return '🎿 Forsesong — ' + nxt.venue + ' om ' + days + ' dager';
  return '💤 Sommerpause';
}
document.getElementById('season-badge').textContent = seasonStatus();

function getRace(str) {
  if (!str) return null;
  const d = new Date(str);
  if (isNaN(d)) return null;
  const s = d.toISOString().slice(0,10);
  return RACES.find(r => s >= r.date && s <= r.end) || null;
}

function fmt(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' kl. ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

      ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
      ${race ? `<span class="race-chip">🏁 ${race.venue}</span>` : ''}
      <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
    </div>
    <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="card-title">${title}</a>
    ${a.summary_no ? `<p class="card-summary">${a.summary_no}</p>` : ''}
    ${a.spik_no ? `<div class="card-spik"><span class="spik-label">📻 SPIK</span><span class="spik-text">${a.spik_no}</span></div>` : ''}
  </div>`;
}

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function render() {
  renderFilterRow();
  const words = norm(searchQ).split(/\s+/).filter(Boolean);
  const pool = words.length && extraLoaded ? ARTICLES_ALL : ARTICLES;
  const visible = pool.filter(a => {
    if (activeCountry === 'INT' ? a.country !== 'INT' : (activeCountry && !(a.athlete_nations || []).includes(activeCountry))) return false;
    if (activeCat && a.category !== activeCat) return false;
    if (activeAthlete && !(a.athletes||'').split(',').map(s=>s.trim()).includes(activeAthlete)) return false;
    if (words.length) {
      const hay = norm([a.title_no, a.title_orig, a.summary_no, a.spik_no, a.athletes, a.source_name, (a.also_sources||[]).join(' '), a.category,
        ...(a.athlete_nations||[]).map(c => c + ' ' + ((NATION_META[c]||[])[1]||''))].filter(Boolean).join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });

  document.getElementById('count').textContent = visible.length + ' saker';

  const feed = document.getElementById('feed');
  feed.innerHTML = visible.length
    ? visible.map(a => cardHtml(a, false)).join('')
    : `<div class="empty">${words.length || activeCountry || activeCat || activeAthlete ? 'Ingen treff' : 'Ingen saker'}</div>`;

  // Spik-liste: vis alle kategoriserte (ufiltrert på land/utøver/søk for sidepanelet, men respekter kategori-filter)
  const spikFilter = activeCat
    ? ARTICLES.filter(a => a.category === activeCat)
    : ARTICLES.filter(a => a.category);

  const spikEl = document.getElementById('spik-list');
  const spikLabel = document.getElementById('spik-label');
  spikLabel.textContent = 'Spik-liste (' + spikFilter.length + ')';

  if (!spikFilter.length) {
    spikEl.innerHTML = '<div class="sidebar-empty">Ingen saker valgt ut ennå</div>';
    return;
  }

  // Grupper etter kategori
  const grouped = {};
  CATS.forEach(c => { grouped[c.id] = []; });
  spikFilter.forEach(a => { if (grouped[a.category]) grouped[a.category].push(a); });

  spikEl.innerHTML = CATS.map(cat => {
    const items = grouped[cat.id];
    if (!items.length) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--${cat.id === 'goy' ? 'goy' : cat.id});padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${cat.label}</div>
      ${items.map(a => cardHtml(a, true)).join('')}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
