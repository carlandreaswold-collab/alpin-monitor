.at/stories/3165198/","pub_date":"2026-11-20T19:28:49.000Z","fetched_at":"2026-11-20 19:30:03","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":202433,"source_name":"Ski Racing","country":"INT","title_no":"Startliste for kvinneslalåm i Gurgl: Aicher leder, Colturi jakter første seier","title_orig":"Gurgl Women’s Slalom Start List: Aicher Leads, Colturi Chases First Win","summary_no":"Aicher går ut som favoritt i kvinneslalåmen i Gurgl, mens Colturi sikter mot sin aller første verdenscupseier.","spik_no":"Emma Aicher leder startlisten i kvinneslalåmen i Gurgl etter at hun vant sesongåpningen i Levi, og topper dermed slalåmcupen med 100 poeng. Lara Colturi har vært toer i begge tidligere Gurgl-slalåmer og jakter sin aller første verdenscupseier. Camille Rast har vært tredjedeler i begge disse rennene og er også å regne med. Mikaela Shiffrin, som har vunnet begge tidligere Gurgl-slalåmer, er fraværende og trener i USA foran sin planlagte comeback i Killington – noe som garanterer en ny vinner på pallen i Gurgl i år.","url":"https://skiracing.com/gurgl-womens-slalom-start-list-2026/","pub_date":"2026-11-20T19:02:45.000Z","fetched_at":"2026-11-20 19:15:02","lang_orig":"en","category":null,"athletes":"Camille Rast,Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER","SUI"],"also_sources":[],"norwegian":false},{"id":201752,"source_name":"Neveitalia","country":"ITA","title_no":"Holdener med startnummer 1 i Gurgl-slalåm – her er startlisten","title_orig":"Holdener con l'1, Rast pesca il 4 poi Aicher e Colturi in uno slalom di Gurgl tutto da vedere. Della Mea n° 13: la startlist","summary_no":"Holdener åpner med startnummer 1, mens Rast trekker nummer 4 foran Aicher og Colturi. Della Mea starter som nummer 13 i slalåmen i Gurgl.","spik_no":"Wendy Holdener åpner slalåmen i Gurgl med startnummer 1, og sveitseren er samtidig leder i slalåmcupen denne sesongen. Gurgl er inne i World Cup-kalenderen for tredje år på rad, og rennet på Kirchenkar-løypa i 2500 meters høyde har blitt en fast del av november-programmet. Holdener er en av slalåmens mest meritterte utøvere uten en individuell World Cup-seier i slalåm – hun har ni pallplasser i disiplinen og er stadig på jakt etter den første triumfen. Lena Dürr og Mikaela Shiffrin har dominert i Gurgl de to foregående årene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/holdener-con-l-1-rast-pesca-il-4-poi-aicher-e-colturi-in-uno-slalom-di-gurgl-tutto-da-vedere-della-mea-n-13-la-startlist","pub_date":"2026-11-20T18:05:00.000Z","fetched_at":"2026-11-20 18:15:01","lang_orig":"it","category":null,"athletes":"Camille Rast,Emma Aicher,Lara Colturi,Wendy Holdener","athlete_nations":["ALB","GER","SUI"],"also_sources":[],"norwegian":false},{"id":201380,"source_name":"Ski Racing","country":"INT","title_no":"Molly Butler ser tilbake på sin verdenscupdebut i slalåm i Levi","title_orig":"Molly Butler Reflects on Her World Cup Slalom Debut in Levi","summary_no":"Molly Butler reflekterer over sin første verdenscupopplevelse i slalåm etter debuten i Levi.","spik_no":"Den 20 år gamle britiske slalåmkjøreren Molly Butler gjorde sin verdenscupdebut i Levi 14. november 2026, men røk ut i første omgang med startnummer 59. Hun var likevel fornøyd med opplevelsen og beskrev det å stå i verdenscupstarten som «akkurat den følelsen jeg ønsket meg». Butler var Storbritannias høyest rangerte kvinne på FIS slalåmpoenglistens ved Levi-runden, og hadde tidligere representert Storbritannia i slalåm under VM i Saalbach i 2025. Hun ble tidlig trent av de tre Carrick-Smith-brødrene og sin mor Jay Blatherwick.","url":"https://skiracing.com/molly-butler-reflects-on-her-world-cup-slalom-debut-in-levi/","pub_date":"2026-11-20T17:38:54.000Z","fetched_at":"2026-11-20 17:45:01","lang_orig":"en","category":null,"athletes":"Molly Butler","athlete_nations":["GBR"],"also_sources":[],"norwegian":false},{"id":199687,"source_name":"ORF Sport","country":"AUT","title_no":"Resultater og strømming fra Mixed Team-konkurransen","title_orig":"Stand und Stream vom Mixed-Team-Bewerb","summary_no":"Her finner du stillinger og direktestrømming fra Mixed Team-konkurransen i alpint.","spik_no":"Mixed Team-konkurransen i Lillehammer åpner den nye hoppvintersen, og etter første omgang leder Norge foran Japan og Tyskland. Det norske laget består blant andre av Gyda Westvold Hansen og Marius Lindvik, to av verdens beste hoppere i sine respektive klasser. Lagkonkurransen i kombinert hopp er et relativt nytt format som samler to kvinner og to menn på hvert lag, og gir nasjoner med bred bredde i hoppstallen et fortrinn.","url":"https://sport.orf.at/stories/3165178/","pub_date":"2026-11-20T15:01:59.000Z","fetched_at":"2026-11-20 15:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":198766,"source_name":"SkinEWS","country":"SUI","title_no":"Vlhova hopper over Gurgl – tvinges til pause","title_orig":"Verzicht auf Gurgl-Start – Petra Vlhova muss eine Pause einlegen","summary_no":"Petra Vlhova trekker seg fra rennet i Gurgl og må ta en pause fra konkurransene.","spik_no":"Petra Vlhova hopper over slalåmen i Gurgl og vil heller ikke stille i Killington eller Mont-Tremblant i slutten av november og begynnelsen av desember. Den 31 år gamle slovaken vendte tilbake til verdenscupen i Sölden i slutten av oktober etter over to og et halvt års fravær som følge av en alvorlig kneskade, og tok en 16.-plass i Levi. Vlhova understreker at hun er frisk og smertefri, men trenger mer tid til å bygge fysisk form og finpusse teknikken før hun returnerer til konkurranse. Hun vant den samlede verdenscupen i sesongen 2020/21.","url":"https://www.skinews.ch/news/2026/vericht-vlhova-einlegen/","pub_date":"2026-11-20T13:51:38.000Z","fetched_at":"2026-11-20 14:00:09","lang_orig":"de","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":198889,"source_name":"Sportschau","country":"GER","title_no":"I Riesches fotspor: Aicher tar opp kampen i Gurgl","title_orig":"Auf den Spuren von Riesch: Aicher greift in Gurgl an","summary_no":"Aicher gjør seg klar til å angripe i Gurgl, inspirert av den tidligere stjernen Riesch.","spik_no":"Emma Aicher går til start i Gurgl som favoritt etter å ha vunnet slalåmen i Levi forrige helg – hennes første verdenscupseier i disiplinen. 23-åringen fra Tyskland er nå på jakt etter sitt femte slalåmpall på rad i verdenscupen, og med det vil hun matche den tyske legenden Maria Riesch, som er den eneste DSV-utøveren som har klart fem strake slalåmpaller. Mikaela Shiffrin, som vant de to første utgavene av Gurgl-rennet, stiller ikke til start, noe som åpner feltet betraktelig.","url":"https://www.sportschau.de/wintersport/ski-alpin/auf-den-spuren-von-hoefl-riesch-aicher-greift-in-gurgl-an,ski-alpin-aicher-auf-spuren-von-hoefl-riesch-100.html","pub_date":"2026-11-20T13:46:29.000Z","fetched_at":"2026-11-20 14:00:11","lang_orig":"de","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":198438,"source_name":"Neveitalia","country":"ITA","title_no":"Vlhova hopper over Gurgl og Nord-Amerika: «Kneet er bra, men jeg må bygge meg opp igjen»","title_orig":"Vlhova, scelta tosta: salta Gurgl e la trasferta nordamericana: \"Il ginocchio sta bene, ma devo ricostruirmi con l'allenamento\"","summary_no":"Petra Vlhova dropper rennene i Gurgl og Nord-Amerika. Selv om kneet er friskt, trenger hun mer trening for å komme i kampform.","spik_no":"Petra Vlhova hopper over slalåmrennet i Gurgl og hele Nord-Amerika-turneén, inkludert Killington og Mont-Tremblant. Den slovakiske stjernen kom tilbake fra en alvorlig kneskadesone til sesongstart, men resultatene – 23. plass i storslalåm i Sølden og 16. plass i slalåm i Levi – viser at hun ennå ikke er tilbake på sitt beste nivå. Vlhova understreker at kneet er friskt, men at hun trenger mer treningstid for å bygge opp formen. Planen er å være tilbake i World Cup-sporet til Saint-Moritz eller Courchevel, som begge er tekniske omgivelser hun trives godt i.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/vlhova-scelta-tosta-salta-gurgl-e-la-trasferta-nordamericana-il-ginocchio-sta-bene-ma-devo-ricostruirmi-con-l-allenamento","pub_date":"2026-11-20T13:20:00.000Z","fetched_at":"2026-11-20 13:30:01","lang_orig":"it","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":198262,"source_name":"Neveitalia","country":"ITA","title_no":"Laura feirer bursdag og gleder seg til Beaver Creek – Pirovano hylles med Killington i sikte","title_orig":"Laura, il compleanno e il conto alla rovescia per Beaver Creek. Oggi si festeggia Pirovano, con Killington all'orizzonte","summary_no":"Laura markerer bursdagen sin med blikket rettet mot Beaver Creek, mens Pirovano feires med Killington på horisonten.","spik_no":"Den italienske alpinisten Laura Pirovano fylte 29 år under treningssamlingen på Copper Mountain, der det italienske landslaget forbereder seg til sesongåpningen i utforkjøring på Birds of Prey i Beaver Creek 11.–13. desember. Pirovano har hatt en bemerkelsesverdig karriere etter to alvorlige skader mellom 2018 og 2021, og avsluttet fjorårssesongen i storform med tre strake seirer og sammenlagtseieren i utfor-cupen. Den kommende sesongen regnes som bekreftelsens sesong for 29-åringen fra Trentino, som også har Killington-rennet i horisonten.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/laura-il-compleanno-e-il-conto-alla-rovescia-per-beaver-creek-oggi-si-festeggia-pirovano-con-killington-all-orizzonte","pub_date":"2026-11-20T13:00:00.000Z","fetched_at":"2026-11-20 13:15:01","lang_orig":"it","category":null,"athletes":"Laura Pirovano","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":197558,"source_name":"Neveitalia","country":"ITA","title_no":"Della Mea leder det italienske laget på Kirchenkar: «Jeg er tilbake på 100%»","title_orig":"Della Mea guida il team Italia sulla \"Kirchenkar\": \"Sono tornata al 100%\". Peterlini: \"Un pezzo alla volta\"","summary_no":"Della Mea tar ledelsen for Italia på Kirchenkar-løypen og melder at hun er fullt tilbake, mens Peterlini tar det steg for steg.","spik_no":"Lara Della Mea leder det italienske slalomlandslaget inn mot Verdenscup-rennet på Kirchenkar-løypen i Gurgl, og melder at hun er hundre prosent tilbake. Den 24 år gamle friulanske slalomspesialistinnen har slitt med skader og sykdom, og tilbakemeldingen er et positivt tegn foran lørdagens slalom. Åtte italienske løpere stiller til start, men uten Beatrice Sola, som er best i laget for øyeblikket og er blitt igjen i Finland for å kjøre Europacup. Kirchenkar-løypen i Gurgl er relativt ny på damekalenderen, den kom med fra sesongen 2023/24.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/della-mea-guida-il-team-italia-sulla-kirchenkar-sono-tornata-al-100-peterlini-un-pezzo-alla-volta","pub_date":"2026-11-20T12:15:00.000Z","fetched_at":"2026-11-20 12:26:56","lang_orig":"it","category":null,"athletes":"Martina Peterlini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":197454,"source_name":"SVT Sport","country":"SWE","title_no":"Hvem er Anton Grahn?","title_orig":"Vem är Anton Grahn?","summary_no":"Et portrett av den svenske alpinisten Anton Grahn.","spik_no":"Anton Grahn er en av de mest omtalte unge langrennsløperne i Sverige, og blir trukket frem som en fremtidig bærebjelke i det svenske herrelaget. Med flere medaljer på juniornivå og en pallplats i verdenscupen allerede bak seg, vekker den 22 år gamle sprinteren stor begeistring. Eksperter hyller ham, og forventningene er høye etter flere tunge år for svensk langrenn på herresiden.","url":"https://www.svt.se/sport/langdskidor/vem-ar-anton-grahn","pub_date":"2026-11-20T12:09:42.000Z","fetched_at":"2026-11-20 12:15:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":197455,"source_name":"SVT Sport","country":"SWE","title_no":"Anton Grahn vinner Sverige-premieren","title_orig":"Anton Grahn vinner Sverigepremiären","summary_no":"Anton Grahn tok seieren i den første svenske alpinkonkurransen i sesongen.","spik_no":"Anton Grahn vant sprintfinalen i Sverigepremiären i Bruksvallarna og slo blant andre kanadieren Antoine Cyr og lagkamerat Johan Ekberg. SVT Sports ekspert Anders Blomquist var full av lovord: «Han eier dette! Han viser hvor dyktig han er.» Den 22 år gamle sprinteren erkjenner selv at sesongstarten kan være ujevn, men sikter mot en plass på det svenske verdenscuplaget. I helgen venter 10 km klassisk og 10 km fri i Bruksvallarna.","url":"https://www.svt.se/sport/langdskidor/anton-grahn-vinner-sverigepremiaren","pub_date":"2026-11-20T12:07:09.000Z","fetched_at":"2026-11-20 12:15:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":195707,"source_name":"SkinEWS","country":"SUI","title_no":"Oscar Heine overtar Manuel Fellers startplass i Gurgl","title_orig":"Oscar Heine übernimmt den Gurgl-Startplatz von Manuel Feller","summary_no":"Oscar Heine rykker inn og overtar startplassen til Manuel Feller i alpinrennet i Gurgl.","spik_no":"Manuel Feller er ikke klar for start i hjemmerennet i Gurgl, og Oscar Heine rykker inn på det østerrikske slalåmlaget. 34 år gamle Feller fra Tirol gjennomførte riktignok trening fredag, men var ikke fornøyd med resultatet og valgte å stå over. Feller er en av Østerrikes mest profilerte slalåmkjørere og har vunnet flere verdenscuprenner, så fraværet hans i et hjemmerenn er et merkbart tap for vertsnasjonens lag.","url":"https://www.skinews.ch/news/2026/uebernimmt-startplatz-manuel/","pub_date":"2026-11-20T09:55:56.000Z","fetched_at":"2026-11-20 10:00:03","lang_orig":"de","category":null,"athletes":"Manuel Feller,Oscar Heine","athlete_nations":["AUT","GER"],"also_sources":[],"norwegian":false},{"id":195590,"source_name":"ORF Sport","country":"AUT","title_no":"Feller avstår fra hjemslalåmen","title_orig":"Feller verzichtet auf Heimslalom","summary_no":"Manuel Feller har valgt å ikke stille til start i hjemslalåmen.","spik_no":"Manuel Feller avstår fra helgens hjemslalåm i Gurgl etter at treningskjøringene fredag ikke ga tilstrekkelig trygghet – østerrikeren sier selv at han bare er «ved 85 prosent». Den 34 år gamle tiroleren har vært plaget av kroniske rygg- og skiveproblemer over lengre tid og måtte av samme grunn også melde forfall til saisongsåpningen i Levi. Feller vant sammenlagtcupen i slalåm sesongen 2023/24 og planlegger nå comebacken til herreslalåmen i Val d'Isère 13. desember.","url":"https://sport.orf.at/stories/3165167/","pub_date":"2026-11-20T09:43:44.000Z","fetched_at":"2026-11-20 09:45:04","lang_orig":"de","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":195534,"source_name":"Neveitalia","country":"ITA","title_no":"Feller bekrefter fravær i Gurgl – Vinatzer starter søndag","title_orig":"Ufficiale il \"no\" di Feller allo slalom di Gurgl dopo l'ultimo test: Vinatzer domenica partirà nei 15","summary_no":"Det er offisielt at Feller ikke deltar i slalåmen i Gurgl etter siste test. Vinatzer vil søndag starte blant de 15 første.","spik_no":"Det er nå offisielt bekreftet at Manuel Feller ikke stiller i søndagens herreslalåm i Gurgl, etter at en siste test på hjemmesnøen ikke overbevisste ham om at han er klar. Feller vant nettopp på Kirchenkar-løypen i Gurgl da rennet ble arrangert for første gang i 2023, noe som gjør fraværet ekstra bittert. I hans sted er unggutten Oscar Heine bekreftet på startlisten, han som allerede debuterte i Levi. For italiensk del er nyheten at Alex Vinatzer vil starte blant de 15 første søndag.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/ufficiale-il-no-di-feller-allo-slalom-di-gurgl-dopo-l-ultimo-test-vinatzer-domenica-partira-nei-15","pub_date":"2026-11-20T09:35:00.000Z","fetched_at":"2026-11-20 09:45:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Manuel Feller","athlete_nations":["AUT","ITA"],"also_sources":[],"norwegian":false},{"id":195358,"source_name":"Neveitalia","country":"ITA","title_no":"Tøffe forhold i Gurgl – bedring ventet til morgendagens slalåm","title_orig":"A Gurgl condizioni toste, ma per lo slalom di domani in miglioramento. La vigilia delle big","summary_no":"Forholdene i Gurgl er krevende, men det ventes bedring til slalåmrennet som arrangeres fredag. Favorittene er i gang med forberedelsene.","spik_no":"Forholdene i den østerrikske landsbyen Gurgl er krevende foran helgens slalåmrenn, men bedring ventes til fredag. Gurgl har vært en relativt ny destinasjon på verdenscupkalenderen og arrangerer renn på høy høyde i Ötztal-alpene, noe som kan gi ustabilt vær tidlig i sesongen. Rennledelsen og favorittene er likevel i gang med forberedelsene, og forholdene er ventet å stabilisere seg til konkurransen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/a-gurgl-condizioni-toste-ma-per-lo-slalom-di-domani-in-miglioramento-la-vigilia-delle-big","pub_date":"2026-11-20T08:40:00.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":195360,"source_name":"Neveitalia","country":"ITA","title_no":"Tommaso Sala operert i høyre kne – kan nå planlegge ny rehabiliteringsplan","title_orig":"Intervento al ginocchio destro effettuato, Tommaso Sala può pensare ad un nuovo percorso di recupero","summary_no":"Tommaso Sala har gjennomgått en operasjon på høyre kne og kan nå se fremover mot en ny restitusjonsprosess.","spik_no":"Den italienske slalåmkjøreren Tommaso Sala har gjennomgått en operasjon på høyre kne og kan nå legge en plan for rehabiliteringen. Sala har vært en del av det italienske landslaget og har hentet resultater i verdenscupen i tekniske disipliner, men har slitt med skader som har hindret kontinuitet i karrieren. En vellykket operasjon er første steg, men veien tilbake til konkurransenivå vil kreve flere måneder med systematisk opptrening.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/intervento-al-ginocchio-destro-effettuato-tommaso-sala-puo-pensare-ad-un-nuovo-percorso-di-recupero","pub_date":"2026-11-20T07:15:00.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"it","category":null,"athletes":"Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":195337,"source_name":"Ski Racing","country":"INT","title_no":"Vinterens fokus: Hvordan en alpinski-skole hjalp to utøvere til college-skiing","title_orig":"Winter in Focus: How Winter Sports School Helped Two Racers Reach College Skiing","summary_no":"To unge alpinister forteller hvordan en vinterskole for vintersport hjalp dem å nå college-nivå i alpint.","spik_no":"To unge alpinister forteller hvordan en vinterskole med spesialisert alpintrening hjalp dem å nå college-nivå i USA. College-skiing er en viktig utviklingsarena i Nord-Amerika, der universiteter rekrutterer lovende utøvere og tilbyr dem strukturert trening kombinert med utdanning. For mange unge alpinister utenfor den tradisjonelle verdenscupbanen er dette en alternativ vei til toppidrett.","url":"https://skiracing.com/winter-in-focus-how-winter-sports-school-helped-two-racers-reach-college-skiing/","pub_date":"2026-11-19T22:30:30.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":194719,"source_name":"SVT Sport","country":"SWE","title_no":"Gjennombrudd for Eddie Genborg med imponerende seier","title_orig":"Islossning för Eddie Genborg i mäktig kross","summary_no":"Eddie Genborg opplevde endelig gjennombrudd med en stor og imponerende seier i alpint.","spik_no":"Artikkelen handler ikke om alpint, men om ishockey: 19 år gamle Eddie Genborg scoret hattrick og leverte totalt fem poeng da Timrå slo Örebro 8–2 i SHL. Genborg, som er draftet av Detroit Red Wings, var med på å vinne junior-VM-gull for Sverige forrige sesong og ventes å spille en sentral rolle i årets junior-VM. Gjennombruddet kommer etter at han innledet sesongen skadet.","url":"https://www.svt.se/sport/ishockey/islossning-for-eddie-genborg-i-maktig-kross","pub_date":"2026-11-19T20:56:43.000Z","fetched_at":"2026-11-19 21:00:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":193038,"source_name":"Neveitalia","country":"ITA","title_no":"Killington bekreftet: Kvinnekonkurranser tilbake på «Superstar»","title_orig":"Killington ok, ufficiale la conferma delle gare femminili sulla \"Superstar\" due anni dopo l'ultima volta","summary_no":"Det er offisielt bekreftet at de kvinnelige alpinrennene vender tilbake til Killington-bakken «Superstar», to år etter sist gang rennene ble arrangert der.","spik_no":"Killington i Vermont er offisielt bekreftet som vertskap for to kvinnekonkurranser i alpint – storslalåm og slalåm – helgen 28.–29. november. Det er første gang rennene arrangeres på «Superstar»-bakken siden 2024, da konkurransen ble preget av Mikaela Shiffrin-dramaet, mens svenske Sara Hector vant storslalåmen og sveitsiske Camille Rast tok sin første seier i slalåmen dagen etter. Killington har vært en av de mest populære stoppene på verdenscupen de siste årene, med stort publikumsoppmøte og en særegen feststemning på østkysten av USA.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/killington-ok-ufficiale-la-conferma-delle-gare-femminili-sulla-superstar-due-anni-dopo-l-ultima-volta","pub_date":"2026-11-19T18:40:00.000Z","fetched_at":"2026-11-19 18:45:03","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":191434,"source_name":"Neveitalia","country":"ITA","title_no":"Mélanie Meillard operert i høyre kne: – Nå begynner arbeidet","title_orig":"Mélanie Meillard operata al ginocchio destro, la ripartenza da zero per tornare ancora: \"Ora comincia il lavoro\"","summary_no":"Mélanie Meillard har gjennomgått en operasjon i høyre kne og starter rehabiliteringen fra scratch. – Nå begynner arbeidet, sier hun.","spik_no":"Sveitsiske Mélanie Meillard er operert i høyre kne etter at hun pådro seg brudd på korsbåndet og skader i meniskene under trening i Levi, bare timer før sesongåpningen i verdenscupen. 28-åringen starter nå rehabiliteringen fra null og har allerede varslet at hun mister ski-VM hjemme i Sveits. Meillard, som er spesialist i tekniske disipliner og tidligere har kjempet i toppen av verdenscupen i slalåm og storslalåm, sikter mot comeback til sesongen 2027/28. – Nå begynner arbeidet, sier hun selv.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/melanie-meillard-operata-al-ginocchio-destro-la-ripartenza-da-zero-per-tornare-ancora-ora-comincia-il-lavoro","pub_date":"2026-11-19T16:20:00.000Z","fetched_at":"2026-11-19 16:30:02","lang_orig":"it","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":190442,"source_name":"SVT Sport","country":"SWE","title_no":"Se klassiske bilder fra Sverigepremiären i 1985","title_orig":"Se klassiska bilderna från Sverigepremiären 1985","summary_no":"Et tilbakeblikk på klassiske bilder fra Sveriges alpinpremiere i 1985.","spik_no":"SVT Sport har gravd frem arkivbilder fra den svenske langrennssesongens åpning i Bruksvallarna i 1985. Bildene viser blant annet Gunde Svan som sjokkerer omgivelsene med et par gigantiske staver, og temperaturen var høy rundt den nye teknikken som skapte splittelse i skisportmiljøet. Svan var på denne tiden en av verdens dominerende langrennsløpere og vant fire OL-gull i karrieren. Sakens innhold er langrenn, ikke alpin, og det finnes lite alpint stoff å arbeide ut fra her.","url":"https://www.svt.se/sport/langdskidor/se-klassiska-bilderna-fran-sverigepremiaren-1985","pub_date":"2026-11-19T15:17:26.000Z","fetched_at":"2026-11-19 15:21:56","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":190192,"source_name":"Neveitalia","country":"ITA","title_no":"FIS NJR åpnet i Solden med storslalåm – Girtler og Rifesser i italiensk form","title_orig":"A Solda l'apertura FIS NJR con i giganti e timbri azzurri di Girtler e Rifesser: ora gli slalom","summary_no":"FIS NJR-sesongen åpnet i Solden med storslalåmrenn, der italienske utøvere Girtler og Rifesser markerte seg. Neste på programmet er slalåmrennene.","spik_no":"FIS NJR-sesongen åpnet i Solden (Sulden) med storslalåmrenn på Kanzel-løypen på Ortles-Cevedale-breen, der sørtyrolske utøvere satte sitt preg på åpningshelgen. Leonie Girtler, født 2006 og fra Sør-Tirol, vant damefeltet med 26 hundredelers margin foran slovakiske Tamara Dorkova, mens herrenes første renn gikk til norske Fredrik Andersen. FIS NJR (Nations Junior Ranking) er en viktig juniorturneringsserie i alpint, og åpningen i Solden er regnet som en klassiker på den internasjonale juniorkalenderen. Neste ut er slalåmrennene som avslutter den firetagers samlingen.","url":"https://www.neveitalia.it/sport/scialpino/news/a-solda-l-apertura-fis-njr-con-i-giganti-e-timbri-azzurri-di-girtler-e-rifesser-ora-gli-slalom","pub_date":"2026-11-19T15:10:00.000Z","fetched_at":"2026-11-19 15:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":186114,"source_name":"Neveitalia","country":"ITA","title_no":"Slovenia stiller med tre utøvere i Gurgl til lørdagens slalåm","title_orig":"La Slovenia con un terzetto a Gurgl: Neja Dvornik, positiva a Levi, con Slokar e Tomsic per lo slalom di sabato","summary_no":"Slovenia stiller med Neja Dvornik, som imponerte i Levi, samt Slokar og Tomsic til slalåmrennet i Gurgl lørdag.","spik_no":"Slovenia stiller med tre utøvere i slalåmrennet i Gurgl lørdag: Neja Dvornik, Andreja Slokar og Ana Tomsic. Dvornik, født 2001, imponerte i Levi og er tilbake på den samme pisten i Gurgl der hun skadet seg under oppvarmingen for et år siden. Slokar er i retur etter skade og rykket ut i første omgang i Levi, mens hun fortsatt starter fra en utvidet andregruppa. Caterina Sinigoi og Anja Oplotnik er ikke med til Østerrike denne helgen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/la-slovenia-con-un-terzetto-a-gurgl-neja-dvornik-positiva-a-levi-con-slokar-e-tomsic-per-lo-slalom-di-sabato","pub_date":"2026-11-19T10:20:00.000Z","fetched_at":"2026-11-19 10:30:04","lang_orig":"it","category":null,"athletes":"Andreja Slokar,Neja Dvornik","athlete_nations":["SLO"],"also_sources":[],"norwegian":false},{"id":184229,"source_name":"Neveitalia","country":"ITA","title_no":"Phenix lanserer replika av Sveriges VM-drakt","title_orig":"Phenix, dalla Coppa del Mondo alle piste di casa: ecco la replica della divisa svedese","summary_no":"Phenix gjør den svenske alpinlandslags-drakten fra verdenscupen tilgjengelig for vanlige skiløpere, slik at fansen kan kle seg som sine favoritter på hjemmebakken.","spik_no":"Phenix lanserer en publikumsversjon av det svenske alpinlandslagets offisielle drakt for sesongen 2026/27, kalt Svezia AW26-kolleksjonen. Drakten er designet etter plaggene som brukes av blant andre Sara Hector og resten av det svenske landslaget i verdenscupen. En av nyhetene er det såkalte WIRE Ventilation System, der glidelåsene er flyttet til forsiden slik at luftsirkulasjonen kan reguleres uten å åpne drakten helt. Phenix har vært offisiell leverandør for det svenske alpinlandslaget og er kjent for å kombinere konkurranseteknologi med produkter tilgjengelig for vanlige skiløpere.","url":"https://www.neveitalia.it/materiali/abbigliamento/news/phenix-dalla-coppa-del-mondo-alle-piste-di-casa-ecco-la-replica-della-divisa-svedese","pub_date":"2026-11-19T07:56:35.000Z","fetched_at":"2026-11-19 08:00:03","lang_orig":"it","category":"goy","athletes":"Sara Hector","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":184053,"source_name":"Neveitalia","country":"ITA","title_no":"To dager til Gurgl, mens Shiffrin trener slalåm med Killington i tankene","title_orig":"Due giorni a Gurgl, e intanto Shiffrin torna a fare slalom a Copper pensando a Killington. E in super-g...","summary_no":"Mikaela Shiffrin er tilbake på slalåmtrening i Copper Mountain med tanke på Killington, mens rennkalenderen nærmer seg Gurgl om to dager.","spik_no":"Mikaela Shiffrin er tilbake på slalåmtrening i Copper Mountain i Colorado og satser på Killington som sitt sesongdebut i disiplinen – ikke Gurgl, som arrangerer verdenscupslalåm om to dager. Shiffrin har dominert Gurgl totalt og vunnet begge ganger løpet har vært arrangert for kvinner. I Colorado trener hun på tre disipliner samtidig, og forteller smilende at hun nylig gjennomførte skikkelig super-G-trening med hopp på 35–40 meter – noe hun ikke har gjort på fire år. Killington, der hun er en stor publikumsfavoritt, er ventet å bli hennes første slalåmstart denne sesongen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/due-giorni-a-gurgl-e-intanto-shiffrin-torna-a-fare-slalom-a-copper-pensando-a-killington-e-in-super-g","pub_date":"2026-11-19T07:20:00.000Z","fetched_at":"2026-11-19 07:47:22","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":181420,"source_name":"Ski Racing","country":"INT","title_no":"Fra skistøvelinnlegg til sikkerhetsputer: LISKI ser på utstyrets neste liv","title_orig":"From Ski Boot Liners to Safety Padding, LISKI Looks at Equipment’s Next Life","summary_no":"LISKI undersøker hvordan alpint utstyr som skistøvelinnlegg og sikkerhetsputer kan få et nytt liv etter endt bruk.","spik_no":"Italienske LISKI, en av verdens ledende produsenter av alpinsikringsutstyr, undersøker hvordan brukt alpinutstyr kan få nytt liv fremfor å kastes. I samarbeid med Tecnica Group og resirkuleringsselskapet ReMat har de utviklet produktet Greenmat, der materiale fra utslitte skistøvelinnlegg brukes i beskyttelsesputer langs løypene. Prosjektet er en del av en bredere innsats for å redusere avfall i produksjon og transport av sikringsutstyr. Utfordringen er at skistøvelinnlegg består av ulike skumtyper, tekstiler og lim, noe som gjør resirkulering teknisk krevende.","url":"https://skiracing.com/from-ski-boot-liners-to-safety-padding-liski-looks-at-equipments-next-life/","pub_date":"2026-11-18T18:39:53.000Z","fetched_at":"2026-11-18 18:45:03","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":180229,"source_name":"Neveitalia","country":"ITA","title_no":"Kan vi tro på en «ny» Vinatzer? Storslalåmrennene i Colorado kan gi svarene","title_orig":"Si può credere in un \"nuovo\" Vinatzer? Sì, con i giganti in Colorado (dove fece benissimo nel 2025) che daranno tante risposte","summary_no":"Alex Vinatzer har muligheten til å bevise sitt potensial under storslalåmrennene i Colorado, der han presterte sterkt i 2025.","spik_no":"Alex Vinatzer fra Gröden har aldri vunnet et verdenscuprenn, men han nærmet seg gjentatte ganger i 2025 — ni hundredeler bak Noel i slalåm i Kitzbühel og andreplass i storslalåm i Beaver Creek, bak Marco Odermatt. Den 27 år gamle italieneren imponerte i Levi i åpningshelgen med en av karrierens beste omganger, og Colorado-rennene i Copper Mountain og Beaver Creek ses nå som en viktig lakmustest på om han endelig har funnet den tekniske stabiliteten som tidligere har sviktet. Dette er den niende sesongen hans i verdenscupen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/si-puo-credere-in-un-nuovo-vinatzer-si-con-i-giganti-in-colorado-dove-fece-benissimo-nel-2025-che-daranno-tante-risposte","pub_date":"2026-11-18T16:55:00.000Z","fetched_at":"2026-11-18 17:00:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":180209,"source_name":"Ski Racing","country":"INT","title_no":"FIS' sikkerhetskode for skitrening: 10 viktige punkter for trenere","title_orig":"FIS Ski Training Safety Code: 10 Takeaways for Coaches","summary_no":"FIS har utarbeidet en sikkerhetskode for skitrening, og her er de ti viktigste punktene alle trenere bør kjenne til.","spik_no":"FIS lanserte 18. november 2026 en frivillig sikkerhetskode for trening på snø, med ti anbefalinger rettet mot trenere, lag, utøvere og skianlegg. Koden tar blant annet for seg hvem som kan stanse et løyp, hvordan nødsituasjoner koordineres fra start, og krav til daglig sjekk av sikkerhetsinstallasjoner. Bakgrunnen er behovet for felles retningslinjer når flere lag deler samme bakke, noe som er vanlig i treningsleirer og i forkant av verdenscuprenn. Koden gjelder på alle nivåer, fra klubbtrening til internasjonale konkurranser.","url":"https://skiracing.com/fis-ski-training-safety-code-10-takeaways-for-coaches/","pub_date":"2026-11-18T16:50:08.000Z","fetched_at":"2026-11-18 17:00:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":179572,"source_name":"Neveitalia","country":"ITA","title_no":"Deromedis og co. samles i Livigno – Val Thorens åpner cupen i desember","title_orig":"Deromedis, Tomasoni, Galli & Co., si torna a Livigno per il prossimo raduno: dall'8 all'11 dicembre Val Thorens per il via di coppa","summary_no":"Det italienske landslaget returnerer til Livigno for neste samling, før verdenscupen sparkes i gang i Val Thorens fra 8. til 11. desember.","spik_no":"Det italienske skicross-landslaget, med profiler som Dominik Deromedis, Jole Galli og Davide Tomasoni, samles i Livigno fra 21. til 25. november som siste forberedelse før sesongstart. Laget har allerede gjennomført treningsleir i Chile i september og treninger på Stelvio og Val Senales. Verdenscupen åpner i Val Thorens 8.–11. desember, en tradisjonell åpningsarena for skicross med doble renn. Deromedis er regjerende verdensmester og en av de fremste skicross-utøverne i verden, og mye oppmerksomhet vil naturlig nok rettes mot ham når cupen starter.","url":"https://www.neveitalia.it/freestyle/news/deromedis-tomasoni-galli-co-si-torna-a-livigno-per-il-prossimo-raduno-dall-8-all-11-dicembre-val-thorens-per-il-via-di-coppa","pub_date":"2026-11-18T15:55:00.000Z","fetched_at":"2026-11-18 16:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178591,"source_name":"Neveitalia","country":"ITA","title_no":"Ambisiøst italiensk slalåmlag til Europacupen","title_orig":"Da Sola a Mathiou, da Carolli a Bieler, sarà ambiziosa l'Italslalom di Coppa Europa. D'Antonio non gareggerà","summary_no":"Italia stiller med et ambisiøst slalåmlag i Europacupen, men D'Antonio er ikke med.","spik_no":"Italia stiller med et ambisiøst slalåmlag i Europacupen, selv om D'Antonio ikke er med i troppen. Europacupen fungerer som det viktigste steget mellom FIS-renn og Verdenscup, og er en sentral arena for utvikling av neste generasjons alpinister. Italia har tradisjonelt hatt sterke slalåmkjørere og bruker Europacupen aktivt til å modne talenter mot Verdenscupnivå.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/da-sola-a-mathiou-da-carolli-a-bieler-sara-ambiziosa-l-italslalom-di-coppa-europa-d-antonio-non-gareggera","pub_date":"2026-11-18T14:05:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178593,"source_name":"Neveitalia","country":"ITA","title_no":"Kranjska Gora i gang med kunstsnø – herrerenn åpner 2027-sesongen","title_orig":"Primo freddo e Kranjska Gora già lavora a tutta: neve artificiale sulla \"Podkoren-3\", le gare maschili apriranno il 2027","summary_no":"Kranjska Gora har startet snøproduksjon på Podkoren-3-løypen, og herrekonkurransene vil åpne sesongen i 2027.","spik_no":"Kranjska Gora er i gang med kunstsnøproduksjon på den klassiske Podkoren-3-løypen, og herrekonkurransene er satt til å åpne 2027-sesongen der. Den slovenske skibyen har lange tradisjoner som Verdenscup-arrangør, særlig kjent for Vitranc-rennet i storslalåm og slalåm. Kunstsnøanlegg er blitt avgjørende for å sikre tidlig sesongstart uavhengig av naturlige snøforhold.","url":"https://www.neveitalia.it/sport/scialpino/news/primo-freddo-e-kranjska-gora-gia-lavora-a-tutta-neve-artificiale-sulla-podkoren-3-le-gare-maschili-apriranno-il-2027","pub_date":"2026-11-18T13:05:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178595,"source_name":"Neveitalia","country":"ITA","title_no":"To tyske trioer i Gurgl – Aicher jakter ledelse i cupen","title_orig":"Due terzetti in casa Germania sulla \"Kirchenkar\": sabato a Gurgl il timone per Aicher che cerca l'allungo in coppa","summary_no":"Tyskland stiller med to trioer på Kirchenkar-løypen i Gurgl, der Aicher søker å øke ledelsen i Europacupen.","spik_no":"Tyskland stiller med to komplette trioer til slalåmrennet i Gurgl, der Fabian Aicher ønsker å befeste ledelsen sin i Europacup-sammendraget. Kirchenkar-løypen i Gurgl er kjent for tekniske utfordringer og har raskt blitt en populær arena siden den kom inn på Europacup-programmet. Aicher har vært en av de mest konstante tyske profilene i Europacupen og peker seg ut som en kandidat til Verdenscup-gjennombrudd.","url":"https://www.neveitalia.it/sport/scialpino/news/due-terzetti-in-casa-germania-sulla-kirchenkar-sabato-a-gurgl-il-timone-per-aicher-che-cerca-l-allungo-in-coppa","pub_date":"2026-11-18T11:40:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":178607,"source_name":"SkinEWS","country":"SUI","title_no":"Melanie Meillard skuffet over sin skjebne","title_orig":"Melanie Meillard hadert mit ihrem Schicksal","summary_no":"Den sveitsiske alpinisten Melanie Meillard sliter med å forsone seg med en vanskelig situasjon i karrieren sin.","spik_no":"Sveitsiske Melanie Meillard har pådratt seg et nytt korsbåndbrudd i forberedelsene til Verdenscup-slalåmen i Levi, og mister dermed hele 2026/27-sesongen. For 28-åringen fra Neuchâtel er det særlig bittert fordi hun også går glipp av VM på hjemmebane i Wallis. Meillard har slitt med alvorlige skader gjennom karrieren og er en kjent allrounder som tidligere har konkurrert i både slalåm og storslalåm på Verdenscup-nivå.","url":"https://www.skinews.ch/news/2026/melanie-meillard-schicksal/","pub_date":"2026-11-18T11:04:43.000Z","fetched_at":"2026-11-18 14:29:04","lang_orig":"de","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":178608,"source_name":"SkinEWS","country":"SUI","title_no":"Lena Dürr optimistisk foran slalåmen i Gurgl","title_orig":"Lena Dürrs Zuversicht im Hinblick auf den Gurgl-Slalom","summary_no":"Lena Dürr ser frem til slalåmrennet i Gurgl med stor optimisme.","spik_no":"Lena Dürr stiller optimistisk til start i slalåmrennet i Gurgl på Kirchenkar-løypen. Den tyske slalåmspesialisten har de siste sesongene etablert seg blant verdens beste i disiplinen og har flere pallplasseringer i Verdenscup. Gurgl har blitt en fast post på den tidlige delen av alpinkalenderen og gir utøverne mulighet til å bygge på resultater fra Levi-åpningen.","url":"https://www.skinews.ch/news/2026/duerrs-zuversicht-hinblick/","pub_date":"2026-11-18T10:35:41.000Z","fetched_at":"2026-11-18 14:29:04","lang_orig":"de","category":null,"athletes":"Lena Dürr","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":178598,"source_name":"Neveitalia","country":"ITA","title_no":"Kun sju nordmenn til Gurgl – Steen Olsen ikke med","title_orig":"Solo sette norge a Gurgl, con McGrath (qui due podi) per risalire assieme a Kristoffersen e Haugan. Non c'è Steen Olsen","summary_no":"Bare sju norske utøvere reiser til Gurgl, der McGrath tidligere har tatt to pallplasser. Kristoffersen og Haugan leder an, men Steen Olsen er ikke med.","spik_no":"Bare sju norske utøvere reiser til Gurgl for slalomrennene 21.–22. november, tre færre enn til åpningsrennene i Levi. Henrik Kristoffersen og Timon Haugan leder troppen, mens Mina Fuerst Holtmann er eneste norske kvinne. Alexander Steen Olsen er ikke med – han sto også over Levi og Sölden på grunn av fysiske problemer, og neste mål skal etter planen være storslalåmen i Copper Mountain 29. november. Aidan McGrath har to pallplasser fra Gurgl tidligere og er blant dem som reiser.","url":"https://www.neveitalia.it/sport/scialpino/news/solo-sette-norge-a-gurgl-con-mcgrath-qui-due-podi-per-risalire-assieme-a-kristoffersen-e-haugan-non-c-e-steen-olsen","pub_date":"2026-11-18T10:05:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":"Alexander Steen Olsen,Atle Lie McGrath,Henrik Kristoffersen,Mina Fürst Holtmann,Timon Haugan","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":178599,"source_name":"Neveitalia","country":"ITA","title_no":"Beaver Creek-rennene utsatt på grunn av snømangel","title_orig":"Beaver Creek e un posticipo necessario per salvarsi, c'è pochissima neve per le 7 gare sulla \"Birds of Prey\"","summary_no":"Det er svært lite snø ved Beaver Creek, og de planlagte sju rennene på «Birds of Prey»-løypa er utsatt for å redde arrangementet.","spik_no":"Rennene på den klassiske «Birds of Prey»-løypa i Beaver Creek er utsatt på grunn av kritisk lite snø i Colorado. FIS-tekniker Trinkl melder at det er enda dårligere snøforhold enn på samme tid i fjor, og forberedelsene av løypa er langt fra fullført. Val Gardena pekes ut som den primære reserveløsningen dersom Beaver Creek ikke blir klar i tide. Utøvere som Marco Odermatt har i mellomtiden valgt å bli i Sankt Moritz for å trene under bedre forhold.","url":"https://www.neveitalia.it/sport/scialpino/news/beaver-creek-e-un-posticipo-necessario-per-salvarsi-c-e-pochissima-neve-per-le-7-gare-sulla-birds-of-prey","pub_date":"2026-11-18T09:25:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":["ORF Sport"],"norwegian":false},{"id":178601,"source_name":"Neveitalia","country":"ITA","title_no":"Gurgl i toppform, men trues av super-G-renn på Rettenbach i Sölden","title_orig":"Gurgl prontissima in condizioni top, ma il futuro è in pericolo a causa di... Soelden: \"I super-g sul Rettenbach ci mettono a rischio\"","summary_no":"Gurgl er i utmerket stand og klar for renn, men arrangørene frykter at super-G-løpene på Rettenbachbreen i Sölden setter stedets fremtid i fare.","spik_no":"Gurgl og Kirchenkar-løypa er i strålende stand foran slalomrennene 21.–22. november, den fjerde gangen alpinverdenscupen besøker den lille tirolske landsbyen. Likevel bekymrer arrangørene seg for fremtiden: Alban Scheiber, leder for den lokale organisasjonskomiteen, advarer om at planene om å legge super-G-renn til Rettenbachbreen i Sölden kan tvinge Gurgl ut av Verdenscup-kalenderen. FIS har foreløpig ikke presentert en langsiktig kalenderplan som gir arrangørene forutsigbarhet utover ett år.","url":"https://www.neveitalia.it/sport/scialpino/news/gurgl-prontissima-in-condizioni-top-ma-il-futuro-e-in-pericolo-a-causa-di-soelden-i-super-g-sul-rettenbach-ci-mettono-a-rischio","pub_date":"2026-11-18T08:30:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178602,"source_name":"Neveitalia","country":"ITA","title_no":"Liensberger tilbake på ski – Courchevel mest aktuelt for comeback","title_orig":"Liensberger ancora sugli sci, ma il rientro è abbastanza lontano: Courchevel, a quasi un anno dal crac, l'ipotesi più concreta","summary_no":"Katharina Liensberger er tilbake på ski, men returen til konkurranser er fortsatt langt unna. Courchevel, nesten ett år etter skaden, er det mest realistiske målet.","spik_no":"Østerrikske Katharina Liensberger er tilbake på ski etter at hun pådro seg en alvorlig kneskade på trening 2. januar 2026. Liensberger, som er dobbelt verdensmester i slalåm fra Cortina 2021, trener nå på pistene i Mayrhofen i Zillertal og beskrives som i riktig retning – men comebacket er fortsatt langt unna. Nattslalåmen i Courchevel 22. desember, nesten ett år etter hennes siste konkurranse i Semmering, er det mest konkrete målet for retur til Verdenscupen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/liensberger-ancora-sugli-sci-ma-il-rientro-e-abbastanza-lontano-courchevel-a-quasi-un-anno-dal-crac-l-ipotesi-piu-concreta","pub_date":"2026-11-18T08:00:00.000Z","fetched_at":"2026-11-18 14:29:02","lang_orig":"it","category":null,"athletes":"Katharina Liensberger","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":178573,"source_name":"Ski Racing","country":"INT","title_no":"Den usynlige veggen: Om konkurranseangst i alpint","title_orig":"The Invisible Wall: Race-Day Anxiety in Ski Racing","summary_no":"En artikkel belyser fenomenet konkurranseangst blant alpinister og hvordan den mentale barrieren på renndagen kan påvirke prestasjoner.","spik_no":"En personlig artikkel i Ski Racing-magasinet setter søkelyset på konkurranseangst i alpint – den mentale barrieren mange utøvere møter i startboksen til tross for grundig forberedelse. Forfatteren, som har drevet med skiløp i tolv år, beskriver hvordan adrenalinet i startøyeblikket kan snu til lammende nervøsitet og forestillinger om feil – en tilstand han kaller «den usynlige veggen». Mentalt press og prestasjonsangst er et tema som har fått stadig mer oppmerksomhet i toppidretten, og i alpint er det særlig relevant gitt sportens krav til risikovillighet og konsentrasjon.","url":"https://skiracing.com/the-invisible-wall-race-day-anxiety-in-ski-racing/","pub_date":"2026-11-17T18:46:22.000Z","fetched_at":"2026-11-18 14:29:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":178727,"source_name":"Sportschau","country":"GER","title_no":"Slalåm på grensen: «Alle er helt maxed out»","title_orig":"Slalom am Limit: \"Die sind alle so maxed out\"","summary_no":"Slalåmkjøringen er presset til det ytterste, og utøverne går på absolutt maksimalt nivå.","spik_no":"Slalåmsporten er blitt så jevn og ekstremdrevet at selv en 13.-plass til Linus Straßer i Levi ga grunnlag for refleksjon: «Nivået som vises her er rett og slett perverst», sa tyskeren etter åpningsrennet. I tolv slalåmrenn forrige sesong – inkludert OL – var det åtte forskjellige vinnere, et tall som illustrerer bredden i feltet. Tidligere slalåmkjører Sebastian Holzmann oppsummerer det slik: «Det er blitt et lotteri – alle er raske, det handler bare om hvem som gjør færrest feil.»","url":"https://www.sportschau.de/wintersport/ski-alpin/slalom-am-limit-die-sind-alle-so-maxxed-out,ski-alpin-slalom-am-limit-100.html","pub_date":"2026-11-17T17:27:32.000Z","fetched_at":"2026-11-18 14:29:07","lang_orig":"de","category":null,"athletes":"Linus Straßer","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":178237,"source_name":"Neveitalia","country":"ITA","title_no":"Valentina Greggio tilbake på snøtrening i Cervinia","title_orig":"Riprende la preparazione sulla neve di sua maestà Valentina Greggio: con Herin e Capello lavoro a Cervinia","summary_no":"Alpinstjernen Valentina Greggio har gjenopptatt snøtreningen i Cervinia sammen med trenerne Herin og Capello.","spik_no":"Valentina Greggio har gjenopptatt snøtreningen på Cervinia-breen i Aostadalen, denne gangen sammen med de mannlige landslagsløperne Joel Herin og Samuele Capello. Den italienske fartsstjernen fra Verbania, født i 1991, avsluttet forrige sesong med en fullstendig dominans: hun vant sin åttende verdenscup sammenlagt, forsvarte VM-tittelen i Vars og satte ny verdensrekord i april med 248,270 km/t. Treningsblokken på Cervinia-breen strekker seg over tre dager, fra 18. til 20. november.","url":"https://www.neveitalia.it/sport/speedskiing/news/riprende-la-preparazione-sulla-neve-di-sua-maesta-valentina-greggio-con-herin-e-capello-lavoro-a-cervinia","pub_date":"2026-11-17T13:55:00.000Z","fetched_at":"2026-11-17 14:00:01","lang_orig":"it","category":null,"athletes":"Valentina Greggio","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":177883,"source_name":"Neveitalia","country":"ITA","title_no":"To måneder til drømmetrilogien på Olympia delle Tofane: billetter til Cortina World Cup nå i salg","title_orig":"Due mesi al trittico da sogno sull'Olympia delle Tofane: da poche ore sono in vendita i biglietti per la Cortina World Cup","summary_no":"Det er to måneder til de etterlengtede verdenscuprennet i Cortina d'Ampezzo, og billettene ble lagt ut for salg for bare noen timer siden.","spik_no":"Billetter til verdenscuphelgen i Cortina d'Ampezzo 15.–17. januar 2027 er nå lagt ut for salg. Programmet på den klassiske Olympia delle Tofane-løypa består av to utforkjøringer og ett super-G for kvinner — et såkalt «trittico» eller trippel. Cortina er et av de mest tradisjonsrike stoppene på kvinnenes verdenscup i utfor, og løypa har vært arena i over 30 år. Neste sesongs renn kommer etter at Cortina nettopp var OL-arenaen for alpint under vinter-OL 2026.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/due-mesi-al-trittico-da-sogno-sull-olympia-delle-tofane-da-poche-ore-sono-in-vendita-i-biglietti-per-la-cortina-world-cup","pub_date":"2026-11-17T13:15:00.000Z","fetched_at":"2026-11-17 13:30:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":177529,"source_name":"Neveitalia","country":"ITA","title_no":"Seksten italienske alpinister trener i Copper – Shiffrin forkjølet på Speed Center","title_orig":"Prosegue a Copper il lavoro dei 16 azzurri impegnati e nello Speed Center c'è una Shiffrin raffreddata","summary_no":"Seksten italienske utøvere fortsetter treningsarbeidet i Copper, mens Mikaela Shiffrin dukket opp på Speed Center med forkjølelse.","spik_no":"Seksten italienske alpinister er i gang med treningsarbeid på Copper Mountain i Colorado, og gruppen vokser til 23 utøvere i løpet av uken når hastighetsgruppen under trener Johnny Feltrin ankommer fra Solda. Mikaela Shiffrin, som er regjerende verdenscupvinner og bor i nærheten, har trent på Speed Center til tross for en forkjølelse og beskriver arbeidsforholdene som fantastiske. De tolv italienske herrene er også i gang og skal debutere i verdenscupen på samme Copper Mountain 28. november. Blant damene som allerede trener er fartsspesialistene Sofia Goggia, Laura Pirovano og Marta Bassino.","url":"https://www.neveitalia.it/sport/scialpino/news/prosegue-a-copper-il-lavoro-dei-16-azzurri-impegnati-e-nello-speed-center-c-e-una-shiffrin-raffreddata","pub_date":"2026-11-17T12:45:00.000Z","fetched_at":"2026-11-17 13:00:02","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":177177,"source_name":"Neveitalia","country":"ITA","title_no":"Sesongen sparkes i gang i Solda onsdag: Livata arrangerer FIS NJR i skyggen av Ortles","title_orig":"A Solda scatta mercoledì la stagione su nevi italiane: il Livata organizza le FIS NJR all'ombra dell'Ortles","summary_no":"Sesongen på italiensk snø åpner i Solda onsdag, der Livata arrangerer FIS NJR-renn ved foten av Ortles.","spik_no":"Sesongåpningen på italiensk snø skjer i Solda onsdag, der Sci Club Livata arrangerer FIS NJR-renn i skyggen av Ortles-Cevedale-massivet. Totalt åtte renn fordelt over fire dager på pisten Kanzel – storslalåm onsdag og torsdag, slalåm fredag og lørdag – med deltakere fra hele Italia og internasjonalt. Arrangementet, kalt Trofeo Energiapura, har ifølge Livatas leder Franco Malci blitt en fast tradisjon som markerer starten på den tekniske konkurransesesongen. Solda på 1900 meters høyde i Sør-Tirol er et populært tidligsesong-arrangement nettopp fordi breene sikrer stabile snøforhold allerede i november.","url":"https://www.neveitalia.it/sport/scialpino/news/a-solda-scatta-mercoledi-la-stagione-su-nevi-italiane-il-livata-organizza-le-fis-njr-all-ombra-dell-ortles","pub_date":"2026-11-17T12:15:00.000Z","fetched_at":"2026-11-17 12:30:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":176649,"source_name":"Neveitalia","country":"ITA","title_no":"Manuel Feller åpner for deltakelse i Gurgl: «Bestemmer snart – trenger trening»","title_orig":"Manuel Feller lascia la porta aperta sulla presenza a Gurgl: \"Deciderà a breve, gli serve allenamento\"","summary_no":"Manuel Feller holder muligheten åpen for å stille til start i Gurgl, men understreker at han trenger mer trening før en endelig beslutning tas.","spik_no":"Manuel Feller holder muligheten åpen for å stille til start i slalåmrennet i Gurgl, men trenger mer trening før en endelig avgjørelse tas. Østerrikeren er i retur etter en ny rygkoperasjon og gikk glipp av åpningsrennet i Levi. Feller vant slalåmcupen sammenlagt i sesongen 2023/24 og tok seieren i Kitzbühel sist vinter, og er en nøkkelspiller i det østerrikske «Wunderteam». Avgjørelsen hans er også avgjørende for om italienske Alex Vinatzer får plass i den andre kvalifiseringsgruppen i Gurgl.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/manuel-feller-lascia-la-porta-aperta-sulla-presenza-a-gurgl-decidera-a-breve-gli-serve-allenamento","pub_date":"2026-11-17T11:50:00.000Z","fetched_at":"2026-11-17 11:55:43","lang_orig":"it","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":176409,"source_name":"RTV SLO","country":"SLO","title_no":"Nasjonsmester Nika Bobnar tar steget opp til verdenscupen","title_orig":"Državna prvakinja Nika Bobnar se seli v svetovno serijo","summary_no":"Den slovenske nasjonsmesteren Nika Bobnar rykker opp og skal nå konkurrere i verdenscupen i alpint.","spik_no":"Den slovenske nasjonsmesteren Nika Bobnar tar steget opp til verdenscupen i alpint. Slovenia har en sterk alpintradisjon med utøvere som Ilka Štuhec, som har vunnet VM-gull og verdenscupkugler i utfor, som inspirasjon. Bobnar har markert seg på nasjonalt nivå og er nå klar for den internasjonale eliteserien. Opprykket til verdenscupen er et betydelig steg i karrieren for den unge sloveneren.","url":"https://www.rtvslo.si/sport/drzavna-prvakinja-nika-bobnar-se-seli-v-svetovno-serijo/800382","pub_date":"2026-11-17T11:21:54.000Z","fetched_at":"2026-11-17 11:30:05","lang_orig":"sl","category":null,"athletes":"Nika Bobnar","athlete_nations":["SLO"],"also_sources":[],"norwegian":false},{"id":176122,"source_name":"Neveitalia","country":"ITA","title_no":"Sorì: Ny app for å booke alpinske treningsbakker","title_orig":"Nasce Sorì, l’applicazione per prenotare le piste da allenamento di sci alpino","summary_no":"Sorì er en ny applikasjon som lar brukere booke treningsbakker for alpint ski på en enkel og effektiv måte.","spik_no":"Sorì er en ny app som lar alpintrenere booke treningsbakker enkelt og raskt, uten å måtte ringe skisentrene direkte. Appen er utviklet av 25 år gamle Alessio Gottardi fra Moena i Val di Fassa – alpintrener på nivå II i det italienske skiforbundet FISI og medisinstudent ved Universitetet i Ferrara. Navnet «Sorì» betyr «enkelt» på ladino, språket som snakkes i Val di Fassa. Appen gir tilgang til en oversikt over alle italienske skisentre og er myntet særlig på trenere som reiser med klubber til ukjente anlegg.","url":"https://www.neveitalia.it/sport/scialpino/news/nasce-sori-l-applicazione-per-prenotare-le-piste-di-allenamento-di-sci-alpino","pub_date":"2026-11-17T11:00:00.000Z","fetched_at":"2026-11-17 11:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":176004,"source_name":"ORF Sport","country":"AUT","title_no":"Feller usikker på start i Gurgl-slalåm","title_orig":"Feller lässt Start in Gurgl-Slalom offen","summary_no":"Manuel Feller har ikke bestemt seg for om han vil stille til start i slalåmen i Gurgl.","spik_no":"Manuel Feller er usikker på om han stiller til start i slalåmen i Gurgl denne helgen, etter at han manglet i Levi-åpningen grunnet treningsunderskudd – særlig kondisjonsmessig. Den 34 år gamle tiroleren var Østerrikes store slalåmhåp forrige sesong og er en av de jevneste toppkjørerne i verdenscupen, men ÅSF-herrene fikk en tung sesongstart da kun Johannes Strolz kom i mål som nr. 22 i Levi, der Lucas Pinheiro Braathen vant. Sportlig leder Christian Mitter erkjenner at laget er i gjeld til resultatene, og et hjemme-verdenscuprenn i Gurgl gir mulighet til oppreisning.","url":"https://sport.orf.at/stories/3165035/","pub_date":"2026-11-17T10:46:08.000Z","fetched_at":"2026-11-17 11:00:04","lang_orig":"de","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":175772,"source_name":"Neveitalia","country":"ITA","title_no":"Franzoni åpenhjertig: «Tvilen på om jeg kan bekrefte meg selv får meg til å stadig heve lista»","title_orig":"Franzoni a cuore aperto: \"I dubbi che ho sulla possibilità di confermarmi mi portano ad alzare sempre l'asticella\"","summary_no":"Franzoni deler åpenhjertig om sin indre tvil og hvordan usikkerheten om å bekrefte egne prestasjoner motiverer ham til å kontinuerlig strekke seg høyere.","spik_no":"Den italienske alpinisten Giovanni Franzoni åpner seg om den indre tvilen som driver ham til å stadig strekke seg høyere. 25-åringen fra Brescia hadde en gjennombruddssesong i 2023/24, der han vant utforkjøringen i Kitzbühel og tok sølv i OL-utforen i Beijing. Han trener for øyeblikket med det italienske fartslaget i Copper Mountain, etter å ha begynt sesongen med en utgang i andre omgang i storslalåmen i Søelden. Franzoni skal i løpet av vinteren kjøre doble renn i utfor, super-G og storslalåm ved Copper Mountain og Beaver Creek.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/franzoni-a-cuore-aperto-i-dubbi-che-ho-sulla-possibilita-di-confermarmi-mi-portano-ad-alzare-sempre-l-asticella","pub_date":"2026-11-17T10:35:00.000Z","fetched_at":"2026-11-17 10:45:02","lang_orig":"it","category":null,"athletes":"Giovanni Franzoni","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":175613,"source_name":"SkinEWS","country":"SUI","title_no":"Feller-start i Gurgl: Ja? Nei? Kanskje!","title_orig":"Feller-Start in Gurgl: Ja? Nein? Vielleicht!","summary_no":"Det er fortsatt usikkert om Manuel Feller stiller til start i Gurgl. Spørsmålet om han deltar forblir ubesvart.","spik_no":"Det er fortsatt usikkert om Manuel Feller stiller til start i hjemmerennet i Gurgl 22. november – avgjørelsen tas i siste liten. Feller er en av Østerrikes fremste slalomkjørere og vant slalomcupen sammenlagt i sesongen 2023/24, men har slitt med skader som har påvirket forberedelsene. Gurgl-rennet er et av de mest prestisjefylte for østerrikske utøvere, med krevende Kirchenkar-løype og stort hjemmepublikum, og landslaget trenger ham i kampen om viktige verdenscuppoeng etter sesongåpningen i Levi.","url":"https://www.skinews.ch/news/2026/feller-start-vielleicht/","pub_date":"2026-11-17T10:17:09.000Z","fetched_at":"2026-11-17 10:30:04","lang_orig":"de","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":175422,"source_name":"Neveitalia","country":"ITA","title_no":"Østerrike bekreftet til Gurgl – Feller ute, Vinatzer starter blant topp 15","title_orig":"Ufficiale l'Austria per Gurgl con Truppe stella e l'assenza di Feller, che porterà Vinatzer a partire nei 15","summary_no":"Østerrike har bekreftet troppen til Gurgl med sterke profiler, men uten Manuel Feller. Hans fravær åpner for at Henrik Vinatzer kan starte blant de første 15.","spik_no":"Østerrike stiller med et sterkt lag til slalåmrennet i Gurgl, men uten Manuel Feller, som regjerende verdensmester i slalåm er en av de fremste favorittene i verdenstoppen. Hans fravær får direkte konsekvenser for startrekkefølgen: italienske Henrik Vinatzer rykker opp og får starte blant de første 15, noe som gir ham fordelen av bedre spor. For Østerrikes herrelag blir Feller-fraværet en ekstra utfordring etter at de skuffet i sesongåpningens slalåm, og det er nå Noel Gstrein og Marco Schwarz som må bære lasset.","url":"https://www.neveitalia.it/sport/scialpino/news/ufficiale-l-austria-per-gurgl-con-truppe-stella-e-l-assenza-di-feller-che-portera-vinatzer-a-partire-nei-15","pub_date":"2026-11-17T10:10:00.000Z","fetched_at":"2026-11-17 10:15:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Katharina Truppe,Manuel Feller","athlete_nations":["AUT","GER","ITA"],"also_sources":[],"norwegian":false},{"id":175071,"source_name":"Neveitalia","country":"ITA","title_no":"Disse italienerne er uttatt til Europa Cup-åpningen i Suomu – Bendotti med etter Levi og Gurgl","title_orig":"Definiti gli azzurri per l'opening di Coppa Europa a Suomu: ci sarà anche Bendotti dopo Levi e Gurgl in CdM","summary_no":"Det italienske alpinlandslaget er uttatt til Europa Cup-åpningen i Suomu, og Bendotti er inkludert etter verdenscupstarter i Levi og Gurgl.","spik_no":"Det italienske alpinlandslaget har tatt ut ti utøvere til Europa Cup-åpningen i Suomu, Finland, der det arrangeres to slalomrenn 25. og 26. november. Blant de uttatte er Matteo Bendotti, som nylig debuterte i verdenscupen med starter i Levi og Gurgl – han reiser til Suomu etter at verdenscuphelgen er ferdig, sammen med Corrado Barbera og Edoardo Saracco. Teknisk direktør Massimo Carca har også tatt ut Stefano Pizzato og Francesco Zucchini, som begge vant FIS-slalomrenn i Diavolezza kort tid før uttaket. Europa Cup fungerer som den viktigste rekrutteringsarenaen under verdenscupen, og for unge løpere som Bendotti er det mulighet til å bygge erfaring og poeng.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/definiti-gli-azzurri-per-l-opening-di-coppa-europa-a-suomu-ci-sara-anche-bendotti-dopo-levi-e-gurgl-in-cdm","pub_date":"2026-11-17T09:35:00.000Z","fetched_at":"2026-11-17 09:45:02","lang_orig":"it","category":null,"athletes":"Bendotti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":174895,"source_name":"Neveitalia","country":"ITA","title_no":"Kroatia stiller med fem kort til Gurgl","title_orig":"Con una Ljutic ritrovata e la presenza di Popovic (ma anche un bel Kolega), la Croazia si propone con cinque punte per Gurgl","summary_no":"Med en gjenfunnet Ljutic og bidrag fra Popovic og Kolega stiller Kroatia sterkt til alpine renn i Gurgl.","spik_no":"Kroatia stiller med fem utøvere til slalomrennene i Gurgl, og inkluderer en tilbakevendt Leona Popovic, som mistet åpningsrennet i Levi etter å ha blitt operert i kneet i september. På damesiden har Zrinka Ljutic vunnet slalomcupen sammenlagt i sesongen 2024/25 og er lagets fremste kort, mens Samuel Kolega, Filip Zubcic og Rodes utgjør herrenes bidrag. Kroatia er en av alpinverdenens mest overraskende suksesshistorier i slalom, med Ivica Kostelic og nå en ny generasjon som holder nasjonen på verdenskartet.","url":"https://www.neveitalia.it/sport/scialpino/news/con-una-ljutic-ritrovata-e-la-presenza-di-popovic-ma-anche-un-bel-kolega-la-croazia-si-propone-con-cinque-punte-per-gurgl","pub_date":"2026-11-17T09:15:00.000Z","fetched_at":"2026-11-17 09:30:02","lang_orig":"it","category":null,"athletes":"Leona Popovic,Zrinka Ljutic","athlete_nations":["CRO"],"also_sources":[],"norwegian":false},{"id":122476,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen vinner igjen og åpner svensk trippel i andre slalåm i Storklinten – Hansson og Wissting på pallen","title_orig":"Jakobsen cala il bis e apre la tripletta svedese nel secondo slalom a Storklinten: sul podio anche Hansson e Wissting","summary_no":"Jakobsen doblet seg med ny seier i Storklinten og sørget for svensk trippel på pallen, foran Hansson og Wissting.","spik_no":"Kristoffer Jakobsen vant begge FIS-slalåmrennene i Storklinten og sørget for svensk trippel i søndagens renn, der Hansson og Wissting fulgte på pallen. Den 32 år gamle svenske spesialisten hadde en tung Verdenscup-sesong i fjor der han knapt scoret poeng, men viser nå sterk form en uke før sesongåpningen i Levi. Belgiernes Armand Marchant, som nesten tok sin første seier i Gurgl forrige sesong, deltok bare i lørdagens renn og endte da som toer, over ett sekund bak Jakobsen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/jakobsen-cala-il-bis-e-apre-la-tripletta-svedese-nel-secondo-slalom-a-storklinten-sul-podio-anche-hansson-e-wissting","pub_date":"2026-11-08T10:35:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":"sportslig","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122453,"source_name":"Ski Racing","country":"INT","title_no":"Møt Lionel Agoutin – mannen bak Ski World Cup-bannerne","title_orig":"Meet Lionel Agoutin, the Man Behind the Ski World Cup Banners","summary_no":"Lionel Agoutin er personen som lager de ikoniske bannerne langs traseen under alpinske verdenscuprenn.","spik_no":"Lionel Agoutin er mannen bak de fargerike bannerne som preger tribunene under alpinske verdenscuprenn verden over. Den franske entusiasten driver Alpine Ski World Cup Fan Community og lager bannerne selv – med nasjonale teamfarger og portretter av utøvere fra hele startfeltet. Bannerne er ikke et kommersielt produkt fra FIS eller forbundene, men resultatet av én manns dedikasjon til sporten og fellesskapet rundt den. Agoutin er et kjent ansikt i verdenscupen og har blant annet blitt fotografert sammen med stjerner som Lindsey Vonn.","url":"https://skiracing.com/meet-lionel-agoutin-the-man-behind-the-ski-world-cup-banners/","pub_date":"2026-11-06T20:19:31.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":"goy","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":103287,"source_name":"Neveitalia","country":"ITA","title_no":"SC Courmayeur tar imot Brignone igjen: – En forelder holder alltid døren åpen","title_orig":"\"Un genitore lascia sempre la porta aperta, Fede è rimasta la ragazza che ama sciare in libertà\": lo S.C. Courmayeur riaccoglie Brignone","summary_no":"Federica Brignone ønskes velkommen tilbake til skiklubben SC Courmayeur, som beskriver henne som jenta som alltid har elsket å stå fritt på ski.","spik_no":"Federica Brignones hjemklubb SC Courmayeur ønsker henne hjertelig velkommen tilbake og beskriver henne som «jenta som alltid har elsket å stå fritt på ski». Nyheten kommer dagen etter at Brignone kunngjorde at hun forlater sin stilling i Carabinieri, den italienske militærenheten mange alpinister er tilknyttet. Den 34-årige alpinisten fra La Salle er Italias mestvinnende utøver gjennom tidene med to olympiske gull og over 30 verdenscupseire, og er nå i gang med oppkjøringen mot en ny comeback-sesong etter skade.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-genitore-lascia-sempre-la-porta-aperta-fede-e-rimasta-la-ragazza-che-ama-sciare-in-liberta-lo-sc-courmayeur-riaccoglie-brign","pub_date":"2026-11-03T11:25:00.000Z","fetched_at":"2026-11-03 11:30:02","lang_orig":"it","category":"naert","athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":100827,"source_name":"RTV SLO","country":"SLO","title_no":"Houthi-raketter tvang asiatisk mesterskap fra januar til desember 2027","title_orig":"Rakete hutijev prestavile azijsko prvenstvo z januarja na december 2027","summary_no":"Asiatisk mesterskap i alpint er blitt flyttet fra januar til desember 2027 som følge av houthi-rakettangrep.","spik_no":"Det asiatiske alpinmesterskapet er flyttet fra januar til desember 2027 på grunn av houthi-rakettangrep i regionen. Houthi-bevegelsen i Jemen har siden 2023 gjennomført en rekke angrep mot skip og mål i Rødehavet og omkringliggende områder, noe som har skapt usikkerhet og sikkerhetsproblemer for arrangementer i nærheten. Det er uvanlig at geopolitiske konflikter direkte påvirker internasjonale alpinarrangementer, og beslutningen understreker hvor stor rekkevidden av konflikten har blitt.","url":"https://www.rtvslo.si/sport/rakete-hutijev-prestavile-azijsko-prvenstvo-z-januarja-na-december-2027/798849","pub_date":"2026-11-03T07:07:24.000Z","fetched_at":"2026-11-03 07:30:05","lang_orig":"sl","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":76731,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn klar for siste operasjon: – Mentalt tøff nedtelling","title_orig":"\"Countdown duro mentalmente, tra meno di due settimane mi opero\": Lindsey Vonn verso l'ultimo intervento alla gamba","summary_no":"Lindsey Vonn skal operere benet om mindre enn to uker og beskriver ventetiden som mentalt krevende.","spik_no":"Lindsey Vonn er klar for det hun beskriver som sin siste operasjon, og sier ventetiden på under to uker er mentalt krevende. Inngrepet innebærer fjerning av skruer og plater i venstre tibia, samt en operasjon på korsbåndet. Vonn, som er en av tidenes mestvinnende alpinister med 82 verdenscupseirer og OL-gull i utfor fra 2010, har tilbrakt store deler av 2026 med rehabilitering etter en alvorlig skade hun pådro seg tidligere i år. I høst har hun jobbet intenst i treningssalen for å styrke muskulaturen før det avsluttende inngrepet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/countdown-duro-mentalmente-tra-meno-di-due-settimane-mi-opero-lindsey-vonn-verso-l-ultimo-intervento-alla-gamba","pub_date":"2026-10-28T13:30:00.000Z","fetched_at":"2026-10-28 13:45:02","lang_orig":"it","category":"nyheter","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":59459,"source_name":"ORF Sport","country":"AUT","title_no":"Rennkalenderen skaper igjen debatt","title_orig":"Rennkalender sorgt erneut für Diskussionen","summary_no":"Alpinski-rennkalenderen er nok en gang gjenstand for diskusjon blant utøvere og organisasjoner.","spik_no":"Verdenscupkalenderen for alpint 2026/27 inneholder 40 renn for kvinner og 43 for menn, men balansen mellom fart- og teknikkøvelser er igjen skjev – særlig for kvinner, der teknikkrenn dominerer klart. Østerrike er største vertsland med 15 verdenscupavdelinger, inkludert en ny stopp i Dachstein West/Gosau. Østerriksk dametrener Johannes Zöchling peker på at logistikk og mange motstridende interesser gjør kalenderarbeidet svært krevende, og beklager at det ikke er fartshjemerenn for østerrikske kvinner denne vinteren.","url":"https://sport.orf.at/stories/3163844/","pub_date":"2026-10-24T07:43:47.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":48079,"source_name":"Neveitalia","country":"ITA","title_no":"Atomic og Braathen sammen til 2030 – sikter mot den store krystallkulen","title_orig":"Atomic e Lucas Pinheiro Braathen assieme sino al 2030: il prossimo obiettivo è la sfera di cristallo assoluta","summary_no":"Atomic og Lucas Pinheiro Braathen har forlenget samarbeidet til 2030, med den sammenlagte verdenscupseieren som neste store mål.","spik_no":"Lucas Pinheiro Braathen og utstyrsmerket Atomic har forlenget samarbeidet sitt frem til 2030, med den store krystallkulen – sammenlagttittelen i verdenscupen – som overordnet mål. Braathen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåmkula i 2022–23-sesongen og har etablert seg blant verdens beste teknikkjørere. En sammenlagtseier vil kreve at han hevder seg også utenfor slalåm, noe som gjenstår å bevise.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/atomic-e-lucas-pinheiro-braathen-assieme-sino-al-2030-il-prossimo-obiettivo-e-la-sfera-di-cristallo-assoluta","pub_date":"2026-10-21T10:20:00.000Z","fetched_at":"2026-10-22 10:54:36","lang_orig":"it","category":"viktig","athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":46668,"source_name":"SVT Sport","country":"SWE","title_no":"Treningsbildene av Anna Swenn-Larsson spres: «Viralt»","title_orig":"Träningsbilderna på Anna Swenn-Larsson sprids: ”Viralt”","summary_no":"Bilder av Anna Swenn-Larsson under trening sprer seg raskt på nett og har blitt et viralt fenomen.","spik_no":"Anna Swenn-Larsson har skapt oppmerksomhet på sosiale medier etter at treningsvideoer av henne har spredt seg viralt, blant annet med kommentarer fra alpinlegender som Anja Pärson og Lindsey Vonn. Den svenske slalåmstjernen, som er 35 år, vant bronsemedalje i slalåm under OL i Milano Cortina og regnes som en av de mest erfarne utøverne i verdenscupen. Swenn-Larsson er ydmyk overfor oppmerksomheten og påpeker at hardt treningsarbeid er normalt i alpinmiljøet. Til helgen er hun klar for verdenscuppremieren i Sölden 24. oktober.","url":"https://www.svt.se/sport/alpint/traningsbilderna-pa-anna-swenn-larsson-sprids-viralt","pub_date":"2026-10-20T07:51:11.000Z","fetched_at":"2026-10-20 08:00:04","lang_orig":"sv","category":"naert","athletes":"Anna Swenn-Larsson","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":31695,"source_name":"Ski Racing","country":"INT","title_no":"Breezy Johnson stiller spørsmål ved rettferdigheten i FIS' skivektregel","title_orig":"Breezy Johnson Questions Fairness of FIS Ski Weight Rule","summary_no":"Den amerikanske alpinisten Breezy Johnson kritiserer FIS-regelen om minimumsvekt på ski og mener den ikke er rettferdig.","spik_no":"Amerikanske Breezy Johnson, olympisk mester og verdensmester i utforkjøring, stiller spørsmål ved ret function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';
  if (days <= 45) return '🎿 Forsesong — ' + nxt.venue + ' om ' + days + ' dager';
  return '💤 Sommerpause';
}

function getRace(str) {
  if (!str) return null;
  const d = new Date(str);

  return RACES.find(r => s >= r.date && s <= r.end) || null;
}

function fmt(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' kl. ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

      also_sources: r.flere_kilder || []
    }));
    extraLoaded = true; extraLoading = false; render();
  }).catch(() => { extraLoading = false; });
}

document.getElementById('search').addEventListener('input', e => { searchQ = e.target.value; if (searchQ.trim()) loadExtra(); render(); });
document.getElementById('athlete-select').addEventListener('change', e => { activeAthlete = e.target.value; render(); });

function cardHtml(a, compact) {
  const title = a.title_no || a.title_orig;
  const race = getRace(a.pub_date || a.fetched_at);
  if (compact) {
    return `<div class="spik-card">
      <div class="spik-card-meta">
        <span class="src src-${a.country}">${a.source_name}</span>
        ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
        <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
      </div>
      <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="spik-card-title">${title}</a>
      ${a.spik_no ? `<div class="spik-card-body">${a.spik_no}</div>` : ''}
    </div>`;
  }
  return `<div class="card${a.norwegian ? ' card-nor' : ''}">
    <div class="card-meta">
      <span class="src src-${a.country}">${a.source_name}</span>
      ${a.norwegian ? '<span class="nor-chip">🇳🇴 Norsk</span>' : ''}
      ${a.also_sources && a.also_sources.length ? `<span class="multi-chip" title="Også dekket av: ${a.also_sources.join(', ')}">📰 ${a.also_sources.length + 1} kilder</span>` : ''}
      ${a.lang_orig && a.lang_orig !== 'no' ? `<span class="lang">${a.lang_orig.toUpperCase()} → NO</span>` : ''}
      ${a.athletes ? `<span style="font-size:10px;color:var(--sportslig)">👤 ${a.athletes.split(',')[0]}</span>` : ''}
      ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
      ${race ? `<span class="race-chip">🏁 ${race.venue}</span>` : ''}
      <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
    </div>
    <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="card-title">${title}</a>
    ${a.summary_no ? `<p class="card-summary">${a.summary_no}</p>` : ''}
    ${a.spik_no ? `<div class="card-spik"><span class="spik-label">📻 SPIK</span><span class="spik-text">${a.spik_no}</span></div>` : ''}
  </div>`;
}

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function render() {
  renderFilterRow();
  const words = norm(searchQ).split(/\s+/).filter(Boolean);
  const pool = words.length && extraLoaded ? ARTICLES_ALL : ARTICLES;
  const visible = pool.filter(a => {
    if (activeCountry === 'INT' ? a.country !== 'INT' : (activeCountry && !(a.athlete_nations || []).includes(activeCountry))) return false;
    if (activeCat && a.category !== activeCat) return false;
    if (activeAthlete && !(a.athletes||'').split(',').map(s=>s.trim()).includes(activeAthlete)) return false;
    if (words.length) {
      const hay = norm([a.title_no, a.title_orig, a.summary_no, a.spik_no, a.athletes, a.source_name, (a.also_sources||[]).join(' '), a.category,
        ...(a.athlete_nations||[]).map(c => c + ' ' + ((NATION_META[c]||[])[1]||''))].filter(Boolean).join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });

  document.getElementById('count').textContent = visible.length + ' saker';

  const feed = document.getElementById('feed');
  feed.innerHTML = visible.length
    ? visible.map(a => cardHtml(a, false)).join('')
    : `<div class="empty">${words.length || activeCountry || activeCat || activeAthlete ? 'Ingen treff' : 'Ingen saker'}</div>`;

  // Spik-liste: vis alle kategoriserte (ufiltrert på land/utøver/søk for sidepanelet, men respekter kategori-filter)
  const spikFilter = activeCat
    ? ARTICLES.filter(a => a.category === activeCat)
    : ARTICLES.filter(a => a.category);

  const spikEl = document.getElementById('spik-list');
  const spikLabel = document.getElementById('spik-label');
  spikLabel.textContent = 'Spik-liste (' + spikFilter.length + ')';

  if (!spikFilter.length) {
    spikEl.innerHTML = '<div class="sidebar-empty">Ingen saker valgt ut ennå</div>';
    return;
  }

  // Grupper etter kategori
  const grouped = {};
  CATS.forEach(c => { grouped[c.id] = []; });
  spikFilter.forEach(a => { if (grouped[a.category]) grouped[a.category].push(a); });

  spikEl.innerHTML = CATS.map(cat => {
    const items = grouped[cat.id];
    if (!items.length) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--${cat.id === 'goy' ? 'goy' : cat.id});padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${cat.label}</div>
      ${items.map(a => cardHtml(a, true)).join('')}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
