back i mars 2028 på Gornergrat","title_orig":"Zermatt World Cup Comeback Targets March 2028 on Gornergrat","summary_no":"Zermatt planlegger å gjenoppta verdenscuprennet i alpint på Gornergrat i mars 2028.","spik_no":"Zermatt og Swiss-Ski planlegger et herrenesutforrenn på Gornergrat i mars 2028, etter at alle åtte planlagte renn på Gran Becca-løypen ble avlyst i 2022- og 2023-sesongen. Den opprinnelige Matterhorn Cervino Speed Opening-løypen krysset grensen mellom Sveits og Italia, men ble rammet av regn og snømangel som gjorde nedre del av løypen uforsvarlig. Det nye alternativet legger rennet på norsk jord alene, fra Gornergrat, og er foreløpig oppført på FIS sin provisoriske kalender for 2027–28 – men godkjenning gjenstår.","url":"https://skiracing.com/zermatt-world-cup-comeback-targets-march-2028-on-gornergrat/","pub_date":"2026-10-13T21:02:12.000Z","fetched_at":"2026-10-13 21:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":24955,"source_name":"Ski Racing","country":"INT","title_no":"Petra Vlhovás nye start: Tilbake i Sölden og avduking av statue i hjembyen","title_orig":"Petra Vlhová’s New Beginning: Sölden Return, Hometown Statue Unveiled","summary_no":"Petra Vlhová er klar for comeback i Sölden, samtidig som en statue av den slovakiske stjernen ble avduket i hjembyen hennes.","spik_no":"Petra Vlhová er klar for comeback i verdenscupen når sesongen åpner i Sölden 24. oktober – nesten tre år etter hennes siste verdenscupstart. Den slovakiske stjernen gjennomgikk to operasjoner og langvarig rehabilitering etter en alvorlig kneskade i 2023, men returnerte til konkurranse under vinter-OL i 2026. Hun har hentet inn østerrikske Mario Rafetzeder som ny sjefstrener, som tidligere har jobbet med de britiske og finske landslag. Hjembyen Liptovský Mikuláš markerte comebacket med avduking av en statue til hennes ære.","url":"https://skiracing.com/petra-vlhovas-new-beginning-solden-return-hometown-statue-unveiled/","pub_date":"2026-10-13T19:34:08.000Z","fetched_at":"2026-10-13 19:45:01","lang_orig":"en","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":23905,"source_name":"Neveitalia","country":"ITA","title_no":"Snø i Zermatt: Frankrike trener i fart, Sarrazin på plass torsdag","title_orig":"A Zermatt c'è neve per allenarsi sulle discipline veloci: Allegre guida i francesi, da giovedì in pista Sarrazin","summary_no":"Det er nok snø i Zermatt til fartstrening. Frankrike ledes av Allegre, mens Sarrazin er ventet på plass torsdag.","spik_no":"Det franske fartslandslaget utnytter 30 centimeter nysnø i Zermatt til trening på Theodulbreen, med Nils Allegre som lagets ledende navn i denne fasen. Cyprien Sarrazin, en av fjorårets store overraskelser med seier i både utfor og super-G i Bormio, er ventet til trening torsdag. Forholdene på breene har vært vanskelige gjennom sommeren, og Zermatt er blitt et viktig alternativ for fartsspesialistene før åpningen i Copper Mountain 28. november.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/a-zermatt-c-e-neve-per-allenarsi-sulle-discipline-veloci-allegre-guida-i-francesi-da-giovedi-in-pista-sarrazin","pub_date":"2026-10-13T15:25:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":23906,"source_name":"Neveitalia","country":"ITA","title_no":"Østerrikes åpningslag nesten klart: 12 utøvere sikre, intern kvalifisering fredag","title_orig":"Il Wunderteam per l'opening di casa è in gran parte fatto (6 uomini e 6 donne già certi), venerdì la qualificazione interna","summary_no":"Seks menn og seks kvinner er allerede sikret plass på det østerrikske laget til hjemmeåpningen. Fredag avgjøres de siste plassene.","spik_no":"Østerrike stiller med tolv utøvere allerede sikret plass til hjemmeåpningen i Sölden 24.–25. oktober, mens de siste plas :[],"norwegian":true},{"id":23913,"source_name":"Neveitalia","country":"ITA","title_no":"Giada D'Antonio: – Skader har lært meg mye, nå er jeg smertefri","title_orig":"\"Scio senza dolore, l'infortunio mi ha insegnato tanto\": Giada D'Antonio ora in Senales, probabile il debutto in Coppa Europa","summary_no":"Den italienske alpinisten Giada D'Antonio trener i Senales etter skade og er aktuell for debut i Europa-cupen denne sesongen.","spik_no":"Den italienske alpinisten Giada D'Antonio, født 2009, sier hun nå er smertefri etter korsbåndsskaden hun pådro seg 14. februar i trening i Dobbiaco – midt under OL-perioden. Etter nesten sju måneder med rehabilitering ved J Medical i Torino er hun tilbake på snø og trener nå i Val Senales. Planen er et mulig debut i Europa-cupen allerede fra åpningsrennene i Levi 21.–22. november, før hun vender tilbake til verdenscupsirkuset.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/scio-senza-dolore-l-infortunio-mi-ha-insegnato-tanto-giada-d-antonio-ora-in-senales-probabile-il-debutto-in-coppa-europa","pub_date":"2026-10-13T07:50:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":"naert","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":23915,"source_name":"Neveitalia","country":"ITA","title_no":"Nattlig befaring i regnvær på Gran Risa foran spesielt slalåmrenn","title_orig":"Sotto la pioggia dell'Alta Badia, il sopralluogo notturno sulla Gran Risa dove ci sarà uno slalom davvero... speciale","summary_no":"Under kraftig regnvær i Alta Badia ble det gjennomført en nattlig befaring på Gran Risa-løypen, der det ventes et særegent slalåmrenn.","spik_no":"I Alta Badia ble det gjennomført nattlig befaring på Gran Risa-løypen i kraftig regn, som forberedelse til noe nytt i verdenscupkalenderen: 21. desember arrangeres for første gang en nattslalåm på den legendariske bakken. Tidligere har Gran Risa hatt fem utgaver av parallellavsalåm under kunstig lys, men fra denne sesong e veier","title_orig":"Shiffrin geht neue Wege","summary_no":"Mikaela Shiffrin tar nye grep og prøver nye tilnærminger i sin videre karriere.","spik_no":"Mikaela Shiffrin vil redusere antallet slalomrenn denne sesongen og heller satse mer på storslalåm og super-G. Amerikaneren vant forrige sesong sitt sjette sammenlagtcup i verdenscupen – samme antall som rekordholderen Annemarie Moser-Pröll – og sier hun aksepterer at dette valget kan koste henne tittelen. Over 1000 av hennes 1534 poeng forrige sesong kom i slalåm. «Jeg har fortjent mer frihet», sier Shiffrin, som med 100-talls verdenscupseirer er den mestvinnende alpinisten gjennom tidene.","url":"https://sport.orf.at/stories/3163382/","pub_date":"2026-10-12T16:00:17.000Z","fetched_at":"2026-10-12 16:15:04","lang_orig":"de","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":21462,"source_name":"SkinEWS","country":"SUI","title_no":"Intervju med Mikaela Shiffrin på Atomic Media Day 2026","title_orig":"Interview mit Mikaela Shiffrin am Atomic Media Day 2026","summary_no":"Mikaela Shiffrin stilte til intervju under Atomic Media Day 2026.","spik_no":"Mikaela Shiffrin stilte til intervju under Atomic Media Day 2026, der sesongforberedelsene til 2026/27 sto på agendaen. Shiffrin er utøveren med flest verdenscupseirer noen gang — over 97 individuelle seirer — og representerer utstyrsmerket Atomic. Etter en alvorlig kneskade i desember 2023 som holdt henne utenfor store deler av forrige sesong, er forberedelsene til kommende sesong særlig etterlengtede for både utøveren og fansen.","url":"https://www.skinews.ch/video/2026/interview-mikaela-shiffrin/","pub_date":"2026-10-12T15:46:27.000Z","fetched_at":"2026-10-12 16:00:04","lang_orig":"de","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":21180,"source_name":"Sportschau","country":"GER","title_no":"Emma Aicher: Etter sportsprisen sikter hun mot Sh function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';

  return '💤 Sommerpause';
}

const athleteEl = document.getElementById('athlete-select');
athleteList.forEach(n => {
  const o = document.createElement('option');
  o.value = n; o.textContent = n;
  athleteEl.appendChild(o);
});

// Kategori-teller
const catCounts = {};
ARTICLES.forEach(a => { if (a.category) catCounts[a.category] = (catCounts[a.category] || 0) + 1; });

// Bygg filter-rad
const NATION_META = {"NOR":["🇳🇴","Norge","no"],"SWE":["🇸🇪","Sverige","se"],"FIN":["🇫🇮","Finland","fi"],"DEN":["🇩🇰","Danmark","dk"],"AUT":["🇦🇹","Østerrike","at"],"SUI":["🇨🇭","Sveits","ch"],"ITA":["🇮🇹","Italia","it"],"FRA":["🇫🇷","Frankrike","fr"],"GER":["🇩🇪","Tyskland","de"],"USA":["🇺🇸","USA","us"],"CAN":["🇨🇦","Canada","ca"],"SLO":["🇸🇮","Slovenia","si"],"SVK":["🇸🇰","Slovakia","sk"],"CRO":["🇭🇷","Kroatia","hr"],"GBR":["🇬🇧","Storbritannia","gb"],"CZE":["🇨🇿","Tsjekkia","cz"],"BEL":["🇧🇪","Belgia","be"],"ESP":["🇪🇸","Spania","es"],"AND":["🇦🇩","Andorra","ad"],"LIE":["🇱🇮","Liechtenstein","li"],"POL":["🇵🇱","Polen","pl"],"BUL":["🇧🇬","Bulgaria","bg"],"LAT":["🇱🇻","Latvia","lv"],"EST":["🇪🇪","Estland","ee"],"UKR":["🇺🇦","Ukraina","ua"],"TUR":["🇹🇷","Tyrkia","tr"],"GRE":["🇬🇷","Hellas","gr"],"JPN":["🇯🇵","Japan","jp"],"KOR":["🇰🇷","Sør-Korea","kr"],"CHN":["🇨🇳","Kina","cn"],"AUS":["🇦🇺","Australia","au"],"NZL":["🇳🇿","New Zealand","nz"],"BRA":["🇧🇷","Brasil","br"],"ARG":["🇦🇷","Argentina","ar"],"CHI":["🇨🇱","Chile","cl"],"LTU":["🇱🇹","Litauen","lt"],"ROU":["🇷🇴","Romania","ro"],"HUN":["🇭🇺","Ungarn","hu"],"SRB":["🇷🇸","Serbia","rs"],"BIH":["🇧🇦","Bosnia","ba"],"MKD":["🇲🇰","Nord-Makedonia","mk"],"ISL":["🇮🇸","Island","is"],"IRL":["🇮🇪","Irland","ie"],"NED":["🇳🇱","Nederland","nl"],"LUX":["🇱🇺","Luxembourg","lu"],"ALB":["🇦🇱","Albania","al"],"KAZ":["🇰🇿","Kasakhstan","kz"],"GEO":["🇬🇪","Georgia","ge"],"ARM":["🇦🇲","Armenia","am"]};
const nationCounts = {};
ARTICLES.forEach(a => (a.athlete_nations || []).forEach(n => { nationCounts[n] = (nationCounts[n] || 0) + 1; }));
const COUNTRIES = [
  {code:'',label:'Alle'},
  {code:'INT',label:'🌐 Internasjonalt'},
  ...Object.entries(nationCounts).sort((x,y) => y[1]-x[1] || x[0].localeCompare(y[0])).map(([code,n]) => {
    const m = NATION_META[code] || ['🏳️', code, null];
    return {code, iso: m[2], label: m[0] + ' ' + m[1] + ' (' + n + ')'};
  }),
];

let activeCountry = '';
let activeCat = '';
let searchQ = '';
let activeAthlete = '';

const catRow = document.getElementById('cat-row');
const countryEl = document.getElementById('country-select');

COUNTRIES.forEach(c => {
  if (c.code === '') return;
  const o = document.createElement('option');
  o.value = c.code; o.textContent = c.label;
  countryEl.appendChild(o);
});
countryEl.addEventListener('change', e => {
  activeCountry = e.target.value;
  activeCat = '';
  renderFilterRow();
  render();
});

const allBtn = document.createElement('button');
allBtn.className = 'ftab active';
allBtn.dataset.all = '1';
allBtn.textContent = 'Alle saker';
allBtn.addEventListener('click', () => {
  activeCountry = ''; activeCat = ''; activeAthlete = ''; searchQ = '';
  document.getElementById('search').value = '';
  athleteEl.value = '';
  render();
});
catRow.appendChild(allBtn);

if (Object.keys(catCounts).length) {
  CATS.forEach(cat => {
    const count = catCounts[cat.id] || 0;
    if (!count) return;
    const btn = document.createElement('button');
    btn.className = 'ftab cat-' + cat.id;
    btn.dataset.cat = cat.id;
    btn.innerHTML = cat.label + `<span class="cbadge cbadge-${cat.id}">${count}</span>`;
    btn.addEventListener('click', () => {
      activeCat = activeCat === cat.id ? '' : cat.id;
      activeCountry = '';
      renderFilterRow();
      render();
    });
    catRow.appendChild(btn);
  });
}

function renderFilterRow() {
  countryEl.value = activeCountry;
  document.querySelectorAll('.filter-rows .ftab').forEach(b => {
    b.classList.toggle('active', b.dataset.all
      ? !activeCountry && !activeCat && !activeAthlete && !searchQ
      : b.dataset.cat !== undefined && b.dataset.cat === activeCat);
  });
}

// Siden viser bare de nyeste sakene. Når noen søker, hentes saker.json (alle godkjente saker)
// én gang, og eldre saker tas med i søket.
let extraLoaded = false, extraLoading = false;
function loadExtra() {
  if (extraLoaded || extraLoading) return;
  extraLoading = true;
  fetch('saker.json').then(r => r.json()).then(j => {
    const have = new Set(ARTICLES.map(a => a.id));
    (j.saker || []).filter(r => !have.has(r.id)).forEach(r => ARTICLES_ALL.push({
      id: r.id, source_name: r.kilde, country: r.kilde_land, title_no: r.tittel, title_orig: '',
      summary_no: r.ingress, spik_no: r.spik, url: r.url, pub_date: r.publisert_iso, fetched_at: r.publisert_iso,
      athletes: (r.utovere || []).join(','), athlete_nations: r.land || [], category: r.kategori || null,
      also_sources: r.flere_kilder || []
    }));
    extraLoaded = true; extraLoading = false; render();
  }).catch(() => { extraLoading = false; });
}

document.getElementById('search').addEventListener('input', e => { searchQ = e.target.value; if (searchQ.trim()) loadExtra(); render(); });
document.getElementById('athlete-select').addEventListener('change', e => { activeAthlete = e.target.value; render(); });

function cardHtml(a, compact) {
  const title = a.title_no || a.title_orig;
  const race = getRace(a.pub_date || a.fetched_at);
  if (compact) {
    return `<div class="spik-card">
      <div class="spik-card-meta">
        <span class="src src-${a.country}">${a.source_name}</span>
        ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
        <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
      </div>
      <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="spik-card-title">${title}</a>
      ${a.spik_no ? `<div class="spik-card-body">${a.spik_no}</div>` : ''}
    </div>`;
  }
  return `<div class="card${a.norwegian ? ' card-nor' : ''}">
    <div class="card-meta">
      <span class="src src-${a.country}">${a.source_name}</span>
      ${a.norwegian ? '<span class="nor-chip">🇳🇴 Norsk</span>' : ''}
      ${a.also_sources && a.also_sources.length ? `<span class="multi-chip" title="Også dekket av: ${a.also_sources.join(', ')}">📰 ${a.also_sources.length + 1} kilder</span>` : ''}
      ${a.lang_orig && a.lang_orig !== 'no' ? `<span class="lang">${a.lang_orig.toUpperCase()} → NO</span>` : ''}
      ${a.athletes ? `<span style="font-size:10px;color:var(--sportslig)">👤 ${a.athletes.split(',')[0]}</span>` : ''}
      ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
      ${race ? `<span class="race-chip">🏁 ${race.venue}</span>` : ''}
      <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
    </div>
    <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="card-title">${title}</a>
    ${a.summary_no ? `<p class="card-summary">${a.summary_no}</p>` : ''}
    ${a.spik_no ? `<div class="card-spik"><span class="spik-label">📻 SPIK</span><span class="spik-text">${a.spik_no}</span></div>` : ''}
  </div>`;
}

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function render() {
  renderFilterRow();
  const words = norm(searchQ).split(/\s+/).filter(Boolean);
  const pool = words.length && extraLoaded ? ARTICLES_ALL : ARTICLES;
  const visible = pool.filter(a => {
    if (activeCountry === 'INT' ? a.country !== 'INT' : (activeCountry && !(a.athlete_nations || []).includes(activeCountry))) return false;
    if (activeCat && a.category !== activeCat) return false;
    if (activeAthlete && !(a.athletes||'').split(',').map(s=>s.trim()).includes(activeAthlete)) return false;
    if (words.length) {
      const hay = norm([a.title_no, a.title_orig, a.summary_no, a.spik_no, a.athletes, a.source_name, (a.also_sources||[]).join(' '), a.category,
        ...(a.athlete_nations||[]).map(c => c + ' ' + ((NATION_META[c]||[])[1]||''))].filter(Boolean).join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });

  document.getElementById('count').textContent = visible.length + ' saker';

  const feed = document.getElementById('feed');
  feed.innerHTML = visible.length
    ? visible.map(a => cardHtml(a, false)).join('')
    : `<div class="empty">${words.length || activeCountry || activeCat || activeAthlete ? 'Ingen treff' : 'Ingen saker'}</div>`;

  // Spik-liste: vis alle kategoriserte (ufiltrert på land/utøver/søk for sidepanelet, men respekter kategori-filter)
  const spikFilter = activeCat
    ? ARTICLES.filter(a => a.category === activeCat)
    : ARTICLES.filter(a => a.category);

  const spikEl = document.getElementById('spik-list');
  const spikLabel = document.getElementById('spik-label');
  spikLabel.textContent = 'Spik-liste (' + spikFilter.length + ')';

  if (!spikFilter.length) {
    spikEl.innerHTML = '<div class="sidebar-empty">Ingen saker valgt ut ennå</div>';
    return;
  }

  // Grupper etter kategori
  const grouped = {};
  CATS.forEach(c => { grouped[c.id] = []; });
  spikFilter.forEach(a => { if (grouped[a.category]) grouped[a.category].push(a); });

  spikEl.innerHTML = CATS.map(cat => {
    const items = grouped[cat.id];
    if (!items.length) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--${cat.id === 'goy' ? 'goy' : cat.id});padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${cat.label}</div>
      ${items.map(a => cardHtml(a, true)).join('')}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
