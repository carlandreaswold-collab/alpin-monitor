av verdens største alpintalenter. På kvinnesiden er Thea Louise Stjernesund, OL-sølvvinner i Cortina, og Mina Fuerst Holtmann – som ble toer under finalen i Hafjell – Norges sterkeste kort i storslalåmen lørdag.","url":"https://www.neveitalia.it/sport/scialpino/news/sul-rientro-di-steen-olsen-arriva-il-timbro-dell-ufficialita-i-norvegesi-per-soelden-un-vero-e-proprio-squadrone","pub_date":"2026-10-19T18:35:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Alexander Steen Olsen,Atle Lie McGrath,Henrik Kristoffersen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46278,"source_name":"SkinEWS","country":"SUI","title_no":"Langeårig Atomic-sjef går av med pensjon","title_orig":"Der langjährige Atomic-Chef geht in Pension","summary_no":"Sjefen for skiutstyrsgiganten Atomic gjennom mange år har besluttet å pensjonere seg.","spik_no":"Wolfgang Mayrhofer går av som toppsjef i skiutstyrsprodusenten Atomic ved utgangen av 2026, etter å ha ledet selskapet siden 2007 og hatt en karriere i bedriften som strekker seg over mer enn fire tiår. Hans etterfølger blir Michael Absmaier, som har vært selskapets finansdirektør og visepresident for forretningsutvikling. Atomic er en av de ledende produsentene av alpinski og støvler i verden, og utstyrer en rekke toppnavn på verdenscuptouren.","url":"https://www.skinews.ch/news/2026/langjaehrige-atomic-pension/","pub_date":"2026-10-19T18:03:10.000Z","fetched_at":"2026-10-20 07:15:03","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":46245,"source_name":"Ski Racing","country":"INT","title_no":"Valérie Grenier skadet kneet under Sölden-trening – opereres fredag","title_orig":"Valérie Grenier Injures Knee in Sölden Training, Surgery Scheduled for Friday","summary_no":"Valérie Grenier pådro seg en kneskade under trening i Sölden og skal opereres allerede fredag.","spik_no":"Canadiske Valérie Grenier pådro seg en kneskade under trening på konkurransebakken i Sölden og skal opereres fredag – omfanget er foreløpig ukjent. 29-åringen fra Ontario avsluttet fjorårssesongen på topp da hun vant storslalåmen under verdenscupfinalen i Hafjell i mars, sin tredje verdenscupseier og den første på over to år. Grenier har en karriere preget av fysiske tilbakeslag, og alle tre seirene hennes har kommet i storslalåm. En ny alvorlig skade kan sette hele 2026–27-sesongen i fare.","url":"https://skiracing.com/valerie-grenier-injures-knee-in-solden-training-surgery-scheduled-for-friday/","pub_date":"2026-10-19T17:19:28.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"en","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":46315,"source_name":"ORF Sport","country":"AUT","title_no":"«Brutalt»: Kilde sliter med skadeulykken","title_orig":"„Brutal“: Kilde hadert mit Verletzungspech","summary_no":"Aleksander Aamodt Kilde beskriver det som brutalt å ha vært plaget av skader.","spik_no":"Aleksander Aamodt Kilde beskriver det som \"brutalt\" å ha pådratt seg nok en alvorlig skade – denne gang et achillessenebrudd under utfortrening i Chile. 34-åringen fra Bærum skriver på Instagram at han er \"knust, sint og frustrert\", men at han har en klar rehabiliteringsplan. I januar 2024 pådro han seg alvorlige skader i legg og skulder under utforen i Wengen, og har brukt store deler av de siste sesongene på å komme tilbake. Kilde er forlovet med amerikanske Mikaela Shiffrin og regnes som en av verdens beste fartskjørere.","url":"https://sport.orf.at/stories/3163801/","pub_date":"2026-10-19T17:08:35.000Z","fetched_at":"2026-10-20 07:15:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46316,"source_name":"ORF Sport","country":"AUT","title_no":"«Brutalt»: Kilde frustrert over skadeplagene","title_orig":"„Brutal“: Kilde hadert mit seinem Verletzungspech","summary_no":"Aleksander Aamodt Kilde åpner opp om sitt vedvarende skadeproblem og kaller situasjonen brutal.","spik_no":"Aleksander Aamodt Kilde åpner opp på Instagram etter at han pådro seg et achillessenebrudd under utfortrening i Chile – hans foreløpig tyngste tilbakeslag etter en rekke skader de siste årene. 34-åringen forteller at han endelig hadde begynt å kjenne seg raskere og bedre enn på lenge, og at han hadde mer moro på ski enn på veldig lenge – så kom fallet. Kilde vant den store kulen i utfor og super-G sammenlagt i sesongen 2021/22, men har knapt fått vist frem sitt fulle potensial i etterkant på grunn av skader.","url":"https://sport.orf.at/stories/3163800/","pub_date":"2026-10-19T16:45:09.000Z","fetched_at":"2026-10-20 07:15:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46267,"source_name":"Neveitalia","country":"ITA","title_no":"Kilde etter ulykken: – Sint og frustrert, men jeg har en klar vei fremover","title_orig":"Kilde, le prime parole dopo l'incidente: la voglia di combattere c'è ancora. \"Arrabbiato e frustrato, ma ho un percorso chiaro davanti a me\"","summary_no":"Aleksander Aamodt Kilde bryter tausheten etter skadesmellen og forsikrer om at kampviljen er intakt, selv om situasjonen er frustrerende.","spik_no":"Aleksander Aamodt Kilde har brutt tausheten fire dager etter at det ble kjent at han rupturerte achillessenen på høyre ben under en treningsleir i Chile. Den to ganger verdensmester og storhaugen-vinner skriver at han er sint og frustrert, men at han har en klar plan fremover – og at en retur mot slutten av sesongen ikke er utelukket siden restitusjonstiden anslås til fire til fem måneder. Kilde, som har kjempet seg tilbake fra flere alvorlige skader tidligere, var ifølge eget utsagn i ferd med å finne tilbake til sitt beste nivå da ulykken inntraff.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/kilde-le-prime-parole-dopo-l-incidente-la-voglia-di-combattere-c-e-ancora-arrabbiato-e-frustrato-ma-ho-un-percorso-chiaro-davan","pub_date":"2026-10-19T16:15:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46268,"source_name":"Neveitalia","country":"ITA","title_no":"Ny knesmell for Valérie Grenier: kanadieren forlater Sölden med skade","title_orig":"L'ennesima mazzata per Valérie Grenier: danno al ginocchio destro a Soelden, la canadese rientra in patria","summary_no":"Canadiske Valérie Grenier pådro seg en skade på høyre kne under Sölden-åpningen og måtte reise hjem til Canada.","spik_no":"Valérie Grenier skadet seg på høyre kne under trening på Rettenbach i Sölden og reiser hjem til Canada for operasjon fredag – det er ennå ikke klart hvor alvorlig skaden er. Den 29-årige storslalåmspesialisten fra Ontario avsluttet fjorårssesongen med seier i verdenscupfinalen i Hafjell, sin tredje verdenscupseier totalt og alle tre i storslalåm. Karrieren hennes har vært hardt rammet av kneskader tidligere, og det er nå bekreftet at hun ikke stiller til start i Sölden-åpningen lørdag.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/l-ennesima-mazzata-per-valerie-grenier-danno-al-ginocchio-destro-a-soelden-la-canadese-rientra-in-patria","pub_date":"2026-10-19T15:40:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":46279,"source_name":"SkinEWS","country":"SUI","title_no":"Kneskade: Valerie Grenier ute på ubestemt tid","title_orig":"Knieverletzung – Valerie Grenier fällt für unbestimmte Zeit aus","summary_no":"Valerie Grenier har pådratt seg en kneskade og er ute av konkurransene på ubestemt tid.","spik_no":"Kanadiske Valerie Grenier er ute på ubestemt tid etter en kneskade hun pådro seg under trening i Sölden lørdag. 29-åringen er Canadas fremste profil i storslalåm og vant det siste storslalåmrennet i sesongen 2025/26. Hun rekker dermed ikke sesongåpningen i Sölden 25. oktober og trolig mye mer av høsten. Skaden rammer det kanadiske damelandslaget hardt allerede før den første rennhelgen.","url":"https://www.skinews.ch/news/2026/knieverletzung-valerie-unbestimmte/","pub_date":"2026-10-19T15:34:52.000Z","fetched_at":"2026-10-20 07:15:03","lang_orig":"de","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":46269,"source_name":"Neveitalia","country":"ITA","title_no":"Frankrike uten Pinturault i Sölden: Elezi Cannaferina, Anguenot og Favrot leder an","title_orig":"Et voilà, l'Equipe de France che affronterà il primo Rettenbach senza Pinturault: Elezi Cannaferina, Anguenot e Favrot le punte","summary_no":"Det franske alpinlaget møter til sesongåpningen på Rettenbach uten Alexis Pinturault, og trioen Elezi Cannaferina, Anguenot og Favrot er lagets fremste kort.","spik_no":"Frankrike møter til sesongåpningen i Sölden uten Alexis Pinturault, som i en årrekke var lagets fremste profil og vant den samlede verdenscupen i 2021. Blant åtte franske herrer er Alban Elezi Cannaferina og Flavio Vitale de mest spennende talentene, mens Thibaut Favrot er tilbake i full trening etter skade. På damesiden stiller Frankrike med kun Doriane Escane etter Clara Direz sin karriereslutt og en ny alvorlig skade til Clarisse Noel.","url":"https://www.neveitalia.it/sport/scialpino/news/et-voila-l-equipe-de-france-che-affrontera-il-primo-rettenbach-senza-pinturault-elezi-cannaferina-anguenot-e-favrot-le-punte","pub_date":"2026-10-19T15:10:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Alexis Pinturault","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":46319,"source_name":"ORF Sport","country":"AUT","title_no":"Damenes fartsrenn i Narvik strykes fra programmet","title_orig":"Speed-Rennen der Damen in Narvik werden gestrichen","summary_no":"Verdenscupets fartsdisipliner for kvinner i Narvik er fjernet fra årets kalender.","spik_no":"De planlagte verdenscupfartsrennene for kvinner i Narvik – en utfor og en super-G 12.–13. mars 2027 – er avlyst etter at det lokale organisasjonskomitéet trakk seg. Årsaken er at infrastrukturen ikke vil bli ferdigstilt i tide uten å ta uakseptabel risiko, ifølge FIS-rennsjef Peter Gerdol. Narvik er VMby i 2029, og arrangør-CEO Knut-Eirik Dybdal understreker at avlysningen ikke påvirker ambisjonene for mesterskapet. FIS vil snart kunngjøre et alternativt arrangørsted for de aktuelle rennene.","url":"https://sport.orf.at/stories/3163797/","pub_date":"2026-10-19T14:31:35.000Z","fetched_at":"2026-10-20 07:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":46280,"source_name":"SkinEWS","country":"SUI","title_no":"Bare én kvinne og åtte menn i Frankrikes Sölden-tropp","title_orig":"Nur eine Frau und acht Männer in Frankreichs Sölden-Aufgebot","summary_no":"Frankrike stiller med kun én kvinnelig utøver og åtte menn til sesongåpningen i Sölden.","spik_no":"Frankrike stiller med bare én kvinne – Doriane Escane – og åtte menn til verdenscupåpningen i Sölden 24.–25. oktober. På herresiden anføres laget av Leo Anguenot etter at Alexis Pinturault har lagt opp. For damenes del har Frankrike slitt på Rettenbachferner siden Tessa Worley var på pallen i 2017, 2018 og 2019. Situasjonen minner om 2023, da kun Clara Direz stilte for det franske damelandslaget i Sölden.","url":"https://www.skinews.ch/news/2026/maenner-frankreichs-aufgebot/","pub_date":"2026-10-19T14:05:07.000Z","fetched_at":"2026-10-20 07:15:03","lang_orig":"de","category":null,"athletes":"Alexis Pinturault,Tessa Worley","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":46270,"source_name":"Neveitalia","country":"ITA","title_no":"Sverige stiller med seks i Sölden – Kroatia satser på Ljutic og Zubcic","title_orig":"La Svezia a forza 6 per Soelden, Oehlund e Sophie Nyberg al fianco di Hector. Ljutic e Zubcic fari croati per il riscatto","summary_no":"Sverige møter opp med seks utøvere til Sölden, blant dem Oehlund og Sophie Nyberg ved siden av Hector, mens Kroatia ser til Ljutic og Zubcic for oppreisning.","spik_no":"Sverige stiller med seks kvinner og to herrer til sesongåpningen i Sölden, og OL-vinneren Sara Hector er det klare ankerfestet på damesiden – hun har aldri stått på pallen i Sölden og jakter sin første pallplass der. Cornelia Oehlund er tilbake etter en treningsfall i Val Senales, mens 22-årige Sophie Nyberg imponerte stort ved sitt verdenscupdebut i mars. For Kroatia er Elias Kolega Ljutic og Filip Zubcic lagets fremste håp om en sterk plassering på Rettenbach.","url":"https://www.neveitalia.it/sport/scialpino/news/la-svezia-a-forza-6-per-soelden-oehlund-e-sophie-nyberg-al-fianco-di-hector-ljutic-e-zubcic-fari-croati-per-il-riscatto","pub_date":"2026-10-19T14:05:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Cornelia Oehlund","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":46281,"source_name":"SkinEWS","country":"SUI","title_no":"Sverige med åtte utøvere i Sölden – Japan stiller med én","title_orig":"8-köpfiges Sölden-Team für Schweden, ein Einzelkämpfer für Japan","summary_no":"Sverige sender et lag på åtte til Sölden, mens Japan kun stiller med én enkelt utøver.","spik_no":"Sverige stiller med åtte utøvere til sesongåpningen i Sölden – seks kvinner og to menn – mens Japan kun sender én enkelt utøver. Det svenske damelandslaget er i god form etter treningsukene på Rettenbachferner, og sjefstrener Charlie Laband melder om optimisme. Sverige har hatt sitt sterkeste kort i storslalåm de siste sesongene, med utøvere som Sara Hector som markante profiler i verdenscupsammenheng.","url":"https://www.skinews.ch/news/2026/koepfiges-schweden-einzelkaempfer/","pub_date":"2026-10-19T13:29:21.000Z","fetched_at":"2026-10-20 07:15:03","lang_orig":"de","category":null,"athletes":"Cornelia Oehlund,Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":46271,"source_name":"Neveitalia","country":"ITA","title_no":"Lara Colturi: – Brignone er et forbilde, jeg tilpasset meg utstyret raskt","title_orig":"\"Brignone, un esempio. Con Clarey lavoro sulla velocità, mi sono adattata subito al materiale\": Lara Colturi a colloquio con Francesca Marsaglia","summary_no":"Lara Colturi forteller i en samtale med Francesca Marsaglia at hun bruker Brignone som inspirasjon og at samarbeidet med Clarey om fart går svært bra.","spik_no":"Lara Colturi, som konkurrerer under albansk flagg, forteller i et intervju at Federica Brignone er et forbilde og at tilpasningen til nytt utstyr har gått raskt. Den 19 år gamle valsusineren fra Italia er inne i sin femte verdenscupvinter og har syv pallplasser bak seg – fire av dem i slalåm sist sesong. Hun har også fått fartstrening med tidligere Tour de Ski-vinner Johan Clarey, og etter et møte med Loic Meillard i New Zealand beskriver hun hans råd som uvurderlige.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/brignone-un-esempio-con-clarey-lavoro-sulla-velocita-mi-sono-adattata-subito-al-materiale-lara-colturi-a-colloquio-con-francesc","pub_date":"2026-10-19T13:15:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Federica Brignone,Lara Colturi","athlete_nations":["ALB","ITA"],"also_sources":[],"norwegian":false},{"id":46272,"source_name":"Neveitalia","country":"ITA","title_no":"Meillard jakter første pall i Sölden – Odermatt vil ta sin fjerde strake seier","title_orig":"Meillard vuole il primo podio a Soelden, Odermatt il poker di trionfi: ecco gli 8 svizzeri per il Rettenbach","summary_no":"Åtte sveitsere er klare for Rettenbach, der Loïc Meillard ønsker sin første pallplass i Sölden og Marco Odermatt sikter mot å vinne for fjerde gang på rad.","spik_no":"Sveits stiller med åtte utøvere til åpningsrunden i Sölden, der Marco Odermatt sikter mot sin fjerde strake seier i den tradisjonsrike gigantslalåmen på Rettenbach-breen. Odermatt har dominert alpinverdenscupen de siste sesongene og vunnet fem sammenlagtglobus på rad, men tapte tittelen i storslalåmcupen til Lucas Pinheiro Braathen sist sesong. Loïc Meillard har aldri stått på pallen i Sölden og ønsker å rette på det, mens Gino Caviezel gjør comeback etter nesten to år skadet.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/meillard-vuole-il-primo-podio-a-soelden-odermatt-il-poker-di-trionfi-ecco-gli-8-svizzeri-per-il-rettenbach","pub_date":"2026-10-19T12:35:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Loïc Meillard,Marco Odermatt","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":46282,"source_name":"SkinEWS","country":"SUI","title_no":"Kun åtte sveitsere til start i Sölden","title_orig":"Nur acht Schweizer stehen in Sölden am Start","summary_no":"Sveits stiller med en begrenset tropp på bare åtte utøvere til sesongåpningen i Sölden.","spik_no":"Sveits stiller med åtte menn til storslalåmen i Sölden søndag 25. oktober, anført av regjerende verdenscupvinner Marco Odermatt. Opprinnelig kunne elleve sveitsere ha startet, men tre er ikke med i den endelige troppen. Det sveitsiske herrelaget har hatt en sterk europacupsesong, der Lenz Hächler vant sammenlagt og Sandro Zurbrügg og Fadri Janutin tok de to øverste plassene i storslalåmcupen – noe som gir Swiss Ski solid bredde bak Odermatt.","url":"https://www.skinews.ch/news/2026/sieben-schweizer-soelden/","pub_date":"2026-10-19T12:17:40.000Z","fetched_at":"2026-10-20 07:15:03","lang_orig":"de","category":null,"athletes":"Marco Odermatt","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":46273,"source_name":"Neveitalia","country":"ITA","title_no":"Offisielt: Narvik trekker seg fra damenes fartsprogram før finalene","title_orig":"Ora è ufficiale, Narvik rinuncia alla tappa di velocità femminile prima delle finali. Gerdol: \"Non possiamo correre rischi\"","summary_no":"Det er nå bekreftet at Narvik gir avkall på et fartsstevne for kvinner før sesongens finaler. – Vi kan ikke ta sjanser, sier Gerdol.","spik_no":"Narvik trekker seg offisielt fra damenes fartsprogram før sesongens finaler, og arrangøren begrunner avgjørelsen med at de ikke kan ta sjanser. Narvik har vært inne som mulig vertsby for fartsdisiplinene, men bekrefter nå at de ikke kan gjennomføre arrangementet. Det er en betydelig logistisk og sportslig utfordring for FIS, som må finne alternative løsninger for å sikre at fartsprogrammet for kvinner blir gjennomført før sesongslutt.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/ora-e-ufficiale-narvik-rinuncia-alla-tappa-di-velocita-femminile-prima-delle-finali-gerdol-non-possiamo-correre-rischi","pub_date":"2026-10-19T12:05:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":46283,"source_name":"SkinEWS","country":"SUI","title_no":"Kalenderendring – ingen verdenscuprenner i Narvik","title_orig":"Änderung im Kalender – keine Weltcup-Rennen in Narvik","summary_no":"Verdenscupkalenderen er endret og rennene i Narvik er tatt ut av programmet.","spik_no":"Verdenscupkalenderen for 2026/27-sesongen er allerede endret før den første rennhelgen i Sölden: de planlagte fartsrennene for kvinner i Narvik 12.–13. mars 2027 er tatt ut. FIS-rennsjef Peter Gerdol forklarte at infrastrukturen ikke var ferdig – verken løype, snøkanoner, heis eller sikkerhetsinstallasjoner. Narvik er tildelt alpint-VM i 2029, og arrangørene understreker at avlysningen ikke endrer ambisjonene for mesterskapet.","url":"https://www.skinews.ch/news/2026/aenderung-kalender-weltcup/","pub_date":"2026-10-19T11:40:18.000Z","fetched_at":"2026-10-20 07:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":46284,"source_name":"SkinEWS","country":"SUI","title_no":"Ti sveitsiske kvinner klar til verdenscupåpningen","title_orig":"Zehn Schweizerinnen stehen beim Weltcup-Auftakt am Start","summary_no":"Sveits stiller med ti utøvere til start når verdenscupsesongen åpner.","spik_no":"Sveits stiller med ti kvinner til sesongåpningen i Sölden 24. oktober, der rennene arrangeres på Rettenbachferner. Italia er det største laget med elleve utøvere, mens Sveits følger tett bak. Blant de ti sveitsiske utøverne er det et trio med til sammen bare ni verdenscupstarter, noe som illustrerer at Swiss Ski satser på å utvikle ny generasjon ved siden av de etablerte profilene.","url":"https://www.skinews.ch/news/2026/schweizerinnen-weltcup-auftakt/","pub_date":"2026-10-19T09:30:47.000Z","fetched_at":"2026-10-20 07:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":43398,"source_name":"SkinEWS","country":"SUI","title_no":"Max Franz avslutter karrieren","title_orig":"Max Franz beendet seine Karriere als Rennfahrer","summary_no":"Den østerrikske alpinisten Max Franz legger opp som aktiv utøver.","spik_no":"Den østerrikske fartsspesialisten Max Franz legger opp som aktiv utøver, 37 år gammel og én uke før åpningen av verdenscupsesongen 2026/27. Kärntner-utøveren rakk 172 verdenscupstarter og tok tre seire i løpet av karrieren. Franz ble i 2022 rammet av et alvorlig fall i Copper Mountain, der han pådro seg brudd i begge leggene, og kom aldri tilbake til toppen etterpå. «Det er tid for å si takk», skriver han på Instagram.","url":"https://www.skinews.ch/news/2026/beendet-karriere-rennfahrer/","pub_date":"2026-10-18T17:23:57.000Z","fetched_at":"2026-10-18 17:30:03","lang_orig":"de","category":null,"athletes":"Max Franz","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":43428,"source_name":"ORF Sport","country":"AUT","title_no":"Fartsveteran Max Franz setter strek","title_orig":"Speed-Routinier Max Franz zieht Schlussstrich","summary_no":"Rutinerte Max Franz avslutter sin karriere som alpinist på høyt nivå.","spik_no":"Max Franz avslutter karrieren som aktiv alpinist, 37 år gammel og fra den østerrikske delstaten Kärnten. Han tok tre verdenscupseire og totalt ti pallplasseringer, samt VM-bronse i utfor i St. Moritz 2017. Et dramatisk fall i Copper Mountain i 2022 ga ham åpent leggsbrudd på venstre og komplisert brudd på høyre legg — skader han aldri kom seg skikkelig tilbake fra. «Skiidrett var livet mitt», skriver Franz i avskjedsmeldingen sin.","url":"https://sport.orf.at/stories/3163763/","pub_date":"2026-10-18T17:21:20.000Z","fetched_at":"2026-10-18 17:30:03","lang_orig":"de","category":null,"athletes":"Max Franz","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":43267,"source_name":"Neveitalia","country":"ITA","title_no":"Max Franz legger opp etter lang skadekamp","title_orig":"Max Franz, la favola è finita: il velocista carinziano si ritira dopo un lungo calvario. \"Lo sci mi ha dato tantissimo\"","summary_no":"Den østerrikske utforskjøreren Max Franz avslutter karrieren etter en langvarig og tøff skadekamp. «Skisporten har gitt meg enormt mye,» sier han.","spik_no":"Den østerrikske utforspesialisten Max Franz avslutter karrieren etter en lang skadekamp som startet med en alvorlig skade under trening på Copper Mountain i november 2022. 37-åringen fra Kärnten rakk aldri å komme skikkelig tilbake etter det. Franz vant tre verdenscupløp i karrieren, med den første seieren i utfor på Saslong for ti år siden, og var en stabil kraft i det østerrikske «Wunderteam». Han avslutter karrieren med ordene «Skisporten har gitt meg enormt mye».","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/max-franz-la-favola-e-finita-il-velocista-carinziano-si-ritira-dopo-un-lungo-calvario-lo-sci-mi-ha-dato-tantissimo","pub_date":"2026-10-18T17:05:00.000Z","fetched_at":"2026-10-18 17:15:01","lang_orig":"it","category":null,"athletes":"Max Franz","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":42506,"source_name":"ORF Sport","country":"AUT","title_no":"Liensberger på vei tilbake","title_orig":"Liensberger auf dem Weg zurück","summary_no":"Katharina Liensberger er på vei tilbake til konkurranseskiingen.","spik_no":"Katharina Liensberger er på vei tilbake til skiløpingen etter en alvorlig treningsskade i januar, der hun pådro seg brudd i skinnebenshodet samt menisk- og innenbåndsbrudd i høyre kne. Den 29 år gamle østerrikeren stod på ski for første gang siden skaden denne uken i Sölden, og beskriver øyeblikket som «ubeskrivelig». Liensberger, som tok to VM-gull i Cortina 2021, utelukker deltakelse i sesongåpningen i Sölden og Levi, men understreker at hun vil ta det steg for steg.","url":"https://sport.orf.at/stories/3163751/","pub_date":"2026-10-18T15:25:14.000Z","fetched_at":"2026-10-18 15:30:04","lang_orig":"de","category":null,"athletes":"Katharina Liensberger","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":42233,"source_name":"Neveitalia","country":"ITA","title_no":"Store navn på Rettenbach seks dager før åpningen – Aicher, Colturi og Robinson på pisten","title_orig":"Big sul Rettenbach per una domenica tra tempi e feeling da trovare. Sei giorni all'opening, in pista Aicher, Colturi, Robinson...","summary_no":"Toppalpinister testet forholdene på Rettenbach-breen kun seks dager før sesongåpningen i Sölden.","spik_no":"Seks dager før sesongåpningen i Sölden trente en rekke toppnavn på Rettenbach-breen, blant dem Lara Aicher, Lara Colturi og Paula Moltzan Robinson, i gode forhold. Rettenbach-breen i Ötztal-dalen er fast åpningsarena for verdenscupen i alpint, og gir utøverne en siste mulighet til å teste pisten og finne flyten før konkurransen starter. Værmeldingene for selve racehelgen er imidlertid ikke de beste, noe som kan påvirke forholdene på renndagen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/big-sul-rettenbach-per-una-domenica-tra-tempi-e-feeling-da-trovare-sei-giorni-all-opening-in-pista-aicher-colturi-robinson","pub_date":"2026-10-18T09:10:00.000Z","fetched_at":"2026-10-18 15:00:02","lang_orig":"it","category":null,"athletes":"Alice Robinson,Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER","NZL"],"also_sources":[],"norwegian":false},{"id":42235,"source_name":"Neveitalia","country":"ITA","title_no":"De Aliprandini før Sölden: «Har funnet gleden tilbake»","title_orig":"\"L'argento mondiale importante, ma il podio di Adelboden che emozione. Ora ho ritrovato la gioia\": Luca De Aliprandini si racconta prima di Soelden","summary_no":"Luca De Aliprandini ser tilbake på VM-sølvet og podieplassen i Adelboden, og gleder seg til sesongåpningen i Sölden.","spik_no":"Luca De Aliprandini sier han har «funnet gleden tilbake» foran sesongåpningen i Sölden, etter et svært krevende år der kona Michelle Gisin ble alvorlig skadet. Den italienske storslalåmspesialisten vant VM-sølv i storslalåm og tok en podieplass i Adelboden, og har fem topp-ti-plasseringer i Sölden fra tidligere. Til tross for at han falt ut av topp 30 på verdensrankingen forrige sesong, stiller han med fornyet motivasjon og mener at Odermatt nå prioriterer fart fremfor storslalåm.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/l-argento-mondiale-importante-ma-il-podio-di-adelboden-che-emozione-ora-ho-ritrovato-la-gioia-luca-de-aliprandini-si-racconta-p","pub_date":"2026-10-18T08:05:00.000Z","fetched_at":"2026-10-18 15:00:02","lang_orig":"it","category":null,"athletes":"Luca De Aliprandini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":42237,"source_name":"Neveitalia","country":"ITA","title_no":"Endelig tilbake: Liensberger på ski igjen etter ni og en halv måned","title_orig":"Finalmente Liensberger! A 9 mesi e mezzo dall'incidente eccola in pista: \"Torno a sorridere sugli sci\". Rientro a Gurgl?","summary_no":"Katharina Liensberger er tilbake på ski etter skaden, og smiler igjen. Et mulig comebackrenn i Gurgl vurderes.","spik_no":"Katharina Liensberger var tilbake på ski i Sölden ni og en halv måned etter at hun rev over høyre kne under storslalåm-trening 2. januar 2026. Den østerrikske VM-dobbeltmesteren fra Cortina 2021 – med gull i slalåm og parallell – bekreftet at hun ikke rekker Levi, men holder muligheten åpen for hjemmerenn i Gurgl én uke senere. Tilbakekomsten markerer et viktig steg for en av de mest meritterte slalåmkjørerne i kvinneklassen det siste tiåret.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/finalmente-liensberger-a-9-mesi-e-mezzo-dall-incidente-eccola-in-pista-torno-a-sorridere-sugli-sci-rientro-a-gurgl","pub_date":"2026-10-17T16:40:00.000Z","fetched_at":"2026-10-18 15:00:02","lang_orig":"it","category":null,"athletes":"Katharina Liensberger","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":42247,"source_name":"SkinEWS","country":"SUI","title_no":"Marcel Hirscher dropper start i Sölden","title_orig":"Marcel Hirscher verzichtet auf den Sölden-Start","summary_no":"Marcel Hirscher har valgt å stå over åpningsrennet i Sölden denne sesongen.","spik_no":"Marcel Hirscher hopper over åpningsrennet i Sölden denne sesongen etter en skadeperiode, og føler seg ikke klar til å konkurrere på høyeste nivå. Den 37 år gamle østerrikeren, som nå representerer Nederland – moren er nederlandsk – gjorde comebacket sitt i Sölden i 2024 etter seks år borte fra cupen, og endte den gang på 23.-plass. Treningstidene i forkant av åpningshelgen lå for langt bak konkurrentenes, og han valgte å skåne de begrensede wildcard-plassene han rår over.","url":"https://www.skinews.ch/news/2026/hirscher-verzichtet-soelden/","pub_date":"2026-10-17T15:24:58.000Z","fetched_at":"2026-10-18 15:00:04","lang_orig":"de","category":null,"athletes":"Marcel Hirscher","athlete_nations":["NED"],"also_sources":[],"norwegian":false},{"id":42239,"source_name":"Neveitalia","country":"ITA","title_no":"Hirscher trekker seg fra storslalåmen i Sölden","title_orig":"Tempi troppo alti nel confronto con gli austriaci, Hirscher ha deciso di non prendere parte al gigante di Soelden","summary_no":"Marcel Hirscher har besluttet å ikke stille til start i storslalåmen i Sölden etter at tidene hans lå for langt bak de østerrikske konkurrentene.","spik_no":"Marcel Hirscher trekker seg fra storslalåmen i Sölden etter at treningstidene hans lå for langt bak de østerrikske konkurrentenes på Rettenbach-breen. Etter å ha testet forholdene lørdag morgen kom beskjeden fra leiret hans: 37-åringen, som konkurrerer for Nederland, er ikke klar. Hirscher har kun et begrenset antall wildcard-starter til rådighet, og ønsker ikke å bruke dem før formen er god nok. Han vendte tilbake til cupen i Sölden i 2024 etter seks år ute, og fulgte opp med slalåmstarter i Levi og Gurgl.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/tempi-troppo-alti-nel-confronto-con-gli-austriaci-hirscher-ha-deciso-di-non-prendere-parte-al-gigante-di-soelden","pub_date":"2026-10-17T13:25:00.000Z","fetched_at":"2026-10-18 15:00:02","lang_orig":"it","category":null,"athletes":"Marcel Hirscher","athlete_nations":["NED"],"also_sources":[],"norwegian":false},{"id":42212,"source_name":"Ski Racing","country":"INT","title_no":"Sam Maes snakker om nytt lag og Sölden i podkasten Skiing Is Believing","title_orig":"Sam Maes Talks New Team and Sölden on the Skiing Is Believing Podcast","summary_no":"Sam Maes forteller om sitt nye lag og forventningene til sesongåpningen i Sölden i podkasten Skiing Is Believing.","spik_no":"Belgiske Sam Maes forteller i podkasten Skiing Is Believing om overgangen til ny treningsgruppe etter at Team Global Racing ble oppløst etter forrige sesong. Han vil likevel fortsette samarbeidet med trener Paul Epstein, som nå har tatt en rolle i det amerikanske landslaget. Maes er en av de mer etablerte storslaläm-kjørerne fra Belgia og har jevnlig scoret verdenspoeng de siste sesongene. Episoden tar også opp Aleksander Aamodt Kildes achillesskade under utfor-trening i Chile.","url":"https://skiracing.com/sam-maes-talks-new-team-and-solden-on-the-skiing-is-believing-podcast/","pub_date":"2026-10-17T11:45:58.000Z","fetched_at":"2026-10-18 15:00:02","lang_orig":"en","category":null,"athletes":"Sam Maes","athlete_nations":["BEL"],"also_sources":[],"norwegian":false},{"id":42242,"source_name":"Neveitalia","country":"ITA","title_no":"Sölden-show: Store navn på breen – fra Shiffrin til Odermatt og Hirscher","title_orig":"Soelden show, mattinata di training sul ghiacciaio con tanti big, da Hector a Shiffrin, da Odermatt sino a Hirscher","summary_no":"En rekke toppnavn, blant dem Mikaela Shiffrin, Marco Odermatt og Marcel Hirscher, trente på Sölden-breen under åpningsshowet.","spik_no":"Drøyt én uke før sesongåpningen samlet Rettenbach-breen i Sölden en rekke av alpinsportens største navn til trening, blant dem Mikaela Shiffrin, Marco Odermatt og Marcel Hirscher, i ideelle forhold. Sölden er fast åpningsarena for verdenscupen og har vært det siden 2000-tallet, og tilrekkser hvert år store folkemengder til Ötztal. Alexander Steen Olsen, som vant åpningsrennet i Sölden for to sesonger siden, forbereder også comebacket sitt, mens Petra Vlhová trente i Val Senales.","url":"https://www.neveitalia.it/sport/scialpino/news/soelden-show-mattinata-di-training-sul-ghiacciaio-con-tanti-big-da-hector-a-odermatt-sino-a-hirscher","pub_date":"2026-10-17T09:40:00.000Z","fetched_at":"2026-10-18 15:00:02","lang_orig":"it","category":null,"athletes":"Marcel Hirscher,Marco Odermatt,Mikaela Shiffrin","athlete_nations":["NED","SUI","USA"],"also_sources":[],"norwegian":false},{"id":41891,"source_name":"Neveitalia","country":"ITA","title_no":"Sju dager til Rettenbach for kvinnene – Collomb feirer 20 år og drømmer om en stor åpning etter den spesielle 2024-sesongen","title_orig":"Sette giorni al Rettenbach per le ragazze, Collomb festeggia 20 anni e sogna un grande opening dopo quel 2024 speciale","summary_no":"Det er sju dager igjen til kvinnenes renn på Rettenbach. Collomb fyller 20 år og drømmer om en sterk sesongåpning etter en minneverdig 2024-sesong.","spik_no":"Giorgia Collomb fyller 20 år og sikter mot en sterk sesongåpning i storslalåmen på Rettenbach i Sölden 24. oktober, som åpner verdenscupen 2026/27. Den unge italieneren fra La Thuile gjorde verdenscupdebuten sin nettopp i Sölden i 2024 – samme dag som Federica Brignone vant rennet. Brignone er ikke med denne gangen og heier i stedet på sine lagvenninner hjemmefra. Elleve italienske kvinner er i trening på Ötztalbreen, og forholdene beskrives som gode.","url":"https://www.neveitalia.it/sport/scialpino/news/sette-giorni-al-rettenbach-per-le-ragazze-collomb-festeggia-20-anni-e-sogna-un-grande-opening-dopo-quel-2024-speciale","pub_date":"2026-10-17T08:35:00.000Z","fetched_at":"2026-10-17 08:45:01","lang_orig":"it","category":null,"athletes":"Camille Cerutti","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":41053,"source_name":"Ski Racing","country":"INT","title_no":"Mina Fürst Holtmann tar VM-finaletillit med seg til Sölden","title_orig":"Mina Fürst Holtmann Brings World Cup Finals Confidence to Sölden","summary_no":"Mina Fürst Holtmann stiller med god selvtillit til Sölden etter sterke prestasjoner i verdenscupfinalen.","spik_no":"Mina Fürst Holtmann går inn i sesongåpningen i Sölden med god selvtillit etter en andreplass i storslalåm under verdenscupfinalen 2026. Det var en sterk avslutning på en sesong preget av tvil underveis, og 24-åringen håper resultatet kan gi momentum inn i den nye sesongen. Hun har tidligere vist at Sölden-rennet passer henne godt, med topp-10 i halvparten av sine starter der og en fjerdeplass som beste resultat. I bakhodet ligger også VM i 2027, som gir ekstra motivasjon for å finne tilbake til jevnhet og toppform.","url":"https://skiracing.com/mina-furst-holtmann-solden-world-cup/","pub_date":"2026-10-16T21:21:44.000Z","fetched_at":"2026-10-16 21:30:01","lang_orig":"en","category":null,"athletes":"Mina Fürst Holtmann","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":40936,"source_name":"Ski Racing","country":"INT","title_no":"Atomic Media Day 2026: Ny start og store ambisjoner i Altenmarkt","title_orig":"Atomic Media Day 2026: New Beginnings, Big Ambitions and Personal Stories in Altenmarkt","summary_no":"Atomic samlet pressen i Altenmarkt for å presentere nye mål, personlige historier og ambisjoner foran den kommende sesongen.","spik_no":"Atomic samlet utøvere, veteraner og presse i Altenmarkt for å markere overgangen til den nye sesongen 2026–27. Mirjam Puchner, Christina Ager og Daniel Danklmaier mottok hederskort som avtroppende utøvere etter karrierer med det østerrikske utstyrsmerket. Ager fortalte om livet etter racing med tennis, sykling og surfing, mens Danklmaier har gått direkte over i juniorutviklingsarbeid for Atomic. Arrangementet ga et sjeldent innblikk i flere stadier av en alpinkarriere, fra rekrutter til rekordvinnere.","url":"https://skiracing.com/atomic-media-day-2026-new-beginnings-big-ambitions-and-personal-stories-in-altenmarkt/","pub_date":"2026-10-16T17:24:03.000Z","fetched_at":"2026-10-16 21:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":40937,"source_name":"Ski Racing","country":"INT","title_no":"Anders Andersson: Bygger tillit på veien mot verdenscupen","title_orig":"Anders Andersson: Building Trust on the Road to the World Cup","summary_no":"Anders Andersson jobber målrettet med å bygge tillit og form i jakten på en plass i verdenscupen.","spik_no":"Svenske Anders Andersson arbeider som Europa Cup-trener og deler sine erfaringer med å bygge tillit og lagkultur som grunnlag for at utøvere skal ta steget opp til verdenscupen. Andersson har tidligere erfaring fra jobben med det amerikanske kvinnelandslaget og er kjent for sin rolige og metodiske tilnærming. Han understreker at roen utad ikke betyr fravær av utfordringer, men handler om å gi utøverne en stabil støttespiller i en krevende hverdag. Forholdet mellom trener og utøver, ikke bare teknisk utvikling, er kjernen i hans filosofi.","url":"https://skiracing.com/anders-andersson-building-trust-on-the-road-to-the-world-cup/","pub_date":"2026-10-16T15:43:20.000Z","fetched_at":"2026-10-16 21:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":41015,"source_name":"ORF Sport","country":"AUT","title_no":"Astner går glipp av sesongåpningen i Sölden","title_orig":"Astner fällt für Auftakt in Sölden aus","summary_no":"Nina Astner er skadet og rekker ikke sesongåpningen i alpint i Sölden.","spik_no":"Nina Astner går glipp av verdenscupåpningen i Sölden etter et treningsfall som ga henne en skade i høyre legg. Østerrikske skiforbund understreker at skaden ikke er alvorlig, og Leonie Raich tar plassen hennes i troppen. Sölden-rennet 24.–25. oktober er den tradisjonelle sesongåpningen i alpint med storslalåm for begge kjønn på Rettenbachferner-breen. Julia Scheib stiller som forsvarende vinner på damesiden, mens Ricarda Haaser gjør comeback etter et skinnbeinsbrudd.","url":"https://sport.orf.at/stories/3163679/","pub_date":"2026-10-16T15:24:08.000Z","fetched_at":"2026-10-16 21:15:04","lang_orig":"de","category":null,"athletes":"Leonie Raich,Nina Astner","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":40843,"source_name":"Neveitalia","country":"ITA","title_no":"Østerrike med Scheib, Schwarz og Brennsteiner i spissen for hjemmeåpningen i Sølden","title_orig":"Ecco le scelte austriache per le prime gare di casa: a Soelden guidano Scheib, Schwarz e Brennsteiner, debutta Eisner","summary_no":"Østerrike har tatt ut sitt lag til de første hjemmerennet i Sølden, der Scheib, Schwarz og Brennsteiner leder an, mens Eisner gjør sin debut.","spik_no":"Østerrike har tatt ut sitt lag til sesongåpningen i Sølden 24.–25. oktober, der Julia Scheib, Stefan Schwarz og Stefan Brennsteiner leder an på herresiden, mens fjorårets vinner på Rettenbachbreen – en østerriksk kvinne – spydspiss det kvinnelige laget sammen med Brunner og en returnerende Ricarda Haaser. På herresiden stikker Jakob Eisner, født 2003, seg ut som debutant i verdenscupen etter å ha vunnet den interne uttakskonkurransen. Sølden er tradisjonelt en prestisjeåpning for Østerrike, som alltid møter opp med store forventninger på hjemmebane.","url":"https://www.neveitalia.it/sport/scialpino/news/ecco-le-scelte-austriache-per-le-prime-gare-di-casa-a-soelden-guidano-scheib-schwarz-e-brennsteiner-debutta-eisner","pub_date":"2026-10-16T15:05:00.000Z","fetched_at":"2026-10-16 15:15:01","lang_orig":"it","category":null,"athletes":"Jakob Eisner,Marco Schwarz","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":40745,"source_name":"SkinEWS","country":"SUI","title_no":"Østerrike stiller med verdenscupdebutant i sesongåpningen","title_orig":"Österreich mit einem Weltcup-Debütanten beim Weltcup-Auftakt","summary_no":"Østerrike tar med en debutant til verdenscupåpningen i alpint denne sesongen.","spik_no":"Den 23 år gamle kärntnerske alpinisten Jakob Eisner får sin verdenscupdebut når Østerrike åpner sesongen på Rettenbachferner i Sölden 24.–25. oktober. Eisner sikret seg startplassen etter interne kvalifiseringer på verdenscupbakken fredag 16. oktober, sammen med Natalie Falch, Elena Riederer og Valentina Rings-Wanner. Østerrike stiller totalt med 17 utøvere i sesongåpningen, som tradisjonelt innleder verdenscupkalenderen i alpint hvert år.","url":"https://www.skinews.ch/news/2026/oesterreich-weltcup-debuetanten/","pub_date":"2026-10-16T14:52:34.000Z","fetched_at":"2026-10-16 15:00:04","lang_orig":"de","category":null,"athletes":"Jakob Eisner","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":39035,"source_name":"Neveitalia","country":"ITA","title_no":"«3Tre on Tour» starter i Verona 23. oktober: Campiglio presenterer seg med fem etapper via Roma, London, Milano og Trento","title_orig":"Il \"3Tre on Tour\" decolla da Verona il 23 ottobre: Campiglio si presenta con 5 tappe passando da Roma, Londra, Milano e Trento","summary_no":"Markedsføringsturneen «3Tre on Tour» for alpinrennet i Madonna di Campiglio sparker i gang i Verona 23. oktober og besøker fem byer, inkludert Roma, London, Milano og Trento.","spik_no":"Markedsføringsturneen «3Tre on Tour» starter i Verona 23. oktober og besøker fem byer på veien mot årets utgave av slalomrennet i Madonna di Campiglio. Rennet på Canalone Miramonti arrangeres natt til 24. desember og er i år inne i sin 73. utgave, noe som gjør det til et av de mest tradisjonsrike enkeltårsrennene i alpinkalenderen. Nattslalomen i Campiglio har de siste sesongene vært en fast favoritt blant utøverne og trekkplaster for publikum, med Henrik Kristoffersen blant dem som har vunnet her tidligere.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/il-3tre-on-tour-decolla-da-verona-il-23-ottobre-campiglio-si-presenta-con-5-tappe-passando-da-roma-londra-milano-e-trento","pub_date":"2026-10-16T10:50:00.000Z","fetched_at":"2026-10-16 11:00:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":38640,"source_name":"Neveitalia","country":"ITA","title_no":"Kilde til undersøkelser i Innsbruck – Jansrud støtter: «Håper han finner motivasjonen til å returnere»","title_orig":"Oggi gli esami a Innsbruck per Kilde, la vicinanza di Jansrud: \"Spero trovi la motivazione per tornare, ha ancora molto da dare\"","summary_no":"Aleksander Aamodt Kilde gjennomgår undersøkelser i Innsbruck. Kjetil Jansrud uttrykker støtte og håper Kilde finner motivasjonen til å returnere, og mener han fortsatt har mye å gi.","spik_no":"Aleksander Aamodt Kilde er til undersøkelser ved klinikken Hochrum i Innsbruck etter at han pådro seg en achillesseneruptur under trening i Chile. Skaden ligner slående på den Aksel Lund Svindal pådro seg for tolv år siden – Svindal kom tilbake på under fire måneder og tok VM-gull. Kjetil Jansrud har til NRK uttrykt sin støtte og håper Kilde finner motivasjonen til å returnere, og mener 32-åringen fortsatt har mye å gi. Kilde har aldri tatt et individuelt stort mesterskap-gull til tross for flere medaljer, og VM i Crans-Montana i 2027 var et uttalt mål.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/oggi-gli-esami-a-innsbruck-per-kilde-la-vicinanza-di-jansrud-spero-trovi-la-motivazione-per-tornare-ha-ancora-molto-da-dare","pub_date":"2026-10-16T09:55:00.000Z","fetched_at":"2026-10-16 10:00:01","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde,Kjetil Jansrud","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":37614,"source_name":"Neveitalia","country":"ITA","title_no":"HERO 2026/27: Rossignols racingsoul imponerer med presis kurveteknikk og intuitiv kjøreopplevelse","title_orig":"HERO 2026/27: l’anima racing Rossignol conquista con precisione in curva e comportamento intuitivo","summary_no":"Rossignols nye HERO 2026/27-ski vekker oppsikt med sin presise kurveegenskaper og intuitive kjøreopplevelse, tro mot merkets sterke racingidentitet.","spik_no":"Rossignol lanserer en fullstendig omdesignet HERO-kolleksjon for sesongen 2026/27, med ny teknologi som Predictive Sidecut og Power Tip-spatula. Merkevaren, kjent for sin sterke racingidentitet, har i årtier vært knyttet til verdenseliten – blant andre Alberto Tomba og nåværende Federica Brignone, som begge har vunnet VM- og OL-gull på Rossignol-ski. Samlingsnavnet HERO har vært en bærebjelke i merkets piste- og racingsortiment, og den nye sesongens modeller skal ifølge Rossignol gjøre kjøreopplevelsen mer intuitiv uten å gå på kompromiss med det sportslige preget.","url":"https://www.neveitalia.it/materiali/attrezzatura/news/hero-2026-27-l-anima-racing-rossignol-conquista-con-precisione-in-curva-e-comportamento-intuitivo","pub_date":"2026-10-16T07:30:34.000Z","fetched_at":"2026-10-16 07:45:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":34984,"source_name":"Neveitalia","country":"ITA","title_no":"Val di Fiemme er tilbake: Continental Cup i Predazzo 19.–20. desember","title_orig":"La Val di Fiemme torna a volare: il 19-20 dicembre va in scena la Continental Cup a Predazzo","summary_no":"Val di Fiemme er klar for Continental Cup i Predazzo den 19. og 20. desember, når alpint igjen tar over den italienske dalen.","spik_no":"Val di Fiemme arrangerer Continental Cup i hoppbakken i Predazzo 19. og 20. desember, med to konkurranser i spesialhopp for menn. Continental Cup er det nest høyeste nivået i hoppsporten etter verdenscupen, og dette er den sjette etappen i sesongen. Predazzo-anlegget, med storbakken HS141 kjent som Olimpico Large Hill, har lang tradisjon som internasjonal hoppscene og arrangerte senest OL-konkurranser i februar 2026.","url":"https://www.neveitalia.it/sport/scinordico/salto/news/la-val-di-fiemme-torna-a-volare-il-19-20-dicembre-va-in-scena-la-continental-cup-a-predazzo","pub_date":"2026-10-15T15:55:00.000Z","fetched_at":"2026-10-15 16:00:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":34642,"source_name":"Neveitalia","country":"ITA","title_no":"Italienske alpinister trener på Stelvio før fartssesongåpningen","title_orig":"Poco meno di due mesi all'opening della velocità per le donne, lo Stelvio accoglie gli allenamenti delle azzurre","summary_no":"Mindre enn to måneder gjenstår til åpningen av fartsdisiplinene for kvinner, og de italienske alpinistene gjennomfører treningssamling på Stelvio.","spik_no":"Det italienske landslaget i alpint er samlet på Stelvio-breen mellom Alto Adige og Valtellina for trening fra 19. til 23. oktober, drøyt seks uker før fartssesongåpningen for kvinner. Blant de fremmøtte er profiler som Elena Curtoni, søstrene Nicol og Nadia Delago, Roberta Melesi og Sara Thaler. Åpningsrennene i utfor og super-G er satt til Beaver Creek 11.–13. desember. Stelvio-breen er et viktig treningsanlegg for alpinister i tidlig sesong, og laget har nylig avsluttet en lengre treningssamling i Sør-Amerika.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/poco-meno-di-due-mesi-all-opening-della-velocita-per-le-donne-lo-stelvio-accoglie-gli-allenamenti-delle-azzurre","pub_date":"2026-10-15T15:10:00.000Z","fetched_at":"2026-10-15 15:15:01","lang_orig":"it","category":null,"athletes":"Federica Brignone,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":34622,"source_name":"Ski Racing","country":"INT","title_no":"Aleksander Aamodt Kilde river akillessenen i Chile","title_orig":"Aleksander Aamodt Kilde Tears Achilles Tendon in Chile","summary_no":"Aleksander Aamodt Kilde har pådratt seg et brudd på akillessenen under trening i Chile, og er ute med en alvorlig skade.","spik_no":"Aleksander Aamodt Kilde rev akillessenen under utforkjøring i Chile onsdag, og reiser nå til Innsbruck for videre undersøkelser hos sitt faste medisinske team. Skaden er et nytt alvorlig tilbakeslag for 33-åringen, som siden et dramatisk fall i Wengen-utforen i januar 2024 har kjempet seg tilbake etter skader i legg og skulder. Han returnerte til verdenscupen i november 2025, men trakk seg fra vinter-OL 2026. Det norske skiforbundet har foreløpig ikke gitt noen tidslinje for behandling eller mulig retur.","url":"https://skiracing.com/aleksander-aamodt-kilde-tears-achilles-tendon-in-chile/","pub_date":"2026-10-15T15:04:47.000Z","fetched_at":"2026-10-15 15:15:01","lang_orig":"en","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":34611,"source_name":"Sportschau","country":"GER","title_no":"Skistjernen Aleksander Aamodt Kilde alvorlig skadet igjen","title_orig":"Ski-Star Aleksander Aamodt Kilde erneut schwer verletzt","summary_no":"Norske alpinstjernen Aleksander Aamodt Kilde har på nytt pådratt seg en alvorlig skade.","spik_no":"Aleksander Aamodt Kilde har pådratt seg et achillessenebrudd under utfortrening i Chile, melder laget hans. 34-åringen reiser nå til Innsbruck for videre undersøkelser – og må igjen håndtere et alvorlig skadesjokk. Det er bare ett år siden han kom tilbake i Verdenscupen etter den dramatiske Wengen-ulykken i januar 2024, der han skadet både legg og skulder så alvorlig at han periodevis satt i rullestol. Kilde har 21 Verdenscupseire i utfor og super-G, og regnes som en av verdens beste fartsutøvere.","url":"https://www.sportschau.de/wintersport/ski-alpin/ski-star-aleksander-aamodt-kilde-erneut-schwer-verletzt,ski-alpin-kilde-100.html","pub_date":"2026-10-15T14:45:00.000Z","fetched_at":"2026-10-15 15:00:05","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":34414,"source_name":"Neveitalia","country":"ITA","title_no":"Stygt fall for Cornelia Oehlund: hjernerystelse og skader i skulder og rygg – men klar for Sölden","title_orig":"Brutta botta per Cornelia Oehlund: commozione cerebrale e colpi a spalla e schiena, ma dovrebbe farcela per Soelden","summary_no":"Cornelia Oehlund pådro seg hjernerystelse samt skader i skulder og rygg etter et stygt fall, men forventes å være klar til sesongåpningen i Sölden.","spik_no":"Cornelia Oehlund pådro seg hjernerystelse samt slag mot venstre skulder og rygg under en giant slalom-trening i Val Senales, men svensk skiforbund melder at skulderen ikke har alvorlige skader og at hun forventes klar til sesongåpningen i Sölden. Den svenske 20-åringen, født i 2005, regnes som et av de største talentene i internasjonal alpinisme og har slalom som sin sterkeste gren, men jobber aktivt med å utvikle seg i storslalåm. Hun vil gå glipp av den avsluttende treningsøkten på Rettenbach-breen, men legene anbefaler kun 48–72 timers absolutt hvile som følge av hjernerystelsen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/brutta-botta-per-cornelia-oehlund-commozione-cerebrale-e-colpi-a-spalla-e-schiena-ma-dovrebbe-farcela-per-soelden","pub_date":"2026-10-15T14:30:00.000Z","fetched_at":"2026-10-15 14:45:02","lang_orig":"it","category":null,"athletes":"Cornelia Oehlund","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":34230,"source_name":"ORF Sport","country":"AUT","title_no":"Kilde ute med achillesseneruptur","title_orig":"Norweger Kilde mit Achillessehnenriss out","summary_no":"Norske Aleksander Aamodt Kilde er ute etter å ha pådratt seg et brudd på achillessenen.","spik_no":"Aleksander Aamodt Kilde har pådratt seg achillesseneruptur under trening i La Parva i Chile og er ute av idretten på ubestemt tid. Den 34 år gamle fartsspesialisten har allerede vært gjennom en svært tøff periode etter et dramatisk fall i utforkjøringen i Wengen i januar 2024, der han pådro seg et dypt kutt i beinet og en alvorlig skuldersskade – komplikasjoner med leddinfeksjon og blodforgiftning forsinket comebacket ytterligere. Kilde vant sammenlagtcupen i 2020/21 og er en av verdens mest meritterte fartskjørere, men det nye tilbakeslaget setter karrierefortsettelsen i alvorlig tvil.","url":"https://sport.orf.at/stories/3163647/","pub_date":"2026-10-15T14:05:58.000Z","fetched_at":"2026-10-15 14:15:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":34071,"source_name":"Neveitalia","country":"ITA","title_no":"Mareritt for Kilde: Den norske mesteren rev over akillessenen i treningsfall","title_orig":"Incubo Kilde: il campione norge si è rotto il tendine d'Achille cadendo in un allenamento di discesa","summary_no":"Aleksander Aamodt Kilde pådro seg brudd på akillessenen etter et fall under utfortrening, i et alvorlig tilbakeslag for den norske alpinstjernen.","spik_no":"Aleksander Aamodt Kilde pådro seg brudd på akillessenen etter et fall under utfortrening i Chile, noe som setter hele sesongen hans i fare. Kilde er en av Norges fremste fartsspesialister og vant den samlede verdenscupen i sesongen 2019/20. Han reiste til Innsbruck for å vurdere operasjon og rehabiliteringsplan, men utsiktene for en retur i inneværende sesong er svært dystre. Det er ikke første gang Kilde rammes av alvorlig skade — han er kjent for å ta på seg stor risiko i fart.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/incubo-kilde-il-campione-norge-si-e-rotto-il-tendine-d-achille-cadendo-in-un-allenamento-di-discesa","pub_date":"2026-10-15T13:45:00.000Z","fetched_at":"2026-10-15 14:00:01","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":34002,"source_name":"ORF Sport","country":"AUT","title_no":"Skistjernen Kilde pådro seg akillessenebrudd","title_orig":"Skistar Kilde erlitt Achillessehnenriss","summary_no":"Den norske alpinstjernen Aleksander Aamodt Kilde har pådratt seg et akillessenebrudd, noe som setter hans videre sesong i fare.","spik_no":"Aleksander Aamodt Kilde har pådratt seg et akillessenebrudd etter et treningsfall i Chile, og stoppet nok en gang comebackforsøket sitt. Den norske alpinstjernen var på vei tilbake etter to sesonger ute med skader – i Wengen-utforkjøringen i januar 2024 pådro han seg et dypt kutt i beinet og en alvorlig skulder­skade, og etterpå rammet en leddbetennelse som utviklet seg til blodforgiftning. Kilde vant sammenlagtcupen i 2020/21 og regnes som en av verdens beste fartsutøvere, men har nå slitt med alvorlige skader i over to år.","url":"https://sport.orf.at/stories/3163646/","pub_date":"2026-10-15T13:36:55.000Z","fetched_at":"2026-10-15 13:45:03","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":33860,"source_name":"SkinEWS","country":"SUI","title_no":"Aleksander Aamodt Kilde uheldig med skader igjen","title_orig":"Aleksander Aamodt Kilde wieder im Verletzungspech","summary_no":"Aleksander Aamodt Kilde er nok en gang rammet av skadeproblemer.","spik_no":"Aleksander Aamodt Kilde har pådratt seg en alvorlig fotskade under utforkjøringstrening i Chile, ifølge FIS. Den 34 år gamle nordmannen skal reise til Innsbruck for videre undersøkelser. Kilde mistet hele 2023/24-sesongen etter en dramatisk skade i Kitzbühel i januar 2024, der han rev over flere leddbånd i kneet. At han nok en gang er ute av trening i sesongoppkjøringen er et tungt tilbakeslag for en av de fremste fartsutøverne i sin generasjon, med to verdenscupseirer i utfor og super-G blant merittene.","url":"https://www.skinews.ch/news/2026/aleksander-aamodt-verletzungspech/","pub_date":"2026-10-15T13:22:31.000Z","fetched_at":"2026-10-15 13:30:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":33792,"source_name":"SVT Sport","country":"SWE","title_no":"Aleksander Aamodt Kilde slet av hælsenen","title_orig":"Aleksander Aamodt Kilde slet av hälsenan","summary_no":"Aleksander Aamodt Kilde pådro seg en alvorlig skade da han slet av hælsenen.","spik_no":"Aleksander Aamodt Kilde rev av hælsenen under utfortrening i Chile onsdag, og reiser til Innsbruck for videre medisinsk behandling. Skaden er det siste i en lang rekke alvorlige tilbakeslag for nordmannen, som i januar 2024 slo seg bevisstløs i Wengens utforrenn og deretter ble rammet av sepsis — en akutt, livstruende blodforgiftning. Han rakk å gjøre comeback i verdenscupen før jul i fjor, men kom ikke i god nok form til å delta i OL. Norges Skiforbund lover oppdatering når veien videre er avklart.","url":"https://www.svt.se/sport/alpint/aleksander-aamodt-kilde-slet-av-halsenan","pub_date":"2026-10-15T13:10:24.000Z","fetched_at":"2026-10-15 13:15:05","lang_orig":"sv","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":33769,"source_name":"VG","country":"NOR","title_no":"Kilde røk akillessenen under trening","title_orig":"Kilde røk akillessenen under trening","summary_no":"","spik_no":"Aleksander Aamodt Kilde pådro seg en ny alvorlig skade da han rev av akillessenen under utfortrening i Chile. Skaden kommer etter et skademaraton som startet med et voldsomt fall i Wengen i januar 2024, der han ble bevisstløs og deretter gjennomgikk flere operasjoner — inkludert behandling for livstruende blodforgiftning. Han hadde nylig gjort comeback i verdenscupen og var klar for en ny sesong. Kilde reiser nå til Innsbruck for videre undersøkelser hos sitt faste medisinske team.","url":"https://www.vg.no/sport/i/9kM6QW/kilde-roek-akillesscenen-under-trening","pub_date":"2026-10-15T13:01:06.000Z","fetched_at":"2026-10-15 13:15:05","lang_orig":"no","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":33636,"source_name":"SkinEWS","country":"SUI","title_no":"Erfaren trener ny støttespiller for Ester Ledecká","title_orig":"Trainer-Routinier neu an der Seite von Ester Ledecka","summary_no":"En rutinert trener har sluttet seg til Ester Ledeckás støtteapparat.","spik_no":"Ester Ledecká har hentet inn en ny, erfaren trener som en del av støtteapparatet sitt foran sesongen 2026/27. Den tsjekkiske stjernen, som konkurrerer på høyeste nivå i både alpint og snowboard, har nylig byttet til skimerket HEAD og får nå også nye østerrikske trenere etter at sjefstrener Franz Gamper gikk av og Tomas Bank skiftet rolle. Ledecká er kjent for sin unike dobbeltkarriere og vant OL-gull i begge disipliner under lekene i Pyeongchang 2018.","url":"https://www.skinews.ch/news/2026/trainer-routinier-ledecka/","pub_date":"2026-10-15T12:58:29.000Z","fetched_at":"2026-10-15 13:00:05","lang_orig":"de","category":null,"athletes":"Ester Ledecka","athlete_nations":["CZE"],"also_sources":[],"norwegian":false},{"id":32431,"source_name":"ORF Sport","country":"AUT","title_no":"FIS gir grønt lys for sesongåpning","title_orig":"FIS gibt grünes Licht für Saisonauftakt","summary_no":"Det internasjonale skiforbundet FIS har godkjent sesongåpningen i alpint.","spik_no":"FIS har godkjent snøforholdene på Rettenbachbreen i Sölden og gitt grønt lys for sesongåpningen i alpint 24. og 25. oktober. Damene kjører riesentorlauf fredag, herrene lørdag — begge dager med start klokken 10.00 og 13.00. Sölden har vært fast åpningsarena for alpinverdenscupen siden tidlig 2000-tall og setter tonen for hele sesongen. Tidligere østerriksk verdenscuputøver Florian Scheiber gjør sin debut som rennleder under åpningen.","url":"https://sport.orf.at/stories/3163637/","pub_date":"2026-10-15T10:14:57.000Z","fetched_at":"2026-10-15 10:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":32289,"source_name":"SkinEWS","country":"SUI","title_no":"Tommel opp – Sölden har «bestått» FIS-snøkontrollen","title_orig":"Daumen hoch – Sölden hat die FIS-Schneekontrolle „bestanden“","summary_no":"Sölden har bestått FIS-snøkontrollen og er klar for sesongåpningen i alpint.","spik_no":"Sölden har bestått FIS-snøkontrollen og er klar for sesongåpningen i alpint 24. og 25. oktober på Rettenbachbreen. FIS-rennleder Janez Hladnik ga grønt lys etter inspeksjonen 15. oktober, og roste løypesjef Isidor Grüners arbeid til tross for at det ligger lite snø utenfor målbakken. Florian Scheiber, tidligere østerriksk verdenscupløper, leder rennet i Sölden for første gang i år. Sölden har vært fast åpningsarena for verdenscupen i alpint siden 1990-tallet og er tradisjonelt startskuddet for den internasjonale skisesongen.","url":"https://www.skinews.ch/news/2026/soelden-schneekontrolle-bestanden/","pub_date":"2026-10-15T09:45:12.000Z","fetched_at":"2026-10-15 10:00:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":32207,"source_name":"ORF Sport","country":"AUT","title_no":"Grønt lys for Sölden etter snøkontroll","title_orig":"Grünes Licht für Sölden bei Schneekontrolle","summary_no":"Sölden har fått klarsignal etter snøkontroll og er klar for gjennomføring av alpint.","spik_no":"FIS har gitt grønt lys for verdenscupåpningen i Sölden etter snøkontroll torsdag. Riesenslaломene for damer og herrer er satt til 24. og 25. oktober, og markerer som vanlig starten på den alpine verdenscupsesongen. Sölden har vært den tradisjonelle åpningsarenaen siden 2000, og er kjent for sin høytliggende Rettenbach-gletsjer som sikrer snøsikre forhold tidlig i sesongen.","url":"https://sport.orf.at/stories/3163636/","pub_date":"2026-10-15T09:34:48.000Z","fetched_at":"2026-10-15 09:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":32019,"source_name":"Sportschau","country":"GER","title_no":"Nye fartsstjerner på vei frem i DSV: Et duo skaper furore","title_orig":"Neue Speed-Sterne am DSV-Himmel: Ein Duo sorgt für Furore","summary_no":"To lovende utøvere gjør seg bemerket i det tyske alpinlandslaget og skaper stor oppmerksomhet med sine prestasjoner i fartsøvelsene.","spik_no":"To unge alpinister fra Allgäu, Felix Rösle (21) og Benno Brandis (20), peker seg ut som de store fremtidstalentene i det tyske fartslaget. Det tyske fartsteamet har vært i en overgangsfase siden veteraner som Thomas Dreßen, Josef Ferstl, Romed Baumann og Andreas Sander la opp. De to har vært bestevenner siden de var tolv år, og delte juniortitlene i 2024 da Rösle ble verdensmester i utfor og Brandis tok gull i super-G – et resultat som illustrerer hvor jevne de er.","url":"https://www.sportschau.de/regional/br/br-neue-speed-sterne-am-dsv-himmel-ein-duo-sorgt-fuer-furore-102.html","pub_date":"2026-10-15T09:05:29.000Z","fetched_at":"2026-10-15 09:15:05","lang_orig":"de","category":null,"athletes":"Josef Ferstl","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":31714,"source_name":"Neveitalia","country":"ITA","title_no":"Klarsignal for sesongåpningen: Verdenscupen starter 24.–25. oktober med storslalåm på Rettenbach","title_orig":"Luce verde per l'opening, il 24-25 ottobre lo start di Coppa del Mondo con i classicissimi giganti sul Rettenbach","summary_no":"Verdenscupen i alpint åpner 24.–25. oktober med de klassiske storslalåmrennene på Rettenbach-glacieret i Sölden.","spik_no":"Verdenscupen i alpint 2026–27 åpner 24.–25. oktober med de tradisjonsrike storslalåmrennene på Rettenbach-glacieret i Sölden i Østerrike. En snøkontroll bekreftet klarsignal etter at snøfall og fallende temperaturer la til rette for kunstsnøproduksjon av god kvalitet. Sölden har vært fast sesongåpner siden år 2000, og startlistene følger kjent format med første omgang klokken 10.00 og andre omgang klokken 13.00. Forrige sesong vant Stefan Eichberger og Marcel Odermatt på Rettenbach.","url":"https://www.neveitalia.it/sport/scialpino/news/luce-verde-per-l-opening-il-24-25-ottobre-lo-start-di-coppa-del-mondo-con-i-classicissimi-giganti-sul-rettenbach","pub_date":"2026-10-15T07:30:00.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":31694,"source_name":"Ski Racing","country":"INT","title_no":"Norges Skiforbund endrer utøvernes markedsrettigheter for hjelm","title_orig":"Norwegian Ski Federation Changes Skiers’ Helmet Marketing Rights","summary_no":"Norges Skiforbund innfører endringer i reglene for skiløpernes markedsrettigheter knyttet til hjelm.","spik_no":"Norges Skiforbund innfører fra sesongen 2026–27 nye regler som gir de beste alpinistene større kontroll over egne markedsrettigheter på hjelm. Energidrikk-giganten Red Bull, som er ny hovedsponsor for det norske alpinlandslaget, vil tilby individuelle kontrakter til utvalgte A-status-utøvere. Utøvere som ikke får Red Bull-kontrakt, kan selge hjelmplassen til egne sponsorer og beholder 60 prosent av inntektene, mens Skiforbundets alpinavdeling tar 40 prosent. Norge har lenge vært blant de få nasjonene som forbeholdt seg retten til utøvernes hjelmplass, noe som tidligere skapte konflikter med profiler som Henrik Kristoffersen.","url":"https://skiracing.com/norwegian-skiers-helmet-marketing-rights/","pub_date":"2026-10-14T19:46:25.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"en","category":null,"athletes":"Henrik Kristoffersen,Thea Louise Stjernesund","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":31715,"source_name":"Neveitalia","country":"ITA","title_no":"Mauro Pini er tilbake: Sveitseren skal trene Valérie Grenier personlig","title_orig":"Mauro Pini riparte dopo l'amara esperienza azzurra: il tecnico ticinese seguirà personalmente Valérie Grenier","summary_no":"Etter et skuffende opphold som trener for det italienske landslaget vender Mauro Pini tilbake og tar personlig ansvar for kanadiske Valérie Grenier.","spik_no":"Den erfarne sveitsiske treneren Mauro Pini er klar for en ny utfordring etter det han selv beskriver som en bitter periode som trener for det italienske herrelandslagets storslalåmutøvere, en jobb han forlot i kjølvannet av skuffende resultater under vinter-OL 2026. Nå har det kanadiske skiforbundet offisielt bekreftet at Pini skal jobbe personlig med Valérie Grenier, den allsidige 1996-modellen fra Ontario som vant den siste verdenscupen i storslalåm under sesongfinalen i Hafjell 2026. Pini er kjent for å ha trent stjerner som Petra Vlhová gjennom storparten av hennes karriere. Pierre Miniotti forblir i det kanadiske teamet, og John Kucera leder herresiden.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/mauro-pini-riparte-dopo-l-amara-esperienza-azzurra-il-tecnico-ticinese-seguira-personalmente-valerie-grenier","pub_date":"2026-10-14T17:55:00.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"it","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":31695,"source_name":"Ski Racing","country":"INT","title_no":"Breezy Johnson stiller spørsmål ved rettferdigheten i FIS' skivektregel","title_orig":"Breezy Johnson Questions Fairness of FIS Ski Weight Rule","summary_no":"Den amerikanske alpinisten Breezy Johnson kritiserer FIS-regelen om minimumsvekt på ski og mener den ikke er rettferdig.","spik_no":"Amerikanske Breezy Johnson, olympisk mester og verdensmester i utforkjøring, stiller spørsmål ved rettferdigheten i FIS' nye regel om minimumsvekt på racingski. Johnson sier at sommertrening på myk og jevn snø ikke har avslørt noen merkbar forskjell med de nye skiene, men understreker at renn på tøffe verdenscupbakker er en helt annen sak. Hun er særlig bekymret for regelens begrunnelse og mener den rammer et lite antall utøvere uforholdsmessig hardt. Johnson, som kjører på Atomic-ski for det amerikanske Stifel-laget, planlegger mer testing på Copper Mountain frem mot sesongstart.","url":"https://skiracing.com/breezy-johnson-fis-ski-weight-rule/","pub_date":"2026-10-14T17:48:11.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"en","category":"naert","athletes":"Breezy Johnson","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":31716,"source_name":"Neveitalia","country":"ITA","title_no":"Marta Bassino: Ti år etter sitt første pallplass er Rettenbach fortsatt drømmescenen","title_orig":"Marta, 10 anni dopo il primo podio è ancora il \"tuo\" Rettenbach il teatro dei sogni: \"Non mi sento totalmente pronta, ma ora va tutto bene\"","summary_no":"Marta Bassino ser tilbake på ti år siden sitt første pallplass på Rettenbach og sier at alt går bra, selv om hun ikke føler seg helt klar.","spik_no":"Italienske Marta Bassino nærmer seg sesongåpningen i Sölden med en blanding av forventning og forsiktighet, nøyaktig ett år etter at hun skadet kneet den 22. oktober 2025. Bassino har en spesiell tilknytning til Rettenbach-glacieret: det var her hun tok sitt første pallplass som 20-åring for ti år siden, og her hun vant storslalåmen i 2020. Til FIS sier hun at hun ikke føler seg helt klar, men at alt går bra, og hun avslutter forberedelsene med trening på Stelvio og Val Senales den siste uken før rennstart.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/marta-10-anni-dopo-il-primo-podio-e-ancora-il-tuo-rettenbach-il-teatro-dei-sogni-non-mi-sento-totalmente-pronta-ma-ora-va-tutto","pub_date":"2026-10-14T16:50:00.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"it","category":null,"athletes":"Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":31018,"source_name":"Neveitalia","country":"ITA","title_no":"Hirscher forbereder seg til Sölden på Pitztal-breen: comeback nær forestående","title_orig":"Hirscher prepara Soelden sul ghiacciaio di Pitztal: il \"sì\" dell'asso salisburghese all'opening è molto vicino","summary_no":"Marcel Hirscher trener på Pitztal-breen foran sesongåpningen i Sölden, og det spekuleres i at den østerrikske stjernen snart vil bekrefte sin deltakelse.","spik_no":"Marcel Hirscher trener på Pitztal-breen og er svært nær en bekreftelse på deltakelse i sesongåpningen i Sölden 25. oktober. Den 37 år gamle østerrikeren, som nå konkurrerer for Nederland, gjorde comeback i 2024/25-sesongen etter seks års pause, men ble stoppet av et korsbåndsbrudd i venstre kne i desember 2024 på Reiteralm. Hirscher er historisk sett den mest dominerende alpinisten i nyere tid med åtte sammenlagtseire på rad i verdenscupen og åtte VM-gull, og en frisk retur til pisten vil vekke enorm oppmerksomhet i alpinmiljøet.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/hirscher-prepara-soelden-sul-ghiacciaio-di-pitztal-il-si-dell-asso-salisburghese-all-opening-e-molto-vicino","pub_date":"2026-10-14T15:20:00.000Z","fetched_at":"2026-10-14 15:30:01","lang_orig":"it","category":null,"athletes":"Marcel Hirscher","athlete_nations":["NED"],"also_sources":[],"norwegian":false},{"id":30501,"source_name":"SVT Sport","country":"SWE","title_no":"Kristoffer Jakobsen vil rette opp feilene – ved å gå tilbake til røttene","title_orig":"Kristoffer Jakobsens uråkningar ska bort – genom att backa i tiden","summary_no":"Kristoffer Jakobsen jobber med å eliminere sine tekniske feil ved å gå tilbake til grunnleggende prinsipper.","spik_no":"Kristoffer Jakobsen har hatt en svært skuffende sesong og gikk ut i første omgang i sju av elleve slalomrenn i fjor. For å komme tilbake til toppform går 32-åringen tilbake til det eksakt samme utstyret han brukte da han ledet slalomcupen sammenlagt og var på sitt beste. Et nytt støvelkonsept fra skimerkevaret hans fungerte dårlig, og de svake resultatene har kostet ham mye i rankingen, slik at han neste sesong starter med høyere startnummer. Jakobsen har fire pallplasser i karrieren, den siste fra november 2024.","url":"https://www.svt.se/sport/alpint/kristoffer-jakobsens-urakningar-ska-bort-genom-att-backa-i-tiden","pub_date":"2026-10-14T14:08:51.000Z","fetched_at":"2026-10-14 14:15:04","lang_orig":"sv","category":"nerding","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":30438,"source_name":"Neveitalia","country":"ITA","title_no":"Sofia Goggia tilbake på ski på Stelvio – nå sikter hun mot Amerika","title_orig":"Prime vere curve allo Stelvio dopo oltre un mese: Sofia Goggia è tornata in pista, ora l'obiettivo è l'America","summary_no":"Etter over en måneds pause tok Sofia Goggia sine første skikkelige svinger på Stelvio. Nå er målet å reise til Amerika.","spik_no":"Sofia Goggia er tilbake på ski på Stelvio-breen etter over en måneds pause, og sikter nå mot sesongåpningen i Amerika. Den italienske utøveren, som er regjerende verdenscupvinner i super-G, ble rammet av to alvorlige virusinfeksjoner i løpet av sommeren som tvang henne til å forlate et viktig treningssamling i Ushuaia i Argentina allerede i starten av september. Goggia er kjent for sin evne til å kjempe seg tilbake etter motgang – hun har tidligere vunnet renn bare uker etter alvorlige skader. Planen er å debutere i sesongen på Killington i slutten av november.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/prime-vere-curve-allo-stelvio-dopo-oltre-un-mese-sofia-goggia-e-tornata-in-pista-ora-l-obiettivo-e-l-america","pub_date":"2026-10-14T14:00:00.000Z","fetched_at":"2026-10-14 14:15:02","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":29507,"source_name":"Neveitalia","country":"ITA","title_no":"Colmar og Ski Austria inngår samarbeid: «Bygget på felles verdier»","title_orig":"Colmar e Ski Austria, Stefano Colombo: «Una collaborazione fondata su valori condivisi»","summary_no":"Stefano Colombo fra Colmar beskriver samarbeidet med Ski Austria som et partnerskap fundert på felles verdier og mål innen alpint.","spik_no":"Det italienske sportsmerkevaren Colmar og det østerrikske skiforbundet Ski Austria har inngått et nytt samarbeidsavtale, der Colmars CEO Stefano Colombo beskriver partnerskap som bygget på felles verdier rundt tradisjon, presisjon og teknisk innovasjon. Colmar ble grunnlagt i Monza i 1923 og har vært familiedrevet siden, med en lang historie innen alpinsport og konkurranseutstyr. Samarbeidet vil ta form i en felles kolleksjon for sesongen 2026/27, beregnet på både utøvere og støtteapparat i det østerrikske landslaget, som er et av de mest meritterte i alpinhistorien.","url":"https://www.neveitalia.it/materiali/aziende/news/colmar-e-ski-austria-stefano-colombo-una-collaborazione-fondata-su-valori-condivisi","pub_date":"2026-10-14T12:06:20.000Z","fetched_at":"2026-10-14 12:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":29156,"source_name":"Neveitalia","country":"ITA","title_no":"Disse 11 italienske skiløperne er klar for Rettenbach – uten Brignone og Goggia","title_orig":"Eccole qua, le 11 azzurre per il Rettenbach: senza Brignone e Goggia, guida Della Mea e torna finalmente Bassino","summary_no":"Italia stiller med 11 utøvere til Rettenbach, anført av Della Mea, mens Bassino er tilbake. Brignone og Goggia er ikke med.","spik_no":"Italia stiller med 11 utøvere til sesongåpningen i storslalåm på Rettenbach i Sölden 24. oktober, men de to største profilene mangler: Federica Brignone og Sofia Goggia er ikke med. Brignone er regjerende verdensmester i storslalåm og vant den sammenlagte verdenscupen sist sesong, mens Goggia er en av verdens beste utforkjørere. Luca Della Mea anføres som lagets fremste navn, og Marta Bassino er tilbake etter fravær — hun har tidligere vunnet verdenscupkula i storslalåm.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/eccole-qua-le-11-azzurre-per-il-rettenbach-senza-brignone-e-goggia-guida-della-mea-e-torna-finalmente-bassino","pub_date":"2026-10-14T11:15:00.000Z","fetched_at":"2026-10-14 11:30:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":28576,"source_name":"Neveitalia","country":"ITA","title_no":"Fire nye dager på Stelvio for Ambra Pomaré – også fem Europa Cup-fartskjørere på breen","title_orig":"Altri quattro giorni allo Stelvio per Ambra Pomaré, sul ghiacciaio pure un quintetto di velocisti del team Coppa Europa","summary_no":"Ambra Pomaré fortsetter treningskjøringen på Stelvio-breen i ytterligere fire dager. Også en gruppe på fem fartskjørere fra Europa Cup-laget er på plass på isbreen.","spik_no":"Ambra Pomaré, den italienske alpinisten født i 2004, fortsetter rehabiliteringen på Stelvio-breen mellom 15. og 18. oktober etter en alvorlig skade hun pådro seg i februar – da hun styrtet som løypeåpner under olympisk prøvegigantslalom hjemme i Cortina. Treningskjøringen skjer under veiledning av coach Weiss som del av et individuelt rehabiliteringsopplegg. Samtidig er fem Europa Cup-fartskjørere – Lamp, Ruffin
