_no":"Raimund Plancker overtar som FIS-rennsjef for herrer fra 1. november, etter at Markus Waldner overraskende trakk seg like før sesongstart. Plancker, som er fra Sør-Tirol i likhet med Waldner, har fungert som assisterende rennsjef siden 2022 og er dermed godt kjent med rollen. Waldner hadde i mange år vært en sentral og kontroversiell skikkelse i alpinsirkuset, og skippertaksskiftet skjer midt i en viktig sesong med VM som høydepunkt.","url":"https://www.skinews.ch/news/2026/plancker-november-renndirektor/","pub_date":"2026-10-26T10:23:57.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67382,"source_name":"Ski Racing","country":"INT","title_no":"Didier Cuche og HEAD feirer 20 år med Supershape med limitert utgave","title_orig":"Didier Cuche and HEAD Celebrate 20 Years of Supershape With Limited-Edition Ski","summary_no":"Didier Cuche og skiproduusenten HEAD markerer 20-årsjubileet for Supershape-skien med en eksklusiv limitert utgave.","spik_no":"Didier Cuche og skiproduusenten HEAD markerer 20-årsjubileet for den ikoniske Supershape-skien med en limitert spesialutgave. Cuche, som vant fem verdenscuptitler i utfor og er en av de mest dekorerte alpinistene i sveitsisk historie, har vært tett knyttet til HEAD gjennom store deler av karrieren. Supershape ble lansert for to tiår siden og har siden blitt en av de mest gjenkjennelige og vellykkede skimodellene i alpinsporten, brukt av en rekke toppløpere.","url":"https://skiracing.com/head-supershape-limited-didier-cuche/","pub_date":"2026-10-26T09:00:00.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67383,"source_name":"Ski Racing","country":"INT","title_no":"Lucas Pinheiro Braathen: Slik endret OL-gullet hans tilnærming til alpint","title_orig":"Lucas Pinheiro Braathen: How Olympic Gold Changed His Approach to Ski Racing","summary_no":"Lucas Pinheiro Braathen forteller om hvordan OL-gullet forandret hans perspektiv og tilnærming til alpint skiløp.","spik_no":"Lucas Pinheiro Braathen forteller om hvordan OL-gullet han vant for Brasil forandret hans perspektiv på alpinsporten og motivasjonen som driver ham. Braathen, som er sønn av norske Henrik Braathen, valgte i 2023 å bytte nasjon fra Norge til Brasil og representerer nå det søramerikanske landet internasjonalt. Han er en av verdens beste i tekniske disipliner og har vunnet verdenscuprenn i slalåm og storslalåm, og OL-gullet bekreftet ham som en av generasjonens fremste alpinister.","url":"https://skiracing.com/lucas-pinheiro-braathen-olympic-gold-motivation/","pub_date":"2026-10-25T16:45:53.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":67486,"source_name":"Sportschau","country":"GER","title_no":"Braathen vant sesongåpningen i Sölden","title_orig":"Brasilianer Pinheiro Braathen gewinnt Ski-Auftakt in Sölden","summary_no":"Lucas Pinheiro Braathen fra Brasil vant riesenslalåmen som åpnet alpinski-sesongen i Sölden.","spik_no":"Lucas Pinheiro Braathen vant sesongåpningen i Sölden og slo dermed regjerende storkuleinnehaver Marco Odermatt med 0,49 sekunder, med Loic Meillard på andreplass. Den 26 år gamle brasilianeren, som er OL-mester i storslalåm, hadde på forhånd erklært at han ville utfordre Odermatt om den store krystallkulen — og fulgte opp med handling allerede i første renn. Odermatt har vunnet sammenlagtcupen fem år på rad, men Braathen endte som nummer to sammenlagt forrige sesong.","url":"https://www.sportschau.de/wintersport/ski-alpin/brasilianer-pinheiro-braathen-gewinnt-ski-auftakt-in-soelden,ski-alpin-soelden-riesenslalom-maenner-100.html","pub_date":"2026-10-25T15:06:38.000Z","fetched_at":"2026-10-27 13:42:46","lang_orig":"de","category":null,"athletes":"Loïc Meillard,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":67415,"source_name":"SkinEWS","country":"SUI","title_no":"Høydepunkter fra herrenes storslalåm i Sölden","title_orig":"Die Höhepunkte des Männer-Riesenslaloms von Sölden","summary_no":"Her er høydepunktene fra herrenes storslalåm i Sölden, som åpnet alpinverdenscupen.","spik_no":"Lucas Pinheiro Braathen vant herrenes storslalåm i Sölden foran Loic Meillard og Marco Odermatt, og sikret seg dermed sitt tredje verdenscuprenn i storslalåm på rad. For Sveits var det en sterk sesongåpning med to pallplasseringer, en oppmuntrende start med VM på hjemmebane som sesongmål. Braathen vant med startnummer 4, som har vist seg å bli en slags talisman for brasilianeren.","url":"https://www.skinews.ch/video/2026/hoehepunkte-maenner-riesenslaloms/","pub_date":"2026-10-25T14:21:24.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":"Loïc Meillard,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":67384,"source_name":"Ski Racing","country":"INT","title_no":"Sölden herrer storslalåm 2026: Pinheiro Braathen vinner, Radamus på fjerdeplass","title_orig":"Sölden Men’s GS 2026: Pinheiro Braathen Wins, Radamus Fourth","summary_no":"Lucas Pinheiro Braathen vant herrenes storslalåm i Sölden, mens amerikaneren Radamus endte på fjerdeplass.","spik_no":"Lucas Pinheiro Braathen vant herrenes storslalåm i sesongåpningen på Rettenbach-breen i Sölden, og tok dermed en sterk start på den alpine verdenscupsesongen 2025/26. Amerikaneren River Radamus imponerte med en fjerdeplass og viste at han er i utvikling som storslamlåmkjører på det høyeste nivået. Sölden er tradisjonelt første renn i alpinkalenderen og fungerer som en viktig pekepinn på hvem som er i form etter sommerens forberedelser.","url":"https://skiracing.com/solden-mens-gs-2026-pinheiro-braathen-wins-radamus-fourth/","pub_date":"2026-10-25T13:32:30.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":"Lucas Braathen,River Radamus","athlete_nations":["BRA","USA"],"also_sources":[],"norwegian":false},{"id":67482,"source_name":"franceinfo","country":"FRA","title_no":"Braathen dominerte riesenslalåmen i Sölden","title_orig":"Le Brésilien Lucas Pinheiro Braathen lamine la concurrence sur le géant de Sölden pour la reprise de la Coupe du monde de ski alpin","summary_no":"Brasilianske Lucas Pinheiro Braathen knuste konkurrentene i riesenslalåmen i Sölden og åpnet verdenscupen i alpint med en overlegen seier.","spik_no":"Brasilianeren Lucas Pinheiro Braathen dominerte storslalåmen i Sölden og åpnet dermed verdenscupsesongen med en overlegen seier foran Loic Meillard og Marco Odermatt. Braathen, som er forsvarende OL-mester i storslalåm etter Milano-Cortina 2026, vant med god margin og sendte et tydelig signal om at han er klar for å kjempe om sammenlagtseieren. Den brasiliansk-norske utøveren, som representerer Brasil etter å ha byttet nasjon fra Sveits i 2023, fortsetter å imponere i storslalåm-bakken.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/le-bresilien-lucas-pinheiro-braathen-lamine-la-concurrence-sur-le-geant-de-solden-pour-la-reprise-de-la-saison_8253163.html#xtor=RSS-3-%5Bgeneral%5D","pub_date":"2026-10-25T13:14:14.000Z","fetched_at":"2026-10-27 13:42:45","lang_orig":"fr","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":67416,"source_name":"SkinEWS","country":"SUI","title_no":"Braathen med storslalåm-hattrick fra startnummer 4","title_orig":"Lucas Pinheiro Braathen – Riesenslalom-Hattrick mit Startnummer 4","summary_no":"Lucas Pinheiro Braathen sikret seg en imponerende hattrick i storslalåm med startnummer 4 i Sölden.","spik_no":"Lucas Pinheiro Braathen vant storslalåmen i Sölden og fullførte dermed et bemerkelsesverdig hattrick: tre verdenscupseiere på rad i storslalåm, alle med startnummer 4. Det var hans fjerde verdenscupseier totalt som brasiliansk utøver — tre i storslalåm og én i slalom. Seieren i Sölden gjenskapte nesten pallen fra OL, der Braathen vant foran Odermatt og Meillard.","url":"https://www.skinews.ch/news/2026/pinheiro-riesenslalom-startnummer/","pub_date":"2026-10-25T12:49:48.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":"Loïc Meillard,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":67385,"source_name":"Ski Racing","country":"INT","title_no":"Sölden herrer storslalåm 2026: Pinheiro Braathen leder etter første omgang","title_orig":"Sölden Men’s GS 2026: Pinheiro Braathen Leads Run 1","summary_no":"Lucas Pinheiro Braathen tok ledelsen etter første omgang i herrenes storslalåm i Sölden.","spik_no":"Lucas Pinheiro Braathen satte seg øverst på listen etter første omgang i herrenes storslalåm i Sölden, og viste tidlig i rennet at han var i ekstraordinær form. Braathen er kjent for sin tekniske presisjon og angrepslyst i storslalåm, og Sölden-løypen på Rettenbach-breen stiller store krav til nettopp disse egenskapene. En ledelse etter første omgang i Sölden er et godt utgangspunkt, men andreetappen er notorisk krevende og har snudd mange renn tidligere.","url":"https://skiracing.com/solden-mens-gs-2026-pinheiro-braathen-leads-run-1/","pub_date":"2026-10-25T10:41:08.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":67495,"source_name":"Sportschau","country":"GER","title_no":"Riesenslalåm i Sölden – første omgang for menn i re-live","title_orig":"Riesenslalom in Sölden - Der erste Lauf der Männer im Re-Live","summary_no":"Se første omgang av herreriesenslalåmen i Sölden i re-live.","spik_no":"Sesongåpningen i alpint for herrer gikk som vanlig i Sölden på Rettenbachferner-breen i Østerrike, med storslalåm som første disiplin. Sölden har siden 1992 vært det tradisjonelle startskuddet for verdenscupsesongen i alpint. Kraftig vind førte til at første omgang måtte kortes ned, noe som preget forholdene for utøverne.","url":"https://www.sportschau.de/video/riesenslalom-in-soelden-der-erste-lauf-der-maenner-im-re-live,re-live-slalom-soelden-maenner-100.html","pub_date":"2026-10-25T10:23:52.000Z","fetched_at":"2026-10-27 13:42:46","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67417,"source_name":"SkinEWS","country":"SUI","title_no":"Braathen satte farten i Sölden-«spurten»","title_orig":"Lucas Pinheiro Braathen legt im „Sprint“ von Sölden vor","summary_no":"Lucas Pinheiro Braathen ledet an i det som beskrives som en «spurt» under storslalåmåpningen i Sölden.","spik_no":"Braathen ledet etter første omgang av storslalåmen i Sölden, som ble kortet ned på grunn av kraftig vind på Rettenbachferner. Den 26 år gamle brasilianeren endte forrige sesong som nummer to i sammendraget bak Odermatt og har åpent erklært at han vil utfordre Odermatt om den store krystallkulen. En sterk ledelse etter første omgang bekreftet at ambisjonene er realistiske.","url":"https://www.skinews.ch/weltcup/2026/pinheiro-braathen-soelden/","pub_date":"2026-10-25T09:49:07.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":"Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":63934,"source_name":"ORF Sport","country":"AUT","title_no":"Gritsch reddet Østerrike fra total fiasko","title_orig":"Gritsch verhindert ÖSV-Totalausfall","summary_no":"Gritsch forhindret et totalt østerriksk fiasko da hun var eneste lyspunkt for ÖSV.","spik_no":"Franziska Gritsch reddet Østerrike fra et totalt fiasko i sesongåpningen i Sölden, der hun som eneste østerrikske løper tok seg videre til andreomgang og endte på niendeplass i storslalåm. Fjorårets vinner Julia Scheib styrtet ut i første omgang, noe som understreket hvor sårbart det østerrikske laget er bak sine fremste profiler. Gritsch, som trener alene adskilt fra landslaget, forbedret seg fra 15.- til 9.-plass i andreomgangen og leverte sitt beste storslalåmresultat på lang tid – hennes beste forrige sesong var en 18.-plass.","url":"https://sport.orf.at/stories/3164003/","pub_date":"2026-10-24T21:22:54.000Z","fetched_at":"2026-10-24 21:30:04","lang_orig":"de","category":null,"athletes":"Franziska Gritsch,Julia Scheib","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":63948,"source_name":"SVT Sport","country":"SWE","title_no":"Kaos rundt Moa Lundgren etter comeback på A-landslaget","title_orig":"Moa Lundgrens kaos efter återkomsten i A-landslaget","summary_no":"Moa Lundgren opplevde kaotiske tilstander etter sin retur til det svenske alpinlandslaget.","spik_no":"Moa Lundgren er tilbake på det svenske alpinlandslaget etter fem år utenfor, men comebacket har vært preget av kaos etter gjentatte sykdomsperioder med covidliknende luftveisplager. Den 28 år gamle sprintspesialisten måtte avbryte eller miste alle treningssamlinger i løpet av forsommeren og høsten – i Riksgränsen, Torsby og norske Meråker – og var syk i over fire sammenhengende uker. Lundgren forteller at hun siden covid har hatt rundt 40 sykedager per år, og til tross for fem topp ti-plasseringer i verdenscupen forrige sesong ble hun ikke tatt ut til OL-troppen.","url":"https://www.svt.se/sport/langdskidor/moa-lundgrens-kaos-efter-aterkomsten-i-a-landslaget","pub_date":"2026-10-24T21:18:18.000Z","fetched_at":"2026-10-24 21:30:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":63582,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrike skiller lag med trener Helm","title_orig":"Austria trennt sich von Trainer Helm","summary_no":"Østerrike har avsluttet samarbeidet med trener Helm.","spik_no":"Dette er ikke en alpinsak, men en fotballsak: Austria Wien i østerriksk Bundesliga har sparket treneren Stephan Helm etter en svak sesongstart. Helm, 43 år, hadde vært sjeftrener siden juli 2024 og fikk kontrakten forlenget så sent som i vår, men etter ti kamper med bare to seire og syv poeng står laget nest sist. Erstatteren blir Maximilian Uhlig, 33, som tidligere ledet reservelaget Young Violets.","url":"https://sport.orf.at/stories/3164020/","pub_date":"2026-10-24T20:39:43.000Z","fetched_at":"2026-10-24 20:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":63462,"source_name":"VG","country":"NOR","title_no":"Usikkerhet før alpinstarten: – Forventer at de finner ut av det","title_orig":"Usikkerhet før alpinstarten: – Forventer at de finner ut av det","summary_no":"","spik_no":"Bare to uker før sesongåpningen i Sölden kunngjorde Markus Waldner at han trekker seg som renndirektør for herrene etter tolv år i stillingen. Italieneren har vært en av alpinsportens mest innflytelsesrike skikkelser, med ansvar for konkurranseavvikling, sikkerhet og løypeforhold. Inntil en permanent erstatter er på plass, skal kvinnenes renndirektør lede begge sirklene – en løsning Atle Lie McGrath beskriver som kaotisk, særlig når kvinner og menn konkurrerer på ulike steder samtidig.","url":"https://www.vg.no/sport/i/oKg3JR/usikkerhet-foer-alpinstarten-forventer-at-de-finner-ut-av-det","pub_date":"2026-10-24T19:54:11.000Z","fetched_at":"2026-10-24 20:30:04","lang_orig":"no","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":63399,"source_name":"Ski Racing","country":"INT","title_no":"Sölden storslalåm menn 2026: Startliste, resultater og TV-tider","title_orig":"Sölden Men’s GS 2026: Start List, Rankings, Times & How to Watch","summary_no":"Her er alt du trenger å vite om herrenes storslalåm i Sölden, inkludert startliste, tider og hvor du kan se rennet.","spik_no":"Herrenes storslalåm i Sölden åpner verdenscupsesongen 2026/27 søndag med 69 utøvere fra 24 nasjoner på Rettenbachbreen. Atle Lie McGrath starter med startnummer 1, mens Lucas Pinheiro Braathen – regjerende OL-mester og verdenscupvinner i GS – starter som nummer 4. Braathen gikk ut i første omgang i Sölden i fjor, men avsluttet sesongen med titler i både OL og verdenscupen i disiplinen.","url":"https://skiracing.com/solden-mens-gs-2026-start-list-times-how-to-watch/","pub_date":"2026-10-24T18:54:32.000Z","fetched_at":"2026-10-24 20:30:01","lang_orig":"en","category":null,"athletes":"Atle Lie McGrath,Lucas Braathen","athlete_nations":["BRA","NOR"],"also_sources":[],"norwegian":true},{"id":63435,"source_name":"SkinEWS","country":"SUI","title_no":"Odermatt stiller i sitt 200. verdenscuprenn søndag","title_orig":"Am Sonntag bestreitet Marco Odermatt sein 200. Weltcup-Rennen","summary_no":"Marco Odermatt når en stor milepæl når han søndag stiller til start i sitt 200. verdenscuprenn.","spik_no":"Marco Odermatt stiller søndag til start i sitt 200. verdenscuprenn når storslalåmen i Sölden åpner sesongen 2026/27. Sveitseren fra Nidwalden er 29 år og jakter sin 55. verdenscupseier i jubileumsrennet. Odermatt er forsvarende vinner i Sölden og nummer to på GS-verdenscuplisten, bare slått av Lucas Pinheiro Braathen som tok OL-gull og verdenscuptittelen i storslalåm forrige sesong.","url":"https://www.skinews.ch/news/2026/sonntag-bestreitet-odermatt/","pub_date":"2026-10-24T18:07:28.000Z","fetched_at":"2026-10-24 20:30:04","lang_orig":"de","category":null,"athletes":"Marco Odermatt","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":63419,"source_name":"Neveitalia","country":"ITA","title_no":"Startliste storslalåm menn Sölden: Odermatt med startnummer 6, Steen Olsen melder forfall","title_orig":"La startlist del gigante maschile per l'opening: Odermatt con il 6 dopo McGrath e Pinheiro Braathen, Vinatzer n° 11. Steen Olsen rinuncia","summary_no":"Odermatt starter med nummer 6 etter McGrath og Pinheiro Braathen, mens Vinatzer er nummer 11. Steen Olsen har trukket seg fra rennet.","spik_no":"Startlisten til herrenes storslalåm i Sölden er klar med Atle Lie McGrath på nummer 1, Lucas Pinheiro Braathen på 4 og forsvarende vinner Marco Odermatt på 6. Henrik Steen Olsen har trukket seg fra rennet. Vindforholdene på Rettenbachbreen er usikre, og arrangørene følger værsituasjonen nøye før start.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/la-startlist-del-gigante-maschile-per-l-opening-odermatt-con-il-6-dopo-mcgrath-e-pinheiro-braathen-vinatzer-n-11-steen-olsen-ri","pub_date":"2026-10-24T17:50:00.000Z","fetched_at":"2026-10-24 20:30:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Alexander Steen Olsen,Atle Lie McGrath,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","ITA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":63400,"source_name":"Ski Racing","country":"INT","title_no":"Valérie Grenier operert etter Sölden-skade: ACL og menisk","title_orig":"Valérie Grenier Undergoes ACL Reconstruction and Meniscus Repair After Sölden Injury","summary_no":"Kanadiske Valérie Grenier har gjennomgått operasjon for korsbåndskade og meniskskade etter å ha blitt skadet i Sölden.","spik_no":"Kanadiske Valérie Grenier har gjennomgått vellykket ACL-rekonstruksjon og meniskoperasjon etter å ha skadet kneet under trening på Rettenbachbreen i Sölden. Grenier bekrefter på Instagram at inngrepet gikk «super smooth» og takker kirurg Dr. Simard og teamet ved CEOM. Dette er ikke første gang Grenier opererer ACL, noe som gjør rehabiliteringen ekstra krevende – hun må nå forberede seg på en lang pause fra verdenscupen.","url":"https://skiracing.com/valerie-grenier-undergoes-acl-reconstruction-and-meniscus-repair-after-solden-injury/","pub_date":"2026-10-24T17:41:40.000Z","fetched_at":"2026-10-24 20:30:01","lang_orig":"en","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":63420,"source_name":"Neveitalia","country":"ITA","title_no":"Zenere nær topp 15 i Killington – verdenscupkampen kompliseres for Bassino og Brignone","title_orig":"Zenere a ridosso delle 15 per Killington, per Bassino (e Brignone) la WCSL si complica: le classifiche di CdM dopo Soelden","summary_no":"Etter Sölden er Zenere tett på topp 15 foran Killington, mens situasjonen i verdenscupsammenlagningen ser vanskeligere ut for både Bassino og Brignone.","spik_no":"Etter sesongåpningen i Sölden, der Paula Moltzan vant og leder verdenscupen totalt med 100 poeng, er den italienske håpefulle Asja Zenere på 5. plass og tett på topp 15 foran Killington. Situasjonen er derimot vanskeligere for de italienske stjernene Marta Bassino og Federica Brignone – Bassino er utenfor topp 30 i GS-cupen, Brignone utenfor topp 20. Mikaela Shiffrin er foreløpig 7. totalt, men er ikke påmeldt slalomene i Levi og Gurgl.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/zenere-a-ridosso-delle-15-per-killington-per-bassino-e-brignone-la-wcsl-si-complica-le-classifiche-di-cdm-dopo-soelden","pub_date":"2026-10-24T17:10:00.000Z","fetched_at":"2026-10-24 20:30:01","lang_orig":"it","category":null,"athletes":"Federica Brignone,Marta Bassino,Paula Moltzan","athlete_nations":["ITA","USA"],"also_sources":[],"norwegian":false},{"id":63301,"source_name":"Neveitalia","country":"ITA","title_no":"Sju italienske utøvere åpner sesongen – Vinatzer og Franzoni med store ambisjoner","title_orig":"Sette azzurri per aprire la stagione, Vinatzer ci prova: \"Un nuovo percorso con lo staff\". Franzoni: \"Spero di diventare un gigantista\"","summary_no":"Sju italienske alpinister er klare for sesongstart. Vinatzer satser med nytt støtteapparat, mens Franzoni håper å utvikle seg til storslalømkjører.","spik_no":"Sju italienske alpinister stiller til sesongstart i storslalåm i Sölden søndag, med Alex Vinatzer som eneste italiener blant de 15 beste på startlisten. Vinatzer, 27 år og fra Gröden, er inne i et nytt samarbeid med støtteapparatet etter at trener Mauro Pini trakk seg følge et skuffende OL. Giovanni Franzoni, som starter med startnummer 31, har ambisjoner om å etablere seg som storslalåmkjører på høyeste nivå. Luca De Aliprandini må nøye seg med startnummer 44, noe som gjør oppgaven betydelig vanskeligere på den tekniske Rettenbach-glaciéren.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/sette-azzurri-per-aprire-la-stagione-vinatzer-ci-prova-un-nuovo-percorso-con-lo-staff-franzoni-spero-di-diventare-un-gigantista","pub_date":"2026-10-24T16:40:00.000Z","fetched_at":"2026-10-24 16:45:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Giovanni Franzoni","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":62473,"source_name":"Neveitalia","country":"ITA","title_no":"Colturi nær drømmeresultatet: – Forventet det ikke. Aicher strålende i åpningen","title_orig":"Una Colturi stratosferica ad un passo dal sogno: \"Non me l'aspettavo, nella 2^ ho sciato libera\". Aicher comincia alla grandissima","summary_no":"En formidabel Colturi var nær en sensasjon og uttrykte overraskelse over egen prestasjon, mens Aicher innledet konkurransen på strålende vis.","spik_no":"Lara Colturi var bare ett hundredels sekund unna seier i storslalåmåpningen i Sölden, noe som ville ha gitt Albania sin første noensinne verdenscupseier. Den 19 år gamle Colturi, som konkurrerer for Albania til tross for italiensk bakgrunn, har vokst fram som en av de store talentene i alpinsporten og har allerede flere toppplasseringer på CV-en. Tyske Aicher imponerte med en sterk åpning av konkurransen, mens Paula Moltzan vant rennet og sikret sin første verdenscupseier etter ti tidligere podieplasseringer.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/una-colturi-stratosferica-ad-un-passo-dal-sogno-non-me-l-aspettavo-nella-2-ho-sciato-libera-aicher-comincia-alla-grandissima","pub_date":"2026-10-24T14:50:00.000Z","fetched_at":"2026-10-24 15:00:03","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER"],"also_sources":[],"norwegian":false},{"id":62392,"source_name":"VG","country":"NOR","title_no":"Lovpriser svigerdatter Shiffrin: - Fantastisk skikjører, enda bedre menneske","title_orig":"Lovpriser svigerdatter Shiffrin: - Fantastisk skikjører, enda bedre menneske","summary_no":"","spik_no":"Mikaela Shiffrins svigermor har gått ut med store lovord om den amerikanske stjernen, og beskriver henne som en fantastisk skikjører og enda bedre menneske. Shiffrin har vært sammen med norske Aleksander Aamodt Kilde siden 2021, og paret er forlovet. Shiffrin er historiens mest meritterte alpinist med over 97 verdenscupseiere, men har også måttet håndtere store personlige påkjenninger – blant annet Kildes alvorlige styrt i Wengen i januar 2024.","url":"https://www.vg.no/sport/i/zlB2Xb/lovpriser-svigerdatter-shiffrin-fantastisk-skikjoerer-enda-bedre-menneske","pub_date":"2026-10-24T14:39:40.000Z","fetched_at":"2026-10-24 14:45:05","lang_orig":"no","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":62276,"source_name":"VG","country":"NOR","title_no":"Forloveden om Kildes nye skademareritt: ­ – Hjerteskjærende","title_orig":"Forloveden om Kildes nye skademareritt: ­ – Hjerteskjærende","summary_no":"","spik_no":"Aleksander Aamodt Kilde pådro seg en akilleskadeskade under utfortrening i Chile 14. oktober, noe som setter en brutal stopper for comebacket hans. Kilde har allerede vært ute med alvorlig kneskade siden januar 2024, og har dermed mistet nesten to hele sesonger. Forloveden Mikaela Shiffrin, som åpnet verdenscupsesongen med en syvendeplass i Sölden, reiste til Chile for å være med ham og beskriver tilbakeslaget som hjerteskjærende – men sier hennes første reaksjon var lettelse over at skaden ikke var livstruende.","url":"https://www.vg.no/sport/i/9kJQxq/shiffrin-om-aleksander-aamodt-kildes-nye-skade-hjerteskjaerende","pub_date":"2026-10-24T14:17:49.000Z","fe orslalåm i Sölden.","spik_no":"Sölden markerte åpningen av alpinverdenscupsesongen 2026/27 med storslalåm for kvinner på den ikoniske Rettenbach-breen. Sölden har vært fast åpningsarena for verdenscupen siden 2000-tallet og gir ryttere og lag en første pekepinn på formen før den lange sesongen. Rennet samler verdens beste alpinister og er alltid tett fulgt av fansen som hungrer etter alpint etter en lang sommerpause.","url":"https://www.sportschau.de/wintersport/ski-alpin/riesenslalom-der-frauen-in-soelden-die-zusammenfassung,video-zusammenfassung-riesenslalom-soelden-100.html","pub_date":"2026-10-24T13:57:05.000Z","fetched_at":"2026-10-24 14:15:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":61998,"source_name":"Neveitalia","country":"ITA","title_no":"Asja fortsetter å vokse: «Tenk at jeg har jobbet mer med fart og ikke føler meg i form»","title_orig":"Asja, la crescita continua: \"Pensare che ho lavorato più sulla velocità e non mi sento in forma\". Zenere, che opening!","summary_no":"Asja imponerer med en sterk åpning av sesongen, til tross for at hun selv ikke føler seg i toppform etter fokus på fartsdisipliner.","spik_no":"Asja Zenere imponerte med en femteplass i sesongåpningen i storslalåm i Sölden, bare 0,2 sekunder fra pallen – og dette til tross for at hun selv ikke føler seg i toppform etter økt fokus på fartsdisiplinene i oppkjøringen. Den italienske alpinisten fra Vicenza har kjempet seg tilbake gjennom flere alvorlige skader, deriblant et korsbåndbrudd. Med 2.-beste tid i den avgjørende andreomlopen klatret hun fra 16.-plass til 5.-plass totalt, og viser at hun er i sterk utvikling.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/asja-la-crescita-continua-pensare-che-ho-lavorato-piu-sulla-velocita-e-non-mi-sento-in-forma-zenere-che-opening","pub_date":"2026-10-24T13:50:00.000Z","fetched_at":"2026-10-24 14:00:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":61896,"source_name":"SkinEWS","country":"SUI","title_no":"Høydepunkter fra FIS' «Race-Talk» i Sölden","title_orig":"Highlights aus dem „Race-Talk“ der FIS in Sölden","summary_no":"Her er høydepunktene fra FIS' Race-Talk i Sölden.","spik_no":"FIS arrangerte sin tradisjonelle «Race-Talk» i Sölden i forbindelse med åpningsrennet i alpint verdenscup 2026/27-sesongen. Sölden på Rettenbach-breen i Østerrike har vært fast åpningsarena for verdenscupen siden 1990-tallet, og samler hvert år de beste alpinistene i verden til giant slalom for både kvinner og menn. Race-Talk er FIS' egne pressemøter der trenere, utøvere og funksjonærer diskuterer aktuelle temaer før sesongstart.","url":"https://www.skinews.ch/video/2026/highlights-race-soelden/","pub_date":"2026-10-24T13:34:36.000Z","fetched_at":"2026-10-24 13:45:03","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":61743,"source_name":"Ski Racing","country":"INT","title_no":"Moltzan tok sin første verdenscupseier i Sølden","title_orig":"Moltzan Claims First World Cup Victory in Sölden Podium Shake-Up","summary_no":"Paula Moltzan sikret seg sin aller første verdenscupseier i Sølden i et overraskende oppgjør om pallplassene.","spik_no":"Paula Moltzan vant sin første verdenscupseier noensinne i sesongåpningen i Sølden, og avsluttet en lang venting med ti pallplasseringer bak seg. Den 32 år gamle amerikaneren fra Minnesota er kjent som en teknisk sterk slalåm- og storslalåmkjører som lenge har vært i verdenstoppen uten å ta steget opp til topps. Seieren kom i et overraskende oppgjør om pallplassene, og markerer en milepæl i karrieren til en av de mest erfarne utøverne på kvinnenes verdenscupsirkus.","url":"https://skiracing.com/moltzan-claims-first-world-cup-victory-in-solden-podium-shake-up/","pub_date":"2026-10-24T13:26:32.000Z","fetched_at":"2026-10-24 13:30:01","lang_orig":"en","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":61763,"source_name":"Neveitalia","country":"ITA","title_no":"Moltzan skriver historie i Sølden sammen med Van Deer","title_orig":"Moltzan fa la storia a Soelden assieme a Van Deer, vincente al debutto nel circo rosa: \"Non vedo l'ora di festeggiare con il team\"","summary_no":"Paula Moltzan satte seg selv i historiebøkene i Sølden sammen med Van Deer, som vant i sin debut på verdenscupsirkuset. – Jeg gleder meg til å feire med laget, sa Moltzan.","spik_no":"Paula Moltzan skrev alpinhistorie i Sølden da hun tok sin aller første verdenscupseier i kjempeslalåm på Rettenbach-breen, 32 år gammel og etter hele ti pallplasseringer uten seier. Moltzan er den første og hittil eneste kvinnen som kjører på utstyr utviklet av Marcel Hirscher og hans nederlandske merke Van Deer, som dermed vant på sin absolutte debut i verdenscupen. Seieren ble ekstra dramatisk da Lara Colturi – som kjører for Albania – endte bare ett hundredels sekund bak på andreplass, mens Mikaela Shiffrin nøyde seg med sjuendeplass. – Jeg gleder meg til å feire med laget, sa Moltzan etter løpet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/moltzan-fa-la-storia-a-soelden-assieme-a-van-deer-vincente-al-debutto-nel-circo-rosa-non-vedo-l-ora-di-festeggiare-con-il-team","pub_date":"2026-10-24T13:20:00.000Z","fetched_at":"2026-10-24 13:30:02","lang_orig":"it","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":61730,"source_name":"Sportschau","country":"GER","title_no":"Alpint: Emma Aicher på pallen i Verdenscup-åpningen","title_orig":"Ski Alpin: Emma Aicher rast beim Weltcup-Auftakt auf das Podest","summary_no":"Emma Aicher leverte en sterk prestasjon og sikret seg en pallplass ved åpningen av alpint-verdenscupen.","spik_no":"Den 22 år gamle tyske alpinisten Emma Aicher sikret seg tredjeplass i storslalåmåpningen i Sölden, og satte dermed karrierebeste i denne disiplinen. Seieren gikk til amerikanske Paula Moltzan, mens Lara Colturi — som kjører for Albania — tok andreplassen. Aicher var bare niende etter første omgang, noe som gjør andreetappen imponerende. Storslalåm regnes som hennes svakeste gren, og hennes tidligere beste resultat der var en fjerdeplass i Åre i mars — så prestasjonen i Sölden er et tydelig tegn på at hun er i utvikling mot toppen av verdenscupen.","url":"https://www.sportschau.de/wintersport/ski-alpin/aicher-rast-beim-weltcup-auftakt-auf-podest,ski-alpin-soelden-riesenslalom-100.html","pub_date":"2026-10-24T13:05:35.000Z","fetched_at":"2026-10-24 13:15:05","lang_orig":"de","category":null,"athletes":"Emma Aicher,Paula Moltzan","athlete_nations":["GER","USA"],"also_sources":[],"norwegian":false},{"id":61610,"source_name":"franceinfo","country":"FRA","title_no":"Paula Moltzan åpner sesongen med sin første karriereseier i storslalåmen i Sölden","title_orig":"Paula Moltzan lance la saison avec sa première victoire en carrière sur le géant de Sölden","summary_no":"Paula Moltzan sikret sin første seier i verdenscupen da hun vant storslalåmen i Sölden ved sesongåpningen.","spik_no":"Paula Moltzan tok sin aller første verdenscupseier da hun vant storslalåmen i Sölden 24. oktober 2026, sesongåpningen i alpint. Amerikaneren på 32 år slo landskvinninnen Mikaela Shiffrin, som ledet etter første omgang, men falt tilbake til syvendeplass i annen omgang. Moltzan vant foran Lara Colturi (Albania) og Emma Aicher (Tyskland) med kun en hundredel til gode over Colturi – en drømmeavslutning for en utøver som har jaktet gjennombruddet gjennom hele karrieren.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/paula-moltzan-lance-la-saison-avec-sa-premiere-victoire-en-carriere-sur-le-geant-de-solden_8252242.html#xtor=RSS-3-%5Bgeneral%5D","pub_date":"2026-10-24T12:55:10.000Z","fetched_at":"2026-10-24 13:00:05","lang_orig":"fr","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":61542,"source_name":"Neveitalia","country":"ITA","title_no":"Moltzan vinner i Sölden på hundredelen – video av 2. omgang i storslalåm","title_orig":"A Soelden, per un centesimo, Paula Moltzan conquista la sua prima gara, il video della 2ª manche in gigante","summary_no":"Paula Moltzan sikret sin første verdenscupseier i Sölden med kun hundredels margin, og video fra 2. omgang er tilgjengelig.","spik_no":"Paula Moltzan vant sesongåpningens storslalåm i Sölden med kun én hundredels margin foran Lara Colturi – en av de knappeste seirene man kan oppleve i alpint. For 32 år gamle Moltzan kom seieren etter en lang rekke forsøk og podiumplasseringer uten å gå helt til topps. Mikaela Shiffrin, som var raskest i første omgang, kjørte forsiktig i andre og endte på syvendeplass, noe som åpnet for Moltzans gjennombrudd.","url":"https://www.neveitalia.it/sport/scialpino/femminile/video/a-soelden-per-un-centesimo-paula-moltzan-conquista-la-sua-prima-gara-il-video-della-2-manche-in-gigante","pub_date":"2026-10-24T12:48:48.000Z","fetched_at":"2026-10-24 13:00:02","lang_orig":"it","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":61621,"source_name":"Sportschau","country":"GER","title_no":"Andre omgang i storslalåm","title_orig":"Der zweite Lauf im Riesenslalom","summary_no":"Andre omgang i storslalåmrennet er i fokus.","spik_no":"Andre omgang i sesongåpningens storslalåm i Sölden ble avgjørende for det endelige resultatet. Amerikaneren Paula Moltzan klatret fra femteplass etter første omgang og tok seieren, mens tyske Emma Aicher kjørte seg opp til en tredjeplass. Sölden på Rettenbach-breen i Østerrike er det tradisjonelle startpunktet for verdenscupsesongen og har vært det siden 1990-tallet.","url":"https://www.sportschau.de/wintersport/ski-alpin/der-zweite-lauf-im-riesenslalom-in-der-wintersaison-2026-27,riesenslalom-frauen-soelden-2-100.html","pub_date":"2026-10-24T12:47:13.000Z","fetched_at":"2026-10-24 13:00:06","lang_orig":"de","category":null,"athletes":"Emma Aicher,Paula Moltzan","athlete_nations":["GER","USA"],"also_sources":[],"norwegian":false},{"id":61577,"source_name":"ORF Sport","country":"AUT","title_no":"Moltzan feirer premiereseier i Sölden","title_orig":"Moltzan feiert in Sölden Premierensieg","summary_no":"Paula Moltzan tok sin første verdenscupseier da hun triumferte i storslalåmen i Sölden.","spik_no":"Paula Moltzan tok sin første verdenscupseier i storslalåmen i Sölden 24. oktober 2026, 32 år gammel og i sitt 149. individuelle verdenscuprenn. Amerikaneren klatret fra femteplass til seier i andre omgang og vant med én hundredel foran Lara Colturi, som representerer Albania. Emma Aicher tok en sterk tredjeplass for Tyskland, mens østerrikske Franziska Gritsch var beste hjemmeløper på niendeplass. Mikaela Shiffrin, som ledet etter første omgang, endte på syvendeplass etter en forsiktig annen kjøring.","url":"https://sport.orf.at/stories/3163991/","pub_date":"2026-10-24T12:46:16.000Z","fetched_at":"2026-10-24 13:00:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Julia Scheib,Lara Colturi,Paula Moltzan","athlete_nations":["ALB","AUT","GER","USA"],"also_sources":[],"norwegian":false},{"id":61432,"source_name":"SkinEWS","country":"SUI","title_no":"Paula Moltzan sikrer første seier – for seg selv og VanDeer","title_orig":"Paula Moltzan beschert VanDeer und sich den ersten Sieg","summary_no":"Paula Moltzan tok sin første verdenscupseier og ga samtidig utstyrsleverandøren VanDeer sin første triumf i alpint.","spik_no":"Paula Moltzan tok sin første verdenscupseier i storslalom i Sölden, i sitt 149. verdenscuprenn. 32-åringen fra USA hadde stått på pallen fem ganger tidligere i storslalom uten å vinne, men i sesongåpningen 2026/27 gikk det endelig veien. Seieren var også historisk for utstyrsleverandøren VanDeer, som fikk sin første triumf i verdenscupen på damesiden. Moltzan har vært en stabil bidragsyter på det amerikanske alpinlandslaget i en årrekke, men regnes likevel som en overraskende vinner i Sölden.","url":"https://www.skinews.ch/news/2026/moltzan-beschert-vandeer/","pub_date":"2026-10-24T12:31:26.000Z","fetched_at":"2026-10-24 12:45:04","lang_orig":"de","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":61476,"source_name":"SVT Sport","country":"SWE","title_no":"Regjerende mester Julia Scheib krasjet ut i premiären","title_orig":"Regerande mästaren Julia Scheib kraschade direkt i premiären","summary_no":"Julia Scheib, som er regjerende mester, røk ut allerede i åpningsrennet og fikk en skuffende sesongstart.","spik_no":"Regjerende storslalommester Julia Scheib røk ut i første omgang av sesongåpningen i Sölden, på hjemmebane i Østerrike. 28-åringen hadde en formidabel sesong i fjor, med fem verdenscupseirer i storslalom – inkludert premiéren nettopp i Sölden – og sammenlagtseier i storslalomcupen. Krasjen kom halvveis ned bakken og så voldsom ut, men Scheib gikk selv gjennom målområdet og smilte i etterkant. Rennet ble vunnet av amerikanske Paula Moltzan.","url":"https://www.svt.se/sport/alpint/regerande-mastaren-julia-scheib-kraschade-direkt-i-premiaren","pub_date":"2026-10-24T12:29:02.000Z","fetched_at":"2026-10-24 12:45:04","lang_orig":"sv","category":null,"athletes":"Julia Scheib","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":61349,"source_name":"ORF Sport","country":"AUT","title_no":"Amerikanske Moltzan vinner storslalåm i Sölden","title_orig":"US-Amerikanerin Moltzan gewinnt Sölden-RTL","summary_no":"Paula Moltzan fra USA tok seieren i verdenscupåpningens storslalåm i Sölden.","spik_no":"Paula Moltzan fra USA vant overraskende sesongåpningens storslalåm i Sölden lørdag – hennes første seier i verdenscupen. 32-åringen klatret fra femteplass etter første omgang og slo Lara Colturi (Albania) og Emma Aicher (Tyskland) med bare ett hundredels sekund. For Østerrike ble det en skuffelse: titelforsvarer Julia Scheib styrtet i første omgang, og eneste østerrikske finalist Franziska Gritsch endte på tiendeplass.","url":"https://sport.orf.at/stories/3164000/","pub_date":"2026-10-24T12:28:14.000Z","fetched_at":"2026-10-24 12:30:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Lara Colturi,Paula Moltzan","athlete_nations":["ALB","GER","USA"],"also_sources":[],"norwegian":false},{"id":61304,"source_name":"Neveitalia","country":"ITA","title_no":"Moltzan vinner første storslalåm med ett hundredels sekunds margin over Colturi – Zenere femte","title_orig":"Che ribaltone sul Rettenbach, il primo gigante di coppa è di Moltzan per un centesimo su Colturi! Una gran Zenere è quinta","summary_no":"Det ble en dramatisk snuoperasjon på Rettenbach-breen, der Paula Moltzan vant sesongåpningens storslalåm med ett hundredels sekund foran Colturi. Zenere imponerte med en femteplass.","spik_no":"Paula Moltzan sikret sitt første verdenscupseier i sesongåpningens storslalåm på Rettenbach-breen i Sölden, kun ett hundredels sekund foran Lara Colturi fra Albania. Den 32 år gamle amerikaneren, kjent som en solid slalåmkjører, vant med nytt utstyr etter samarbeid med Van Deer. Italienske Federica Zenere imponerte med en femteplass, mens storstjernen Mikaela Shiffrin endte på syvende plass etter et skiftende vær under rennet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/che-ribaltone-sul-rettenbach-il-primo-gigante-di-coppa-e-di-moltzan-per-un-centesimo-su-colturi-una-gran-zenere-e-quinta","pub_date":"2026-10-24T12:25:00.000Z","fetched_at":"2026-10-24 12:30:01","lang_orig":"it","category":null,"athletes":"Lara Colturi,Mikaela Shiffrin,Paula Moltzan","athlete_nations":["ALB","USA"],"also_sources":[],"norwegian":false},{"id":60855,"source_name":"Neveitalia","country":"ITA","title_no":"Valérie Grenier operert på høyre kne i Montréal – korsbånd og menisk skadet","title_orig":"Per Valérie Grenier è tutto svanito: operata a Montréal al ginocchio destro, lesionati crociato e menisco","summary_no":"Canadiske Valérie Grenier har gjennomgått en operasjon på høyre kne i Montréal etter å ha pådratt seg skader på både korsbåndet og menisken.","spik_no":"Canadiske Valérie Grenier er operert på høyre kne i Montréal etter å ha skadet både korsbåndet og menisken under trening på Rettenbach-glacieret i Sölden – samme sted der sesongen skulle ha åpnet. Skaden betyr at sesongen 2026/27 er over før den i det hele tatt begynte, med en forventet rehabiliteringsperiode på minimum seks til syv måneder. Det er et særlig bittert tilbakeslag for Grenier, som nettopp hadde vendt tilbake til seierspallen med seier i storslalåm under finalehelgen i 2026. Den allsidige 28-åringen hadde nylig også fått inn den erfarne treneren Mauro Pini – kjent for arbeidet med Tina Maze og Petra Vlhová – i støtteapparatet sitt.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/per-valerie-grenier-e-tutto-svanito-operata-a-montreal-al-ginocchio-destro-lesionati-crociato-e-menisco","pub_date":"2026-10-24T11:25:00.000Z","fetched_at":"2026-10-24 11:30:02","lang_orig":"it","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":60629,"source_name":"Neveitalia","country":"ITA","title_no":"Della Mea første italiener i startgropa i 2. omgang, deretter Pazzaglia og Zenere: ny start kl. 13.30 på Rettenbach","title_orig":"Della Mea prima azzurra al cancelletto nella 2^ manche, poi Pazzaglia e Zenere: alle 13.30 si riparte sul Rettenbach e Shiffrin...","summary_no":"Della Mea er første italienske utøver i startgropa i den andre omgangen, etterfulgt av Pazzaglia og Zenere. Rennet fortsetter på Rettenbach-løypa klokken 13.30, der også Shiffrin stiller til start.","spik_no":"Verdenscupsesongen i alpint åpnes med storslalåm for kvinner på Rettenbach-løypa i Sölden, der Mikaela Shiffrin leder etter første omgang med 14 hundredeler ned til svenske Sara Hector og 37 til sveitsiske Camille Rast. Shiffrin har ikke vunnet en storslalåm på nesten tre år – sist var hun nær seier i Killington i november 2024, da hun falt få porter fra mål. Amerikaneren har vunnet i Sölden tidligere, i 2014 og 2021, og jager sin 111. verdenscupseier. For Italia stiller Della Mea, Pazzaglia og Zenere i andre omgang, med ambisjoner om topp ti.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/della-mea-prima-azzurra-al-cancelletto-nella-2-manche-poi-pazzaglia-e-zenere-alle-1330-si-riparte-sul-rettenbach-e-shiffrin","pub_date":"2026-10-24T10:55:00.000Z","fetched_at":"2026-10-24 11:00:01","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":60497,"source_name":"Ski Racing","country":"INT","title_no":"Shiffrin satte farten i Sölden – titelforsvarer Scheib krasjet ut","title_orig":"Shiffrin Sets the Pace in Sölden as Defending Champion Scheib Crashes Out","summary_no":"Mikaela Shiffrin var raskest i Sölden, mens den forsvarende mesteren Scheib røk ut etter en smell.","spik_no":"Mikaela Shiffrin var raskest etter første omgang i sesongåpningen i Sölden, med tiden 1:07.27 – 0,14 sekunder foran svenske Sara Hector og 0,37 foran Camille Rast. Den forsvarende mesteren Scheib røk ut etter en krasj og tok ikke del i finaleomgangen. Shiffrin, som har vunnet Sölden-rennet en rekke ganger gjennom karrieren og nærmer seg 100 verdenscupseirer, leverte et teknisk sterkt løp med god fart gjennom de krevende partiene i det nedre flate feltet. Løpet ble forsinket av snø, og vinden skapte utfordringer i øvre del av løypen på Rettenbachgletsjeren.","url":"https://skiracing.com/shiffrin-sets-the-pace-in-solden-as-defending-champion-scheib-crashes-out/","pub_date":"2026-10-24T10:30:55.000Z","fetched_at":"2026-10-24 10:45:01","lang_orig":"en","category":null,"athletes":"Camille Rast,Julia Scheib,Mikaela Shiffrin,Sara Hector","athlete_nations":["AUT","SUI","SWE","USA"],"also_sources":[],"norwegian":false},{"id":60403,"source_name":"Neveitalia","country":"ITA","title_no":"Italia-gigantene sliter i Sölden – Zenere, Pazzaglia og Della Mea inne","title_orig":"L'Italgigante fatica a Soelden, dentro Zenere (\"ero tesa, ho margine\"), Pazzaglia e Della Mea. Bassino: \"Ho bisogno di passaggi\"","summary_no":"Det italienske alpinlandslaget hadde en tøff dag i Sölden. Zenere innrømmer hun var nervøs, mens Bassino sier hun trenger flere treningspassasjer.","spik_no":"Det italienske alpinlandslaget fikk en tøff åpning på verdenscupsesongen i Sölden, der bare tre av elleve sendte utøvere kvalifiserte seg til andre omgang i storslalåm på Rettenbach-breen. Giovanna Zenere innrømte at hun var nervøs, men mener hun har mer å gå på, mens Marta Bassino – som er tilbake etter et alvorlig kneskade i fjor – sier hun trenger flere treningspassasjer for å finne formen. Italia stilte uten sine to største profiler, Federica Brignone og Sofia Goggia, noe som økte presset på de øvrige løperne fra start.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/l-italgigante-fatica-a-soelden-dentro-zenere-ero-tesa-ho-margine-pazzaglia-e-della-mea-bassino-ho-bisogno-di-passaggi","pub_date":"2026-10-24T10:20:00.000Z","fetched_at":"2026-10-24 10:30:01","lang_orig":"it","category":null,"athletes":"Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":60129,"source_name":"SVT Sport","country":"SWE","title_no":"Sara Hector i toppposisjon etter åpningen – tett bak Shiffrin","title_orig":"Slagläge för Sara Hector i premiären – tätt bakom Shiffrin","summary_no":"Sara Hector er i en sterk posisjon etter premiären og ligger tett bak Mikaela Shiffrin i konkurransen.","spik_no":"Sara Hector kjørte seg inn på andreplass etter første omgang i storslalomåpningen i Sölden, bare 14 hundredeler bak Mikaela Shiffrin. Den 34 år gamle svenske veteranen har vært en fast gjest i toppen av storslalomcupen og har endt på tredjeplass sammenlagt tre sesonger på rad. Hector har vunnet flere verdenscuprenn i storslalom og var VM-gull-vinner i samme disiplin i Cortina 2021. Også Estelle Alphand imponerte med en sjuendeplass etter første omgang, noe som gir Sverige sterke kort foran annen omgang.","url":"https://www.svt.se/sport/alpint/slaglage-for-sara-hector-i-premiaren-tatt-bakom-shiffrin","pub_date":"2026-10-24T09:37:39.000Z","fetched_at":"2026-10-24 09:45:04","lang_orig":"sv","category":null,"athletes":"Mikaela Shiffrin,Sara Hector","athlete_nations":["SWE","USA"],"also_sources":[],"norwegian":false},{"id":59996,"source_name":"VG","country":"NOR","title_no":"Shiffrin leder verdenscupåpningen – de norske jakter topp ti-plassering","title_orig":"Shiffrin leder verdenscupåpningen – de norske jakter topp ti-plassering","summary_no":"","spik_no":"Mikaela Shiffrin leder verdenscupåpningen i Sölden med 14 hundredeler ned til svenske Sara Hector, mens de norske kvinnene Mina Fürst Holtmann og Thea Stjernesund kjemper om topp ti-plassering etter første omgang. Holtmann ligger på 8.-plass, 1,17 sekunder bak Shiffrin, mens Stjernesund er på 10.-plass med 1,12 sekunder opp til toppen. Begge nordkvinnene tok pallplasser i storslalåm forrige sesong — Stjernesund med tredjeplass i Copper Mountain og Holtmann med andreplass på Hafjell. Titelforsvarer Julia Scheib kjørte ut i første omgang.","url":"https://www.vg.no/sport/i/4O4mPR/shiffrin-leder-verdenscupaapningen-de-norske-jakter-topp-ti-plassering","pub_date":"2026-10-24T09:26:17.000Z","fetched_at":"2026-10-24 09:30:03","lang_orig":"no","category":null,"athletes":"Mikaela Shiffrin,Mina Fürst Holtmann,Thea Louise Stjernesund","athlete_nations":["NOR","USA"],"also_sources":[],"norwegian":true},{"id":60006,"source_name":"ORF Sport","country":"AUT","title_no":"Scheib-fall skapte skrekksekunder","title_orig":"Scheib-Sturz sorgt für Schrecksekunde","summary_no":"Et dramatisk fall av Scheib skapte stor bekymring under rennet og ga publikum et hjertestopp.","spik_no":"Julia Scheib skapte skrekksekunder i Sölden da hun falt dramatisk i bratthenget under første omgang og slo hardt i bakken. Østerrikeren, som vant storslalåmcupen sammenlagt forrige sesong og tok sin første verdenscupseier nettopp i Sölden i 2025, virket i første omgang uskadd og klarte å kjøre ned til mål selv. I et intervju bekreftet hun at hun kjente på kneet, men kunne utelukke korsbåndskade — noe hun har gjennomgått to ganger tidligere i karrieren. Ulykken åpnet veien for konkurrentene, og Mikaela Shiffrin utnyttet sjansen best.","url":"https://sport.orf.at/stories/3163985/","pub_date":"2026-10-24T09:25:33.000Z","fetched_at":"2026-10-24 09:30:03","lang_orig":"de","category":null,"athletes":"Julia Scheib,Mikaela Shiffrin","athlete_nations":["AUT","USA"],"also_sources":[],"norwegian":false},{"id":59961,"source_name":"Neveitalia","country":"ITA","title_no":"Shiffrin-majestet på Rettenbach: Raskest i 1. omgang foran Hector – Scheib skadet seg","title_orig":"Et voilà, sua maestà Mikaela sul Rettenbach: 1^ manche dell'opening firmata da Shiffrin su Hector, paura per Scheib","summary_no":"Mikaela Shiffrin satte raskeste tid i første omgang av sesongåpningen på Rettenbachferner, foran Hector. Scheib pådro seg en skade etter et dramatisk fall.","spik_no":"Mikaela Shiffrin satte raskeste tid i første omgang av sesongåpningen på Rettenbachbreen i Sölden, 14 hundredeler foran svenske Sara Hector, med Camille Rast på tredjeplass. Shiffrin jakter sin tredje strake seier i Sölden-åpningen, noe som historisk sett kun Tina Maze har klart. Titelforsvarer Julia Scheib hadde beste mellomtid da hun falt dramatisk på murfallet, slo hardt i bakken og skadet kneet, men kunne selv kjøre ned til mål og utelukket korsbåndskade. Andre omgang starter klokken 13.30.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/et-voila-sua-maesta-mikaela-sul-rettenbach-1-manche-dell-opening-firmata-da-shiffrin-su-hector-paura-per-scheib","pub_date":"2026-10-24T09:25:00.000Z","fetched_at":"2026-10-24 09:30:01","lang_orig":"it","category":null,"athletes":"Julia Scheib,Mikaela Shiffrin","athlete_nations":["AUT","USA"],"also_sources":[],"norwegian":false},{"id":59976,"source_name":"SkinEWS","country":"SUI","title_no":"Shiffrin gjør «Shiffrin-ting» og leder i Sölden","title_orig":"Shiffrin macht „Shiffrin-Sachen“ und führt in Sölden","summary_no":"Mikaela Shiffrin leverte en imponerende prestasjon i Sölden og leder etter første omgang i sesongåpningen.","spik_no":"Mikaela Shiffrin leder etter første omgang i sesongåpningen i Sölden, og gjør det hun er kjent for — leverer når det gjelder. Den amerikanske superstjernen har dominert alpinsporten i over et tiår og er den mestvinnende utøveren i verdenscuphistorien med over 90 seirer. Titelforsvarer Julia Scheib, som vant Sölden i fjor og tok storslalåmcupen sammenlagt, kjørte ut dramatisk midt i første omgang og ødela det østerrikske hjemmehåpet. Camille Rast ligger på tredjeplass ved halvgått løp.","url":"https://www.skinews.ch/news/2026/shiffrin-sachen-soelden/","pub_date":"2026-10-24T09:22:35.000Z","fetched_at":"2026-10-24 09:30:03","lang_orig":"de","category":null,"athletes":"Julia Scheib,Mikaela Shiffrin","athlete_nations":["AUT","USA"],"also_sources":[],"norwegian":false},{"id":60379,"source_name":"Sportschau","country":"GER","title_no":"Første omgang i storslalåm i vintersesongen 2026/27","title_orig":"Der erste Lauf im Riesenslalom der Wintersaison 2026/27","summary_no":"Den første omgangen i storslalåm er gjennomført i vintersesongen 2026/27.","spik_no":"Mikaela Shiffrin er raskest etter første omgang i sesongåpningens storslalåm i Sölden, foran Sara Hector og Camille Rast. Sölden har tradisjonelt vært stedet der verdenscupen i alpint åpner sesongen hvert år i slutten av oktober, og Shiffrin har en imponerende merittliste her. Den amerikanske stjernen er tidenes mestvinnenede alpinist med over 100 verdenscupseire, og en sterk første omgang i Sölden er et godt tegn foran resten av sesongen 2026/27.","url":"https://www.sportschau.de/wintersport/der-erste-lauf-im-riesenslalom-der-wintersaison-2026-27,riesenslalom-lauf-1-soelden-100.html","pub_date":"2026-10-24T09:21:38.000Z","fetched_at":"2026-10-24 10:15:04","lang_orig":"de","category":null,"athletes":"Camille Rast,Mikaela Shiffrin,Sara Hector","athlete_nations":["SUI","SWE","USA"],"also_sources":[],"norwegian":false},{"id":59459,"source_name":"ORF Sport","country":"AUT","title_no":"Rennkalenderen skaper igjen debatt","title_orig":"Rennkalender sorgt erneut für Diskussionen","summary_no":"Alpinski-rennkalenderen er nok en gang gjenstand for diskusjon blant utøvere og organisasjoner.","spik_no":"Verdenscupkalenderen for alpint 2026/27 inneholder 40 renn for kvinner og 43 for menn, men balansen mellom fart- og teknikkøvelser er igjen skjev – særlig for kvinner, der teknikkrenn dominerer klart. Østerrike er største vertsland med 15 verdenscupavdelinger, inkludert en ny stopp i Dachstein West/Gosau. Østerriksk dametrener Johannes Zöchling peker på at logistikk og mange motstridende interesser gjør kalenderarbeidet svært krevende, og beklager at det ikke er fartshjemerenn for østerrikske kvinner denne vinteren.","url":"https://sport.orf.at/stories/3163844/","pub_date":"2026-10-24T07:43:47.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":59460,"source_name":"ORF Sport","country":"AUT","title_no":"Pertl avslutter sesongen på ellevteplass","title_orig":"Pertl schließt Saison mit Platz elf ab","summary_no":"Stefan Pertl rundet av sesongen med en ellevteplass i sitt siste renn.","spik_no":"Denne saken handler ikke om alpint, men om triatlet Lukas Pertl, som avsluttet sin sesong med en ellevteplass i et verdenscuprenn i Tongyeong i Sør-Korea. Sprintdistansen ble gjennomført i kraftig regn, og seieren gikk til spanjolen Alberto Gonzalez Garcia. Saken er ikke relevant for NRK Sport alpint.","url":"https://sport.orf.at/stories/3163982/","pub_date":"2026-10-24T07:11:48.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":59414,"source_name":"Neveitalia","country":"ITA","title_no":"Dame-storslalåm på Rettenbach: 30 minutters forsinkelse, men gode forhold","title_orig":"Signore e signori, è il giorno del gigante donne sul Rettenbach: start con 30 minuti di ritardo, ma le condizioni sono buone","summary_no":"Dame-storslalåmen på Rettenbachbreen i Sölden starter 30 minutter forsinket, men forholdene beskrives som gode.","spik_no":"Dame-storslalåmen på Rettenbachbreen i Sölden innleder den 61. utgaven av alpint verdenscup, og første omgang er utsatt 30 minutter til kl. 10.30 etter nattens snøfall på rundt ti centimeter. Forholdene beskrives som relativt gode, men vind kan bli en utfordring utover dagen. Mikaela Shiffrin er blant dem som starter tidlig i feltet, mens Marta Bassino er tilbake etter et år utenfor sirkuset – hun uttalte etter besiktigelsen at hun gleder seg, men erkjenner at hun har skiet lite på bratt terreng.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/signore-e-signori-e-il-giorno-del-gigante-donne-sul-rettenbach-start-con-30-minuti-di-ritardo-ma-le-condizioni-sono-buone","pub_date":"2026-10-24T06:15:00.000Z","fetched_at":"2026-10-24 08:24:36","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":59429,"source_name":"SkinEWS","country":"SUI","title_no":"Forsinkelse i Sölden – nye starttider kl. 10.30/13.30","title_orig":"Verzögerung in Sölden – neue Startzeiten heute um 10.30/13.30 Uhr","summary_no":"Rennet i Sölden er forsinket, og nye starttider er satt til henholdsvis kl. 10.30 og 13.30.","spik_no":"Dame-storslalåmen i Sölden er forsinket på grunn av snøfall natten til lørdag og pågående arbeid på løypa, og starter nå kl. 10.30 i stedet for opprinnelige kl. 10.00. Andreetappen er tilsvarende flyttet til kl. 13.30. Sölden er tradisjonelt åpningsarena for verdenscupsesongen og arrangerer som regel de første rennene på Rettenbachbreen i slutten av oktober hvert år.","url":"https://www.skinews.ch/news/2026/verzoegerung-soelden-startzeiten/","pub_date":"2026-10-24T06:11:53.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":59464,"source_name":"ORF Sport","country":"AUT","title_no":"Dame-storslalåm i Sölden utsatt til kl. 10.30","title_orig":"Damen-RTL in Sölden auf 10.30 Uhr verschoben","summary_no":"Dame-storslalåmen i Sölden er blitt utsatt og starter nå kl. 10.30 i stedet for opprinnelig planlagt tid.","spik_no":"Dame-storslalåmen i Sölden er forsinket med 30 minutter, og første omgang starter nå kl. 10.30 etter at arbeid på løypa og nattens snøfall krevde ekstra tid – også besiktigelsen for utøverne ble skjøvet en halvtime. Sölden på Rettenbachbreen er den tradisjonelle åpningsarenaen for verdenscupsesongen, og åpner nå det som er en VM-vinter. Rennet sendes direkte på ORF1 fra kl. 10.00.","url":"https://sport.orf.at/stories/3163976/","pub_date":"2026-10-24T06:08:51.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":55646,"source_name":"SkinEWS","country":"SUI","title_no":"Alice Robinson åpner verdenscupsesongen 2026/27 lørdag klokken 10","title_orig":"Alice Robinson eröffnet am Samstag um 10 Uhr die Weltcup-Saison 2026/27","summary_no":"Alice Robinson innleder verdenscupsesongen 2026/27 med start lørdag morgen klokken 10.","spik_no":"Newzealandske Alice Robinson åpner verdenscupsesongen 2026/27 med startnummer én i riesenslalåmen i Sölden lørdag klokken 10. Robinson, som er 24 år gammel, er en av de fremste storslalåmkjørerne i verden og vant sin første verdenscupseier allerede som 17-åring i nettopp Sölden i 2019. Hun har siden befestet seg i verdenseliten i storslalåm og representerer et av alpintsportens minste nasjoner på høyeste nivå.","url":"https://www.skinews.ch/news/2026/robinson-eroeffnet-samstag/","pub_date":"2026-10-23T18:14:40.000Z","fetched_at":"2026-10-23 21:00:04","lang_orig":"de","category":null,"athletes":"Alice Robinson","athlete_nations":["NZL"],"also_sources":[],"norwegian":false},{"id":55611,"source_name":"Ski Racing","country":"INT","title_no":"Sölden kvinner stor slalåm 2026: Startliste, resultater og TV-tider","title_orig":"Sölden Women’s GS 2026: Start List, Rankings, Times & How to Watch","summary_no":"Alt du trenger å vite om kvinnenes gigantslalåm i Sölden 2026, inkludert startliste, rangeringer, tider og hvordan du kan følge rennet.","spik_no":"Lørdag 25. oktober åpner den nye verdenscupsesongen med kvinnenes gigantslalåm på Rettenbach-breen i Sölden, der 67 løpere fra 19 nasjoner er påmeldt. Forsvarende vinner og regjerende gigantslalåmvinner Julia Scheib er toppfavoritt – østerrikeren tok fem GS-seiere forrige sesong og vant sin første krystallkule i grenen. Blant de store navnene som stiller er Mikaela Shiffrin og Paula Moltzan for USA, samt Petra Vlhová som gjør comeback i verdenscupen etter lang tids fravær. De siste tre Sölden-vinnerne har alle gått videre til å vinne GS-kulen sammenlagt, noe som gir åpningsrennet ekstra historisk tyngde.","url":"https://skiracing.com/solden-womens-gs-2026-start-list-how-to-watch/","pub_date":"2026-10-23T18:05:25.000Z","fetched_at":"2026-10-23 21:00:01","lang_orig":"en","category":null,"athletes":"Mikaela Shiffrin,Petra Vlhová","athlete_nations":["SVK","USA"],"also_sources":[],"norwegian":false},{"id":55631,"source_name":"Neveitalia","country":"ITA","title_no":"Alice Robinson åpner verdenscupen i Sölden – 11 italienske utøvere på startlisten","title_orig":"Sarà Alice Robinson ad aprire la Coppa del Mondo, poi Scheib nell'arena di Soelden: 11 azzurre al via","summary_no":"Alice Robinson får startnummer én i Sölden, med Scheib like bak. Hele 11 italienske alpinister er klare for sesongåpningen i riesenslalåm.","spik_no":"Alice Robinson åpner den 61. sesongen av verdenscupen med startnummer én i riesenslalåmen på Rettenbach-breen i Sölden lørdag. Julia Scheib, fjorårets vinner av sesongåpningen i Sölden, starter som nummer to og er blant favorittene. Italia stiller med hele 11 alpinister, men uten de to store stjernene Federica Brignone og Sofia Goggia, mens Mikaela Shiffrin starter med nummer fem.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sara-alice-robinson-ad-aprire-la-coppa-del-mondo-poi-scheib-nell-arena-di-soelden-11-azzurre-al-via","pub_date":"2026-10-23T17:15:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":"Alice Robinson","athlete_nations":["NZL"],"also_sources":[],"norwegian":false},{"id":48079,"source_name":"Neveitalia","country":"ITA","title_no":"Atomic og Braathen sammen til 2030 – sikter mot den store krystallkulen","title_orig":"Atomic e Lucas Pinheiro Braathen assieme sino al 2030: il prossimo obiettivo è la sfera di cristallo assoluta","summary_no":"Atomic og Lucas Pinheiro Braathen har forlenget samarbeidet til 2030, med den sammenlagte verdenscupseieren som neste store mål.","spik_no":"Lucas Pinheiro Braathen og utstyrsmerket Atomic har forlenget samarbeidet sitt frem til 2030, med den store krystallkulen – sammenlagttittelen i verdenscupen – som overordnet mål. Braathen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåmkula i 2022–23-sesongen og har etablert seg blant verdens beste teknikkjørere. En sammenlagtseier vil kreve at han hevder seg også utenfor slalåm, noe som gjenstår å bevise.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/atomic-e-lucas-pinheiro-braathen-assieme-sino-al-2030-il-prossimo-obiettivo-e-la-sfera-di-cristallo-assoluta","pub_date":"2026-10-21T10:20:00.000Z","fetched_at":"2026-10-22 10:54:36","lang_orig":"it","category":"viktig","athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":46668,"source_name":"SVT Sport","country":"SWE","title_no":"Treningsbildene av Anna Swenn-Larsson spres: «Viralt»","title_orig":"Träningsbilderna på Anna Swenn-Larsson sprids: ”Viralt”","summary_no":"Bilder av Anna Swenn-Larsson under trening sprer seg raskt på nett og har blitt et viralt fenomen.","spik_no":"Anna Swenn-Larsson har skapt oppmerksomhet på sosiale medier etter at treningsvideoer av henne har spredt seg viralt, blant annet med kommentarer fra alpinlegender som Anja Pärson og Lindsey Vonn. Den svenske slalåmstjernen, som er 35 år, vant bronsemedalje i slalåm under OL i Milano Cortina og regnes som en av de mest erfarne utøverne i verdenscupen. Swenn-Larsson er ydmyk overfor oppmerksomheten og påpeker at hardt treningsarbeid er normalt i alpinmiljøet. Til helgen er hun klar for verdenscuppremieren i Sölden 24. oktober.","url":"https://www.svt.se/sport/alpint/traningsbilderna-pa-anna-swenn-larsson-sprids-viralt","pub_date":"2026-10-20T07:51:11.000Z","fetched_at":"2026-10-20 08:00:04","lang_orig":"sv","category":"naert","athletes":"Anna Swenn-Larsson","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":31695,"source_name":"Ski Racing","country":"INT","title_no":"Breezy Johnson stiller spørsmål ved rettferdigheten i FIS' skivektregel","title_orig":"Breezy Johnson Questions Fairness of FIS Ski Weight Rule","summary_no":"Den amerikanske alpinisten Breezy Johnson kritiserer FIS-regelen om minimumsvekt på ski og mener den ikke er rettferdig.","spik_no":"Amerikanske Breezy Johnson, olympisk mester og verdensmester i utforkjøring, stiller spørsmål ved rettferdigheten i FIS' nye regel om minimumsvekt på racingski. Johnson sier at sommertrening på myk og jevn snø ikke har avslørt noen merkbar forskjell med de nye skiene, men understreker at renn på tøffe verdenscupbakker er en helt annen sak. Hun er særlig bekymret for regelens begrunnelse og mener den rammer et lite antall utøvere uforholdsmessig hardt. Johnson, som kjører på Atomic-ski for det amerikanske Stifel-laget, planlegger mer testing på Copper Mountain frem mot sesongstart.","url":"https://skiracing.com/breezy-johnson-fis-ski-weight-rule/","pub_date":"2026-10-14T17:48:11.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"en","category":"naert","athletes":"Breezy Johnson","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":30501,"source_name":"SVT Sport","country":"SWE","title_no":"Kristoffer Jakobsen vil rette opp feilene – ved å gå tilbake til røttene","title_orig":"Kristoffer Jakobsens uråkningar ska bort – genom att backa i tiden","summary_no":"Kristoffer Jakobsen jobber med å eliminere sine tekniske feil ved å gå tilbake til grunnleggende prinsipper.","spik_no":"Kristoffer Jakobsen har hatt en svært skuffende sesong og gikk ut i første omgang i sju av elleve slalomrenn i fjor. For å komme tilbake til toppform går 32-åringen tilbake til det eksakt samme utstyret han brukte da han ledet slalomcupen sammenlagt og var på sitt beste. Et nytt støvelkonsept fra skimerkevaret hans fungerte dårlig, og de svake resultatene har kostet ham mye i rankingen, slik at han neste sesong starter med høyere startnummer. Jakobsen har fire pallplasser i karrieren, den siste fra november 2024.","url":"https://www.svt.se/sport/alpint/kristoffer-jakobsens-urakningar-ska-bort-genom-att-backa-i-tiden","pub_date":"2026-10-14T14:08:51.000Z","fetched_at":"2026-10-14 14:15:04","lang_orig":"sv","category":"nerding","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":23913,"source_name":"Neveitalia","country":"ITA","title_no":"Giada D'Antonio: – Skader har lært meg mye, nå er jeg smertefri","title_orig":"\"Scio senza dolore, l'infortunio mi ha insegnato tanto\": Giada D'Antonio ora in Senales, probabile il debutto in Coppa Europa","summary_no":"Den italienske alpinisten Giada D'Antonio trener i Senales etter skade og er aktuell for debut i Europa-cupen function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';
  if (days <= 45) return '🎿 Forsesong — ' + nxt.venue + ' om ' + days + ' dager';
  return '💤 Sommerpause';
}
document.getElementById('season-badge').textContent = seasonStatus();

function getRace(str) {
  if (!str) return null;
  const d = new Date(str);
  if (isNaN(d)) return null;
  const s = d.toISOString().slice(0,10);
  return RACES.find(r => s >= r.date && s <= r.end) || null;
}

function fmt(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' kl. ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

    <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="card-title">${title}</a>
    ${a.summary_no ? `<p class="card-summary">${a.summary_no}</p>` : ''}
    ${a.spik_no ? `<div class="card-spik"><span class="spik-label">📻 SPIK</span><span class="spik-text">${a.spik_no}</span></div>` : ''}
  </div>`;
}

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function render() {
  renderFilterRow();
  const words = norm(searchQ).split(/\s+/).filter(Boolean);
  const pool = words.length && extraLoaded ? ARTICLES_ALL : ARTICLES;
  const visible = pool.filter(a => {
    if (activeCountry === 'INT' ? a.country !== 'INT' : (activeCountry && !(a.athlete_nations || []).includes(activeCountry))) return false;
    if (activeCat && a.category !== activeCat) return false;
    if (activeAthlete && !(a.athletes||'').split(',').map(s=>s.trim()).includes(activeAthlete)) return false;
    if (words.length) {
      const hay = norm([a.title_no, a.title_orig, a.summary_no, a.spik_no, a.athletes, a.source_name, (a.also_sources||[]).join(' '), a.category,
        ...(a.athlete_nations||[]).map(c => c + ' ' + ((NATION_META[c]||[])[1]||''))].filter(Boolean).join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });

  document.getElementById('count').textContent = visible.length + ' saker';

  const feed = document.getElementById('feed');
  feed.innerHTML = visible.length
    ? visible.map(a => cardHtml(a, false)).join('')
    : `<div class="empty">${words.length || activeCountry || activeCat || activeAthlete ? 'Ingen treff' : 'Ingen saker'}</div>`;

  // Spik-liste: vis alle kategoriserte (ufiltrert på land/utøver/søk for sidepanelet, men respekter kategori-filter)
  const spikFilter = activeCat
    ? ARTICLES.filter(a => a.category === activeCat)
    : ARTICLES.filter(a => a.category);

  const spikEl = document.getElementById('spik-list');
  const spikLabel = document.getElementById('spik-label');
  spikLabel.textContent = 'Spik-liste (' + spikFilter.length + ')';

  if (!spikFilter.length) {
    spikEl.innerHTML = '<div class="sidebar-empty">Ingen saker valgt ut ennå</div>';
    return;
  }

  // Grupper etter kategori
  const grouped = {};
  CATS.forEach(c => { grouped[c.id] = []; });
  spikFilter.forEach(a => { if (grouped[a.category]) grouped[a.category].push(a); });

  spikEl.innerHTML = CATS.map(cat => {
    const items = grouped[cat.id];
    if (!items.length) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--${cat.id === 'goy' ? 'goy' : cat.id});padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${cat.label}</div>
      ${items.map(a => cardHtml(a, true)).join('')}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
