Braathen","summary_no":"Sturm overrasket alle ved å ta ledelsen foran Braathen i rennet.","spik_no":"Lucas Pinheiro Braathen leder etter første omgang i slalåmåpningen i Levi med 0,65 sekunder ned til franske Clément Noël, mens østerrikske Joshua Sturm overrasket stort ved å kjøre inn på tredjeplass med startnummer 27. Braathen, som kjører for Brasil, viste toppform allerede i Sölden der han dominerte storslalåmen. Sturm er 25 år og har aldri stått på pallen i verdenscupen, men etter en feilfri første omgang på gode føreforhold er karrierens første pallplass innen rekkevidde. «Definitiv er jeg en bedre skiløper i år enn i fjor», sa Sturm selv etter løpet.","url":"https://sport.orf.at/stories/3164962/","pub_date":"2026-11-15T10:13:19.000Z","fetched_at":"2026-11-15 10:15:04","lang_orig":"de","category":null,"athletes":"Clement Noel,Joshua Sturm,Lucas Braathen","athlete_nations":["AUT","BRA","FRA"],"also_sources":[],"norwegian":false},{"id":152026,"source_name":"Sportschau","country":"GER","title_no":"Braathen i en klasse for seg etter 1. omgang – Straßer jakter pallen","title_orig":"Braathen im 1. Lauf in eigener Liga - Straßer lauert aufs Podest","summary_no":"Lucas Braathen leverte en imponerende første omgang og leder suverent. Linus Straßer ligger an til å kjempe om pallplass.","spik_no":"Lucas Braathen leder suverent etter første omgang i slalåmrennet i Levi, med 65 hundredelers forsprang på franskmannen Clément Noël. Linus Straßer er kun 51 hundredeler bak tredjeplassen og har gode sjanser for pallen i finaleomgangen. Braathen, som kjører for Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåmkuglens totalpris forrige sesong og viste igjen klasse på den krevende Levi Black-løypa i iskalde forhold.","url":"https://www.sportschau.de/regional/br/br-braathen-im-1-lauf-in-eigener-liga-strasser-lauert-aufs-podest-102.html","pub_date":"2026-11-15T09:58:27.000Z","fetched_at":"2026-11-15 10:00:06","lang_orig":"de","category":null,"athletes":"Linus Straßer,Lucas Braathen","athlete_nations":["BRA","GER"],"also_sources":[],"norwegian":false},{"id":151927,"source_name":"VG","country":"NOR","title_no":"Braathen i egen klasse i Levi – leder suverent etter første omgang","title_orig":"Braathen i egen klasse i Levi – leder suverent etter første omgang","summary_no":"","spik_no":"Lucas Braathen leverte en enestående første omgang i Levi-slalåmen og leder med 65 hundredeler foran franskmannen Clément Noël, mens bestevennen Atle Lie McGrath er på fjerdeplass med 85 hundredelers tap. Braathen selv sier han fant rytmen tidlig og klarte å utnytte terrenget i den isdekte løypa til sin fordel. McGrath karakteriserer Levi som «kanskje den bakken Lucas er best i i slalåm» — et utsagn som understreker Braathens spesielle tilknytning til den finske arenaen, der han også vant i fjor.","url":"https://www.vg.no/sport/i/pMLPVW/lucas-pinheiro-braathen-i-egen-klasse-i-levi-leder-suverent-etter-foerste-omgang?utm_medium=rss","pub_date":"2026-11-15T09:48:52.000Z","fetched_at":"2026-11-15 10:00:04","lang_orig":"no","category":null,"athletes":"Atle Lie McGrath,Lucas Braathen","athlete_nations":["BRA","NOR"],"also_sources":[],"norwegian":true},{"id":151906,"source_name":"SkinEWS","country":"SUI","title_no":"Lucas Pinheiro Braathen på vei mot tittelforsvar","title_orig":"Lucas Pinheiro Braathen auf dem Weg zur Titelverteidigung","summary_no":"Lucas Pinheiro Braathen er i rute for å forsvare tittelen sin og viser storform i konkurransen.","spik_no":"Lucas Pinheiro Braathen er i rute for å forsvare seieren sin fra Levi-slalåmen i fjor, og kan bli den første kjøreren som vinner det samme verdensscuprenn i Levi to år på rad. Den 26 år gamle brasiliansk-norske utøveren leder etter første omgang med 65 hundredelers margin til Clément Noël, mens Joshua Sturm fra Østerrike er på tredjeplass. Braathen vant slalåmkuglens totalpris forrige sesong og åpnet inneværende sesong med seier i storslalåmen i Sölden.","url":"https://www.skinews.ch/news/2026/pinheiro-braathen-titelverteidigung/","pub_date":"2026-11-15T09:48:10.000Z","fetched_at":"2026-11-15 10:00:04","lang_orig":"de","category":null,"athletes":"Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA"],"also_sources":[],"norwegian":false},{"id":151737,"source_name":"Neveitalia","country":"ITA","title_no":"Braathen skremt igjen i åpningen i Levi: 65 hundredeler bak Noel etter et historisk løp","title_orig":"Lucas Pinheiro Braathen fa spavento anche in apertura a Levi: 65 centesimi a Noel con una manche da antologia","summary_no":"Lucas Pinheiro Braathen imponerte i Levi-åpningen med et minneverdig løp, men endte 65 hundredeler bak Clément Noel etter første omgang.","spik_no":"Lucas Pinheiro Braathen leverte en imponerende første omgang i slalomåpningen i Levi, men endte likevel 65 hundredeler bak franske Clément Noel. Braathen, som representerer Brasil, vant historisk i nettopp Levi for ett år siden og ga landet sin første verdenscupseier noensinne. 26-åringen var allerede i storform etter å ha vunnet sesongåpningen i Sölden, og ifølge italienske medier dominerte han alle sektorer av løypen i første omgang. McGrath fulgte på fjerdeplass bak en sterk Sturm, mens Vinatzer lå hele 1,80 sekunder bak.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/lucas-pinheiro-braathen-fa-spavento-anche-in-apertura-a-levi-65-centesimi-a-noel-con-una-manche-da-antologia","pub_date":"2026-11-15T09:35:00.000Z","fetched_at":"2026-11-15 09:45:02","lang_orig":"it","category":null,"athletes":"Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA"],"also_sources":[],"norwegian":false},{"id":151085,"source_name":"Neveitalia","country":"ITA","title_no":"Klokken 10.00 er det start – norske utøvere jakter på Noel, Meillard og Braathen på Levi Black!","title_orig":"Alle 10.00 si parte, i norvegesi all'attacco di Noel, Meillard e Pinheiro Braathen: che sfida sulla Levi Black!","summary_no":"De norske alpinistene er klare til å utfordre Clément Noel, Loïc Meillard og Lucas Pinheiro Braathen i slalåmrennet på Levi Black.","spik_no":"Klokken 10.00 norsk tid går startskuddet for herreslalåmen på Levi Black, der Clément Noel starter med startnummer 1 som OL-mester og pallgarantist i Levi — franskmannen har stått på pallen i Finland i 2019, 2024 og 2025. Lucas Pinheiro Braathen, som forsvarer seieren sin fra fjoråret, og Loïc Meillard regnes blant de største favorittkandidatene, mens norske Henrik Kristoffersen starter som nummer fem. McGrath, som holder slalåmcupen fra fjoråret, starter med startnummer fire i en åpningskamp som beskrives som ekstremt åpen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/alle-1000-si-parte-i-norvegesi-all-attacco-di-noel-meillard-e-pinheiro-braathen-che-sfida-sulla-levi-black","pub_date":"2026-11-15T07:25:00.000Z","fetched_at":"2026-11-15 08:45:02","lang_orig":"it","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen,Timon Haugan","athlete_nations":["BRA","FRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":151195,"source_name":"RTV SLO","country":"SLO","title_no":"Herreslalåm i Levi kl. 10 – ingen slovenere med","title_orig":"Ob 10. uri moški slalom v Leviju, a brez slovenskih predstavnikov","summary_no":"Herreslalåmen i Levi starter klokken 10, men ingen slovenske utøvere er representert i rennet.","spik_no":"Herreslalåmen i Levi åpner sesongen, men Slovenia stiller uten representanter i rennet. Det er oppsiktsvekkende for et land som lenge har vært en slalåmnasjon av rang — med utøvere som Henrik Kristoffersen stilte for Slovenia etter nasjonalitetsskifte, og med en sterk alpintradisjon generelt. Slovenia har tidligere hatt profiler som Mitja Valenčič i slalåm, men mangler tilsynelatende utøvere i verdensklasse denne sesongen til å kvalifisere seg for åpningsrennet i Lappland.","url":"https://www.rtvslo.si/sport/ob-10-uri-moski-slalom-v-leviju-a-brez-slovenskih-predstavnikov/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 08:45:06","lang_orig":"sl","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":151674,"source_name":"RTV SLO","country":"SLO","title_no":"Braathen leder med god margin i Levi","title_orig":"Braathen v Leviju vodi z lepo prednostjo","summary_no":"Lucas Braathen leder konkurransen i Levi med en komfortabel margin etter første omgang.","spik_no":"Lucas Braathen leder etter første omgang i slalåmåpningen i Levi, Finland, med god margin ned til sine nærmeste konkurrenter. Braathen, som representerer Brasil etter å ha skiftet nasjonalitet fra Norge i 2023, er en av de mest rutinerte slalåmkjørerne på verdenscupturen og vant slalåmkula i 2021/22-sesongen. Levi-rennet er tradisjonelt det første slalåmrennet i verdenscupsesongen, og en ledelse etter første omgang er ingen garanti – nettopp i denne bakken er comebacks velkjente.","url":"https://www.rtvslo.si/sport/braathen-v-leviju-vodi-z-lepo-prednostjo/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 09:30:06","lang_orig":"sl","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":152001,"source_name":"RTV SLO","country":"SLO","title_no":"Braathen leder med solid margin – Sturm overraskende på tredjeplass","title_orig":"Braathen vodi z lepo prednostjo, Joshua Sturm kar tretji","summary_no":"Lucas Braathen topper sammenlagt etter første omgang med god ledelse. Joshua Sturm overrasker med en sterk tredjeplass.","spik_no":"Lucas Braathen leder sammenlagt etter første omgang i Levi, mens østerrikske Joshua Sturm overrasker med en tredjeplass. Braathen, 26 år gammal og konkurrerende for Brasil, har vist en dominans få rivalene klarer å matche denne sesongen. Sturm er en relativt ny figur i verdenstoppen og gjør det til en overraskelse at han befinner seg så høyt oppe mot etablerte slalåmstjerner.","url":"https://www.rtvslo.si/sport/braathen-vodi-z-lepo-prednostjo-joshua-sturm-kar-tretji/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 10:00:05","lang_orig":"sl","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":153726,"source_name":"RTV SLO","country":"SLO","title_no":"Braathen leder foran Noel – overraskelser på 3.- og 5.-plass","title_orig":"Braathen vodi pred Noelom, presenečenji na mestih 3 in 5","summary_no":"Lucas Braathen leder sammenlagt foran Clément Noel, med overraskende navn på tredje- og femteplass.","spik_no":"Lucas Braathen leder sammenlagt i slalåmcupen foran franske Clément Noel, med overraskende navn på tredje- og femteplass. Braathen, som nå representerer Brasil etter å ha skiftet nasjonalitet fra Norge i 2023, er en av verdens beste slalåmkjørere og har tidligere vunnet verdenscupsesongen sammenlagt. Noel er regjerende olympisk mester i slalåm fra Beijing 2022. At det er overraskende navn høyt oppe på resultatlisten tidlig i sesongen, er ikke uvanlig – verdenscupen i slalåm er kjent for å skape sensasjoner.","url":"https://www.rtvslo.si/sport/braathen-vodi-pred-noelom-presenecenji-na-mestih-3-in-5/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 12:00:05","lang_orig":"sl","category":null,"athletes":"Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA"],"also_sources":[],"norwegian":false},{"id":155109,"source_name":"RTV SLO","country":"SLO","title_no":"Braathen første til å vinne to ganger på rad i Levi","title_orig":"Braathen prvi, ki je v Leviju zmagal dvakrat zapored","summary_no":"Lucas Braathen har skrevet historie ved å vinne to ganger på rad i Levi, som den første utøveren til å oppnå denne bragden.","spik_no":"Lucas Braathen er den første utøveren som har vunnet slalåmrennet i Levi to ganger på rad, og har dermed skrevet seg inn i historien på den finske åpningsbakken. Braathen, som kjører for Brasil etter å ha skiftet nasjonalitet fra Norge, er en av verdens beste slalåmkjørere og har tidligere vunnet flere verdenscupseire i tekniske disipliner. Levi har i mange år vært åpningshelgen i verdenscupen i slalåm, og en dobbeltseier der understreker hans dominans på de smaleste portene.","url":"https://www.rtvslo.si/sport/braathen-prvi-ki-je-v-leviju-zmagal-dvakrat-zapored/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 14:00:05","lang_orig":"sl","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":151146,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrikske herrer håper på god slalomstart","title_orig":"ÖSV-Herren hoffen auf guten Slalom-Auftakt","summary_no":"Det østerrikske herrelandslaget ser frem til sesongåpningen i slalåm og håper på et sterkt resultat fra start.","spik_no":"Østerrike håper på en sterk sesongstart i Levi, men har slitt i slalåm de siste sesongene — fjorårets eneste pallplass kom ikke før i Kitzbühel i januar. Fabio Gstrein og Michael Matt er de fremste ØSV-håpene etter at Manuel Feller er satt til å utsette sin sesongstart til hjemmerennet i Gurgl 22. november på grunn av ryggproblemer. Sist østerriksk utøver sto på pallen i Levi var i 2018, da Marcel Hirscher vant — en statistikk laget gjerne vil endre i et VM-år.","url":"https://sport.orf.at/stories/3164891/","pub_date":"2026-11-14T23:01:58.000Z","fetched_at":"2026-11-15 08:45:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":148033,"source_name":"Ski Racing","country":"INT","title_no":"Startliste for herrenes slalåm i Levi 2026","title_orig":"Levi Men’s Start List article 2026","summary_no":"Her er startlisten for herrenes slalåmrenn i Levi i 2026.","spik_no":"Herrenes slalåmverdenscup åpner søndag 15. november 2026 i finske Levi, med 86 løpere fra 23 nasjoner på startlisten. Forsvarende vinner Lucas Pinheiro Braathen starter med startnummer 7, mens Clément Noël trekker nummer 1. Fra norsk side er Timon Haugan, Atle Lie McGrath og Henrik Kristoffersen blant de syv første ut. Levi er tradisjonelt sesongåpner for herrenes slalåm og et renn der norske utøvere historisk har gjort seg sterkt gjeldende.","url":"https://skiracing.com/levi-mens-start-list-article-2026/","pub_date":"2026-11-14T18:57:55.000Z","fetched_at":"2026-11-14 19:00:02","lang_orig":"en","category":null,"athletes":"Atle Lie McGrath,Clement Noel,Henrik Kristoffersen,Loïc Meillard,Lucas Braathen,Timon Haugan","athlete_nations":["BRA","FRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":147875,"source_name":"Neveitalia","country":"ITA","title_no":"Verdenscupstillingen etter Levi: Aicher og Colturi deler ledelsen","title_orig":"Le classifiche della coppa femminile dopo Levi: Aicher e Colturi appaiate in vetta, top 7 di slalom inalterata","summary_no":"Etter rennet i Levi er Aicher og Colturi likt plassert på toppen av kvinnecupen, mens topp-7 i slalom forblir uendret.","spik_no":"Etter de to første slalomrennene i Levi deler Emma Aicher og Lara Colturi topplasseringen i den samlede verdenscupen for kvinner med 160 poeng hver. Mikaela Shiffrin, som normalt dominerer slalomklassen, ligger på delt 12.-plass med kun 36 poeng etter å ha mistet renn til skade — hun vil heller ikke stille i Gurgl om en uke. Lara Colturi, som konkurrerer for Albania, er sønn av den tidligere italienske alpinisten Giorgio Colturi, og har vokst opp i alpinmiljøet. Med Paula Moltzan på tredjeplass og Zrinka Ljutic på fjerde er starten på sesongen preget av bred konkurranse i toppen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/le-classifiche-della-coppa-femminile-dopo-levi-aicher-e-colturi-appaiate-in-vetta-top-7-di-slalom-inalterata","pub_date":"2026-11-14T18:40:00.000Z","fetched_at":"2026-11-14 18:45:01","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi,Mikaela Shiffrin","athlete_nations":["ALB","GER","USA"],"also_sources":[],"norwegian":false},{"id":147361,"source_name":"Neveitalia","country":"ITA","title_no":"Startliste for herreslalåmen i Levi: Noel åpner, etterfulgt av Haugan, Meillard og de norske essene","title_orig":"La startlist dello slalom maschile nell'arena di Levi: Noel apre, poi Haugan, Meillard e gli altri due assi norge","summary_no":"Noel starter først i herreslalåmen i Levi-arenaen, etterfulgt av Haugan, Meillard og de øvrige norske toppløperne.","spik_no":"Clément Noel starter med startnummer 1 i herreslalåmen i Levi, mens Timon Haugan er nummer 2 og Loïc Meillard nummer 3. Levi-rennet er det første av 13 planlagte slalåmrenn for menn i Verdenscupen 2025/26-sesongen. Lucas Pinheiro Braathen, som vant i Levi for ett år siden, trekker startnummer 7. Noel har historisk sett trivdes godt i den finske arenaen og har flere pallplasseringer der.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/la-startlist-dello-slalom-maschile-nell-arena-di-levi-noel-apre-poi-haugan-meillard-e-gli-altri-due-assi-norge","pub_date":"2026-11-14T17:45:00.000Z","fetched_at":"2026-11-14 18:00:01","lang_orig":"it","category":null,"athletes":"Clement Noel,Loïc Meillard,Timon Haugan","athlete_nations":["FRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":146651,"source_name":"Neveitalia","country":"ITA","title_no":"Mélanie Meillard med korsbåndskade – også Tommy Salas sesong er over","title_orig":"Per Mélanie Meillard la notizia peggiore: rottura del crociato. E anche la stagione di Tommy Sala è finita: \"Sembra un déjà vu\"","summary_no":"Mélanie Meillard har pådratt seg et korsbåndsbrudd og er ferdig for sesongen. Også Tommy Salas sesong er slutt, og han beskriver situasjonen som et déjà vu.","spik_no":"Både sveitsiske Mélanie Meillard og italienske Tommy Sala har pådratt seg korsbåndsskader og er ferdig for sesongen – uten å ha fått disputert en eneste renn. Meillard skadet seg i oppkjøringen til Levi, mens Sala ble skadet i Gurgl for en drøy uke siden. For Sala er det et vondt déjà vu: for to år siden røk han korsbåndet i det andre kneet under trening. Begge går nå glipp av en sesong som kulminerer med VM i Crans-Montana, som for Meillard hadde vært et hjemlig mesterskap.","url":"https://www.neveitalia.it/sport/scialpino/news/per-melanie-meillard-la-notizia-peggiore-rottura-del-crociato-e-anche-la-stagione-di-tommy-sala-e-finita-sembra-un-deja-vu","pub_date":"2026-11-14T16:50:00.000Z","fetched_at":"2026-11-14 17:00:02","lang_orig":"it","category":null,"athletes":"Melanie Meillard,Tommy Sala","athlete_nations":["ITA","SUI"],"also_sources":[],"norwegian":false},{"id":145959,"source_name":"SkinEWS","country":"SUI","title_no":"Bittert – VM-vinteren er over for Melanie Meillard","title_orig":"Bitter – für Melanie Meillard ist der WM-Winter zu Ende","summary_no":"En trist slutt for Melanie Meillard, som ikke får fullføre VM-vinteren.","spik_no":"Melanie Meillard må avslutte VM-sesongen 2026/27 uten et eneste renn etter at hun falt under slalomtreningen i Levi fredag og skadet høyre kne. MR-undersøkelsene lørdag i Genf bekreftet frykten: brudd på begge meniskene og korsbåndsbrudd. For den 28-årige sveitseren fra Neuchâtel er det et bittert tilbakeslag, særlig etter en vellykket sommeroppkjøring og med VM-sesongen i sikte.","url":"https://www.skinews.ch/news/2026/bitter-melanie-meillard/","pub_date":"2026-11-14T15:50:51.000Z","fetched_at":"2026-11-14 16:00:04","lang_orig":"de","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":145999,"source_name":"ORF Sport","country":"AUT","title_no":"Sesongslutt for sveitsiske Meillard","title_orig":"Saisonende für Schweizerin Meillard","summary_no":"Den sveitsiske alpinisten Melanie Meillard er ferdig for sesongen.","spik_no":"Sveitsiske Melanie Meillard er ute av VM-sesongen 2026/27 etter en alvorlig kneskade pådratt under slalomtrening i Levi, bare én dag før sesongstart. MR-undersøkelser i Genf bekreftet brudd på begge meniskene samt et korsbåndsbrudd på høyre kne. Den 28 år gamle teknikeren fra Neuchâtel lå på 16. plass i slalomklassementet forrige sesong. Meillard sier hun kjenner veien tilbake og er fast bestemt på å returnere sterkere.","url":"https://sport.orf.at/stories/3164888/","pub_date":"2026-11-14T15:48:11.000Z","fetched_at":"2026-11-14 16:00:05","lang_orig":"de","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":145590,"source_name":"Neveitalia","country":"ITA","title_no":"Lara med litt anger: «På trening går jeg mye raskere – nå må jeg ta det med i konkurransen»","title_orig":"Lara, questa volta un po' di rammarico c'è: \"In allenamento sto andando molto più forte, ma devo portarlo in gara\"","summary_no":"Lara innrømmer en viss skuffelse etter konkurransen og sier at treningsformen hennes er langt bedre enn det hun viser i renn.","spik_no":"Lara Colturi innrømmer en viss skuffelse etter andreplass i Levi-slalåmen, som ble vunnet av Emma Aicher, og sier at treningsformen hennes er langt bedre enn det hun klarer å vise i konkurransene. Den Albania-representerende italienskfødte utøveren, som trener under faren Cristian Colturies veiledning, åpnet sesongen med andreplass i Sölden – ett hundredels sekund bak seieren. Det er Colturies niende pallplass i verdenscupen uten at seieren lar vente på seg, men to andreplass på de to første rennene i sesongen er likevel et sterkt utgangspunkt.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/lara-questa-volta-un-po-di-rammarico-c-e-in-allenamento-sto-andando-molto-piu-forte-ma-devo-portarlo-in-gara","pub_date":"2026-11-14T15:20:00.000Z","fetched_at":"2026-11-14 15:30:02","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER"],"also_sources":[],"norwegian":false},{"id":145240,"source_name":"Neveitalia","country":"ITA","title_no":"Vinatzer bekrefter at Sala må opereres: «Veldig synd for Tommy»","title_orig":"Vinatzer conferma l'intervento necessario per Sala: \"Dispiace tanto per Tommy\": gli azzurri alla vigilia di Levi","summary_no":"Vinatzer bekrefter at lagkameraten Tommy Sala må gjennomgå en operasjon. De italienske alpinistene uttalte seg om situasjonen dagen før rennet i Levi.","spik_no":"Italias slalåmtalent Alex Vinatzer bekrefter at lagkamerat Tommy Sala må opereres etter en kneskade han pådro seg for seks dager siden. Vinatzer selv stiller til start med startnummer 17 i Levis slalåmåpning, og beskrives av de italienske trenerne som i god form etter en lovende innsats i storslalåmen i Sölden. Sala er en av Italias yngre slalåmhåp, og fraværet hans svekker et allerede begrenset italiensk mannskap i en av alpinistenes sterkeste grener.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/vinatzer-conferma-l-intervento-necessario-per-sala-dispiace-tanto-per-tommy-gli-azzurri-alla-vigilia-di-levi","pub_date":"2026-11-14T14:45:00.000Z","fetched_at":"2026-11-14 15:00:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":144731,"source_name":"SkinEWS","country":"SUI","title_no":"Emma Aicher kjørte til sin første slalomseier","title_orig":"Emma Aichers fährt zum ersten Slalom-Sieg","summary_no":"Tyske Emma Aicher tok sin aller første seier i slalom i verdenscupen.","spik_no":"Tyske Emma Aicher vant slalomrennet i Levi og tok dermed sin aller første verdenscupseier i en teknisk disiplin. Bak henne fulgte Lara Colturi for Albania og Østerrikes Katharina Truppe på podiet. Aicher har tidligere vist seg frem i fartsdisiplinene, og seieren i Levi bekrefter at 23-åringen er en allsidig utøver med potensialet til å kjempe om sammenlagtseieren i verdenscupen.","url":"https://www.skinews.ch/video/2026/aichers-faehrt-ersten/","pub_date":"2026-11-14T14:11:28.000Z","fetched_at":"2026-11-14 14:15:03","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi","athlete_nations":["ALB","AUT","GER"],"also_sources":[],"norwegian":false},{"id":144715,"source_name":"Neveitalia","country":"ITA","title_no":"Ett år etter første pallplass i slalom er Levi enda søtere for super-Aicher: «En flott bursdagsgave»","title_orig":"Un anno dopo il primo podio in slalom qui, Levi è ancora più dolce per Super Aicher: \"Un gran regalo di compleanno\"","summary_no":"Emma Aicher vant i Levi, ett år etter sin første pallplass på samme sted, og beskriver seieren som en drømmemessig bursdagsgave.","spik_no":"Emma Aicher vant slalomrennet i Levi nøyaktig ett år etter sin aller første pallplass i slalom på samme sted, og beskriver seieren som en drømmemessig bursdagsgave – hun fylte 23 år dagen før rennet. Den bayerske løperen ledet etter første omgang og vant til slutt foran Lara Colturi med 0,43 sekunder på den krevende og islagte Levi Black-løypa. Aicher og Colturi har begge stått på pallen i begge verdenscuprennene denne sesongen, og Aicher er nå en av favorittene til sammenlagtseieren.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-anno-dopo-il-primo-podio-in-slalom-qui-levi-e-ancora-piu-dolce-per-super-aicher-un-gran-regalo-di-compleanno","pub_date":"2026-11-14T14:10:00.000Z","fetched_at":"2026-11-14 14:15:02","lang_orig":"it","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":144695,"source_name":"Ski Racing","country":"INT","title_no":"Emma Aicher vinner første verdenscupslalom i Levi","title_orig":"Emma Aicher Wins First World Cup Slalom in LeviLevi Slalom Women","summary_no":"Emma Aicher tok sin første verdenscupseier i slalom etter en sterk kjøring i Levi.","spik_no":"Emma Aicher feiret sin 23-årsdag med å vinne sitt første verdenscupslalomrenn i Levi, Finland, og slo Albanias Lara Colturi med 0,43 sekunder på den krevende og islagte Levi Black-løypa. Levi har en særlig plass i Aichers karriere: hun debuterte i verdenscupen nettopp her, tok sin første slalompallplass på samme sted forrige sesong, og returnerte nå for å vinne. Katharina Truppe fra Østerrike ble nummer tre. Aicher og Colturi har nå begge stått på pallen i begge damenes verdenscuprenn denne sesongen, etter podiumsplasseringene i storslalåmen i Sölden.","url":"https://skiracing.com/emma-aicher-levi-slalom-2026/","pub_date":"2026-11-14T14:04:06.000Z","fetched_at":"2026-11-14 14:15:01","lang_orig":"en","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi","athlete_nations":["ALB","AUT","GER"],"also_sources":[],"norwegian":false},{"id":144367,"source_name":"Neveitalia","country":"ITA","title_no":"Samme Levi-resultat for Italia-kvinnene – Sola fornøyd, Della Mea skuffet","title_orig":"La \"solita\" Levi per l'Italdonne, ma sorride una positiva Sola: \"Buona partenza\". Della Mea: \"Non sono soddisfatta\"","summary_no":"Det italienske kvinnelaget leverte et kjent bilde i Levi. Sola var positiv til starten, mens Della Mea uttrykte misnøye med egen prestasjon.","spik_no":"Det italienske kvinnelaget leverte nok en gang et blandet resultat i Levi-slalåmen, der Beatrice Sola var beste italiener på 19.-plass med startnummer 50 — for tredje gang i karrieren har hun hentet poeng med et høyt startnummer. Martina Peterlini, som historisk har trives godt i Levi, var den eneste av de ni italienske utøverne som ikke var fast på verdenscuplaget. Luca Della Mea var derimot åpent misfornøyd med sin prestasjon, mens Peterlini selv valgte å se det positive etter å ha returnert fra en ny kneopérasjon.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/la-solita-levi-per-l-italdonne-ma-sorride-una-positiva-sola-buona-partenza-della-mea-non-sono-soddisfatta","pub_date":"2026-11-14T13:40:00.000Z","fetched_at":"2026-11-14 13:45:01","lang_orig":"it","category":null,"athletes":"Marta Rossetti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":147154,"source_name":"Sportschau","country":"GER","title_no":"Dameslaløm i Levi i re-live","title_orig":"Slalom der Frauen in Levi im Re-Live","summary_no":"Se dameslalømet i Levi på nytt i re-live.","spik_no":"Dameslalømet i Levi åpner verdenscupsesongen i alpint, slik tradisjonen tilsier – den finske byen nord for polarsirkelen har vært fast vertskap for sesongåpningen i slaløm siden tidlig 2000-tall. Levi er kjent for sine krevende lysforhold og utfordrende snøforhold tidlig i november, noe som gjør løpet til en test på form og forberedelse snarere enn fullt gjennomkjørt sesongform. Rennet gir de første verdifulle poengenevmed tanke på det samlede verdenscupregnslapet.","url":"https://www.sportschau.de/regional/br/br-erster-weltcup-sieg-im-slalom-aicher-jubelt-in-levi-106.html","pub_date":"2026-11-14T13:18:21.000Z","fetched_at":"2026-11-14 17:30:07","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":144325,"source_name":"franceinfo","country":"FRA","title_no":"Aicher tok første slalåmstart – Chevrier og Lamure i topp 7","title_orig":"Le premier slalom de la saison de Coupe du monde pour Emma Aicher, Tops 7 pour les Françaises Marion Chevrier et Marie Lamure","summary_no":"Emma Aicher gjennomførte sin første verdenscupslalåm denne sesongen, mens franske Marion Chevrier og Marie Lamure begge endte på topp 7.","spik_no":"Emma Aicher vant sitt første slalåmrenn i verdenscupen da hun tok seieren i Levi i Finland lørdag – dette var også hennes første slalåmstart denne sesongen. Den unge tyske alpinisten dro fordel av at Mikaela Shiffrin var fraværende. For Frankrike var det grunn til optimisme: Marion Chevrier og Marie Lamure endte begge blant de syv beste, noe som lover godt for det franske slalåmlaget videre i sesongen.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/le-premier-slalom-de-la-saison-de-coupe-du-monde-pour-emma-aicher-tops-7-pour-les-francaises-marion-chevrier-et-marie-lamure_8282492.html#xtor=RSS-3-%5Bsports%2Fsports-d-hiver%2Fski-alpin%5D","pub_date":"2026-11-14T13:18:16.000Z","fetched_at":"2026-11-14 13:30:05","lang_orig":"fr","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":144076,"source_name":"ORF Sport","country":"AUT","title_no":"Truppe klatret seg opp på slalompallen","title_orig":"Truppe katapultiert sich auf Slalom-Podest","summary_no":"Truppe sikret seg en pallplass i slalomrennet med en imponerende kjøring.","spik_no":"Katharina Truppe tok en sterk tredjeplass i åpningsslalomen i Levi, bare 0,07 sekunder bak andreplassen til Lara Colturi. Den 30 år gamle kärntnerindene kjørte beste tid i finaleomgangen og halvert dermed rykket fra halvtidsfemteplassen. Det er hennes syvende pallplass totalt i verdenscupen, og det er påfallende at nettopp Levi var stedet der hun for syv år siden tok sin aller første pallplass. Hennes hittil eneste verdenscupseier kom i Åre i mars 2025.","url":"https://sport.orf.at/stories/3164871/","pub_date":"2026-11-14T13:12:22.000Z","fetched_at":"2026-11-14 13:15:08","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi,Mikaela Shiffrin","athlete_nations":["ALB","AUT","GER","USA"],"also_sources":[],"norwegian":false},{"id":144158,"source_name":"Sportschau","country":"GER","title_no":"Første slalomseier – Aicher jubler i Levi","title_orig":"Erster Slalom-Sieg - Aicher jubelt in Levi","summary_no":"Aicher tok sin første slalomseier i Levi i en sterk prestasjon.","spik_no":"Emma Aicher tok sin første slalomseier i Levi lørdag, 43 hundredeler foran Lara Colturi. Den tyske alpinisten startet med startnummer én og holdt teten gjennom begge omganger i fraværet av slalomdominator Mikaela Shiffrin. Aicher, som representerer DSV, har tidligere vist lovende form i tekniske disipliner og omtalte kjøringen med startnummer én som nesten identisk med trening. Seieren er hennes første i slalåm, og hun noterer seg dermed for sin sjette verdenscupseier totalt.","url":"https://www.sportschau.de/wintersport/ski-alpin/erster-slalom-sieg-aicher-jubelt-in-levi,ski-alpin-levi-erster-slalom-sieg-emma-aicher-100.html","pub_date":"2026-11-14T13:08:26.000Z","fetched_at":"2026-11-14 13:15:09","lang_orig":"de","category":null,"athletes":"Emma Aicher,Mikaela Shiffrin","athlete_nations":["GER","USA"],"also_sources":[],"norwegian":false},{"id":144077,"source_name":"ORF Sport","country":"AUT","title_no":"Truppe tok tredjeplass da Aicher vant i Levi","title_orig":"Truppe Dritte bei Aicher-Sieg in Levi","summary_no":"Aicher vant slalomrennet i Levi, mens Truppe endte på tredjeplass.","spik_no":"Katharina Truppe kjørte seg opp fra femteplass til tredjeplass med beste tid i finaleomgangen i Levis åpningsslalom, og sikret dermed sin åttende pallplass i verdenscupen. Emma Aicher vant rennet med 0,43 sekunder foran Lara Colturi, som starter for Albania, mens Truppe lå ytterligere 0,07 sekunder bak. Det var en oppløftende sesongstart for den 30 år gamle østerrikeren, som tok sin hittil eneste verdenscupseier i Åre i mars 2025.","url":"https://sport.orf.at/stories/3164877/","pub_date":"2026-11-14T13:01:45.000Z","fetched_at":"2026-11-14 13:15:08","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi","athlete_nations":["ALB","AUT","GER"],"also_sources":[],"norwegian":false},{"id":143863,"source_name":"SkinEWS","country":"SUI","title_no":"Emma Aicher tok sin første slalåmseier","title_orig":"Erster Slalom-Erfolg für Emma Aicher","summary_no":"Emma Aicher sikret seg sin aller første verdenscupseier i slalåm.","spik_no":"Emma Aicher vant slalåmen i Levi og tok dermed sin aller første verdenscupseier i en teknisk disiplin. Den tyske alpinisten slo Lara Colturi fra Albania med 0,43 sekunder, mens Katharina Truppe tok tredjeplassen. Rennet markerte et historisk brudd i Levi: for første gang siden 2016 vant noen andre enn Mikaela Shiffrin eller Petra Vlhová en slalåm der — etter henholdsvis åtte og seks seire for de to. Shiffrin stilte ikke til start, mens Vlhová var tilbake etter lang skadepause.","url":"https://www.skinews.ch/news/2026/erster-slalom-erfolg/","pub_date":"2026-11-14T12:55:52.000Z","fetched_at":"2026-11-14 13:00:06","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi,Mikaela Shiffrin,Petra Vlhová","athlete_nations":["ALB","AUT","GER","SVK","USA"],"also_sources":[],"norwegian":false},{"id":143904,"source_name":"ORF Sport","country":"AUT","title_no":"Truppe tok tredjeplass etter Aichers seier i Levi","title_orig":"Truppe Dritte bei Aicher-Sieg in Levi","summary_no":"Katharina Truppe endte på tredjeplass i Levi, der Emma Aicher tok seieren i slalåmrennet.","spik_no":"Katharina Truppe tok tredjeplass i sesongåpningens slalåm i Levi, der tyske Emma Aicher vant foran albanske Lara Colturi. Den 30 år gamle østerrikeren fra Kärnten kjørte andredrag med løypens beste tid og avanserte fra femteplass til pallen — hennes åttende pallplass totalt i verdenscupen. Truppe er en erfaren slalåmspesialist som jevnlig har vært i nærheten av pallen, men uten å ha vunnet en verdenscupseier. Landslagskollega Katharina Huber endte på niendeplass som nest beste østerrikske.","url":"https://sport.orf.at/stories/3164875/","pub_date":"2026-11-14T12:54:45.000Z","fetched_at":"2026-11-14 13:00:07","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi","athlete_nations":["ALB","AUT","GER"],"also_sources":[],"norwegian":false},{"id":143847,"source_name":"Neveitalia","country":"ITA","title_no":"Aicher slo Colturi og vant slalåm i Levi","title_orig":"Emma Aicher respinge Lara Colturi, a Levi la tedesca si prende anche il primo trionfo in slalom!","summary_no":"Emma Aicher holdt Lara Colturi bak seg og vant sitt første slalåmrenn i Levi.","spik_no":"Emma Aicher vant slalåmen i Levi og holdt Lara Colturi bak seg, noe som også betyr at albaneren fremdeles venter på sin første verdenscupseier. Aicher er en ung tysk allroundkjører som har markert seg jevnt i verdenscupen de siste sesongene, og seieren i Levi er hennes gjennombrudd i slalåm. Det var over et tiår siden en annen utøver enn Shiffrin eller Vlhová vant på Levi Black. Australske Hoffman overrasket med en sterk plassering, mens sveitsiske Holdener og Rast skuffet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/emma-aicher-respinge-lara-colturi-a-levi-la-tedesca-si-prende-anche-il-primo-trionfo-in-slalom","pub_date":"2026-11-14T12:50:00.000Z","fetched_at":"2026-11-14 13:00:04","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi,Mikaela Shiffrin,Petra Vlhová","athlete_nations":["ALB","GER","SVK","USA"],"also_sources":[],"norwegian":false},{"id":143557,"source_name":"ORF Sport","country":"AUT","title_no":"Herzog imponerer ved verdenscupåpningen i Peking","title_orig":"Herzog glänzt bei Weltcup-Auftakt in Peking","summary_no":"Herzog leverte en strålende prestasjon under verdenscupåpningen i Peking.","spik_no":"Den østerrikske skøyteløperen Vanessa Herzog imponerte stort ved verdenscupåpningen i Peking, der hun rykket opp fra B-gruppen til A-gruppen på tre distanser i løpet av 24 timer – noe som ifølge ektemannen og treneren Thomas Herzog aldri tidligere er blitt gjort av en kvinnelig løper. Hun vant 500-meterrennet på 38,19 sekunder og ble nummer to på 1500 meter, kun 17 hundredeler bak seieren. Herzog, kåret til Østerrikes beste idrettsutøver i 2019, har de siste sesongene slitt med alvorlige ryggproblemer. Comebacket i Peking er derfor ekstra bemerkelsesverdig.","url":"https://sport.orf.at/stories/3164874/","pub_date":"2026-11-14T12:23:22.000Z","fetched_at":"2026-11-14 12:30:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":142636,"source_name":"Neveitalia","country":"ITA","title_no":"Aicher-Colturi leder, Ljutic og Rast truer – slalomavgjørelsen i Levi nærmer seg","title_orig":"Aicher-Colturi, poi Ljutic e la furia di Rast: si decide lo slalom di Levi, Della Mea, Sola e Peterlini in corsa per l'Italia","summary_no":"Aicher-Colturi er i tet foran Ljutic og en form for Rast i Levi-slalåmen. Italienske håp hviler på Della Mea, Sola og Peterlini.","spik_no":"Lara Colturi leder etter første omgang i slalåmen i Levi, med 36 hundredeler ned til tyske Emma Aicher, mens Zrinka Ljutic og Camille Rast også truer om pallplass. Colturi, som fyller 20 år i løpet av renndagen, representerer Albania og har allerede fem annenplasser i verdenscupen – nå jager hun sin første seier. Aicher søker på sin side sin aller første verdenscupseier i slalåm. Også Petra Vlhova er i nærheten av pallen, mens de italienske håpene hviler på Della Mea, Sola og Peterlini.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/aicher-colturi-poi-ljutic-e-la-furia-di-rast-si-decide-lo-slalom-di-levi-della-mea-sola-e-peterlini-in-corsa-per-l-italia","pub_date":"2026-11-14T11:10:00.000Z","fetched_at":"2026-11-14 11:15:02","lang_orig":"it","category":null,"athletes":"Camille Rast,Emma Aicher,Lara Colturi,Martina Peterlini,Zrinka Ljutic","athlete_nations":["ALB","CRO","GER","ITA","SUI"],"also_sources":[],"norwegian":false},{"id":142443,"source_name":"Ski Racing","country":"INT","title_no":"Aicher leder Levi-slalåmen – Hoffman imponerte fra startnummer 57","title_orig":"Aicher Leads Levi Slalom as Hoffman Surges From Bib 57","summary_no":"Aicher tok ledelsen i slalåmen i Levi, mens Hoffman gjennomførte en sterk kjøring fra startnummer 57.","spik_no":"Emma Aicher leder etter første omgang i sesongåpningens slalåm i Levi, 0,36 sekunder foran Lara Colturi, med Zrinka Ljutić på tredjeplass. Aicher, 23 år gamle og firedobbel disiplinstjerne for Tyskland, endte som nummer to sammenlagt i forrige sesongs verdenscup, men har ennå ikke vunnet en slalåm til tross for fem pallplasseringer. Colturi, som representerer Albania og bare er 19 år, er i samme situasjon med fem pallplasseringer uten seier. Fraværet av regjerende slalåmdronning Mikaela Shiffrin åpner dermed for at en av de to lederne kan ta sin aller første verdenscupseier i disiplinen. Australske Madison Hoffman imponerte med en sterk kjøring fra startnummer 57 og klatret opp til 13. p pallen i slalåmkonkurransen.","spik_no":"I første omgang av sesongåpningsslalåmen i Levi leder tyske Emma Aicher, 0,36 sekunder foran Lara Colturi fra Albania – i fravær av stjernen Mikaela Shiffrin. Østerrikernes beste håp er Katharina Truppe på femteplass, 1,05 sekunder bak Aicher, fulgt av landskvinnen Katharina Huber åtte hundredeler bak. Truppe begikk en kostbar feil tidlig i løypa og innrømmer at feilen kom på verst tenkelige sted, men er optimistisk foran annen omgang. Kroatiske Zrinka Ljutic er tredje halvveis og er blant de sterkeste utfordrerne til pallplass.","url":"https://sport.orf.at/stories/3164864/","pub_date":"2026-11-14T10:07:25.000Z","fetched_at":"2026-11-14 10:15:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Huber,Katharina Truppe,Lara Colturi,Mikaela Shiffrin,Zrinka Ljutic","athlete_nations":["ALB","AUT","CRO","GER","USA"],"also_sources":[],"norwegian":false},{"id":141775,"source_name":"Neveitalia","country":"ITA","title_no":"Aicher imponerte i Levi – kun Colturi nær bavareren etter første omgang","title_orig":"Aicher perfetta, solo Colturi resta vicina alla bavarese dopo la 1^ di Levi: out Moltzan, pagano Rast e Holdener","summary_no":"Aicher leverte en strålende kjøring i første omgang i Levi, med kun Colturi tett bak. Moltzan røk ut, mens Rast og Holdener betalte en høy pris.","spik_no":"Emma Aicher leverte en imponerende første omgang i Levi-slalåmen og leder med 36 hundredeler foran Lara Colturi, mens Zrinka Ljutic er best av de øvrige. Aicher, som nettopp fylte 23 år, er en av de store favorittkandidatene til verdenscupen sammenlagt denne sesongen, særlig med Mikaela Shiffrin fraværende. Amerikaneren Paula Moltzan røk ut, og erfarne navn som Wendy Holdener og Rahel Rast ligger mer enn ett sekund bak lederen etter første omgang.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/aicher-perfetta-solo-colturi-resta-vicina-alla-bavarese-dopo-la-1-di-levi-out-moltzan-pagano-rast-e-holdener","pub_date":"202 title_orig":"Iga Swiatek Joins Mikaela Shiffrin to Talk Pressure, Perspective and Finding Joy","summary_no":"Tennisstjernen Iga Swiatek og alpinisten Mikaela Shiffrin har møttes for en samtale om det å håndtere press og finne glede i idretten.","spik_no":"Mikaela Shiffrin har invitert tennisstjernen Iga Swiatek til sin podkast «What's the Point» for en samtale om press, forventninger og glede i toppidrett. Swiatek, som har vunnet seks Grand Slam-titler og tok OL-bronse i Paris, beskriver blant annet sin semifinalenederlag i Paris-OL som karrierens største drama. Begge utøverne er kjent for å håndtere enormt press fra omgivelsene, og samtalen berører temaer som identitet, mentalt overskudd og det å finne mening i konkurransen utover resultatene.","url":"https://skiracing.com/iga-swiatek-joins-mikaela-shiffrin-to-talk-pressure-perspective-and-finding-joy/","pub_date":"2026-11-13T16:03:49.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":140132,"source_name":"Neveitalia","country":"ITA","title_no":"Silvaplana er treningsbase for Tabanelli, Gasslitter og Donaggio før Innsbruck-åpningen","title_orig":"Silvaplana è sede degli ultimi allenamenti pre opening di Innsbruck per Flora e Miro Tabanelli, Gasslitter e Donaggio","summary_no":"Flora og Miro Tabanelli, Gasslitter og Donaggio gjennomfører de siste treningene i Silvaplana før sesongåpningen i Innsbruck.","spik_no":"Det italienske freeski-landslaget bruker Silvaplana i Sveits som treningsbase frem mot sesongåpningen i Innsbruck 26.–27. november, der Big Air-konkurransen åpner Freestyle-verdenscupen 2026/27. Kvartetten Flora og Miro Tabanelli, Leonardo Donaggio og Maria Gasslitter samles fra 15. til 22. november under ledelse av teknisk direktør Bartolomeo Pala og trenerne Valentino Mori og Mattia Fabrinetti. Big Air under kunstig belysning i Innsbruck er en ny innslag i verdenscupkalenderen, og de i resultatrekke i helgens slalomrenn.","spik_no":"Lena Dürr og Emma Aicher reiser til Levi med gode minner og store ambisjoner foran helgens slalomrenn. Dürr har stått på pallen i Levi hele fem ganger og er blant de mest konsekvente slalomkjørerne på verdenscupturen, mens Aicher tok sitt første slalompodium i Levi forrige sesong. Begge utnytter banens flate partier særlig godt med sin teknisk stilrene kjøring, og den finske løypa «Levi Black» passer begge utøvernes stil.","url":"https://www.sportschau.de/regional/br/br-levi-als-gutes-omen-dsv-duo-will-erfolgsserie-fortsetzen-102.html","pub_date":"2026-11-12T14:57:06.000Z","fetched_at":"2026-11-14 07:45:06","lang_orig":"de","category":null,"athletes":"Emma Aicher,Lena Dürr","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":140269,"source_name":"Sportschau","country":"GER","title_no":"Her er alpinsportens stoppesteder denne sesongen","title_orig":"Wo Ski Alpin in dieser Saison Station macht","summary_no":"En oversikt over alle arenaer og lokasjoner der alpint World Cup-sirkuset setter opp renn i løpet av den kommende sesongen.","spik_no":"Alpinverdenscupen 2026/27 byr på totalt 94 renn fra slutten av oktober til slutten av mars, med sesongstart på Rettenbachbreen i Sölden — slik tradisjonen tilsier. Etter Levi-åpningen i november venter klassikere som Wengen og Kitzbühel, før sesongens store høydepunkt blir VM i Crans-Montana i Sveits. Sesongfinalen arrangeres i Sun Valley i USA.","url":"https://www.sportschau.de/wintersport/ski-alpin/wo-ski-alpin-in-dieser-saison-station-macht,weltcup-orte-ski-alpin-100.html","pub_date":"2026-11-12T14:40:20.000Z","fetched_at":"2026-11-14 07:45:06","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140147,"source_name":"SkinEWS","country":"SUI","title_no":"Nok et nytt ansikt dukker opp i Levi","title_orig":"Ein weiteres „neues Gesicht“ taucht in Levi auf","summary_no":"En ny utøver gjør sin entre på verdens miljøer som kjenner merket best fra frikjøring og fottøy. Lauren Samuels og Tyler Theis leder satsingen, der Theis reiser rundt til lokale renn og utstyrskvelder for å bygge relasjoner med trenere og familier. Salomon var lenge en dominant kraft i alpinracing – blant annet kjørte Ingemar Stenmark på Salomon-ski – og merket ønsker nå å gjenvinne fotfeste blant neste generasjons racere i USA og Canada.","url":"https://skiracing.com/salomons-next-chapter-in-north-american-racing-starts-with-the-next-generation/","pub_date":"2026-11-11T20:55:21.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":139778,"source_name":"Ski Racing","country":"INT","title_no":"Hva FIS' nye klimaveiledning betyr for alpint","title_orig":"Preparing the Mountain: What New FIS Climate Guidance Means for Alpine Racing","summary_no":"FIS har utgitt ny klimaveiledning som vil påvirke hvordan alpinbakker forberedes og gjennomføres i fremtiden.","spik_no":"FIS og Verdens meteorologiorganisasjon (WMO) har gitt ut en ny felles rapport om hvordan skisentre og arrangører kan bruke vær- og klimainformasjon til å forberede løyper, forvalte ressurser og planlegge fremtidige investeringer. Rapporten kom 3. november og følges av en kortere praktisk veileder. Bakgrunnen er alvorlig: ifølge FIS' egne beregninger ble 25 verdenscuprenn avlyst på grunn av dårlig vær i sesongen 2025–26. Klimautfordringene rammer steder ulikt – fra Levi i Finland til Beaver Creek i Colorado – men felles for alle er problemet med å klargjøre en løype til en fastsatt dato under forhold man ikke kan kontrollere.","url":"https://skiracing.com/preparing-the-mountain-what-new-fis-climate-guidance-means-for-alpine-racing/","pub_date":"2026-11-11T19:34:14.000Z","fetched_at":"2026-11-11 19:45:04","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122476,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen vinner igjen og åpner svensk trippel i andre slalåm i Storklinten – Hansson og Wissting på pallen","title_orig":"Jakobsen cala il bis e apre la tripletta svedese nel secondo slalom a Storklinten: sul podio anche Hansson e Wissting","summary_no":"Jakobsen doblet seg med ny seier i Storklinten og sørget for svensk trippel på pallen, foran Hansson og Wissting.","spik_no":"Kristoffer Jakobsen vant begge FIS-slalåmrennene i Storklinten og sørget for svensk trippel i søndagens renn, der Hansson og Wissting fulgte på pallen. Den 32 år gamle svenske spesialisten hadde en tung Verdenscup-sesong i fjor der han knapt scoret poeng, men viser nå sterk form en uke før sesongåpningen i Levi. Belgiernes Armand Marchant, som nesten tok sin første seier i Gurgl forrige sesong, deltok bare i lørdagens renn og endte da som toer, over ett sekund bak Jakobsen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/jakobsen-cala-il-bis-e-apre-la-tripletta-svedese-nel-secondo-slalom-a-storklinten-sul-podio-anche-hansson-e-wissting","pub_date":"2026-11-08T10:35:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":"sportslig","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122453,"source_name":"Ski Racing","country":"INT","title_no":"Møt Lionel Agoutin – mannen bak Ski World Cup-bannerne","title_orig":"Meet Lionel Agoutin, the Man Behind the Ski World Cup Banners","summary_no":"Lionel Agoutin er personen som lager de ikoniske bannerne langs traseen under alpinske verdenscuprenn.","spik_no":"Lionel Agoutin er mannen bak de fargerike bannerne som preger tribunene under alpinske verdenscuprenn verden over. Den franske entusiasten driver Alpine Ski World Cup Fan Community og lager bannerne selv – med nasjonale teamfarger og portretter av utøvere fra hele startfeltet. Bannerne er ikke et kommersielt produkt fra FIS eller forbundene, men resultatet av én manns dedikasjon til sporten og fellesskapet rundt den. Agoutin er et kjent ansikt i verdenscupen og har blant annet blitt fotografert sammen med stjerner som Lindsey Vonn.","url":"https://skiracing.com/meet-lionel-agoutin-the-man-behind-the-ski-world-cup-banners/","pub_date":"2026-11-06T20:19:31.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":"goy","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":103287,"source_name":"Neveitalia","country":"ITA","title_no":"SC Courmayeur tar imot Brignone igjen: – En forelder holder alltid døren åpen","title_orig":"\"Un genitore lascia sempre la porta aperta, Fede è rimasta la ragazza che ama sciare in libertà\": lo S.C. Courmayeur riaccoglie Brignone","summary_no":"Federica Brignone ønskes velkommen tilbake til skiklubben SC Courmayeur, som beskriver henne som jenta som alltid har elsket å stå fritt på ski.","spik_no":"Federica Brignones hjemklubb SC Courmayeur ønsker henne hjertelig velkommen tilbake og beskriver henne som «jenta som alltid har elsket å stå fritt på ski». Nyheten kommer dagen etter at Brignone kunngjorde at hun forlater sin stilling i Carabinieri, den italienske militærenheten mange alpinister er tilknyttet. Den 34-årige alpinisten fra La Salle er Italias mestvinnende utøver gjennom tidene med to olympiske gull og over 30 verdenscupseire, og er nå i gang med oppkjøringen mot en ny comeback-sesong etter skade.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-genitore-lascia-sempre-la-porta-aperta-fede-e-rimasta-la-ragazza-che-ama-sciare-in-liberta-lo-sc-courmayeur-riaccoglie-brign","pub_date":"2026-11-03T11:25:00.000Z","fetched_at":"2026-11-03 11:30:02","lang_orig":"it","category":"naert","athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":100827,"source_name":"RTV SLO","country":"SLO","title_no":"Houthi-raketter tvang asiatisk mesterskap fra januar til desember 2027","title_orig":"Rakete hutijev prestavile azijsko prvenstvo z januarja na december 2027","summary_no":"Asiatisk mesterskap i alpint er blitt flyttet fra januar til desember 2027 som følge av houthi-rakettangrep.","spik_no":"Det asiatiske alpinmesterskapet er flyttet fra januar til desember 2027 på grunn av houthi-rakettangrep i regionen. Houthi-bevegelsen i Jemen har siden 2023 gjennomført en rekke angrep mot skip og mål i Rødehavet og omkringliggende områder, noe som har skapt usikkerhet og sikkerhetsproblemer for arrangementer i nærheten. Det er uvanlig at geopolitiske konflikter direkte påvirker internasjonale alpinarrangementer, og beslutningen understreker hvor stor rekkevidden av konflikten har blitt.","url":"https://www.rtvslo.si/sport/rakete-hutijev-prestavile-azijsko-prvenstvo-z-januarja-na-december-2027/798849","pub_date":"2026-11-03T07:07:24.000Z","fetched_at":"2026-11-03 07:30:05","lang_orig":"sl","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":76731,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn klar for siste operasjon: – Mentalt tøff nedtelling","title_orig":"\"Countdown duro mentalmente, tra meno di due settimane mi opero\": Lindsey Vonn verso l'ultimo intervento alla gamba","summary_no":"Lindsey Vonn skal operere benet om mindre enn to uker og beskriver ventetiden som mentalt krevende.","spik_no":"Lindsey Vonn er klar for det hun beskriver som sin siste operasjon, og sier ventetiden på under to uker er mentalt krevende. Inngrepet innebærer fjerning av skruer og plater i venstre tibia, samt en operasjon på korsbåndet. Vonn, som er en av tidenes mestvinnende alpinister med 82 verdenscupseirer og OL-gull i utfor fra 2010, har tilbrakt store deler av 2026 med rehabilitering etter en alvorlig skade hun pådro seg tidligere i år. I høst har hun jobbet intenst i treningssalen for å styrke muskulaturen før det avsluttende inngrepet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/countdown-duro-mentalmente-tra-meno-di-due-settimane-mi-opero-lindsey-vonn-verso-l-ultimo-intervento-alla-gamba","pub_date":"2026-10-28T13:30:00.000Z","fetched_at":"2026-10-28 13:45:02","lang_orig":"it","category":"nyheter","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":59459,"source_name":"ORF Sport","country":"AUT","title_no":"Rennkalenderen skaper igjen debatt","title_orig":"Rennkalender sorgt erneut für Diskussionen","summary_no":"Alpinski-rennkalenderen er nok en gang gjenstand for diskusjon blant utøvere og organisasjoner.","spik_no":"Verdenscupkalenderen for alpint 2026/27 inneholder 40 renn for kvinner og 43 for menn, men balansen mellom fart- og teknikkøvelser er igjen skjev – særlig for kvinner, der teknikkrenn dominerer klart. Østerrike er største vertsland med 15 verdenscupavdelinger, inkludert en ny stopp i Dachstein West/Gosau. Østerriksk dametrener Johannes Zöchling peker på at logistikk og mange motstridende interesser gjør kalenderarbeidet svært krevende, og beklager at det ikke er fartshjemerenn for østerrikske kvinner denne vinteren.","url":"https://sport.orf.at/stories/3163844/","pub_date":"2026-10-24T07:43:47.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":48079,"source_name":"Neveitalia","country":"ITA","title_no":"Atomic og Braathen sammen til 2030 – sikter mot den store krystallkulen","title_orig":"Atomic e Lucas Pinheiro Braathen assieme sino al 2030: il prossimo obiettivo è la sfera di cristallo assoluta","summary_no":"Atomic og Lucas Pinheiro Braathen har forlenget samarbeidet til 2030, med den sammenlagte verdenscupseieren som neste store mål.","spik_no":"Lucas Pinheiro Braathen og utstyrsmerket Atomic har forlenget samarbeidet sitt frem til 2030, med den store krystallkulen – sammenlagttittelen i verdenscupen – som overordnet mål. Braathen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåm kt på ski og mener den ikke er rettferdig.","spik_no":"Amerikanske Breezy Johnson, olympisk mester og verdensmester i utforkjøring, stiller spørsmål ved rettferdigheten i FIS' nye regel om minimumsvekt på racingski. Johnson sier at sommertrening på myk og jevn snø ikke har avslørt noen merkbar forskjell med de nye skiene, men understreker at renn på tøffe verdenscupbakker er en helt annen sak. Hun er særlig bekymret for regelens begrunnelse og mener den rammer et lite antall utøvere uforholdsmessig hardt. Johnson, som kjører på Atomic-ski for det amerikanske Stifel-laget, planlegger mer testing på Copper Mountain frem mot sesongstart.","url":"https://skiracing.com/breezy-johnson-fis-ski-weight-rule/","pub_date":"2026-10-14T17:48:11.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"en","category":"naert","athletes":"Breezy Johnson","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":30501,"source_name":"SVT Sport","country":"SWE","title_no":"Kristoffer Jakobsen vil rette opp feilene – ved å gå tilbake til røttene","title_orig":"Kristoffer Jakobsens uråkningar ska bort – genom att backa i tiden","summary_no":"Kristoffer Jakobsen jobber med å eliminere sine tekniske feil ved å gå tilbake til grunnleggende prinsipper.","spik_no":"Kristoffer Jakobsen har hatt en svært skuffende sesong og gikk ut i første omgang i sju av elleve slalomrenn i fjor. For å komme tilbake til toppform går 32-åringen tilbake til det eksakt samme utstyret han brukte da han ledet slalomcupen sammenlagt og var på sitt beste. Et nytt støvelkonsept fra skimerkevaret hans fungerte dårlig, og de svake resultatene har kostet ham mye i rankingen, slik at han neste sesong starter med høyere startnummer. Jakobsen har fire pallplasser i karrieren, den siste fra november 2024.","url":"https://www.svt.se/sport/alpint/kristoffer-jakobsens-urakningar-ska-bort-genom-att-backa-i-tiden","pub_date":"2026-10-14T14:08:51.000Z","fetched_at":"2026-10-14 14:15:04","lang_orig":"sv","category":"nerdin function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';
  if (days <= 45) return '🎿 Forsesong — ' + nxt.venue + ' om ' + days + ' dager';
  return '💤 Sommerpause';
}
document.getElementById('season-badge').textContent = seasonStatus();

function getRace(str) {
  if (!str) return null;
  const d = new Date(str);
  if (isNaN(d)) return null;
  const s = d.toISOString().slice(0,10);
  return RACES.find(r => s >= r.date && s <= r.end) || null;
}

function fmt(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' kl. ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

      ${a.lang_orig && a.lang_orig !== 'no' ? `<span class="lang">${a.lang_orig.toUpperCase()} → NO</span>` : ''}
      ${a.athletes ? `<span style="font-size:10px;color:var(--sportslig)">👤 ${a.athletes.split(',')[0]}</span>` : ''}
      ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
      ${race ? `<span class="race-chip">🏁 ${race.venue}</span>` : ''}
      <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
    </div>
    <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="card-title">${title}</a>
    ${a.summary_no ? `<p class="card-summary">${a.summary_no}</p>` : ''}
    ${a.spik_no ? `<div class="card-spik"><span class="spik-label">📻 SPIK</span><span class="spik-text">${a.spik_no}</span></div>` : ''}
  </div>`;
}

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function render() {
  renderFilterRow();
  const words = norm(searchQ).split(/\s+/).filter(Boolean);
  const pool = words.length && extraLoaded ? ARTICLES_ALL : ARTICLES;
  const visible = pool.filter(a => {
    if (activeCountry === 'INT' ? a.country !== 'INT' : (activeCountry && !(a.athlete_nations || []).includes(activeCountry))) return false;
    if (activeCat && a.category !== activeCat) return false;
    if (activeAthlete && !(a.athletes||'').split(',').map(s=>s.trim()).includes(activeAthlete)) return false;
    if (words.length) {
      const hay = norm([a.title_no, a.title_orig, a.summary_no, a.spik_no, a.athletes, a.source_name, (a.also_sources||[]).join(' '), a.category,
        ...(a.athlete_nations||[]).map(c => c + ' ' + ((NATION_META[c]||[])[1]||''))].filter(Boolean).join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });

  document.getElementById('count').textContent = visible.length + ' saker';

  const feed = document.getElementById('feed');
  feed.innerHTML = visible.length
    ? visible.map(a => cardHtml(a, false)).join('')
    : `<div class="empty">${words.length || activeCountry || activeCat || activeAthlete ? 'Ingen treff' : 'Ingen saker'}</div>`;

  // Spik-liste: vis alle kategoriserte (ufiltrert på land/utøver/søk for sidepanelet, men respekter kategori-filter)
  const spikFilter = activeCat
    ? ARTICLES.filter(a => a.category === activeCat)
    : ARTICLES.filter(a => a.category);

  const spikEl = document.getElementById('spik-list');
  const spikLabel = document.getElementById('spik-label');
  spikLabel.textContent = 'Spik-liste (' + spikFilter.length + ')';

  if (!spikFilter.length) {
    spikEl.innerHTML = '<div class="sidebar-empty">Ingen saker valgt ut ennå</div>';
    return;
  }

  // Grupper etter kategori
  const grouped = {};
  CATS.forEach(c => { grouped[c.id] = []; });
  spikFilter.forEach(a => { if (grouped[a.category]) grouped[a.category].push(a); });

  spikEl.innerHTML = CATS.map(cat => {
    const items = grouped[cat.id];
    if (!items.length) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--${cat.id === 'goy' ? 'goy' : cat.id});padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${cat.label}</div>
      ${items.map(a => cardHtml(a, true)).join('')}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
