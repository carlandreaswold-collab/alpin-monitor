<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>
    <div class="season" id="season-badge"></div>
    <span class="readonly-badge">👁 Lesevisning</span>

    <input class="search-input" type="search" id="search" placeholder="Søk i titler, utøvere…">
    <select class="athlete-select" id="country-select"><option value="">Alle land</option></select>
    <select class="athlete-select" id="athlete-select"><option value="">Alle utøvere</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="main">
  <div id="feed"></div>
  <div class="sidebar">
    <div class="section-label" id="spik-label">Spik-liste</div>
    <div id="spik-list"></div>
  </div>
</div>

<script>
const CATS = [{"id":"viktig","label":"⚡ Viktig"},{"id":"sportslig","label":"🎿 Sportslig"},{"id":"nyheter","label":"📰 Nyhet"},{"id":"goy","label":"😄 Gøy"},{"id":"nerding","label":"🔬 Nerding"},{"id":"kjendis","label":"🌟 Kjendis"},{"id":"naert","label":"🤝 Nært og nyttig"}];
const ARTICLES = [{"id":166145,"source_name":"Ski Racing","country":"INT","title_no":"Jared Goldberg deler sin verdenscupreise på Snowbird","title_orig":"Jared Goldberg Shares His World Cup Journey at Snowbird","summary_no":"Jared Goldberg forteller om sin vei gjennom verdenscupen og hva det betyr å konkurrere på Snowbird.","spik_no":"Jared Goldberg avsluttet sin aktive karriere etter 14 sesonger på verdenscupnivå og er nå tilbake på Snowbird som assistenttrener, primært for utøvere i U14-gruppen. Goldberg vokste selv opp på Snowbird, lærte seg alpint der som fireåring etter at familien flyttet fra Boston til Utah, og ble trent av Bridger Call – som i dag er daglig leder ved Snowbird Sports Education Foundation. I et møte med juniorene oppfordret Goldberg de unge til å fokusere på én dag av gangen fremfor å drømme om OL eller verdenscup, et råd som springer ut av hans egen erfaring som eliteutøver gjennom et og et halvt tiår.","url":"https://skiracing.com/jared-goldberg-shares-his-world-cup-journey-at-snowbird/","pub_date":"2026-11-16T20:57:26.000Z","fetched_at":"2026-11-16 21:00:02","lang_orig":"en","category":null,"athletes":"Jared Goldberg","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":165465,"source_name":"Neveitalia","country":"ITA","title_no":"Klarsignal for Copper Mountain: super-G og storslalåm for menn 28.–29. november","title_orig":"Luce verde per Copper Mountain: il 28-29 novembre super-g e gigante maschili per aprire la campagna americana","summary_no":"Copper Mountain åpner den amerikanske alpinsesonen med super-G og storslalåm for herrer 28. og 29. november.","spik_no":"FIS har bekreftet at Copper Mountain i Colorado arrangerer verdenscuprenn for herrer 28. og 29. november, med super-G og storslalåm. Det er andre år på rad stedet er på verdenscupprogrammet, men i denne sesongen kun for menn – kvinnene returnerer i stedet til Killington. I fjor vant Marco Odermatt og Thomas Brennsteiner på Copper Mountain, og norske interesser hadde også noe å glede seg over: Vinatzer gikk til topps i storslalåm mens Bosca var åttende i super-G. Snøkontrollen er bestått etter nylige snøfall og god banepreparering.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/luce-verde-per-copper-mountain-il-28-29-novembre-super-g-e-gigante-maschili-per-aprire-la-campagna-americana","pub_date":"2026-11-16T19:55:00.000Z","fetched_at":"2026-11-16 20:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":164091,"source_name":"Ski Racing","country":"INT","title_no":"Matt Whitcomb overtar ledelsen av Burke Mountain Academy","title_orig":"Matt Whitcomb to Lead Burke Mountain Academy as Jesse Hunt Takes Expanded Athletics Role","summary_no":"Matt Whitcomb skal lede Burke Mountain Academy, mens Jesse Hunt går inn i en utvidet rolle innen atletikk.","spik_no":"Matt Whitcomb, i dag landslagssjef for det amerikanske langrennslandslaget, overtar som rektor ved Burke Mountain Academy i Vermont fra 1. juli 2027. Han begynte som trener ved skolen for over to tiår siden, og beskriver stillingen som drømmejobben. Jesse Hunt, tidligere alpindirektør for US Ski Team og sportsdirektør ved BMA siden 2022, rykker samtidig opp til executive director of athletics med ansvar for blant annet utøverøkonomi og lengre treningssesonger i Vermont.","url":"https://skiracing.com/matt-whitcomb-to-lead-burke-mountain-academy-as-jesse-hunt-takes-expanded-athletics-role/","pub_date":"2026-11-16T17:57:32.000Z","fetched_at":"2026-11-16 18:00:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":164181,"source_name":"SVT Sport","country":"SWE","title_no":"SVTs ekspert hyller Tilde Grillfors: – Hun viser vei","title_orig":"SVT:s expert hyllar Tilde Grillfors: ”Går in och visar vägen”","summary_no":"SVTs alpinekspert roser Tilde Grillfors for hennes prestasjon og fremhever at hun går foran som et godt eksempel.","spik_no":"Dette er en ishockeysak, ikke alpin – artikkelen handler om at 18 år gamle Tilde Grillfors scoret det avgjørende straffeskuddet da Sverige tok VM-bronse mot Finland i ishockey. Damkronornas forrige VM-medalje kom i 2007, to år før Grillfors ble født. SVTs ekspert Johanna Lagus roste henne i strålende ordelag og var selv i tårer etter bronseseieren, som hun beskrev som historisk stor for svensk damishockey.","url":"https://www.svt.se/sport/ishockey/svts-expert-hyllar-tilde-grillfors-gar-in-och-visar-vagen","pub_date":"2026-11-16T17:42:42.000Z","fetched_at":"2026-11-16 18:00:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":163858,"source_name":"ORF Sport","country":"AUT","title_no":"Sverige sikret VM-bronse","title_orig":"Schwedinnen sichern sich WM-Bronze","summary_no":"Det svenske laget sikret seg bronsemedalje i verdensmesterskapet i alpint.","spik_no":"Det svenske ishockeylaget sikret seg bronsemedalje i VM, men dette er ikke fra alpint – artikkelteksten handler om svensk ishockey for kvinner, ikke alpint. Sverige slo Finland 2–1 på straffeslag i bronsekampen i Herning, Danmark. Det er landets tredje VM-bronse i ishockey, etter medaljer i 2005 og 2007. Ingen relevant alpininnhold er tilgjengelig i denne saken.","url":"https://sport.orf.at/stories/3165018/","pub_date":"2026-11-16T17:28:07.000Z","fetched_at":"2026-11-16 17:30:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":163508,"source_name":"ORF Sport","country":"AUT","title_no":"Også Schmid utgår – Jungwirth og Weinhandl debuterer","title_orig":"Auch Schmid fällt aus, Debüts von Jungwirth und Weinhandl","summary_no":"Schmid er også bekreftet utgått, mens Jungwirth og Weinhandl er klare for sine debuts i alpint.","spik_no":"Dette er en fotballsak, ikke alpint – artikkelen handler om det østerrikske landslaget i Nations League, der Romano Schmid har reist hjem av private grunner og keeper Lukas Jungwirth samt 17-åringen Luca Weinhandl er klare for sine landslagsdebuter. Saken har ingen tilknytning til alpint eller vintersport.","url":"https://sport.orf.at/stories/3165017/","pub_date":"2026-11-16T16:45:52.000Z","fetched_at":"2026-11-16 17:00:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":163142,"source_name":"Neveitalia","country":"ITA","title_no":"Frankrike stiller med 13 utøvere til slalåmrennene i Gurgl","title_orig":"La Francia col piedo di fiducia verso Gurgl, dove vinse Rassat un anno fa: ecco i 13 atleti per i prossimi slalom","summary_no":"Frankrike reiser til Gurgl med stor selvtillit etter Rassats seier der for ett år siden. 13 utøvere er uttatt til de kommende slalåmrennene.","spik_no":"Frankrike stiller med 13 utøvere til slalåmrennene i Gurgl neste helg, og reiser dit med god selvtillit etter en sterk helg i Levi. På damessiden utmerket Marion Chevrier og Marie Lamure seg med henholdsvis 6.- og 7.-plass i Finland – begge karrierebeste resultater. På herresiden er Clément Noël, som tok 2.-plass i Levi-åpningen, og Paco Rassat, som vant i Gurgl for ett år siden, de fremste medaljehåpene.","url":"https://www.neveitalia.it/sport/scialpino/news/la-francia-col-piedo-di-fiducia-verso-gurgl-dove-vinse-rassat-un-anno-fa-ecco-i-13-atleti-per-i-prossimi-slalom","pub_date":"2026-11-16T16:15:00.000Z","fetched_at":"2026-11-16 16:30:01","lang_orig":"it","category":null,"athletes":"Clement Noel","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":162675,"source_name":"SkinEWS","country":"SUI","title_no":"Ti poeng og en planendring for Charlotte Lingg","title_orig":"Zehn Punkte und eine Planänderung für Charlotte Lingg","summary_no":"Charlotte Lingg sikret seg ti verdenscuppoeng og måtte samtidig endre sine opprinnelige planer.","spik_no":"Charlotte Lingg, som konkurrerer for Liechtenstein, satte karrierebeste i verdenscupslalåmen i Levi med en 21.-plass og ti poeng – noe som også førte til en endring i hennes opprinnelige planer fremover. Den 27 år gamle Zermatt-utøveren tok resultatet til tross for bagasjekaoset som oppsto under reisen til Lappland, der deler av utstyret hennes kom frem forsinket. Liechtenstein er et lite alpinland som tradisjonelt har hatt enkeltutøvere på høyt nivå, og Lingg representerer denne tradisjonen med en lovende utvikling på verdenscupnivå.","url":"https://www.skinews.ch/news/2026/punkte-planaenderung-charlotte/","pub_date":"2026-11-16T15:35:21.000Z","fetched_at":"2026-11-16 15:45:04","lang_orig":"de","category":null,"athletes":"Charlotte Lingg","athlete_nations":["LIE"],"also_sources":[],"norwegian":false},{"id":160956,"source_name":"Expressen","country":"SWE","title_no":"Sally Sivertsson fikk kreft: «Som en bombe»","title_orig":"Sally Sivertsson fick cancer: ”Som en bomb”","summary_no":"Alpinisten Sally Sivertsson forteller om sjokket da hun fikk kreftdiagnosen.","spik_no":"Artikkelteksten handler om den svenske håndballspilleren Sally Sivertsson, ikke en alpinist. Det ser ut til å være feil artikkel koblet til saken. Sally Sivertsson er datter av den legendariske håndballspilleren Thomas Sivertsson og fikk en kreftdiagnose i 2023, men er altså håndballspiller – ikke alpinist. NRK Sport alpint bør verifisere om det finnes en alpinist med samme navn før dette eventuelt brukes på lufta.","url":"https://www.expressen.se/sport/handboll/sally-sivertsson-fick-cancer-som-en-bomb/","pub_date":"2026-11-16T13:58:49.000Z","fetched_at":"2026-11-16 14:15:06","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":160517,"source_name":"Neveitalia","country":"ITA","title_no":"Sveitsisk trio klar for Gurgl: Meillard, Nef og Yule angriper «Kirchenkar»","title_orig":"Team confermato per gli svizzeri protagonisti a Gurgl: Meillard, Nef e Yule il trio d'attacco sulla \"Kirchenkar\"","summary_no":"Sveits stiller med Loïc Meillard, Tanguy Nef og Daniel Yule i Gurgl, der trioen er klar for kamp på den krevende «Kirchenkar»-løypen.","spik_no":"Sveits stiller med samme tropp i Gurgl som i Levi, med Loïc Meillard som flaggbærer etter at han tok pallplass i Finland. Meillard, 30 år fra Hérémence, er inne i en god periode og jakter sitt tredje strake pallresultat denne sesongen – på «Kirchenkar»-løypen i Tirol har han imidlertid slitt, med en femteplass i 2024 og to utløp i annen omgang som eneste meritter. Tanguy Nef hadde også en femteplass i Gurgl for ett år siden, mens veteranen Daniel Yule fullførte som 16. i Levi og håper på bedre betalt i Østerrike.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/team-confermato-per-gli-svizzeri-protagonisti-a-gurgl-meillard-nef-e-yule-il-trio-d-attacco-sulla-kirchenkar","pub_date":"2026-11-16T13:35:00.000Z","fetched_at":"2026-11-16 13:45:02","lang_orig":"it","category":null,"athletes":"Daniel Yule,Loïc Meillard,Tanguy Nef","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":160259,"source_name":"Expressen","country":"SWE","title_no":"Vinnersuksess for Magnus Nygren","title_orig":"Vinstsuccé för Magnus Nygren","summary_no":"Magnus Nygren markerte seg med en imponerende seier i alpint.","spik_no":"Denne saken handler ikke om alpint, men om ishockeystjernen Magnus Nygren som vant stort på travspillet V85. Nygren, kjent som Tre Kronor-profil på isen, vant i august over 43 000 svenske kroner på travtipping, og slo til igjen i helgen med en totalgevinst på 391 345 kroner. Saken har ingen tilknytning til alpinsport og er ikke relevant som bakgrunnsnotat for NRK Sport alpint.","url":"https://www.expressen.se/sport/trav/vinstsucce-for-magnus-nygren/","pub_date":"2026-11-16T13:10:14.000Z","fetched_at":"2026-11-16 13:15:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":159469,"source_name":"Neveitalia","country":"ITA","title_no":"Sveits stiller med kun åtte utøvere i Gurgl – Rast og Holdener vil innløse seg","title_orig":"Contingente ridotto a 8 unità anche per la Svizzera presente a Gurgl: Rast e Holdener per il riscatto","summary_no":"Sveits møter opp med et redusert lag på åtte utøvere i Gurgl, der Rast og Holdener er klare for å slå tilbake.","spik_no":"Sveits stiller med kun åtte utøvere i slalåmen i Gurgl, der de mangler den skadde Mélanie Meillard for resten av sesongen etter at hun rev over korsbåndet og menisken i høyre kne under oppkjøringen til Levi. Camille Rast, som er verdensmester i slalåm og hadde to tredjeplasser i Gurgl fra før, og Wendy Holdener er utpekt som lagets ledere og ønsker begge å slå tilbake etter skuffende resultater. Også Anuk Braendli er utelatt sammenlignet med Levi-stafetten, da hun prioriterer Europa Cup. Michelle Hoepli er med etter å ha satt personlig rekord i forrige renn.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/contingente-ridotto-a-8-unita-anche-per-la-svizzera-presente-a-gurgl-rast-e-holdener-per-il-riscatto","pub_date":"2026-11-16T12:10:00.000Z","fetched_at":"2026-11-16 12:15:01","lang_orig":"it","category":null,"athletes":"Camille Rast,Melanie Meillard,Wendy Holdener","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":159118,"source_name":"Neveitalia","country":"ITA","title_no":"Kun åtte italienske alpinister til Gurgl – Peterlini og Della Mea leder an","title_orig":"\"Tite\" Sola dirottata sulla Coppa Europa, saranno solo 8 le azzurre in gara a Gurgl: guidano Peterlini e Della Mea","summary_no":"Det italienske kvinnelaget omdirigeres til Europacupen, og bare åtte utøvere stiller til start i Gurgl med Peterlini og Della Mea i spissen.","spik_no":"Italia stiller med kun åtte utøvere i slalåmen i Gurgl lørdag, der Martina Peterlini og Lara Della Mea leder troppen. Beatrice «Tite» Sola, som var Italias beste i Levi, er sendt til Europacupen i stedet. Gurgl-bakken «Kirchenkar» har bare vært arrangert for kvinner to ganger tidligere, og begge gangene endte med samme podium: Shiffrin øverst, foran Colturi og Rast. Mikaela Shiffrin er heller ikke denne gangen til stede – hun returnerer i Killington.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/tite-sola-dirottata-sulla-coppa-europa-saranno-solo-8-le-azzurre-in-gara-a-gurgl-guidano-peterlini-e-della-mea","pub_date":"2026-11-16T11:35:00.000Z","fetched_at":"2026-11-16 11:45:01","lang_orig":"it","category":null,"athletes":"Martina Peterlini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":158807,"source_name":"Neveitalia","country":"ITA","title_no":"Andre episode av «Ghiaccio Verde»: direktesending med Paolo De Chiesa om verdenscupen","title_orig":"Seconda puntata stagionale di \"Ghiaccio Verde\": alle 18.30 la diretta con Paolo De Chiesa per tutti i temi della CdM","summary_no":"Andre episode av sesongens «Ghiaccio Verde» sendes direkte klokken 18.30 med Paolo De Chiesa, som tar opp alle temaer knyttet til verdenscupen.","spik_no":"Det italienske alpinprogrammet «Ghiaccio Verde» på Neveitalia sender sin andre episode av sesongen direkte klokken 18.30, med den profilerte alpinekspert og tidligere verdenscupløper Paolo De Chiesa som gjest. Programmet tar opp høydepunktene fra slalomrennene i Levi, der tyske Emma Aicher vant damenes slalom foran Lara Colturi, mens Lucas Pinheiro Braathen tok seieren for herrene. Braathen, som representerer Brasil etter å ha skiftet nasjonalitet fra Norge, fulgte dermed opp sin tidligere gigantslalomseier i Sölden. De Chiesa er kjent som «skistemmen» i Italia og en fast stemme i alpindebatten.","url":"https://www.neveitalia.it/sport/scialpino/pagelle/news/ghiaccio-verde-del-16-novembre-2026-con-paolo-de-chiesa","pub_date":"2026-11-16T11:10:00.000Z","fetched_at":"2026-11-16 11:15:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":158458,"source_name":"Sportschau","country":"GER","title_no":"Direktesending: Vintersport på Das Erste","title_orig":"Livestream: Wintersport im Ersten","summary_no":"Vintersport sendes direkte på den tyske TV-kanalen Das Erste.","spik_no":"Das Erste sender vintersport direkte gjennom sin Sportschau-plattform, som dekker disipliner som skiskyting, skihopp og alpint. Den tyske offentlige kringkasteren har lange tradisjoner for å sende vintersport og er en av de viktigste visningsflatene for sporten i det tyske markedet. Sportschau.de tilbyr også direktestrømming på nett, noe som gjør innholdet tilgjengelig for et bredt publikum utover tradisjonell TV.","url":"https://www.sportschau.de/wintersport/wintersport-im-ersten,livestream-wintersport-im-ersten-108.html","pub_date":"2026-11-16T10:45:51.000Z","fetched_at":"2026-11-16 11:00:06","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":158163,"source_name":"Neveitalia","country":"ITA","title_no":"Italia bekrefter troppen til Gurgl – samme lag som i Finland","title_orig":"E' già ufficiale l'Italia maschile per Gurgl: domenica prossima la stessa formazione proposta in Finlandia","summary_no":"Det italienske herrelaget til Gurgl er allerede offisielt bekreftet, med samme sammensetning som ble benyttet i Finland neste søndag.","spik_no":"Italia stiller med samme syv mann i Gurgl slalåm 22. november som de brukte i Levi helgen før. Alex Vinatzer er lagets fremste kort etter å ha tatt en femteplass i Finland, mens Saccardi var uheldig og miste adgang til 2. omgang med kun fem hundredeler. Gurgl i Østerrike er en relativt ny destinasjon på World Cup-programmet, og menn kjører her for fjerde år på rad – i fjor vant franskmannen Paco Rassat sitt første verdenscuprenn foran Atle Lie McGrath, som siden tok slalåmkula.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/e-gia-ufficiale-l-italia-maschile-per-gurgl-domenica-prossima-la-stessa-formazione-proposta-in-finlandia","pub_date":"2026-11-16T10:35:00.000Z","fetched_at":"2026-11-16 10:45:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":158043,"source_name":"ORF Sport","country":"AUT","title_no":"Truppe beundrer Aichers «uinteresse»","title_orig":"Truppe bewundert Aichers „Desinteresse“","summary_no":"Truppe har latt seg imponere av Aichers tilsynelatende likegyldighet.","spik_no":"Katharina Truppe startet sesongen med tredjeplass i Levi og befester sin posisjon som Østerrikes nummer én i slalåm. Øverst på pallen endte Emma Aicher, som imponerte Truppe med sin tilsynelatende ro og likegyldighet på banen. «Det ser ut som om det ikke interesserer henne», sa Truppe anerkjennende om den unge tyske løperens stil. Aicher pekes nå ut som en potensiell arvtaker etter Mikaela Shiffrin i slalåm-verdenskvpen, ettersom amerikaneren kun planlegger å delta i utvalgte renn denne sesongen.","url":"https://sport.orf.at/stories/3164969/","pub_date":"2026-11-16T10:19:19.000Z","fetched_at":"2026-11-16 10:30:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":157810,"source_name":"Neveitalia","country":"ITA","title_no":"Kan en perfekt Pinheiro Braathen true Odermatt? Et svært krevende regnestykke","title_orig":"Un Pinheiro Braathen perfetto può insidiare Odermatt? Resta una missione complicatissima, ma... facciamo i conti","summary_no":"En perfekt sesong fra Pinheiro Braathen kan teoretisk true Marco Odermatt, men oppgaven er ekstremt vanskelig. Tallene er gjort opp.","spik_no":"Spørsmålet om Lucas Pinheiro Braathen kan utfordre Marco Odermatt om den store krystallkula er blitt analysert nøye, og tallene viser at oppgaven er ekstremt krevende. Odermatt har vunnet den totale verdenscupen fire sesonger på rad og er regnet som den dominerende krafta i moderne alpint. Braathen, som kjører for Brasil etter å ha forlatt det norske landslaget, er en av de få som har vist kapasitet til å utfordre østerrikerens overlegenhet – særlig i teknikkdisiplinene – men krever trolig nær perfekte resultater gjennom hele sesongen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/un-pinheiro-braathen-perfetto-puo-insidiare-odermatt-resta-una-missione-complicatissima-ma-facciamo-i-conti","pub_date":"2026-11-16T10:00:00.000Z","fetched_at":"2026-11-16 10:15:03","lang_orig":"it","category":null,"athletes":"Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":157826,"source_name":"SkinEWS","country":"SUI","title_no":"Lettere endret Swiss-Ski-tropp til Gurgl","title_orig":"Leicht verändertes Swiss-Ski-Aufgebot für Gurgl","summary_no":"Swiss Ski har gjort mindre justeringer i troppen som skal representere Sveits i Gurgl.","spik_no":"Swiss Ski har gjort mindre justeringer i troppen sin foran slalåmrennet i Gurgl i Østerrike, som tradisjonelt er blant de første teknikkrunnene i verdenscupsesongen. Gurgl-rennet på cirka 2 000 meters høyde er kjent for å gi utfordrende snøforhold tidlig i sesongen. Sveits har for øyeblikket et bredt og sterkt slalåmlag, med utøvere som Loïc Meillard og Daniel Yule blant de mest aktuelle kandidatene til pallplasser.","url":"https://www.skinews.ch/news/2026/leicht-veraendertes-aufgebot/","pub_date":"2026-11-16T09:51:58.000Z","fetched_at":"2026-11-16 10:15:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":157866,"source_name":"ORF Sport","country":"AUT","title_no":"Kriechmayr holder alle muligheter åpne","title_orig":"Kriechmayr hält sich alle Optionen offen","summary_no":"Vincent Kriechmayr har ikke bestemt seg for hvilke disipliner han satser på, og holder foreløpig alle dører åpne.","spik_no":"Vincent Kriechmayr holder alle muligheter åpne foran det første fartsrennet i sesongen, super-G i Copper Mountain om to uker. 35-åringen fra Østerrike gjennomførte en skadefri forberedelse og viser til sesongen der han vant utfor i Courchevel og super-G i Beaver Creek som bevis på at han fortsatt hører hjemme i verdenstoppen. Kriechmayr, som er dobbel verdensmester fra Cortina 2021, omtaler selv dette som muligens sin siste sesong og sier han vil avslutte karrieren den dagen han ikke lenger kan hevde seg blant de beste.","url":"https://sport.orf.at/stories/3164808/","pub_date":"2026-11-16T08:56:47.000Z","fetched_at":"2026-11-16 10:15:06","lang_orig":"de","category":null,"athletes":"Vincent Kriechmayr","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":157812,"source_name":"Neveitalia","country":"ITA","title_no":"Levi tenner pallen-kampen: Allerede rykk i toppen mot Val di Fassa","title_orig":"Levi accende il Gioco dei Podi: è già fuga in vetta, la corsa verso la Val di Fassa entra nel vivo","summary_no":"Etter Levi er pallkampen i Verdenscupen allerede i gang, og løpet mot Val di Fassa har for alvor begynt.","spik_no":"Etter åpningshelgen i Levi har pallkampen i verdenscupens slalåmklassement allerede tatt form, og rivaliseringen frem mot neste teknikkhelg i Val di Fassa er for alvor i gang. Levi-rennet markerer tradisjonelt startskuddet for slalåmsesongen for herrer, og resultatene herfra legger premissene for hvem som er i form tidlig i vinter. Poengsummen fra Finland gir allerede viktige indikasjoner på styrkeforholdet mellom de beste slalåmkjørerne i verdenstoppen denne sesongen.","url":"https://www.neveitalia.it/sport/fantasy/giocodeipodi/news/levi-accende-il-gioco-dei-podi-e-gia-fuga-in-vetta-la-corsa-verso-la-val-di-fassa-entra-nel-vivo","pub_date":"2026-11-16T08:45:00.000Z","fetched_at":"2026-11-16 10:15:03","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":157815,"source_name":"Neveitalia","country":"ITA","title_no":"Noel med god start! Pinheiro Braathen og Meillard dobbelt på pallen – Vinatzer nær topp 15 i slalåm","title_orig":"Noel, Ok la partenza è giusta! Pinheiro Braathen e Meillard da doppio podio, Vinatzer ad un soffio dalla top 15 di slalom","summary_no":"Noel imponerte med en sterk åpning, mens Pinheiro Braathen og Meillard begge kapret pallplasser. Vinatzer var svært nær topp 15.","spik_no":"Clément Noel åpnet sesongen sterkt i Levi-slalåmen, mens Lucas Pinheiro Braathen og Loïc Meillard begge tok pallplasser og markerte seg som toppkandidater videre i vinter. Noel, som er regjerende verdensmester i slalåm, er kjent for å levere noen av de mest aggressive og presise kjøringene i verdenscupen. Meillard fra Sveits er en allsidig utøver som hevder seg i flere disipliner, mens Braathen-Brasil-satsingen fortsetter å gi resultater på høyeste nivå. Alex Vinatzer fra Italia var også nær topp 15 og viser stigende form.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/noel-ok-la-partenza-e-giusta-pinheiro-braathen-e-meillard-da-doppio-podio-vinatzer-ad-un-soffio-dalla-top-15-di-slalom","pub_date":"2026-11-15T19:15:00.000Z","fetched_at":"2026-11-16 10:15:03","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","ITA","SUI"],"also_sources":[],"norwegian":false},{"id":157873,"source_name":"ORF Sport","country":"AUT","title_no":"U20-VM i Canada uten Russland","title_orig":"U20-WM in Kanada findet ohne Russland statt","summary_no":"U20-VM i alpint i Canada arrangeres uten deltakelse fra Russland.","spik_no":"U20-VM i ishockey i Canada avholdes uten Russland etter at canadiske myndigheter nekter å utstede visum til det russiske laget. Beslutningen kommer i kjølvannet av et CAS-kjennelse fra oktober som opphevet suspensjonen av russiske ishockeylag til tross for den pågående krigen mot Ukraina. Norge, som hadde varslet boikott dersom Russland fikk delta, stiller nå til start. Turneringen spilles i Edmonton og Red Deer fra 26. desember 2026 til 5. januar 2027. Merk: denne saken handler om ishockey, ikke alpint.","url":"https://sport.orf.at/stories/3164987/","pub_date":"2026-11-15T18:52:37.000Z","fetched_at":"2026-11-16 10:15:06","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":157816,"source_name":"Neveitalia","country":"ITA","title_no":"De Aliprandini, Talacci, Della Vite, Seppi og Gerosa til Sulden – deretter storslalåm i USA","title_orig":"A Solda anche De Aliprandini, Talacci, Della Vite, Seppi e Gerosa, poi sarà tempo di giganti negli States","summary_no":"En rekke italienske alpinister samles i Sulden, før oppmerksomheten rettes mot storslalåmrenn i USA.","spik_no":"En gruppe italienske alpinister, deriblant Luca De Aliprandini, Giovanni Franzoni Talacci, Filippo Della Vite, Simon Seppi og Mattia Gerosa, samles til treningsleir i Sulden i Sør-Tirol før sesongens første storslalåmrenn i USA. Sulden er et populært høyfjellsområde i Italia som brukes aktivt til teknikktrening tidlig i sesongen på grunn av stabile snøforhold. De Aliprandini er den mest meritterte av gruppen og har tidligere stått på pallen i verdenscupen i storslalåm.","url":"https://www.neveitalia.it/sport/scialpino/news/a-solda-anche-de-aliprandini-talacci-della-vite-seppi-e-gerosa-poi-sara-tempo-di-giganti-negli-states","pub_date":"2026-11-15T18:45:00.000Z","fetched_at":"2026-11-16 10:15:03","lang_orig":"it","category":null,"athletes":"Filippo Della Vite,Luca De Aliprandini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":157817,"source_name":"Neveitalia","country":"ITA","title_no":"Goggia feirer bursdag på pisten i Copper – fartsgjengen ankommet, og Killington nær klar","title_orig":"Compleanno in pista per Goggia a Copper, dove sono arrivati anche gli azzurri della velocità. A Killington la Superstar è quasi pronta","summary_no":"Sofia Goggia markerte bursdagen sin på trening i Copper Mountain, der de italienske fartskjørerne også er ankommet. I Killington er forberedelsene nesten i mål.","spik_no":"Sofia Goggia markerte bursdagen sin med trening på snø i Copper Mountain i Colorado, der det italienske fartslaget forbereder seg til sesongens første super-G-renn. Goggia, som har vunnet verdenscupen i utfor tre ganger og er kjent for sin eksplosive og aggressive kjørestil, er en av favorittene i fartsøvelsene også denne sesongen. Parallelt er forberedelsene til slalåmrennet i Killington, Vermont – tradisjonelt det store amerikanske damerennet tidlig i november – nesten fullført.","url":"https://www.neveitalia.it/sport/scialpino/news/compleanno-in-pista-per-goggia-a-copper-dove-sono-arrivati-anche-gli-azzurri-della-velocita-a-killington-la-superstar-e-quasi-p","pub_date":"2026-11-15T18:10:00.000Z","fetched_at":"2026-11-16 10:15:03","lang_orig":"it","category":null,"athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":157790,"source_name":"Ski Racing","country":"INT","title_no":"Jakobsen og Hansson om slalåm, svenske røtter og livet utenfor løypene","title_orig":"Kristoffer Jakobsen and William Hansson Talk Slalom, Swedish Roots and Life Beyond Racing","summary_no":"Kristoffer Jakobsen og William Hansson åpner opp om slalåm, sine svenske røtter og tilværelsen som toppidrettsutøvere utenfor konkurransene.","spik_no":"Kristoffer Jakobsen og William Hansson åpner opp om livet som slalåmkjørere med svenske røtter og tilværelsen utenfor løypene. Jakobsen er en av Sveriges mest meritterte slalåmkjørere i nyere tid og har flere pallplasseringer i verdenscupen. Hansson er en yngre profil på vei opp på elitenivå. Intervjuet gir et sjeldent innblikk i hverdagen og motivasjonen bak to utøvere som representerer en ny generasjon svensk alpinisme.","url":"https://skiracing.com/kristoffer-jakobsen-and-william-hansson-talk-slalom-swedish-roots-and-life-beyond-racing/","pub_date":"2026-11-15T17:41:42.000Z","fetched_at":"2026-11-16 10:15:02","lang_orig":"en","category":null,"athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":157818,"source_name":"Neveitalia","country":"ITA","title_no":"Fire slalåmrenn i Kaabdalis i helg ,"country":"SUI","title_no":"Braathen vinner slalåmen i Levi","title_orig":"Lucas Pinheiro Braathen gewinnt den Slalom von Levi","summary_no":"Lucas Pinheiro Braathen tok seieren i slalåmrennet i Levi.","spik_no":"Lucas Pinheiro Braathen vinner slalåmen i Levi og tar sin andre seier i Verdenscupen denne sesongen, etter at han også vant storslalåmen i Sölden som åpnet 2026/27-sesongen. Braathen, som konkurrerer for Brasil etter å ha byttet nasjon fra Norge i 2023, foran Clément Noël fra Frankrike og sveitsiske Loïc Meillard på pallen. Braathen har tidligere vunnet slalåmkula i Verdenscupen og er en av de fremste teknikkerne i alpinsporten, og en dobbeltseier tidlig i sesongen sender et tydelig signal om at han er i strålende form.","url":"https://www.skinews.ch/video/2026/pinheiro-braathen-gewinnt/","pub_date":"2026-11-15T16:09:33.000Z","fetched_at":"2026-11-15 16:15:06","lang_orig":"de","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":156924,"source_name":"Neveitalia","country":"ITA","title_no":"Meillard dedikerte seieren til Mélanie – Noel feilet aldri i Levi","title_orig":"Meillard, la dedica è per Mélanie: \"So quanto aveva lavorato\". Noel nella \"sua\" Levi non sbaglia mai: \"Due manche in controllo\"","summary_no":"Meillard dedikerte resultatet til Mélanie og fremhevet hvor hardt hun hadde jobbet. Noel leverte nok en gang i Levi med to kontrollerte omganger.","spik_no":"Loïc Meillard tok andreplassen i åpningsslalåmen i Levi og dedikerte resultatet til lagvenninnen Mélanie Meillard – sannsynligvis søsteren hans – og understreket hvor hardt hun hadde jobbet. Clement Noel bekreftet nok en gang at han er spesielt sterk i Levi, der han nå har tatt sitt fjerde strake pallplass på den finske arenaen. Vinneren av rennet var Lucas Pinheiro Braathen, som sikret seg den tradisjonsrike rein-premien som tildeles slalåmvinneren i Lappland.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/meillard-la-dedica-e-per-melanie-so-quanto-aveva-lavorato-noel-nella-sua-levi-non-sbaglia-mai-due-manche-in-controllo","pub_date":"2026-11-15T15:50:00.000Z","fetched_at":"2026-11-15 15:56:44","lang_orig":"it","category":null,"athletes":"Clement Noel,Loïc Meillard,Melanie Meillard","athlete_nations":["FRA","SUI"],"also_sources":[],"norwegian":false},{"id":157951,"source_name":"Sportschau","country":"GER","title_no":"Straßer imponert over tetninga i Levi-slalåmen: – Rett og slett perverst","title_orig":"Slalom in Levi: Straßer staunt über Leistungsdichte - \"Nur noch pervers\"","summary_no":"Linus Straßer er overrasket over hvor jevnt nivået er i slalåmen i Levi. Konkurransen er tøffere enn noen gang.","spik_no":"Linus Straßer endte på 13. plass i slalåmrennet i Levi, og mistet én posisjon i annenomgangen. Den tyske slalåmspesialisten beskriver nivået i verdenstoppen som \"perverst\" jevnt, og erkjenner selv at kjøringen hans ikke var helhetlig nok på den islagte og krevende finske bakken. Straßer, som har tre verdenscupseire i slalåm, er likevel optimistisk fremover og peker på at rytmeskiftene i løypen gjorde det ekstremt vanskelig å finne en god flytsone gjennom hele rennet.","url":"https://www.sportschau.de/regional/br/br-strasser-staunt-ueber-leistungsdichte-nur-noch-pervers-102.html","pub_date":"2026-11-15T14:54:23.000Z","fetched_at":"2026-11-16 10:15:08","lang_orig":"de","category":null,"athletes":"Linus Straßer","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":155937,"source_name":"SVT Sport","country":"SWE","title_no":"Gustav Wissting etter den historiske noteringen","title_orig":"Gustav Wissting efter historiska noteringen","summary_no":"Gustav Wissting kommenterer sin historiske prestasjon i alpint.","spik_no":"Den svenske alpinisten Gustav Wissting skrev historiske sider da han fra startnummer 82 klarte å kvalifisere seg videre til andre omgang i slalåm – det sent har ingen startet og likevel kommet videre, ifølge FIS. 21-åringen endte til slutt på 17.-plass, hans beste karriereresultat noensinne. Wissting krediterer mye av suksessen til lagmiljøet på det svenske alpinlandslaget, der William Hansson, Fabian Ax Swartz og Kristoffer Jakobsen bidrar til en særegen treningskultur med intern konkurranse utøverne imellom.","url":"https://www.svt.se/sport/alpint/gustav-wissting-efter-historiska-noteringen","pub_date":"2026-11-15T14:43:29.000Z","fetched_at":"2026-11-15 14:45:05","lang_orig":"sv","category":null,"athletes":"Gustav Wissting","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":155401,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrikske menn går glipp av OL-sjansen","title_orig":"Österreichs Männer verpassen Chance auf Olympia","summary_no":"De østerrikske alpinistene misset en viktig mulighet til å kvalifisere seg til vinter-OL.","spik_no":"Artikkelteksten handler ikke om alpint, men om østerriksk lacrosse: det østerrikske herrelandslaget tapte 15–26 mot Hellas i Sixes-EM i Salou, Spania, og er dermed ute av OL-kvalifiseringen til Los Angeles 2028. Sjansen ble allerede før turneringen vurdert som liten. Østerrike skal mandag spille om plasseringene ni til tolv mot Sverige.","url":"https://sport.orf.at/stories/3164974/","pub_date":"2026-11-15T14:21:32.000Z","fetched_at":"2026-11-15 14:30:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":155171,"source_name":"Neveitalia","country":"ITA","title_no":"Vinatzer imponerte med skremmende andrekjøring: – Jeg er kjempefornøyd","title_orig":"E' questo il Vinatzer che tutti vogliono: 2^ manche paurosa e un inizio che fa ben sperare. \"Sono contentissimo\"","summary_no":"Alex Vinatzer leverte en formidabel annen omgang og startet sesongen med lovende form. – Jeg er kjempefornøyd, sa alpinisten etterpå.","spik_no":"Alex Vinatzer imponerte med den raskeste andrekjøringen i Levi-slalåmen, nesten seks tideler foran Meillard på den avgjørende omgangen, og klatret fra 23.-plass til en samlet femteplass. 27-åringen fra Gröden har lenge blitt sett på som et av Italias største slalåmtalenter, men hans siste pallplass i slalåm var i Kitzbühel i januar 2025, da han mistet seieren med kun ni hundredeler til Noël. En slik andrekjøring gir likevel grunn til optimisme før de neste rennene, og Vinatzer selv var tydelig fornøyd med formen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/e-questo-il-vinatzer-che-tutti-vogliono-2-manche-paurosa-e-un-inizio-che-fa-ben-sperare-sono-contentissimo","pub_date":"2026-11-15T14:10:00.000Z","fetched_at":"2026-11-15 14:15:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":155151,"source_name":"Ski Racing","country":"INT","title_no":"Braathen vinner igjen i Levi – to av to i sesongåpningen","title_orig":"Lucas Pinheiro Braathen Wins Again in Levi, Opens Season Two for Two","summary_no":"Lucas Pinheiro Braathen tok sin andre strake seier i Levi og innleder sesongen med to strake triumfer.","spik_no":"Lucas Pinheiro Braathen innleder sesongen 2026/27 med to strake seire etter å ha vunnet slalåmen i Levi med tiden 1:48.04, kun uker etter storslalåmseieren i Sölden. Franskmannen Clément Noël tok andreplassen, 0,56 sekunder bak, mens Loïc Meillard ble treer. Braathen, som representerer Brasil etter å ha skiftet nasjonalitet fra Norge i 2023, befester seg raskt som en av de fremste teknikkjørerne i verdenscupen og får nok en reinsdyr å navngi etter tradisjonen i Levi.","url":"https://skiracing.com/lucas-pinheiro-braathen-wins-again-in-levi-opens-season-two-for-two/","pub_date":"2026-11-15T14:05:57.000Z","fetched_at":"2026-11-15 14:15:01","lang_orig":"en","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":155053,"source_name":"ORF Sport","country":"AUT","title_no":"Hirscher står også over slalåmen i Gurgl","title_orig":"Hirscher verzichtet auch auf Slalom in Gurgl","summary_no":"Marcel Hirscher har valgt å ikke stille til start i slalåmrennet i Gurgl, og avstår dermed fra nok en konkurranse denne sesongen.","spik_no":"Marcel Hirscher har valgt å stå over slalåmrennet i Gurgl, og avstår dermed fra å bruke en av de fire wildcard-plassene han tildeles per disiplin fra FIS denne sesongen. 37-åringen, som gjør comeback for Østerrike etter å ha avsluttet karrieren i 2019, har heller ikke stilt i Sölden eller tidligere renn, og ifølge hans management fortsetter han å prioritere trening. Hirscher er tidenes mest meritterte alpinist med åtte sammenlagtseire i verdenscupen og 67 individuelle seire, og forventningene til comebacket er enormt — men tidspunktet for hans neste start er fortsatt uvisst.","url":"https://sport.orf.at/stories/3164973/","pub_date":"2026-11-15T13:55:44.000Z","fetched_at":"2026-11-15 14:00:04","lang_orig":"de","category":null,"athletes":"Marcel Hirscher","athlete_nations":["NED"],"also_sources":["Neveitalia"],"norwegian":false},{"id":154823,"source_name":"Neveitalia","country":"ITA","title_no":"Alle er gale med \"Pinheiro\" – også i Lappland. Og utfordringen til Odermatt er kastet: \"Ja, jeg tror på sammenlagtcupen\"","title_orig":"Tutti pazzi per \"Pinheiro\" anche in Lapponia. E la sfida a Odermatt è lanciata: \"Sì, credo nella coppa generale\"","summary_no":"\"Pinheiro\" er blitt en stor favoritt også i Lappland, og han erklærer nå at han tror han kan utfordre Odermatt om sammenlagtseieren i verdenscupen.","spik_no":"Lucas Pinheiro Braathen vant slalåmen i Levi og erklærte etterpå at han tror han kan utfordre Marcel Odermatt om den store sammenlagtcupen. Med sin tiende verdenscupseier i karrieren og allerede 200 poeng på kontoen etter bare to renn, er brasilianeren i strålende form. Braathen, som tidligere konkurrerte for Norge, tok sitt andre verdenscuptrof i storslalåm forrige sesong – tre år etter at han vant slalåmkula under norsk flagg. Han slo klart Clément Noël og Loic Meillard i Levi, og starter sesongen med seirer fra både Sölden og Finland.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/tutti-pazzi-per-pinheiro-anche-in-lapponia-e-la-sfida-a-odermatt-e-lanciata-si-credo-nella-coppa-generale","pub_date":"2026-11-15T13:40:00.000Z","fetched_at":"2026-11-15 13:45:02","lang_orig":"it","category":null,"athletes":"Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":154705,"source_name":"ORF Sport","country":"AUT","title_no":"Braathen strålte under østerriksk slalomkollaps","title_orig":"Braathen glänzt bei ÖSV-Debakel im Slalom","summary_no":"Braathen leverte en imponerende prestasjon da det østerrikske alpinlandslaget hadde en svak dag i slalomrennet.","spik_no":"Lucas Pinheiro Braathen vant slalomåpningen i Levi og tok sin tiende verdenscupseier totalt. Som første kjører noensinne vant han i Levi for andre år på rad, etter at han også tok riesentorlaupen i Söldeni sesongåpningen. Østerrike opplevde sitt verste slalomresultat siden Alta Badia i 2006 – kun Johannes Strolz kvalifiserte seg til finalen på 22.-plass. Joshua Sturm var den store skuffelsen: overraskende på tredjeplass etter første omgang, men falt ut i finalen og mistet sjansen til sitt første pallplass i verdenscupen.","url":"https://sport.orf.at/stories/3164965/","pub_date":"2026-11-15T13:24:17.000Z","fetched_at":"2026-11-15 13:30:04","lang_orig":"de","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":154439,"source_name":"Sportschau","country":"GER","title_no":"Braathen dominerte i Levi – Straßer solid, østerriksk kollaps","title_orig":"Straßer solide in Levi - Braathen-Demonstration bei ÖSV-Debakel","summary_no":"Lucas Pinheiro Braathen imponerte stort i Levi, mens tyske Straßer leverte solid. Det ble et nedtur for de østerrikske løperne.","spik_no":"Lucas Pinheiro Braathen dominerte fullstendig i Levi og vant foran Clément Noël og Loïc Meillard, mens Linus Straßer endte på en 13.-plass – nær to sekunder bak. Det østerrikske landslaget opplevde et realt sammenbrudd: Joshua Sturm, Michael Matt, Fabio Gstrein og Simon Rueland kjørte alle ut i andreomgangen, og Johannes Strolz som eneste østerriker i mål havnet sist av de 21 som fullførte. Sandvik og Vinatzer klatret begge 18 plasser i andreomgangen og viste at det var mulig å hente inn mye tid.","url":"https://www.sportschau.de/regional/br/br-strasser-solide-in-levi-braathen-demonstration-bei-oesv-debakel-102.html","pub_date":"2026-11-15T12:58:30.000Z","fetched_at":"2026-11-15 13:00:05","lang_orig":"de","category":null,"athletes":"Linus Straßer,Lucas Braathen","athlete_nations":["BRA","GER"],"also_sources":[],"norwegian":false},{"id":154432,"source_name":"franceinfo","country":"FRA","title_no":"Noël tok andreplass i åpningsslalåmen – Braathen vant","title_orig":"Clément Noël deuxième du premier slalom de la saison de Coupe du monde, remporté par Lucas Pinheiro Braathen","summary_no":"Lucas Pinheiro Braathen vant sesongåpningen i slalåm i verdenscupen, mens franske Clément Noël tok andreplass.","spik_no":"Clément Noël tok andreplass i åpningsslalåmen i Levi, der Lucas Pinheiro Braathen vant suverent. For Noël er andreplass en god start på sesongen – franskmannen er en av verdens beste slalåmkjørere og vant blant annet VM-gull i 2021. Braathen leder etter den første slalåmen av totalt tretten i verdenscupen denne sesongen, noe som gir ham et solid utgangspunkt i kampen om verdenscupen sammenlagt.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/clement-noel-deuxieme-du-premier-slalom-de-la-saison-de-coupe-du-monde-remporte-par-lucas-pinheiro-braathen_8283554.html#xtor=RSS-3-%5Bsports%2Fsports-d-hiver%2Fski-alpin%5D","pub_date":"2026-11-15T12:57:23.000Z","fetched_at":"2026-11-15 13:00:05","lang_orig":"fr","category":null,"athletes":"Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA"],"also_sources":[],"norwegian":false},{"id":154319,"source_name":"SkinEWS","country":"SUI","title_no":"Braathen triumferer for andre gang i Levi","title_orig":"Lucas Pinheiro Braathen triumphiert zum zweiten Mal in Levi","summary_no":"Lucas Pinheiro Braathen tok sin andre strake seier i Levi og befester sin posisjon i verdenscupen.","spik_no":"Lucas Pinheiro Braathen vant slalåmåpningen i Levi for andre strake år og befester dermed sin posisjon som en av verdens aller beste slalåmkjørere. Braathen, som kjører for Brasil etter å ha skiftet nasjonalitet fra Norge, startet sesongen med seier i storslalåmen i Sölden og vant nå også det første slalåmrennet. Clément Noël og Loïc Meillard fulgte på de neste plassene, 0,56 og 0,73 sekunder bak brasilianeren.","url":"https://www.skinews.ch/news/2026/pinheiro-braathen-triumphiert/","pub_date":"2026-11-15T12:51:51.000Z","fetched_at":"2026-11-15 13:00:03","lang_orig":"de","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":154359,"source_name":"ORF Sport","country":"AUT","title_no":"Braathen vant herreslalåmen i Levi","title_orig":"Braathen gewinnt Herren-Slalom in Levi","summary_no":"Lucas Pinheiro Braathen tok seieren i herreslalåmen i Levi og starter verdenscupsesongen med stil.","spik_no":"Lucas Pinheiro Braathen vant herreslalåmen i Levi og starter verdenscupsesongen 2026/27 med to seire på to renn, etter å ha vunnet storslalåmen i Sölden. Det østerrikske herrelandslaget opplevde et svart renn: Joshua Sturm, Michael Matt, Fabio Gstrein og Simon Rueland kjørte alle ut i andreomgangen, og Johannes Strolz kom i mål som eneste østerriker – på sisteplass med over tre sekunder opp til Braathen.","url":"https://sport.orf.at/stories/3164971/","pub_date":"2026-11-15T12:50:28.000Z","fetched_at":"2026-11-15 13:00:03","lang_orig":"de","category":null,"athletes":"Clement Noel,Joshua Sturm,Loïc Meillard,Lucas Braathen","athlete_nations":["AUT","BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":154392,"source_name":"Expressen","country":"SWE","title_no":"Fabian Ax Swartz tok karrierens beste plassering","title_orig":"Fabian Ax Swartz med karriärens bästa placering","summary_no":"Fabian Ax Swartz leverte sitt livs løp og sikret sin beste plassering i karrieren.","spik_no":"22 år gamle Fabian Ax Swartz leverte karrierens beste verdenscupresultat med en fjerdeplass i slalåmåpningen i Levi. Svensken var i ledelsen etter andreomgangen en stund, men ble til slutt slått ned fra pallen med knappest mulig margin – kun ett hundredel skilte ham fra Loïc Meillard på tredjeplass. Det er et lovende tegn for svensk alpint, som lenge har ventet på en ny profilert slalåmkjører etter Kristoffer Jakobsen.","url":"https://www.expressen.se/sport/alpint/fabian-ax-swartz-med-karriarens-basta-placering/","pub_date":"2026-11-15T12:49:48.000Z","fetched_at":"2026-11-15 13:00:04","lang_orig":"sv","category":null,"athletes":"Fabian Ax Swartz","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":154372,"source_name":"SVT Sport","country":"SWE","title_no":"Fabian Ax Swartz på fjerdeplass – Gustav Wissting skrev alpinhistorie","title_orig":"Fabian Ax Swartz fyra – Gustav Wissting skrev alpin historia","summary_no":"Fabian Ax Swartz endte på en sterk fjerdeplass, mens Gustav Wissting satte seg selv i alpinhistorien med en meritterende prestasjon.","spik_no":"Fabian Ax Swartz endte på en sterk fjerdeplass i åpningsslalåmen i Levi, mens Gustav Wissting skrev alpinhistorie ved å kvalifisere seg til andreomgangen fra startnummer 82 – det høyeste startnummeret som noen gang har tatt seg videre til et andreløp ifølge FIS. Ax Swartz, 22 år gammel, klatret fra niende til andreplassen i løpet av andreomgangen, men ble til slutt slått ned fra pallen i siste sekund. William Hansson var nest beste svenske etter første omgang på femteplass, men kjørte ut i andreomgangen.","url":"https://www.svt.se/sport/alpint/fabian-ax-swartz-fyra-gustav-wissting-skrev-alpin-historia","pub_date":"2026-11-15T12:49:45.000Z","fetched_at":"2026-11-15 13:00:04","lang_orig":"sv","category":null,"athletes":"Fabian Ax Swartz","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":154339,"source_name":"VG","country":"NOR","title_no":"Braathen overlegen i Levi – vant suverent","title_orig":"Braathen overlegen i Levi – vant suverent","summary_no":"","spik_no":"Lucas Braathen vant sesongens første slalåm i verdenscupen i Levi og kopierte fjorårets triumf på samme bakke – der tok han for øvrig Brasils aller første verdenscupseier. Med startnummer sju satte han et tempo ingen klarte å matche, og hadde 65 hundredeler til gode på Clément Noël etter første omgang. Norske Atle Lie McGrath var nærmest på fjerdeplass etter første omgang, men falt tilbake til syvendeplass i den avgjørende andre omgangen.","url":"https://www.vg.no/sport/i/4EqBgG/lucas-braathen-vant-sesongens-foerste-slalaam-i-verdenscupen?utm_medium=rss","pub_date":"2026-11-15T12:48:41.000Z","fetched_at":"2026-11-15 13:00:03","lang_orig":"no","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":154303,"source_name":"Neveitalia","country":"ITA","title_no":"Braathen-show i Levi – samba igjen, Vinatzer med anger","title_orig":"Lezione di sci a firma Pinheiro Braathen: è ancora samba a Levi, rimonta (e rimpianti) per Vinatzer","summary_no":"Lucas Pinheiro Braathen leverte nok en strålende prestasjon i Levi, mens Alexander Vinatzer måtte slå seg til ro med en skuffende opplevelse til tross for en sterk opptur.","spik_no":"Lucas Pinheiro Braathen gjentok fjorårets triumf i Levi med en overlegen seier i det første slalåmrennet av sesongen, og feiret nok en gang med sin karakteristiske samba. Braathen, som vant OL-gull i storslalåm under Milano-Cortina 2026, hadde 65 hundredeler til gode etter første omgang og kontrollerte andreomgangen til seier. Alex Vinatzer imponerte med å klatre fra 23.-plass til femteplass i andreomgangen, men mistet bronseplassen med kun ett hundredel til svenske Fabian Ax Swartz.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/lezione-di-sci-a-firma-pinheiro-braathen-e-ancora-samba-a-levi-rimonta-e-rimpianti-per-vinatzer","pub_date":"2026-11-15T12:45:00.000Z","fetched_at":"2026-11-15 13:00:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","ITA","SUI"],"also_sources":[],"norwegian":false},{"id":153615,"source_name":"Neveitalia","country":"ITA","title_no":"18 italienske alpinister samles i Igls etter Cortina – siste store samling før verdenscupen","title_orig":"Dopo Cortina, 18 azzurri scendono in pista a Igls per l'ultimo vero raduno prima della Coppa del Mondo","summary_no":"Etter oppholdet i Cortina reiser 18 italienske utøvere til Igls for den siste store treningssamlingen før verdenscupsesongen starter.","spik_no":"Artikkelen handler om det italienske landslaget i skeleton – ikke alpint – som samles i Igls etter treningsopphold i Cortina. 18 utøvere er tatt ut av teknisk direktør Armin Zoeggeler, med Dominik Fischnaller i spissen, og treningssamlingen varer frem til fredag som siste forberedelse før verdenscupåpningen i Winterberg 28. november. Igls i Tirol er et av de mest brukte øvingsanleggene i Europa for disse disiplinene.","url":"https://www.neveitalia.it/sport/slittino/news/dopo-cortina-18-azzurri-scendono-in-pista-a-igls-per-l-ultimo-vero-raduno-prima-della-coppa-del-mondo","pub_date":"2026-11-15T11:50:00.000Z","fetched_at":"2026-11-15 12:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":153115,"source_name":"SkinEWS","country":"SUI","title_no":"VM-sesongen også over for Tommaso Sala","title_orig":"WM-Saison auch für Tommaso Sala futsch","summary_no":"Tommaso Sala må gi opp resten  Black\", alle 13.00 start con Pinheiro Braathen padrone. Da Noel a McGrath e tanti altri, che lotta per il podio","summary_no":"Andre omgang i Levi starter klokken 13.00 med Pinheiro Braathen i ledelsen. Noel, McGrath og flere andre kjemper om pallplass.","spik_no":"Lucas Pinheiro Braathen leder etter første omgang i slalåmrennet i Levi, med et solid forsprang på nærmeste forfølger Clément Noel. Braathen, som representerer Brasil etter å ha skiftet nasjonalitet fra Norge, vant storslalåmen i Sölden tidligere denne sesongen og jakter nå sin andre strake verdenscupseier. 26-åringen vant også slalåmen i Levi i 2025, noe som gjør ham til klar favoritt. Blant de norske håpene er Hallberg, Kristoffersen og Haugan, som alle må hente inn tid i andre omgang.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/seconda-manche-sulla-levi-black-alle-1300-start-con-pinheiro-braathen-padrone-da-noel-a-mcgrath-e-tanti-altri-che-lotta-per-il-","pub_date":"2026-11-15T11:15:00.000Z","fetched_at":"2026-11-15 11:17:47","lang_orig":"it","category":null,"athletes":"Atle Lie McGrath,Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA","NOR"],"also_sources":[],"norwegian":true},{"id":152735,"source_name":"Ski Racing","country":"INT","title_no":"Braathen dominerte første omgang i Levi-slalåmen","title_orig":"Lucas Pinheiro Braathen Dominates Run 1 of Levi Men’s Slalom","summary_no":"Lucas Pinheiro Braathen leverte en sterk første omgang i herreslalåmen i Levi og tok kommandoen i rennet.","spik_no":"Lucas Pinheiro Braathen tok kommandoen i første omgang av herreslalåmen i Levi med en ledelse på 0,65 sekunder foran franske Clément Noël, mens østerrikske Joshua Sturm var tredje 0,84 sekunder bak. Braathen er forsvarende vinner i Levi og åpnet dermed sesongen på samme vis som fjoråret. Norske Atle Lie McGrath lå på fjerdeplass, kun 0,07 sekunder bak tredjeplassen, noe som lovet godt for den tette andreomgangen. Braathen, som kjører for Brasil etter å ha skiftet nasjonalitet f
