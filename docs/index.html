rgl – samme lag som i Finland","title_orig":"E' già ufficiale l'Italia maschile per Gurgl: domenica prossima la stessa formazione proposta in Finlandia","summary_no":"Det italienske herrelaget til Gurgl er allerede offisielt bekreftet, med samme sammensetning som ble benyttet i Finland neste søndag.","spik_no":"Italia stiller med samme syv mann i Gurgl slalåm 22. november som de brukte i Levi helgen før. Alex Vinatzer er lagets fremste kort etter å ha tatt en femteplass i Finland, mens Saccardi var uheldig og miste adgang til 2. omgang med kun fem hundredeler. Gurgl i Østerrike er en relativt ny destinasjon på World Cup-programmet, og menn kjører her for fjerde år på rad – i fjor vant franskmannen Paco Rassat sitt første verdenscuprenn foran Atle Lie McGrath, som siden tok slalåmkula.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/e-gia-ufficiale-l-italia-maschile-per-gurgl-domenica-prossima-la-stessa-formazione-proposta-in-finlandia","pub_date":"2026-11-16T10:35:00.000Z","fetched_at":"2026-11-16 10:45:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":158043,"source_name":"ORF Sport","country":"AUT","title_no":"Truppe beundrer Aichers «uinteresse»","title_orig":"Truppe bewundert Aichers „Desinteresse“","summary_no":"Truppe har latt seg imponere av Aichers tilsynelatende likegyldighet.","spik_no":"Katharina Truppe startet sesongen med tredjeplass i Levi og befester sin posisjon som Østerrikes nummer én i slalåm. Øverst på pallen endte Emma Aicher, som imponerte Truppe med sin tilsynelatende ro og likegyldighet på banen. «Det ser ut som om det ikke interesserer henne», sa Truppe anerkjennende om den unge tyske løperens stil. Aicher pekes nå ut som en potensiell arvtaker etter Mikaela Shiffrin i slalåm-verdenskvpen, ettersom amerikaneren kun planlegger å delta i utvalgte renn denne sesongen.","url":"https://sport.orf.at/stories/3164969/","pub_date":"2026-11-16T10:19:19.000Z","fetched_at":"2026-11-16 10:30:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":157810,"source_name":"Neveitalia","country":"ITA","title_no":"Kan en perfekt Pinheiro Braathen true Odermatt? Et svært krevende regnestykke","title_orig":"Un Pinheiro Braathen perfetto può insidiare Odermatt? Resta una missione complicatissima, ma... facciamo i conti","summary_no":"En perfekt sesong fra Pinheiro Braathen kan teoretisk true Marco Odermatt, men oppgaven er ekstremt vanskelig. Tallene er gjort opp.","spik_no":"Spørsmålet om Lucas Pinheiro Braathen kan utfordre Marco Odermatt om den store krystallkula er blitt analysert nøye, og tallene viser at oppgaven er ekstremt krevende. Odermatt har vunnet den totale verdenscupen fire sesonger på rad og er regnet som den dominerende krafta i moderne alpint. Braathen, som kjører for Brasil etter å ha forlatt det norske landslaget, er en av de få som har vist kapasitet til å utfordre østerrikerens overlegenhet – særlig i teknikkdisiplinene – men krever trolig nær perfekte resultater gjennom hele sesongen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/un-pinheiro-braathen-perfetto-puo-insidiare-odermatt-resta-una-missione-complicatissima-ma-facciamo-i-conti","pub_date":"2026-11-16T10:00:00.000Z","fetched_at":"2026-11-16 10:15:03","lang_orig":"it","category":null,"athletes":"Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":157826,"source_name":"SkinEWS","country":"SUI","title_no":"Lettere endret Swiss-Ski-tropp til Gurgl","title_orig":"Leicht verändertes Swiss-Ski-Aufgebot für Gurgl","summary_no":"Swiss Ski har gjort mindre justeringer i troppen som skal representere Sveits i Gurgl.","spik_no":"Swiss Ski har gjort mindre justeringer i troppen sin foran slalåmrennet i Gurgl i Østerrike, som tradisjonelt er blant de første teknikkrunnene i verdenscupsesongen. Gurgl-rennet på cirka 2 000 meters høyde er kjent for å gi utfordrende snøforhold tidlig i sesongen. Sveits har for øyeblikket et bredt og sterkt slalåmlag, med utøvere som Loïc Meillard og Daniel Yule blant de mest aktuelle kandidatene til pallplasser.","url":"https://www.skinews.ch/news/2026/leicht-veraendertes-aufgebot/","pub_date":"2026-11-16T09:51:58.000Z","fetched_at":"2026-11-16 10:15:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":157866,"source_name":"ORF Sport","country":"AUT","title_no":"Kriechmayr holder alle muligheter åpne","title_orig":"Kriechmayr hält sich alle Optionen offen","summary_no":"Vincent Kriechmayr har ikke bestemt seg for hvilke disipliner han satser på, og holder foreløpig alle dører åpne.","spik_no":"Vincent Kriechmayr holder alle muligheter åpne foran det første fartsrennet i sesongen, super-G i Copper Mountain om to uker. 35-åringen fra Østerrike gjennomførte en skadefri forberedelse og viser til sesongen der han vant utfor i Courchevel og super-G i Beaver Creek som bevis på at han fortsatt hører hjemme i verdenstoppen. Kriechmayr, som er dobbel verdensmester fra Cortina 2021, omtaler selv dette som muligens sin siste sesong og sier han vil avslutte karrieren den dagen han ikke lenger kan hevde seg blant de beste.","url":"https://sport.orf.at/stories/3164808/","pub_date":"2026-11-16T08:56:47.000Z","fetched_at":"2026-11-16 10:15:06","lang_orig":"de","category":null,"athletes":"Vincent Kriechmayr","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":157812,"source_name":"Neveitalia","country":"ITA","title_no":"Levi tenner pallen-kampen: Allerede rykk i toppen mot Val di Fassa","title_orig":"Levi accende il Gioco dei Podi: è già fuga in vetta, la corsa verso la Val di Fassa entra nel vivo","summary_no":"Etter Levi er pallkampen i Verdenscupen allerede i gang, og løpet mot Val di Fassa har for alvor begynt.","spik_no":"Etter åpningshelgen i Levi har pallkampen i verdenscupens slalåmklassement allerede tatt form, og rivaliseringen frem mot neste teknikkhelg i Val di Fassa er for alvor i gang. Levi-rennet markerer tradisjonelt startskuddet for slalåmsesongen for herrer, og resultatene herfra legger premissene for hvem som er i form tidlig i vinter. Poengsummen fra Finland gir allerede viktige indikasjoner på styrkeforholdet mellom de beste slalåmkjørerne i verdenstoppen denne sesongen.","url":"https://www.neveitalia.it/sport/fantasy/giocodeipodi/news/levi-accende-il-gioco-dei-podi-e-gia-fuga-in-vetta-la-corsa-verso-la-val-di-fassa-entra-nel-vivo","pub_date":"2026-11-16T08:45:00.000Z","fetched_at":"2026-11-16 10:15:03","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":157815,"source_name":"Neveitalia","country":"ITA","title_no":"Noel med god start! Pinheiro Braathen og Meillard dobbelt på pallen – Vinatzer nær topp 15 i slalåm","title_orig":"Noel, Ok la partenza è giusta! Pinheiro Braathen e Meillard da doppio podio, Vinatzer ad un soffio dalla top 15 di slalom","summary_no":"Noel imponerte med en sterk åpning, mens Pinheiro Braathen og Meillard begge kapret pallplasser. Vinatzer var svært nær topp 15.","spik_no":"Clément Noel åpnet sesongen sterkt i Levi-slalåmen, mens Lucas Pinheiro Braathen og Loïc Meillard begge tok pallplasser og markerte seg som toppkandidater videre i vinter. Noel, som er regjerende verdensmester i slalåm, er kjent for å levere noen av de mest aggressive og presise kjøringene i verdenscupen. Meillard fra Sveits er en allsidig utøver som hevder seg i flere disipliner, mens Braathen-Brasil-satsingen fortsetter å gi resultater på høyeste nivå. Alex Vinatzer fra Italia var også nær topp 15 og viser stigende form.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/noel-ok-la-partenza-e-giusta-pinheiro-braathen-e-meillard-da-doppio-podio-vinatzer-ad-un-soffio-dalla-top-15-di-slalom","pub_date":"2026-11-15T19:15:00.000Z","fetched_at":"2026-11-16 10:15:03","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","ITA","SUI"],"also_sources":[],"norwegian":false},{"id":157873,"source_name":"ORF Sport","country":"AUT","title_no":"U20-VM i Canada uten Russland","title_orig":"U20-WM in Kanada findet ohne Russland statt","summary_no":"U20-VM i alpint i Canada arrangeres uten deltakelse fra Russland.","spik_no":"U20-VM i ishockey i Canada avholdes uten Russland etter at canadiske myndigheter nekter å utstede visum til det russiske laget. Beslutningen kommer i kjølvannet av et CAS-kjennelse fra oktober som opphevet suspensjonen av russiske ishockeylag til tross for den pågående krigen mot Ukraina. Norge, som hadde varslet boikott dersom Russland fikk delta, stiller nå til start. Turneringen spilles i Edmonton og Red Deer fra 26. desember 2026 til 5. januar 2027. Merk: denne saken handler om ishockey, ikke alpint.","url":"https://sport.orf.at/stories/3164987/","pub_date":"2026-11-15T18:52:37.000Z","fetched_at":"2026-11-16 10:15:06","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":157816,"source_name":"Neveitalia","country":"ITA","title_no":"De Aliprandini, Talacci, Della Vite, Seppi og Gerosa til Sulden – deretter storslalåm i USA","title_orig":"A Solda anche De Aliprandini, Talacci, Della Vite, Seppi e Gerosa, poi sarà tempo di giganti negli States","summary_no":"En rekke italienske alpinister samles i Sulden, før oppmerksomheten rettes mot storslalåmrenn i USA.","spik_no":"En gruppe italienske alpinister, deriblant Luca De Aliprandini, Giovanni Franzoni Talacci, Filippo Della Vite, Simon Seppi og Mattia Gerosa, samles til treningsleir i Sulden i Sør-Tirol før sesongens første storslalåmrenn i USA. Sulden er et populært høyfjellsområde i Italia som brukes aktivt til teknikktrening tidlig i sesongen på grunn av stabile snøforhold. De Aliprandini er den mest merittert es":"Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":156924,"source_name":"Neveitalia","country":"ITA","title_no":"Meillard dedikerte seieren til Mélanie – Noel feilet aldri i Levi","title_orig":"Meillard, la dedica è per Mélanie: \"So quanto aveva lavorato\". Noel nella \"sua\" Levi non sbaglia mai: \"Due manche in controllo\"","summary_no":"Meillard dedikerte resultatet til Mélanie og fremhevet hvor hardt hun hadde jobbet. Noel leverte nok en gang i Levi med to kontrollerte omganger.","spik_no":"Loïc Meillard tok andreplassen i åpningsslalåmen i Levi og dedikerte resultatet til lagvenninnen Mélanie Meillard – sannsynligvis søsteren hans – og understreket hvor hardt hun hadde jobbet. Clement Noel bekreftet nok en gang at han er spesielt sterk i Levi, der han nå har tatt sitt fjerde strake pallplass på den finske arenaen. Vinneren av rennet var Lucas Pinheiro Braathen, som sikret seg den tradisjonsrike rein-premien som tildeles slalåmvinneren i Lappland.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/meillard-la-dedica-e-per-melanie-so-quanto-aveva-lavorato-noel-nella-sua-levi-non-sbaglia-mai-due-manche-in-controllo","pub_date":"2026-11-15T15:50:00.000Z","fetched_at":"2026-11-15 15:56:44","lang_orig":"it","category":null,"athletes":"Clement Noel,Loïc Meillard,Melanie Meillard","athlete_nations":["FRA","SUI"],"also_sources":[],"norwegian":false},{"id":157951,"source_name":"Sportschau","country":"GER","title_no":"Straßer imponert over tetninga i Levi-slalåmen: – Rett og slett perverst","title_orig":"Slalom in Levi: Straßer staunt über Leistungsdichte - \"Nur noch pervers\"","summary_no":"Linus Straßer er overrasket over hvor jevnt nivået er i slalåmen i Levi. Konkurransen er tøffere enn noen gang.","spik_no":"Linus Straßer endte på 13. plass i slalåmrennet i Levi, og mistet én posisjon i annenomgangen. Den tyske slalåmspesialisten beskriver nivået i verdenstoppen som \"perverst\" jevnt, og erkjenner selv at kjøringen hans ikke var helhetlig nok på den islagte og krevende finske bakken. Straßer, som har tre verdenscupseire i slalåm, er likevel optimistisk fremover og peker på at rytmeskiftene i løypen gjorde det ekstremt vanskelig å finne en god flytsone gjennom hele rennet.","url":"https://www.sportschau.de/regional/br/br-strasser-staunt-ueber-leistungsdichte-nur-noch-pervers-102.html","pub_date":"2026-11-15T14:54:23.000Z","fetched_at":"2026-11-16 10:15:08","lang_orig":"de","category":null,"athletes":"Linus Straßer","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":155937,"source_name":"SVT Sport","country":"SWE","title_no":"Gustav Wissting etter den historiske noteringen","title_orig":"Gustav Wissting efter historiska noteringen","summary_no":"Gustav Wissting kommenterer sin historiske prestasjon i alpint.","spik_no":"Den svenske alpinisten Gustav Wissting skrev historiske sider da han fra startnummer 82 klarte å kvalifisere seg videre til andre omgang i slalåm – det sent har ingen startet og likevel kommet videre, ifølge FIS. 21-åringen endte til slutt på 17.-plass, hans beste karriereresultat noensinne. Wissting krediterer mye av suksessen til lagmiljøet på det svenske alpinlandslaget, der William Hansson, Fabian Ax Swartz og Kristoffer Jakobsen bidrar til en særegen treningskultur med intern konkurranse utøverne imellom.","url":"https://www.svt.se/sport/alpint/gustav-wissting-efter-historiska-noteringen","pub_date":"2026-11-15T14:43:29.000Z","fetched_at":"2026-11-15 14:45:05","lang_orig":"sv","category":null,"athletes":"Gustav Wissting","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":155401,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrikske menn går glipp av OL-sjansen","title_orig":"Österreichs Männer verpassen Chance auf Olympia","summary_no":"De østerrikske alpinistene misset en viktig mulighet til å kvalifisere seg til vinter-OL.","spik_no":"Artikkelteksten handler ikke om alpint, men om østerriksk lacrosse: det østerrikske herrelandslaget tapte 15–26 mot Hellas i Sixes-EM i Salou, Spania, og er dermed ute av OL-kvalifiseringen til Los Angeles 2028. Sjansen ble allerede før turneringen vurdert som liten. Østerrike skal mandag spille om plasseringene ni til tolv mot Sverige.","url":"https://sport.orf.at/stories/3164974/","pub_date":"2026-11-15T14:21:32.000Z","fetched_at":"2026-11-15 14:30:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":155171,"source_name":"Neveitalia","country":"ITA","title_no":"Vinatzer imponerte med skremmende andrekjøring: – Jeg er kjempefornøyd","title_orig":"E' questo il Vinatzer che tutti vogliono: 2^ manche paurosa e un inizio che fa ben sperare. \"Sono contentissimo\"","summary_no":"Alex Vinatzer leverte en formidabel annen omgang og startet sesongen med lovende form. – Jeg er kjempefornøyd, sa alpinisten etterpå.","spik_no":"Alex Vinatzer imponerte med den raskeste andrekjøringen i Levi-slalåmen, nesten seks tideler foran Meillard på den avgjørende omgangen, og klatret fra 23.-plass til en samlet femteplass. 27-åringen fra Gröden har lenge blitt sett på som et av Italias største slalåmtalenter, men hans siste pallplass i slalåm var i Kitzbühel i januar 2025, da han mistet seieren med kun ni hundredeler til Noël. En slik andrekjøring gir likevel grunn til optimisme før de neste rennene, og Vinatzer selv var tydelig fornøyd med formen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/e-questo-il-vinatzer-che-tutti-vogliono-2-manche-paurosa-e-un-inizio-che-fa-ben-sperare-sono-contentissimo","pub_date":"2026-11-15T14:10:00.000Z","fetched_at":"2026-11-15 14:15:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":155151,"source_name":"Ski Racing","country":"INT","title_no":"Braathen vinner igjen i Levi – to av to i sesongåpningen","title_orig":"Lucas Pinheiro Braathen Wins Again in Levi, Opens Season Two for Two","summary_no":"Lucas Pinheiro Braathen tok sin andre strake seier i Levi og innleder sesongen med to strake triumfer.","spik_no":"Lucas Pinheiro Braathen innleder sesongen 2026/27 med to strake seire etter å ha vunnet slalåmen i Levi med tiden 1:48.04, kun uker etter storslalåmseieren i Sölden. Franskmannen Clément Noël tok andreplassen, 0,56 sekunder bak, mens Loïc Meillard ble treer. Braathen, som representerer Brasil etter å ha skiftet nasjonalitet fra Norge i 2023, befester seg raskt som en av de fremste teknikkjørerne i verdenscupen og får nok en reinsdyr å navngi etter tradisjonen i Levi.","url":"https://skiracing.com/lucas-pinheiro-braathen-wins-again-in-levi-opens-season-two-for-two/","pub_date":"2026-11-15T14:05:57.000Z","fetched_at":"2026-11-15 14:15:01","lang_orig":"en","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":155053,"source_name":"ORF Sport","country":"AUT","title_no":"Hirscher står også over slalåmen i Gurgl","title_orig":"Hirscher verzichtet auch auf Slalom in Gurgl","summary_no":"Marcel Hirscher har valgt å ikke stille til start i slalåmrennet i Gurgl, og avstår dermed fra nok en konkurranse denne sesongen.","spik_no":"Marcel Hirscher har valgt å stå over slalåmrennet i Gurgl, og avstår dermed fra å bruke en av de fire wildcard-plassene han tildeles per disiplin fra FIS denne sesongen. 37-åringen, som gjør comeback for Østerrike etter å ha avsluttet karrieren i 2019, har heller ikke stilt i Sölden eller tidligere renn, og ifølge hans management fortsetter han å prioritere trening. Hirscher er tidenes mest meritterte alpinist med åtte sammenlagtseire i verdenscupen og 67 individuelle seire, og forventningene til comebacket er enormt — men tidspunktet for hans neste start er fortsatt uvisst.","url":"https://sport.orf.at/stories/3164973/","pub_date":"2026-11-15T13:55:44.000Z","fetched_at":"2026-11-15 14:00:04","lang_orig":"de","category":null,"athletes":"Marcel Hirscher","athlete_nations":["NED"],"also_sources":["Neveitalia"],"norwegian":false},{"id":154823,"source_name":"Neveitalia","country":"ITA","title_no":"Alle er gale med \"Pinheiro\" – også i Lappland. Og utfordringen til Odermatt er kastet: \"Ja, jeg tror på sammenlagtcupen\"","title_orig":"Tutti pazzi per \"Pinheiro\" anche in Lapponia. E la sfida a Odermatt è lanciata: \"Sì, credo nella coppa generale\"","summary_no":"\"Pinheiro\" er blitt en stor favoritt også i Lappland, og han erklærer nå at han tror han kan utfordre Odermatt om sammenlagtseieren i verdenscupen.","spik_no":"Lucas Pinheiro Braathen vant slalåmen i Levi og erklærte etterpå at han tror han kan utfordre Marcel Odermatt om den store sammenlagtcupen. Med sin tiende verdenscupseier i karrieren og allerede 200 poeng på kontoen etter bare to renn, er brasilianeren i strålende form. Braathen, som tidligere konkurrerte for Norge, tok sitt andre verdenscuptrof i storslalåm forrige sesong – tre år etter at han vant slalåmkula under norsk flagg. Han slo klart Clément Noël og Loic Meillard i Levi, og starter sesongen med seirer fra både Sölden og Finland.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/tutti-pazzi-per-pinheiro-anche-in-lapponia-e-la-sfida-a-odermatt-e-lanciata-si-credo-nella-coppa-generale","pub_date":"2026-11-15T13:40:00.000Z","fetched_at":"2026-11-15 13:45:02","lang_orig":"it","category":null,"athletes":"Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":154705,"source_name":"ORF Sport","country":"AUT","title_no":"Braathen strålte under østerriksk slalomkollaps","title_orig":"Braathen glänzt bei ÖSV-Debakel im Slalom","summary_no":"Braathen leverte en imponerende prestasjon da det østerrikske alpinlandslaget hadde en svak dag i slalomrennet.","spik_no":"Lucas Pinheiro Braathen vant slalomåpningen i Levi og tok sin tiende verdenscupseier totalt. Som første kjører noensinne vant han i Levi for andre år på rad, etter at han også tok riesentorlaupen i Söldeni sesongåpningen. Østerrike opplevde sitt verste slalomresultat siden Alta Badia i 2006 – kun Johannes Strolz kvalifiserte seg til finalen på 22.-plass. Joshua Sturm var den store skuffelsen: overraskende på tredjeplass etter første omgang, men falt ut i finalen og mistet sjansen til sitt første pallplass i verdenscupen.","url":"https://sport.orf.at/stories/3164965/","pub_date":"2026-11-15T13:24:17.000Z","fetched_at":"2026-11-15 13:30:04","lang_orig":"de","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":154439,"source_name":"Sportschau","country":"GER","title_no":"Braathen dominerte i Levi – Straßer solid, østerriksk kollaps","title_orig":"Straßer solide in Levi - Braathen-Demonstration bei ÖSV-Debakel","summary_no":"Lucas Pinheiro Braathen imponerte stort i Levi, mens tyske Straßer leverte solid. Det ble et nedtur for de østerrikske løperne.","spik_no":"Lucas Pinheiro Braathen dominerte fullstendig i Levi og vant foran Clément Noël og Loïc Meillard, mens Linus Straßer endte på en 13.-plass – nær to sekunder bak. Det østerrikske landslaget opplevde et realt sammenbrudd: Joshua Sturm, Michael Matt, Fabio Gstrein og Simon Rueland kjørte alle ut i andreomgangen, og Johannes Strolz som eneste østerriker i mål havnet sist av de 21 som fullførte. Sandvik og Vinatzer klatret begge 18 plasser i andreomgangen og viste at det var mulig å hente inn mye tid.","url":"https://www.sportschau.de/regional/br/br-strasser-solide-in-levi-braathen-demonstration-bei-oesv-debakel-102.html","pub_date":"2026-11-15T12:58:30.000Z","fetched_at":"2026-11-15 13:00:05","lang_orig":"de","category":null,"athletes":"Linus Straßer,Lucas Braathen","athlete_nations":["BRA","GER"],"also_sources":[],"norwegian":false},{"id":154432,"source_name":"franceinfo","country":"FRA","title_no":"Noël tok andreplass i åpningsslalåmen – Braathen vant","title_orig":"Clément Noël deuxième du premier slalom de la saison de Coupe du monde, remporté par Lucas Pinheiro Braathen","summary_no":"Lucas Pinheiro Braathen vant sesongåpningen i slalåm i verdenscupen, mens franske Clément Noël tok andreplass.","spik_no":"Clément Noël tok andreplass i åpningsslalåmen i Levi, der Lucas Pinheiro Braathen vant suverent. For Noël er andreplass en god start på sesongen – franskmannen er en av verdens beste slalåmkjørere og vant blant annet VM-gull i 2021. Braathen leder etter den første slalåmen av totalt tretten i verdenscupen denne sesongen, noe som gir ham et solid utgangspunkt i kampen om verdenscupen sammenlagt.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/clement-noel-deuxieme-du-premier-slalom-de-la-saison-de-coupe-du-monde-remporte-par-lucas-pinheiro-braathen_8283554.html#xtor=RSS-3-%5Bsports%2Fsports-d-hiver%2Fski-alpin%5D","pub_date":"2026-11-15T12:57:23.000Z","fetched_at":"2026-11-15 13:00:05","lang_orig":"fr","category":null,"athletes":"Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA"],"also_sources":[],"norwegian":false},{"id":154319,"source_name":"SkinEWS","country":"SUI","title_no":"Braathen triumferer for andre gang i Levi","title_orig":"Lucas Pinheiro Braathen triumphiert zum zweiten Mal in Levi","summary_no":"Lucas Pinheiro Braathen tok sin andre strake seier i Levi og befester sin posisjon i verdenscupen.","spik_no":"Lucas Pinheiro Braathen vant slalåmåpningen i Levi for andre strake år og befester dermed sin posisjon som en av verdens aller beste slalåmkjørere. Braathen, som kjører for Brasil etter å ha skiftet nasjonalitet fra Norge, startet sesongen med seier i storslalåmen i Sölden og vant nå også det første slalåmrennet. Clément Noël og Loïc Meillard fulgte på de neste plassene, 0,56 og 0,73 sekunder bak brasilianeren.","url":"https://www.skinews.ch/news/2026/pinheiro-braathen-triumphiert/","pub_date":"2026-11-15T12:51:51.000Z","fetched_at":"2026-11-15 13:00:03","lang_orig":"de","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":154359,"source_name":"ORF Sport","country":"AUT","title_no":"Braathen vant herreslalåmen i Levi","title_orig":"Braathen gewinnt Herren-Slalom in Levi","summary_no":"Lucas Pinheiro Braathen tok seieren i herreslalåmen i Levi og starter verdenscupsesongen med stil.","spik_no":"Lucas Pinheiro Braathen vant herreslalåmen i Levi og starter verdenscupsesongen 2026/27 med to seire på to renn, etter å ha vunnet storslalåmen i Sölden. Det østerrikske herrelandslaget opplevde et svart renn: Joshua Sturm, Michael Matt, Fabio Gstrein og Simon Rueland kjørte alle ut i andreomgangen, og Johannes Strolz kom i mål som eneste østerriker – på sisteplass med over tre sekunder opp til Braathen.","url":"https://sport.orf.at/stories/3164971/","pub_date":"2026-11-15T12:50:28.000Z","fetched_at":"2026-11-15 13:00:03","lang_orig":"de","category":null,"athletes":"Clement Noel,Joshua Sturm,Loïc Meillard,Lucas Braathen","athlete_nations":["AUT","BRA","FRA","SUI"],"also_sources":[],"norwegian":false},{"id":154392,"source_name":"Expressen","country":"SWE","title_no":"Fabian Ax Swartz tok karrierens beste plassering","title_orig":"Fabian Ax Swartz med karriärens bästa placering","summary_no":"Fabian Ax Swartz leverte sitt livs løp og sikret sin beste plassering i karrieren.","spik_no":"22 år gamle Fabian Ax Swartz leverte karrierens beste verdenscupresultat med en fjerdeplass i slalåmåpningen i Levi. Svensken var i ledelsen etter andreomgangen en stund, men ble til slutt slått ned fra pallen med knappest mulig margin – kun ett hundredel skilte ham fra Loïc Meillard på tredjeplass. Det er et lovende tegn for svensk alpint, som lenge har ventet på en ny profilert slalåmkjører etter Kristoffer Jakobsen.","url":"https://www.expressen.se/sport/alpint/fabian-ax-swartz-med-karriarens-basta-placering/","pub_date":"2026-11-15T12:49:48.000Z","fetched_at":"2026-11-15 13:00:04","lang_orig":"sv","category":null,"athletes":"Fabian Ax Swartz","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":154372,"source_name":"SVT Sport","country":"SWE","title_no":"Fabian Ax Swartz på fjerdeplass – Gustav Wissting skrev alpinhistorie","title_orig":"Fabian Ax Swartz fyra – Gustav Wissting skrev alpin historia","summary_no":"Fabian Ax Swartz endte på en sterk fjerdeplass, mens Gustav Wissting satte seg selv i alpinhistorien med en meritterende prestasjon.","spik_no":"Fabian Ax Swartz endte på en sterk fjerdeplass i åpningsslalåmen i Levi, mens Gustav Wissting skrev alpinhistorie ved å kvalifisere seg til andreomgangen fra startnummer 82 – det høyeste startnummeret som noen gang har tatt seg videre til et andreløp ifølge FIS. Ax Swartz, 22 år gammel, klatret fra niende til andreplassen i løpet av andreomgangen, men ble til slutt slått ned fra pallen i siste sekund. William Hansson var nest beste svenske etter første omgang på femteplass, men kjørte ut i andreomgangen.","url":"https://www.svt.se/sport/alpint/fabian-ax-swartz-fyra-gustav-wissting-skrev-alpin-historia","pub_date":"2026-11-15T12:49:45.000Z","fetched_at":"2026-11-15 13:00:04","lang_orig":"sv","category":null,"athletes":"Fabian Ax Swartz","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":154339,"source_name":"VG","country":"NOR","title_no":"Braathen overlegen i Levi – vant suverent","title_orig":"Braathen overlegen i Levi – vant suverent","summary_no":"","spik_no":"Lucas Braathen vant sesongens første slalåm i verdenscupen i Levi og kopierte fjorårets triumf på samme bakke – der tok han for øvrig Brasils aller første verdenscupseier. Med startnummer sju satte han et tempo ingen klarte å matche, og hadde 65 hundredeler til gode på Clément Noël etter første omgang. Norske Atle Lie McGrath var nærmest på fjerdeplass etter første omgang, men falt tilbake til syvendeplass i den avgjørende andre omgangen.","url":"https://www.vg.no/sport/i/4EqBgG/lucas-braathen-vant-sesongens-foerste-slalaam-i-verdenscupen?utm_medium=rss","pub_date":"2026-11-15T12:48:41.000Z","fetched_at":"2026-11-15 13:00:03","lang_orig":"no","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":154303,"source_name":"Neveitalia","country":"ITA","title_no":"Braathen-show i Levi – samba igjen, Vinatzer med anger","title_orig":"Lezione di sci a firma Pinheiro Braathen: è ancora samba a Levi, rimonta (e rimpianti) per Vinatzer","summary_no":"Lucas Pinheiro Braathen leverte nok en strålende prestasjon i Levi, mens Alexander Vinatzer måtte slå seg til ro med en skuffende opplevelse til tross for en sterk opptur.","spik_no":"Lucas Pinheiro Braathen gjentok fjorårets triumf i Levi med en overlegen seier i det første slalåmrennet av sesongen, og feiret nok en gang med sin karakteristiske samba. Braathen, som vant OL-gull i storslalåm under Milano-Cortina 2026, hadde 65 hundredeler til gode etter første omgang og kontrollerte andreomgangen til seier. Alex Vinatzer imponerte med å klatre fra 23.-plass til femteplass i andreomgangen, men mistet bronseplassen med kun ett hundredel til svenske Fabian Ax Swartz.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/lezione-di-sci-a-firma-pinheiro-braathen-e-ancora-samba-a-levi-rimonta-e-rimpianti-per-vinatzer","pub_date":"2026-11-15T12:45:00.000Z","fetched_at":"2026-11-15 13:00:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Clement Noel,Loïc Meillard,Lucas Braathen","athlete_nations":["BRA","FRA","ITA","SUI"],"also_sources":[],"norwegian":false},{"id":153615,"source_name":"Neveitalia","country":"ITA","title_no":"18 italienske alpinister samles i Igls etter Cortina – siste store samling før verdenscupen","title_orig":"Dopo Cortina, 18 azzurri scendono in pista a Igls per l'ultimo vero raduno prima della Coppa del Mondo","summary_no":"Etter oppholdet i Cortina reiser 18 italienske utøvere til Igls for den siste store treningssamlingen før verdenscupsesongen starter.","spik_no":"Artikkelen handler om det italienske landslaget i skeleton – ikke alpint – som samles i Igls etter treningsopphold i Cortina. 18 utøvere er tatt ut av teknisk direktør Armin Zoeggeler, med Dominik Fischnaller i spissen, og treningssamlingen varer frem til fredag som siste forberedelse før verdenscupåpningen i Winterberg 28. november. Igls i Tirol er et av de mest brukte øvingsanleggene i Europa for disse disiplinene.","url":"https://www.neveitalia.it/sport/slittino/news/dopo-cortina-18-azzurri-scendono-in-pista-a-igls-per-l-ultimo-vero-raduno-prima-della-coppa-del-mondo","pub_date":"2026-11-15T11:50:00.000Z","fetched_at":"2026-11-15 12:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":153115,"source_name":"SkinEWS","country":"SUI","title_no":"VM-sesongen også over for Tommaso Sala","title_orig":"WM-Saison auch für Tommaso Sala futsch","summary_no":"Tommaso Sala må gi opp resten av VM-sesongen på grunn av skade.","spik_no":"Den italienske slalomspesialisten Tommaso Sala (31) har pådratt seg et korsbåndbrudd i høyre kne under trening i Gurgl, og er ute resten av sesongen. Skaden skjedde uten fall, og selv om det innledningsvis ble snakket om en forstuing, viste det seg å være en alvorlig skade. For Sala er dette en brutal gjentakelse — han mistet også VM i 2025 på grunn av skade. Den erfarne teknikeren har aldri vunnet en verdenscupseier, men har jevnlig figurert i slalomtoppen gjennom karrieren.","url":"https://www.skinews.ch/news/2026/saison-tommaso-futsch/","pub_date":"2026-11-15T11:29:58.000Z","fetched_at":"2026-11-15 11:30:05","lang_orig":"de","category":null,"athletes":"Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":153168,"source_name":"SVT Sport","country":"SWE","title_no":"Ukjente Johanna Nordqvist sikter mot verdenscupen","title_orig":"Doldisen Johanna Nordqvist siktar på världscupen","summary_no":"Den lite kjente svenske alpinisten Johanna Nordqvist har ambisjoner om å kvalifisere seg til verdenscupen.","spik_no":"Den 26 år gamle svenske skiskytteren Johanna Nordqvist imponerte med en femteplass i den svenske sesongåpningen, og har nå verdenscupstart som et uttalt mål. Forrige sesong fikk hun kun én verdenscupstart, der hun endte på 79. plass i Nove Mesto. Etter lørdagens prestasjon mener begge SVT-ekspertene Mona Brorsson og Björn Ferry at Nordqvist fortjener en plass i verdenscuplaget til premiären om to uker. Merk: denne saken handler om skiskyting, ikke alpint.","url":"https://www.svt.se/sport/vintersport/doldisen-johanna-nordqvist-siktar-pa-varldscupen","pub_date":"2026-11-15T11:17:11.000Z","fetched_at":"2026-11-15 11:30:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":152927,"source_name":"Neveitalia","country":"ITA","title_no":"Andre omgang på «Levi Black» – Pinheiro Braathen i tet","title_orig":"Seconda manche sulla \"Levi Black\", alle 13.00 start con Pinheiro Braathen padrone. Da Noel a McGrath e tanti altri, che lotta per il podio","summary_no":"Andre omgang i Levi starter klokken 13.00 med Pinheiro Braathen i ledelsen. Noel, McGrath og flere andre kjemper om pallplass.","spik_no":"Lucas Pinheiro Braathen leder etter første omgang i slalåmrennet i Levi, med et solid forsprang på nærmeste forfølger Clément Noel. Braathen, som representerer Brasil etter å ha skiftet nasjonalitet fra Norge, vant storslalåmen i Sölden tidligere denne sesongen og jakter nå sin andre strake verdenscupseier. 26-åringen vant også slalåmen i Levi i 2025, noe som gjør ham til klar favoritt. Blant de norske håpene er Hallberg, Kristoffersen og Haugan, som alle må hente inn tid i andre omgang.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/seconda-manche-sulla-levi-black-alle-1300-start-con-pinheiro-braathen-padrone-da-noel-a-mcgrath-e-tanti-altri-che-lotta-per-il-","pub_date":"2026-11-15T11:15:00.000Z","fetched_at":"2026-11-15 11:17:47","lang_orig":"it","category":null,"athletes":"Atle Lie McGrath,Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA","NOR"],"also_sources":[],"norwegian":true},{"id":152735,"source_name":"Ski Racing","country":"INT","title_no":"Braathen dominerte første omgang i Levi-slalåmen","title_orig":"Lucas Pinheiro Braathen Dominates Run 1 of Levi Men’s Slalom","summary_no":"Lucas Pinheiro Braathen leverte en sterk første omgang i herreslalåmen i Levi og tok kommandoen i rennet.","spik_no":"Lucas Pinheiro Braathen tok kommandoen i første omgang av herreslalåmen i Levi med en ledelse på 0,65 sekunder foran franske Clément Noël, mens østerrikske Joshua Sturm var tredje 0,84 sekunder bak. Braathen er forsvarende vinner i Levi og åpnet dermed sesongen på samme vis som fjoråret. Norske Atle Lie McGrath lå på fjerdeplass, kun 0,07 sekunder bak tredjeplassen, noe som lovet godt for den tette andreomgangen. Braathen, som kjører for Brasil etter å ha skiftet nasjonalitet fra Norge, har etablert seg som en av verdens beste slalåmkjørere med flere verdenscupseirer.","url":"https://skiracing.com/lucas-pinheiro-braathen-dominates-run-1-of-levi-mens-slalom/","pub_date":"2026-11-15T11:01:57.000Z","fetched_at":"2026-11-15 11:15:02","lang_orig":"en","category":null,"athletes":"Clement Noel,Joshua Sturm,Lucas Braathen","athlete_nations":["AUT","BRA","FRA"],"also_sources":[],"norwegian":false},{"id":152409,"source_name":"Neveitalia","country":"ITA","title_no":"Kun Vinatzer til finalen i Levi-slalåmen – italiensk skuffelse","title_orig":"Sofferenza pura per lo slalom azzurro: si qualifica solo Vinatzer, 23° a Levi. \"Non ho preso rischi visto l'inizio degli ultimi anni\"","summary_no":"Italia hadde en tung dag i slalåmen i Levi, der kun Alexander Vinatzer kvalifiserte seg til finalen med en 23. plass. «Jeg tok ingen sjanser etter de siste årenes svake åpninger,» sa han.","spik_no":"Kun Alexander Vinatzer tok seg videre til finalen i åpningsslalåmen i Levi, der han endte på 23. plass med 1,80 sekunder opp til ledende Lucas Pinheiro Braathen etter første omgang. Vinatzer innrømmet selv at han ikke tok nok sjanser, et valg han begrunnet med svake åpningsrenn de siste sesongene. Av sju italienske startende var han den eneste som kvalifiserte seg, og Tommaso Saccardi røk ut med kun fem hundredeler for mye. Resultatet bekrefter den vedvarende krisen i italiensk herreslalåm på verdenscupnivå.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/sofferenza-pura-per-lo-slalom-azzurro-si-qualifica-solo-vinatzer-23-a-levi-non-ho-preso-rischi-visto-l-inizio-degli-ultimi-anni","pub_date":"2026-11-15T10:40:00.000Z","fetched_at":"2026-11-15 10:45:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Lucas Braathen","athlete_nations":["BRA","ITA"],"also_sources":[],"norwegian":false},{"id":152119,"source_name":"ORF Sport","country":"AUT","title_no":"Sturm overrasket med ledelse foran Braathen","title_orig":"Sturm überrascht bei Führung von Braathen","summary_no":"Sturm overrasket alle ved å ta ledelsen foran Braathen i rennet.","spik_no":"Lucas Pinheiro Braathen leder etter første omgang i slalåmåpningen i Levi med 0,65 sekunder ned til franske Clément Noël, mens østerrikske Joshua Sturm overrasket stort ved å kjøre inn på tredjeplass med startnummer 27. Braathen, som kjører for Brasil, viste toppform allerede i Sölden der han dominerte storslalåmen. Sturm er 25 år og har aldri stått på pallen i verdenscupen, men etter en feilfri første omgang på gode føreforhold er karrierens første pallplass innen rekkevidde. «Definitiv er jeg en bedre skiløper i år enn i fjor», sa Sturm selv etter løpet.","url":"https://sport.orf.at/stories/3164962/","pub_date":"2026-11-15T10:13:19.000Z","fetched_at":"2026-11-15 10:15:04","lang_orig":"de","category":null,"athletes":"Clement Noel,Joshua Sturm,Lucas Braathen","athlete_nations":["AUT","BRA","FRA"],"also_sources":[],"norwegian":false},{"id":152026,"source_name":"Sportschau","country":"GER","title_no":"Braathen i en klasse for seg etter 1. omgang – Straßer jakter pallen","title_orig":"Braathen im 1. Lauf in eigener Liga - Straßer lauert aufs Podest","summary_no":"Lucas Braathen leverte en imponerende første omgang og leder suverent. Linus Straßer ligger an til å kjempe om pallplass.","spik_no":"Lucas Braathen leder suverent etter første omgang i slalåmrennet i Levi, med 65 hundredelers forsprang på franskmannen Clément Noël. Linus Straßer er kun 51 hundredeler bak tredjeplassen og har gode sjanser for pallen i finaleomgangen. Braathen, som kjører for Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåmkuglens totalpris forrige sesong og viste igjen klasse på den krevende Levi Black-løypa i iskalde forhold.","url":"https://www.sportschau.de/regional/br/br-braathen-im-1-lauf-in-eigener-liga-strasser-lauert-aufs-podest-102.html","pub_date":"2026-11-15T09:58:27.000Z","fetched_at":"2026-11-15 10:00:06","lang_orig":"de","category":null,"athletes":"Linus Straßer,Lucas Braathen","athlete_nations":["BRA","GER"],"also_sources":[],"norwegian":false},{"id":151927,"source_name":"VG","country":"NOR","title_no":"Braathen i egen klasse i Levi – leder suverent etter første omgang","title_orig":"Braathen i egen klasse i Levi – leder suverent etter første omgang","summary_no":"","spik_no":"Lucas Braathen leverte en enestående første omgang i Levi-slalåmen og leder med 65 hundredeler foran franskmannen Clément Noël, mens bestevennen Atle Lie McGrath er på fjerdeplass med 85 hundredelers tap. Braathen selv sier han fant rytmen tidlig og klarte å utnytte terrenget i den isdekte løypa til sin fordel. McGrath karakteriserer Levi som «kanskje den bakken Lucas er best i i slalåm» — et utsagn som understreker Braathens spesielle tilknytning til den finske arenaen, der han også vant i fjor.","url":"https://www.vg.no/sport/i/pMLPVW/lucas-pinheiro-braathen-i-egen-klasse-i-levi-leder-suverent-etter-foerste-omgang?utm_medium=rss","pub_date":"2026-11-15T09:48:52.000Z","fetched_at":"2026-11-15 10:00:04","lang_orig":"no","category":null,"athletes":"Atle Lie McGrath,Lucas Braathen","athlete_nations":["BRA","NOR"],"also_sources":[],"norwegian":true},{"id":151906,"source_name":"SkinEWS","country":"SUI","title_no":"Lucas Pinheiro Braathen på vei mot tittelforsvar","title_orig":"Lucas Pinheiro Braathen auf dem Weg zur Titelverteidigung","summary_no":"Lucas Pinheiro Braathen er i rute for å forsvare tittelen sin og viser storform i konkurransen.","spik_no":"Lucas Pinheiro Braathen er i rute for å forsvare seieren sin fra Levi-slalåmen i fjor, og kan bli den første kjøreren som vinner det samme verdensscuprenn i Levi to år på rad. Den 26 år gamle brasiliansk-norske utøveren leder etter første omgang med 65 hundredelers margin til Clément Noël, mens Joshua Sturm fra Østerrike er på tredjeplass. Braathen vant slalåmkuglens totalpris forrige sesong og åpnet inneværende sesong med seier i storslalåmen i Sölden.","url":"https://www.skinews.ch/news/2026/pinheiro-braathen-titelverteidigung/","pub_date":"2026-11-15T09:48:10.000Z","fetched_at":"2026-11-15 10:00:04","lang_orig":"de","category":null,"athletes":"Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA"],"also_sources":[],"norwegian":false},{"id":151737,"source_name":"Neveitalia","country":"ITA","title_no":"Braathen skremt igjen i åpningen i Levi: 65 hundredeler bak Noel etter et historisk løp","title_orig":"Lucas Pinheiro Braathen fa spavento anche in apertura a Levi: 65 centesimi a Noel con una manche da antologia","summary_no":"Lucas Pinheiro Braathen imponerte i Levi-åpningen med et minneverdig løp, men endte 65 hundredeler bak Clément Noel etter første omgang.","spik_no":"Lucas Pinheiro Braathen leverte en imponerende første omgang i slalomåpningen i Levi, men endte likevel 65 hundredeler bak franske Clément Noel. Braathen, som representerer Brasil, vant historisk i nettopp Levi for ett år siden og ga landet sin første verdenscupseier noensinne. 26-åringen var allerede i storform etter å ha vunnet sesongåpningen i Sölden, og ifølge italienske medier dominerte han alle sektorer av løypen i første omgang. McGrath fulgte på fjerdeplass bak en sterk Sturm, mens Vinatzer lå hele 1,80 sekunder bak.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/lucas-pinheiro-braathen-fa-spavento-anche-in-apertura-a-levi-65-centesimi-a-noel-con-una-manche-da-antologia","pub_date":"2026-11-15T09:35:00.000Z","fetched_at":"2026-11-15 09:45:02","lang_orig":"it","category":null,"athletes":"Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA"],"also_sources":[],"norwegian":false},{"id":151085,"source_name":"Neveitalia","country":"ITA","title_no":"Klokken 10.00 er det start – norske utøvere jakter på Noel, Meillard og Braathen på Levi Black!","title_orig":"Alle 10.00 si parte, i norvegesi all'attacco di Noel, Meillard e Pinheiro Braathen: che sfida sulla Levi Black!","summary_no":"De norske alpinistene er klare til å utfordre Clément Noel, Loïc Meillard og Lucas Pinheiro Braathen i slalåmrennet på Levi Black.","spik_no":"Klokken 10.00 norsk tid går startskuddet for herreslalåmen på Levi Black, der Clément Noel starter med startnummer 1 som OL-mester og pallgarantist i Levi — franskmannen har stått på pallen i Finland i 2019, 2024 og 2025. Lucas Pinheiro Braathen, som forsvarer seieren sin fra fjoråret, og Loïc Meillard regnes blant de største favorittkandidatene, mens norske Henrik Kristoffersen starter som nummer fem. McGrath, som holder slalåmcupen fra fjoråret, starter med startnummer fire i en åpningskamp som beskrives som ekstremt åpen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/alle-1000-si-parte-i-norvegesi-all-attacco-di-noel-meillard-e-pinheiro-braathen-che-sfida-sulla-levi-black","pub_date":"2026-11-15T07:25:00.000Z","fetched_at":"2026-11-15 08:45:02","lang_orig":"it","category":null,"athletes":"Clement Noel,Loïc Meillard,Lucas Braathen,Timon Haugan","athlete_nations":["BRA","FRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":151195,"source_name":"RTV SLO","country":"SLO","title_no":"Herreslalåm i Levi kl. 10 – ingen slovenere med","title_orig":"Ob 10. uri moški slalom v Leviju, a brez slovenskih predstavnikov","summary_no":"Herreslalåmen i Levi starter klokken 10, men ingen slovenske utøvere er representert i rennet.","spik_no":"Herreslalåmen i Levi åpner sesongen, men Slovenia stiller uten representanter i rennet. Det er oppsiktsvekkende for et land som lenge har vært en slalåmnasjon av rang — med utøvere som Henrik Kristoffersen stilte for Slovenia etter nasjonalitetsskifte, og med en sterk alpintradisjon generelt. Slovenia har tidligere hatt profiler som Mitja Valenčič i slalåm, men mangler tilsynelatende utøvere i verdensklasse denne sesongen til å kvalifisere seg for åpningsrennet i Lappland.","url":"https://www.rtvslo.si/sport/ob-10-uri-moski-slalom-v-leviju-a-brez-slovenskih-predstavnikov/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 08:45:06","lang_orig":"sl","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":151674,"source_name":"RTV SLO","country":"SLO","title_no":"Braathen leder med god margin i Levi","title_orig":"Braathen v Leviju vodi z lepo prednostjo","summary_no":"Lucas Braathen leder konkurransen i Levi med en komfortabel margin etter første omgang.","spik_no":"Lucas Braathen leder etter første omgang i slalåmåpningen i Levi, Finland, med god margin ned til sine nærmeste konkurrenter. Braathen, som representerer Brasil etter å ha skiftet nasjonalitet fra Norge i 2023, er en av de mest rutinerte slalåmkjørerne på verdenscupturen og vant slalåmkula i 2021/22-sesongen. Levi-rennet er tradisjonelt det første slalåmrennet i verdenscupsesongen, og en ledelse etter første omgang er ingen garanti – nettopp i denne bakken er comebacks velkjente.","url":"https://www.rtvslo.si/sport/braathen-v-leviju-vodi-z-lepo-prednostjo/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 09:30:06","lang_orig":"sl","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":152001,"source_name":"RTV SLO","country":"SLO","title_no":"Braathen leder med solid margin – Sturm overraskende på tredjeplass","title_orig":"Braathen vodi z lepo prednostjo, Joshua Sturm kar tretji","summary_no":"Lucas Braathen topper sammenlagt etter første omgang med god ledelse. Joshua Sturm overrasker med en sterk tredjeplass.","spik_no":"Lucas Braathen leder sammenlagt etter første omgang i Levi, mens østerrikske Joshua Sturm overrasker med en tredjeplass. Braathen, 26 år gammal og konkurrerende for Brasil, har vist en dominans få rivalene klarer å matche denne sesongen. Sturm er en relativt ny figur i verdenstoppen og gjør det til en overraskelse at han befinner seg så høyt oppe mot etablerte slalåmstjerner.","url":"https://www.rtvslo.si/sport/braathen-vodi-z-lepo-prednostjo-joshua-sturm-kar-tretji/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 10:00:05","lang_orig":"sl","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":153726,"source_name":"RTV SLO","country":"SLO","title_no":"Braathen leder foran Noel – overraskelser på 3.- og 5.-plass","title_orig":"Braathen vodi pred Noelom, presenečenji na mestih 3 in 5","summary_no":"Lucas Braathen leder sammenlagt foran Clément Noel, med overraskende navn på tredje- og femteplass.","spik_no":"Lucas Braathen leder sammenlagt i slalåmcupen foran franske Clément Noel, med overraskende navn på tredje- og femteplass. Braathen, som nå representerer Brasil etter å ha skiftet nasjonalitet fra Norge i 2023, er en av verdens beste slalåmkjørere og har tidligere vunnet verdenscupsesongen sammenlagt. Noel er regjerende olympisk mester i slalåm fra Beijing 2022. At det er overraskende navn høyt oppe på resultatlisten tidlig i sesongen, er ikke uvanlig – verdenscupen i slalåm er kjent for å skape sensasjoner.","url":"https://www.rtvslo.si/sport/braathen-vodi-pred-noelom-presenecenji-na-mestih-3-in-5/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 12:00:05","lang_orig":"sl","category":null,"athletes":"Clement Noel,Lucas Braathen","athlete_nations":["BRA","FRA"],"also_sources":[],"norwegian":false},{"id":155109,"source_name":"RTV SLO","country":"SLO","title_no":"Braathen første til å vinne to ganger på rad i Levi","title_orig":"Braathen prvi, ki je v Leviju zmagal dvakrat zapored","summary_no":"Lucas Braathen har skrevet historie ved å vinne to ganger på rad i Levi, som den første utøveren til å oppnå denne bragden.","spik_no":"Lucas Braathen er den første utøveren som har vunnet slalåmrennet i Levi to ganger på rad, og har dermed skrevet seg inn i historien på den finske åpningsbakken. Braathen, som kjører for Brasil etter å ha skiftet nasjonalitet fra Norge, er en av verdens beste slalåmkjørere og har tidligere vunnet flere verdenscupseire i tekniske disipliner. Levi har i mange år vært åpningshelgen i verdenscupen i slalåm, og en dobbeltseier der understreker hans dominans på de smaleste portene.","url":"https://www.rtvslo.si/sport/braathen-prvi-ki-je-v-leviju-zmagal-dvakrat-zapored/800168","pub_date":"2026-11-15T07:04:46.000Z","fetched_at":"2026-11-15 14:00:05","lang_orig":"sl","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":151146,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrikske herrer håper på god slalomstart","title_orig":"ÖSV-Herren hoffen auf guten Slalom-Auftakt","summary_no":"Det østerrikske herrelandslaget ser frem til sesongåpningen i slalåm og håper på et sterkt resultat fra start.","spik_no":"Østerrike håper på en sterk sesongstart i Levi, men har slitt i slalåm de siste sesongene — fjorårets eneste pallplass kom ikke før i Kitzbühel i januar. Fabio Gstrein og Michael Matt er de fremste ØSV-håpene etter at Manuel Feller er satt til å utsette sin sesongstart til hjemmerennet i Gurgl 22. november på grunn av ryggproblemer. Sist østerriksk utøver sto på pallen i Levi var i 2018, da Marcel Hirscher vant — en statistikk laget gjerne vil endre i et VM-år.","url":"https://sport.orf.at/stories/3164891/","pub_date":"2026-11-14T23:01:58.000Z","fetched_at":"2026-11-15 08:45:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":148033,"source_name":"Ski Racing","country":"INT","title_no":"Startliste for herrenes slalåm i Levi 2026","title_orig":"Levi Men’s Start List article 2026","summary_no":"Her er startlisten for herrenes slalåmrenn i Levi i 2026.","spik_no":"Herrenes slalåmverdenscup åpner søndag 15. november 2026 i finske Levi, med 86 løpere fra 23 nasjoner på startlisten. Forsvarende vinner Lucas Pinheiro Braathen starter med startnummer 7, mens Clément Noël trekker nummer 1. Fra norsk side er Timon Haugan, Atle Lie McGrath og Henrik Kristoffersen blant de syv første ut. Levi er tradisjonelt sesongåpner for herrenes slalåm og et renn der norske utøvere historisk har gjort seg sterkt gjeldende.","url":"https://skiracing.com/levi-mens-start-list-article-2026/","pub_date":"2026-11-14T18:57:55.000Z","fetched_at":"2026-11-14 19:00:02","lang_orig":"en","category":null,"athletes":"Atle Lie McGrath,Clement Noel,Henrik Kristoffersen,Loïc Meillard,Lucas Braathen,Timon Haugan","athlete_nations":["BRA","FRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":147875,"source_name":"Neveitalia","country":"ITA","title_no":"Verdenscupstillingen etter Levi: Aicher og Colturi deler ledelsen","title_orig":"Le classifiche della coppa femminile dopo Levi: Aicher e Colturi appaiate in vetta, top 7 di slalom inalterata","summary_no":"Etter rennet i Levi er Aicher og Colturi likt plassert på toppen av kvinnecupen, mens topp-7 i slalom forblir uendret.","spik_no":"Etter de to første slalomrennene i Levi deler Emma Aicher og Lara Colturi topplasseringen i den samlede verdenscupen for kvinner med 160 poeng hver. Mikaela Shiffrin, som normalt dominerer slalomklassen, ligger på delt 12.-plass med kun 36 poeng etter å ha mistet renn til skade — hun vil heller ikke stille i Gurgl om en uke. Lara Colturi, som konkurrerer for Albania, er sønn av den tidligere italienske alpinisten Giorgio Colturi, og har vokst opp i alpinmiljøet. Med Paula Moltzan på tredjeplass og Zrinka Ljutic på fjerde er starten på sesongen preget av bred konkurranse i toppen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/le-classifiche-della-coppa-femminile-dopo-levi-aicher-e-colturi-appaiate-in-vetta-top-7-di-slalom-inalterata","pub_date":"2026-11-14T18:40:00.000Z","fetched_at":"2026-11-14 18:45:01","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi,Mikaela Shiffrin","athlete_nations":["ALB","GER","USA"],"also_sources":[],"norwegian":false},{"id":147361,"source_name":"Neveitalia","country":"ITA","title_no":"Startliste for herreslalåmen i Levi: Noel åpner, etterfulgt av Haugan, Meillard og de norske essene","title_orig":"La startlist dello slalom maschile nell'arena di Levi: Noel apre, poi Haugan, Meillard e gli altri due assi norge","summary_no":"Noel starter først i herreslalåmen i Levi-arenaen, etterfulgt av Haugan, Meillard og de øvrige norske toppløperne.","spik_no":"Clément Noel starter med startnummer 1 i herreslalåmen i Levi, mens Timon Haugan er nummer 2 og Loïc Meillard nummer 3. Levi-rennet er det første av 13 planlagte slalåmrenn for menn i Verdenscupen 2025/26-sesongen. Lucas Pinheiro Braathen, som vant i Levi for ett år siden, trekker startnummer 7. Noel har historisk sett trivdes godt i den finske arenaen og har flere pallplasseringer der.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/la-startlist-dello-slalom-maschile-nell-arena-di-levi-noel-apre-poi-haugan-meillard-e-gli-altri-due-assi-norge","pub_date":"2026-11-14T17:45:00.000Z","fetched_at":"2026-11-14 18:00:01","lang_orig":"it","category":null,"athletes":"Clement Noel,Loïc Meillard,Timon Haugan","athlete_nations":["FRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":146651,"source_name":"Neveitalia","country":"ITA","title_no":"Mélanie Meillard med korsbåndskade – også Tommy Salas sesong er over","title_orig":"Per Mélanie Meillard la notizia peggiore: rottura del crociato. E anche la stagione di Tommy Sala è finita: \"Sembra un déjà vu\"","summary_no":"Mélanie Meillard har pådratt seg et korsbåndsbrudd og er ferdig for sesongen. Også Tommy Salas sesong er slutt, og han beskriver situasjonen som et déjà vu.","spik_no":"Både sveitsiske Mélanie Meillard og italienske Tommy Sala har pådratt seg korsbåndsskader og er ferdig for sesongen – uten å ha fått disputert en eneste renn. Meillard skadet seg i oppkjøringen til Levi, mens Sala ble skadet i Gurgl for en drøy uke siden. For Sala er det et vondt déjà vu: for to år siden røk han korsbåndet i det andre kneet under trening. Begge går nå glipp av en sesong som kulminerer med VM i Crans-Montana, som for Meillard hadde vært et hjemlig mesterskap.","url":"https://www.neveitalia.it/sport/scialpino/news/per-melanie-meillard-la-notizia-peggiore-rottura-del-crociato-e-anche-la-stagione-di-tommy-sala-e-finita-sembra-un-deja-vu","pub_date":"2026-11-14T16:50:00.000Z","fetched_at":"2026-11-14 17:00:02","lang_orig":"it","category":null,"athletes":"Melanie Meillard,Tommy Sala","athlete_nations":["ITA","SUI"],"also_sources":[],"norwegian":false},{"id":145959,"source_name":"SkinEWS","country":"SUI","title_no":"Bittert – VM-vinteren er over for Melanie Meillard","title_orig":"Bitter – für Melanie Meillard ist der WM-Winter zu Ende","summary_no":"En trist slutt for Melanie Meillard, som ikke får fullføre VM-vinteren.","spik_no":"Melanie Meillard må avslutte VM-sesongen 2026/27 uten et eneste renn etter at hun falt under slalomtreningen i Levi fredag og skadet høyre kne. MR-undersøkelsene lørdag i Genf bekreftet frykten: brudd på begge meniskene og korsbåndsbrudd. For den 28-årige sveitseren fra Neuchâtel er det et bittert tilbakeslag, særlig etter en vellykket sommeroppkjøring og med VM-sesongen i sikte.","url":"https://www.skinews.ch/news/2026/bitter-melanie-meillard/","pub_date":"2026-11-14T15:50:51.000Z","fetched_at":"2026-11-14 16:00:04","lang_orig":"de","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":145999,"source_name":"ORF Sport","country":"AUT","title_no":"Sesongslutt for sveitsiske Meillard","title_orig":"Saisonende für Schweizerin Meillard","summary_no":"Den sveitsiske alpinisten Melanie Meillard er ferdig for sesongen.","spik_no":"Sveitsiske Melanie Meillard er ute av VM-sesongen 2026/27 etter en alvorlig kneskade pådratt under slalomtrening i Levi, bare én dag før sesongstart. MR-undersøkelser i Genf bekreftet brudd på begge meniskene samt et korsbåndsbrudd på høyre kne. Den 28 år gamle teknikeren fra Neuchâtel lå på 16. plass i slalomklassementet forrige sesong. Meillard sier hun kjenner veien tilbake og er fast bestemt på å returnere sterkere.","url":"https://sport.orf.at/stories/3164888/","pub_date":"2026-11-14T15:48:11.000Z","fetched_at":"2026-11-14 16:00:05","lang_orig":"de","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":145590,"source_name":"Neveitalia","country":"ITA","title_no":"Lara med litt anger: «På trening går jeg mye raskere – nå må jeg ta det med i konkurransen»","title_orig":"Lara, questa volta un po' di rammarico c'è: \"In allenamento sto andando molto più forte, ma devo portarlo in gara\"","summary_no":"Lara innrømmer en viss skuffelse etter konkurransen og sier at treningsformen hennes er langt bedre enn det hun viser i renn.","spik_no":"Lara Colturi innrømmer en viss skuffelse etter andreplass i Levi-slalåmen, som ble vunnet av Emma Aicher, og sier at treningsformen hennes er langt bedre enn det hun klarer å vise i konkurransene. Den Albania-representerende italienskfødte utøveren, som trener under faren Cristian Colturies veiledning, åpnet sesongen med andreplass i Sölden – ett hundredels sekund bak seieren. Det er Colturies niende pallplass i verdenscupen uten at seieren lar vente på seg, men to andreplass på de to første rennene i sesongen er likevel et sterkt utgangspunkt.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/lara-questa-volta-un-po-di-rammarico-c-e-in-allenamento-sto-andando-molto-piu-forte-ma-devo-portarlo-in-gara","pub_date":"2026-11-14T15:20:00.000Z","fetched_at":"2026-11-14 15:30:02","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER"],"also_sources":[],"norwegian":false},{"id":145240,"source_name":"Neveitalia","country":"ITA","title_no":"Vinatzer bekrefter at Sala må opereres: «Veldig synd for Tommy»","title_orig":"Vinatzer conferma l'intervento necessario per Sala: \"Dispiace tanto per Tommy\": gli azzurri alla vigilia di Levi","summary_no":"Vinatzer bekrefter at lagkameraten Tommy Sala må gjennomgå en operasjon. De italienske alpinistene uttalte seg om situasjonen dagen før rennet i Levi.","spik_no":"Italias slalåmtalent Alex Vinatzer bekrefter at lagkamerat Tommy Sala må opereres etter en kneskade han pådro seg for seks dager siden. Vinatzer selv stiller til start med startnummer 17 i Levis slalåmåpning, og beskrives av de italienske trenerne som i god form etter en lovende innsats i storslalåmen i Sölden. Sala er en av Italias yngre slalåmhåp, og fraværet hans svekker et allerede begrenset italiensk mannskap i en av alpinistenes sterkeste grener.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/vinatzer-conferma-l-intervento-necessario-per-sala-dispiace-tanto-per-tommy-gli-azzurri-alla-vigilia-di-levi","pub_date":"2026-11-14T14:45:00.000Z","fetched_at":"2026-11-14 15:00:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":144731,"source_name":"SkinEWS","country":"SUI","title_no":"Emma Aicher kjørte til sin første slalomseier","title_orig":"Emma Aichers fährt zum ersten Slalom-Sieg","summary_no":"Tyske Emma Aicher tok sin aller første seier i slalom i verdenscupen.","spik_no":"Tyske Emma Aicher vant slalomrennet i Levi og tok dermed sin aller første verdenscupseier i en teknisk disiplin. Bak henne fulgte Lara Colturi for Albania og Østerrikes Katharina Truppe på podiet. Aicher har tidligere vist seg frem i fartsdisiplinene, og seieren i Levi bekrefter at 23-åringen er en allsidig utøver med potensialet til å kjempe om sammenlagtseieren i verdenscupen.","url":"https://www.skinews.ch/video/2026/aichers-faehrt-ersten/","pub_date":"2026-11-14T14:11:28.000Z","fetched_at":"2026-11-14 14:15:03","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi","athlete_nations":["ALB","AUT","GER"],"also_sources":[],"norwegian":false},{"id":144715,"source_name":"Neveitalia","country":"ITA","title_no":"Ett år etter første pallplass i slalom er Levi enda søtere for super-Aicher: «En flott bursdagsgave»","title_orig":"Un anno dopo il primo podio in slalom qui, Levi è ancora più dolce per Super Aicher: \"Un gran regalo di compleanno\"","summary_no":"Emma Aicher vant i Levi, ett år etter sin første pallplass på samme sted, og beskriver seieren som en drømmemessig bursdagsgave.","spik_no":"Emma Aicher vant slalomrennet i Levi nøyaktig ett år etter sin aller første pallplass i slalom på samme sted, og beskriver seieren som en drømmemessig bursdagsgave – hun fylte 23 år dagen før rennet. Den bayerske løperen ledet etter første omgang og vant til slutt foran Lara Colturi med 0,43 sekunder på den krevende og islagte Levi Black-løypa. Aicher og Colturi har begge stått på pallen i begge verdenscuprennene denne sesongen, og Aicher er nå en av favorittene til sammenlagtseieren.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-anno-dopo-il-primo-podio-in-slalom-qui-levi-e-ancora-piu-dolce-per-super-aicher-un-gran-regalo-di-compleanno","pub_date":"2026-11-14T14:10:00.000Z","fetched_at":"2026-11-14 14:15:02","lang_orig":"it","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":144695,"source_name":"Ski Racing","country":"INT","title_no":"Emma Aicher vinner første verdenscupslalom i Levi","title_orig":"Emma Aicher Wins First World Cup Slalom in LeviLevi Slalom Women","summary_no":"Emma Aicher tok sin første verdenscupseier i slalom etter en sterk kjøring i Levi.","spik_no":"Emma Aicher feiret sin 23-årsdag med å vinne sitt første verdenscupslalomrenn i Levi, Finland, og slo Albanias Lara Colturi med 0,43 sekunder på den krevende og islagte Levi Black-løypa. Levi har en særlig plass i Aichers karriere: hun debuterte i verdenscupen nettopp her, tok sin første slalompallplass på samme sted forrige sesong, og returnerte nå for å vinne. Katharina Truppe fra Østerrike ble nummer tre. Aicher og Colturi har nå begge stått på pallen i begge damenes verdenscuprenn denne sesongen, etter podiumsplasseringene i storslalåmen i Sölden.","url":"https://skiracing.com/emma-aicher-levi-slalom-2026/","pub_date":"2026-11-14T14:04:06.000Z","fetched_at":"2026-11-14 14:15:01","lang_orig":"en","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi","athlete_nations":["ALB","AUT","GER"],"also_sources":[],"norwegian":false},{"id":144367,"source_name":"Neveitalia","country":"ITA","title_no":"Samme Levi-resultat for Italia-kvinnene – Sola fornøyd, Della Mea skuffet","title_orig":"La \"solita\" Levi per l'Italdonne, ma sorride una positiva Sola: \"Buona partenza\". Della Mea: \"Non sono soddisfatta\"","summary_no":"Det italienske kvinnelaget leverte et kjent bilde i Levi. Sola var positiv til starten, mens Della Mea uttrykte misnøye med egen prestasjon.","spik_no":"Det italienske kvinnelaget leverte nok en gang et blandet resultat i Levi-slalåmen, der Beatrice Sola var beste italiener på 19.-plass med startnummer 50 — for tredje gang i karrieren har hun hentet poeng med et høyt startnummer. Martina Peterlini, som historisk har trives godt i Levi, var den eneste av de ni italienske utøverne som ikke var fast på verdenscuplaget. Luca Della Mea var derimot åpent misfornøyd med sin prestasjon, mens Peterlini selv valgte å se det positive etter å ha returnert fra en ny kneopérasjon.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/la-solita-levi-per-l-italdonne-ma-sorride-una-positiva-sola-buona-partenza-della-mea-non-sono-soddisfatta","pub_date":"2026-11-14T13:40:00.000Z","fetched_at":"2026-11-14 13:45:01","lang_orig":"it","category":null,"athletes":"Marta Rossetti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":122476,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen vinner igjen og åpner svensk trippel i andre slalåm i Storklinten – Hansson og Wissting på pallen","title_orig":"Jakobsen cala il bis e apre la tripletta svedese nel secondo slalom a Storklinten: sul podio anche Hansson e Wissting","summary_no":"Jakobsen doblet seg med ny seier i Storklinten og sørget for svensk trippel på pallen, foran Hansson og Wissting.","spik_no":"Kristoffer Jakobsen vant begge FIS-slalåmrennene i Storklinten og sørget for svensk trippel i søndagens renn, der Hansson og Wissting fulgte på pallen. Den 32 år gamle svenske spesialisten hadde en tung Verdenscup-sesong i fjor der han knapt scoret poeng, men viser nå sterk form en uke før sesongåpningen i Levi. Belgiernes Armand Marchant, som nesten tok sin første seier i Gurgl forrige sesong, deltok bare i lørdagens renn og endte da som toer, over ett sekund bak Jakobsen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/jakobsen-cala-il-bis-e-apre-la-tripletta-svedese-nel-secondo-slalom-a-storklinten-sul-podio-anche-hansson-e-wissting","pub_date":"2026-11-08T10:35:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":"sportslig","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122453,"source_name":"Ski Racing","country":"INT","title_no":"Møt Lionel Agoutin – mannen bak Ski World Cup-bannerne","title_orig":"Meet Lionel Agoutin, the Man Behind the Ski World Cup Banners","summary_no":"Lionel Agoutin er personen som lager de ikoniske bannerne langs traseen under alpinske verdenscuprenn.","spik_no":"Lionel Agoutin er mannen bak de fargerike bannerne som preger tribunene under alpinske verdenscuprenn verden over. Den franske entusiasten driver Alpine Ski World Cup Fan Community og lager bannerne selv – med nasjonale teamfarger og portretter av utøvere fra hele startfeltet. Bannerne er ikke et kommersielt produkt fra FIS eller forbundene, men resultatet av én manns dedikasjon til sporten og fellesskapet rundt den. Agoutin er et kjent ansikt i verdenscupen og har blant annet blitt fotografert sammen med stjerner som Lindsey Vonn.","url":"https://skiracing.com/meet-lionel-agoutin-the-man-behind-the-ski-world-cup-banners/","pub_date":"2026-11-06T20:19:31.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":"goy","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":103287,"source_name":"Neveitalia","country":"ITA","title_no":"SC Courmayeur tar imot Brignone igjen: – En forelder holder alltid døren åpen","title_orig":"\"Un genitore lascia sempre la porta aperta, Fede è rimasta la ragazza che ama sciare in libertà\": lo S.C. Courmayeur riaccoglie Brignone","summary_no":"Federica Brignone ønskes velkommen tilbake til skiklubben SC Courmayeur, som beskriver henne som jenta som alltid har elsket å stå fritt på ski.","spik_no":"Federica Brignones hjemklubb SC Courmayeur ønsker henne hjertelig velkommen tilbake og beskriver henne som «jenta som alltid har elsket å stå fritt på ski». Nyheten kommer dagen etter at Brignone kunngjorde at hun forlater sin stilling i Carabinieri, den italienske militærenheten mange alpinister er tilknyttet. Den 34-årige alpinisten fra La Salle er Italias mestvinnende utøver gjennom tidene med to olympiske gull og over 30 verdenscupseire, og er nå i gang med oppkjøringen mot en ny comeback-sesong etter skade.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-genitore-lascia-sempre-la-porta-aperta-fede-e-rimasta-la-ragazza-che-ama-sciare-in-liberta-lo-sc-courmayeur-riaccoglie-brign","pub_date":"2026-11-03T11:25:00.000Z","fetched_at":"2026-11-03 11:30:02","lang_orig":"it","category":"naert","athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":100827,"source_name":"RTV SLO","country":"SLO","title_no":"Houthi-raketter tvang asiatisk mesterskap fra januar til desember 2027","title_orig":"Rakete hutijev prestavile azijsko prvenstvo z januarja na december 2027","summary_no":"Asiatisk mesterskap i alpint er blitt flyttet fra januar til desember 2027 som følge av houthi-rakettangrep.","spik_no":"Det asiatiske alpinmesterskapet er flyttet fra januar til desember 2027 på grunn av houthi-rakettangrep i regionen. Houthi-bevegelsen i Jemen har siden 2023 gjennomført en rekke angrep mot skip og mål i Rødehavet og omkringliggende områder, noe som har skapt usikkerhet og sikkerhetsproblemer for arrangementer i nærheten. Det er uvanlig at geopolitiske konflikter direkte påvirker internasjonale alpinarrangementer, og beslutningen understreker hvor stor rekkevidden av konflikten har blitt.","url":"https://www.rtvslo.si/sport/rakete-hutijev-prestavile-azijsko-prvenstvo-z-januarja-na-december-2027/798849","pub_date":"2026-11-03T07:07:24.000Z","fetched_at":"2026-11-03 07:30:05","lang_orig":"sl","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":76731,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn klar for siste operasjon: – Mentalt tøff nedtelling","title_orig":"\"Countdown duro mentalmente, tra meno di due settimane mi opero\": Lindsey Vonn verso l'ultimo intervento alla gamba","summary_no":"Lindsey Vonn skal operere benet om mindre enn to uker og beskriver ventetiden som mentalt krevende.","spik_no":"Lindsey Vonn er klar for det hun beskriver som sin siste operasjon, og sier ventetiden på under to uker er mentalt krevende. Inngrepet innebærer fjerning av skruer og plater i venstre tibia, samt en operasjon på korsbåndet. Vonn, som er en av tidenes mestvinnende alpinister med 82 verdenscupseirer og OL-gull i utfor fra 2010, har tilbrakt store deler av 2026 med rehabilitering etter en alvorlig skade hun pådro seg tidligere i år. I høst har hun jobbet intenst i treningssalen for å styrke muskulaturen før det avsluttende inngrepet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/countdown-duro-mentalmente-tra-meno-di-due-settimane-mi-opero-lindsey-vonn-verso-l-ultimo-intervento-alla-gamba","pub_date":"2026-10-28T13:30:00.000Z","fetched_at":"2026-10-28 13:45:02","lang_orig":"it","category":"nyheter","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":59459,"source_name":"ORF Sport","country":"AUT","title_no":"Rennkalenderen skaper igjen debatt","title_orig":"Rennkalender sorgt erneut für Diskussionen","summary_no":"Alpinski-rennkalenderen er nok en gang gjenstand for diskusjon blant utøvere og organisasjoner.","spik_no":"Verdenscupkalenderen for alpint 2026/27 inneholder 40 renn for kvinner og 43 for menn, men balansen mellom fart- og teknikkøvelser er igjen skjev – særlig for kvinner, der teknikkrenn dominerer klart. Østerrike er største vertsland med 15 verdenscupavdelinger, inkludert en ny stopp i Dachstein West/Gosau. Østerriksk dametrener Johannes Zöchling peker på at logistikk og mange motstridende interesser gjør kalenderarbeidet svært krevende, og beklager at det ikke er fartshjemerenn for østerrikske kvinner denne vinteren.","url":"https://sport.orf.at/stories/3163844/","pub_date":"2026-10-24T07:43:47.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":48079,"source_name":"Neveitalia","country":"ITA","title_no":"Atomic og Braathen sammen til 2030 – sikter mot den store krystallkulen","title_orig":"Atomic e Lucas Pinheiro Braathen assieme sino al 2030: il prossimo obiettivo è la sfera di cristallo assoluta","summary_no":"Atomic og Lucas Pinheiro Braathen har forlenget samarbeidet til 2030, med den sammenlagte verdenscupseieren som neste store mål.","spik_no":"Lucas Pinheiro Braathen og utstyrsmerket Atomic har forlenget samarbeidet sitt frem til 2030, med den store krystallkulen – sammenlagttittelen i verdenscupen – som overordnet mål. Braathen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåmkula i 2022–23-sesongen og har etablert seg blant verdens beste teknikkjørere. En sammenlagtseier vil kreve at han hevder seg også utenfor slalåm, noe som gjenstår å bevise.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/atomic-e-lucas-pinheiro-braathen-assieme-sino-al-2030-il-prossimo-obiettivo-e-la-sfera-di-cristallo-assoluta","pub_date":"2026-10-21T10:20:00.000Z","fetched_at":"2026-10-22 10:54:36","lang_orig":"it","category":"viktig","athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":46668,"source_name":"SVT Sport","country":"SWE","title_no":"Treningsbildene av Anna Swenn-Larsson spres: «Viralt»","title_orig":"Träningsbilderna på Anna Swenn-Larsson sprids: ”Viralt”","summary_no":"Bilder av Anna Swenn-Larsson under trening sprer seg raskt på nett og har blitt et viralt fenomen.","spik_no":"Anna Swenn-Larsson har skapt oppmerksomhet på sosiale medier etter at treningsvideoer av henne har spredt seg viralt, blant annet med kommentarer fra alpinlegender som Anja Pärson og Lindsey Vonn. Den svenske slalåmstjernen, som er 35 år, vant bronsemedalje i slalåm under OL   if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';

  return '💤 Sommerpause';
}
