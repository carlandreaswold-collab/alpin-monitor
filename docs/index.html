<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>

<div class="header">
  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>

</div>

<div class="main">

</div>

const ARTICLES = [{"id":247723,"source_name":"Ski Racing","country":"INT","title_no":"Mikaela Shiffrin jakter sin første storslalåmseier i Killington","title_orig":"Mikaela Shiffrin Chases Her First Killington Giant Slalom Win","summary_no":"Mikaela Shiffrin stiller til start i Killington med mål om å vinne storslalåmen for aller første gang på denne arena.","spik_no":"Mikaela Shiffrin stiller til start i storslalåmen i Killington lørdag, og jakter sin første GS-seier på denne arenaen. I november 2024 krasjet hun i andreomgangen mens hun ledet med 0,32 sekunder og jaktet sin historiske 100. verdenscupseier — skaden, et dypt stikksår i bukmuskulaturen, holdt henne ute store deler av sesongen. Shiffrin har åpent snakket om posttraumatisk stress etter ulykken og jobbet med sportpsykolog foran comebacket. Ingen amerikansk kvinne har noensinne vunnet en verdenscup-storslalåm i Killington.","url":"https://skiracing.com/mikaela-shiffrin-chases-her-first-killington-giant-slalom-win/","pub_date":"2026-11-27T18:26:49.000Z","fetched_at":"2026-11-27 18:30:01","lang_orig":"en","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":246303,"source_name":"Neveitalia","country":"ITA","title_no":"Sarrazin tilbake etter 700 dager: «Jeg er klar» til super-G i Copper","title_orig":"Sarrazin da brividi, settecento giorni di attesa e ora è pura gioia verso il super-g di Copper: \"Sono pronto\"","summary_no":"Cyprien Sarrazin er klar for retur til konkurranse i super-G i Copper Mountain etter 700 dagers ventetid. Franskmannen uttrykker ren glede over å være tilbake.","spik_no":"Cyprien Sarrazin er klar for retur til verdenscupen i super-G i Copper Mountain, nesten 700 dager etter at han lå mellom liv og død på pisten i Bormio 27. desember 2024. Franskmannen, født i 1994, krasjet voldsomt i utfartstreningen på den berømte Stelvio-løypa og pådro seg alvorlige hodeskader. Sarrazin rakk likevel å hevde seg som en av verdens beste utfartskjørere før ulykken, med blant annet seire i utfor i Kitzbühel og Wengen i 2024. Han sier selv at han i treningsarbeidet har holdt 80–85 prosent intensitet og kjørt tider som tilsvarer topp ti, men forventer ingen spesielle resultater i comebacket.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/sarrazin-da-brividi-settecento-giorni-di-attesa-e-ora-e-pura-gioia-verso-il-super-g-di-copper-sono-pronto","pub_date":"2026-11-27T16:20:00.000Z","fetched_at":"2026-11-27 16:30:02","lang_orig":"it","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":246138,"source_name":"Neveitalia","country":"ITA","title_no":"Mye regn og ingen trening før Killington – Zenere: «Det blir en overraskelse for alle»","title_orig":"Vigilia di Killington non semplice, tanta pioggia nel Vermont e niente sciata in pista. Zenere: \"Sarà una sorpresa per tutte\"","summary_no":"Forberedelsene til Killington er vanskelige med kraftig regn i Vermont og ingen mulighet til å trene på pisten. Zenere mener åpningsrennet blir en overraskelse for samtlige.","spik_no":"Forberedelsene til Killington-rennet lørdag er krevende etter kraftig regn i Vermont, og juryen har valgt å kansellere trening på pisten dagen før for å spare traseen. Asja Zenere, som imponerte med en sterk femteplass i sesongåpningen i Sölden, leder det italienske laget på elleve utøvere. Italia stiller blant annet med en tilbakevendende Sofia Goggia i hennes første renn denne sesongen, mens Giorgia Collomb er meldt klar til tross for et lite ankelbesvær.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/vigilia-di-killington-non-semplice-tanta-pioggia-nel-vermont-e-niente-sciata-in-pista-zenere-sara-una-sorpresa-per-tutte","pub_date":"2026-11-27T15:45:00.000Z","fetched_at":"2026-11-27 16:15:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":246139,"source_name":"Neveitalia","country":"ITA","title_no":"Davide Brignone om søsteren Fede: «Det var riktig å prøve – kjærligheten er utrolig»","title_orig":"\"Non aveva più scelta, ma era giusto provarci. La quantità di affetto è incredibile\": Davide Brignone e la sua Fede","summary_no":"Davide Brignone snakker varmt om søsteren Federica og hennes avgjørelse, og understreker at mengden av støtte og kjærlighet hun har mottatt er overveldende.","spik_no":"Davide Brignone, søster og personlig trener for Federica Brignone, forteller i et intervju med La Gazzetta dello Sport at det var riktig å forsøke et comeback, selv om alternativene var begrenset. Han har stått ved siden av henne på pisten siden 2016–17, og vant en hard kamp mot det italienske skiforbundet for å få rollen som hennes personlige coach. Siden da har Federica tatt sin første store kule i 2019–20 og blitt en av alpinskisportens mest dekorerte utøvere gjennom tidene. Davide understreker at de delte målet og at det å jobbe sammen har vært deres styrke.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/non-aveva-piu-scelta-ma-era-giusto-provarci-la-quantita-di-affetto-e-incredibile-davide-brignone-e-la-sua-fede","pub_date":"2026-11-27T15:15:00.000Z","fetched_at":"2026-11-27 16:15:02","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":245969,"source_name":"Ski Racing","country":"INT","title_no":"Viktoria Zaytseva fikk sitt verdenscupgjennombrudd med røtter i Edwards, Colorado","title_orig":"Viktoria Zaytseva’s World Cup Debut Had Roots in Edwards, Colorado","summary_no":"Viktoria Zaytseva gjorde sin verdenscupdebut, og reisen dit startet i den lille byen Edwards i Colorado.","spik_no":"Viktoria Zaytseva gjør verdenscupdebut med røtter i Edwards i Colorado, et lite skisamfunn i Vail Valley som har fostret flere alpintalenter. Hun er en av de unge amerikanske håpene som nå tar steget opp på det øverste nivået i alpinsporten. Copper Mountain, som ligger Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":245989,"source_name":"SkinEWS","country":"SUI","title_no":"Fabian Gratz klar for Copper Mountain etter god åpning og redusert trening","title_orig":"Fabian Gratz – nach gutem Auftakt und reduzierten Training bereit für Copper Mountain","summary_no":"Fabian Gratz er klar for konkurransene i Copper Mountain etter en lovende sesongstart og tilpasset treningsopplegg.","spik_no":"Tyske Fabian Gratz er i god form før Copper Mountain etter å ha kjørt seg til sin beste verdenscupplassering noensinne med en sjetteplass i storslalåmåpningen i Sölden – 46 hundredeler bak pallen. Den 29-åringen er for øyeblikket den best rangerte tyskeren i storslalåm-verdenscupen og bekrefter at han holder det nivået han har bygget seg opp til tross for redusert trening etter Sölden. Gratz er en av de mer rutinerte tyverne i feltet uten å ha slått helt igjennom med en topp-tre-plassering, og Copper Mountain blir en ny mulighet til å krysse den terskelen.","url":"https://www.skinews.ch/news/2026/reduzierten-training-mountain/","pub_date":"2026-11-27T11:40:19.000Z","fetched_at":"2026-11-27 16:10:38","lang_orig":"de","category":null,"athletes":"Fabian Gratz","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":246146,"source_name":"Neveitalia","country":"ITA","title_no":"Lavinia Paci dobbelt på pallen i Mayrhofen – østerrikske seire til Sykora og Olivier","title_orig":"Gran doppio podio per Lavinia Paci nelle FIS di Mayrhofen: vittorie austriache con Romy Sykora e Victoria Olivier","summary_no":"Lavinia Paci tok to pallplasseringer i FIS-rennene i Mayrhofen, mens østerrikske Romy Sykora og Victoria Olivier vant sine respektive øvelser.","spik_no":"Den 18 år gamle trentineren Lavinia Paci tok to pallplasseringer i FIS-renn i Mayrhofen, med en andreplass bak Romy Sykora – datter av den tidligere storslalåmkjøreren Thomas Sykora – og en tredjeplass dagen etter bak Victoria Olivier, som har erfarin uende ulykke.","spik_no":"Franske Cyprien Sarrazin er klar for comeback i super-G på Copper Mountain, nærmere to år etter en livstruende ulykke under trening i Bormio i desember 2024. Den 32-åringen mistet kontrollen i høy hastighet, slo hodet hardt i pisten og pådro seg en hjerneblødning som krevde øyeblikkelig operasjon – legen tok av halve skallbenet. Sarrazin lå i koma i flere dager og så dobbelt en periode under rehabiliteringen. Comebacket beskrives som et mirakel av pressen, og franskmannen selv har sagt: «Med alt uhell var jeg det største lykkevarpet i universet».","url":"https://www.sportschau.de/wintersport/ski-alpin/cyprien-sarrazin-,cyprien-sarrazin-vor-comeback-100.html","pub_date":"2026-11-27T10:07:14.000Z","fetched_at":"2026-11-27 16:10:40","lang_orig":"de","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":245970,"source_name":"Ski Racing","country":"INT","title_no":"Aksel Lindenmeyr klar for verdenscupdebut i super-G på Copper Mountain","title_orig":"Aksel Lindenmeyr to Make World Cup Debut in Copper Mountain Super-G","summary_no":"Aksel Lindenmeyr gjør sin verdenscupdebut i super-G på Copper Mountain.","spik_no":"Aksel Lindenmeyr gjør verdenscupdebut i super-G på Copper Mountain og er blant de unge alpinistene som nå får sin første smakebit på det høyeste nivået i internasjonal alpinsport. Super-G er en disiplin som krever både fartsglede og teknisk presisjon, og å debutere på hjemmebane i USA gir ekstra motivasjon. Detaljert bakgrunnsinformasjon om Lindenmeyr er begrenset, men debuten i seg selv er en merkedag i karrieren til enhver ung utøver.","url":"https://skiracing.com/aksel-lindenmeyr-to-make-world-cup-debut-in-copper-mountain-super-g/","pub_date":"2026-11-27T00:30:00.000Z","fetched_at":"2026-11-27 16:09:59","lang_orig":"en","category":null,"athletes":"Aksel Lindenmeyr","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":245971,"source_name":"Ski Racing","country":"INT","title_no":"Todobbelt Kitzbühel-vinner Cyprien Sarrazin sikter mot verdenscupcomeback på Copper Mountain","title_orig":"Two-Time Kitzbühel Winner Cyprien Sarrazin Eyes World Cup Return at Copper","summary_no":"Cyprien Sarrazin, som har vunnet i Kitzbühel to ganger, ser frem til å returnere til verdenscupen på Copper Mountain.","spik_no":"Cyprien Sarrazin er klar for å returnere til verdenscupen på Copper Mountain etter den livstruende skaden han pådro seg i Bormio i desember 2024. Den 32 år gamle franskmannen er blant de mest meritterte fartskjørerne i sin generasjon med fem verdenscupseire, inkludert to triumfer på den ikoniske Hahnenkamm-løypa i Kitzbühel i samme sesong – noe svært få har klart. Comebacket hans er ventet med stor spenning i alpinmiljøet, og super-G på Copper Mountain blir hans første verdenscupstart etter over halvannet år borte fra rennscenen.","url":"https://skiracing.com/cyprien-sarrazin-world-cup-return-copper-mountain/","pub_date":"2026-11-26T21:07:19.000Z","fetched_at":"2026-11-27 16:09:59","lang_orig":"en","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":245601,"source_name":"Ski Racing","country":"INT","title_no":"5 mentale strategier for en sterk start på skisesongen","title_orig":"Beyond Positive Thinking: 5 Mental Strategies to Start Your Ski Racing Season Strong","summary_no":"Positiv tenkning er ikke nok – her er fem mentale strategier som hjelper alpinister med å starte skiracingsesongen på best mulig måte.","spik_no":"Idrettspsykolog og tidligere alpinist Dr. Haley Perlus presenterer fem mentale strategier for å starte skirasingsesongen sterkt, og understreker at mental robusthet handler om å håndtere tvil, nervøsitet og feil – ikke bare tenke positivt. Artikkelen er skrevet i forkant av 2026–27-sesongen og bruker blant andre Mikaela Shiffrin som eksempel, en utøver som selv har snakket åpent om det mentale presset i toppidretten. Strategiene er utviklet gjennom Perlus' arbeid med individuelle utøvere og er ment å hjelpe alpinister med å omsette trening til konkurranseresultater.","url":"https://skiracing.com/beyond-positive-thinking-5-mental-strategies-to-start-your-ski-racing-season-strong/","pub_date":"2026-11-26T18:50:05.000Z","fetched_at":"2026-11-26 19:00:01","lang_orig":"en","category":"naert","athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":244517,"source_name":"Neveitalia","country":"ITA","title_no":"Offisielt: Ingen alpint 5.–6. desember i kvinnecupen – Mont-Tremblant-gigantslalåmene erstattes ikke","title_orig":"Ufficiale, ci sarà un \"buco\" il 5-6 dicembre nella coppa femminile: i giganti di Mont-Trémblant non verranno recuperati in Nordamerica","summary_no":"Det bekreftes at det blir et hull i kvinnenes verdenscupprogram 5.–6. desember, da de avlyste storslalåmrennene i Mont-Tremblant ikke vil bli erstattet i Nord-Amerika.","spik_no":"FIS har bekreftet at de to storslalåmrennene som skulle vært arrangert i Mont-Tremblant i Canada 5.–6. desember ikke vil bli erstattet med andre renn i Nord-Amerika i samme periode. Avlysningen skyldes mangel på snø — det samme problemet rammet Mont-Tremblant også i 2024. Programmet i kvinnecupen går dermed rett fra Killington til Beaver Creek uten renn i mellom. Det spekuleres i om de tapte rennene kan hentes inn senere i sesongen, muligens som en dobbel «Erta» slik det ble gjort i 2023.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/ufficiale-ci-sara-un-buco-il-5-6-dicembre-nella-coppa-femminile-i-giganti-di-mont-tremblant-non-verranno-recuperati-in-nordamer","pub_date":"2026-11-26T17:35:00.000Z","fetched_at":"2026-11-26 17:45:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":244477,"source_name":"Sportschau","country":"GER","title_no":"Federica Brignone – tigrinnen sier farvel","title_orig":"Federica Brignone - die Tigerin sagt Arrivederci","summary_no":"Federica Brignone avslutter karrieren. Den italienske alpinstjernen, kjent for sin aggressive kjørestil, tar et endelig farvel med sporten.","spik_no":"Federica Brignone avslutter karrieren etter 37 Verdenscupseiere, to olympiske gull og to sammenlagtseirer i Verdenscupen. Den italienske alpinstjernen klarte det svært få har lykkes med i Mikaela Shiffrins storhetstid – å etablere seg som en selvstendig vinner på øverste nivå. Brignone vokste selv opp i alpinmiljøet som datter av Verdenscup-utøveren Maria Rosa Quario, og måtte lenge leve med stempelet «datterens av», før hun skapte sin egen legendariske karriere. Det er smerter som til slutt tvang frem beslutningen om å legge skiene på hylla.","url":"https://www.sportschau.de/wintersport/ski-alpin/die-grosse-karriere-der-federica-brignone,federica-brignone-162.html","pub_date":"2026-11-26T17:29:22.000Z","fetched_at":"2026-11-26 17:30:06","lang_orig":"de","category":null,"athletes":"Federica Brignone,Mikaela Shiffrin","athlete_nations":["ITA","USA"],"also_sources":[],"norwegian":false},{"id":243393,"source_name":"Ski Racing","country":"INT","title_no":"Fra fjellene til ørkenen: Žampa Cup skriver historie i Ski Dubai","title_orig":"From the Mountains to the Desert: Žampa Cup Makes History in Ski Dubai","summary_no":"Žampa Cup gjør historisk entré ved å arrangere konkurranse i Ski Dubai, og tar alpinsporten fra fjellet til kunstsnøen i ørkenen.","spik_no":"Žampa Cup satte rekord da de for første gang arrangerte konkurranse utenfor Europa – denne gangen i Ski Dubai inne i den kunstige innendørsanlegget midt i ørkenen. 87 utøvere fra 32 land og fem kontinenter deltok i arrangementet, som ble organisert av de slovakiske brødrene Adam, Andreas og Teo Žampa i samarbeid med Ski Dubai. Adam Žampa er Slovakias mest meritterte alpinist i nyere tid, og brødrenes cup-konsept er kjent for å kombinere kvalitetsopplæring med en inkluderende filosofi som skal gjøre alpinsporten tilgjengelig utover de tradisjonelle fjellregionene.","url":"https://skiracing.com/from-the-mountains-to-the-desert-zampa-cup-makes-history-in-ski-dubai/","pub_date":"2026-11-26T16:18:55.000Z","fetched_at":"2026-11-26 16:30:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":243413,"source_name":"Neveitalia","country":"ITA","title_no":"Waterville Valley ligner allerede konkurranse: De italienske jentene trener med mange rivaler før Killington","title_orig":"A Waterville Valley sembra già... gara: il pre Killington delle azzurre in pista assieme a tantissime rivali","summary_no":"De italienske alpinistene forbereder seg til Killington-rennet på snøen i Waterville Valley, der de trener side om side med en rekke topprivaler.","spik_no":"De italienske alpinistene bruker Waterville Valley i New Hampshire som treningsbase foran helgens slalåmrenn i Killington, og trener side om side med rivaler fra Sverige, Østerrike og New Zealand. Killington er en av de mest tradisjonsrike stoppene på damenes verdenscup i tekniske grener, og trekker hvert år store folkemasser. Italia har solide tekniske utøvere i stallen, og det er ventet tøff konkurranse når «Superstar»-løypen kjøres lørdag med første omgang klokken 15.30.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/a-waterville-valley-sembra-gia-gara-il-pre-killington-delle-azzurre-in-pista-assieme-a-tantissime-rivali","pub_date":"2026-11-26T16:15:00.000Z","fetched_at":"2026-11-26 16:30:03","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":242312,"source_name":"Neveitalia","country":"ITA","title_no":"Slokar utelukket fra Killington – fire slovenske menn til Copper","title_orig":"Niente Killington per Slokar, quattro gli uomini sloveni a Copper. Germania con Aicher, Gratz e...","summary_no":"Andreja Slokar er ikke aktuell for rennet i Killington, mens fire slovenske menn stiller til start i Copper Mountain. Tyskland stiller med Aicher, Gratz og flere.","spik_no":"Andreja Slokar er ikke aktuell for slalomrennet i Killington denne helgen, og hopper over den nordamerikanske runden etter et tyngre comeback fra skade. Den slovenske spesialisten har to verdenscupseire på merittlisten, begge i slalom, men returnen har vært mer komplisert enn ventet. I stedet satser hun på Courchevel 22. desember. Lagvenninne Neja Dvornik leder det slovenske damelandslaget i Killington, mens fire slovenske menn stiller til start i fartsdisiplinene på Copper Mountain.","url":"https://www.neveitalia.it/sport/scialpino/news/niente-killington-per-slokar-quattro-gli-uomini-sloveni-a-copper-germania-con-aicher-gratz-e","pub_date":"2026-11-26T15:00:00.000Z","fetched_at":"2026-11-26 15:15:02","lang_orig":"it","category":null,"athletes":"Andreja Slokar,Emma Aicher,Petra Vlhová","athlete_nations":["GER","SLO","SVK"],"also_sources":[],"norwegian":false},{"id":242080,"source_name":"franceinfo","country":"FRA","title_no":"To år etter den alvorlige diagnosen: Sarrazin er tilbake i verdenscupen","title_orig":"\"Le ski, le sport, ta vie, tu peux oublier\"... Deux ans après ce terrible diagnostic, Cyprien Sarrazin retrouve la Coupe du monde de ski","summary_no":"Cyprien Sarrazin vender tilbake til verdenscupen i alpint to år etter at han fikk en alvorlig diagnose som truet karrieren hans.","spik_no":"Cyprien Sarrazin er tilbake i verdenscupen to år etter en dramatisk treningsulykke i Bormio i desember 2024, der han pådro seg en hodeskade som ifølge franske medier kunne ha ført til lammelse. Den franske utfartsspesialisten hadde på det tidspunktet etablert seg som en av verdens beste i fartsøvelsene, med seire i klassikere som utforkjøringen i Wengen og Kitzbühel sesongen 2023/24. Nå er han tatt ut til super-G på Copper Mountain i USA 28. november, og comebacket hans er ventet å bli fulgt med stor interesse.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/le-ski-le-sport-ta-vie-tu-peux-oublier-deux-ans-apres-ce-terr mmary_no":"Tina Maze mener Federica Brignone avsluttet karrieren på rett tidspunkt, og fremhever at overgangen ble gjort med broren ved sin side som trener.","spik_no":"Tina Maze mener Federica Brignone valgte rett tidspunkt for å avslutte karrieren, og trekker særlig frem at hun fikk gjøre overgangen med broren Davide ved sin side som trener. Maze kjenner Brignone godt – de møttes blant annet i VM-giganten i Garmisch 2011, der slovenen vant med kun ni hundredeler. Brignone er Italias mest meritterte alpinistinne noensinne, mens Maze selv er firgangsverdensmestrinna og dobbelt olympisk mester fra Sotsji 2014, samt vinner av den totale verdenscupen 2012/13 med rekordpoengsum.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/l-addio-di-brignone-visto-da-tina-maze-fede-ha-scelto-il-momento-giusto-lo-step-l-ha-fatto-con-il-fratello-al-fianco-da-coach","pub_date":"2026-11-26T13:20:00.000Z","fetched_at":"2026-11-26 13:30:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Tina Maze","athlete_nations":["ITA","SLO"],"also_sources":[],"norwegian":false},{"id":240618,"source_name":"RTV SLO","country":"SLO","title_no":"Rok Bračko: I farens fotspor, men på sin egen vei","title_orig":"Rok Bračko: Očetove stopinje, a povsem njegova pot","summary_no":"Sloveneren Rok Bračko følger i farens fotspor som alpinist, men skaper sin helt egen karriere.","spik_no":"Sloveneren Rok Bračko er sønn av en tidligere alpinist og er i ferd med å etablere seg på egne premisser i den internasjonale alpinsporten. Slovenia har en sterk tradisjon i alpint, med utøvere som Ilka Štuhec og Žan Kranjec i verdenstoppen. Artikkelteksten gir få konkrete detaljer om Bračkos resultater, men historien om en ung utøver som vokser opp i en alpinfamilie og forsøker å skape sin egen identitet er et kjent motiv i sporten. Han representerer en ny generasjon slovenske alpinister.","url":"https://www.rtvslo.si/sport/rok-bracko-ocetove-stopinje-a-povsem-njegova-pot/801367","pub_date":"2026- ":false},{"id":239788,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen jubler etter comeback: Vant slalåm i Suomu","title_orig":"L'urlo di Jakobsen per rinascere: lo svedese firma il secondo slalom di CE a Suomu, Pizzato di nuovo miglior azzurro","summary_no":"Svenske Jakobsen vant sitt andre kontinentalcup-slalåm i Suomu. Pizzato var igjen beste italiener.","spik_no":"Kristoffer Jakobsen vant sitt andre kontinentalcup-slalåm i finske Suomu, og markerte et tydelig comeback etter en lengre periode med skader. Den svenske slalåmspesialisten kom fra 11. plass etter første omgang – med startnummer 52 – og kjørte seg helt til topps, kun 8 hundredeler foran landsmannen Gustav Wissting. Wissting har vært i storform i åpningen av sesongen og imponerte med en 17. plass i Levi-slalåmen med startnummer 82.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/l-urlo-di-jakobsen-per-rinascere-lo-svedese-firma-il-secondo-slalom-di-ce-a-suomu-pizzato-di-nuovo-miglior-azzurro","pub_date":"2026-11-26T11:40:00.000Z","fetched_at":"2026-11-26 11:45:02","lang_orig":"it","category":null,"athletes":"Kristoffer Jakobsen,Stefano Pizzato","athlete_nations":["ITA","SWE"],"also_sources":[],"norwegian":false},{"id":239500,"source_name":"SVT Sport","country":"SWE","title_no":"Pernilla Wiberg: «Beste sesongstart på veldig lenge»","title_orig":"Pernilla Wiberg: ”Bästa säsongsstarten på väldigt länge”","summary_no":"Den svenske alpinstjernen Pernilla Wiberg mener hun har hatt sin beste sesongstart på svært lenge.","spik_no":"Pernilla Wiberg, svensk alpinlegende og SVT-ekspert, roser den svenske sesongstarten som den beste på svært lenge. Høydepunktet så langt er at Sara Hector og Anna Swenn Larsson begge sto på pallen i Østerrike – første gang to svenske kvinner deler pall i verdenscupen på tolv år. På herresiden har Fabian Ax Swartz levert en fjerde- og en sjetteplass, og Gustav Wissting gjennomførte en historisk opphenting fra startnummer 82. Wiberg selv vant fire store enger klarte å fortsette, etter en tur til Cervinia med Fede.","spik_no":"Ninna Quario, trolig en nær venn eller samboer til Davide – omtalt i forbindelse med Federica Brignones avskjed – åpner opp om det smertefulle øyeblikket de innså at livet på toppen var over. Brignone er kjent som en utøver som har ofret enormt for sporten, og de menneskene rundt henne har fulgt den krevende reisveien på nært hold. Artikkelen gir et personlig og følelsesladet innblikk i hva det innebærer å støtte en toppidrettsutøver gjennom de tøffe valgene karrierens slutt medfører.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/davide-le-ha-dedicato-la-vita-con-fede-a-cervinia-ho-capito-che-non-ce-la-faceva-piu-parla-ninna-quario","pub_date":"2026-11-26T07:55:00.000Z","fetched_at":"2026-11-26 08:15:03","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":237015,"source_name":"Neveitalia","country":"ITA","title_no":"Familien Radici kjøper 70 prosent av LISKI – italiensk sikkerhetspioner på ski","title_orig":"La famiglia Radici acquisisce il 70% di LISKI, eccellenza italiana nella sicurezza sulle piste da sci","summary_no":"Familien Radici overtar 70 prosent av LISKI, et ledende italiensk selskap innen sikkerhetsutstyr for skianlegg.","spik_no":"Familien Radici overtar 70 prosent av LISKI, et italiensk selskap med lang tradisjon innen sikkerhetsutstyr for skianlegg – blant annet nett, porter og rekkverk brukt over hele verden. Radici-familien er en velstående industrislekt fra Bergamo-regionen, kjent fra tekstil- og kjemikaliesektoren, og dette oppkjøpet representerer en investering i den bredere skibransjen. LISKI er en sentral leverandør til verdenscuparrangementer og kommersielle skianlegg, og eierskiftet kan påvirke selskapets videre ekspansjon og produktutvikling.","url":"https://www.neveitalia.it/materiali/aziende/news/la-famiglia-radici-acquisisce-il-70-di-liski-eccellenza-italiana-nella-s :"2026-11-26 08:15:03","lang_orig":"it","category":null,"athletes":"Pietro Zazzi","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":237023,"source_name":"Neveitalia","country":"ITA","title_no":"Goggia hyller Brignone: – Mye av det jeg er som utøver, skylder jeg deg","title_orig":"Goggia e Brignone, che storia: le parole di Sofia. \"Grata di questi anni assieme, se sono l'atleta di oggi c'è moltissimo merito tuo\"","summary_no":"Sofia Goggia takker Federica Brignone for årene de har tilbrakt sammen på landslaget. – Jeg er evig takknemlig for alt du har betydd for meg, sier Goggia.","spik_no":"Sofia Goggia, en av verdens beste utforkjørere med OL-gull fra 2018 og en rekke verdenscupseire, hyller avtroppende lagvenninne Federica Brignone med dype og personlige ord. Goggia og Brignone har i mange år vært bærebjelkene i det italienske dame-landslaget, og selv om de to profilene tidvis har hatt en konkurransepreget dynamikk, binder et sterkt vennskap og gjensidig respekt dem sammen. Goggias utsagn om at mye av det hun er som utøver skyldes Brignone, understreker hvilken lederrolle sistnevnte har hatt i troppen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/goggia-e-brignone-che-storia-le-parole-di-sofia-grata-di-questi-anni-assieme-se-sono-l-atleta-di-oggi-c-e-moltissimo-merito-tuo","pub_date":"2026-11-25T18:40:00.000Z","fetched_at":"2026-11-26 08:15:03","lang_orig":"it","category":null,"athletes":"Federica Brignone,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":236994,"source_name":"Ski Racing","country":"INT","title_no":"Stifel HERoic Cup åpner i Killington med 10 000 dollar i premiepotten","title_orig":"Stifel HERoic Cup Opens in Killington With $10,000 on the Line in Women’s Alpine","summary_no":"Stifel HERoic Cup sparkes i gang i Killington med 10 000 dollar på spill i alpint for kvinner.","spik_no":"Stifel HERoic Cup er en ny konkurranseserie i USA som sparkes i gang under Killington-helgen, m gnone har annonsert at hun avslutter karrieren som alpinist. Den 34 år gamle italieneren er en av de mest dekorerte alpinistene i nyere tid – hun vant OL-gull i kombinasjon under Beijing-lekene i 2022 og har tatt totalt to store krystallkuler, senest den samlede verdenscuptittelen i sesongen 2024/25. I løpet av karrieren har hun vunnet over 30 verdenscuprenn og VM-medaljer i flere disipliner, og hun regnes som en av de mest allsidige utøverne Italia har hatt i alpint.","url":"https://www.rtvslo.si/sport/olimpijska-zmagovalka-brignone-napovedala-konec-kariere/801279","pub_date":"2026-11-25T16:07:18.000Z","fetched_at":"2026-11-25 16:15:05","lang_orig":"sl","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":236451,"source_name":"Ski Racing","country":"INT","title_no":"OL-gullvinner Federica Brignone legger opp på grunn av smerter","title_orig":"Olympic Gold Medalist Federica Brignone Retires, Citing Leg Pain","summary_no":"Den olympiske gullvinneren Federica Brignone avslutter karrieren etter vedvarende smerter i benet.","spik_no":"Federica Brignone kunngjorde sin karriereslutt onsdag 25. november 2026, ni måneder etter at hun vant to olympiske gullmedaljer på hjemmebane i Cortina d'Ampezzo. Den 36 år gamle italieneren brukket tibia og fibula og rev ACL under det italienske mesterskapet i storslalåm 3. april 2025, men kjempet seg tilbake og tok OL-gull i super-G og en disiplin til. Etter at en plate og skruer ble fjernet fra venstre ben i august, klargjorde to dager på ski i Cervinia at smertene fremdeles var for store til å fortsette. Brignone avsluttet sesongen 2024/25 med ti verdenscupseire og krystallkuler i sammenlagt, utfor og storslalåm.","url":"https://skiracing.com/federica-brignone-retires/","pub_date":"2026-11-25T15:56:48.000Z","fetched_at":"2026-11-25 16:00:01","lang_orig":"en","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":236471,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn og Shiffrin hyllet Brignone: – Et av historiens største comebacks","title_orig":"Vonn e Shiffrin, messaggi da brividi per Federica. \"A Cortina ci hai regalato uno dei più grandi ritorni della storia\"","summary_no":"Lindsey Vonn og Mikaela Shiffrin sendte rørende meldinger til Federica Brignone og hyllet hennes historiske comeback i Cortina.","spik_no":"Lindsey Vonn og Mikaela Shiffrin var blant de mange store alpinstjernene som hyllet Federica Brignone etter at italieneren kunngjorde sin karriereslutt onsdag 25. november 2026. Vonn, som selv kjemper for å komme tilbake etter en alvorlig skade i februar, kalte Brignones opptreden i Cortina for «et grandios comeback som alltid vil leve i oss». Også Tina Maze, Viktoria Rebensburg og Giuliano Razzoli var blant dem som sendte meldinger til 36-åringen, som vant OL-gull på hjemmebane bare ti måneder etter å ha brukket leggen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/vonn-e-shiffrin-messaggi-da-brividi-per-federica-a-cortina-ci-hai-regalato-uno-dei-piu-grandi-ritorni-della-storia","pub_date":"2026-11-25T15:45:00.000Z","fetched_at":"2026-11-25 16:00:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Lindsey Vonn,Mikaela Shiffrin","athlete_nations":["ITA","USA"],"also_sources":[],"norwegian":false},{"id":236109,"source_name":"Neveitalia","country":"ITA","title_no":"Takk, Fede – FISI og Roda tar farvel: «Et stort tap for bevegelsen»","title_orig":"Grazie Fede, il primo saluto è quello della FISI e di Roda. \"Una grande perdita per il movimento, ti auguriamo ogni bene per la vita\"","summary_no":"Det italienske skiforbundet FISI og Roda retter en varm avskjedshilsen til Federica og ønsker henne alt godt videre i livet.","spik_no":"Federica Brignone har annonsert sin umiddelbare karriereslutt etter treningsdager i Cervinia, og det italienske skiforbundet FISI og president Flavio Roda omtaler avgangen som «et stort tap for
