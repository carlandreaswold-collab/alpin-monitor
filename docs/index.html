<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>
    <div class="season" id="season-badge"></div>
    <span class="readonly-badge">👁 Lesevisning</span>
    <span class="updated">Oppdatert 3.11., 13:45</span>
  </div>

    <input class="search-input" type="search" id="search" placeholder="Søk i titler, utøvere…">
    <select class="athlete-select" id="country-select"><option value="">Alle land</option></select>
    <select class="athlete-select" id="athlete-select"><option value="">Alle utøvere</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="main">
  <div id="feed"></div>
  <div class="sidebar">
    <div class="section-label" id="spik-label">Spik-liste</div>
    <div id="spik-list"></div>
  </div>
</div>

<script>
const CATS = [{"id":"viktig","label":"⚡ Viktig"},{"id":"sportslig","label":"🎿 Sportslig"},{"id":"nyheter","label":"📰 Nyhet"},{"id":"goy","label":"😄 Gøy"},{"id":"nerding","label":"🔬 Nerding"},{"id":"kjendis","label":"🌟 Kjendis"},{"id":"naert","label":"🤝 Nært og nyttig"}];
const ARTICLES = [{"id":104069,"source_name":"Ski Racing","country":"INT","title_no":"Tre venner med ett felles mål: Gjøre alpint videoinnhold lettere tilgjengelig","title_orig":"Three Friends, One Shared Goal: Making Ski Racing Video Easier to Access","summary_no":"Tre venner har gått sammen om å gjøre videoer fra alpint skiløp enklere å finne og se for alle interesserte.","spik_no":"Tre venner – Sean Doucette, Peter Zawadzki og Jeremy Stonier – har grunnlagt selskapet YULLR, som skal gjøre det enklere å få tak i videoopptak fra alpintrening og -renn. Systemet bruker automatiserte kameraer som fanger opp kjøring og gjør opptakene tilgjengelige på nett mens utøverne fortsatt er på fjellet. Problemet de vil løse er velkjent i alpinmiljøet: trenere har allerede mer enn nok å gjøre med kursoppsett, portar og tidtaking, og videoen ender ofte opp som en ekstraopp­gave etter en lang treningsdag – da utøverne kanskje har mistet interessen for å se seg selv.","url":"https://skiracing.com/three-friends-one-shared-goal-making-ski-racing-video-easier-to-access/","pub_date":"2026-11-03T12:32:29.000Z","fetched_at":"2026-11-03 12:45:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":103813,"source_name":"ORF Sport","country":"AUT","title_no":"Flere nasjoner truer med Russland-boikott","title_orig":"Mehrere Nationen drohen mit Russland-Boykott","summary_no":"Flere nasjoner har truet med å boikotte Russland i forbindelse med internasjonal alpint-konkurranse.","spik_no":"Flere ishockey-nasjoner, deriblant Finland og Norge, truer med å boikotte kamper mot Russland under VM i Tyskland neste år. Det norske forbundet begrunner standpunktet med sikkerhetshensyn og krever at Russland holdes utenom internasjonale mesterskap så lenge krigen i Ukraina pågår. Presset mot det tyske ishockeyforbundet og verdensorganisasjonen IIHF øker, og Finland samler nå støtte fra flere land for en koordinert front. Saken er ikke direkte knyttet til alpint, og kilden omhandler ishockey.","url":"https://sport.orf.at/stories/3164417/","pub_date":"2026-11-03T12:04:15.000Z","fetched_at":"2026-11-03 12:15:06","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":103411,"source_name":"Sportschau","country":"GER","title_no":"327 dager etter fall: Olympiamester Gisin avslutter karrieren","title_orig":"327 Tage nach Sturz: Olympiasiegerin Gisin beendet Karriere","summary_no":"Michelle Gisin, olympisk mester i alpint, har avsluttet karrieren sin 327 dager etter at hun pådro seg en alvorlig skade i et fall.","spik_no":"Michelle Gisin avslutter karrieren 327 dager etter et alvorlig fall under utfortrening i St. Moritz i desember 2025, der hun så vidt unngikk å bli lam. Den 32 år gamle sveitsiske allrounderen er dobbel olympisk mester i kombinasjon, med gull fra både Pyeongchang 2018 og Beijing 2022, der hun i tillegg tok bronse i super-G. Fallet påførte henne alvorlige skader i nakken, håndleddet og kneet, og hun måtte gjennom flere operasjoner. Gisin sier i en uttalelse til det sveitsiske skiforbundet at beslutningen modnet parallelt med rehabiliteringen, og at hun nå er «svært glad» for valget hun har tatt.","url":"https://www.sportschau.de/wintersport/ski-alpin/olympiasiegerin-gisin-beendet-karriere,ski-alpin-gisin-100.html","pub_date":"2026-11-03T11:29:21.000Z","fetched_at":"2026-11-03 11:30:07","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":103287,"source_name":"Neveitalia","country":"ITA","title_no":"SC Courmayeur tar imot Brignone igjen: – En forelder holder alltid døren åpen","title_orig":"\"Un genitore lascia sempre la porta aperta, Fede è rimasta la ragazza che ama sciare in libertà\": lo S.C. Courmayeur riaccoglie Brignone","summary_no":"Federica Brignone ønskes velkommen tilbake til skiklubben SC Courmayeur, som beskriver henne som jenta som alltid har elsket å stå fritt på ski.","spik_no":"Federica Brignones hjemklubb SC Courmayeur ønsker henne hjertelig velkommen tilbake og beskriver henne som «jenta som alltid har elsket å stå fritt på ski». Nyheten kommer dagen etter at Brignone kunngjorde at hun forlater sin stilling i Carabinieri, den italienske militærenheten mange alpinister er tilknyttet. Den 34-årige alpinisten fra La Salle er Italias mestvinnende utøver gjennom tidene med to olympiske gull og over 30 verdenscupseire, og er nå i gang med oppkjøringen mot en ny comeback-sesong etter skade.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-genitore-lascia-sempre-la-porta-aperta-fede-e-rimasta-la-ragazza-che-ama-sciare-in-liberta-lo-sc-courmayeur-riaccoglie-brign","pub_date":"2026-11-03T11:25:00.000Z","fetched_at":"2026-11-03 11:30:02","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":103387,"source_name":"RTV SLO","country":"SLO","title_no":"Olympisk mester Michelle Gisin avslutter karrieren 11 måneder etter fall","title_orig":"Olimpijska prvakinja Michelle Gisin 11 mesecev po padcu končala kariero","summary_no":"Den olympiske mesteren Michelle Gisin har valgt å avslutte sin aktive karriere, elleve måneder etter at hun ble skadet i et alvorlig fall.","spik_no":"Michelle Gisin bekrefter karriereslutten elleve måneder etter at hun veltet stygt under utfortrening i St. Moritz i desember 2025. Den 32-årige sveitseren er en av alpinhistoriens mest allsidige utøvere, med to olympiske gull i kombinasjon fra henholdsvis 2018 og 2022, samt to VM-medaljer og pallplasseringer i samtlige disipliner i verdenscupen. Etter fallet, som nesten resulterte i lammelse, gjennomgikk hun flere operasjoner på nakke, håndledd og kne. At hun nå trekker seg, kommer ikke som en overraskelse etter omfanget av skadene.","url":"https://www.rtvslo.si/sport/olimpijska-prvakinja-michelle-gisin-11-mesecev-po-padcu-koncala-kariero/798885","pub_date":"2026-11-03T11:24:50.000Z","fetched_at":"2026-11-03 11:30:05","lang_orig":"sl","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":103013,"source_name":"ORF Sport","country":"AUT","title_no":"OL-vinner Gisin legger opp","title_orig":"Olympiasiegerin Gisin zieht Schlussstrich","summary_no":"Olympiamester Michelle Gisin setter strek over karrieren som alpinist.","spik_no":"Michelle Gisin avslutter karrieren med umiddelbar virkning etter at hun aldri kom seg tilbake etter et alvorlig fall i Abfahrttreningen i St. Moritz i desember 2025, der hun pådro seg skader i nakkevirvlene, håndleddet og kneet — og var nær ved å bli lam. Den 32 år gamle sveitseren vant OL-gull i alpint kombinasjon i både Pyeongchang 2018 og Beijing 2022, pluss OL-bronse i super-G i 2022. I løpet av 292 verdenscuprenn sto hun 22 ganger på pallen og vant individuelt én gang, i slalåm på Semmering i desember 2020 — samme bakke der hun hadde hatt sin verdenscupdebut i 2012.","url":"https://sport.orf.at/stories/3164414/","pub_date":"2026-11-03T10:54:27.000Z","fetched_at":"2026-11-03 11:00:05","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":102530,"source_name":"ORF Sport","country":"AUT","title_no":"Olympiamester Gisin avslutter karrieren","title_orig":"Olympiasiegerin Gisin beendet ihre Karriere","summary_no":"Alpinisten Michelle Gisin, som har vunnet olympisk gull, legger opp og avslutter sin aktive karriere som alpinist.","spik_no":"Michelle Gisin avslutter karrieren etter et alvorlig treningsfall i desember 2025 og kommer ikke tilbake til verdenscupen. Den sveitsiske allroundkjøreren tok to olympiske gull i kombinasjon, i Pyeongchang 2018 og Beijing 2022, og la til bronse i super-G i Beijing. I VM vant hun sølv i kombinasjon i 2017 og bronse i 2021. I løpet av 291 verdenscupstarter hentet hun 22 pallplasseringer og to seirer.","url":"https://sport.orf.at/stories/3164412/","pub_date":"2026-11-03T10:11:01.000Z","fetched_at":"2026-11-03 10:15:39","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":102661,"source_name":"SkinEWS","country":"SUI","title_no":"Gisin legger opp – avslutter karrieren","title_orig":"Das wars – Michelle Gisin beendet ihre Karriere","summary_no":"Michelle Gisin har annonsert at hun avslutter sin aktive karriere som alpinist.","spik_no":"Michelle Gisin annonserte 3. november 2026 at hun avslutter sin aktive karriere som alpinist, 327 dager etter et alvorlig fall under treningen til utforrennet i St. Moritz i desember 2025. 32-åringen fra Engelberg er todobbelt olympisk mester og en av Sveits mest allsidige alpinister gjennom tidene, med seirer i både kombinasjon, super-G og slalåm i verdenscupen. Med henne legger den siste av søsknene Gisin opp – søsteren Dominique sluttet i mars 2015 og broren Marc i november 2020. Familien Gisin har vært en av de mest markante alpinfamiliene i internasjonal alpinhistorie.","url":"https://www.skinews.ch/news/2026/michelle-beendet-karriere/","pub_date":"2026-11-03T10:05:24.000Z","fetched_at":"2026-11-03 10:30:05","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":102343,"source_name":"Neveitalia","country":"ITA","title_no":"Michelle Gisin legger opp – avslutter en enestående karriere","title_orig":"Il percorso di Michelle Gisin si conclude qui: ufficiale il ritiro della due volte olimpionica. \"Un viaggio incredibile\"","summary_no":"To ganger olympisk mester Michelle Gisin har offisielt kunngjort sin pensjonering fra alpint. Sveitseren omtaler karrieren som en utrolig reise.","spik_no":"Michelle Gisin, 32 år, har kunngjort at hun avslutter karrieren etter et alvorlig fall i utforrennet i St. Moritz 11. desember 2025. Sveitseren vant to olympiske gull, begge i kombinasjon – i Pyeongchang 2018 og Beijing 2022 – og tok også OL-bronse i super-G i 2022. Hun oppnådde tredjeplass i verdenscupsammenlagt sesongen 2020/21 og rakk 290 verdenscupstarter, med pall i samtlige disipliner. Gisin omtaler selv karrieren som «en utrolig reise».","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/il-percorso-di-michelle-gisin-si-conclude-qui-ufficiale-il-ritiro-della-due-volte-olimpionica-un-viaggio-incredibile","pub_date":"2026-11-03T09:50:00.000Z","fetched_at":"2026-11-03 10:00:02","lang_orig":"it","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":101375,"source_name":"Neveitalia","country":"ITA","title_no":"Fra Braathen til Shiffrin: Sölden-stjernene trener på Val Senales – nye løyper åpnet","title_orig":"Da Braathen a Shiffrin, i protagonisti di Sölden scelgono la Val Senales. Nuove piste aperte sul ghiacciaio","summary_no":"Alpinstjerner som Lucas Braathen og Mikaela Shiffrin har valgt Val Senales som treningsarena. Nye løyper er åpnet på breen foran sesongen.","spik_no":"Val Senales-breen i Sør-Tyrol bekrefter sin status som en av alpinsportens viktigste treningsarenaer: hele 18 av de 30 best plasserte utøverne i åpningsrennene i Sölden hadde forberedt seg nettopp her. Blant dem var Lucas Braathen, som vant herrenes storslalåm i Sölden, og Mikaela Shiffrin. Nye løyper er åpnet på breen, og 28. november er det planlagt åpning av nedenforliggende løyper, noe som utvider treningsmulighetene ytterligere frem mot sesongen.","url":"https://www.neveitalia.it/ski/valsenales/news/da-braathen-a-shiffrin-i-protagonisti-di-solden-scelgono-la-val-senales-nuove-piste-aperte-sul-ghiacciaio","pub_date":"2026-11-03T08:26:04.000Z","fetched_at":"2026-11-03 08:30:02","lang_orig":"it","category":null,"athletes":"Lucas Braathen,Mikaela Shiffrin","athlete_nations":["BRA","USA"],"also_sources":[],"norwegian":false},{"id":100903,"source_name":"SkinEWS","country":"SUI","title_no":"Ny utmerkelse til tredobbel olympisk mester Franjo von Allmen","title_orig":"Nächste Auszeichnung für Dreifach-Olympiasieger Franjo von Allmen","summary_no":"Franjo von Allmen, som vant tre olympiske gull, mottar nok en prestisjetung utmerkelse.","spik_no":"Franjo von Allmen er kåret til «Årets idrettsutøver i kantonen Bern 2026», nok en prestisjetung utmerkelse til den sveitsiske alpinisten. 25-åringen fra Berner Oberland tok tre olympiske gull og har hatt en formidabel sesong. Kantonen Bern deler hvert år ut prisen til utøvere som har nådd pallen i VM, EM eller andre høyprofilerte internasjonale konkurranser, og over 50 medaljevinnere ble hedret ved årets utdeling.","url":"https://www.skinews.ch/news/2026/naechste-auszeichnung-olympiasieger/","pub_date":"2026-11-03T07:42:46.000Z","fetched_at":"2026-11-03 07:45:04","lang_orig":"de","category":null,"athletes":"Franjo von Allmen","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":100827,"source_name":"RTV SLO","country":"SLO","title_no":"Houthi-raketter tvang asiatisk mesterskap fra januar til desember 2027","title_orig":"Rakete hutijev prestavile azijsko prvenstvo z januarja na december 2027","summary_no":"Asiatisk mesterskap i alpint er blitt flyttet fra januar til desember 2027 som følge av houthi-rakettangrep.","spik_no":"Det asiatiske alpinmesterskapet er flyttet fra januar til desember 2027 på grunn av houthi-rakettangrep i regionen. Houthi-bevegelsen i Jemen har siden 2023 gjennomført en rekke angrep mot skip og mål i Rødehavet og omkringliggende områder, noe som har skapt usikkerhet og sikkerhetsproblemer for arrangementer i nærheten. Det er uvanlig at geopolitiske konflikter direkte påvirker internasjonale alpinarrangementer, og beslutningen understreker hvor stor rekkevidden av konflikten har blitt.","url":"https://www.rtvslo.si/sport/rakete-hutijev-prestavile-azijsko-prvenstvo-z-januarja-na-december-2027/798849","pub_date":"2026-11-03T07:07:24.000Z","fetched_at":"2026-11-03 07:30:05","lang_orig":"sl","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":93021,"source_name":"ORF Sport","country":"AUT","title_no":"Nyvinninger skal løfte Kraft til topps","title_orig":"Neuerungen sollen Kraft an Spitze führen","summary_no":"Nye grep og endringer skal bidra til å bringe Kraft til topplasseringer i alpinsporten.","spik_no":"Stefan Kraft går inn i sin 15. verdenscupseong med ny teknikk og nytt skiutstyr etter en skuffende olympisk sesong. Den 33 år gamle østerrikeren, som er tredobbelt verdensmester og tidligere vinner av verdenscupen sammenlagt, brukte sommeren på intensive treningstester og vindtunnelarbeid. Han har erkjent at det snek seg inn feil i hoppingen de siste to årene, men er nå optimistisk etter at fysiske tester viser bedre resultater enn på lenge. Kraft har uttalt at han sikter mot å fortsette frem til vinter-OL i 2030.","url":"https://sport.orf.at/stories/3164080/","pub_date":"2026-11-02T19:30:40.000Z","fetched_at":"2026-11-02 19:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":91335,"source_name":"Neveitalia","country":"ITA","title_no":"Fem dager i Val Senales for de italienske Europa Cup-kvinnene","title_orig":"Cinque giorni in Val Senales per le azzurre del team Coppa Europa, da Bieler e Mathiou a Pomaré e D'Antonio","summary_no":"Det italienske Europa Cup-laget for kvinner gjennomfører en fem dagers treningssamling i Val Senales, med utøvere som Bieler, Mathiou, Pomaré og D'Antonio.","spik_no":"Det italienske Europa Cup-laget for kvinner gjennomfører en fem dagers treningssamling på isbreen i Val Senales i Sør-Tirol, fra 3. til 7. november. Åtte utøvere er kalt inn av teknisk direktør Gianluca Rulfi, blant dem Tatum Bieler og Sophie Mathiou, som nettopp deltok i sesongåpningen i Sölden. Giada D'Antonio og Ambra Pomaré er også med, men som en del av rehabiliteringen etter skader — Alessia Guerinoni er i en lignende situasjon, nesten ett år etter sin ulykke. Val Senales er et populært treningssted for alpinister tidlig i sesongen takket være høydeisbreen som gir snøsikre forhold allerede i oktober og november.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/cinque-giorni-in-val-senales-per-le-azzurre-del-team-coppa-europa-da-bieler-e-mathiou-a-pomare-e-d-antonio","pub_date":"2026-11-02T17:05:00.000Z","fetched_at":"2026-11-02 17:15:01","lang_orig":"it","category":null,"athletes":"Ambra Pomaré","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":91299,"source_name":"Sportschau","country":"GER","title_no":"To år etter skrekkfallet – Sarrazin klar for comeback","title_orig":"Zwei Jahre nach Horror-Sturz - Sarrazin vor Rückkehr","summary_no":"To år etter et alvorlig fall er Alexis Sarrazin klar for å gjøre comeback i alpinsporten.","spik_no":"To år etter det dramatiske fallet i Bormio er franske Cyprien Sarrazin klar for å returnere til verdenscupen. Den 32 år gamle franskmannen pådro seg alvorlige hodeskader under en treningskjøring på Stelvio-løypa 27. desember 2024, men slapp unna varige hjerne- eller nevrologiske skader. Han var med på det franske treningsleiret i Argentina i september, og sikter nå mot åpningsrennene i USA i slutten av november og begynnelsen av desember. Sarrazin understreker at han vil avgjøre kvelden før hvert renn om han er klar nok til å starte.","url":"https://www.sportschau.de/wintersport/ski-alpin/zwei-jahre-nach-horror-sturz-sarrazin-vor-rueckkehr,ski-alpin-sarrazin-comeback-100.html","pub_date":"2026-11-02T16:46:20.000Z","fetched_at":"2026-11-02 17:00:05","lang_orig":"de","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":91055,"source_name":"ORF Sport","country":"AUT","title_no":"Sarrazin sikter mot comeback i Copper Mountain","title_orig":"Sarrazin peilt Comeback in Copper Mountain an","summary_no":"Cyprien Sarrazin planlegger å gjøre comeback i Copper Mountain etter en periode utenfor konkurransesirkusen.","spik_no":"Cyprien Sarrazin planlegger comeback i Copper Mountain i slutten av november, to år etter at han pådro seg alvorlige hodeskader i et treningsfall i Bormio i desember 2024. 32-åringen lå flere dager i koma etter ulykken på Stelvio-bakken og har vært borte fra konkurransesirkuset siden. Treningssamling i Argentina har gitt ham tro på at kroppen er klar, og han er «ganske optimistisk» med tanke på å stille i super-G og storslalåm i Copper Mountain — og eventuelt utfor i Beaver Creek uken etter. Sarrazin var i storform sesongene før ulykken og vant blant annet to verdenscupnedrenn i Bormio i januar 2024.","url":"https://sport.orf.at/stories/3164395/","pub_date":"2026-11-02T16:30:24.000Z","fetched_at":"2026-11-02 16:45:04","lang_orig":"de","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":90846,"source_name":"Neveitalia","country":"ITA","title_no":"Sarrazin er tilbake: – 99 prosent sikker på start i Copper etter 701 dager","title_orig":"Sarrazin sta tornando, lo start a Copper ormai è certo dopo 701 giorni: \"Al 99% ci sarò, sta funzionando tutto al meglio\"","summary_no":"Cyprien Sarrazin bekrefter at han er klar for comeback i Copper Mountain etter 701 dagers fravær, og melder at alt fungerer optimalt.","spik_no":"Cyprien Sarrazin bekrefter at han er 99 prosent sikker på å stille til start i super-G i Copper Mountain 28. november – etter 701 dager borte fra verdenscupen. Den franske fartsspesialisten pådro seg alvorlige hodeskader i et stygt fall under utfortreningen i Bormio i desember 2023, og var nær ved å miste livet. Sarrazin var i storform før ulykken og vant begge utforrennene i Kitzbühel i januar 2024. Treningskjøringen i Val Senales den siste uken skal ifølge ham selv ha gitt svært gode tider og riktige følelser foran comebacket.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/sarrazin-sta-tornando-lo-start-a-copper-ormai-e-certo-dopo-701-giorni-al-99-ci-saro-sta-funzionando-tutto-al-meglio","pub_date":"2026-11-02T16:15:00.000Z","fetched_at":"2026-11-02 16:30:03","lang_orig":"it","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":90053,"source_name":"Neveitalia","country":"ITA","title_no":"Federica Brignone forlater C.S. Carabinieri og returnerer til Sci Club Courmayeur","title_orig":"Federica Brignone saluta il C.S. Carabinieri: \"Ho deciso di congedarmi e tornerò in pista con lo Sci Club Courmayeur\"","summary_no":"Federica Brignone har besluttet å ta avskjed fra C.S. Carabinieri og vil heretter konkurrere under Sci Club Courmayeur.","spik_no":"Federica Brignone forlater C.S. Carabinieri og vil fra sesongen 2026/27 konkurrere under Sci Club Courmayeur – klubben hun vokste opp med i Valle d'Aosta. Den 34 år gamle italieneren er en av de største alpinistene i historien, med to olympiske gull, og ble så sent som i desember forfremmet til grad av «Maresciallo» i Carabinieri for sine sportslige meritter. Brignone er fortsatt i rehabilitering etter operasjon, men markerer nå et symbolsk skifte mot karrierens sluttfase ved å returnere til røttene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/federica-brignone-saluta-il-cs-carabinieri-ho-deciso-di-congedarmi-e-tornero-sugli-sci-con-lo-sci-club-courmayeur","pub_date":"2026-11-02T15:00:00.000Z","fetched_at":"2026-11-02 15:15:02","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":89709,"source_name":"RTV SLO","country":"SLO","title_no":"Tjaša Vrtačič nær topp ti i Chile","title_orig":"Tjaša Vrtačič v Čilu blizu najboljše deseterice","summary_no":"Den slovenske alpinisten Tjaša Vrtačič presterte sterkt i Chile og var nær å ta seg inn blant de ti beste.","spik_no":"Den slovenske alpinisten Tjaša Vrtačič leverte en sterk prestasjon i Chile og var nær topp ti. Vrtačič er en av Slovenias mest profilerte utøvere i tekniske disipliner, og har representert landet i verdenscupen over flere sesonger. Treninger og konkurranser på den sørlige halvkule om sommeren er viktige for alpinister som ønsker å holde seg i form og teste formen før den europeiske vintersesongen starter.","url":"https://www.rtvslo.si/sport/tjasa-vrtacic-v-cilu-blizu-najboljse-deseterice/798800","pub_date":"2026-11-02T14:13:20.000Z","fetched_at":"2026-11-02 14:30:05","lang_orig":"sl","category":null,"athletes":"Tjaša Vrtačič","athlete_nations":["SLO"],"also_sources":[],"norwegian":false},{"id":89447,"source_name":"Ski Racing","country":"INT","title_no":"Noen i ditt hjørne: Innsikt i World Cup Dreams' mentorprogram","title_orig":"Someone in Your Corner: Inside World Cup Dreams’ Mentorship Program","summary_no":"World Cup Dreams tilbyr et mentorprogram som støtter unge alpinister på veien mot toppen av sporten.","spik_no":"World Cup Dreams er en organisasjon som driver et mentorprogram rettet mot unge, talentfulle alpinister som drømmer om å nå verdenscupnivå. Programmet kobler lovende utøvere med erfarne mentorer fra sporten, og søker å fylle gapet mellom nasjonale talentprogrammer og den ressurskrevende veien mot toppen. Alpinsporten er kjent for høye kostnader og store krav til støtteapparat, og slike initiativ spiller en viktig rolle for utøvere uten store nasjonale forbund i ryggen.","url":"https://skiracing.com/someone-in-your-corner-inside-world-cup-dreams-mentorship-program/","pub_date":"2026-11-02T13:44:15.000Z","fetched_at":"2026-11-02 14:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":89467,"source_name":"Neveitalia","country":"ITA","title_no":"Italienske utforskjørere trener i Pitztal frem til fredag","title_orig":"C'è Pitztal nel menu dei discesisti azzurri: fino a venerdì Casse, Franzoni e soci in allenamento sulle nevi austriache","summary_no":"Casse, Franzoni og resten av det italienske utforlaget er i Pitztal i Østerrike for treningssamling frem til fredag.","spik_no":"Det italienske utforlaget, med Mattia Casse og Giovanni Franzoni i spissen, er samlet til treningsleir i Pitztal i Østerrike frem til fredag. Pitztal-breen er et populært treningsområde tidlig i sesongen og brukes av flere nasjoner for å bygge form og teknisk grunnlag før Verdenscupåpningen. Italia har de siste sesongene utviklet seg til en solid utfernasjon, og Casse er blant de mest erfarne løperne i den fartsdominerte disiplinen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/c-e-pitztal-nel-menu-dei-discesisti-azzurri-fino-a-venerdi-casse-franzoni-e-soci-in-allenamento-sulle-nevi-austriache","pub_date":"2026-11-02T13:25:00.000Z","fetched_at":"2026-11-02 14:15:02","lang_orig":"it","category":null,"athletes":"Giovanni Franzoni","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":89468,"source_name":"Neveitalia","country":"ITA","title_no":"Kan Cochran-Siegle bli sesongens store overraskelse?","title_orig":"\"RCS\" può fare saltare il banco? Cochran-Siegle punta ad una gran stagione, per tanti motivi ora è un atleta ritrovato e... pericolosissimo","summary_no":"Ryan Cochran-Siegle sikter mot en sterk sesong og beskrives som en farlig utfordrer etter å ha funnet tilbake til toppformen.","spik_no":"Amerikaneren Ryan Cochran-Siegle blir fremhevet som en av sesongenes potensielle store overraskelser etter å ha jobbet seg tilbake til toppform. Han vant sin eneste verdenscupseier i super-G i Bormio i desember 2020 og tok VM-sølv i super-G i Cortina 2021, men har siden slitt med skader som har begrenset resultatene. Med fornyet selvtillit beskrives 34-åringen nå som en farlig utfordrer i de raske disiplinene.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/rcs-puo-fare-saltare-il-banco-cochran-siegle-punta-ad-una-gran-stagione-per-tanti-motivi-ora-e-un-atleta-ritrovato-e-pericolosi","pub_date":"2026-11-02T11:00:00.000Z","fetched_at":"2026-11-02 14:15:02","lang_orig":"it","category":null,"athletes":"Ryan Cochran-Siegle","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":89483,"source_name":"SkinEWS","country":"SUI","title_no":"Ytterligere tre utøvere slutter etter sesongen 2025/26","title_orig":"Auch dieses Trio tritt 2026/27 nicht mehr an","summary_no":"Også dette trioen vil ikke fortsette konkurransekarrieren fra og med sesongen 2026/27.","spik_no":"Tre alpinister avslutter karrieren etter sesongen 2025/26: latviske Liene Bondare og de britiske søsknene Charlotte og Robert Holmes. Robert Holmes, som fyller 25 år i 2026, deltok på Ungdoms-OL i Sveits i 2020, men har aldri slått gjennom på øverste nivå i verdenscupen. Alle tre beskrives som utøvere som har viet seg fullt til alpinsporten, men uten å ha nådd den store offentlige oppmerksomheten.","url":"https://www.skinews.ch/news/2026/dieses-tritt-nicht/","pub_date":"2026-11-02T08:23:29.000Z","fetched_at":"2026-11-02 14:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":84412,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrikske alpinister holder kontakten med toppen","title_orig":"Austrianerinnen halten Anschluss an Spitze","summary_no":"De østerrikske alpinistinnene holder seg i nærheten av verdenstoppen og viser lovende form.","spik_no":"De østerrikske alpinistinnene viser lovende form i oppkjøringen til den nye verdenscupsesongen og holder seg nær verdenstoppen. Østerrike har tradisjonelt vært en stormakt i damenes alpint, med profiler som Cornelia Hütter og Mirjam Puchner i fartsdisiplinene. Landslaget har investert tungt i å bygge et bredt og konkurransedyktig lag etter at de dominerte deler av forrige sesong.","url":"https://sport.orf.at/stories/3164350/","pub_date":"2026-11-01T15:15:30.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":84353,"source_name":"Neveitalia","country":"ITA","title_no":"Lara Colturi tester seg på Red Bull Center før retur til Rettenbach","title_orig":"Test al Red Bull Center per Lara Colturi, poi di nuovo sul Rettenbach. A Levi il suo esordio 4 anni fa e il podio dietro a Shiffrin","summary_no":"Lara Colturi gjennomfører testing på Red Bull Center og vender snart tilbake til Rettenbach-glacieret. I Levi debuterte hun for fire år siden og tok en pallplass bak Shiffrin.","spik_no":"Lara Colturi tester seg på Red Bull Center i Østerrike og forbereder retur til Rettenbach-glacieret i Sölden, der verdenscupsesongen tradisjonelt åpner. Den albansk-italienske slalomtalentet debuterte i Levi for fire år siden og tok allerede da en pallplass bak Mikaela Shiffrin som tenåring. Colturi er datter av den tidligere alpinisten Alessandro Colturi og regnes som et av damenes største talenter i tekniske disipliner.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/test-al-red-bull-center-per-lara-colturi-poi-di-nuovo-sul-rettenbach-a-levi-il-suo-esordio-4-anni-fa-e-il-podio-dietro-a-shiffr","pub_date":"2026-11-01T10:25:00.000Z","fetched_at":"2026-11-01 21:00:02","lang_orig":"it","category":null,"athletes":"Lara Colturi,Mikaela Shiffrin","athlete_nations":["ALB","USA"],"also_sources":[],"norwegian":false},{"id":84356,"source_name":"Neveitalia","country":"ITA","title_no":"Under to uker til Levi: Vlhova drømmer om slalomretur på Pitztal-snøen","title_orig":"Meno di due settimane a Levi: Vlhova sulla neve di Pitztal sogna un ritorno super in slalom, ma anche senza Shiffrin quante rivali","summary_no":"Petra Vlhova trener på Pitztal og sikter mot en sterk comeback i slalom i Levi, selv om mange rivaler venter – også uten Shiffrin i feltet.","spik_no":"Petra Vlhova trener på Pitztal-glacieret og sikter mot et sterkt comeback i slalom når sesongen åpner i finske Levi om under to uker. Den slovakiske stjernen mistet store deler av fjorårssesongen til kneskade, men har gradvis arbeidet seg tilbake mot toppform. Med Mikaela Shiffrin ute av bildet åpner det seg en mulig seier for Vlhova, som har vunnet slalomåpningen i Levi ved flere anledninger og er en av historiens mest meritterte slalomkjørere.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/meno-di-due-settimane-a-levi-vlhova-sulla-neve-di-pitztal-sogna-un-ritorno-super-in-slalom-ma-anche-senza-shiffrin-quante-rival","pub_date":"2026-11-01T07:30:00.000Z","fetched_at":"2026-11-01 21:00:02","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin,Petra Vlhová","athlete_nations":["SVK","USA"],"also_sources":[],"norwegian":false},{"id":84367,"source_name":"SkinEWS","country":"SUI","title_no":"Oscar Heine – fra ulykkesfugl til Verdenscup-debutant","title_orig":"Oscar Heine – vom Pechvogel zum Weltcup-Debütanten","summary_no":"Oscar Heine har gjort en bemerkelsesverdig reise fra motgang til sin første start i alpint verdenscup.","spik_no":"Tyske Oscar Heine gjør sin første start i alpint verdenscup etter en karriere preget av skader og tilbakeslag. Heine har kjempet seg tilbake gjennom lavere konkurranseserier og representerer en ny generasjon tyske fartskjørere. Verdenscupdebytet er resultatet av langvarig og tålmodig arbeid, og markerer et gjennombrudd for en utøver som lenge har vært plaget av uflaks.","url":"https://www.skinews.ch/news/2026/pechvogel-weltcup-debuetanten/","pub_date":"2026-10-31T21:35:38.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Oscar Heine","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":84360,"source_name":"Neveitalia","country":"ITA","title_no":"Kildes mamma om lagkameratenes støtte: «En fantastisk gjeng»","title_orig":"Kilde, l'affetto dei compagni di squadra, il racconto di mamma Kristin: \"Un gruppo di persone fantastiche\"","summary_no":"Aleksander Aamodt Kildes mor Kristin forteller om den varme støtten sønnen har fått fra lagkameratene sine under rehabiliteringen.","spik_no":"Aleksander Aamodt Kildes mor Kristin forteller om den varme støtten sønnen har fått fra lagkameratene under rehabiliteringen etter akillessenen-skaden han pådro seg i Chile 15. oktober 2026. Skaden koster ham hele sesongen og kommer knapt tre år etter det alvorlige kneskaden i Wengen i januar 2023. Kilde skal selv ha sagt at han manglet bare ti prosent for å være på et nivå der han kunne kjempe om seire igjen. Også Steen Olsen sliter med kneproblemene, noe som skaper usikkerhet rundt norges alpinlag foran rennene i Copper Mountain og Beaver Creek.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/kilde-l-affetto-dei-compagni-di-squadra-il-racconto-di-mamma-kristin-un-gruppo-di-persone-fantastiche","pub_date":"2026-10-31T12:30:00.000Z","fetched_at":"2026-11-01 21:00:02","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":84331,"source_name":"Ski Racing","country":"INT","title_no":"Moltzans Sölden-seier viderefører collegeskiingens VM-arv","title_orig":"Paula Moltzan’s Sölden Win Extends Collegiate Skiing’s World Cup Legacy","summary_no":"Paula Moltzans verdenscupseier i Sölden bekrefter den sterke tradisjonen amerikanske collegeskiløpere har i verdenscupen.","spik_no":"Paula Moltzan vant åpningsrennets storslalåm i Sölden 24. oktober 2026 med 0,01 sekunds margin etter å ha gått fra femteplass til seier på andrerunden. 32-åringen ble dermed den eldste kvinnen som har vunnet sitt første verdenscuprenn i alpint. Med 13 sesonger på verdenscuptouren, ti pallplasser og OL-bronse i lagkonkurransen fra Milano-Cortina 2026 i bagasjen, var Sölden-seieren det resultatet som hadde unnsluppet henne lengst. Seieren løfter samlet pallstatistikk til 11, og bekrefter den sterke tradisjonen NCAA-utdannede løpere har for å lykkes på det høyeste nivået.","url":"https://skiracing.com/paula-moltzan-world-cup-ncaa-skiing/","pub_date":"2026-10-30T21:35:48.000Z","fetched_at":"2026-11-01 21:00:01","lang_orig":"en","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":84332,"source_name":"Ski Racing","country":"INT","title_no":"Derfor valgte Lara Gut-Behrami livet etter skikarrieren","title_orig":"Why Lara Gut-Behrami chose life beyond ski racing","summary_no":"Den sveitsiske stjernen Lara Gut-Behrami forteller om valgene som førte henne bort fra toppidrettslivet og hva som venter henne videre.","spik_no":"Lara Gut-Behrami kunngjorde sin karriereslutt i august 2026, selv om hun hadde kommet seg fullt tilbake etter en alvorlig kneskade. I et intervju med Tages-Anzeiger forklarte hun at det ville koste for mye energi og kreve for mange måneders oppofringer å vende tilbake, og at skisporten de siste årene hadde føles mer som en byrde enn en frihet. Sveitseren rakk heller ikke la seg friste av utsikten til et hjemme-VM i Crans-Montana i februar 2027. Karrieren hennes teller 48 verdenscupseire, 101 pallplasser og sammenlagtseire i 2016 og 2024.","url":"https://skiracing.com/why-lara-gut-behrami-chose-life-beyond-ski-racing/","pub_date":"2026-10-30T20:23:30.000Z","fetched_at":"2026-11-01 21:00:01","lang_orig":"en","category":null,"athletes":"Lara Gut-Behrami","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":84334,"source_name":"Ski Racing","country":"INT","title_no":"SYNC Performance Elite: Det kuttresistente undertøyet løpere bør kjenne til","title_orig":"SYNC Performance Elite Cut Resistant Base Layer: What Racers Need to Know This Season","summary_no":"SYNC Performances nye kuttresistente base layer er designet spesielt for alpinister og kan bli et viktig sikkerhetstilskudd denne sesongen.","spik_no":"Fra og med sesongen 2026/27 krever FIS at alle utøvere i FIS-godkjente alpinrenn bruker kuttresistente bukser, en regel som tidligere kun gjaldt de øverste konkurransenivåene som verdenscup og kontinentalcup. SYNC Performance lanserer nå et kuttresistent base layer-plagg som er godkjent med tre stjerner etter FIS-DITF 2021-standarden og finnes i både voksen- og juniørstørrelser. Bakgrunnen for regelskjerpingen er at skikanter er skarpere enn noensinne og kan forårsake alvorlige kutt ved fall, særlig på beina.","url":"https://skiracing.com/sync-performance-elite-cut-resistant-base-layer-what-racers-need-to-know-this-season/","pub_date":"2026-10-30T11:30:00.000Z","fetched_at":"2026-11-01 21:00:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":84368,"source_name":"SkinEWS","country":"SUI","title_no":"Michelle Gisin – avgjørelsen nærmer seg","title_orig":"Michelle Gisin – die Entscheidung naht","summary_no":"For Michelle Gisin nærmer en viktig avgjørelse seg, trolig knyttet til hennes videre karriere i alpint.","spik_no":"Sveitsiske Michelle Gisin nærmer seg trolig en avgjørelse om sin fremtid i alpint. Gisin vant kombinasjon under OL i Pyeongchang 2018 og har gjennom karrieren kjempet mot gjentatte skadeproblemer, særlig kneskader. Hun er søster av den tidligere verdenscupvinneren Marc Gisin og kombinasjonsspesialisten Dominique Gisin, og har lenge vært en allrounder i det sveitsiske landslaget.","url":"https://www.skinews.ch/news/2026/michelle-gisin-entscheidung/","pub_date":"2026-10-30T10:50:54.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":84369,"source_name":"SkinEWS","country":"SUI","title_no":"BOSV: Franjo von Allmen gjest på sesongåpningen","title_orig":"BOSV: Franjo von Allmen als Gast beim Saison-Kick-off","summary_no":"Franjo von Allmen var æresgjest under Bayersk skiforbunds sesongkick-off og delte erfaringer med deltakerne.","spik_no":"Sveitsiske Franjo von Allmen var æresgjest under Bayersk skiforbunds sesongåpning og delte erfaringer fra sitt gjennombrudd på verdenscupnivå. Von Allmen markerte seg kraftig i sesongen 2023/24 med sterke resultater i utfør og super-G, og ble raskt regnet som et av alpinsportens største nye navn. At han inviteres som inspirasjonskilde for tysk ungdom understreker den imponerende gjennomslagskraften han har fått i hele alpinverden.","url":"https://www.skinews.ch/ski-insider/2026/franjo-allmen-saison/","pub_date":"2026-10-30T10:44:03.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Franjo von Allmen","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":84370,"source_name":"SkinEWS","country":"SUI","title_no":"Franjo von Allmen tildelt «Skieur d'Or»","title_orig":"Franjo von Allmen mit dem „Skieur d’Or“ ausgezeichnet","summary_no":"Franjo von Allmen er blitt tildelt den prestisjetunge prisen «Skieur d'Or» for sine prestasjoner i alpint.","spik_no":"Franjo von Allmen er tildelt «Skieur d'Or», en av alpinsportens mest prestisjefylte utmerkelser. Den sveitsiske fartsspesialisten hadde sitt store gjennombrudd i verdenscupsesongen 2023/24, da han tok flere pallplasseringer og imponerte i utfør og super-G. Prisen bekrefter at von Allmen allerede i ung alder er anerkjent som en av de fremste fartsutøverne i internasjonal alpint.","url":"https://www.skinews.ch/video/2026/franjo-allmen-ausgezeichnet/","pub_date":"2026-10-30T10:12:29.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Franjo von Allmen","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":84371,"source_name":"SkinEWS","country":"SUI","title_no":"Franjo von Allmen mottar «Skieur d'Or» for første gang","title_orig":"Franjo von Allmen erstmals mit dem „Skieur d’Or“ ausgezeichnet","summary_no":"For første gang er Franjo von Allmen hedret med «Skieur d'Or», en av alpinsportens gjeve utmerkelser.","spik_no":"Franjo von Allmen mottar «Skieur d'Or» for første gang og føyer seg dermed inn i en eksklusiv rekke av alpinstjerner som har mottatt utmerkelsen. Von Allmen fikk sitt internasjonale gjennombrudd i løpet av sesongen 2023/24 med imponerende resultater i de raske disiplinene utfør og super-G. For Sveits, som har en stolt tradisjon i fartsalpint, representerer den unge von Allmen et lysende håp for kommende sesonger.","url":"https://www.skinews.ch/news/2026/franjo-erstmals-ausgezeichnet/","pub_date":"2026-10-30T10:00:30.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Franjo von Allmen","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":82274,"source_name":"Neveitalia","country":"ITA","title_no":"Hirscher i Val Senales – italienske fartsjenter ankommer mandag","title_orig":"In Val Senales anche Hirscher e da lunedì le velociste azzurre di CdM, reduci dal blocco di lavoro allo Stelvio","summary_no":"Marcel Hirscher trener i Val Senales, og fra mandag slutter de italienske Verdenscup-fartsspesialistene seg til leiren etter treningsblokk på Stelvio.","spik_no":"Marcel Hirscher trener på breen i Val Senales og har ifølge italienske medier valgt å stå over åpningsrennet i Sölden – han vurderer nå om han vil delta i de to første slalomrennene i Levi og Gurgl. Den åttedobbelte verdenscupvinneren er tilbake i alpinsporten som nederlandsk statsborger etter å ha representert Østerrike gjennom hele sin storhetstid fra 2007 til 2019. Fra mandag slutter de italienske verdenscup-fartsjentene seg til leiren i Val Senales, etter en treningsblokk på Stelvio – blant dem søstrene Delago, Curtoni og Melesi.","url":"https://www.neveitalia.it/sport/scialpino/news/in-val-senales-anche-hirscher-e-da-lunedi-le-velociste-azzurre-di-cdm-reduci-dal-blocco-di-lavoro-allo-stelvio","pub_date":"2026-10-29T14:10:00.000Z","fetched_at":"2026-10-29 14:15:01","lang_orig":"it","category":null,"athletes":"Marcel Hirscher","athlete_nations":["NED"],"also_sources":[],"norwegian":false},{"id":82194,"source_name":"Expressen","country":"SWE","title_no":"Skiforbundets krisegrep – tvinges til å reise til Norge","title_orig":"Skidlandslagets krisdrag – tvingas åka till Norge","summary_no":"Det svenske alpinlandslaget er tvunget til å ta et drastisk grep i en krisesituasjon, og må reise til Norge.","spik_no":"Det svenske langrennlandslaget måtte avlyse det planlagte treningsleiren i Bruksvallarna og reiser i stedet til Trysil i Norge på grunn av snømangel. Den milde høsten har skapt krisestemning bare tre uker før sesongpremieren, og landslagsledelsen har den siste uken lett etter brukbare snøforhold i Sverige, Finland og Norge. Landslagssjef Niklas Jonsson bekrefter at Trysil til slutt ble valget. Situasjonen er et tegn på en stadig mer krevende treningshverdag for skandinaviske langrennsnasjoner i takt med mildere høsttemperaturer.","url":"https://www.expressen.se/sport/langdskidor/skidlandslagets-krisdrag-tvingas-aka-till-norge/","pub_date":"2026-10-29T13:51:35.000Z","fetched_at":"2026-10-29 14:00:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":["VG"],"norwegian":false},{"id":81167,"source_name":"Neveitalia","country":"ITA","title_no":"Marta Rossetti tok utdanning før comeback i Levi","title_orig":"In vista del gran ritorno a Levi dopo una stagione ai box, Marta Rossetti si è laureata","summary_no":"Etter en sesong utenfor løypene har Marta Rossetti fullført utdannelsen sin og er klar for retur til Levi.","spik_no":"Den italienske slalomkjøreren Marta Rossetti er klar for comeback i Levi 14. november etter en sesong utenfor løypene, og hun har i mellomtiden fullført en grad i økonomi og bedriftsledelse. Rossetti har vært ute med sitt andre korsbåndskade på 13 måneder, og Levi-rennet blir hennes første verdenscupstart siden skaden. Den brescianske utøveren var i sin tid regnet som et av de største håpene for italiensk slalom etter en rekke sterke macher, og det er 14 år siden Italia sist var på pallen i lagkonkurransen for kvinner.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/in-vista-del-gran-ritorno-a-levi-dopo-una-stagione-ai-box-marta-rossetti-si-e-laureata","pub_date":"2026-10-29T12:20:00.000Z","fetched_at":"2026-10-29 12:30:01","lang_orig":"it","category":null,"athletes":"Marta Rossetti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":80689,"source_name":"Neveitalia","country":"ITA","title_no":"Utfart og super-G på «La VolatA» i januar – første snø på Passo San Pellegrino og billetter til salgs","title_orig":"Discesa e super-g su \"La VolatA\" a gennaio, che spettacolo: prima neve a Passo San Pellegrino e... biglietti in vendita","summary_no":"Det blir utfart og super-G på løypa «La VolatA» i januar, og første snø har allerede falt på Passo San Pellegrino. Billetter er nå tilgjengelige for salg.","spik_no":"Verdenscupen i alpint for kvinner returnerer til Val di Fassa 9.–10. januar 2027, med utfart og super-G på løypa «La VolatA» på Passo San Pellegrino. Det blir bare tredje gang i historien at Val di Fassa er vertskap for verdenscupen i alpin for kvinner. Arrangementet kommer to måneder tidligere enn i 2026, i en periode der de beste alpinistene tradisjonelt trener i Ski Area San Pellegrino. Billetter er allerede lagt ut for salg, og løypa er valgt av det italienske skiforbundet FISI også til de nasjonale mesterskapene i april.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/discesa-e-super-g-su-la-volata-a-gennaio-che-spettacolo-prima-neve-a-passo-san-pellegrino-e-biglietti-in-vendita","pub_date":"2026-10-29T11:35:00.000Z","fetched_at":"2026-10-29 11:45:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":79663,"source_name":"RTV SLO","country":"SLO","title_no":"Alpinrennet for kvinner flyttet fra Narvik til Kvitfjell","title_orig":"Tekmi alpskih smučark iz Narvika preselili v Kvitfjell","summary_no":"Alpinrennene for kvinner som opprinnelig skulle arrangeres i Narvik, er flyttet til Kvitfjell.","spik_no":"Alpinrennene for kvinner som skulle arrangeres i Narvik er flyttet til Kvitfjell. Narvik har de siste årene profilert seg som alpinby og har arrangert verdenscuprenn, men logistiske eller værmessige utfordringer kan føre til at renn må flyttes. Kvitfjell i Gudbrandsdalen er Norges mest erfarne verdenscuparena for alpint og har siden 1990-tallet vært et fast innslag på sirkusen, særlig for fartsdisiplinene utfor og super-G.","url":"https://www.rtvslo.si/sport/tekmi-alpskih-smucark-iz-narvika-preselili-v-kvitfjell/798410","pub_date":"2026-10-29T09:47:52.000Z","fetched_at":"2026-10-29 10:00:04","lang_orig":"sl","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":79240,"source_name":"Neveitalia","country":"ITA","title_no":"FIS bekrefter: Kvitfjell overtar de avlyste Narvik-rennene for kvinner","title_orig":"Tutto secondo previsioni: la FIS annuncia la ricollocazione a Kvitfjell delle gare veloci femminili saltate a Narvik","summary_no":"FIS kunngjør at de avlyste fartsrennene for kvinner i Narvik flyttes til Kvitfjell, akkurat som ventet.","spik_no":"FIS bekrefter offisielt at de avlyste fartsrennene for kvinner i Narvik flyttes til Kvitfjell, med utfor og super-G planlagt 12.–13. mars 2027. Narvik måtte gi fra seg rennene på grunn av forsinkelser i infrastrukturen og pågående arbeider knyttet til VM i alpint 2029. Kvitfjell og løypa «Olympiabakken» er et populært og veletablert sted for fartsdisiplinene – i 2026 sikret Italia en historisk bragd der da Pirovano og Goggia tok henholdsvis seier og sammenlagtcup.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/tutto-secondo-previsioni-la-fis-annuncia-la-ricollocazione-a-kvitfjell-delle-gare-veloci-femminili-saltate-a-narvik","pub_date":"2026-10-29T09:25:00.000Z","fetched_at":"2026-10-29 09:30:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":["SkinEWS","ORF Sport"],"norwegian":false},{"id":79137,"source_name":"VG","country":"NOR","title_no":"Kvitfjell redder verdenscuprenn i alpint etter Narvik-nei: – Ekstremt viktig","title_orig":"Kvitfjell redder verdenscuprenn i alpint etter Narvik-nei: – Ekstremt viktig","summary_no":"","spik_no":"Kvitfjell stiller opp som reserve og overtar verdenscuprennene i alpint etter at Narvik trakk seg som arrangør så sent som forrige uke. Narvik sa fra seg utfor- og super-G-rennene for kvinner i mars fordi forberedelsene til VM 2027 ikke var kommet langt nok. Kvitfjell er eneste alternativ i Norge med FIS-godkjent utforløype på verdenscupnivå, og er en erfaren arrangør med lange tradisjoner fra verdenscup siden tidlig på 1990-tallet. Nå vil både kvinner og menn kjøre fartsrenn i OL-løypene fra Lillehammer-lekene i 1994, med renn med en ukes mellomrom.","url":"https://www.vg.no/sport/i/GrVPV6/kvitfjell-redder-verdenscuprenn-i-alpint-etter-narvik-nei-ekstremt-viktig","pub_date":"2026-10-29T09:11:50.000Z","fetched_at":"2026-10-29 09:15:03","lang_orig":"no","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":78518,"source_name":"Neveitalia","country":"ITA","title_no":"Bassino trener hardt på Diavolezza før amerikanske renn","title_orig":"Sul \"duro\" di Diavolezza un lavoro importante per Bassino (in pista con Pirovano e Zenere): quale Marta vedremo negli States?","summary_no":"Marta Bassino har gjennomført viktig trening på den krevende Diavolezza-pisten sammen med Pirovano og Zenere, i forkant av konkurransene i USA.","spik_no":"Marta Bassino har gjennomført intensiv trening på Diavolezza-breen i Sveits sammen med lagvenninnene Laura Pirovano og Asja Zenere, som forberedelse til rennene i USA. Bassino er en av Italias mest allsidige alpinister og har vunnet verdenscupseirer i disipliner som storslalåm, parallellslalåm og super-G. Den 28 år gamle piemonteseren har tidligere vist god evne til å toppe seg mot slutten av sesongen, og treningen på Diavolezza – en krevende og høytliggende piste – er en bevisst strategi for å holde formen oppe mellom rennene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sul-duro-di-diavolezza-un-lavoro-importante-per-bassino-in-pista-con-pirovano-e-zenere-quale-marta-vedremo-negli-states","pub_date":"2026-10-28T17:35:00.000Z","fetched_at":"2026-10-29 08:15:02","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":78191,"source_name":"Neveitalia","country":"ITA","title_no":"Tre uker på Stubai før sesongstart: Matteoli og lagkamerater forbereder seg i Østerrike","title_orig":"Ben tre settimane a Stubai prima dello start: Matteoli e compagni preparano in Austria una grande stagione","summary_no":"Matteoli og hans lagkamerater har tilbrakt hele tre uker på Stubai-breen i Østerrike for å forberede seg til den kommende alpinski-sesongen.","spik_no":"Det italienske alpinlandslaget i freesnow har tilbrakt tre uker på Stubai-breen i Østerrike som siste samling før sesongstart. Ian Matteoli leder troppen som også inkluderer Leo Framarin, Marilù Poluzzi, Alessia Vergani og Fanny Piantanida Chiesa. Sesongen åpner med Big Air i Innsbruck 26.–28. november, hvor verdenscupen i freesnow også sparker i gang. Stubai er et populært treningssenter for alpinnasjoner om høsten fordi breen gir snøsikre forhold langt før sesongstart i lavlandet.","url":"https://www.neveitalia.it/snowboard/news/ben-tre-settimane-a-stubai-prima-dello-start-matteoli-e-compagni-preparano-in-austria-una-grande-stagione","pub_date":"2026-10-28T15:45:00.000Z","fetched_at":"2026-10-28 16:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":78497,"source_name":"Ski Racing","country":"INT","title_no":"Kan nakketrening gi bedre skikjøring og redusere hjernerystelsesrisiko?","title_orig":"Could Neck Training Improve Ski Racing Performance and Reduce Concussion Risk?","summary_no":"Eksperter undersøker om målrettet nakketrening kan forbedre prestasjoner i alpint og samtidig redusere risikoen for hjernerystelse.","spik_no":"Forskningsmiljøer og eksperter undersøker nå om målrettet nakketrening kan gjøre alpinister raskere og samtidig redusere risikoen for hjernerystelse ved fall. Teorien er at en sterkere nakkemuskulator demper kraftoverføringen til hjernen ved støt, noe som er særlig relevant i fartsdisiplinene utfor og super-G der utøverne kan nå godt over 130 km/t. Hjernerystelse er et økende tema i alpinsporten, og flere utøvere – blant dem Aleksander Aamodt Kilde – har måttet stå over lengre perioder etter hodeskader. Forskningen på feltet er fortsatt i en tidlig fase, men interessen fra trenere og medisinske team er voksende.","url":"https://skiracing.com/could-neck-training-improve-ski-racing-performance-and-reduce-concussion-risk/","pub_date":"2026-10-28T15:30:00.000Z","fetched_at":"2026-10-29 08:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":77539,"source_name":"Neveitalia","country":"ITA","title_no":"Rikt verdenscupprogram i Dolomittene","title_orig":"Un programma ricchissimo sulle Dolomiti, tutti gli eventi di Coppa del Mondo dalla Val di Fassa a San Candido, Cortina...","summary_no":"Et innholdsrikt program av verdenscupkonkurranser venter i Dolomittene, med renn fra Val di Fassa til San Candido og Cortina.","spik_no":"Dolomittene presenterte nylig et omfattende verdenscupprogram for sesongen 2026/27, der alpint, nordiske grener, skicross, snowboard og telemark alle er representert. For alpint starter det med fire herrerenn i Val Gardena og Alta Badia 18.–21. desember, før kvinnenes verdenscup returnerer til den nye utforkjøringen «La VolatA» i Val di Fassa 9.–10. januar. Cortina d'Ampezzo, som er kjent fra OL-historien og er verdsatt som et av alpinsportens mest prestisjefylte arrangementssteder, inngår også i programmet. Dolomiti Superski koordinerer arrangørkomiteene og presenterte sesongen på Auditorium Testori i Milano.","url":"https://www.neveitalia.it/sport/eventi/news/un-programma-ricchissimo-sulle-dolomiti-tutti-gli-eventi-di-coppa-del-mondo-dalla-val-di-fassa-a-san-candido-cortina","pub_date":"2026-10-28T14:45:00.000Z","fetched_at":"2026-10-28 15:00:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":77356,"source_name":"Ski Racing","country":"INT","title_no":"Carrick-Smith satte britisk GS-historie med 12.-plass i Sölden","title_orig":"Freddy Carrick-Smith’s 12th in Sölden Makes British GS History","summary_no":"Freddy Carrick-Smith skrev britisk alpinhistorie med sin 12.-plass i storslalåm i Sölden.","spik_no":"Freddy Carrick-Smith skrev britisk alpinhistorie da han ble nummer 12 i åpningsrennets storslalåm i Sölden, som var hans første verdenscuppoeng. Det var Storbritannias beste plasering i en verdenscup-storslalåm for herrer siden mars 2022. Carrick-Smith, som startet med startnummer 46, var bare i sitt femte verdenscupstevne totalt og debuterte i Sölden for akkurat ett år siden. Han er sønn av firedobbel britisk olympier Emma Carrick-Anderson, og faren Phil Smith fungerer som hans tekniker.","url":"https://skiracing.com/freddy-carrick-smiths-12th-in-solden-makes-british-gs-history/","pub_date":"2026-10-28T14:39:30.000Z","fetched_at":"2026-10-28 14:45:01","lang_orig":"en","category":null,"athletes":"Freddy Carrick-Smith,Lucas Braathen","athlete_nations":["BRA","GBR"],"also_sources":[],"norwegian":false},{"id":77260,"source_name":"ORF Sport","country":"AUT","title_no":"Tvungen pause for slalomstjernen Gallhuber","title_orig":"Zwangspause für Slalom-Ass Gallhuber","summary_no":"Slalomspesialisten Gallhuber må ta en ufrivillig pause fra konkurransene.","spik_no":"Den østerrikske slalomspesialisten Katharina Gallhuber må gå glipp av starten på verdenscupsesongen etter en kneartroskopi. 29-åringen fra Niederøsterreich bekreftet selv på Instagram at hun vil miste de første rennene, deriblant åpningsrennene i Levi, Gurgl og Killington i november. Gallhuber er en erfaren profil på verdenscupsirkuset og har olympiske meritter: bronse i slalåm og sølv i lagkonkurransen under OL i Pyeongchang 2018. Målet er å komme tilbake til konkurransene så raskt som mulig.","url":"https://sport.orf.at/stories/3164155/","pub_date":"2026-10-28T14:17:16.000Z","fetched_at":"2026-10-28 14:30:05","lang_orig":"de","category":null,"athletes":"Katharina Gallhuber","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":77053,"source_name":"Neveitalia","country":"ITA","title_no":"McGrath trener super-g på Rettenbach med tanke på Colorado","title_orig":"Coppa di slalom da difendere, ma Atle Lie McGrath lavora sul Rettenbach in ottica super-g pensando al Colorado","summary_no":"Atle Lie McGrath har en slalomcup å forsvare, men norske har fokus på super-g-trening på Rettenbach med blikket rettet mot kommende konkurranser i Colorado.","spik_no":"Atle Lie McGrath trener super-g på Rettenbach-breen i Sölden, til tross for at han har en slalomcup å forsvare og kommende slalomrenn i Levi og Gurgl i november. Den 26 år gamle nordmannen gikk ut i andre omgang i åpningsrennets storslalåm, men har altså valgt å rette blikket mot fartsøvelser med tanke på konkurransene i Colorado – Copper Mountain og Beaver Creek. Det er særlig Beaver Creek som vekker minner: McGrath var imponerende der i 2022 før han pådro seg en ny kneskade. Sölden-breen er dessuten aktuell som arena for to super-g-renn i åpningen av 2027/28-sesongen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/coppa-di-slalom-da-difendere-ma-atle-lie-mcgrath-lavora-sul-rettenbach-in-ottica-super-g-pensando-al-colorado","pub_date":"2026-10-28T14:05:00.000Z","fetched_at":"2026-10-28 14:15:01","lang_orig":"it","category":null,"athletes":"Atle Lie McGrath","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":76731,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn klar for siste operasjon: – Mentalt tøff nedtelling","title_orig":"\"Countdown duro mentalmente, tra meno di due settimane mi opero\": Lindsey Vonn verso l'ultimo intervento alla gamba","summary_no":"Lindsey Vonn skal operere benet om mindre enn to uker og beskriver ventetiden som mentalt krevende.","spik_no":"Lindsey Vonn er klar for det hun beskriver som sin siste operasjon, og sier ventetiden på under to uker er mentalt krevende. Inngrepet innebærer fjerning av skruer og plater i venstre tibia, samt en operasjon på korsbåndet. Vonn, som er en av tidenes mestvinnende alpinister med 82 verdenscupseirer og OL-gull i utfor fra 2010, har tilbrakt store deler av 2026 med rehabilitering etter en alvorlig skade hun pådro seg tidligere i år. I høst har hun jobbet intenst i treningssalen for å styrke muskulaturen før det avsluttende inngrepet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/countdown-duro-mentalmente-tra-meno-di-due-settimane-mi-opero-lindsey-vonn-verso-l-ultimo-intervento-alla-gamba","pub_date":"2026-10-28T13:30:00.000Z","fetched_at":"2026-10-28 13:45:02","lang_orig":"it","category":"nyheter","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":75937,"source_name":"SkinEWS","country":"SUI","title_no":"Østerrikske kvinner mister utøver i slalåmtroppen","title_orig":"Ausfall im Slalom-Team der Österreicherinnen","summary_no":"Det østerrikske kvinnelandslaget i slalåm må klare seg uten en av sine utøvere etter et nytt frafall.","spik_no":"Katharina Gallhuber må ta en pause fra årets slalåmsesong etter at hun gjennomgikk en kne-artroskopi. Den 29 år gamle østerrikeren fra Niederösterreich rangerer på 23.-plass på slalåmverdenscuplisten og er den fjerde beste østerrikske utøveren i disiplinen, bak Truppe, Liensberger og Huber. Frafallet svekker det østerrikske slalåmlaget foran sesongåpningen i Levi 14. november.","url":"https://www.skinews.ch/news/2026/ausfall-slalom-oesterreicherinnen/","pub_date":"2026-10-28T12:26:31.000Z","fetched_at":"2026-10-28 12:30:04","lang_orig":"de","category":null,"athletes":"Katharina Gallhuber,Katharina Liensberger","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":75436,"source_name":"Neveitalia","country":"ITA","title_no":"Østerrike i krise før Levi og Gurgl: Gallhuber må operere kneet","title_orig":"Austria in emergenza per Levi e Gurgl: artroscopia al ginocchio sinistro, si ferma anche Katharina Gallhuber","summary_no":"Katharina Gallhuber er den siste som melder forfall for Østerrike, etter en artroskopi på venstre kne før rennene i Levi og Gurgl.","spik_no":"Katharina Gallhuber må operere venstre kne og rekker dermed ikke sesongåpningene i Levi (14. november) og Gurgl, noe som forverrer en allerede krisepregete situasjon for det østerrikske kvinnelandslaget. Liensberger er fortsatt ikke klar etter ni måneder på sidelinjen, og Lisa Hörhager skadet ankelen under treningsleiren i Ushuaia. Gallhuber, som tok OL-bronse i slalåm i Beijing 2022, har tidligere slitt mye med skader. Hun håper selv å kunne returnere til konkurranser allerede 22. desember i nattslalåmen i Courchevel.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/austria-in-emergenza-per-levi-e-gurgl-artroscopia-al-ginocchio-sinistro-si-ferma-anche-katharina-gallhuber","pub_date":"2026-10-28T11:35:00.000Z","fetched_at":"2026-10-28 11:45:02","lang_orig":"it","category":null,"athletes":"Katharina Gallhuber,Katharina Liensberger","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":74953,"source_name":"Neveitalia","country":"ITA","title_no":"Pinheiro Braathen fortsetter treningen i Sölden før avreise til Levi","title_orig":"Prima di volare a Levi, ecco Pinheiro Braathen proseguire a Soelden con il training: \"La coppa generale? Conterà ogni punto\"","summary_no":"Pinheiro Braathen holder frem med treningen i Sölden før han flyr til Levi. Han understreker at hvert poeng vil telle i kampen om sammenlagtcupen.","spik_no":"Lucas Pinheiro Braathen fortsetter treningen på Rettenbach-breen i Sölden etter søndagens seier i sesongåpningens storslalåm, og forbereder seg til verdenscupslalåmen i Levi 15. november. 26-åringen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant nettopp den samme Levi-rennet for ett år siden – sin første seier i det han selv kaller sin «andre karriere». Braathen er tydelig på at hvert poeng vil telle i jakten på den store krystallkula, der hans fremste rival er Marco Odermatt. Seieren i Sölden er et sterkt signal om at den tidligere norske juniortalenten er klar for å utfordre sveitseren om sammenlagtseieren.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/prima-di-volare-a-levi-ecco-pinheiro-braathen-proseguire-a-soelden-con-il-training-la-coppa-generale-contera-ogni-punto","pub_date":"2026-10-28T10:55:00.000Z","fetched_at":"2026-10-28 11:00:01","lang_orig":"it","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":71625,"source_name":"Ski Racing","country":"INT","title_no":"Beaver Creek innfører automatisert snøproduksjon til verdenscupen","title_orig":"Beaver Creek Adds Automated Snowmaking for Stifel Birds of Prey FIS Ski World Cup","summary_no":"Beaver Creek har installert automatisert snøproduksjon for å sikre ideelle forhold under Stifel Birds of Prey FIS alpint verdenscup.","spik_no":"Beaver Creek har installert 16 automatiserte snøkanoner på den nedre tredjedelen av Birds of Prey-løypen for å sikre stabile forhold under verdenscupen 3.–13. desember. Bakgrunnen er at varmt vær i desember i fjor skapte problemer med snøproduksjonen, noe som tvang arrangørene til å endre start og mål og stryke ett utfor. Det nye systemet består av ti SMI Grizzly-kanoner og seks SMI Super Puma-vigsler, og er designet for å bruke mindre energi og vann enn tradisjonelt utstyr. Vail Valley Foundation, som organiserer rennet, peker på at den nedre løypeseksjonen er særlig sårbar for temperaturinversjoner tidlig i sesongen.","url":"https://skiracing.com/beaver-creek-stifel-birds-of-prey-snowmaking/","pub_date":"2026-10-27T20:02:36.000Z","fetched_at":"2026-10-27 20:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":71317,"source_name":"Neveitalia","country":"ITA","title_no":"Italia forbereder seg til Levi med samling i Val Senales","title_orig":"Levi si prepara in Val Senales: tutte le slalomiste azzurre di CdM in raduno, da Trocker a Peterlini","summary_no":"Alle italienske slalomkvinner på verdenscupnivå, fra Trocker til Peterlini, er samlet i Val Senales for å forberede seg til Levi.","spik_no":"Det italienske slalomlandslaget for kvinner samles på breen i Val Senales fra 28. til 30. oktober for å forberede seg til sesongåpningen i Levi 14. november. Alle åtte utøverne på verdenscupnivå er med i samlingen, ledet av trener Luca Agazzi og teknisk direktør Gianluca Rulfi. Blant deltakerne er Anna Trocker, som nettopp gjennomførte sin første sesongåpning i Sölden, samt Martina Peterlini og Marta Rossetti. Etter Levi venter også slalomrenn i Gurgl 21. november og Killington 29. november.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/levi-si-prepara-in-val-senales-tutte-le-slalomiste-azzurre-di-cdm-in-raduno-da-trocker-a-peterlini","pub_date":"2026-10-27T19:35:00.000Z","fetched_at":"2026-10-27 19:45:01","lang_orig":"it","category":null,"athletes":"Martina Peterlini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":67400,"source_name":"Neveitalia","country":"ITA","title_no":"Italienske utforkjørere trener på Stelvio – Goggia i Sölden før avreise til Copper","title_orig":"Sotto il sole dello Stelvio le velociste azzurre. Poi con Goggia (che si allena a Soelden) si vola a Copper","summary_no":"De italienske fartskvinnene trener under solen på Stelvio, mens Goggia forbereder seg i Sölden før videre til Copper Mountain.","spik_no":"De italienske fartskvinnene er samlet på Stelvio-breen for treningsdager i godt vær, etter at et planlagt samling uken før måtte avlyses. Utøvere som Elena Curtoni, Roberta Melesi, Nadia og Nicol Delago, Sara Allemand, Teresa Runggaldier og Sara Thaler er i gang under coach Feltrin, med blikket rettet mot sesongåpningen i Beaver Creek 11.–13. desember. Sofia Goggia trener separat på Sölden-breen i Østerrike før hele gruppen reiser til Copper Mountain i USA for videre forberedelser. Italia er en av de sterkeste fartsnasjoner på dameside, med Goggia som en av verdens beste utforkjørere gjennom flere år.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sotto-il-sole-dello-stelvio-le-velociste-azzurre-poi-con-goggia-che-si-allena-a-soelden-si-vola-a-copper","pub_date":"2026-10-27T10:00:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":67402,"source_name":"Neveitalia","country":"ITA","title_no":"Vlhovas comeback nesten utelukkende positivt – ser frem til Levi","title_orig":"Quasi solo note positive per il ritorno di Vlhova in coppa. E ora la \"sua\" Levi: \"Sono competitiva, non vedo l'ora della prossima\"","summary_no":"Petra Vlhovas retur til verdenscupen ble godt mottatt, og slovaken gleder seg til neste renn i Levi.","spik_no":"Petra Vlhova er tilbake i verdenscupen etter en lang og krevende rehabilitering følge av en alvorlig kneskade hun pådro seg under VM i Cortina i februar 2023, der hun rev over korsbåndet. Comebacket ble tatt svært godt imot av omgivelsene, og slovaken ser selv frem til neste renn i finske Levi, der slalåm tradisjonelt er første disiplin på damekalenderen. Vlhova er en av de mest vinnende slalåmkjørerne i verdenscuphistorien og var den totale verdenscupvinneren i sesongen 2021/22.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/quasi-solo-note-positive-per-il-ritorno-di-vlhova-in-coppa-e-ora-la-sua-levi-sono-competitiva-non-vedo-l-ora-della-prossima","pub_date":"2026-10-27T08:30:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":67378
