mary_no":"Paula Moltzan tok sin første verdenscupseier da hun triumferte i storslalåmen i Sölden.","spik_no":"Paula Moltzan tok sin første verdenscupseier i storslalåmen i Sölden 24. oktober 2026, 32 år gammel og i sitt 149. individuelle verdenscuprenn. Amerikaneren klatret fra femteplass til seier i andre omgang og vant med én hundredel foran Lara Colturi, som representerer Albania. Emma Aicher tok en sterk tredjeplass for Tyskland, mens østerrikske Franziska Gritsch var beste hjemmeløper på niendeplass. Mikaela Shiffrin, som ledet etter første omgang, endte på syvendeplass etter en forsiktig annen kjøring.","url":"https://sport.orf.at/stories/3163991/","pub_date":"2026-10-24T12:46:16.000Z","fetched_at":"2026-10-24 13:00:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Julia Scheib,Lara Colturi,Paula Moltzan","athlete_nations":["ALB","AUT","GER","USA"],"also_sources":[],"norwegian":false},{"id":61432,"source_name":"SkinEWS","country":"SUI","title_no":"Paula Moltzan sikrer første seier – for seg selv og VanDeer","title_orig":"Paula Moltzan beschert VanDeer und sich den ersten Sieg","summary_no":"Paula Moltzan tok sin første verdenscupseier og ga samtidig utstyrsleverandøren VanDeer sin første triumf i alpint.","spik_no":"Paula Moltzan tok sin første verdenscupseier i storslalom i Sölden, i sitt 149. verdenscuprenn. 32-åringen fra USA hadde stått på pallen fem ganger tidligere i storslalom uten å vinne, men i sesongåpningen 2026/27 gikk det endelig veien. Seieren var også historisk for utstyrsleverandøren VanDeer, som fikk sin første triumf i verdenscupen på damesiden. Moltzan har vært en stabil bidragsyter på det amerikanske alpinlandslaget i en årrekke, men regnes likevel som en overraskende vinner i Sölden.","url":"https://www.skinews.ch/news/2026/moltzan-beschert-vandeer/","pub_date":"2026-10-24T12:31:26.000Z","fetched_at":"2026-10-24 12:45:04","lang_orig":"de","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":61476,"source_name":"SVT Sport","country":"SWE","title_no":"Regjerende mester Julia Scheib krasjet ut i premiären","title_orig":"Regerande mästaren Julia Scheib kraschade direkt i premiären","summary_no":"Julia Scheib, som er regjerende mester, røk ut allerede i åpningsrennet og fikk en skuffende sesongstart.","spik_no":"Regjerende storslalommester Julia Scheib røk ut i første omgang av sesongåpningen i Sölden, på hjemmebane i Østerrike. 28-åringen hadde en formidabel sesong i fjor, med fem verdenscupseirer i storslalom – inkludert premiéren nettopp i Sölden – og sammenlagtseier i storslalomcupen. Krasjen kom halvveis ned bakken og så voldsom ut, men Scheib gikk selv gjennom målområdet og smilte i etterkant. Rennet ble vunnet av amerikanske Paula Moltzan.","url":"https://www.svt.se/sport/alpint/regerande-mastaren-julia-scheib-kraschade-direkt-i-premiaren","pub_date":"2026-10-24T12:29:02.000Z","fetched_at":"2026-10-24 12:45:04","lang_orig":"sv","category":null,"athletes":"Julia Scheib","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":61349,"source_name":"ORF Sport","country":"AUT","title_no":"Amerikanske Moltzan vinner storslalåm i Sölden","title_orig":"US-Amerikanerin Moltzan gewinnt Sölden-RTL","summary_no":"Paula Moltzan fra USA tok seieren i verdenscupåpningens storslalåm i Sölden.","spik_no":"Paula Moltzan fra USA vant overraskende sesongåpningens storslalåm i Sölden lørdag – hennes første seier i verdenscupen. 32-åringen klatret fra femteplass etter første omgang og slo Lara Colturi (Albania) og Emma Aicher (Tyskland) med bare ett hundredels sekund. For Østerrike ble det en skuffelse: titelforsvarer Julia Scheib styrtet i første omgang, og eneste østerrikske finalist Franziska Gritsch endte på tiendeplass.","url":"https://sport.orf.at/stories/3164000/","pub_date":"2026-10-24T12:28:14.000Z","fetched_at":"2026-10-24 12:30:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Lara Colturi,Paula Moltzan","athlete_nations":["ALB","GER","USA"],"also_sources":[],"norwegian":false},{"id":61304,"source_name":"Neveitalia","country":"ITA","title_no":"Moltzan vinner første storslalåm med ett hundredels sekunds margin over Colturi – Zenere femte","title_orig":"Che ribaltone sul Rettenbach, il primo gigante di coppa è di Moltzan per un centesimo su Colturi! Una gran Zenere è quinta","summary_no":"Det ble en dramatisk snuoperasjon på Rettenbach-breen, der Paula Moltzan vant sesongåpningens storslalåm med ett hundredels sekund foran Colturi. Zenere imponerte med en femteplass.","spik_no":"Paula Moltzan sikret sitt første verdenscupseier i sesongåpningens storslalåm på Rettenbach-breen i Sölden, kun ett hundredels sekund foran Lara Colturi fra Albania. Den 32 år gamle amerikaneren, kjent som en solid slalåmkjører, vant med nytt utstyr etter samarbeid med Van Deer. Italienske Federica Zenere imponerte med en femteplass, mens storstjernen Mikaela Shiffrin endte på syvende plass etter et skiftende vær under rennet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/che-ribaltone-sul-rettenbach-il-primo-gigante-di-coppa-e-di-moltzan-per-un-centesimo-su-colturi-una-gran-zenere-e-quinta","pub_date":"2026-10-24T12:25:00.000Z","fetched_at":"2026-10-24 12:30:01","lang_orig":"it","category":null,"athletes":"Lara Colturi,Mikaela Shiffrin,Paula Moltzan","athlete_nations":["ALB","USA"],"also_sources":[],"norwegian":false},{"id":60855,"source_name":"Neveitalia","country":"ITA","title_no":"Valérie Grenier operert på høyre kne i Montréal – korsbånd og menisk skadet","title_orig":"Per Valérie Grenier è tutto svanito: operata a Montréal al ginocchio destro, lesionati crociato e menisco","summary_no":"Canadiske Valérie Grenier har gjennomgått en operasjon på høyre kne i Montréal etter å ha pådratt seg skader på både korsbåndet og menisken.","spik_no":"Canadiske Valérie Grenier er operert på høyre kne i Montréal etter å ha skadet både korsbåndet og menisken under trening på Rettenbach-glacieret i Sölden – samme sted der sesongen skulle ha åpnet. Skaden betyr at sesongen 2026/27 er over før den i det hele tatt begynte, med en forventet rehabiliteringsperiode på minimum seks til syv måneder. Det er et særlig bittert tilbakeslag for Grenier, som nettopp hadde vendt tilbake til seierspallen med seier i storslalåm under finalehelgen i 2026. Den allsidige 28-åringen hadde nylig også fått inn den erfarne treneren Mauro Pini – kjent for arbeidet med Tina Maze og Petra Vlhová – i støtteapparatet sitt.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/per-valerie-grenier-e-tutto-svanito-operata-a-montreal-al-ginocchio-destro-lesionati-crociato-e-menisco","pub_date":"2026-10-24T11:25:00.000Z","fetched_at":"2026-10-24 11:30:02","lang_orig":"it","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":60629,"source_name":"Neveitalia","country":"ITA","title_no":"Della Mea første italiener i startgropa i 2. omgang, deretter Pazzaglia og Zenere: ny start kl. 13.30 på Rettenbach","title_orig":"Della Mea prima azzurra al cancelletto nella 2^ manche, poi Pazzaglia e Zenere: alle 13.30 si riparte sul Rettenbach e Shiffrin...","summary_no":"Della Mea er første italienske utøver i startgropa i den andre omgangen, etterfulgt av Pazzaglia og Zenere. Rennet fortsetter på Rettenbach-løypa klokken 13.30, der også Shiffrin stiller til start.","spik_no":"Verdenscupsesongen i alpint åpnes med storslalåm for kvinner på Rettenbach-løypa i Sölden, der Mikaela Shiffrin leder etter første omgang med 14 hundredeler ned til svenske Sara Hector og 37 til sveitsiske Camille Rast. Shiffrin har ikke vunnet en storslalåm på nesten tre år – sist var hun nær seier i Killington i november 2024, da hun falt få porter fra mål. Amerikaneren har vunnet i Sölden tidligere, i 2014 og 2021, og jager sin 111. verdenscupseier. For Italia stiller Della Mea, Pazzaglia og Zenere i andre omgang, med ambisjoner om topp ti.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/della-mea-prima-azzurra-al-cancelletto-nella-2-manche-poi-pazzaglia-e-zenere-alle-1330-si-riparte-sul-rettenbach-e-shiffrin","pub_date":"2026-10-24T10:55:00.000Z","fetched_at":"2026-10-24 11:00:01","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":60497,"source_name":"Ski Racing","country":"INT","title_no":"Shiffrin satte farten i Sölden – titelforsvarer Scheib krasjet ut","title_orig":"Shiffrin Sets the Pace in Sölden as Defending Champion Scheib Crashes Out","summary_no":"Mikaela Shiffrin var raskest i Sölden, mens den forsvarende mesteren Scheib røk ut etter en smell.","spik_no":"Mikaela Shiffrin var raskest etter første omgang i sesongåpningen i Sölden, med tiden 1:07.27 – 0,14 sekunder foran svenske Sara Hector og 0,37 foran Camille Rast. Den forsvarende mesteren Scheib røk ut etter en krasj og tok ikke del i finaleomgangen. Shiffrin, som har vunnet Sölden-rennet en rekke ganger gjennom karrieren og nærmer seg 100 verdenscupseirer, leverte et teknisk sterkt løp med god fart gjennom de krevende partiene i det nedre flate feltet. Løpet ble forsinket av snø, og vinden skapte utfordringer i øvre del av løypen på Rettenbachgletsjeren.","url":"https://skiracing.com/shiffrin-sets-the-pace-in-solden-as-defending-champion-scheib-crashes-out/","pub_date":"2026-10-24T10:30:55.000Z","fetched_at":"2026-10-24 10:45:01","lang_orig":"en","category":null,"athletes":"Camille Rast,Julia Scheib,Mikaela Shiffrin,Sara Hector","athlete_nations":["AUT","SUI","SWE","USA"],"also_sources":[],"norwegian":false},{"id":60403,"source_name":"Neveitalia","country":"ITA","title_no":"Italia-gigantene sliter i Sölden – Zenere, Pazzaglia og Della Mea inne","title_orig":"L'Italgigante fatica a Soelden, dentro Zenere (\"ero tesa, ho margine\"), Pazzaglia e Della Mea. Bassino: \"Ho bisogno di passaggi\"","summary_no":"Det italienske alpinlandslaget hadde en tøff dag i Sölden. Zenere innrømmer hun var nervøs, mens Bassino sier hun trenger flere treningspassasjer.","spik_no":"Det italienske alpinlandslaget fikk en tøff åpning på verdenscupsesongen i Sölden, der bare tre av elleve sendte utøvere kvalifiserte seg til andre omgang i storslalåm på Rettenbach-breen. Giovanna Zenere innrømte at hun var nervøs, men mener hun har mer å gå på, mens Marta Bassino – som er tilbake etter et alvorlig kneskade i fjor – sier hun trenger flere treningspassasjer for å finne formen. Italia stilte uten sine to største profiler, Federica Brignone og Sofia Goggia, noe som økte presset på de øvrige løperne fra start.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/l-italgigante-fatica-a-soelden-dentro-zenere-ero-tesa-ho-margine-pazzaglia-e-della-mea-bassino-ho-bisogno-di-passaggi","pub_date":"2026-10-24T10:20:00.000Z","fetched_at":"2026-10-24 10:30:01","lang_orig":"it","category":null,"athletes":"Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":60129,"source_name":"SVT Sport","country":"SWE","title_no":"Sara Hector i toppposisjon etter åpningen – tett bak Shiffrin","title_orig":"Slagläge för Sara Hector i premiären – tätt bakom Shiffrin","summary_no":"Sara Hector er i en sterk posisjon etter premiären og ligger tett bak Mikaela Shiffrin i konkurransen.","spik_no":"Sara Hector kjørte seg inn på andreplass etter første omgang i storslalomåpningen i Sölden, bare 14 hundredeler bak Mikaela Shiffrin. Den 34 år gamle svenske veteranen har vært en fast gjest i toppen av storslalomcupen og har endt på tredjeplass sammenlagt tre sesonger på rad. Hector har vunnet flere verdenscuprenn i storslalom og var VM-gull-vinner i samme disiplin i Cortina 2021. Også Estelle Alphand imponerte med en sjuendeplass etter første omgang, noe som gir Sverige sterke kort foran annen omgang.","url":"https://www.svt.se/sport/alpint/slaglage-for-sara-hector-i-premiaren-tatt-bakom-shiffrin","pub_date":"2026-10-24T09:37:39.000Z","fetched_at":"2026-10-24 09:45:04","lang_orig":"sv","category":null,"athletes":"Mikaela Shiffrin,Sara Hector","athlete_nations":["SWE","USA"],"also_sources":[],"norwegian":false},{"id":59996,"source_name":"VG","country":"NOR","title_no":"Shiffrin leder verdenscupåpningen – de norske jakter topp ti-plassering","title_orig":"Shiffrin leder verdenscupåpningen – de norske jakter topp ti-plassering","summary_no":"","spik_no":"Mikaela Shiffrin leder verdenscupåpningen i Sölden med 14 hundredeler ned til svenske Sara Hector, mens de norske kvinnene Mina Fürst Holtmann og Thea Stjernesund kjemper om topp ti-plassering etter første omgang. Holtmann ligger på 8.-plass, 1,17 sekunder bak Shiffrin, mens Stjernesund er på 10.-plass med 1,12 sekunder opp til toppen. Begge nordkvinnene tok pallplasser i storslalåm forrige sesong — Stjernesund med tredjeplass i Copper Mountain og Holtmann med andreplass på Hafjell. Titelforsvarer Julia Scheib kjørte ut i første omgang.","url":"https://www.vg.no/sport/i/4O4mPR/shiffrin-leder-verdenscupaapningen-de-norske-jakter-topp-ti-plassering","pub_date":"2026-10-24T09:26:17.000Z","fetched_at":"2026-10-24 09:30:03","lang_orig":"no","category":null,"athletes":"Mikaela Shiffrin,Mina Fürst Holtmann,Thea Louise Stjernesund","athlete_nations":["NOR","USA"],"also_sources":[],"norwegian":true},{"id":60006,"source_name":"ORF Sport","country":"AUT","title_no":"Scheib-fall skapte skrekksekunder","title_orig":"Scheib-Sturz sorgt für Schrecksekunde","summary_no":"Et dramatisk fall av Scheib skapte stor bekymring under rennet og ga publikum et hjertestopp.","spik_no":"Julia Scheib skapte skrekksekunder i Sölden da hun falt dramatisk i bratthenget under første omgang og slo hardt i bakken. Østerrikeren, som vant storslalåmcupen sammenlagt forrige sesong og tok sin første verdenscupseier nettopp i Sölden i 2025, virket i første omgang uskadd og klarte å kjøre ned til mål selv. I et intervju bekreftet hun at hun kjente på kneet, men kunne utelukke korsbåndskade — noe hun har gjennomgått to ganger tidligere i karrieren. Ulykken åpnet veien for konkurrentene, og Mikaela Shiffrin utnyttet sjansen best.","url":"https://sport.orf.at/stories/3163985/","pub_date":"2026-10-24T09:25:33.000Z","fetched_at":"2026-10-24 09:30:03","lang_orig":"de","category":null,"athletes":"Julia Scheib,Mikaela Shiffrin","athlete_nations":["AUT","USA"],"also_sources":[],"norwegian":false},{"id":59961,"source_name":"Neveitalia","country":"ITA","title_no":"Shiffrin-majestet på Rettenbach: Raskest i 1. omgang foran Hector – Scheib skadet seg","title_orig":"Et voilà, sua maestà Mikaela sul Rettenbach: 1^ manche dell'opening firmata da Shiffrin su Hector, paura per Scheib","summary_no":"Mikaela Shiffrin satte raskeste tid i første omgang av sesongåpningen på Rettenbachferner, foran Hector. Scheib pådro seg en skade etter et dramatisk fall.","spik_no":"Mikaela Shiffrin satte raskeste tid i første omgang av sesongåpningen på Rettenbachbreen i Sölden, 14 hundredeler foran svenske Sara Hector, med Camille Rast på tredjeplass. Shiffrin jakter sin tredje strake seier i Sölden-åpningen, noe som historisk sett kun Tina Maze har klart. Titelforsvarer Julia Scheib hadde beste mellomtid da hun falt dramatisk på murfallet, slo hardt i bakken og skadet kneet, men kunne selv kjøre ned til mål og utelukket korsbåndskade. Andre omgang starter klokken 13.30.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/et-voila-sua-maesta-mikaela-sul-rettenbach-1-manche-dell-opening-firmata-da-shiffrin-su-hector-paura-per-scheib","pub_date":"2026-10-24T09:25:00.000Z","fetched_at":"2026-10-24 09:30:01","lang_orig":"it","category":null,"athletes":"Julia Scheib,Mikaela Shiffrin","athlete_nations":["AUT","USA"],"also_sources":[],"norwegian":false},{"id":59976,"source_name":"SkinEWS","country":"SUI","title_no":"Shiffrin gjør «Shiffrin-ting» og leder i Sölden","title_orig":"Shiffrin macht „Shiffrin-Sachen“ und führt in Sölden","summary_no":"Mikaela Shiffrin leverte en imponerende prestasjon i Sölden og leder etter første omgang i sesongåpningen.","spik_no":"Mikaela Shiffrin leder etter første omgang i sesongåpningen i Sölden, og gjør det hun er kjent for — leverer når det gjelder. Den amerikanske superstjernen har dominert alpinsporten i over et tiår og er den mestvinnende utøveren i verdenscuphistorien med over 90 seirer. Titelforsvarer Julia Scheib, som vant Sölden i fjor og tok storslalåmcupen sammenlagt, kjørte ut dramatisk midt i første omgang og ødela det østerrikske hjemmehåpet. Camille Rast ligger på tredjeplass ved halvgått løp.","url":"https://www.skinews.ch/news/2026/shiffrin-sachen-soelden/","pub_date":"2026-10-24T09:22:35.000Z","fetched_at":"2026-10-24 09:30:03","lang_orig":"de","category":null,"athletes":"Julia Scheib,Mikaela Shiffrin","athlete_nations":["AUT","USA"],"also_sources":[],"norwegian":false},{"id":60379,"source_name":"Sportschau","country":"GER","title_no":"Første omgang i storslalåm i vintersesongen 2026/27","title_orig":"Der erste Lauf im Riesenslalom der Wintersaison 2026/27","summary_no":"Den første omgangen i storslalåm er gjennomført i vintersesongen 2026/27.","spik_no":"Mikaela Shiffrin er raskest etter første omgang i sesongåpningens storslalåm i Sölden, foran Sara Hector og Camille Rast. Sölden har tradisjonelt vært stedet der verdenscupen i alpint åpner sesongen hvert år i slutten av oktober, og Shiffrin har en imponerende merittliste her. Den amerikanske stjernen er tidenes mestvinnenede alpinist med over 100 verdenscupseire, og en sterk første omgang i Sölden er et godt tegn foran resten av sesongen 2026/27.","url":"https://www.sportschau.de/wintersport/der-erste-lauf-im-riesenslalom-der-wintersaison-2026-27,riesenslalom-lauf-1-soelden-100.html","pub_date":"2026-10-24T09:21:38.000Z","fetched_at":"2026-10-24 10:15:04","lang_orig":"de","category":null,"athletes":"Camille Rast,Mikaela Shiffrin,Sara Hector","athlete_nations":["SUI","SWE","USA"],"also_sources":[],"norwegian":false},{"id":59459,"source_name":"ORF Sport","country":"AUT","title_no":"Rennkalenderen skaper igjen debatt","title_orig":"Rennkalender sorgt erneut für Diskussionen","summary_no":"Alpinski-rennkalenderen er nok en gang gjenstand for diskusjon blant utøvere og organisasjoner.","spik_no":"Verdenscupkalenderen for alpint 2026/27 inneholder 40 renn for kvinner og 43 for menn, men balansen mellom fart- og teknikkøvelser er igjen skjev – særlig for kvinner, der teknikkrenn dominerer klart. Østerrike er største vertsland med 15 verdenscupavdelinger, inkludert en ny stopp i Dachstein West/Gosau. Østerriksk dametrener Johannes Zöchling peker på at logistikk og mange motstridende interesser gjør kalenderarbeidet svært krevende, og beklager at det ikke er fartshjemerenn for østerrikske kvinner denne vinteren.","url":"https://sport.orf.at/stories/3163844/","pub_date":"2026-10-24T07:43:47.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":59460,"source_name":"ORF Sport","country":"AUT","title_no":"Pertl avslutter sesongen på ellevteplass","title_orig":"Pertl schließt Saison mit Platz elf ab","summary_no":"Stefan Pertl rundet av sesongen med en ellevteplass i sitt siste renn.","spik_no":"Denne saken handler ikke om alpint, men om triatlet Lukas Pertl, som avsluttet sin sesong med en ellevteplass i et verdenscuprenn i Tongyeong i Sør-Korea. Sprintdistansen ble gjennomført i kraftig regn, og seieren gikk til spanjolen Alberto Gonzalez Garcia. Saken er ikke relevant for NRK Sport alpint.","url":"https://sport.orf.at/stories/3163982/","pub_date":"2026-10-24T07:11:48.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":59414,"source_name":"Neveitalia","country":"ITA","title_no":"Dame-storslalåm på Rettenbach: 30 minutters forsinkelse, men gode forhold","title_orig":"Signore e signori, è il giorno del gigante donne sul Rettenbach: start con 30 minuti di ritardo, ma le condizioni sono buone","summary_no":"Dame-storslalåmen på Rettenbachbreen i Sölden starter 30 minutter forsinket, men forholdene beskrives som gode.","spik_no":"Dame-storslalåmen på Rettenbachbreen i Sölden innleder den 61. utgaven av alpint verdenscup, og første omgang er utsatt 30 minutter til kl. 10.30 etter nattens snøfall på rundt ti centimeter. Forholdene beskrives som relativt gode, men vind kan bli en utfordring utover dagen. Mikaela Shiffrin er blant dem som starter tidlig i feltet, mens Marta Bassino er tilbake etter et år utenfor sirkuset – hun uttalte etter besiktigelsen at hun gleder seg, men erkjenner at hun har skiet lite på bratt terreng.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/signore-e-signori-e-il-giorno-del-gigante-donne-sul-rettenbach-start-con-30-minuti-di-ritardo-ma-le-condizioni-sono-buone","pub_date":"2026-10-24T06:15:00.000Z","fetched_at":"2026-10-24 08:24:36","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":59429,"source_name":"SkinEWS","country":"SUI","title_no":"Forsinkelse i Sölden – nye starttider kl. 10.30/13.30","title_orig":"Verzögerung in Sölden – neue Startzeiten heute um 10.30/13.30 Uhr","summary_no":"Rennet i Sölden er forsinket, og nye starttider er satt til henholdsvis kl. 10.30 og 13.30.","spik_no":"Dame-storslalåmen i Sölden er forsinket på grunn av snøfall natten til lørdag og pågående arbeid på løypa, og starter nå kl. 10.30 i stedet for opprinnelige kl. 10.00. Andreetappen er tilsvarende flyttet til kl. 13.30. Sölden er tradisjonelt åpningsarena for verdenscupsesongen og arrangerer som regel de første rennene på Rettenbachbreen i slutten av oktober hvert år.","url":"https://www.skinews.ch/news/2026/verzoegerung-soelden-startzeiten/","pub_date":"2026-10-24T06:11:53.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":59464,"source_name":"ORF Sport","country":"AUT","title_no":"Dame-storslalåm i Sölden utsatt til kl. 10.30","title_orig":"Damen-RTL in Sölden auf 10.30 Uhr verschoben","summary_no":"Dame-storslalåmen i Sölden er blitt utsatt og starter nå kl. 10.30 i stedet for opprinnelig planlagt tid.","spik_no":"Dame-storslalåmen i Sölden er forsinket med 30 minutter, og første omgang starter nå kl. 10.30 etter at arbeid på løypa og nattens snøfall krevde ekstra tid – også besiktigelsen for utøverne ble skjøvet en halvtime. Sölden på Rettenbachbreen er den tradisjonelle åpningsarenaen for verdenscupsesongen, og åpner nå det som er en VM-vinter. Rennet sendes direkte på ORF1 fra kl. 10.00.","url":"https://sport.orf.at/stories/3163976/","pub_date":"2026-10-24T06:08:51.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":55646,"source_name":"SkinEWS","country":"SUI","title_no":"Alice Robinson åpner verdenscupsesongen 2026/27 lørdag klokken 10","title_orig":"Alice Robinson eröffnet am Samstag um 10 Uhr die Weltcup-Saison 2026/27","summary_no":"Alice Robinson innleder verdenscupsesongen 2026/27 med start lørdag morgen klokken 10.","spik_no":"Newzealandske Alice Robinson åpner verdenscupsesongen 2026/27 med startnummer én i riesenslalåmen i Sölden lørdag klokken 10. Robinson, som er 24 år gammel, er en av de fremste storslalåmkjørerne i verden og vant sin første verdenscupseier allerede som 17-åring i nettopp Sölden i 2019. Hun har siden befestet seg i verdenseliten i storslalåm og representerer et av alpintsportens minste nasjoner på høyeste nivå.","url":"https://www.skinews.ch/news/2026/robinson-eroeffnet-samstag/","pub_date":"2026-10-23T18:14:40.000Z","fetched_at":"2026-10-23 21:00:04","lang_orig":"de","category":null,"athletes":"Alice Robinson","athlete_nations":["NZL"],"also_sources":[],"norwegian":false},{"id":55611,"source_name":"Ski Racing","country":"INT","title_no":"Sölden kvinner stor slalåm 2026: Startliste, resultater og TV-tider","title_orig":"Sölden Women’s GS 2026: Start List, Rankings, Times & How to Watch","summary_no":"Alt du trenger å vite om kvinnenes gigantslalåm i Sölden 2026, inkludert startliste, rangeringer, tider og hvordan du kan følge rennet.","spik_no":"Lørdag 25. oktober åpner den nye verdenscupsesongen med kvinnenes gigantslalåm på Rettenbach-breen i Sölden, der 67 løpere fra 19 nasjoner er påmeldt. Forsvarende vinner og regjerende gigantslalåmvinner Julia Scheib er toppfavoritt – østerrikeren tok fem GS-seiere forrige sesong og vant sin første krystallkule i grenen. Blant de store navnene som stiller er Mikaela Shiffrin og Paula Moltzan for USA, samt Petra Vlhová som gjør comeback i verdenscupen etter lang tids fravær. De siste tre Sölden-vinnerne har alle gått videre til å vinne GS-kulen sammenlagt, noe som gir åpningsrennet ekstra historisk tyngde.","url":"https://skiracing.com/solden-womens-gs-2026-start-list-how-to-watch/","pub_date":"2026-10-23T18:05:25.000Z","fetched_at":"2026-10-23 21:00:01","lang_orig":"en","category":null,"athletes":"Mikaela Shiffrin,Petra Vlhová","athlete_nations":["SVK","USA"],"also_sources":[],"norwegian":false},{"id":55631,"source_name":"Neveitalia","country":"ITA","title_no":"Alice Robinson åpner verdenscupen i Sölden – 11 italienske utøvere på startlisten","title_orig":"Sarà Alice Robinson ad aprire la Coppa del Mondo, poi Scheib nell'arena di Soelden: 11 azzurre al via","summary_no":"Alice Robinson får startnummer én i Sölden, med Scheib like bak. Hele 11 italienske alpinister er klare for sesongåpningen i riesenslalåm.","spik_no":"Alice Robinson åpner den 61. sesongen av verdenscupen med startnummer én i riesenslalåmen på Rettenbach-breen i Sölden lørdag. Julia Scheib, fjorårets vinner av sesongåpningen i Sölden, starter som nummer to og er blant favorittene. Italia stiller med hele 11 alpinister, men uten de to store stjernene Federica Brignone og Sofia Goggia, mens Mikaela Shiffrin starter med nummer fem.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sara-alice-robinson-ad-aprire-la-coppa-del-mondo-poi-scheib-nell-arena-di-soelden-11-azzurre-al-via","pub_date":"2026-10-23T17:15:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":"Alice Robinson","athlete_nations":["NZL"],"also_sources":[],"norwegian":false},{"id":55687,"source_name":"ORF Sport","country":"AUT","title_no":"Kilde innstilt etter ny skade","title_orig":"Kilde nach erneuter Verletzung kämpferisch","summary_no":"Aleksander Aamodt Kilde viser kampvilje etter å ha blitt rammet av enda en skade.","spik_no":"Aleksander Aamodt Kilde sier han ønsker å komme tilbake til verdenscupen etter å ha pådratt seg et akillessenebrudd under utfortrening i Chile i midten av oktober. 34-åringen må vente minst 12–18 uker før han kan trene normalt igjen, og når han kan stå på ski er fortsatt uvisst. Kilde har vært ute av konkurranse siden det dramatiske styrtet i Wengen i januar 2024, og det nye tilbakeslaget gjør en allerede langvarig skadehistorie enda tyngre.","url":"https://sport.orf.at/stories/3163952/","pub_date":"2026-10-23T16:16:04.000Z","fetched_at":"2026-10-23 21:00:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":55632,"source_name":"Neveitalia","country":"ITA","title_no":"Timer igjen til Rettenbach-utfordringen – italienske utøvere klar for start","title_orig":"Poche ore alla sfida del Rettenbach, parola alle azzurre. Bassino al rientro: \"Progredisco, ma ho deciso solo in questi giorni di esserci\"","summary_no":"Marta Bassino er tilbake etter skade og avslørte at hun bestemte seg for å stille for bare noen dager siden. De italienske utøverne er klare for riesenslalåmen i Sölden.","spik_no":"Marta Bassino er tilbake i verdenscupen etter over halvannet år skadefravær og avslørte at hun bestemte seg for å stille i Sölden bare noen dager før rennet. Hun starter med startnummer 28 i riesenslalåmen på Rettenbach. Italia stiller uten Federica Brignone og Sofia Goggia, og det er Lucia Della Mea som er landets fremste kort etter å ha vært eneste italiener i topp 15 forrige sesong.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/poche-ore-alla-sfida-del-rettenbach-parola-alle-azzurre-bassino-al-rientro-progredisco-ma-ho-deciso-solo-in-questi-giorni-di-es","pub_date":"2026-10-23T15:35:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":55633,"source_name":"Neveitalia","country":"ITA","title_no":"Pirovano, Shiffrin og Odermatt delte tanker i FIS Race Talk før Sölden","title_orig":"Al \"Race Talk\" della FIS anche Laura Pirovano: \"Che bello partire con il gigante\". Da Shiffrin a Odermatt, tutte le voci","summary_no":"Laura Pirovano og flere av verdens beste alpinister, deriblant Mikaela Shiffrin og Marco Odermatt, uttalte seg i FIS' Race Talk før sesongåpningen i Sölden.","spik_no":"I FIS' tradisjonelle Race Talk kvelden før sesongåpningen i Sölden deltok blant andre Mikaela Shiffrin og Marco Odermatt, som begge er forsvarende innehavere av den store krystallkula. Laura Pirovano representerte Italia og uttrykte glede over å starte sesongen med storslalåm. Også Aline Danioth, Lara Colturi og Eduard Hallberg – som representerer neste generasjon – deltok i samtalen, i tillegg til Henrik Kristoffersen-utfordreren Atle Lie McGrath og Lucas Pinheiro Braathen.","url":"https://www.neveitalia.it/sport/scialpino/news/al-race-talk-della-fis-anche-laura-pirovano-che-bello-partire-con-il-gigante-da-shiffrin-a-odermatt-tutte-le-voci","pub_date":"2026-10-23T14:50:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marco Odermatt,Mikaela Shiffrin","athlete_nations":["ITA","SUI","USA"],"also_sources":[],"norwegian":false},{"id":55635,"source_name":"Neveitalia","country":"ITA","title_no":"Ti italienske storslalåmkjørere trener i Val Senales i fem dager","title_orig":"Da domenica e per cinque giorni lavorano in Val Senales dieci slalomgigantisti azzurri del team Coppa Europa","summary_no":"Fra søndag av samles ti italienske storslalåmkjørere fra Europa Cup-troppen til en femagers treningsleir i Val Senales.","spik_no":"Fra søndag 25. til torsdag 29. oktober samles ti italienske storslalåm- og slalåmkjørere fra Europa Cup-troppen til treningsleir på isbreen i Val Senales i Sør-Tirol. Blant utøverne er Corrado Barbera, Matteo Bendotti og brødrene Enrico og Francesco Zucchini. Parallelt gjennomfører det italienske Europa Cup-landslaget i utfor og super-G et eget treningssamling på samme bre i samme periode.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/da-domenica-e-per-cinque-giorni-lavorano-in-val-senales-dieci-slalomgigantisti-azzurri-del-team-coppa-europa","pub_date":"2026-10-23T13:45:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":55636,"source_name":"Neveitalia","country":"ITA","title_no":"3Tre-rennet letter fra Verona – to måneder til stor natt på Canalone Miramonti","title_orig":"A due mesi dalla grande notte sul Canalone Miramonti, la 3Tre prende il volo dall'aeroporto di Verona","summary_no":"Med to måneder igjen til det store slalåmrennet på Canalone Miramonti tar 3Tre-organisasjonen av fra Verona lufthavn i forberedelsene.","spik_no":"Med to måneder igjen til nattrennet på Canalone Miramonti i Madonna di Campiglio sparket 3Tre-komiteen i gang en promoturné fra Verona lufthavn. Slalåmrennet i Madonna di Campiglio er en av de mest tradisjonsrike og spektakulære arrangementene på verdenscupkalenderen og arrangeres for 73. gang den 23. desember 2026. Rennet er kjent for sin unike stemning under flombelysning og har gjennom tidene tiltrukket seg enorme folkemengder og TV-seere.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/a-due-mesi-dalla-grande-notte-sul-canalone-miramonti-la-3tre-prende-il-volo-dall-aeroporto-di-verona","pub_date":"2026-10-23T12:50:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":55637,"source_name":"Neveitalia","country":"ITA","title_no":"Første snø på Mausefalle – befaring i Kitzbühel for nye innovasjoner","title_orig":"Nelle scorse ore la prima neve anche sulla Mausefalle: sopralluogo a Kitzbuehel per lavorare ad altre innovazioni","summary_no":"De første snøfallene har kommet på den berømte Mausefalle-traseen i Kitzbühel, og arrangørene er i gang med befaring for å utvikle nye løsninger.","spik_no":"De første snøflyene har lagt seg over den øvre delen av Streif-løypen i Kitzbühel, blant annet ved det beryktede Mausefalle-partiet over 1600 meters høyde. Arrangørene av Hahnenkamm-rennet gjennomførte befaring med FIS og ORFs TV-produksjon for å jobbe med nye innovasjoner til den 87. utgaven av rennet, som er planlagt til 22.–24. januar 2027. Hahnenkamm-helgen med super-G, utfor og slalåm regnes som en av de mest prestisjefylte arrangementene i alpinsporten.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/nelle-scorse-ore-la-prima-neve-anche-sulla-mausefalle-sopralluogo-a-kitzbuehel-per-lavorare-ad-altre-innovazioni","pub_date":"2026-10-23T12:10:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":55639,"source_name":"Neveitalia","country":"ITA","title_no":"Endelig Petra: Vlhová er tilbake og klar for comeback","title_orig":"Finalmente Petra, è una vigilia unica per Vlhova: la coppa ritrova una fuoriclasse. \"Uno shock tornare a regime, ma sono felice\"","summary_no":"Petra Vlhová er tilbake i verdenstoppen og beskriver returen som et sjokk, men sier hun er lykkelig over å være tilbake på full fart igjen.","spik_no":"Petra Vlhová er tilbake i verdenscupen for første gang siden hun skadet høyre kne alvorlig i Jasna 20. januar 2024, og stiller til start i riesenslalåmen i Sölden med startnummer 18. Den slovakiske stjernen, som vant den store krystallkula i 2021, beskriver returen som et sjokk, men sier hun er lykkelig over å være tilbake. Hennes tidligere trener Livio Magoni mener hun har tapt tid i karrieren og er overbevist om at hun vil nå toppen igjen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/finalmente-petra-e-una-vigilia-unica-per-vlhova-la-coppa-ritrova-una-fuoriclasse-uno-shock-tornare-a-regime-ma-sono-felice","pub_date":"2026-10-23T10:25:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":55641,"source_name":"Neveitalia","country":"ITA","title_no":"Darbellay uteblir fra Sölden med tommelbrudd – Nord-Amerika i fare","title_orig":"Il motivo dell'assenza di Darbellay a Soelden per una frattura al pollice: lo stop mette a rischio il Nordamerica","summary_no":"Clement Darbellay misser Sölden-åpningen etter et tommelbrudd, og skaden setter hans deltakelse i de nordamerikanske verdenscuprennet i fare.","spik_no":"Sveitsiske Delphine Darbellay, født 2002, går glipp av Sölden-åpningen etter å ha brukket tommelen i en treningskollisjon med en port på Diavolezza. Det er et tungt tilbakeslag for gigantspesialisten fra Valais, som allerede mistet hele fjorårssesongen på grunn av ryggproblemer. Bruddet setter nå også deltakelsen i de nordamerikanske verdenscuprennene i fare, og Darbellay må avvente videre medisinsk vurdering.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/il-motivo-dell-assenza-di-darbellay-a-soelden-per-una-frattura-al-pollice-lo-stop-mette-a-rischio-il-nordamerica","pub_date":"2026-10-23T09:25:00.000Z","fetched_at":"2026-10-23 21:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":55706,"source_name":"SVT Sport","country":"SWE","title_no":"Fabian Ax Swartz om samarbeidet med Hirscher: – Han har støttet meg mye","title_orig":"Fabian Ax Swartz om samarbetet med Hirscher: ”Har stöttat mig en hel del”","summary_no":"Den svenske alpinisten Fabian Ax Swartz forteller om hva samarbeidet med Marcel Hirscher har betydd for ham.","spik_no":"Den 22 år gamle svenske slalomkjøreren Fabian Ax Swartz forteller at Marcel Hirscher har støttet ham mye, og at støtten fra skimerkevaren er avgjørende. Ax Swartz er Sveriges høyest rangerte slalomkjører og konkurrerer for IFK Lidingö slalomklubb. Etter mange år med utkjøringer og tapte andrerunder fant han stabiliteten mot slutten av forrige sesong, da han hentet poeng i åtte av de ni siste tekniske rennene. Nå er han rangert blant de 30 beste i slalåm, og målet for den nye sesongen er å nå pallen.","url":"https://www.svt.se/sport/alpint/fabian-ax-swartz-om-samarbetet-med-hirscher-har-stottat-mig-en-hel-del","pub_date":"2026-10-23T08:38:59.000Z","fetched_at":"2026-10-23 21:00:05","lang_orig":"sv","category":null,"athletes":"Fabian Ax Swartz,Marcel Hirscher","athlete_nations":["NED","SWE"],"also_sources":[],"norwegian":false},{"id":53291,"source_name":"Ski Racing","country":"INT","title_no":"Sue Schwartz tildelt Dee Read minnepris 2026","title_orig":"Sue Schwartz Honored With 2026 Dee Read Memorial Award","summary_no":"Sue Schwartz er hedret med Dee Read minneprisen for 2026.","spik_no":"Sue Schwartz er tildelt Dee Read minneprisen for 2026, en pris som hedrer kanadiske FIS tekniske delegater som har gjort en eksepsjonell innsats for alpinsporten. Schwartz har i løpet av nesten 40 år hatt roller som utøver, trener, administrator, frivillig, internasjonal dommer og World Cup-arrangør, blant annet ved Lake Louise-rennet i Alberta. Prisen ble overrakt 17. oktober under en FIS-oppdateringssamling i Kimberley, British Columbia. Dee Read-prisen er oppkalt etter en pioner i kanadisk alpint og deles ut for å løfte frem dem som bygger sporten nedenfra og opp.","url":"https://skiracing.com/sue-schwartz-honored-with-2026-dee-read-memorial-award/","pub_date":"2026-10-23T00:00:08.000Z","fetched_at":"2026-10-23 00:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":52418,"source_name":"VG","country":"NOR","title_no":"Braathen om livet i Brasil: - Fantastisk","title_orig":"Braathen om livet i Brasil: - Fantastisk","summary_no":"","spik_no":"Lucas Braathen representerer nå Brasil etter at han brøt med det norske skiforbundet i 2023, og har snakket varmt om sitt nye liv med tilknytning til landet der moren hans er fra. Braathen beskriver tilværelsen som «fantastisk», og har bygd en ny identitet rundt sin brasilianske bakgrunn etter det som ble en bitter avskjed med norsk alpint. Han vant slalåmåpningen i Sölden i 2022 under norsk flagg, men har siden funnet ny motivasjon og frihet under det brasilianske.","url":"https://www.vg.no/sport/i/eGLrqy/braathen-om-livet-i-brasil-fantastisk","pub_date":"2026-10-22T22:02:37.000Z","fetched_at":"2026-10-22 22:15:04","lang_orig":"no","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":52131,"source_name":"Ski Racing","country":"INT","title_no":"Alice Robinson tilbake i Sölden med fokus på storslalåm","title_orig":"Alice Robinson Returns to Sölden With Giant Slalom in Focus","summary_no":"Alice Robinson er klar for comeback i Sölden, der hun sikter mot storslalåmrennet.","spik_no":"Alice Robinson er tilbake i Sölden, syv år etter at hun som 17-åring vant verdenscupåpningen på Rettenbachbreen i 2019 — et gjennombrudd som satte alpinverdenen i sjokk. Nyzealanderen, som fyller 25 år i desember, har siden vunnet sju verdenscuprenn og tatt 24 pallplasser, noe som gjør henne til den mest meritterte kvinnelige alpinisten fra land utenfor Europa og Nord-Amerika i verdenscuphistorien. I fjor ble hun nummer to sammenlagt i super-G bak Sofia Goggia, og hun avsluttet sesongen femte i storslalåm. Nå jakter hun seier igjen på den glaesialen der det hele startet.","url":"https://skiracing.com/alice-robinson-solden-giant-slalom/","pub_date":"2026-10-22T21:39:15.000Z","fetched_at":"2026-10-22 21:45:01","lang_orig":"en","category":null,"athletes":"Alice Robinson","athlete_nations":["NZL"],"also_sources":[],"norwegian":false},{"id":51667,"source_name":"Ski Racing","country":"INT","title_no":"Shiffrin endrer program mens Odermatt jager sjette strake verdenscuptittel","title_orig":"Shiffrin Shifts Schedule as Odermatt Chases Sixth Straight World Cup Title","summary_no":"Mikaela Shiffrin justerer sitt konkurranseprogram, mens Marcel Odermatt er i ferd med å sikre sin sjette strake verdenscuptittel.","spik_no":"Mikaela Shiffrin justerer programmet sitt for 2026–27-sesongen og hopper over de tidlige slalåmrennene i Levi og Gurgl, men planlegger å være tilbake i disiplinen til Killington. Den seksdobbelte sammenlagtvinneren kaller den kommende vinteren en «utforskningssesong» der hun vil prioritere mer trening i storslalåm og super-G mellom rennene. På herresiden jager Marcel Odermatt sin sjette strake verdenscuptittel, noe som ville plassere ham i eksklusivt selskap i alpinhistorien. Sveitseren har dominert herresiden siden 2021–22 og er allerede en av de mest dominerende utøverne i moderne alpint.","url":"https://skiracing.com/shiffrin-schedule-odermatt-world-cup-title/","pub_date":"2026-10-22T19:34:20.000Z","fetched_at":"2026-10-22 20:45:01","lang_orig":"en","category":null,"athletes":"Marco Odermatt,Mikaela Shiffrin","athlete_nations":["SUI","USA"],"also_sources":[],"norwegian":false},{"id":50873,"source_name":"Neveitalia","country":"ITA","title_no":"Europacup-utøverne samles på Stelvio og Val Senales","title_orig":"Allo Stelvio anche le velociste del team Coppa Europa, oltre a Guerinoni e Pomaré. Carolli, Sola e compagne in Val Senales da lunedì","summary_no":"Fartsspesialistene fra Europacup-laget trener på Stelvio sammen med Guerinoni og Pomaré, mens Carolli, Sola og lagvenninner reiser til Val Senales fra mandag.","spik_no":"Det italienske alpinlandslaget samler Europacup-utøverne til treningsleir på to ulike isbreer denne høsten. Fartsspesialistene Righi, Amigoni, Parravicini, Vanni og Putzer trener på Stelvio-breen, sammen med gigantistene Guerinoni og Pomaré som begge er på vei tilbake etter alvorlige skader fra forrige sesong. Carolli, Sola og resten av gigantistgruppen reiser til Val Senales fra mandag. Stelvio og Val Senales er de to viktigste høyfjellsglasierene i Italia for tidlig sesongforberedelse, og brukes jevnlig av alpinnasjoner fra hele Europa på høsten.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/allo-stelvio-anche-le-velociste-del-team-coppa-europa-oltre-a-guerinoni-e-pomare-carolli-sola-e-compagne-in-val-senales-da-lune","pub_date":"2026-10-22T17:05:00.000Z","fetched_at":"2026-10-22 17:15:01","lang_orig":"it","category":null,"athletes":"Ambra Pomaré","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":50737,"source_name":"Ski Racing","country":"INT","title_no":"Alexander Steen Olsen klar for comeback i Sölden","title_orig":"Alexander Steen Olsen to Make World Cup Comeback in Sölden","summary_no":"Alexander Steen Olsen er klar for å returnere til verdenscupen når sesongen åpner i Sölden.","spik_no":"Alexander Steen Olsen gjør comeback i verdenscupen når sesongen åpner på Rettenbachbreen i Sölden denne søndagen – samme sted hvor han vant storslalåmåpningen i 2024. I desember i fjor valgte 24-åringen fra Oslo å operere et plagsomt hopperkne og gikk glipp av hele den olympiske sesongen. Steen Olsen er ett av de største norske alpintalentene på mange år: han vant både storslalåm og slalåm i junior-VM i 2022, og tok sin første verdenscupseier i slalåm i Palisades Tahoe i sesongen 2022–23.","url":"https://skiracing.com/alexander-steen-olsen-to-make-world-cup-comeback-in-solden/","pub_date":"2026-10-22T16:46:19.000Z","fetched_at":"2026-10-22 17:00:01","lang_orig":"en","category":null,"athletes":"Alexander Steen Olsen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":50157,"source_name":"Ski Racing","country":"INT","title_no":"Forhåndsvisning av kvinnenes verdenscupsesong 2026/27","title_orig":"Ski Racing Media’s Katie Twible Joins Skiing Is Believing to Preview the 2026/27 Women’s World Cup Season","summary_no":"Katie Twible fra Ski Racing Media deltar i Skiing Is Believing for å gi en forhåndsvisning av kvinnenes verdenscupsesong 2026/27.","spik_no":"Verdenscupsesongen 2026/27 i alpint starter om få dager med storslalåm i Sölden, og det er allerede knyttet stor spenning til feltets sammensetning. Mikaela Shiffrin, som er den mestdekorerte alpinisten i verdenscuphistorien med over 90 seire, har besluttet å stille i færre slalåmrenn denne sesongen – noe som kan åpne for at rivaler tar poeng. I tillegg er det tidlig usikkerhet rundt Federica Brignone, Sofia Goggia og Valérie Grenier, tre av verdenscupens jevneste profiler, som alle er ventet å mangle i åpningsrennene.","url":"https://skiracing.com/ski-racing-medias-katie-twible-joins-skiing-is-believing-to-preview-the-2026-27-womens-world-cup-season/","pub_date":"2026-10-22T15:30:43.000Z","fetched_at":"2026-10-22 15:45:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":49582,"source_name":"Ski Racing","country":"INT","title_no":"Žampa Cup går globalt: Syv land, to kontinenter og nytt samarbeid","title_orig":"Žampa Cup Goes Global: Seven Countries, Two Continents and a New Partnership with Ski Racing Media","summary_no":"Žampa Cup ekspanderer internasjonalt med deltakere fra syv land på to kontinenter, og inngår samtidig et nytt partnerskap med Ski Racing Media.","spik_no":"Žampa Cup ekspanderer internasjonalt i s sources":[],"norwegian":false},{"id":48069,"source_name":"Neveitalia","country":"ITA","title_no":"Preparering av Rettenbach etter snøfall – ingen trening fredag morgen for damene","title_orig":"Si lavora sul Rettenbach dopo la nevicata, niente sciata in pista venerdì mattina per le ragazze alla vigilia del gigante","summary_no":"Arbeidet på Rettenbach-breen pågår etter kraftig snøfall, og damene får ikke trene på pisten fredag morgen før storslalåmrennet.","spik_no":"Et kraftig snøfall på rundt 20 centimeter la seg over Rettenbach-breen natta før dametreningen fredag, og pisten måtte klargjøres på ny. Som følge av dette ble den tradisjonelle løpet på konkurransepisten fredag morgen avlyst – noe som ifølge arrangøren ikke er uvanlig. Damenes storslalåm i Sölden kjøres lørdag med første omgang klokken 10.00 og finale klokken 13.00.","url":"https://www.neveitalia.it/sport/scialpino/news/si-lavora-sul-rettenbach-dopo-la-nevicata-niente-sciata-in-pista-venerdi-mattina-per-le-ragazze-alla-vigilia-del-gigante","pub_date":"2026-10-22T09:20:00.000Z","fetched_at":"2026-10-22 10:54:36","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":48070,"source_name":"Neveitalia","country":"ITA","title_no":"Brignone på rød løper i Roma: «Jeg savner adrenalinet fra pisten»","title_orig":"A Roma la première di \"Federica - L'ultima Olimpiade\", Brignone sul red carpet: \"Mi manca l'adrenalina della pista\"","summary_no":"Federica Brignone deltok på premieren av filmen «Federica – L'ultima Olimpiade» i Roma og innrømmet at hun savner følelsen av å konkurrere.","spik_no":"Federica Brignone deltok på premieren av dokumentarfilmen «Federica – L'ultima Olimpiade» under filmfestivalen i Roma, der hun åpnet opp om at hun savner adrenalinet fra konkurranse. Den italienske alpinstjernen er fortsatt i rehabilitering etter en operasjon for om lag to måneder siden, og tilbringer dagene på treningssenteret J Medical i Torino. Filmen dokumente enn.","spik_no":"Giovanni Franzoni gjør sin debut som Red Bull-utøver og ble allerede mandag kveld invitert til selskapets TV-program «Sport und Talk aus dem Hangar-7» i Salzburg, i selskap med blant andre Mikaela Shiffrin. Den italienske nedfartsspesialisten fra Brescia tok sølv i junior-VM i storslalåm, men fysiske problemer har hindret ham i å satse stabilt på den disiplinen. Denne sesongen skal storslalåm for alvor inn i programmet hans, og han er blant syv italienske utøvere i åpningsrennet i Sölden.","url":"https://www.neveitalia.it/sport/scialpino/news/il-ballo-dei-debuttanti-in-casa-red-bull-per-giovanni-franzoni-tanta-curiosita-attorno-al-bresciano-gia-per-l-opening","pub_date":"2026-10-20T10:50:00.000Z","fetched_at":"2026-10-20 11:00:01","lang_orig":"it","category":null,"athletes":"Giovanni Franzoni","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":47762,"source_name":"SkinEWS","country":"SUI","title_no":"Norge stiller med to Sölden-debutanter, en returnerende utøver og en profilert trener","title_orig":"Norwegen mit zwei Sölden-Neulingen, einem Rückkehrer und einem prominenten Coach","summary_no":"Norge møter opp i Sölden med to nykommer, en utøver som er tilbake etter fravær og en kjent trener i staben.","spik_no":"Norge stiller i Sölden med ni menn og tre kvinner, inkludert to debutanter og en utøver som er tilbake etter fravær. Den største nyheten er likevel at Aksel Lund Svindal, 43 år, er med som trener for de norske teknikerne. Svindal er dobbelt olympisk mester og har vunnet sammenlagtcupen to ganger, og jobbet senest som trener for Lindsey Vonn fram til april 2026 – inntil amerikanerens alvorlige skade satte en stopper for det samarbeidet.","url":"https://www.skinews.ch/news/2026/neulingen-rueckkehrer-prominenten/","pub_date":"2026-10-20T10:28:28.000Z","fetched_at":"2026-10-20 10:30:05","lang_orig":"de","category":null,"athletes":"Alexander Steen Olsen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":47793,"source_name":"ORF Sport","country":"AUT","title_no":"Eisner hopper ut i det ukjente i Sölden","title_orig":"Eisner springt in Sölden ins kalte Wasser","summary_no":"Eisner gjør sin debut i Sölden og kaster seg rett ut i det uten særlig erfaring fra løypen.","spik_no":"23 år gamle Jakob Eisner fra Kärnten gjør sin Verdenscup-debut i Sölden etter å ha slått ut mer erfarne løpere i den østerrikske kvalifiseringen, deriblant Fabio Gstrein, som tok OL-sølv i slalåm i Bormio tidligere i år. Eisner har tidligere kun konkurrert i Europacup og FIS-renn, og ble selv overrasket over plassen. Opptakten har vært krevende – han pådro seg en muskelfiberrift i venstre lår under sommertreningen, men kjempet seg tilbake og sikret startplass til det østerrikske hjemmerenn et.","url":"https://sport.orf.at/stories/3163794/","pub_date":"2026-10-20T10:25:41.000Z","fetched_at":"2026-10-20 10:30:05","lang_orig":"de","category":null,"athletes":"Jakob Eisner","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":47633,"source_name":"Neveitalia","country":"ITA","title_no":"Polen gjenforenet med Gasienica-Daniel til åpningen, Verdu leder Andorra med debutant Medina Girones","title_orig":"La Polonia ritrova Gasienica-Daniel già per l'opening, Verdu guida Andorra che vede debuttare Medina Girones","summary_no":"Polen kan regne med Gasienica-Daniel allerede fra sesongåpningen. Verdu leder det andorranske laget, som også får se Medina Girones gjøre sin debut.","spik_no":"Den polske storslalømsutøveren Maryna Gasienica-Daniel er klar for sesongåpningen i Sölden etter å ha revet korsbåndet mot slutten av forrige sesong. Skaden kom etter en sterk vinter der hun satte personlige rekorder i verdenscupen, med to femteplasser i Semmering og San Vigilio di Marebbe, og en sjuendeplass i OL-giganten. Fra Andorra stiller Joan Verdu etter en dramatisk treningsfall på Rettenbach i forkant av sesongåpningen, mens landsmannninnen Medina Girones gjør sin verdenscupdebut – 23-åringen er nummer to i s a Swenn-Larsson sprids: ”Viralt”","summary_no":"Bilder av Anna Swenn-Larsson under trening sprer seg raskt på nett og har blitt et viralt fenomen.","spik_no":"Anna Swenn-Larsson har skapt oppmerksomhet på sosiale medier etter at treningsvideoer av henne har spredt seg viralt, blant annet med kommentarer fra alpinlegender som Anja Pärson og Lindsey Vonn. Den svenske slalåmstjernen, som er 35 år, vant bronsemedalje i slalåm under OL i Milano Cortina og regnes som en av de mest erfarne utøverne i verdenscupen. Swenn-Larsson er ydmyk overfor oppmerksomheten og påpeker at hardt treningsarbeid er normalt i alpinmiljøet. Til helgen er hun klar for verdenscuppremieren i Sölden 24. oktober.","url":"https://www.svt.se/sport/alpint/traningsbilderna-pa-anna-swenn-larsson-sprids-viralt","pub_date":"2026-10-20T07:51:11.000Z","fetched_at":"2026-10-20 08:00:04","lang_orig":"sv","category":"naert","athletes":"Anna Swenn-Larsson","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":46492,"source_name":"Neveitalia","country":"ITA","title_no":"Shiffrin og Scheib et populært par på TV","title_orig":"Opening -4, Shiffrin-Scheib che coppia in TV! Mikaela: \"Sentivamo di dover cambiare\". Julia: \"Resta la migliore al mondo\"","summary_no":"Mikaela Shiffrin sier de følte behov for endring, mens Julia Scheib kaller henne fortsatt verdens beste.","spik_no":"Mikaela Shiffrin og Julia Scheib var gjester i den populære østerrikske TV-sendingen «Sport und Talk aus dem Hangar-7» på ServusTV, der de snakket om sine respektive valg foran den kommende verdenscupsesongen. Shiffrin innrømmet at hun og laget følte behov for endring, særlig knyttet til fartsdisiplinene, mens Scheib — som vant fem storslalomrenn forrige sesong, inkludert åpningsrennet i Sölden — understreket at amerikaneren fortsatt er verdens beste. Oppkjøringen skjer dagene før storslalomåpningen på Rettenbachbreen i Sölden, der de to regnes som store favoritter.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/opening-4-shiffrin-scheib-che-coppia-in-tv-mikaela-sentivamo-di-dover-cambiare-julia-resta-la-migliore-al-mondo","pub_date":"2026-10-20T07:30:00.000Z","fetched_at":"2026-10-20 07:45:02","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":46263,"source_name":"Neveitalia","country":"ITA","title_no":"Svindal blir teknisk samarbeidspartner for det norske alpinlandslaget","title_orig":"Svindal torna a casa: la federsci norge annuncia l'accordo con Aksel quale collaboratore tecnico della nazionale","summary_no":"Det norske skiforbundet bekrefter at Aksel Lund Svindal returnerer til landslaget som teknisk samarbeidspartner.","spik_no":"Aksel Lund Svindal returnerer til det norske alpinlandslaget som teknisk samarbeidspartner fra og med sesongen 2026–27, bekrefter Skiforbundet. Svindal, som vant OL-gull og to store krystallkuler i karrieren, har det siste året fungert som trenerfigur for Lindsey Vonn, men samarbeidet der tok slutt etter Vonns dramatiske skade under OL. Det blir ikke et heltidsengasjement, men Svindal sier selv at han tror han kan bidra på flere områder og starter allerede i Sölden.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/svindal-torna-a-casa-la-federsci-norge-annuncia-l-accordo-con-aksel-quale-collaboratore-tecnico-della-nazionale","pub_date":"2026-10-20T06:40:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde,Lindsey Vonn","athlete_nations":["NOR","USA"],"also_sources":[],"norwegian":true},{"id":46243,"source_name":"Ski Racing","country":"INT","title_no":"Henrik Kristoffersen tester nytt HEAD-utstyr for 2026–27","title_orig":"Henrik Kristoffersen Tests New HEAD Equipment for 2026-27","summary_no":"Henrik Kristoffersen er i gang med å teste nytt utstyr fra HEAD i forkant av sesongen 2026–27.","spik_no":"Henrik Kristoffersen tester nytt utstyr fra HEAD foran sesongen 2026–27 – og det er første gang i karrieren han bytter ski, bindinger og støvler samtidig. 36-åringen fra Rælingen skiftet fra Rossignol til Van Deer etter 2021–22-sesongen, men den gangen kom støvlebytten ett år forsinket. Med 102 pallplasser og 34 seire i verdenscupen er Kristoffersen blant de mest meritterte utøverne i historien, og både han og trener og far Lars understreker at dette er et felt de ikke har erfaring med.","url":"https://skiracing.com/henrik-kristoffersen-head-equipment/","pub_date":"2026-10-19T21:36:05.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"en","category":null,"athletes":"Henrik Kristoffersen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46244,"source_name":"Ski Racing","country":"INT","title_no":"Katie Hensien tilbake i Sölden med uoppgjort regnskap","title_orig":"Katie Hensien Returns to Sölden With Unfinished Business","summary_no":"Katie Hensien returnerer til Sölden med ambisjoner om å innfri etter tidligere skuffelser der.","spik_no":"Katie Hensien er tilbake på Rettenbach-breen i Sölden med uoppgjort regnskap etter en sesong preget av skade. I oktober 2024 endte 26-åringen på fjerdeplass i sesongåpneren – bare 0,03 sekunder fra sin første verdenscuppall – etter å ha startet med startnummer 47, noe som er blant de mest bemerkelsesverdige resultatene i amerikansk alpinhistorie de siste årene. Også 2025–26-sesongen ble avbrutt av skade, noe som presset henne nedover i startrekkefølgen. Nå forsikrer hun at hun er frisk og klar.","url":"https://skiracing.com/katie-hensien-returns-to-solden-with-unfinished-business/","pub_date":"2026-10-19T21:16:44.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"en","category":null,"athletes":"Katie Hensien","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":46264,"source_name":"Neveitalia","country":"ITA","title_no":"Steen Olsen-comeback bekreftet: Norge stiller med et drømmelag til Sölden","title_orig":"Sul rientro di Steen Olsen arriva il timbro dell'ufficialità: i norvegesi per Soelden, un vero e proprio squadrone","summary_no":"Det er nå offisielt at Henrik Kristoffersen Steen Olsen er tilbake, og Norge møter opp til sesongåpningen i Sölden med et meget sterkt lag.","spik_no":"Norge stiller med tolv utøvere til sesongåpningen i Sölden, og det mest etterlengtede comebacket er Alexander Steen Olsen, som er tilbake etter en sesong ute med skade. Klasse 2001-utøveren vant storslalåmen på Rettenbach i 2024 foran Henrik Kristoffersen og Atle McGrath og er regnet som et av verdens største alpintalenter. På kvinnesiden er Thea Louise Stjernesund, OL-sølvvinner i Cortina, og Mina Fuerst Holtmann – som ble toer under finalen i Hafjell – Norges sterkeste kort i storslalåmen lørdag.","url":"https://www.neveitalia.it/sport/scialpino/news/sul-rientro-di-steen-olsen-arriva-il-timbro-dell-ufficialita-i-norvegesi-per-soelden-un-vero-e-proprio-squadrone","pub_date":"2026-10-19T18:35:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Alexander Steen Olsen,Atle Lie McGrath,Henrik Kristoffersen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46278,"source_name":"SkinEWS","country":"SUI","title_no":"Langeårig Atomic-sjef går av med pensjon","title_orig":"Der langjährige Atomic-Chef geht in Pension","summary_no":"Sjefen for skiutstyrsgiganten Atomic gjennom mange år har besluttet å pensjonere seg.","spik_no":"Wolfgang Mayrhofer går av som toppsjef i skiutstyrsprodusenten Atomic ved utgangen av 2026, etter å ha ledet selskapet siden 2007 og hatt en karriere i bedriften som strekker seg over mer enn fire tiår. Hans etterfølger blir Michael Absmaier, som har vært selskapets finansdirektør og visepresident for forretningsutvikling. Atomic er en av de ledende produsentene av alpinski og støvler i verden, og utstyrer en rekke toppnavn på verdenscuptouren.","url":"https://www.skinews.ch/news/2026/langjaehrige-atomic-pension/","pub_date":"2026-10-19T18:03:10.000Z","fetched_at":"2026-10-20 07:15:03","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":46245,"source_name":"Ski Racing","country":"INT","title_no":"Valérie Grenier skadet kneet under Sölden-trening – opereres fredag","title_orig":"Valérie Grenier Injures Knee in Sölden Training, Surgery Scheduled for Friday","summary_no":"Valérie Grenier pådro seg en kneskade under trening i Sölden og skal opereres allerede fredag.","spik_no":"Canadiske Valérie Grenier pådro seg en kneskade under trening på konkurransebakken i Sölden og skal opereres fredag – omfanget er foreløpig ukjent. 29-åringen fra Ontario avsluttet fjorårssesongen på topp da hun vant storslalåmen under verdenscupfinalen i Hafjell i mars, sin tredje verdenscupseier og den første på over to år. Grenier har en karriere preget av fysiske tilbakeslag, og alle tre seirene hennes har kommet i storslalåm. En ny alvorlig skade kan sette hele 2026–27-sesongen i fare.","url":"https://skiracing.com/valerie-grenier-injures-knee-in-solden-training-surgery-scheduled-for-friday/","pub_date":"2026-10-19T17:19:28.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"en","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":46315,"source_name":"ORF Sport","country":"AUT","title_no":"«Brutalt»: Kilde sliter med skadeulykken","title_orig":"„Brutal“: Kilde hadert mit Verletzungspech","summary_no":"Aleksander Aamodt Kilde beskriver det som brutalt å ha vært plaget av skader.","spik_no":"Aleksander Aamodt Kilde beskriver det som \"brutalt\" å ha pådratt seg nok en alvorlig skade – denne gang et achillessenebrudd under utfortrening i Chile. 34-åringen fra Bærum skriver på Instagram at han er \"knust, sint og frustrert\", men at han har en klar rehabiliteringsplan. I januar 2024 pådro han seg alvorlige skader i legg og skulder under utforen i Wengen, og har brukt store deler av de siste sesongene på å komme tilbake. Kilde er forlovet med amerikanske Mikaela Shiffrin og regnes som en av verdens beste fartskjørere.","url":"https://sport.orf.at/stories/3163801/","pub_date":"2026-10-19T17:08:35.000Z","fetched_at":"2026-10-20 07:15:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46316,"source_name":"ORF Sport","country":"AUT","title_no":"«Brutalt»: Kilde frustrert over skadeplagene","title_orig":"„Brutal“: Kilde hadert mit seinem Verletzungspech","summary_no":"Aleksander Aamodt Kilde åpner opp om sitt vedvarende skadeproblem og kaller situasjonen brutal.","spik_no":"Aleksander Aamodt Kilde åpner opp på Instagram etter at han pådro seg et achillessenebrudd under utfortrening i Chile – hans foreløpig tyngste tilbakeslag etter en rekke skader de siste årene. 34-åringen forteller at han endelig hadde begynt å kjenne seg raskere og bedre enn på lenge, og at han hadde mer moro på ski enn på veldig lenge – så kom fallet. Kilde vant den store kulen i utfor og super-G sammenlagt i sesongen 2021/22, men har knapt fått vist frem sitt fulle potensial i etterkant på grunn av skader.","url":"https://sport.orf.at/stories/3163800/","pub_date":"2026-10-19T16:45:09.000Z","fetched_at":"2026-10-20 07:15:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46267,"source_name":"Neveitalia","country":"ITA","title_no":"Kilde etter ulykken: – Sint og frustrert, men jeg har en klar vei fremover","title_orig":"Kilde, le prime parole dopo l'incidente: la voglia di combattere c'è ancora. \"Arrabbiato e frustrato, ma ho un percorso chiaro davanti a me\"","summary_no":"Aleksander Aamodt Kilde bryter tausheten etter skadesmellen og forsikrer om at kampviljen er intakt, selv om situasjonen er frustrerende.","spik_no":"Aleksander Aamodt Kilde har brutt tausheten fire dager etter at det ble kjent at han rupturerte achillessenen på høyre ben under en treningsleir i Chile. Den to ganger verdensmester og storhaugen-vinner skriver at han er sint og frustrert, men at han har en klar plan fremover – og at en retur mot slutten av sesongen ikke er utelukket siden restitusjonstiden anslås til fire til fem måneder. Kilde, som har kjempet seg tilbake fra flere alvorlige skader tidligere, var ifølge eget utsagn i ferd med å finne tilbake til sitt beste nivå da ulykken inntraff.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/kilde-le-prime-parole-dopo-l-incidente-la-voglia-di-combattere-c-e-ancora-arrabbiato-e-frustrato-ma-ho-un-percorso-chiaro-davan","pub_date":"2026-10-19T16:15:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":46268,"source_name":"Neveitalia","country":"ITA","title_no":"Ny knesmell for Valérie Grenier: kanadieren forlater Sölden med skade","title_orig":"L'ennesima mazzata per Valérie Grenier: danno al ginocchio destro a Soelden, la canadese rientra in patria","summary_no":"Canadiske Valérie Grenier pådro seg en skade på høyre kne under Sölden-åpningen og måtte reise hjem til Canada.","spik_no":"Valérie Grenier skadet seg på høyre kne under trening på Rettenbach i Sölden og reiser hjem til Canada for operasjon fredag – det er ennå ikke klart hvor alvorlig skaden er. Den 29-årige storslalåmspesialisten fra Ontario avsluttet fjorårssesongen med seier i verdenscupfinalen i Hafjell, sin tredje verdenscupseier totalt og alle tre i storslalåm. Karrieren hennes har vært hardt rammet av kneskader tidligere, og det er nå bekreftet at hun ikke stiller til start i Sölden-åpningen lørdag.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/l-ennesima-mazzata-per-valerie-grenier-danno-al-ginocchio-destro-a-soelden-la-canadese-rientra-in-patria","pub_date":"2026-10-19T15:40:00.000Z","fetched_at":"2026-10-20 07:15:01","lang_orig":"it","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":31695,"source_name":"Ski Racing","country":"INT","title_no":"Breezy Johnson stiller spørsmål ved rettferdigheten i FIS' skivektregel","title_orig":"Breezy Johnson Questions Fairness of FIS Ski Weight Rule","summary_no":"Den amerikanske alpinisten Breezy Johnson kritiserer FIS-regelen om minimumsvekt på ski og mener den ikke er rettferdig.","spik_no":"Amerikanske Breezy Johnson, olympisk mester og verdensmester i utforkjøring, stiller spørsmål ved rettferdigheten i FIS' nye regel om minimumsvekt på racingski. Johnson sier at sommertrening på myk og jevn snø ikke har avslørt noen merkbar forskjell med de nye skiene, men understreker at renn på tøffe verdenscupbakker er en helt annen sak. Hun er særlig bekymret for regelens begrunnelse og mener den rammer et lite antall utøvere uforholdsmessig hardt. Johnson, som kjører på Atomic-ski for det amerikanske Stifel-laget, planlegger mer testing på Copper Mountain frem mot sesongstart.","url":"https://skiracing.com/breezy-johnson-fis-ski-weight-rule/","pub_date":"2026-10-14T17:48:11.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"en","category":"naert","athletes":"Breezy Johnson","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":30501,"source_name":"SVT Sport","country":"SWE","title_no":"Kristoffer Jakobsen vil rette opp feilene – ved å gå tilbake til røttene","title_orig":"Kristoffer Jakobsens uråkningar ska bort – genom att backa i tiden","summary_no":"Kristoffer Jakobsen jobber med å eliminere sine tekniske feil ved å gå tilbake til grunnleggende prinsipper.","spik_no":"Kristoffer Jakobsen har hatt en svært skuffende sesong og gikk ut i første omgang i sju av elleve slalomrenn i fjor. For å komme tilbake til toppform går 32-åringen tilbake til det eksakt samme utstyret han brukte da han ledet slalomcupen sammenlagt og var på sitt beste. Et nytt støvelkonsept fra skimerkevaret hans fungerte dårlig, og de svake resultatene har kostet ham mye i rankingen, slik at han neste sesong starter med høyere startnummer. Jakobsen har fire pallplasser i karrieren, den siste fra november 2024.","url":"https://www.svt.se/sport/alpint/kristoffer-jakobsens-urakningar-ska-bort-genom-att-backa-i-tiden","pub_date":"2026-10-14T14:08:51.000Z","fetched_at":"2026-10-14 14:15:04","lang_orig":"sv","category":"nerding","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":23913,"source_name":"Neveitalia","country":"ITA","title_no":"Giada D'Antonio: – Skader har lært meg mye, nå er jeg smertefri","title_orig":"\"Scio senza dolore, l'infortunio mi ha insegnato tanto\": Giada D'Antonio ora in Senales, probabile il debutto in Coppa Europa","summary_no":"Den italienske alpinisten Giada D'Antonio trener i Senales etter skade og er aktuell for debut i Europa-cupen denne sesongen.","spik_no":"Den italienske alpinisten Giada D'Antonio, født 2009, sier hun nå er smertefri etter korsbåndsskaden hun pådro seg 14. februar i trening i Dobbiaco – midt under OL-perioden. Etter nesten sju måneder med rehabilitering ved J Medical i Torino er hun tilbake på snø og trener nå i Val Senales. Planen er et mulig debut i Europa-cupen allerede fra åpningsrennene i Levi 21.–22. november, før hun vender tilbake til verdenscupsirkuset.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/scio-senza-dolore-l-infortunio-mi-ha-insegnato-tanto-giada-d-antonio-ora-in-senales-probabile-il-debutto-in-coppa-europa","pub_date":"2026-10-13T07:50:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":"naert","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":17879,"source_name":"Neveitalia","country":"ITA","title_no":"Grenier møtte hindringer på veien mot Sölden: skadet i Ushuaia, nå i Val Senales","title_orig":"Per Valérie Grenier un intoppo sulla strada per Soelden: infortunio a Ushuaia, ripresa allo Stelvio e ora... Val Senales","summary_no":"Valérie Grenier pådro seg en skade i Ushuaia og har trent på Stelvio, og er nå i Val Senales foran åpningsrennet i Sölden.","spik_no":"Canadiske Valérie Grenier avslørte at hun skadet brusk i sterno-klavikularleddet under en treningsfall i storslalåm på sommersamlingen i Ushuaia i Argentina, en skade som kostet henne rundt to uker av oppkjøringen. 1996-modellen måtte nøye seg med rehabilitering og friski mot slutten av Argentina-blokken, men er nå tilbake på snø i Italia og trener i Val Senales foran åpningsrennet i Sölden. Grenier regnes som en av de mer allsidige løperne på den kanadiske troppen og er spesielt sterk i de tekniske disiplinene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/per-valerie-grenier-un-intoppo-sulla-strada-per-soelden-infortunio-a-ushuaia-ripresa-allo-stelvio-e-ora-val-senales","pub_date":"2026-10-12T07:25:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":"sportslig","athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":17882,"source_name":"Neveitalia","country":"ITA","title_no":"Sofia om sin form: «Det går bedre nå – jeg vil forstå nivået mitt på pisten»","title_orig":"Sofia, raccontaci come stai: \"Ora va meglio, solo in pista capirò il mio livello e potrò fissare gli obiettivi. Come nel 2024 ho perso tanto\"","summary_no":"Sofia åpner opp om sin situasjon og sier det går bedre, men at hun trenger å kjøre på pisten for å forstå sitt nivå og sette mål.","spik_no":"Sofia Goggia åpner opp om en svært krevende sommer, der hun etter hjemkomst fra Ushuaia pådro seg et dobbelt virus som rammet nervesystemet og påførte henne invalidiserende smerter – noe hun beskriver som det verste hun har opplevd i karrieren. Den flerfoldige verdenscupvinneren og olympiske mesteren i utfor sier hun har gjort store fremskritt den siste uken, men at hun trenger å kjøre på pisten for å forstå sitt reelle nivå. Neste stopp er Stelvio, og deretter håper hun på intensivt arbeid i novemberblokk // Sesongstatus
function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';
  if (days <= 45) return '🎿 Forsesong — ' + nxt.venue + ' om ' + days + ' dager';
  return '💤 Sommerpause';
}

function getRace(str) {
  if (!str) return null;
  const d = new Date(str);
  if (isNaN(d)) return null;
  const s = d.toISOString().slice(0,10);
  return RACES.find(r => s >= r.date && s <= r.end) || null;
}

function fmt(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' kl. ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
