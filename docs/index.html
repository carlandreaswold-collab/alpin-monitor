<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>

  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>
    <div class="season" id="season-badge"></div>
    <span class="readonly-badge">👁 Lesevisning</span>

    <input class="search-input" type="search" id="search" placeholder="Søk i titler, utøvere…">
    <select class="athlete-select" id="country-select"><option value="">Alle land</option></select>
    <select class="athlete-select" id="athlete-select"><option value="">Alle utøvere</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="main">
  <div id="feed"></div>
  <div class="sidebar">
    <div class="section-label" id="spik-label">Spik-liste</div>
    <div id="spik-list"></div>
  </div>
</div>

<script>
const CATS = [{"id":"viktig","label":"⚡ Viktig"},{"id":"sportslig","label":"🎿 Sportslig"},{"id":"nyheter","label":"📰 Nyhet"},{"id":"goy","label":"😄 Gøy"},{"id":"nerding","label":"🔬 Nerding"},{"id":"kjendis","label":"🌟 Kjendis"},{"id":"naert","label":"🤝 Nært og nyttig"}];
const ARTICLES = [{"id":67445,"source_name":"ORF Sport","country":"AUT","title_no":"Gandler satser på sin egen vei mot pallen","title_orig":"Gandlers eigener Weg soll aufs Podest führen","summary_no":"Alpinisten Gandler følger sin egen tilnærming i håp om å nå podiet i verdenscupen.","spik_no":"OBS: Denne saken handler om skiskyting, ikke alpint — Anna Gandler er biatlet, ikke alpinist. Den østerrikske skiskytteren Gandler tilbrakte sommerens forberedelsesperiode i Frankrike på egenhånd, delvis fordi samboeren Emilien Claude trener der. Gandler ønsker å gjenfinne formen fra to sesonger tilbake og sikter mot pallplasseringer i verdenscupen, etter å ha slitt med motivasjonen.","url":"https://sport.orf.at/stories/3163893/","pub_date":"2026-10-27T12:45:24.000Z","fetched_at":"2026-10-27 13:42:44","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67400,"source_name":"Neveitalia","country":"ITA","title_no":"Italienske utforkjørere trener på Stelvio – Goggia i Sölden før avreise til Copper","title_orig":"Sotto il sole dello Stelvio le velociste azzurre. Poi con Goggia (che si allena a Soelden) si vola a Copper","summary_no":"De italienske fartskvinnene trener under solen på Stelvio, mens Goggia forbereder seg i Sölden før videre til Copper Mountain.","spik_no":"De italienske fartskvinnene er samlet på Stelvio-breen for treningsdager i godt vær, etter at et planlagt samling uken før måtte avlyses. Utøvere som Elena Curtoni, Roberta Melesi, Nadia og Nicol Delago, Sara Allemand, Teresa Runggaldier og Sara Thaler er i gang under coach Feltrin, med blikket rettet mot sesongåpningen i Beaver Creek 11.–13. desember. Sofia Goggia trener separat på Sölden-breen i Østerrike før hele gruppen reiser til Copper Mountain i USA for videre forberedelser. Italia er en av de sterkeste fartsnasjoner på dameside, med Goggia som en av verdens beste utforkjørere gjennom flere år.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sotto-il-sole-dello-stelvio-le-velociste-azzurre-poi-con-goggia-che-si-allena-a-soelden-si-vola-a-copper","pub_date":"2026-10-27T10:00:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":67402,"source_name":"Neveitalia","country":"ITA","title_no":"Vlhovas comeback nesten utelukkende positivt – ser frem til Levi","title_orig":"Quasi solo note positive per il ritorno di Vlhova in coppa. E ora la \"sua\" Levi: \"Sono competitiva, non vedo l'ora della prossima\"","summary_no":"Petra Vlhovas retur til verdenscupen ble godt mottatt, og slovaken gleder seg til neste renn i Levi.","spik_no":"Petra Vlhova er tilbake i verdenscupen etter en lang og krevende rehabilitering følge av en alvorlig kneskade hun pådro seg under VM i Cortina i februar 2023, der hun rev over korsbåndet. Comebacket ble tatt svært godt imot av omgivelsene, og slovaken ser selv frem til neste renn i finske Levi, der slalåm tradisjonelt er første disiplin på damekalenderen. Vlhova er en av de mest vinnende slalåmkjørerne i verdenscuphistorien og var den totale verdenscupvinneren i sesongen 2021/22.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/quasi-solo-note-positive-per-il-ritorno-di-vlhova-in-coppa-e-ora-la-sua-levi-sono-competitiva-non-vedo-l-ora-della-prossima","pub_date":"2026-10-27T08:30:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":67378,"source_name":"Ski Racing","country":"INT","title_no":"Alex Leever bringer utøverperspektiv til SYNC Performance","title_orig":"Alex Leever Brings a Racer’s Perspective to SYNC Performance","summary_no":"Tidligere alpinist Alex Leever bidrar med sin erfaring som utøver i arbeidet med SYNC Performance.","spik_no":"Tidligere alpinist Alex Leever går inn i en ny rolle hos sportsprestasjonsselskapet SYNC Performance, der han bidrar med erfaringer direkte fra utøverens perspektiv. Overgangen fra aktiv karriere til arbeid med prestasjonsutvikling er et voksende felt i alpinsporten, der tidligere utøvere i stadig større grad brukes til å bygge bro mellom teori og praksis. SYNC Performance jobber med optimalisering av utøveres fysiske og mentale yteevne.","url":"https://skiracing.com/alex-leever-brings-a-racers-perspective-to-sync-performance/","pub_date":"2026-10-26T21:19:26.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67381,"source_name":"Ski Racing","country":"INT","title_no":"Raimund Plancker utnevnt til FIS' sjefsløpsdirektør for herrenes alpint verdenscup","title_orig":"Raimund Plancker Named FIS Chief Race Director for Men’s Alpine World Cup","summary_no":"Raimund Plancker er utnevnt til ny sjefsløpsdirektør i FIS for herrenes alpine verdenscup.","spik_no":"Raimund Plancker er utnevnt til ny sjefsløpsdirektør i FIS for herrenes alpine verdenscup, en av de mest sentrale administrative rollene i internasjonal alpinsport. Sjefsløpsdirektøren har ansvar for gjennomføring og sportslig koordinering av herrenes verdenscuprenn gjennom hele sesongen. FIS har de siste årene arbeidet med å profesjonalisere den administrative strukturen rundt sporten, og Planckers utnevnelse er en del av denne satsingen.","url":"https://skiracing.com/raimund-plancker-named-fis-chief-race-director-for-mens-alpine-world-cup/","pub_date":"2026-10-26T16:10:12.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67407,"source_name":"Neveitalia","country":"ITA","title_no":"Livigno og Diavolezza tar imot italienske alpinister","title_orig":"Livigno/Diavolezza accoglie gli azzurri: fino a venerdì i velocisti del team CdM, ma anche Bassino, Pirovano e Zenere","summary_no":"Italias fartskjørere fra verdenscuplaget samles i Livigno og Diavolezza denne uken, sammen med blant andre Bassino, Pirovano og Zenere.","spik_no":"Det italienske alpinlandslaget for herre-fart er samlet i Livigno og på Diavolezza-breen i begynnelsen av sesongforberedelsene, og blant deltakerne er Marta Bassino, Laura Pirovano og Asja Zenere. Italia satser bredt i alpint denne sesongen, med et av de mest ressurssterke landsforbundene i verden. Livigno og Diavolezza-området i Alpene er populære treningssteder tidlig på høsten takket være høyden og breforhold som gir gode snøbetingelser allerede i oktober.","url":"https://www.neveitalia.it/sport/scialpino/news/la-neve-di-livigno-accoglie-gli-azzurri-fino-a-venerdi-i-velocisti-del-team-cdm-ma-anche-bassino-pirovano-e-zenere","pub_date":"2026-10-26T13:15:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":67408,"source_name":"Neveitalia","country":"ITA","title_no":"Brignone tar noen timers pause ved havet – Goggia trener med Robinson i Sölden","title_orig":"Brignone e qualche ora di mare mentre prosegue il recupero, quando sulla neve? Goggia a Soelden si allena con Robinson","summary_no":"Federica Brignone kobler av ved havet under sin restitusjon, mens Sofia Goggia trener med Robinson i Sölden.","spik_no":"Federica Brignone tar en kortere pause ved havet som del av sin restitusjon mellom treningsblokker, mens Sofia Goggia er i aktivt arbeid på Sölden-breen i Østerrike sammen med Robinson. De to er begge sentrale i det italienske fartslandslaget og regnes blant verdens aller beste nedfartsutøvere. Brignone er særlig sterk i storslalåm og kombinasjon og er tidligere vinner av den totale verdenscupen, mens Goggia er en av de fremste spesialistene i utfor.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/brignone-e-qualche-ora-di-mare-mentre-prosegue-il-recupero-quando-sulla-neve-goggia-a-soelden-si-allena-con-robinson","pub_date":"2026-10-26T12:40:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Alice Robinson,Federica Brignone,Sofia Goggia","athlete_nations":["ITA","NZL"],"also_sources":[],"norwegian":false},{"id":67481,"source_name":"SVT Sport","country":"SWE","title_no":"Vlhova tilbake etter tre år: – Glad etter så langt opphold","title_orig":"Petra Vlhova tillbaka efter tre år: ”Glad efter ett så långt uppehåll”","summary_no":"Petra Vlhova er tilbake i konkurranse etter tre års fravær og uttrykker glede over å være tilbake på ski.","spik_no":"Petra Vlhova var tilbake i verdenscupen i Sölden etter hele 1008 dager — nesten tre år — utenfor toppsirkuset. Den slovakiske OL-mesteren fra Beijing 2022 i slalom pådro seg en alvorlig kneskade i januar 2024 og har siden jobbet seg tilbake. Hun endte på 23.-plass i Sölden etter å ha vært ellevte etter første omgang, men understreket at det er poengene og comebacket som teller, ikke plasseringen.","url":"https://www.svt.se/sport/alpint/petra-vlhova-tillbaka-efter-tre-ar-glad-efter-ett-sa-langt-uppehall","pub_date":"2026-10-26T12:21:36.000Z","fetched_at":"2026-10-27 13:42:44","lang_orig":"sv","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":67414,"source_name":"SkinEWS","country":"SUI","title_no":"Raimund Plancker blir ny FIS-rennsjef fra 1. november","title_orig":"Raimund Plancker ab 1. November neuer FIS-Renndirektor","summary_no":"Raimund Plancker overtar stillingen som FIS-rennsjef fra og med 1. november.","spik_no":"Raimund Plancker overtar som FIS-rennsjef for herrer fra 1. november, etter at Markus Waldner overraskende trakk seg like før sesongstart. Plancker, som er fra Sør-Tirol i likhet med Waldner, har fungert som assisterende rennsjef siden 2022 og er dermed godt kjent med rollen. Waldner hadde i mange år vært en sentral og kontroversiell skikkelse i alpinsirkuset, og skippertaksskiftet skjer midt i en viktig sesong med VM som høydepunkt.","url":"https://www.skinews.ch/news/2026/plancker-november-renndirektor/","pub_date":"2026-10-26T10:23:57.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67382,"source_name":"Ski Racing","country":"INT","title_no":"Didier Cuche og HEAD feirer 20 år med Supershape med limitert utgave","title_orig":"Didier Cuche and HEAD Celebrate 20 Years of Supershape With Limited-Edition Ski","summary_no":"Didier Cuche og skiproduusenten HEAD markerer 20-årsjubileet for Supershape-skien med en eksklusiv limitert utgave.","spik_no":"Didier Cuche og skiproduusenten HEAD markerer 20-årsjubileet for den ikoniske Supershape-skien med en limitert spesialutgave. Cuche, som vant fem verdenscuptitler i utfor og er en av de mest dekorerte alpinistene i sveitsisk historie, har vært tett knyttet til HEAD gjennom store deler av karrieren. Supershape ble lansert for to tiår siden og har siden blitt en av de mest gjenkjennelige og vellykkede skimodellene i alpinsporten, brukt av en rekke toppløpere.","url":"https://skiracing.com/head-supershape-limited-didier-cuche/","pub_date":"2026-10-26T09:00:00.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67383,"source_name":"Ski Racing","country":"INT","title_no":"Lucas Pinheiro Braathen: Slik endret OL-gullet hans tilnærming til alpint","title_orig":"Lucas Pinheiro Braathen: How Olympic Gold Changed His Approach to Ski Racing","summary_no":"Lucas Pinheiro Braathen forteller om hvordan OL-gullet forandret hans perspektiv og tilnærming til alpint skiløp.","spik_no":"Lucas Pinheiro Braathen forteller om hvordan OL-gullet han vant for Brasil forandret hans perspektiv på alpinsporten og motivasjonen som driver ham. Braathen, som er sønn av norske Henrik Braathen, valgte i 2023 å bytte nasjon fra Norge til la Coupe du monde de ski alpin","summary_no":"Brasilianske Lucas Pinheiro Braathen knuste konkurrentene i riesenslalåmen i Sölden og åpnet verdenscupen i alpint med en overlegen seier.","spik_no":"Brasilianeren Lucas Pinheiro Braathen dominerte storslalåmen i Sölden og åpnet dermed verdenscupsesongen med en overlegen seier foran Loic Meillard og Marco Odermatt. Braathen, som er forsvarende OL-mester i storslalåm etter Milano-Cortina 2026, vant med god margin og sendte et tydelig signal om at han er klar for å kjempe om sammenlagtseieren. Den brasiliansk-norske utøveren, som representerer Brasil etter å ha byttet nasjon fra Sveits i 2023, fortsetter å imponere i storslalåm-bakken.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/le-bresilien-lucas-pinheiro-braathen-lamine-la-concurrence-sur-le-geant-de-solden-pour-la-reprise-de-la-saison_8253163.html#xtor=RSS-3-%5Bgeneral%5D","pub_date":"2026-10-25T13:14:14.000Z","fetched_at":"2026-10-27 13:42:45","lang_orig":"fr","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":67416,"source_name":"SkinEWS","country":"SUI","title_no":"Braathen med storslalåm-hattrick fra startnummer 4","title_orig":"Lucas Pinheiro Braathen – Riesenslalom-Hattrick mit Startnummer 4","summary_no":"Lucas Pinheiro Braathen sikret seg en imponerende hattrick i storslalåm med startnummer 4 i Sölden.","spik_no":"Lucas Pinheiro Braathen vant storslalåmen i Sölden og fullførte dermed et bemerkelsesverdig hattrick: tre verdenscupseiere på rad i storslalåm, alle med startnummer 4. Det var hans fjerde verdenscupseier totalt som brasiliansk utøver — tre i storslalåm og én i slalom. Seieren i Sölden gjenskapte nesten pallen fra OL, der Braathen vant foran Odermatt og Meillard.","url":"https://www.skinews.ch/news/2026/pinheiro-riesenslalom-startnummer/","pub_date":"2026-10-25T12:49:48.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":"Loïc Meillard,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":67385,"source_name":"Ski Racing","country":"INT","title_no":"Sölden herrer storslalåm 2026: Pinheiro Braathen leder etter første omgang","title_orig":"Sölden Men’s GS 2026: Pinheiro Braathen Leads Run 1","summary_no":"Lucas Pinheiro Braathen tok ledelsen etter første omgang i herrenes storslalåm i Sölden.","spik_no":"Lucas Pinheiro Braathen satte seg øverst på listen etter første omgang i herrenes storslalåm i Sölden, og viste tidlig i rennet at han var i ekstraordinær form. Braathen er kjent for sin tekniske presisjon og angrepslyst i storslalåm, og Sölden-løypen på Rettenbach-breen stiller store krav til nettopp disse egenskapene. En ledelse etter første omgang i Sölden er et godt utgangspunkt, men andreetappen er notorisk krevende og har snudd mange renn tidligere.","url":"https://skiracing.com/solden-mens-gs-2026-pinheiro-braathen-leads-run-1/","pub_date":"2026-10-25T10:41:08.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":67495,"source_name":"Sportschau","country":"GER","title_no":"Riesenslalåm i Sölden – første omgang for menn i re-live","title_orig":"Riesenslalom in Sölden - Der erste Lauf der Männer im Re-Live","summary_no":"Se første omgang av herreriesenslalåmen i Sölden i re-live.","spik_no":"Sesongåpningen i alpint for herrer gikk som vanlig i Sölden på Rettenbachferner-breen i Østerrike, med storslalåm som første disiplin. Sölden har siden 1992 vært det tradisjonelle startskuddet for verdenscupsesongen i alpint. Kraftig vind førte til at første omgang måtte kortes ned, noe som preget forholdene for utøverne.","url":"https://www.sportschau.de/video/riesenslalom-in-soelden-der-erste-lauf-der-maenner-im-re-live,re-live-slalom-soelden-maenner-100.html","pub_date":"2026-10-25T10:23:52.000Z","fetched_at":"2026-10-27 13:42:46","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67417,"source_name":"SkinEWS","country":"SUI","title_no":"Braathen satte farten i Sölden-«spurten»","title_orig":"Lucas Pinheiro Braathen legt im „Sprint“ von Sölden vor","summary_no":"Lucas Pinheiro Braathen ledet an i det som beskrives som en «spurt» under storslalåmåpningen i Sölden.","spik_no":"Braathen ledet etter første omgang av storslalåmen i Sölden, som ble kortet ned på grunn av kraftig vind på Rettenbachferner. Den 26 år gamle brasilianeren endte forrige sesong som nummer to i sammendraget bak Odermatt og har åpent erklært at han vil utfordre Odermatt om den store krystallkulen. En sterk ledelse etter første omgang bekreftet at ambisjonene er realistiske.","url":"https://www.skinews.ch/weltcup/2026/pinheiro-braathen-soelden/","pub_date":"2026-10-25T09:49:07.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":"Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":63934,"source_name":"ORF Sport","country":"AUT","title_no":"Gritsch reddet Østerrike fra total fiasko","title_orig":"Gritsch verhindert ÖSV-Totalausfall","summary_no":"Gritsch forhindret et totalt østerriksk fiasko da hun var eneste lyspunkt for ÖSV.","spik_no":"Franziska Gritsch reddet Østerrike fra et totalt fiasko i sesongåpningen i Sölden, der hun som eneste østerrikske løper tok seg videre til andreomgang og endte på niendeplass i storslalåm. Fjorårets vinner Julia Scheib styrtet ut i første omgang, noe som understreket hvor sårbart det østerrikske laget er bak sine fremste profiler. Gritsch, som trener alene adskilt fra landslaget, forbedret seg fra 15.- til 9.-plass i andreomgangen og leverte sitt beste storslalåmresultat på lang tid – hennes beste forrige sesong var en 18.-plass.","url":"https://sport.orf.at/stories/3164003/","pub_date":"2026-10-24T21:22:54.000Z","fetched_at":"2026-10-24 21:30:04","lang_orig":"de","category":null,"athletes":"Franziska Gritsch,Julia Scheib","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":63948,"source_name":"SVT Sport","country":"SWE","title_no":"Kaos rundt Moa Lundgren etter comeback på A-landslaget","title_orig":"Moa Lundgrens kaos efter återkomsten i A-landslaget","summary_no":"Moa Lundgren opplevde kaotiske tilstander etter sin retur til det svenske alpinlandslaget.","spik_no":"Moa Lundgren er tilbake på det svenske alpinlandslaget etter fem år utenfor, men comebacket har vært preget av kaos etter gjentatte sykdomsperioder med covidliknende luftveisplager. Den 28 år gamle sprintspesialisten måtte avbryte eller miste alle treningssamlinger i løpet av forsommeren og høsten – i Riksgränsen, Torsby og norske Meråker – og var syk i over fire sammenhengende uker. Lundgren forteller at hun siden covid har hatt rundt 40 sykedager per år, og til tross for fem topp ti-plasseringer i verdenscupen forrige sesong ble hun ikke tatt ut til OL-troppen.","url":"https://www.svt.se/sport/langdskidor/moa-lundgrens-kaos-efter-aterkomsten-i-a-landslaget","pub_date":"2026-10-24T21:18:18.000Z","fetched_at":"2026-10-24 21:30:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":63582,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrike skiller lag med trener Helm","title_orig":"Austria trennt sich von Trainer Helm","summary_no":"Østerrike har avsluttet samarbeidet med trener Helm.","spik_no":"Dette er ikke en alpinsak, men en fotballsak: Austria Wien i østerriksk Bundesliga har sparket treneren Stephan Helm etter en svak sesongstart. Helm, 43 år, hadde vært sjeftrener siden juli 2024 og fikk kontrakten forlenget så sent som i vår, men etter ti kamper med bare to seire og syv poeng står laget nest sist. Erstatteren blir Maximilian Uhlig, 33, som tidligere ledet reservelaget Young Violets.","url":"https://sport.orf.at/stories/3164020/","pub_date": t/scialpino/maschile/news/la-startlist-del-gigante-maschile-per-l-opening-odermatt-con-il-6-dopo-mcgrath-e-pinheiro-braathen-vinatzer-n-11-steen-olsen-ri","pub_date":"2026-10-24T17:50:00.000Z","fetched_at":"2026-10-24 20:30:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Alexander Steen Olsen,Atle Lie McGrath,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","ITA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":63400,"source_name":"Ski Racing","country":"INT","title_no":"Valérie Grenier operert etter Sölden-skade: ACL og menisk","title_orig":"Valérie Grenier Undergoes ACL Reconstruction and Meniscus Repair After Sölden Injury","summary_no":"Kanadiske Valérie Grenier har gjennomgått operasjon for korsbåndskade og meniskskade etter å ha blitt skadet i Sölden.","spik_no":"Kanadiske Valérie Grenier har gjennomgått vellykket ACL-rekonstruksjon og meniskoperasjon etter å ha skadet kneet under trening på Rettenbachbreen i Sölden. Grenier bekrefter på Instagram at inngrepet gikk «super smooth» og takker kirurg Dr. Simard og teamet ved CEOM. Dette er ikke første gang Grenier opererer ACL, noe som gjør rehabiliteringen ekstra krevende – hun må nå forberede seg på en lang pause fra verdenscupen.","url":"https://skiracing.com/valerie-grenier-undergoes-acl-reconstruction-and-meniscus-repair-after-solden-injury/","pub_date":"2026-10-24T17:41:40.000Z","fetched_at":"2026-10-24 20:30:01","lang_orig":"en","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":63420,"source_name":"Neveitalia","country":"ITA","title_no":"Zenere nær topp 15 i Killington – verdenscupkampen kompliseres for Bassino og Brignone","title_orig":"Zenere a ridosso delle 15 per Killington, per Bassino (e Brignone) la WCSL si complica: le classifiche di CdM dopo Soelden","summary_no":"Etter Sölden er Zenere tett på topp 15 foran Killington, mens situasjonen i verdenscupsammenlagningen ser vanskeligere ut for både Bassino og Brignone.","spik_no":"Etter sesongåpningen i Sölden, der Paula Moltzan vant og leder verdenscupen totalt med 100 poeng, er den italienske håpefulle Asja Zenere på 5. plass og tett på topp 15 foran Killington. Situasjonen er derimot vanskeligere for de italienske stjernene Marta Bassino og Federica Brignone – Bassino er utenfor topp 30 i GS-cupen, Brignone utenfor topp 20. Mikaela Shiffrin er foreløpig 7. totalt, men er ikke påmeldt slalomene i Levi og Gurgl.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/zenere-a-ridosso-delle-15-per-killington-per-bassino-e-brignone-la-wcsl-si-complica-le-classifiche-di-cdm-dopo-soelden","pub_date":"2026-10-24T17:10:00.000Z","fetched_at":"2026-10-24 20:30:01","lang_orig":"it","category":null,"athletes":"Federica Brignone,Marta Bassino,Paula Moltzan","athlete_nations":["ITA","USA"],"also_sources":[],"norwegian":false},{"id":63301,"source_name":"Neveitalia","country":"ITA","title_no":"Sju italienske utøvere åpner sesongen – Vinatzer og Franzoni med store ambisjoner","title_orig":"Sette azzurri per aprire la stagione, Vinatzer ci prova: \"Un nuovo percorso con lo staff\". Franzoni: \"Spero di diventare un gigantista\"","summary_no":"Sju italienske alpinister er klare for sesongstart. Vinatzer satser med nytt støtteapparat, mens Franzoni håper å utvikle seg til storslalømkjører.","spik_no":"Sju italienske alpinister stiller til sesongstart i storslalåm i Sölden søndag, med Alex Vinatzer som eneste italiener blant de 15 beste på startlisten. Vinatzer, 27 år og fra Gröden, er inne i et nytt samarbeid med støtteapparatet etter at trener Mauro Pini trakk seg følge et skuffende OL. Giovanni Franzoni, som starter med startnummer 31, har ambisjoner om å etablere seg som storslalåmkjører på høyeste nivå. Luca De Aliprandini må nøye seg med startnummer 44, noe som gjør oppgaven betydelig vanskeligere på den tekniske Rettenbach-glaciéren.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/sette-azzurri-per-aprire-la-stagione-vinatzer-ci-prova-un-nuovo-percorso-con-lo-staff-franzoni-spero-di-diventare-un-gigantista","pub_date":"2026-10-24T16:40:00.000Z","fetched_at":"2026-10-24 16:45:01","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Giovanni Franzoni","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":62473,"source_name":"Neveitalia","country":"ITA","title_no":"Colturi nær drømmeresultatet: – Forventet det ikke. Aicher strålende i åpningen","title_orig":"Una Colturi stratosferica ad un passo dal sogno: \"Non me l'aspettavo, nella 2^ ho sciato libera\". Aicher comincia alla grandissima","summary_no":"En formidabel Colturi var nær en sensasjon og uttrykte overraskelse over egen prestasjon, mens Aicher innledet konkurransen på strålende vis.","spik_no":"Lara Colturi var bare ett hundredels sekund unna seier i storslalåmåpningen i Sölden, noe som ville ha gitt Albania sin første noensinne verdenscupseier. Den 19 år gamle Colturi, som konkurrerer for Albania til tross for italiensk bakgrunn, har vokst fram som en av de store talentene i alpinsporten og har allerede flere toppplasseringer på CV-en. Tyske Aicher imponerte med en sterk åpning av konkurransen, mens Paula Moltzan vant rennet og sikret sin første verdenscupseier etter ti tidligere podieplasseringer.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/una-colturi-stratosferica-ad-un-passo-dal-sogno-non-me-l-aspettavo-nella-2-ho-sciato-libera-aicher-comincia-alla-grandissima","pub_date":"2026-10-24T14:50:00.000Z","fetched_at":"2026-10-24 15:00:03","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER"],"also_sources":[],"norwegian":false},{"id":62392,"source_name":"VG","country":"NOR","title_no":"Lovpriser svigerdatter Shiffrin: - Fantastisk skikjører, enda bedre menneske","title_orig":"Lovpriser svigerdatter Shiffrin: - Fantastisk skikjører, enda bedre menneske","summary_no":"","spik_no":"Mikaela Shiffrins svigermor har gått ut med store lovord om den amerikanske stjernen, og beskriver henne som en fantastisk skikjører og enda bedre menneske. Shiffrin har vært sammen med norske Aleksander Aamodt Kilde siden 2021, og paret er forlovet. Shiffrin er historiens mest meritterte alpinist med over 97 verdenscupseiere, men har også måttet håndtere store personlige påkjenninger – blant annet Kildes alvorlige styrt i Wengen i januar 2024.","url":"https://www.vg.no/sport/i/zlB2Xb/lovpriser-svigerdatter-shiffrin-fantastisk-skikjoerer-enda-bedre-menneske","pub_date":"2026-10-24T14:39:40.000Z","fetched_at":"2026-10-24 14:45:05","lang_orig":"no","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":62276,"source_name":"VG","country":"NOR","title_no":"Forloveden om Kildes nye skademareritt: ­ – Hjerteskjærende","title_orig":"Forloveden om Kildes nye skademareritt: ­ – Hjerteskjærende","summary_no":"","spik_no":"Aleksander Aamodt Kilde pådro seg en akilleskadeskade under utfortrening i Chile 14. oktober, noe som setter en brutal stopper for comebacket hans. Kilde har allerede vært ute med alvorlig kneskade siden januar 2024, og har dermed mistet nesten to hele sesonger. Forloveden Mikaela Shiffrin, som åpnet verdenscupsesongen med en syvendeplass i Sölden, reiste til Chile for å være med ham og beskriver tilbakeslaget som hjerteskjærende – men sier hennes første reaksjon var lettelse over at skaden ikke var livstruende.","url":"https://www.vg.no/sport/i/9kJQxq/shiffrin-om-aleksander-aamodt-kildes-nye-skade-hjerteskjaerende","pub_date":"2026-10-24T14:17:49.000Z","fetched_at":"2026-10-24 14:30:03","lang_orig":"no","category":null,"athletes":"Aleksander Aamodt Kilde,Mikaela Shiffrin","athlete_nations":["NOR","USA"],"also_sources":[],"norwegian":true},{"id":62277,"source_name":"VG","country":"NOR","title_no":"– Føler jeg har sviktet henne","title_orig":"– Føler jeg har sviktet henne","summary_no":"","spik_no":"Denne saken handler ikke om alpint og er ikke relevant som bakgrunnsnotat for NRK Sport alpint.","url":"https://www.vg.no/nyheter/i/qyLmde/sas-nektet-faren-aa-fly-hjem-med-datteren-4-foeler-jeg-har-sviktet-henne","pub_date":"2026-10-24T14:17:28.000Z","fetched_at":"2026-10-24 14:30:03","lang_orig":"no","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":62132,"source_name":"SkinEWS","country":"SUI","title_no":"Høydepunktene fra kvinnenes storslalåm i Sölden","title_orig":"Die Höhepunkte des Frauen-Riesenslaloms von Sölden","summary_no":"Her er høydepunktene fra kvinnenes storslalåmrenn i Sölden.","spik_no":"Paula Moltzan fra USA vant kvinnenes storslalåm i Sölden og sikret seg dermed sitt første verdenscuprenn i karrieren. Seieren var også historisk for skiutstyrsprodusenten VanDeer, som tok sin første verdenscupseier i kvinnealpint. Moltzan har vært en jevn verdenscupløper i flere år uten å ha vunnet, og triumfen kom i selskap med Emma Aicher og Lara Colturi på resultatlisten – to av de mest spennende unge profilene i kvinnealpint for tiden.","url":"https://www.skinews.ch/video/2026/hoehepunkte-riesenslaloms-soelden/","pub_date":"2026-10-24T14:03:31.000Z","fetched_at":"2026-10-24 14:15:03","lang_orig":"de","category":null,"athletes":"Emma Aicher,Lara Colturi,Paula Moltzan","athlete_nations":["ALB","GER","USA"],"also_sources":[],"norwegian":false},{"id":62209,"source_name":"Sportschau","country":"GER","title_no":"Storslalåm for kvinner i Sölden – oppsummering","title_orig":"Riesenslalom der Frauen in Sölden - die Zusammenfassung","summary_no":"Her er en oppsummering av kvinnenes storslalåm i Sölden.","spik_no":"Sölden markerte åpningen av alpinverdenscupsesongen 2026/27 med storslalåm for kvinner på den ikoniske Rettenbach-breen. Sölden har vært fast åpningsarena for verdenscupen siden 2000-tallet og gir ryttere og lag en første pekepinn på formen før den lange sesongen. Rennet samler verdens beste alpinister og er alltid tett fulgt av fansen som hungrer etter alpint etter en lang sommerpause.","url":"https://www.sportschau.de/wintersport/ski-alpin/riesenslalom-der-frauen-in-soelden-die-zusammenfassung,video-zusammenfassung-riesenslalom-soelden-100.html","pub_date":"2026-10-24T13:57:05.000Z","fetched_at":"2026-10-24 14:15:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":61998,"source_name":"Neveitalia","country":"ITA","title_no":"Asja fortsetter å vokse: «Tenk at jeg har jobbet mer med fart og ikke føler meg i form»","title_orig":"Asja, la crescita continua: \"Pensare che ho lavorato più sulla velocità e non mi sento in forma\". Zenere, che opening!","summary_no":"Asja imponerer med en sterk åpning av sesongen, til tross for at hun selv ikke føler seg i toppform etter fokus på fartsdisipliner.","spik_no":"Asja Zenere imponerte med en femteplass i sesongåpningen i storslalåm i Sölden, bare 0,2 sekunder fra pallen – og dette til tross for at hun selv ikke føler seg i toppform etter økt fokus på fartsdisiplinene i oppkjøringen. Den italienske alpinisten fra Vicenza har kjempet seg tilbake gjennom flere alvorlige skader, deriblant et korsbåndbrudd. Med 2.-beste tid i den avgjørende andreomlopen klatret hun fra 16.-plass til 5.-plass totalt, og viser at hun er i sterk utvikling.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/asja-la-crescita-continua-pensare-che-ho-lavorato-piu-sulla-velocita-e-non-mi-sento-in-forma-zenere-che-opening","pub_date":"2026-10-24T13:50:00.000Z","fetched_at":"2026-10-24 14:00:02","lang_orig":"it","category":null,"athletes":"Federica Brignone,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":61896,"source_name":"SkinEWS","country":"SUI","title_no":"Høydepunkter fra FIS' «Race-Talk» i Sölden","title_orig":"Highlights aus dem „Race-Talk“ der FIS in Sölden","summary_no":"Her er høydepunktene fra FIS' Race-Talk i Sölden.","spik_no":"FIS arrangerte sin tradisjonelle «Race-Talk» i Sölden i forbindelse med åpningsrennet i alpint verdenscup 2026/27-sesongen. Sölden på Rettenbach-breen i Østerrike har vært fast åpningsarena for verdenscupen siden 1990-tallet, og samler hvert år de beste alpinistene i verden til giant slalom for både kvinner og menn. Race-Talk er FIS' egne pressemøter der trenere, utøvere og funksjonærer diskuterer aktuelle temaer før sesongstart.","url":"https://www.skinews.ch/video/2026/highlights-race-soelden/","pub_date":"2026-10-24T13:34:36.000Z","fetched_at":"2026-10-24 13:45:03","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":61743,"source_name":"Ski Racing","country":"INT","title_no":"Moltzan tok sin første verdenscupseier i Sølden","title_orig":"Moltzan Claims First World Cup Victory in Sölden Podium Shake-Up","summary_no":"Paula Moltzan sikret seg sin aller første verdenscupseier i Sølden i et overraskende oppgjør om pallplassene.","spik_no":"Paula Moltzan vant sin første verdenscupseier noensinne i sesongåpningen i Sølden, og avsluttet en lang venting med ti pallplasseringer bak seg. Den 32 år gamle amerikaneren fra Minnesota er kjent som en teknisk sterk slalåm- og storslalåmkjører som lenge har vært i verdenstoppen uten å ta steget opp til topps. Seieren kom i et overraskende oppgjør om pallplassene, og markerer en milepæl i karrieren til en av de mest erfarne utøverne på kvinnenes verdenscupsirkus.","url":"https://skiracing.com/moltzan-claims-first-world-cup-victory-in-solden-podium-shake-up/","pub_date":"2026-10-24T13:26:32.000Z","fetched_at":"2026-10-24 13:30:01","lang_orig":"en","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":61763,"source_name":"Neveitalia","country":"ITA","title_no":"Moltzan skriver historie i Sølden sammen med Van Deer","title_orig":"Moltzan fa la storia a Soelden assieme a Van Deer, vincente al debutto nel circo rosa: \"Non vedo l'ora di festeggiare con il team\"","summary_no":"Paula Moltzan satte seg selv i historiebøkene i Sølden sammen med Van Deer, som vant i sin debut på verdenscupsirkuset. – Jeg gleder meg til å feire med laget, sa Moltzan.","spik_no":"Paula Moltzan skrev alpinhistorie i Sølden da hun tok sin aller første verdenscupseier i kjempeslalåm på Rettenbach-breen, 32 år gammel og etter hele ti pallplasseringer uten seier. Moltzan er den første og hittil eneste kvinnen som kjører på utstyr utviklet av Marcel Hirscher og hans nederlandske merke Van Deer, som dermed vant på sin absolutte debut i verdenscupen. Seieren ble ekstra dramatisk da Lara Colturi – som kjører for Albania – endte bare ett hundredels sekund bak på andreplass, mens Mikaela Shiffrin nøyde seg med sjuendeplass. – Jeg gleder meg til å feire med laget, sa Moltzan etter løpet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/moltzan-fa-la-storia-a-soelden-assieme-a-van-deer-vincente-al-debutto-nel-circo-rosa-non-vedo-l-ora-di-festeggiare-con-il-team","pub_date":"2026-10-24T13:20:00.000Z","fetched_at":"2026-10-24 13:30:02","lang_orig":"it","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":61730,"source_name":"Sportschau","country":"GER","title_no":"Alpint: Emma Aicher på pallen i Verdenscup-åpningen","title_orig":"Ski Alpin: Emma Aicher rast beim Weltcup-Auftakt auf das Podest","summary_no":"Emma Aicher leverte en sterk prestasjon og sikret seg en pallplass ved åpningen av alpint-verdenscupen.","spik_no":"Den 22 år gamle tyske alpinisten Emma Aicher sikret seg tredjeplass i storslalåmåpningen i Sölden, og satte dermed karrierebeste i denne disiplinen. Seieren gikk til amerikanske Paula Moltzan, mens Lara Colturi — som kjører for Albania — tok andreplassen. Aicher var bare niende etter første omgang, noe som gjør andreetappen imponerende. Storslalåm regnes som hennes svakeste gren, og hennes tidligere beste resultat der var en fjerdeplass i Åre i mars — så prestasjonen i Sölden
