a Rossetti som gjør comeback etter over ett år ute med korsbåndskade.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/primo-giorno-in-pista-a-levi-per-le-azzurre-sabato-lo-slalom-di-coppa-e-c-e-una-mondinelli-piena-di-fiducia","pub_date":"2026-11-10T13:20:00.000Z","fetched_at":"2026-11-10 13:30:03","lang_orig":"it","category":null,"athletes":"Marta Rossetti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":131728,"source_name":"SkinEWS","country":"SUI","title_no":"Lila Lapanja sier farvel","title_orig":"Lila Lapanja sagt „lebewohl“","summary_no":"Den amerikanske alpinisten Lila Lapanja avslutter karrieren og sier farvel til sporten.","spik_no":"Den amerikanske alpinisten Lila Lapanja legger opp, knapt en måned før hun fyller 32 år. I en video på sosiale medier forklarer hun at prioriteringene har endret seg og at kroppen trenger tid til å restituere seg. Lapanja, som konkurrerte for Slovenia, bruker ikke ordene «karriereslutt» eller «pensjonering» eksplisitt, men er heller ikke med i det slovenske uttaket for sesongen 2026/27 — noe som tyder på at kapittelet som aktiv utøver er over.","url":"https://www.skinews.ch/news/2026/lila-lapanja-lebewohl/","pub_date":"2026-11-10T13:13:57.000Z","fetched_at":"2026-11-10 13:15:05","lang_orig":"de","category":null,"athletes":"Lila Lapanja","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":131437,"source_name":"SVT Sport","country":"SWE","title_no":"Lagerbielke rammet av 'skrekkelig sykdom': – Det verste jeg har opplevd","title_orig":"Lagerbielke åkte på ”skräcksjukdom”: ”Värsta jag upplevt”","summary_no":"Alpinisten Lagerbielke ble rammet av en alvorlig sykdom og beskriver det som den verste opplevelsen i sitt liv.","spik_no":"Den svenske forsvarsspilleren Gustaf Lagerbielke ble syk under den svenske landslagssamlingen og måtte reise hjem etter å ha blitt sengeliggende i en uke med det han beskriver som den verste sykdommen han noensinne har opplevd. 26-åringen, som til dag untry":"SWE","title_no":"Johannes Lukas besvimte i bakken: – Husker ingenting","title_orig":"Johannes Lukas blackout i backen: ”Kommer inte ihåg”","summary_no":"Johannes Lukas opplevde et dramatisk blackout under et alpinskirenn og husker ikke hva som skjedde i bakken.","spik_no":"Den tyske skiskyttertreneren Johannes Lukas er kjent for å løpe i oppoverbakke ved siden av utøverne sine under konkurranser – noe som har gjort ham populær både blant publikum og de svenske stjernene. Men Lukas avslører nå at han ikke husker disse episodene, og at han blir urolig når han ser klippene i ettertid. Lukas tok over som sjefstrener for det svenske skiskytterlandslaget i 2019 og har siden ledet laget til betydelige suksesser. Foran VM-sesongen 2026/27 planlegger han å trene spesielt med støvler for å holde tritt med behovet i laget.","url":"https://www.svt.se/sport/skidskytte/johannes-lukas-blackout-i-backen-kommer-inte-ihag","pub_date":"2026-11-10T10:03:57.000Z","fetched_at":"2026-11-10 10:15:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":128518,"source_name":"Neveitalia","country":"ITA","title_no":"Ni svenske utøvere til slalomåpningen i Levi – Oehlund ikke hundre prosent","title_orig":"Nove svedesi per l'opening di slalom: a Levi ambizioni per Swenn Larsson e Hector, Oehlund non è al 100%","summary_no":"Sverige stiller med ni utøvere til slalomåpningen i Levi, der Swenn Larsson og Hector er blant favorittene, mens Oehlund ikke er i toppform.","spik_no":"Sverige stiller med ni utøvere til slalomåpningen i Levi, der Anna Swenn Larsson og Hector regnes blant favorittene, mens Oehlund ikke er i hundre prosent form. Swenn Larsson, født 1991, er en av verdens mest erfarne slalomspesialister og har tidligere tatt VM-sølv og olympisk bronse i Beijing 2022. Hun har gode minner fra Levis «Black»-løype med blant annet en andreplass og flere topp fem-plasseringer. Fire svenske kvinner og fire menn er tatt ut, etter int nn vor neunter OP „ziemlich nervös“","summary_no":"Den amerikanske alpinstjernen Lindsey Vonn innrømmer at hun er ganske nervøs i forkant av sin niende operasjon. Inngrepet er nok et kapittel i hennes lange kamphistorie med skader.","spik_no":"Lindsey Vonn innrømmer på Instagram at hun er «ganske nervøs» foran sin niende operasjon, der alle plater og skruer skal fjernes og et nytt korsbånd settes inn i kneet. Den 42 år gamle amerikaneren skadet seg alvorlig under OL-utforkjøringen i Cortina d'Ampezzo i februar 2026, og har siden gjennomgått flere inngrep for et komplekst brudd i venstre leggbein. Vonn, som vant fire sammenlagtseirer i verdenscupen og har 82 verdenscupseirer, regner med seks til ni måneder utenfor løypene, og håper inngrepet blir det siste.","url":"https://sport.orf.at/stories/3164720/","pub_date":"2026-11-09T22:37:30.000Z","fetched_at":"2026-11-10 08:00:06","lang_orig":"de","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":128187,"source_name":"Neveitalia","country":"ITA","title_no":"Lila Lapanja tar pause fra karrieren: «Det er et farvel for nå – kroppen trenger hvile»","title_orig":"Lila Lapanja mette in pausa la sua carriera: \"E' un arrivederci, ora il mio corpo ha bisogno di recuperare\"","summary_no":"Den amerikanske alpinisten Lila Lapanja setter karrieren på pause og sier kroppen hennes trenger tid til å komme seg.","spik_no":"Den amerikanske alpinisten Lila Lapanja tar pause fra karrieren og begrunner det med at kroppen trenger hvile og tid til å komme seg. Lapanja har representert USA i verdenscupen og konkurrert internasjonalt i flere år, men har slitt med å hevde seg konsekvent i verdenstoppen. Pausen understreker de fysiske og mentale kravene som stilles til eliteutøvere, og det er foreløpig uklart om det dreier seg om et midlertidig avbrekk eller en permanent avslutning.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/lila-lapanja-mette-in-pausa-la-sua-carriera-e-un-arrivederci-ora-il-mio-corpo-ha-bisogno-di-recuperare","pub_date":"2026-11-09T20:30:00.000Z","fetched_at":"2026-11-10 08:00:02","lang_orig":"it","category":null,"athletes":"Lila Lapanja","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":128167,"source_name":"Ski Racing","country":"INT","title_no":"Bode Miller, Erik Schlopy og Dane Spencer slutter seg til «Skiing is Believing»","title_orig":"Bode Miller, Erik Schlopy and Dane Spencer Join Skiing is Believing","summary_no":"Skilegendene Bode Miller, Erik Schlopy og Dane Spencer blir en del av organisasjonen Skiing is Believing.","spik_no":"Bode Miller, Erik Schlopy og Dane Spencer har sluttet seg til organisasjonen Skiing is Believing, som arbeider med å gjøre skisporten mer tilgjengelig. Miller er den mest meritterte av de tre, med seks VM-gull og en sammenlagtseier i verdenscupen, og er en av USAs mest kjente skiikoner gjennom tidene. At etablerte navn fra amerikansk alpinhistorie engasjerer seg i slike initiativer, kan bidra til økt oppmerksomhet og rekruttering til sporten.","url":"https://skiracing.com/bode-miller-erik-schlopy-and-dane-spencer-join-skiing-is-believing/","pub_date":"2026-11-09T20:00:00.000Z","fetched_at":"2026-11-10 08:00:01","lang_orig":"en","category":null,"athletes":"Bode Miller","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":128188,"source_name":"Neveitalia","country":"ITA","title_no":"Frankrike stiller med 14 utøvere i Levi – Noel jakter første røde startnummer","title_orig":"L'Equipe de France per Levi con 14 atleti: Noel, 1° e 2° nelle ultime due occasioni, punta al primo pettorale rosso","summary_no":"Det franske landslaget møter opp i Levi med 14 utøvere. Clément Noel, som har vunnet de to siste rennene der, sikter mot ledertroféen i verdenstoppen.","spik_no":"Frankrike stiller med hele 14 utøvere i Levi-åpningen, og Clément Noel er lagets store profil i slalåm. Noel har vunnet de to siste slalåmrennene i Levi og jakter nå det røde startnummeret som tildeles den ledende utøveren i verdenscupen. 25-åringen fra Alsace har utviklet seg til en av slalåmens fremste navn siden han vant OL-gull i Beijing i 2022, og er blant favorittene foran årets sesong.","url":"https://www.neveitalia.it/sport/scialpino/news/l-equipe-de-france-per-levi-con-14-atleti-noel-1-e-2-nelle-ultime-due-occasioni-punta-al-primo-pettorale-rosso","pub_date":"2026-11-09T19:30:00.000Z","fetched_at":"2026-11-10 08:00:02","lang_orig":"it","category":null,"athletes":"Clement Noel","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":128169,"source_name":"Ski Racing","country":"INT","title_no":"Fra NorAm-debutant til verdenscupstart: Maxi Hoders oppstigningen","title_orig":"From NorAm Rookie to World Cup Start: Maxi Hoder’s Rise","summary_no":"Maxi Hoder har tatt den imponerende veien fra å være nybegynner i NorAm-cupen til å kvalifisere seg for verdenscupen.","spik_no":"Kanadiske Maxi Hoder har tatt et bemerkelsesverdig steg opp gjennom systemet og kvalifisert seg for verdenscupen etter å ha startet karrieren på NorAm-nivå, det nordamerikanske kontinentalcupkretsløpet. NorAm fungerer som et viktig springbrett for unge utøvere i Canada og USA som sikter mot verdenscupen, og det er relativt få som tar spranget raskt. Hoders utvikling følges nøye som et eksempel på nordamerikansk talentutvikling.","url":"https://skiracing.com/maximilien-hoder-world-cup-debut-levi/","pub_date":"2026-11-09T18:20:04.000Z","fetched_at":"2026-11-10 08:00:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":127518,"source_name":"SkinEWS","country":"SUI","title_no":"Bekymringene for Tommaso Sala","title_orig":"Das Bangen um Tommaso Sala","summary_no":"Det er stor bekymring knyttet til Tommaso Salas situasjon.","spik_no":"Den italienske slalåmkjøreren Tommaso Sala skadet seg under trening i Gurgl i Østerrike søndag, og det mistenkes korsbåndskade – selv om endelig diagnose ennå ikke foreligger. Sala skal ha kjent smerter i kneet kort etter start, uten at det var noe fall. 31-åringen har hatt en karriere preget av motgang, og en eventuell korsbåndskade ville være et alvorlig tilbakeslag for en rytter som aldri helt har befestet seg i verdenstoppen i slalåm. Det italienske skiforbundet FISI bekreftet hendelsen mandag.","url":"https://www.skinews.ch/news/2026/bangen-tommaso-sala/","pub_date":"2026-11-09T16:23:22.000Z","fetched_at":"2026-11-09 16:45:04","lang_orig":"de","category":null,"athletes":"Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":126684,"source_name":"SkinEWS","country":"SUI","title_no":"Ramon Zenhäusern klar for sin 138. verdenscupstart","title_orig":"Ramon Zenhäusern vor seinem 138. Weltcup-Start","summary_no":"Sveitsiske Ramon Zenhäusern gjør seg klar til å delta i sin 138. verdenscupkonkurranse i alpint.","spik_no":"Sveitsiske Ramon Zenhäusern stiller til start i sin 138. verdenscupkonkurranse når slalomsesongen 2026/27 åpner i Levi i Finland i november. Den 34 år gamle Oberwalliser-utøveren er en av Sveits' mest erfarne slalomkjørere og har representert Swiss Ski gjennom en lang karriere på øverste nivå. Zenhäusern, som er kjent for sin imponerende høyde på 198 centimeter, har tidligere vunnet verdenscuprenn og VM-medaljer i slalåm og lagkonkurranse. Han inngår i et sveitsisk herrelag som til Levi også teller Loïc Meillard, Daniel Yule og Tanguy Nef.","url":"https://www.skinews.ch/news/2026/zenhaeusern-seinem-weltcup/","pub_date":"2026-11-09T15:29:11.000Z","fetched_at":"2026-11-09 15:30:05","lang_orig":"de","category":null,"athletes":"Camille Rast,Loïc Meillard,Ramon Zenhäusern,Wendy Holdener","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":126648,"source_name":"Ski Racing","country":"INT","title_no":"TA Foundation kunngjør mottakere av SYNC-utøverfondet for 2026/27","title_orig":"TA Foundation Announces 2026/27 SYNC Athlete Fund Recipients","summary_no":"TA Foundation har offentliggjort hvilke utøvere som mottar støtte fra SYNC Athlete Fund for sesongen 2026/27.","spik_no":"TA Foundation har kunngjort mottakerne av SYNC Athlete Fund for sesongen 2026/27, og deler ut totalt 75 000 dollar i stipender til lovende alpinister på senior- og juniorsnivå. Fondet, etablert i 2019 i samarbeid med utstyrsprodusenten SYNC Performance fra Vail, er nå inne i sitt åttende år og har som mål å fjerne økonomiske hindringer for unge utøvere som ønsker å satse på alpint. Støtten dekker treningskostnader, utstyr, reiser og konkurransedeltakelse, og mottakerne velges av en uavhengig komité basert på blant annet økonomisk behov og konkurranseresultater.","url":"https://skiracing.com/ta-foundation-announces-2026-27-sync-athlete-fund-recipients/","pub_date":"2026-11-09T15:15:53.000Z","fetched_at":"2026-11-09 15:30:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":126326,"source_name":"Neveitalia","country":"ITA","title_no":"Meillard er Sveits' store håp i Levi – Zenhäusern klar, Nef jakter første pall","title_orig":"Loic Meillard è il faro della squadra rossocrociata per la \"Levi Black\": Zenhauesern c'è, Nef insegue il primo podio","summary_no":"Loic Meillard er det sveitsiske lagets ledende navn foran «Levi Black»-rennet, mens Ramon Zenhäusern stiller og Tanguy Nef håper på sin første pallplass.","spik_no":"Loic Meillard er Sveits' klare førstevalg i Levi-slalåmen søndag, og han møter til renn med god form etter en sterk andreplass i sesongåpningen i Sölden. 30-åringen fra Héremence er regjerande OL-mester og verdensmester i slalåm, og har en tredjeplass fra nettopp Levi i 2024. Ved hans side stiller Tanguy Nef, som fortsatt jakter sin aller første pallplass i verdensklassen, mens storformede Ramon Zenhäusern også er med i det syvmanns sterke sveitsiske laget.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/loic-meillard-e-il-faro-della-squadra-rossocrociata-per-la-levi-black-zenhauesern-c-e-nef-insegue-il-primo-podio","pub_date":"2026-11-09T14:55:00.000Z","fetched_at":"2026-11-09 15:00:01","lang_orig":"it","category":null,"athletes":"Loïc Meillard,Ramon Zenhäusern,Tanguy Nef","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":125471,"source_name":"Neveitalia","country":"ITA","title_no":"Tommy Sala frykter ny alvorlig skade – mulig korsbåndskade i Gurgl","title_orig":"Per Sala il timore di un altro grave infortunio: Tommy si ferma a Gurgl, l'ipotesi è di un danno al crociato","summary_no":"Tommy Sala måtte bryte av i Gurgl etter mistanke om korsbåndskade, noe som vekker frykt for enda en alvorlig skade i hans karriere.","spik_no":"Tommy Sala måtte bryte treningen i Gurgl med smerter i høyre kne, og frykter nå et nytt korsbåndsbrudd – denne gangen i høyre kne. Den italienske slalomspesialisten skadet for to år siden det venstre korsbåndet under trening i Val Senales og mistet store deler av sesongen. Sala er kjent som en teknisk sterk slalomkjører på det italienske landslaget, og en ny alvorlig skade vil være et hardt slag like før sesongstart. Endelig diagnose ventes i løpet av de nærmeste dagene.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/per-sala-il-timore-di-un-altro-grave-infortunio-tommy-si-ferma-a-gurgl-l-ipotesi-e-di-un-danno-al-crociato","pub_date":"2026-11-09T13:40:00.000Z","fetched_at":"2026-11-09 13:45:02","lang_orig":"it","category":null,"athletes":"Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":125300,"source_name":"Neveitalia","country":"ITA","title_no":"Sveits stiller med ti kvinner til Levi – Rast og Holdener i spissen","title_orig":"Le 10 svizzere per Levi, guidano Rast e Holdener con il ritorno di Braendli. Il Giappone con 5 atleti","summary_no":"Sveits har tatt ut ti utøvere til Levi-rennet, med Rast og Holdener i spissen og Braendli tilbake. Japan stiller med fem utøvere.","spik_no":"Sveits stiller med ti utøvere til slalomåpningen i Levi, med Camille Rast og Wendy Holdener i spissen. Rast, som er regjerende verdensmester, har aldri stått på pallen i Levi og jakter sitt første pallplass på den finske bakken – best hun har gjort der er en femteplass for to sesonger siden. Holdener er derimot en kjenning av Levi-løypa og har stått på pallen fire ganger der. Japan stiller med fem utøvere, blant dem Maeda og debutanten Sakai på kvinnesiden.","url":"https://www.neveitalia.it/sport/scialpino/news/le-10-svizzere-per-levi-guidano-rast-e-holdener-con-il-ritorno-di-braendli-il-giappone-con-5-atleti","pub_date":"2026-11-09T13:20:00.000Z","fetched_at":"2026-11-09 13:30:02","lang_orig":"it","category":null,"athletes":"Camille Rast,Wendy Holdener","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":124098,"source_name":"Neveitalia","country":"ITA","title_no":"Holdener jobber mot Levi – kan hun sikte på slalåmcupen uten Shiffrin?","title_orig":"Holdener, il lavoro a Gurgl e tanta fiducia verso Levi: senza Shiffrin, Wendy può pensare alla coppa di slalom?","summary_no":"Wendy Holdener forbereder seg i Gurgl og stiller med stor selvtillit før Levi. Uten Shiffrin kan sveitseren muligens kjempe om slalåmcupen.","spik_no":"Wendy Holdener forbereder seg til sesongåpningen i Levi 14. november med trening i Gurgl, og fraværet av Mikaela Shiffrin åpner for at sveitseren kan kjempe om slalåmcupen. Holdener har tre ganger endt på pallen i nettopp Levi, men alltid bak Shiffrin. Den 31 år gamle sveitseren har vært på pallen seks ganger i slalåmcupen sammenlagt, men venter fortsatt på en seier – siste individuelle slalåmseier er nå fire år gammel.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/holdener-il-lavoro-a-gurgl-e-tanta-fiducia-verso-levi-senza-shiffrin-wendy-puo-pensare-alla-coppa-di-slalom","pub_date":"2026-11-09T11:40:00.000Z","fetched_at":"2026-11-09 11:45:01","lang_orig":"it","category":null,"athletes":"Mikaela Shiffrin,Wendy Holdener","athlete_nations":["SUI","USA"],"also_sources":[],"norwegian":false},{"id":123810,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrike samler kreftene mot USA","title_orig":"Österreich bündelt Kräfte gegen USA","summary_no":"Østerrike går sammen om å møte utfordringen fra USA i alpint.","spik_no":"Dette er ikke en alpinsak – artikkelteksten handler om ishockey-VM der Østerrike møter USA i A-VM for kvinner i Esbjerg, Danmark. USA er regjerende verdens- og olympiamester og det eneste laget som har stått i finalen i alle 24 VM-turneringer. Østerrike er debutanter på A-nivå og møter et amerikansk lag som innledet turneringen med 7-0 over Sveits.","url":"https://sport.orf.at/stories/3164658/","pub_date":"2026-11-09T11:00:11.000Z","fetched_at":"2026-11-09 11:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122950,"source_name":"Neveitalia","country":"ITA","title_no":"SKI TEST: Dynastar bekrefter Gold Medal-utmerkelse","title_orig":"SKI TEST: Dynastar conferma una Gold Medal","summary_no":"Dynastar befester sin posisjon i ski-testen og mottar nok en ettertraktet Gold Medal-utmerkelse.","spik_no":"Dynastar mottar nok en Gold Medal-utmerkelse i den italienske ski-testen NeveItalia, der testteamet har prøvd ti modeller for sesongen 2026/27. Det franske skimerket, med røtter tilbake til 1956 og sterke tradisjoner innen alpint rennkjøring, befester dermed sin posisjon blant de mest anerkjente produsentene. Årets test løfter spesielt Speed-linjen frem, der Speed Course Master GS R22 fikk utmerkelsen «Scelto dai Tester» for sin presisjon og sporkontroll i GS-kategorien.","url":"https://www.neveitalia.it/test/news/ski-test-dynastar-conferma-la-gold-medal","pub_date":"2026-11-09T09:50:00.000Z","fetched_at":"2026-11-09 10:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122487,"source_name":"SkinEWS","country":"SUI","title_no":"Ti sveitsiske kvinner klar for Levi","title_orig":"Zweistellig – zehn Schweizerinnen in Levi am Start","summary_no":"Hele ti sveitsiske alpinister stiller til start i Levi, et imponerende tosifret antall for Sveits.","spik_no":"Hele ti sveitsiske kvinner er påmeldt til slalåmåpningen i Levi, noe som er et imponerende antall for nasjonen. Sveits har de siste årene styrket seg betydelig i tekniske disipliner på kvinnesiden, med profiler som Wendy Holdener og Michelle Gisin i spissen. Et tosifret startfelt signaliserer god bredde i det sveitsiske landslaget og økt konkurransetrykk internt.","url":"https://www.skinews.ch/news/2026/zweistellig-schweizerinnen-start/","pub_date":"2026-11-09T09:07:22.000Z","fetched_at":"2026-11-09 09:32:44","lang_orig":"de","category":null,"athletes":"Camille Rast,Lara Gut-Behrami,Michelle Gisin,Wendy Holdener","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":122471,"source_name":"Neveitalia","country":"ITA","title_no":"Popovic utgår fra Levi etter ny kneopersjon – fem kroater i renn","title_orig":"Leona Popovic costretta a rinunciare a Levi dopo un altro intervento al ginocchio sinistro, ecco i 5 croati in pista","summary_no":"Leona Popovic er tvunget til å stå over Levi-rennet etter en ny operasjon i venstre kne. Fem kroater stiller likevel til start.","spik_no":"Leona Popovic må stå over Levi-åpningen etter en ny operasjon i venstre kne, et alvorlig tilbakeslag for den kroatiske slalåmstjernen. Popovic er en av de fremste slalåmkjørerne i verdenscupen og har flere pallplasseringer på merittlisten. Kroatia stiller likevel med fem utøvere i Levi, et land som har en sterk tradisjon i tekniske disipliner takket være profiler som Janica Kostelić og Ivica Kostelić fra en tidligere generasjon.","url":"https://www.neveitalia.it/sport/scialpino/news/leona-popovic-costretta-a-rinunciare-a-levi-dopo-un-altro-intervento-al-ginocchio-sinistro-ecco-i-5-croati-in-pista","pub_date":"2026-11-09T08:35:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":"Leona Popovic","athlete_nations":["CRO"],"also_sources":[],"norwegian":false},{"id":122473,"source_name":"Neveitalia","country":"ITA","title_no":"Podiespillet starter i Levi: to slalåmrenn kan endre rankingen før Val di Fassa","title_orig":"Il Gioco dei Podi riparte da Levi: due slalom per cambiare le classifiche e inseguire la Val di Fassa","summary_no":"Levi åpner en ny runde i podiespillet med to slalåmrenn som kan rokke ved stillingene i jakten på Val di Fassa.","spik_no":"Levi åpner slalåmsesongen i Verdenscupen med to renn – damenes lørdag 14. november og herrenes søndag 15. november. Den finske alpinbyen i Lappland er et fast innslag på Verdenscupkalenderen og har gjennom årene vært scene for overraskende resultater. For fantasispillet «Il Gioco dei Podi» hos Neveitalia er Levi-rennet det første store sjansespillet etter åpningen i Sölden, der gigantslalåmen bød på overraskelser blant kvinnene men ga mer forutsigbare resultater blant mennene.","url":"https://www.neveitalia.it/sport/fantasy/giocodeipodi/news/il-gioco-dei-podi-riparte-da-levi-due-slalom-per-cambiare-le-classifiche-e-inseguire-la-val-di-fassa","pub_date":"2026-11-09T07:30:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122476,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen vinner igjen og åpner svensk trippel i andre slalåm i Storklinten – Hansson og Wissting på pallen","title_orig":"Jakobsen cala il bis e apre la tripletta svedese nel secondo slalom a Storklinten: sul podio anche Hansson e Wissting","summary_no":"Jakobsen doblet seg med ny seier i Storklinten og sørget for svensk trippel på pallen, foran Hansson og Wissting.","spik_no":"Kristoffer Jakobsen vant begge FIS-slalåmrennene i Storklinten og sørget for svensk trippel i søndagens renn, der Hansson og Wissting fulgte på pallen. Den 32 år gamle svenske spesialisten hadde en tung Verdenscup-sesong i fjor der han knapt scoret poeng, men viser nå sterk form en uke før sesongåpningen i Levi. Belgiernes Armand Marchant, som nesten tok sin første seier i Gurgl forrige sesong, deltok bare i lørdagens renn og endte da som toer, over ett sekund bak Jakobsen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/jakobsen-cala-il-bis-e-apre-la-tripletta-svedese-nel-secondo-slalom-a-storklinten-sul-podio-anche-hansson-e-wissting","pub_date":"2026-11-08T10:35:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":"sportslig","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122477,"source_name":"Neveitalia","country":"ITA","title_no":"SKI TEST: alle Blizzard-ski testet for deg","title_orig":"SKI TEST: tutti i Blizzard provati per voi!","summary_no":"En grundig gjennomgang av samtlige Blizzard-ski som er testet denne sesongen.","spik_no":"Neveitalia har testet 14 Blizzard-ski for sesongen 2026/27, og Firebird-linjen dominerer sortimentet med to nye toppmodeller. Firebird Race Type LT er en ny GS-ski beregnet på brede buer og erfarne kjørere med kraft og teknikk, mens Firebird Race Type MT retter seg mot allround-performance med racingegenskaper. Firebird WRC fikk utmerkelsen «Valgt av testerne» og roses for sin stabilitet, spigelfeste og aggressive kjøreegenskaper.","url":"https://www.neveitalia.it/test/news/ski-test-tutti-i-blizzard-provati-per-voi","pub_date":"2026-11-08T09:30:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122478,"source_name":"Neveitalia","country":"ITA","title_no":"Valérie Grenier i gang med kjerneøvelser to uker etter operasjon: – Jeg har fortsatt ambisjoner for karrieren","title_orig":"Primi esercizi di core per Valérie Grenier, che torna a parlare due settimane dopo l'intervento: \"Ho ancora ambizioni per la mia carriera\"","summary_no":"To uker etter inngrepet er Grenier i gang med rehabilitering og forsikrer at hun ikke er ferdig med alpinkarrieren.","spik_no":"Kanadiske Valérie Grenier er i gang med rehabilitering to uker etter korsband- og meniskoperasjon i høyre kne – en skade hun pådro seg uten å falle, bare en uke før sesongåpningen i Sölden. Det er hennes andre alvorlige kneoperasjon på under tre år, etter det alvorlige ulykken i Cortina i 2024. Grenier hadde store ambisjoner for inneværende sesong etter at hun vant gigantslalåm for tredje gang i karrieren under finalene i Hafjell i vår, men er nå henvist til en lang vei tilbake.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/primi-esercizi-di-core-per-valerie-grenier-che-torna-a-parlare-due-settimane-dopo-l-intervento-ho-ancora-ambizioni-per-la-mia-c","pub_date":"2026-11-08T08:25:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":122479,"source_name":"Neveitalia","country":"ITA","title_no":"Sesongen starter i Copper Mountain – norske utøvere med første treningsdag i Nakiska under ledelse av Sejersted","title_orig":"Mentre comincia la stagione a Copper Mountain, ieri a Nakiska il primo giorno in pista dei norge guidati da Sejersted","summary_no":"Mens Copper Mountain åpner sesongen, hadde det norske laget sin første dag på pisten i Nakiska med Sejersted som leder.","spik_no":"Det norske alpinlandslaget hadde sin første treningsdag på pisten i Nakiska i Canada under ledelse av Adrian Sejersted, mens den nordamerikanske sesongen formelt åpnet i Copper Mountain i Colorado. Den 32 år gamle Sejersted, som tok VM-bronse i super-G, er en av ankerpunktene i det norske fartslaget og returnerte til Verdenscup-pallen i utfor på Beaver Creek forrige sesong etter fem års pause. Aleksander Aamodt Kilde var ikke til stede i Nakiska, mens Moeller og Sellaeg var med i troppen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/mentre-comincia-la-stagione-a-copper-mountain-ieri-a-nakiska-il-primo-giorno-in-pista-dei-norge-guidati-da-sejersted","pub_date":"2026-11-08T07:25:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122480,"source_name":"Neveitalia","country":"ITA","title_no":"SKI TEST: seksten Atomic-ski testet – kjente modeller og nyheter vurdert","title_orig":"SKI TEST: sedici Atomic testati per voi, tra conferme e nuove proposte","summary_no":"Seksten Atomic-ski er satt under lupen, med en blanding av etablerte modeller og nye alternativer for sesongen.","spik_no":"Neveitalia har testet 16 Atomic-ski for sesongen 2026/27, og Redster-linjen utmerker seg med fem utmerkelser som «Valgt av testerne» og én Gold Medal. Redster G9 RS Revoshock ble valgt som beste racecarver GS-ski for sin stabilitet og presisjonen i høy fart, mens den nye Volant-linjen styrker piste-sortimentet. Atomic er et av de mest brukte merkene blant Verdenscup-utøvere og har lang tradisjon for å forsyne rennkjørere på toppnivå.","url":"https://www.neveitalia.it/test/news/ski-test-sedici-atomic-testati-per-voi-tra-conferme-e-nuove-proposte","pub_date":"2026-11-07T15:25:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122481,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen foran Marchant i FIS-slalåm i Storklinten – store navn i aksjon før Levi","title_orig":"Jakobsen davanti a Marchant, lo slalom FIS a Storklinten è da firme \"pesanti\" prima di Levi","summary_no":"Storklinten-slalåmen samlet tunge navn før Levi-rennet, med Jakobsen som vinner foran Marchant.","spik_no":"Kristoffer Jakobsen dominerte det første FIS-slalåmrennet i Storklinten i Sverige, og slo belgiske Armand Marchant med over ett sekund. Den 32 år gamle svenske veteranen hadde en svak Verdenscup-sesong i 2024/25 der en 13.-plass i Kitzbühel var sesongens beste resultat, og viste dermed sterk form med en uke igjen til Levi-åpningen. Blant damene vant unge norske Holen, og arrangementet fungerer som et viktig oppkjøringsrenn for nasjonale tropper som trener i regionen før Verdenscup-starten.","url":"https://www.neveitalia.it/sport/scialpino/news/jakobsen-davanti-a-marchant-lo-slalom-fis-a-storklinten-e-da-firme-pesanti-prima-di-levi","pub_date":"2026-11-07T14:00:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122482,"source_name":"Neveitalia","country":"ITA","title_no":"To uker etter Søldenshocken er Julia Scheib tilbake på snøen i Hippach – forbereder Killington","title_orig":"A due settimane dallo shock di Soelden, ecco Julia Scheib in pista sotto la neve di Hippach: la stiriana prepara Killington","summary_no":"Den østerrikske alpinisten Scheib er tilbake på ski i Hippach, bare to uker etter den dramatiske hendelsen i Sölden, med Killington som neste mål.","spik_no":"Julia Scheib er tilbake på ski i Hippach i Zillertal, to uker etter at hun røk ut i første omgang i Sölden da hun lå an til å kjøre fort nok til å vinne. Den østerrikske stirianeren regnes som klar favoritt i gigantslalåm og var kuppet av Verdenscupen i fjor da hun vant spesialitetsglobe. Neste mål er Killington i Vermont 29. november, der Scheib var syvende i 2023 men røk ut siste gang det ble kjørt gigant på «Superstar»-løypa.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/a-due-settimane-dallo-shock-di-soelden-ecco-julia-scheib-in-pista-sotto-la-neve-di-hippach-la-stiriana-prepara-killington","pub_date":"2026-11-07T13:20:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":null,"athletes":"Julia Scheib","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":122488,"source_name":"SkinEWS","country":"SUI","title_no":"Feller hopper over Levi – Pertl tar plassen","title_orig":"Manuel Feller verzichtet auf den Levi-Start, Adrian Pertl rückt nach","summary_no":"Manuel Feller trekker seg fra rennet i Levi, og Adrian Pertl rykker opp på laget som erstatning.","spik_no":"Manuel Feller trekker seg fra slalåmrennet i Levi, og Adrian Pertl rykker inn som erstatning på det østerrikske laget. Feller er en av Østerrikes mest meritterte slalåmkjørere og vant slalåmcupen sammenlagt i 2023/24-sesongen. Pertl er en teknisk sterk kjører som selv har vært på pallen i verdenscupen, og er et naturlig valg som reserve for det østerrikske alpinlandslaget.","url":"https://www.skinews.ch/news/2026/manuel-feller-verzichtet/","pub_date":"2026-11-07T11:21:53.000Z","fetched_at":"2026-11-09 09:32:44","lang_orig":"de","category":null,"athletes":"Adrian Pertl,Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":122451,"source_name":"Ski Racing","country":"INT","title_no":"USAs regionale utviklingsprogram gjøres klart for vinteren","title_orig":"U.S. Regional Development Program Prepares for Winter","summary_no":"Det amerikanske regionale utviklingsprogrammet i alpint forbereder seg til den kommende vintersesongen.","spik_no":"Det amerikanske regionale utviklingsprogrammet (RDP) for alpint har hatt en aktiv sesongforberedelse med treningsleire i Ushuaia, New Zealand og Corralco, samt innendørs is- og brevreening i Europa. Over 80 utøvere fra 25 klubber har deltatt i programmet denne høsten, og i fjor økte andelen amerikanske juniorutøvere rangert blant verdens 300 beste med over 20 prosent. Det amerikanske herrelandslaget deler nå førsteplassen med Italia i internasjonale juniorsammenligninger, og programmet retter seg nå mot NorAm Cup-sesongen.","url":"https://skiracing.com/u-s-regional-development-program-prepares-for-winter/","pub_date":"2026-11-06T22:58:13.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122452,"source_name":"Ski Racing","country":"INT","title_no":"USSS Central Division legger frem alpinkalender for 2026–27","title_orig":"USSS Central Division 2026–27 Alpine Race Calendar: CR1, CR2 and CR3","summary_no":"USSS Central Division har offentliggjort rennkalenderen for alpinsesongen 2026–27, med CR1-, CR2- og CR3-løp.","spik_no":"USSS Central Division har offentliggjort alpinkalenderen for 2026/27-sesongen, som spenner fra desember til mars og inkluderer FIS-renn, FIS Entry League og regionale løp fordelt på tre soner: CR1 (Minnesota og Dakotas), CR2 (Wisconsin og Illinois-området) og CR3 (Michigan og Ohio-regionen). En viktig nyhet for sesongen er at alle FIS-deltakere nå må bruke kuttsikker beskyttelse med minst 3-stjerners sertifisering. Kalenderutgivelsen gjør det mulig for utøvere og familier å planlegge sesongen på tvers av de ulike nivåene og regionene.","url":"https://skiracing.com/central-division-2026-27-alpine-race-calendar/","pub_date":"2026-11-06T21:14:23.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":122453,"source_name":"Ski Racing","country":"INT","title_no":"Møt Lionel Agoutin – mannen bak Ski World Cup-bannerne","title_orig":"Meet Lionel Agoutin, the Man Behind the Ski World Cup Banners","summary_no":"Lionel Agoutin er personen som lager de ikoniske bannerne langs traseen under alpinske verdenscuprenn.","spik_no":"Lionel Agoutin er mannen bak de fargerike bannerne som preger tribunene under alpinske verdenscuprenn verden over. Den franske entusiasten driver Alpine Ski World Cup Fan Community og lager bannerne selv – med nasjonale teamfarger og portretter av utøvere fra hele startfeltet. Bannerne er ikke et kommersielt produkt fra FIS eller forbundene, men resultatet av én manns dedikasjon til sporten og fellesskapet rundt den. Agoutin er et kjent ansikt i verdenscupen og har blant annet blitt fotografert sammen med stjerner som Lindsey Vonn.","url":"https://skiracing.com/meet-lionel-agoutin-the-man-behind-the-ski-world-cup-banners/","pub_date":"2026-11-06T20:19:31.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":"goy","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":121331,"source_name":"Neveitalia","country":"ITA","title_no":"Fem fartskjørere i Europa Cup-troppen til treningsleir i Pitztal","title_orig":"Cinque velocisti del team Coppa Europa per una settimana abbondante a Pitztal. Le prime discese del circuito a S. Caterina","summary_no":"Fem fartsspesialister fra Europa Cup-laget samles til en drøy uke med trening i Pitztal. De første utforrennene i kretsen arrangeres i Santa Caterina.","spik_no":"Fem italienske Europa Cup-fartsspesialister samles til treningsleir på Pitztal-breen i Tirol fra 8. til 16. november. Utøverne Emanuel Lamp, Leonardo Rigamonti, Luca Ruffinoni, Glauco Antonioli og Pietro Broglio trener under ledelse av teknisk direktør Massimo Carca, med tidligere Verdenscup-utøver Matteo Marsaglia blant trenerstaben. Pitztal er et populært tidligsesongsalternativ for alpin trening ettersom breen gir snøsikre forhold allerede om høsten. Sesongens første Europa Cup-utforrenn er satt til Santa Caterina, og rennsessongen ventes å komme i gang for fullt mot midten av desember.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/cinque-velocisti-del-team-coppa-europa-per-una-settimana-abbondante-a-pitztal-le-prime-discese-del-circuito-a-s-caterina","pub_date":"2026-11-06T16:00:00.000Z","fetched_at":"2026-11-06 16:15:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":121025,"source_name":"SkinEWS","country":"SUI","title_no":"Olympiamester Michaela Dorfmeister støtter innendørs skihall","title_orig":"Olympiasiegerin Michaela Dorfmeister macht sich für eine Skihalle stark","summary_no":"Den tidligere olympiske mesteren Michaela Dorfmeister går inn for bygging av en innendørs skihall.","spik_no":"Den østerrikske alpinlegenden Michaela Dorfmeister støtter planene om å bygge en innendørs skihall. Dorfmeister er en av Østerrikes mest meritterte alpinister og vant to gull under OL i Torino i 2006, i utfor og super-G. Etter karrieren har hun engasjert seg i alpinsportens utvikling, og hennes støtte til innendørsskianlegg kan bidra til å sikre rekruttering og trening uavhengig av snøforhold – noe som er stadig mer aktuelt i en tid med klimaendringer.","url":"https://www.skinews.ch/news/2026/olympiasiegerin-michaela-dorfmeister/","pub_date":"2026-11-06T15:39:53.000Z","fetched_at":"2026-11-06 15:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":120733,"source_name":"ORF Sport","country":"AUT","title_no":"Rusty-Jake Rodriguez sikrer seg Grand Slam-billett","title_orig":"Rusty-Jake Rodriguez schnappt sich Grand-Slam-Ticket","summary_no":"Rusty-Jake Rodriguez har kvalifisert seg til Grand Slam i alpint.","spik_no":"Artikkelteksten handler om darts, ikke alpint – Rusty-Jake Rodriguez kvalifiserte seg til PDC Grand Slam i darts i Wolverhampton, ikke til et alpinarrangement. Siden dette ikke er en alpinsak, finnes det ingen relevant bakgrunn å gi fra alpinsporten. Det ser ut til å ha oppstått en feil i kildematerialet som er sendt inn.","url":"https://sport.orf.at/stories/3164594/","pub_date":"2026-11-06T15:08:17.000Z","fetched_at":"2026-11-06 15:15:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":120607,"source_name":"Expressen","country":"SWE","title_no":"Damlandslaget med marerittstart i VM","title_orig":"Damkronornas mardrömsstart i VM","summary_no":"Det svenske damlandslaget i alpint fikk en svært dårlig start på verdensmesterskapet.","spik_no":"Det svenske damlandslaget i ishockey fikk en svært tung start på VM i Herning, og lå under 0–3 mot Canada etter første periode. Målene ble scoret av Jessie Eldridge, Emily Clark og Rebecca Leslie. Sverige regnes som en av de sterkere nasjonene i internasjonal damishockey, men møter et canadisk lag som tradisjonelt dominerer VM-turneringene. Svenske Lina Ljungblom erkjente at laget måtte løfte seg betraktelig med pucken for å holde seg i kampen.","url":"https://www.expressen.se/sport/hockey/damkronornas-mardromsstart-i-vm/","pub_date":"2026-11-06T14:51:29.000Z","fetched_at":"2026-11-06 15:00:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":119580,"source_name":"Neveitalia","country":"ITA","title_no":"Wiley Maple avslutter karrieren med utforkjøringene i Beaver Creek","title_orig":"Wiley Maple saluterà il circo bianco con le discese di Beaver Creek: 19° a Kitz pochi mesi fa, il veterano USA ha deciso di fermarsi","summary_no":"Den erfarne amerikanske alpinisten Wiley Maple legger opp og avslutter karrieren under utforkjøringene i Beaver Creek. Han ble nummer 19 i Kitzbühel for noen måneder siden.","spik_no":"Wiley Maple avslutter karrieren under utforkjøringene i Beaver Creek 3.–4. desember — i sitt eget hjemfylke Colorado. Den 36 år gamle amerikaneren, som er født nettopp i Colorado, har lenge vært utenfor det nasjonale støtteapparatet og måtte finansiere sesongen selv. At han likevel klarte 19.-plass på den beryktet krevende Streif i Kitzbühel denne sesongen, understreker klassen hans. Hans beste resultat gjennom karrieren var en 12.-plass i utfor i Bormio for tre år siden.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/wiley-maple-salutera-il-circo-bianco-con-le-discese-di-beaver-creek-19-a-kitz-pochi-mesi-fa-il-veterano-usa-ha-deciso-di-fermar","pub_date":"2026-11-06T13:20:00.000Z","fetched_at":"2026-11-06 13:30:02","lang_orig":"it","category":null,"athletes":"Wiley Maple","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":103287,"source_name":"Neveitalia","country":"ITA","title_no":"SC Courmayeur tar imot Brignone igjen: – En forelder holder alltid døren åpen","title_orig":"\"Un genitore lascia sempre la porta aperta, Fede è rimasta la ragazza che ama sciare in libertà\": lo S.C. Courmayeur riaccoglie Brignone","summary_no":"Federica Brignone ønskes velkommen tilbake til skiklubben SC Courmayeur, som beskriver henne som jenta som alltid har elsket å stå fritt på ski.","spik_no":"Federica Brignones hjemklubb SC Courmayeur ønsker henne hjertelig velkommen tilbake og beskriver henne som «jenta som alltid har elsket å stå fritt på ski». Nyheten kommer dagen etter at Brignone kunngjorde at hun forlater sin stilling i Carabinieri, den italienske militærenheten mange alpinister er tilknyttet. Den 34-årige alpinisten fra La Salle er Italias mestvinnende utøver gjennom tidene med to olympiske gull og over 30 verdenscupseire, og er nå i gang med oppkjøringen mot en ny comeback-sesong etter skade.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-genitore-lascia-sempre-la-porta-aperta-fede-e-rimasta-la-ragazza-che-ama-sciare-in-liberta-lo-sc-courmayeur-riaccoglie-brign","pub_date":"2026-11-03T11:25:00.000Z","fetched_at":"2026-11-03 11:30:02","lang_orig":"it","category":"naert","athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":100827,"source_name":"RTV SLO","country":"SLO","title_no":"Houthi-raketter tvang asiatisk mesterskap fra januar til desember 2027","title_orig":"Rakete hutijev prestavile azijsko prvenstvo z januarja na december 2027","summary_no":"Asiatisk mesterskap i alpint er blitt flyttet fra januar til desember 2027 som følge av houthi-rakettangrep.","spik_no":"Det asiatiske alpinmesterskapet er flyttet fra januar til desember 2027 på grunn av houthi-rakettangrep i regionen. Houthi-bevegelsen i Jemen har siden 2023 gjennomført en rekke angrep mot skip og mål i Rødehavet og omkringliggende områder, noe som har skapt usikkerhet og sikkerhetsproblemer for arrangementer i nærheten. Det er uvanlig at geopolitiske konflikter direkte påvirker internasjonale alpinarrangementer, og beslutningen understreker hvor stor rekkevidden av konflikten har blitt.","url":"https://www.rtvslo.si/sport/rakete-hutijev-prestavile-azijsko-prvenstvo-z-januarja-na-december-2027/798849","pub_date":"2026-11-03T07:07:24.000Z","fetched_at":"2026-11-03 07:30:05","lang_orig":"sl","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":76731,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn klar for siste operasjon: – Mentalt tøff nedtelling","title_orig":"\"Countdown duro mentalmente, tra meno di due settimane mi opero\": Lindsey Vonn verso l'ultimo intervento alla gamba","summary_no":"Lindsey Vonn skal operere benet om mindre enn to uker og beskriver ventetiden som mentalt krevende.","spik_no":"Lindsey Vonn er klar for det hun beskriver som sin siste operasjon, og sier ventetiden på under to uker er mentalt krevende. Inngrepet innebærer fjerning av skruer og plater i venstre tibia, samt en operasjon på korsbåndet. Vonn, som er en av tidenes mestvinnende alpinister med 82 verdenscupseirer og OL-gull i utfor fra 2010, har tilbrakt store deler av 2026 med rehabilitering etter en alvorlig skade hun pådro seg tidligere i år. I høst har hun jobbet intenst i treningssalen for å styrke muskulaturen før det avsluttende inngrepet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/countdown-duro-mentalmente-tra-meno-di-due-settimane-mi-opero-lindsey-vonn-verso-l-ultimo-intervento-alla-gamba","pub_date":"2026-10-28T13:30:00.000Z","fetched_at":"2026-10-28 13:45:02","lang_orig":"it","category":"nyheter","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":59459,"source_name":"ORF Sport","country":"AUT","title_no":"Rennkalenderen skaper igjen debatt","title_orig":"Rennkalender sorgt erneut für Diskussionen","summary_no":"Alpinski-rennkalenderen er nok en gang gjenstand for diskusjon blant utøvere og organisasjoner.","spik_no":"Verdenscupkalenderen for alpint 2026/27 inneholder 40 renn for kvinner og 43 for menn, men balansen mellom fart- og teknikkøvelser er igjen skjev – særlig for kvinner, der teknikkrenn dominerer klart. Østerrike er største vertsland med 15 verdenscupavdelinger, inkludert en ny stopp i Dachstein West/Gosau. Østerriksk dametrener Johannes Zöchling peker på at logistikk og mange motstridende interesser gjør kalenderarbeidet svært krevende, og beklager at det ikke er fartshjemerenn for østerrikske kvinner denne vinteren.","url":"https://sport.orf.at/stories/3163844/","pub_date":"2026-10-24T07:43:47.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":48079,"source_name":"Neveitalia","country":"ITA","title_no":"Atomic og Braathen sammen til 2030 – sikter mot den store krystallkulen","title_orig":"Atomic e Lucas Pinheiro Braathen assieme sino al 2030: il prossimo obiettivo è la sfera di cristallo assoluta","summary_no":"Atomic og Lucas Pinheiro Braathen har forlenget samarbeidet til 2030, med den sammenlagte verdenscupseieren som neste store mål.","spik_no":"Lucas Pinheiro Braathen og utstyrsmerket Atomic har forlenget samarbeidet sitt frem til 2030, med den store krystallkulen – sammenlagttittelen i verdenscupen – som overordnet mål. Braathen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåmkula i 2022–23-sesongen og har etablert seg blant verdens beste teknikkjørere. En sammenlagtseier vil kreve at han hevder seg også utenfor slalåm, noe som gjenstår å bevise.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/atomic-e-lucas-pinheiro-braathen-assieme-sino-al-2030-il-prossimo-obiettivo-e-la-sfera-di-cristallo-assoluta","pub_date":"2026-10-21T10:20:00.000Z","fetched_at":"2026-10-22 10:54:36","lang_orig":"it","category":"viktig","athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":46668,"source_name":"SVT Sport","country":"SWE","title_no":"Treningsbildene av Anna Swenn-Larsson spres: «Viralt»","title_orig":"Träningsbilderna på Anna Swenn-Larsson sprids: ”Viralt”","summary_no":"Bilder av Anna Swenn-Larsson under trening sprer seg raskt på nett og har blitt et viralt fenomen.","spik_no":"Anna Swenn-Larsson har skapt oppmerksomhet på sosiale medier etter at treningsvideoer av henne har spredt seg viralt, blant annet med kommentarer fra alpinlegender som Anja Pärson og Lindsey Vonn. Den svenske slalåmstjernen, som er 35 år, vant bronsemedalje i slalåm under OL i Milano Cortina og regnes som en av de mest erfarne utøverne i verdenscupen. Swenn-Larsson er ydmyk overfor oppmerksomheten og påpeker at hardt treningsarbeid er normalt i alpinmiljøet. Til helgen er hun klar for verdenscuppremieren i Sölden 24. oktober.","url":"https://www.svt.se/sport/alpint/traningsbilderna-pa-anna-swenn-larsson-sprids-viralt","pub_date":"2026-10-20T07:51:11.000Z","fetched_at":"2026-10-20 08:00:04","lang_orig":"sv","category":"naert","athletes":"Anna Swenn-Larsson","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":31695,"source_name":"Ski Racing","country":"INT","title_no":"Breezy Johnson stiller spørsmål ved rettferdigheten i FIS' skivektregel","title_orig":"Breezy Johnson Questions Fairness of FIS Ski Weight Rule","summary_no":"Den amerikanske alpinisten Breezy Johnson kritiserer FIS-regelen om minimumsvekt på ski og mener den ikke er rettferdig.","spik_no":"Amerikanske Breezy Johnson, olympisk mester og verdensmester i utforkjøring, stiller spørsmål ved rettferdigheten i FIS' nye regel om minimumsvekt på racingski. Johnson sier at sommertrening på myk og jevn snø ikke har avslørt noen merkbar forskjell med de nye skiene, men understreker at renn på tøffe verdenscupbakker er en helt annen sak. Hun er særlig bekymret for regelens begrunnelse og mener den rammer et lite antall utøvere uforholdsmessig hardt. Johnson, som kjører på Atomi function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';
  if (days <= 45) return '🎿 Forsesong — ' + nxt.venue + ' om ' + days + ' dager';
  return '💤 Sommerpause';
}
document.getElementById('season-badge').textContent = seasonStatus();

function getRace(str) {
  if (!str) return null;
  const d = new Date(str);
  if (isNaN(d)) return null;
  const s = d.toISOString().slice(0,10);
  return RACES.find(r => s >= r.date && s <= r.end) || null;
}

function fmt(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' kl. ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function cardHtml(a, compact) {
  const title = a.title_no || a.title_orig;
  const race = getRace(a.pub_date || a.fetched_at);
  if (compact) {
    return `<div class="spik-card">
      <div class="spik-card-meta">
        <span class="src src-${a.country}">${a.source_name}</span>
        ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
        <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
      </div>
      <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="spik-card-title">${title}</a>
      ${a.spik_no ? `<div class="spik-card-body">${a.spik_no}</div>` : ''}
    </div>`;
  }
  return `<div class="card${a.norwegian ? ' card-nor' : ''}">
    <div class="card-meta">
      <span class="src src-${a.country}">${a.source_name}</span>
      ${a.norwegian ? '<span class="nor-chip">🇳🇴 Norsk</span>' : ''}
      ${a.also_sources && a.also_sources.length ? `<span class="multi-chip" title="Også dekket av: ${a.also_sources.join(', ')}">📰 ${a.also_sources.length + 1} kilder</span>` : ''}
      ${a.lang_orig && a.lang_orig !== 'no' ? `<span class="lang">${a.lang_orig.toUpperCase()} → NO</span>` : ''}
      ${a.athletes ? `<span style="font-size:10px;color:var(--sportslig)">👤 ${a.athletes.split(',')[0]}</span>` : ''}
      ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
      ${race ? `<span class="race-chip">🏁 ${race.venue}</span>` : ''}
      <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
    </div>
    <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="card-title">${title}</a>
    ${a.summary_no ? `<p class="card-summary">${a.summary_no}</p>` : ''}
    ${a.spik_no ? `<div class="card-spik"><span class="spik-label">📻 SPIK</span><span class="spik-text">${a.spik_no}</span></div>` : ''}
  </div>`;
}

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function render() {
  renderFilterRow();
  const words = norm(searchQ).split(/\s+/).filter(Boolean);
  const pool = words.length && extraLoaded ? ARTICLES_ALL : ARTICLES;
  const visible = pool.filter(a => {
    if (activeCountry === 'INT' ? a.country !== 'INT' : (activeCountry && !(a.athlete_nations || []).includes(activeCountry))) return false;
    if (activeCat && a.category !== activeCat) return false;
    if (activeAthlete && !(a.athletes||'').split(',').map(s=>s.trim()).includes(activeAthlete)) return false;
    if (words.length) {
      const hay = norm([a.title_no, a.title_orig, a.summary_no, a.spik_no, a.athletes, a.source_name, (a.also_sources||[]).join(' '), a.category,
        ...(a.athlete_nations||[]).map(c => c + ' ' + ((NATION_META[c]||[])[1]||''))].filter(Boolean).join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });

  document.getElementById('count').textContent = visible.length + ' saker';

  const feed = document.getElementById('feed');
  feed.innerHTML = visible.length
    ? visible.map(a => cardHtml(a, false)).join('')
    : `<div class="empty">${words.length || activeCountry || activeCat || activeAthlete ? 'Ingen treff' : 'Ingen saker'}</div>`;

  // Spik-liste: vis alle kategoriserte (ufiltrert på land/utøver/søk for sidepanelet, men respekter kategori-filter)
  const spikFilter = activeCat
    ? ARTICLES.filter(a => a.category === activeCat)
    : ARTICLES.filter(a => a.category);

  const spikEl = document.getElementById('spik-list');
  const spikLabel = document.getElementById('spik-label');
  spikLabel.textContent = 'Spik-liste (' + spikFilter.length + ')';

  if (!spikFilter.length) {
    spikEl.innerHTML = '<div class="sidebar-empty">Ingen saker valgt ut ennå</div>';
    return;
  }

  // Grupper etter kategori
  const grouped = {};
  CATS.forEach(c => { grouped[c.id] = []; });
  spikFilter.forEach(a => { if (grouped[a.category]) grouped[a.category].push(a); });

  spikEl.innerHTML = CATS.map(cat => {
    const items = grouped[cat.id];
    if (!items.length) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--${cat.id === 'goy' ? 'goy' : cat.id});padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${cat.label}</div>
      ${items.map(a => cardHtml(a, true)).join('')}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
