orholdene i Beaver Creek og gitt grønt lys for herrenes verdenscuprenn i Colorado 3.–6. desember. Programmet inneholder to utfor-renn, et super-G og en storslalåm – og markerer starten på de klassiske nordamerikanske vinterdestinasjonene i verdenscupkalenderen. Beaver Creek er en av de mest prestisjefylte arenaene på herrenes program, kjent for den teknisk krevende Birds of Prey-bakken.","url":"https://sport.orf.at/stories/3165350/","pub_date":"2026-11-23T17:46:07.000Z","fetched_at":"2026-11-23 19:52:44","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206658,"source_name":"Neveitalia","country":"ITA","title_no":"Beaver Creek klart: fire herrerenn bekreftet 3.–6. desember","title_orig":"Beaver Creek ce l'ha fatta: superato il controllo neve, è confermato il poker di gare maschili dal 3 al 6 dicembre","summary_no":"Beaver Creek har bestått snøkontrollen og er klar for fire herrerenn i desember. Rennene er offisielt bekreftet av FIS.","spik_no":"FIS bekreftet offisielt fire herrerenn i Beaver Creek i perioden 3.–6. desember etter at snøkontrollen var bestått. Beaver Creek arrangerer tradisjonelt Birds of Prey-helgen, som er en av de mest prestisjefylte på herresirkusen med utfor og super-G i Colorado. Løypen er kjent for sin tekniske krevende karakter og bratte partier som tester kjørerne til det ytterste, og rennet trekker alltid et stort internasjonalt publikum.","url":"https://www.neveitalia.it/sport/scialpino/news/beaver-creek-ce-l-ha-fatta-superato-il-controllo-neve-e-confermato-il-poker-di-gare-maschili-dal-3-al-6-dicembre","pub_date":"2026-11-23T17:45:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206671,"source_name":"SkinEWS","country":"SUI","title_no":"FIS gir grønt lys for rennene i Beaver Creek","title_orig":"FIS gibt für die Rennen in Beaver Creek „grünes Licht“","summary_no":"Det internasjonale skiforbundet FIS har godkjent avviklingen av rennene i Beaver Creek.","spik_no":"FIS har gitt klarsignal for verdenscuprennene i Beaver Creek etter at en snøkontroll mandag 23. november ga positivt resultat. Kontrollen ble utsatt to dager, men lave temperaturer og noe natursnø har sikret tilstrekkelig underlag til å preparere den berømte «Birds of Prey»-løypa. Rennene er planlagt i perioden 3. til 6. desember, og Beaver Creek er et av alpinens mest tradisjonsrike steder for fart.","url":"https://www.skinews.ch/news/2026/rennen-beaver-gruenes/","pub_date":"2026-11-23T17:41:41.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206659,"source_name":"Neveitalia","country":"ITA","title_no":"Meillard går glipp av super-G i Copper – Piller trekker seg fra Killington","title_orig":"Niente super-g a Copper per Loic Meillard, ecco lo squadrone svizzero per il Colorado. Piller rinuncia a Killington","summary_no":"Loic Meillard er ikke med i den sveitsiske troppen til super-G i Copper Mountain. Piller har også trukket seg fra konkurransen i Killington.","spik_no":"Loic Meillard var ikke med i den sveitsiske troppen til super-G i Copper Mountain, noe som vakte oppsikt gitt hans sterke form i tekniske disipliner. Meillard er en allsidig kjører som har markert seg i både slalåm, storslalåm og kombinerte disipliner gjennom karrieren. I tillegg trakk Piller seg fra konkurransen i Killington, noe som svekket startfeltet ytterligere i det som er et travelt program tidlig i sesongen.","url":"https://www.neveitalia.it/sport/scialpino/news/niente-super-g-a-copper-per-loic-meillard-ecco-lo-squadrone-svizzero-per-il-colorado-piller-rinuncia-a-killington","pub_date":"2026-11-23T17:10:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":"Loïc Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":206787,"source_name":"franceinfo","country":"FRA","title_no":"Sarrazin klar for super-G nesten to år etter alvorlig fall i Bormio","title_orig":"Près de deux ans après sa grave chute à Bormio, le skieur français Cyprien Sarrazin annoncé sur le super-G de la prochaine étape de Coupe du monde","summary_no":"Franske Cyprien Sarrazin er nominert til super-G i neste verdenscupetappe, nesten to år etter sitt alvorlige fall i Bormio.","spik_no":"Cyprien Sarrazin er nominert til super-G i Copper Mountain, og gjør dermed comeback i verdenscupen nesten to år etter det alvorlige fallet i Bormio i desember 2024, der han pådro seg en hjerneblødning. Den franske alpinismen var i strålende form før ulykken og vant utfor-rennet i Kitzbühel to ganger på rad i 2024. Sarrazin er 32 år og representerer Frankrike, som har en sterk tradisjon i utfor- og super-G-greinene. Rennet i Copper Mountain, USA, finner sted lørdag.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/pres-de-deux-ans-apres-sa-grave-chute-a-bormio-le-skieur-francais-cyprien-sarrazin-annonce-sur-le-super-g-de-la-prochaine-etape-de-coupe-du-monde_8296386.html#xtor=RSS-3-%5Bsports%2Fsports-d-hiver%2Fski-alpin%5D","pub_date":"2026-11-23T16:38:02.000Z","fetched_at":"2026-11-23 19:52:45","lang_orig":"fr","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":206672,"source_name":"SkinEWS","country":"SUI","title_no":"Flere comebacks og en forsinket debut i Copper Mountain","title_orig":"Mehrere Comebacks und eine verspätete Premiere in Copper Mountain","summary_no":"Flere utøvere gjør comeback i Copper Mountain, samtidig som én utøver endelig får sin forsinkede verdenscupdebut.","spik_no":"I Copper Mountain kjøres det super-G lørdag 28. november og storslalåm dagen etter som en del av herrenesernes verdenscupåpning for fartsøvelsene i 2026/27-sesongen. Det sveitsiske laget stiller med en sterk troika bestående av Marco Odermatt, Franjo von Allmen og Loic Meillard, men flere utøvere gjør også comeback etter skader, og én kjører venter på sin forsinkede verdenscupdebut. Rennarenaen i Colorado er et relativt nytt tilskudd til verdenscupkalenderen.","url":"https://www.skinews.ch/news/2026/comebacks-verspaetete-premiere/","pub_date":"2026-11-23T14:39:40.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206664,"source_name":"Neveitalia","country":"ITA","title_no":"Skitest: Vi har testet Head 2027-kolleksjonen","title_orig":"SKI TEST: abbiamo testato la nuova gamma Head 2027","summary_no":"Den nye Head-skikolleksjonen for 2027 er satt under lupen i en grundig skitest.","spik_no":"Head er et av de ledende skimerkene i alpinsporten og utstyrer en rekke toppkjørere på verdenscupsirkusen. Testen av 2027-kolleksjonen gir et tidlig innblikk i hvilken retning merket tar sin teknologi og konstruksjon. Skitester er viktige for både forhandlere og utøvere på mosjonsnivå, og Head har tradisjonelt investert tungt i utvikling basert på erfaringer fra toppidrettsarenaen.","url":"https://www.neveitalia.it/test/news/ski-test-abbiamo-testato-la-nuova-gamma-head-2027","pub_date":"2026-11-23T13:45:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206673,"source_name":"SkinEWS","country":"SUI","title_no":"Elleve sveitsiske kvinner skal kjøre verdenscuprenn i Killington","title_orig":"Elf Schweizerinnen werden die Weltcup-Rennen in Killington bestreiten","summary_no":"Sveits stiller med elleve utøvere til verdenscuprennene i Killington.","spik_no":"Sveits stiller med elleve utøvere til verdenscuprennene i Killington, Vermont, der det kjøres storslalåm 28. november og slalåm 29. november. Sue Piller og Janine Mächler er ikke med på grunn av helseproblemer. Det er niende gang Killington arrangerer verdenscuprenn for kvinner på «Super Star»-løypa, og sveitserne har tidligere hatt suksess her.","url":"https://www.skinews.ch/news/2026/schweizerinnen-killington-bestreiten/","pub_date":"2026-11-23T10:44:03.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206734,"source_name":"SVT Sport","country":"SWE","title_no":"Ekspert reagerer på ny FIS-regel: «Det kommer til å bli brutalt»","title_orig":"Experten reagerar på nya Fis-regeln: ”Det kommer bli brutalt”","summary_no":"En ekspert advarer om konsekvensene av en ny FIS-regel og mener den vil slå hardt ut for utøverne.","spik_no":"En ekspert har advart om at en ny FIS-regel vil få store og potensielt brutale konsekvenser for utøverne i alpint. FIS har de siste årene innført flere regelendringer knyttet til blant annet startprosedyrer, sikkerhetsutstyr og kvalifiseringssystemer, noe som jevnlig skaper debatt i alpinmiljøet. Detaljene rundt den konkrete regelen det reageres på fremgår ikke av artikkelen, men ekspertuttalelsen tyder på at den vil påvirke konkurransesituasjonen merkbart.","url":"https://www.svt.se/sport/langdskidor/experten-reagerar-pa-nya-fis-regeln-det-kommer-bli-brutalt","pub_date":"2026-11-23T10:26:16.000Z","fetched_at":"2026-11-23 19:52:44","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206797,"source_name":"Sportschau","country":"GER","title_no":"Lara Colturi skriver historie – med hele familiens hjelp","title_orig":"Lara Colturi schreibt Geschichte - mit Hilfe der ganzen Familie","summary_no":"Lara Colturi har skrevet alpin skihistorie, og hele familien har vært en viktig del av reisen.","spik_no":"20 år gamle Lara Colturi vant slalomrennet i Gurgl og satte dermed alpin skihistorie som den første representanten for Albania til å vinne et verdenscuprenn. Det var hennes første seier etter ni tidligere pallplasseringer i karrieren, og hun vant med 0,27 sekunder foran svenske Sara Hector. Colturi er italienskfødt, men valgte å konkurrere for Albania – på samme måte som Lucas Pinheiro Braathen skiftet nasjonalitet til Brasil. Med bare 20 år på baken regnes hun allerede som en av alpinens største talenter.","url":"https://www.sportschau.de/wintersport/ski-alpin/lara-colturi-schreibt-geschichte-mit-hilfe-der-ganzen-familie,ski-alpin-lara-colturi-schreibt-geschichte-100.html","pub_date":"2026-11-23T09:49:24.000Z","fetched_at":"2026-11-23 19:52:46","lang_orig":"de","category":null,"athletes":"Lara Colturi","athlete_nations":["ALB"],"also_sources":[],"norwegian":false},{"id":206674,"source_name":"SkinEWS","country":"SUI","title_no":"To nordmenn og Tangy Nef på pallen i Gurgl-slalåmen","title_orig":"Zwei Norweger und Tangy Nef auf dem Podest des Gurgl-Slaloms","summary_no":"To norske utøvere og sveitsiske Tangy Nef kapret pallplasser i slalåmen i Gurgl.","spik_no":"Timon Haugan og Eirik Hystad Solberg tok norsk dobbeltseier i verdenscupslalåmen i Gurgl, Østerrike, mens sveitsiske Tanguy Nef kom på tredjeplass og tok sitt første verdenscuppodium bare tre dager etter at han fylte 30 år. Det er fjerde gang herrene kjører slalåm på Kirchenkar-løypa i Gurgl, som har hatt vinnere fra Østerrike, Frankrike og nå Norge. Lucas Pinheiro Braathen, som hadde vunnet de to foregående verdenscuprennene, falt ut tidlig i første omgang.","url":"https://www.skinews.ch/video/2026/norweger-podest-slaloms/","pub_date":"2026-11-22T14:46:11.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Tanguy Nef,Timon Haugan","athlete_nations":["NOR","SUI"],"also_sources":[],"norwegian":true},{"id":206636,"source_name":"Ski Racing","country":"INT","title_no":"Haugan vinner slalåm i Gurgl – Solberg og Nef tar første pallplass i verdenscupen","title_orig":"Haugan Wins Gurgl Slalom as Solberg and Nef Celebrate First World Cup Podiums","summary_no":"Timon Haugan tok seieren i Gurgl-slalåmen. Henrik Solberg og Marc Nef kunne juble for sine første pallplasseringer i verdenscupen.","spik_no":"Timon Haugan vant slalåmen i Gurgl og befestet sin posisjon som en av Norges fremste teknikkjørere. Henrik Solberg og sveitseren Marc Nef kunne begge feire sine første pallplasseringer i verdenscupen – en milepæl for to av de yngre talentene i det internasjonale startfeltet. Gurgl i Østerrike er et relativt nytt stopp på verdenscupsirkusen, men har raskt etablert seg som et populært sted for tidlige slalåmrenn på herresiden.","url":"https://skiracing.com/haugan-wins-gurgl-slalom-as-solberg-and-nef-celebrate-first-world-cup-podiums/","pub_date":"2026-11-22T14:32:06.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Tanguy Nef,Timon Haugan","athlete_nations":["NOR","SUI"],"also_sources":[],"norwegian":true},{"id":206798,"source_name":"Sportschau","country":"GER","title_no":"Ski alpint – Straßer i skyggen av Haugans slalomseier","title_orig":"Ski Alpin - Straßer fährt bei Haugans Sieg im Slalom hinterher","summary_no":"Henrik Haugan vant slalomrennet, mens tyske Linus Straßer ikke klarte å henge med i kampen om seieren.","spik_no":"Timon Haugan vant herrenes slalom i Gurgl og tok sin sjette verdenscupseier i disiplinen, mens tyske Linus Straßer endte på en skuffende 18.-plass, 2,05 sekunder bak. Haugan satte bestid i første omgang og kontrollerte ledelsen i finaleomgangen uten å ta unødvendig risiko. Nordmennene dominerte totalpodiet, med Eirik Hystad Solberg på andreplass, mens Tanguy Nef fra Sveits tok tredjeplassen. Straßer, som er 34 år og et av Tysklands fremste slalomess, har hatt et vanskelig forhold til Gurgl-bakken og har aldri funnet formen sin der.","url":"https://www.sportschau.de/wintersport/ski-alpin/strasser-faehrt-bei-haugans-slalomsieg-hinterher,rennbericht-gurgl-slalom-maenner-100.html","pub_date":"2026-11-22T14:28:55.000Z","fetched_at":"2026-11-23 19:52:46","lang_orig":"de","category":null,"athletes":"Linus Straßer,Timon Haugan","athlete_nations":["GER","NOR"],"also_sources":[],"norwegian":true},{"id":206675,"source_name":"SkinEWS","country":"SUI","title_no":"Norsk dobbeltseier i Gurgl og første pallplass til Tangy Nef","title_orig":"Norwegischer Doppelsieg in Gurgl und das erste Podest für Tangy Nef","summary_no":"Norge tok dobbeltseier i slalåmen i Gurgl, mens Tangy Nef sikret sin første pallplass i verdenscupen.","spik_no":"Timon Haugan ledet etter første omgang og holdt unna for å vinne slalåmen i Gurgl foran lagkamerat Eirik Hystad Solberg, som dermed ga Norge en historisk dobbeltseier på Kirchenkar-løypa. Tanguy Nef tok sin første verdenscuppall i karrieren som 30-åring, bare tre dager etter bursdagen. Lucas Pinheiro Braathen, som kjører for Brasil, var storfavoritt etter seirer i Sølden og Levi, men falt ut på einfädler tidlig i første omgang og mistet sjansen til tre strake seirer.","url":"https://www.skinews.ch/news/2026/norwegischer-doppelsieg-podest/","pub_date":"2026-11-22T13:23:47.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Atle Lie McGrath,Clement Noel,Lucas Braathen,Manuel Feller,Tanguy Nef,Timon Haugan","athlete_nations":["AUT","BRA","FRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":206676,"source_name":"SkinEWS","country":"SUI","title_no":"EC: Anna Flatscher bekrefter formen med 6. plass","title_orig":"EC: Anna Flatscher liefert mit Rang 6 die Bestätigung","summary_no":"Anna Flatscher leverte en sterk prestasjon med en 6. plass i europacupen og bekreftet dermed sin gode form.","spik_no":"18 år gamle sveitsiske Anna Flatscher viste solid form med en sjetteplass i det andre europacup-slalåmrennet i Levi, bare et par dager etter at hun tok tredjeplass i åpningsrennet. Det var kun hennes tredje europacuprenn totalt, og resultatene peker mot en lovende karriere. Topp fem i rennet besto av utøvere med verdenscuperfaring, noe som gjør Flatschers plasseringer ekstra imponerende.","url":"https://www.skinews.ch/news/2026/flatscher-liefert-bestaetigung/","pub_date":"2026-11-22T13:05:09.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206637,"source_name":"Ski Racing","country":"INT","title_no":"Haugan leder i Gurgl med 0,01 sekund – Seymour på 10.-plass","title_orig":"Haugan Leads Gurgl by 0.01; Seymour Charges Into 10th","summary_no":"Timon Haugan leder etter første omgang i Gurgl med kun hundredelen til gode. Seymour imponerte med en tiendeplass fra startnummer 26.","spik_no":"Timon Haugan leder etter første omgang i slalåmrennet i Gurgl med kun én hundredel ned til nærmeste rival. Haugan er en av Norges mest stabile slalåmkjørere og har vært på pallen i verdenscupen tidligere, men venter fortsatt på sin første seier på øverste nivå. At Sebastian Seymour kjørte seg inn på 10.-plass fra startnummer 26 er også oppsiktsvekkende, og viser bredden i det norske slalåmlaget.","url":"https://skiracing.com/haugan-leads-gurgl-by-0-01-seymour-charges-into-10th/","pub_date":"2026-11-22T11:24:26.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Timon Haugan","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":206677,"source_name":"SkinEWS","country":"SUI","title_no":"Norske utøvere dominerte 1. omgang i Gurgl-slalåmen","title_orig":"Norweger drücken dem 1. Lauf des Gurgl-Slaloms den Stempel auf","summary_no":"Norske alpinister satte sitt preg på den første omgangen av slalåmen i Gurgl.","spik_no":"Norge dominerte første omgang av verdenscupslalåmen i Gurgl med Timon Haugan øverst, kun ett hundredels sekund foran lagkamerat Atle Lie McGrath. Belgianske Armand Marchant lå på tredjeplass etter første omgang, mens sveitsiske Tanguy Nef var beste sveitsiske løper på sjuendeplass. Storfavoritten Lucas Pinheiro Braathen, som nettopp hadde vunnet i Sølden og Levi, mistet staven og falt ut tidlig i løypa.","url":"https://www.skinews.ch/weltcup/2026/norweger-druecken-slaloms/","pub_date":"2026-11-22T10:21:48.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Atle Lie McGrath,Lucas Braathen,Tanguy Nef,Timon Haugan","athlete_nations":["BRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":206678,"source_name":"SkinEWS","country":"SUI","title_no":"EC-dameskalåm (2. omgang) sendes direkte fra Levi kl. 13","title_orig":"Der zweite EC-Frauen-Slalom (2. Lauf) ab 13 Uhr live aus Levi","summary_no":"Den andre omgangen av europacup-slalåmen for kvinner i Levi kan følges direkte fra klokken 13.","spik_no":"Andre omgang av europacup-slalåmen for kvinner i Levi ble sendt direkte fra klokken 13. Levi i Finland er et klassisk åpningssted for slalåmsesongen, og europacupen her gir unge og fremadstormende utøvere viktig konkurranseerfaring tidlig i sesongen. Rennet inngår i europacupkalenderen for 2026/27-sesongen.","url":"https://www.skinews.ch/video/2026/europacup-auftakt-frauen/","pub_date":"2026-11-22T08:00:25.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206679,"source_name":"SkinEWS","country":"SUI","title_no":"Korsbåndskade – sesongen over for Mary Bocock","title_orig":"Kreuzbandriss – Saison für Mary Bocock bereits zu Ende","summary_no":"Mary Bocock har pådratt seg et korsbåndsbrudd og er ferdig for sesongen.","spik_no":"23 år gamle amerikanske Mary Bocock har pådratt seg brudd på fremre korsbånd og ytre ligament i høyre kne og er allerede operert, noe som betyr at sesongen er over for henne. Skaden er et hardt slag ettersom 2026/27-sesongen er en VM-sesong, og Bocock fra Salt Lake City hadde håpet på å representere USA i fartsøvelsene og storslalåm på hjemmebane. Hun meldte om skaden via Instagram fra sykehussengen.","url":"https://www.skinews.ch/news/2026/kreuzbandriss-saison-bereits/","pub_date":"2026-11-22T07:44:58.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Mary Bocock","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":206638,"source_name":"Ski Racing","country":"INT","title_no":"Startliste herres slalåm Gurgl 2026: Braathen jakter historisk bragd","title_orig":"Gurgl Men’s Slalom Start List 2026: Braathen Chases History","summary_no":"Startlisten for herres slalåm i Gurgl er klar, med Lucas Braathen som en av de store favorittene i jakten på historisk suksess.","spik_no":"Lucas Braathen er blant favorittene i herres slalåm i Gurgl, og jakter det som omtales som en historisk bragd. Braathen, som tidligere kjørte for Norge, valgte i 2023 å skifte nasjonalitet til Brasil – et land han har tilknytning til gjennom sin mor. Han ble den første brasilianeren til å vinne et verdenscuprenn da han tok seier i Schladming i januar 2024, og en ny triumf i Gurgl ville ytterligere sementere hans plass i alpinhistorien.","url":"https://skiracing.com/gurgl-mens-slalom-start-list-2026-braathen-chases-history/","pub_date":"2026-11-21T19:04:24.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":206799,"source_name":"Sportschau","country":"GER","title_no":"Tåke ødela for Aichers neste slalombragd","title_orig":"Nebel verhindert Aichers nächsten Slalom-Coup","summary_no":"Tåke satte en stopper for Aicher og hindret ham i å gjenta en sterk slalomprestasjon.","spik_no":"Emma Aicher måtte nøye seg med en åttendeplass i Gurgl-slalomen, drøye to uker etter sin triumf i Levi, der hun vant sesongåpningen. Tåke i første omgang kostet henne dyrt, og hun innrømmet selv at hun \"chilte for mye og ga for lite gass\". Fra 13.-plass etter første omgang kjempet hun seg frem til åttende totalt, 1,05 sekunder bak vinneren Lara Colturi. Aicher, som representerer Tyskland, er i ferd med å etablere seg som en av de fremste slalomkjørerne i verdenscupen.","url":"https://www.sportschau.de/wintersport/ski-alpin/nebel-verhindert-naechsten-aicher-coup-in-gurgl-,rennbericht-gurgl-slalom-frauen-100.html","pub_date":"2026-11-21T14:42:28.000Z","fetched_at":"2026-11-23 19:52:46","lang_orig":"de","category":null,"athletes":"Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER"],"also_sources":[],"norwegian":false},{"id":206805,"source_name":"Sportschau","country":"GER","title_no":"Damenes slalom i Gurgl – oppsummering","title_orig":"Der Slalom der Frauen in Gurgl - die Zusammenfassung","summary_no":"Her er et sammendrag av damenes slalomrenn i Gurgl.","spik_no":"Damenes slalom i Gurgl ble avgjort i vanskelige forhold med tåke i første omgang og en teknisk krevende nøkkelpassasje i andre omgang. Lara Colturi vant foran to svenske løpere – Sara Hector og Anna Swenn Larsson – i fravær av Mikaela Shiffrin, som ikke deltok i rennet. Gurgl i Østerrike er en fast del av alpinkalenderen i november og er kjent for sin tekniske og krevende slalombakke.","url":"https://www.sportschau.de/wintersport/ski-alpin/der-slalom-der-frauen-in-gurgl-die-zusammenfassung,zusammenfassung-ski-alpin-gurl-slalom-frauen-100.html","pub_date":"2026-11-21T14:41:16.000Z","fetched_at":"2026-11-23 19:52:46","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206639,"source_name":"Ski Racing","country":"INT","title_no":"Lara Colturi tar sin første verdenscupseier i Gurgl","title_orig":"Lara Colturi Claims First World Cup Win in Gurgl","summary_no":"Lara Colturi sikret seg sin aller første verdenscupseier i slalåmrennene i Gurgl.","spik_no":"Lara Colturi tok sin aller første verdenscupseier i slalåmrennet i Gurgl, en merkedag for den unge italiensk-albanskfødte utøveren. Colturi er født i 2006 og regnes som et av de største talentene i kvinnealpint de siste årene – hun ble verdensmester i slalåm i juniorklassen og har lenge vært ventet å slå gjennom på seniornivå. Seieren bekrefter at hun nå er klar for å utfordre de etablerte stjernene i verdenscupen.","url":"https://skiracing.com/lara-colturi-claims-first-world-cup-win-in-gurgl/","pub_date":"2026-11-21T14:23:52.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Lara Colturi","athlete_nations":["ALB"],"also_sources":["SkinEWS"],"norwegian":false},{"id":206681,"source_name":"SkinEWS","country":"SUI","title_no":"EC: Anna Flatscher på pallen i åpningsrennet i Levi","title_orig":"EC: Anna Flatscher fährt zum Auftakt in Levi auf das Podest","summary_no":"Anna Flatscher startet europacupsesongen sterkt med en pallplass i Levi.","spik_no":"18 år gamle sveitsiske Anna Flatscher tok tredjeplass i åpningsrennet av europacupsesongen i Levi, Finland, allerede i sitt andre europacuprenn noensinne. Italienske Beatrice Sola vant rennet foran norske Bianca Bakke Westhoff, mens syv sveitsiske løpere totalt klarte topp 25. Flatscher er fra Øst-Sveits og fremstår som et av de store sveitsiske slalåmtalentene i damealpint.","url":"https://www.skinews.ch/news/2026/flatscher-faehrt-auftakt/","pub_date":"2026-11-21T13:42:11.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Anna Flatscher","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":206682,"source_name":"SkinEWS","country":"SUI","title_no":"Lara Colturi sørger for Albanias første verdenscupseier","title_orig":"Lara Colturi sorgt für den ersten albanischen Weltcup-Sieg","summary_no":"Lara Colturi gikk til topps og ga Albania sin historiske første verdenscupseier i alpint.","spik_no":"Lara Colturi vant slalåmrennet i Gurgl og ga Albania sin aller første seier i alpint verdenscup. Den 20 år gamle utøveren er italiensk av fødsel, men konkurrerer under albansk flagg – en situasjon som har vakt oppsikt i alpinmiljøet. Seieren kom knapt overraskende: i sesongåpningen i Sölden skilte det bare ett hundredels sekund fra topplasseringen. Sara Hector og Anna Swenn Larsson tok de to neste plassene på pallen.","url":"https://www.skinews.ch/news/2026/colturi-albanischen-weltcup/","pub_date":"2026-11-21T13:27:12.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Anna Swenn-Larsson,Lara Colturi,Sara Hector","athlete_nations":["ALB","SWE"],"also_sources":["Ski Racing"],"norwegian":false},{"id":206640,"source_name":"Ski Racing","country":"INT","title_no":"Swenn Larsson leder Gurgl-slalåm – Hurt stormer inn på sjetteplass","title_orig":"Anna Swenn Larsson Leads Gurgl Slalom as Hurt Charges Into Sixth From Bib 26","summary_no":"Anna Swenn Larsson leder etter første omgang i Gurgl. Paula Hurt imponerte med en sjetteplass fra startnummer 26.","spik_no":"Anna Swenn Larsson leder etter første omgang i dameslagåmrennet i Gurgl, og den svenske veteranen er godt kjent i rollen som ledende etter første omgang. Swenn Larsson har vært en av verdenscupens mest stabile slalåmkjørere gjennom flere sesonger, men har ventet lenge på sin første seier på øverste nivå. At Paula Hurt stormet inn på sjetteplass fra startnummer 26 er et overraskende og positivt innslag i andreomgangen.","url":"https://skiracing.com/anna-swenn-larsson-leads-gurgl-slalom-as-hurt-charges-into-sixth-from-bib-26/","pub_date":"2026-11-21T11:17:43.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Anna Swenn-Larsson","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":206683,"source_name":"SkinEWS","country":"SUI","title_no":"Anna Swenn Larsson jakter sin tredje slalåmseier","title_orig":"Anna Swenn Larsson greift nach dem dritten Slalom-Sieg","summary_no":"Svenske Anna Swenn Larsson sikter mot en tredje slalåmseier i verdenscupen.","spik_no":"Anna Swenn Larsson ledet etter første omgang i slalåmen i Gurgl og siktet mot sin tredje verdenscupseier. De to foregående utgavene av Gurgl-slalåmen ble begge vunnet av Mikaela Shiffrin, men amerikaneren var ikke i stand til å forsvare tittelen denne gang. Swenn Larsson, som er en av de mest erfarne slalåmkjørerne på den svenske troppen, har gjennom karrieren vist seg som en stødig pallkandidat i tekniske disipliner.","url":"https://www.skinews.ch/weltcup/2026/larsson-greift-dritten/","pub_date":"2026-11-21T10:21:57.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Anna Swenn-Larsson,Mikaela Shiffrin","athlete_nations":["SWE","USA"],"also_sources":[],"norwegian":false},{"id":206684,"source_name":"SkinEWS","country":"SUI","title_no":"Beaver Creek – et kappløp mot klokken","title_orig":"Beaver Creek – ein Wettlauf gegen die Zeit","summary_no":"Arrangørene i Beaver Creek kjemper mot tiden for å få rennene gjennomført.","spik_no":"Arrangørene i Beaver Creek stod overfor store utfordringer med å få rennene på plass til planlagt tid. Beaver Creek er et av de mest tradisjonsrike stoppene på herresirkusen, kjent for den krevende Birds of Prey-løypen som er godt egnet for utfor og super-G. Snø- og værforhold i Colorado kan skape uforutsigbare situasjoner tidlig i sesongen, og arrangørene har ved flere anledninger tidligere måttet jobbe intenst for å oppfylle FIS sine krav til baneforhold.","url":"https://www.skinews.ch/news/2026/beaver-creek-wettlauf/","pub_date":"2026-11-21T08:49:46.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":204619,"source_name":"SVT Sport","country":"SWE","title_no":"Splittrelsen i det norske kvinnelandslaget – én dukket opp på samlingen: «Ekstremt dårlig»","title_orig":"Splittringen i norska damlandslaget – en dök upp på lägret: ”Extremt dåligt”","summary_no":"Det norske kvinnelandslaget i alpint er preget av splittrelse, og kun én utøver møtte opp på samlingen. Situasjonen beskrives som «ekstremt dårlig».","spik_no":"Det norske kvinnelandslaget i langrenn er preget av alvorlig splittrelse – på en forberedelsessamling i Idre i begynnelsen av november møtte kun én av elleve uttatte løpere opp: 21 år gamle debutant Milla Grosberghaugen Andreassen, som trente alene med coach Marit Bjørgen. – Jeg synes det er ekstremt dårlig, sier Andreassen til NRK. Uroen i laget har pågått over tid, blant annet valgte Astrid Øyre Slind, Karoline Simpson-Larsen og Karoline Grøtting å prioritere privatlag fremfor landslaget, noe som midlertidig stengte dem ute fra verdenscupen. Situasjonen setter søkelys på en vedvarende kulturell og organisatorisk krise i norsk damlangrenn.","url":"https://www.svt.se/sport/langdskidor/splittringen-i-norska-damlandslaget-en-dok-upp-pa-lagret-extremt-daligt","pub_date":"2026-11-20T22:04:48.000Z","fetched_at":"2026-11-20 22:15:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":204428,"source_name":"ORF Sport","country":"AUT","title_no":"Alpinistene gir full gass i Gurgl","title_orig":"Truppe gibt in Gurgl wieder Vollgas","summary_no":"Alpintroppene er tilbake i Gurgl og kjører for fullt igjen.","spik_no":"Den østerrikske slalomkjøreren Katharina Truppe kom inn til helgens renn i Gurgl med god selvtillit etter en tredjeplass i sesongåpningen i Levi. 30-åringen fra Kärnten håper å gjenta bragden i hjemlig terreng, selv om treningsøktene i Gurgl har gått trått. De to tidligere slalomrennene i Gurgl – Europas høyest liggende ikke-bre-skisenter – ble begge vunnet av Mikaela Shiffrin, men amerikaneren er fraværende denne helgen og fokuserer på raskere disipliner frem mot Killington neste uke, noe som åpner feltet betraktelig.","url":"https://sport.orf.at/stories/3165180/","pub_date":"2026-11-20T21:50:14.000Z","fetched_at":"2026-11-20 22:00:03","lang_orig":"de","category":null,"athletes":"Katharina Truppe","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":203469,"source_name":"Ski Racing","country":"INT","title_no":"Lindsey Vonn starter ACL-rehabilitering etter niende operasjon","title_orig":"Lindsey Vonn Begins ACL Rehab After Ninth Surgery","summary_no":"Lindsey Vonn har påbegynt rehabilitering av korsbåndet etter å ha gjennomgått sin niende operasjon i karrieren.","spik_no":"Lindsey Vonn har påbegynt rehabilitering etter sin niende operasjon i karrieren — en ACL-rekonstruksjon i venstre kne som varte over fem timer. Den 42 år gamle amerikaneren skadet korsbåndet i et fall under verdenscuprenn i Crans-Montana i januar, og pådro seg deretter et lårbensbrudd under OL-utforsrennet i Cortina d'Ampezzo ni dager senere. Bruddet måtte først gro fullstendig før kirurgene kunne fjerne plater og skruer og rekonstruere korsbåndet i samme operasjon — derav den ni måneder lange ventetiden. Vonn, som er tidenes mestvinnende kvinne i alpint med 82 verdenscupseirer, anslår at hun trenger seks til ni måneder til med rehabilitering.","url":"https://skiracing.com/lindsey-vonn-begins-acl-rehab-after-ninth-surgery/","pub_date":"2026-11-20T20:43:12.000Z","fetched_at":"2026-11-20 20:45:02","lang_orig":"en","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":202665,"source_name":"ORF Sport","country":"AUT","title_no":"FIS-snøkontroll i Beaver Creek utsatt","title_orig":"FIS-Schneekontrolle in Beaver Creek verschoben","summary_no":"FIS-snøkontrollen i Beaver Creek er blitt utsatt.","spik_no":"FIS-snøkontrollen i Beaver Creek er utsatt på grunn av dårlige snøforhold, og åpningsrennene i herrealpint denne sesongen er dermed i fare. I Beaver Creek er det planlagt to utfor-renn 3. og 4. desember, super-G 5. desember og storslalåm 6. desember. Beaver Creek er en av de mest tradisjonsrike alpinbakkene i USA og har vært fast del av verdenscupkalenderen siden 1983. Usikkerhet rundt snøforhold tidlig i sesongen er ikke uvanlig i Colorado, men skaper ekstra press i et VM-år der lagene ønsker tidlig konkurransepraksis.","url":"https://sport.orf.at/stories/3165198/","pub_date":"2026-11-20T19:28:49.000Z","fetched_at":"2026-11-20 19:30:03","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":202433,"source_name":"Ski Racing","country":"INT","title_no":"Startliste for kvinneslalåm i Gurgl: Aicher leder, Colturi jakter første seier","title_orig":"Gurgl Women’s Slalom Start List: Aicher Leads, Colturi Chases First Win","summary_no":"Aicher går ut som favoritt i kvinneslalåmen i Gurgl, mens Colturi sikter mot sin aller første verdenscupseier.","spik_no":"Emma Aicher leder startlisten i kvinneslalåmen i Gurgl etter at hun vant sesongåpningen i Levi, og topper dermed slalåmcupen med 100 poeng. Lara Colturi har vært toer i begge tidligere Gurgl-slalåmer og jakter sin aller første verdenscupseier. Camille Rast har vært tredjedeler i begge disse rennene og er også å regne med. Mikaela Shiffrin, som har vunnet begge tidligere Gurgl-slalåmer, er fraværende og trener i USA foran sin planlagte comeback i Killington – noe som garanterer en ny vinner på pallen i Gurgl i år.","url":"https://skiracing.com/gurgl-womens-slalom-start-list-2026/","pub_date":"2026-11-20T19:02:45.000Z","fetched_at":"2026-11-20 19:15:02","lang_orig":"en","category":null,"athletes":"Camille Rast,Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER","SUI"],"also_sources":[],"norwegian":false},{"id":201752,"source_name":"Neveitalia","country":"ITA","title_no":"Holdener med startnummer 1 i Gurgl-slalåm – her er startlisten","title_orig":"Holdener con l'1, Rast pesca il 4 poi Aicher e Colturi in uno slalom di Gurgl tutto da vedere. Della Mea n° 13: la startlist","summary_no":"Holdener åpner med startnummer 1, mens Rast trekker nummer 4 foran Aicher og Colturi. Della Mea starter som nummer 13 i slalåmen i Gurgl.","spik_no":"Wendy Holdener åpner slalåmen i Gurgl med startnummer 1, og sveitseren er samtidig leder i slalåmcupen denne sesongen. Gurgl er inne i World Cup-kalenderen for tredje år på rad, og rennet på Kirchenkar-løypa i 2500 meters høyde har blitt en fast del av november-programmet. Holdener er en av slalåmens mest meritterte utøvere uten en individuell World Cup-seier i slalåm – hun har ni pallplasser i disiplinen og er stadig på jakt etter den første triumfen. Lena Dürr og Mikaela Shiffrin har dominert i Gurgl de to foregående årene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/holdener-con-l-1-rast-pesca-il-4-poi-aicher-e-colturi-in-uno-slalom-di-gurgl-tutto-da-vedere-della-mea-n-13-la-startlist","pub_date":"2026-11-20T18:05:00.000Z","fetched_at":"2026-11-20 18:15:01","lang_orig":"it","category":null,"athletes":"Camille Rast,Emma Aicher,Lara Colturi,Wendy Holdener","athlete_nations":["ALB","GER","SUI"],"also_sources":[],"norwegian":false},{"id":201380,"source_name":"Ski Racing","country":"INT","title_no":"Molly Butler ser tilbake på sin verdenscupdebut i slalåm i Levi","title_orig":"Molly Butler Reflects on Her World Cup Slalom Debut in Levi","summary_no":"Molly Butler reflekterer over sin første verdenscupopplevelse i slalåm etter debuten i Levi.","spik_no":"Den 20 år gamle britiske slalåmkjøreren Molly Butler gjorde sin verdenscupdebut i Levi 14. november 2026, men røk ut i første omgang med startnummer 59. Hun var likevel fornøyd med opplevelsen og beskrev det å stå i verdenscupstarten som «akkurat den følelsen jeg ønsket meg». Butler var Storbritannias høyest rangerte kvinne på FIS slalåmpoenglistens ved Levi-runden, og hadde tidligere representert Storbritannia i slalåm under VM i Saalbach i 2025. Hun ble tidlig trent av de tre Carrick-Smith-brødrene og sin mor Jay Blatherwick.","url":"https://skiracing.com/molly-butler-reflects-on-her-world-cup-slalom-debut-in-levi/","pub_date":"2026-11-20T17:38:54.000Z","fetched_at":"2026-11-20 17:45:01","lang_orig":"en","category":null,"athletes":"Molly Butler","athlete_nations":["GBR"],"also_sources":[],"norwegian":false},{"id":199687,"source_name":"ORF Sport","country":"AUT","title_no":"Resultater og strømming fra Mixed Team-konkurransen","title_orig":"Stand und Stream vom Mixed-Team-Bewerb","summary_no":"Her finner du stillinger og direktestrømming fra Mixed Team-konkurransen i alpint.","spik_no":"Mixed Team-konkurransen i Lillehammer åpner den nye hoppvintersen, og etter første omgang leder Norge foran Japan og Tyskland. Det norske laget består blant andre av Gyda Westvold Hansen og Marius Lindvik, to av verdens beste hoppere i sine respektive klasser. Lagkonkurransen i kombinert hopp er et relativt nytt format som samler to kvinner og to menn på hvert lag, og gir nasjoner med bred bredde i hoppstallen et fortrinn.","url":"https://sport.orf.at/stories/3165178/","pub_date":"2026-11-20T15:01:59.000Z","fetched_at":"2026-11-20 15:15:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":198766,"source_name":"SkinEWS","country":"SUI","title_no":"Vlhova hopper over Gurgl – tvinges til pause","title_orig":"Verzicht auf Gurgl-Start – Petra Vlhova muss eine Pause einlegen","summary_no":"Petra Vlhova trekker seg fra rennet i Gurgl og må ta en pause fra konkurransene.","spik_no":"Petra Vlhova hopper over slalåmen i Gurgl og vil heller ikke stille i Killington eller Mont-Tremblant i slutten av november og begynnelsen av desember. Den 31 år gamle slovaken vendte tilbake til verdenscupen i Sölden i slutten av oktober etter over to og et halvt års fravær som følge av en alvorlig kneskade, og tok en 16.-plass i Levi. Vlhova understreker at hun er frisk og smertefri, men trenger mer tid til å bygge fysisk form og finpusse teknikken før hun returnerer til konkurranse. Hun vant den samlede verdenscupen i sesongen 2020/21.","url":"https://www.skinews.ch/news/2026/vericht-vlhova-einlegen/","pub_date":"2026-11-20T13:51:38.000Z","fetched_at":"2026-11-20 14:00:09","lang_orig":"de","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":198889,"source_name":"Sportschau","country":"GER","title_no":"I Riesches fotspor: Aicher tar opp kampen i Gurgl","title_orig":"Auf den Spuren von Riesch: Aicher greift in Gurgl an","summary_no":"Aicher gjør seg klar til å angripe i Gurgl, inspirert av den tidligere stjernen Riesch.","spik_no":"Emma Aicher går til start i Gurgl som favoritt etter å ha vunnet slalåmen i Levi forrige helg – hennes første verdenscupseier i disiplinen. 23-åringen fra Tyskland er nå på jakt etter sitt femte slalåmpall på rad i verdenscupen, og med det vil hun matche den tyske legenden Maria Riesch, som er den eneste DSV-utøveren som har klart fem strake slalåmpaller. Mikaela Shiffrin, som vant de to første utgavene av Gurgl-rennet, stiller ikke til start, noe som åpner feltet betraktelig.","url":"https://www.sportschau.de/wintersport/ski-alpin/auf-den-spuren-von-hoefl-riesch-aicher-greift-in-gurgl-an,ski-alpin-aicher-auf-spuren-von-hoefl-riesch-100.html","pub_date":"2026-11-20T13:46:29.000Z","fetched_at":"2026-11-20 14:00:11","lang_orig":"de","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":198438,"source_name":"Neveitalia","country":"ITA","title_no":"Vlhova hopper over Gurgl og Nord-Amerika: «Kneet er bra, men jeg må bygge meg opp igjen»","title_orig":"Vlhova, scelta tosta: salta Gurgl e la trasferta nordamericana: \"Il ginocchio sta bene, ma devo ricostruirmi con l'allenamento\"","summary_no":"Petra Vlhova dropper rennene i Gurgl og Nord-Amerika. Selv om kneet er friskt, trenger hun mer trening for å komme i kampform.","spik_no":"Petra Vlhova hopper over slalåmrennet i Gurgl og hele Nord-Amerika-turneén, inkludert Killington og Mont-Tremblant. Den slovakiske stjernen kom tilbake fra en alvorlig kneskadesone til sesongstart, men resultatene – 23. plass i storslalåm i Sølden og 16. plass i slalåm i Levi – viser at hun ennå ikke er tilbake på sitt beste nivå. Vlhova understreker at kneet er friskt, men at hun trenger mer treningstid for å bygge opp formen. Planen er å være tilbake i World Cup-sporet til Saint-Moritz eller Courchevel, som begge er tekniske omgivelser hun trives godt i.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/vlhova-scelta-tosta-salta-gurgl-e-la-trasferta-nordamericana-il-ginocchio-sta-bene-ma-devo-ricostruirmi-con-l-allenamento","pub_date":"2026-11-20T13:20:00.000Z","fetched_at":"2026-11-20 13:30:01","lang_orig":"it","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":198262,"source_name":"Neveitalia","country":"ITA","title_no":"Laura feirer bursdag og gleder seg til Beaver Creek – Pirovano hylles med Killington i sikte","title_orig":"Laura, il compleanno e il conto alla rovescia per Beaver Creek. Oggi si festeggia Pirovano, con Killington all'orizzonte","summary_no":"Laura markerer bursdagen sin med blikket rettet mot Beaver Creek, mens Pirovano feires med Killington på horisonten.","spik_no":"Den italienske alpinisten Laura Pirovano fylte 29 år under treningssamlingen på Copper Mountain, der det italienske landslaget forbereder seg til sesongåpningen i utforkjøring på Birds of Prey i Beaver Creek 11.–13. desember. Pirovano har hatt en bemerkelsesverdig karriere etter to alvorlige skader mellom 2018 og 2021, og avsluttet fjorårssesongen i storform med tre strake seirer og sammenlagtseieren i utfor-cupen. Den kommende sesongen regnes som bekreftelsens sesong for 29-åringen fra Trentino, som også har Killington-rennet i horisonten.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/laura-il-compleanno-e-il-conto-alla-rovescia-per-beaver-creek-oggi-si-festeggia-pirovano-con-killington-all-orizzonte","pub_date":"2026-11-20T13:00:00.000Z","fetched_at":"2026-11-20 13:15:01","lang_orig":"it","category":null,"athletes":"Laura Pirovano","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":197558,"source_name":"Neveitalia","country":"ITA","title_no":"Della Mea leder det italienske laget på Kirchenkar: «Jeg er tilbake på 100%»","title_orig":"Della Mea guida il team Italia sulla \"Kirchenkar\": \"Sono tornata al 100%\". Peterlini: \"Un pezzo alla volta\"","summary_no":"Della Mea tar ledelsen for Italia på Kirchenkar-løypen og melder at hun er fullt tilbake, mens Peterlini tar det steg for steg.","spik_no":"Lara Della Mea leder det italienske slalomlandslaget inn mot Verdenscup-rennet på Kirchenkar-løypen i Gurgl, og melder at hun er hundre prosent tilbake. Den 24 år gamle friulanske slalomspesialistinnen har slitt med skader og sykdom, og tilbakemeldingen er et positivt tegn foran lørdagens slalom. Åtte italienske løpere stiller til start, men uten Beatrice Sola, som er best i laget for øyeblikket og er blitt igjen i Finland for å kjøre Europacup. Kirchenkar-løypen i Gurgl er relativt ny på damekalenderen, den kom med fra sesongen 2023/24.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/della-mea-guida-il-team-italia-sulla-kirchenkar-sono-tornata-al-100-peterlini-un-pezzo-alla-volta","pub_date":"2026-11-20T12:15:00.000Z","fetched_at":"2026-11-20 12:26:56","lang_orig":"it","category":null,"athletes":"Martina Peterlini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":197454,"source_name":"SVT Sport","country":"SWE","title_no":"Hvem er Anton Grahn?","title_orig":"Vem är Anton Grahn?","summary_no":"Et portrett av den svenske alpinisten Anton Grahn.","spik_no":"Anton Grahn er en av de mest omtalte unge langrennsløperne i Sverige, og blir trukket frem som en fremtidig bærebjelke i det svenske herrelaget. Med flere medaljer på juniornivå og en pallplats i verdenscupen allerede bak seg, vekker den 22 år gamle sprinteren stor begeistring. Eksperter hyller ham, og forventningene er høye etter flere tunge år for svensk langrenn på herresiden.","url":"https://www.svt.se/sport/langdskidor/vem-ar-anton-grahn","pub_date":"2026-11-20T12:09:42.000Z","fetched_at":"2026-11-20 12:15:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":197455,"source_name":"SVT Sport","country":"SWE","title_no":"Anton Grahn vinner Sverige-premieren","title_orig":"Anton Grahn vinner Sverigepremiären","summary_no":"Anton Grahn tok seieren i den første svenske alpinkonkurransen i sesongen.","spik_no":"Anton Grahn vant sprintfinalen i Sverigepremiären i Bruksvallarna og slo blant andre kanadieren Antoine Cyr og lagkamerat Johan Ekberg. SVT Sports ekspert Anders Blomquist var full av lovord: «Han eier dette! Han viser hvor dyktig han er.» Den 22 år gamle sprinteren erkjenner selv at sesongstarten kan være ujevn, men sikter mot en plass på det svenske verdenscuplaget. I helgen venter 10 km klassisk og 10 km fri i Bruksvallarna.","url":"https://www.svt.se/sport/langdskidor/anton-grahn-vinner-sverigepremiaren","pub_date":"2026-11-20T12:07:09.000Z","fetched_at":"2026-11-20 12:15:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":195707,"source_name":"SkinEWS","country":"SUI","title_no":"Oscar Heine overtar Manuel Fellers startplass i Gurgl","title_orig":"Oscar Heine übernimmt den Gurgl-Startplatz von Manuel Feller","summary_no":"Oscar Heine rykker inn og overtar startplassen til Manuel Feller i alpinrennet i Gurgl.","spik_no":"Manuel Feller er ikke klar for start i hjemmerennet i Gurgl, og Oscar Heine rykker inn på det østerrikske slalåmlaget. 34 år gamle Feller fra Tirol gjennomførte riktignok trening fredag, men var ikke fornøyd med resultatet og valgte å stå over. Feller er en av Østerrikes mest profilerte slalåmkjørere og har vunnet flere verdenscuprenner, så fraværet hans i et hjemmerenn er et merkbart tap for vertsnasjonens lag.","url":"https://www.skinews.ch/news/2026/uebernimmt-startplatz-manuel/","pub_date":"2026-11-20T09:55:56.000Z","fetched_at":"2026-11-20 10:00:03","lang_orig":"de","category":null,"athletes":"Manuel Feller,Oscar Heine","athlete_nations":["AUT","GER"],"also_sources":[],"norwegian":false},{"id":195590,"source_name":"ORF Sport","country":"AUT","title_no":"Feller avstår fra hjemslalåmen","title_orig":"Feller verzichtet auf Heimslalom","summary_no":"Manuel Feller har valgt å ikke stille til start i hjemslalåmen.","spik_no":"Manuel Feller avstår fra helgens hjemslalåm i Gurgl etter at treningskjøringene fredag ikke ga tilstrekkelig trygghet – østerrikeren sier selv at han bare er «ved 85 prosent». Den 34 år gamle tiroleren har vært plaget av kroniske rygg- og skiveproblemer over lengre tid og måtte av samme grunn også melde forfall til saisongsåpningen i Levi. Feller vant sammenlagtcupen i slalåm sesongen 2023/24 og planlegger nå comebacken til herreslalåmen i Val d'Isère 13. desember.","url":"https://sport.orf.at/stories/3165167/","pub_date":"2026-11-20T09:43:44.000Z","fetched_at":"2026-11-20 09:45:04","lang_orig":"de","category":null,"athletes":"Manuel Feller","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":195534,"source_name":"Neveitalia","country":"ITA","title_no":"Feller bekrefter fravær i Gurgl – Vinatzer starter søndag","title_orig":"Ufficiale il \"no\" di Feller allo slalom di Gurgl dopo l'ultimo test: Vinatzer domenica partirà nei 15","summary_no":"Det er offisielt at Feller ikke deltar i slalåmen i Gurgl etter siste test. Vinatzer vil søndag starte blant de 15 første.","spik_no":"Det er nå offisielt bekreftet at Manuel Feller ikke stiller i søndagens herreslalåm i Gurgl, etter at en siste test på hjemmesnøen ikke overbevisste ham om at han er klar. Feller vant nettopp på Kirchenkar-løypen i Gurgl da rennet ble arrangert for første gang i 2023, noe som gjør fraværet ekstra bittert. I hans sted er unggutten Oscar Heine bekreftet på startlisten, han som allerede debuterte i Levi. For italiensk del er nyheten at Alex Vinatzer vil starte blant de 15 første søndag.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/ufficiale-il-no-di-feller-allo-slalom-di-gurgl-dopo-l-ultimo-test-vinatzer-domenica-partira-nei-15","pub_date":"2026-11-20T09:35:00.000Z","fetched_at":"2026-11-20 09:45:02","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Manuel Feller","athlete_nations":["AUT","ITA"],"also_sources":[],"norwegian":false},{"id":195358,"source_name":"Neveitalia","country":"ITA","title_no":"Tøffe forhold i Gurgl – bedring ventet til morgendagens slalåm","title_orig":"A Gurgl condizioni toste, ma per lo slalom di domani in miglioramento. La vigilia delle big","summary_no":"Forholdene i Gurgl er krevende, men det ventes bedring til slalåmrennet som arrangeres fredag. Favorittene er i gang med forberedelsene.","spik_no":"Forholdene i den østerrikske landsbyen Gurgl er krevende foran helgens slalåmrenn, men bedring ventes til fredag. Gurgl har vært en relativt ny destinasjon på verdenscupkalenderen og arrangerer renn på høy høyde i Ötztal-alpene, noe som kan gi ustabilt vær tidlig i sesongen. Rennledelsen og favorittene er likevel i gang med forberedelsene, og forholdene er ventet å stabilisere seg til konkurransen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/a-gurgl-condizioni-toste-ma-per-lo-slalom-di-domani-in-miglioramento-la-vigilia-delle-big","pub_date":"2026-11-20T08:40:00.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":195360,"source_name":"Neveitalia","country":"ITA","title_no":"Tommaso Sala operert i høyre kne – kan nå planlegge ny rehabiliteringsplan","title_orig":"Intervento al ginocchio destro effettuato, Tommaso Sala può pensare ad un nuovo percorso di recupero","summary_no":"Tommaso Sala har gjennomgått en operasjon på høyre kne og kan nå se fremover mot en ny restitusjonsprosess.","spik_no":"Den italienske slalåmkjøreren Tommaso Sala har gjennomgått en operasjon på høyre kne og kan nå legge en plan for rehabiliteringen. Sala har vært en del av det italienske landslaget og har hentet resultater i verdenscupen i tekniske disipliner, men har slitt med skader som har hindret kontinuitet i karrieren. En vellykket operasjon er første steg, men veien tilbake til konkurransenivå vil kreve flere måneder med systematisk opptrening.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/intervento-al-ginocchio-destro-effettuato-tommaso-sala-puo-pensare-ad-un-nuovo-percorso-di-recupero","pub_date":"2026-11-20T07:15:00.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"it","category":null,"athletes":"Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":195337,"source_name":"Ski Racing","country":"INT","title_no":"Vinterens fokus: Hvordan en alpinski-skole hjalp to utøvere til college-skiing","title_orig":"Winter in Focus: How Winter Sports School Helped Two Racers Reach College Skiing","summary_no":"To unge alpinister forteller hvordan en vinterskole for vintersport hjalp dem å nå college-nivå i alpint.","spik_no":"To unge alpinister forteller hvordan en vinterskole med spesialisert alpintrening hjalp dem å nå college-nivå i USA. College-skiing er en viktig utviklingsarena i Nord-Amerika, der universiteter rekrutterer lovende utøvere og tilbyr dem strukturert trening kombinert med utdanning. For mange unge alpinister utenfor den tradisjonelle verdenscupbanen er dette en alternativ vei til toppidrett.","url":"https://skiracing.com/winter-in-focus-how-winter-sports-school-helped-two-racers-reach-college-skiing/","pub_date":"2026-11-19T22:30:30.000Z","fetched_at":"2026-11-20 09:28:12","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":194719,"source_name":"SVT Sport","country":"SWE","title_no":"Gjennombrudd for Eddie Genborg med imponerende seier","title_orig":"Islossning för Eddie Genborg i mäktig kross","summary_no":"Eddie Genborg opplevde endelig gjennombrudd med en stor og imponerende seier i alpint.","spik_no":"Artikkelen handler ikke om alpint, men om ishockey: 19 år gamle Eddie Genborg scoret hattrick og leverte totalt fem poeng da Timrå slo Örebro 8–2 i SHL. Genborg, som er draftet av Detroit Red Wings, var med på å vinne junior-VM-gull for Sverige forrige sesong og ventes å spille en sentral rolle i årets junior-VM. Gjennombruddet kommer etter at han innledet sesongen skadet.","url":"https://www.svt.se/sport/ishockey/islossning-for-eddie-genborg-i-maktig-kross","pub_date":"2026-11-19T20:56:43.000Z","fetched_at":"2026-11-19 21:00:05","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":193038,"source_name":"Neveitalia","country":"ITA","title_no":"Killington bekreftet: Kvinnekonkurranser tilbake på «Superstar»","title_orig":"Killington ok, ufficiale la conferma delle gare femminili sulla \"Superstar\" due anni dopo l'ultima volta","summary_no":"Det er offisielt bekreftet at de kvinnelige alpinrennene vender tilbake til Killington-bakken «Superstar», to år etter sist gang rennene ble arrangert der.","spik_no":"Killington i Vermont er offisielt bekreftet som vertskap for to kvinnekonkurranser i alpint – storslalåm og slalåm – helgen 28.–29. november. Det er første gang rennene arrangeres på «Superstar»-bakken siden 2024, da konkurransen ble preget av Mikaela Shiffrin-dramaet, mens svenske Sara Hector vant storslalåmen og sveitsiske Camille Rast tok sin første seier i slalåmen dagen etter. Killington har vært en av de mest populære stoppene på verdenscupen de siste årene, med stort publikumsoppmøte og en særegen feststemning på østkysten av USA.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/killington-ok-ufficiale-la-conferma-delle-gare-femminili-sulla-superstar-due-anni-dopo-l-ultima-volta","pub_date":"2026-11-19T18:40:00.000Z","fetched_at":"2026-11-19 18:45:03","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":184229,"source_name":"Neveitalia","country":"ITA","title_no":"Phenix lanserer replika av Sveriges VM-drakt","title_orig":"Phenix, dalla Coppa del Mondo alle piste di casa: ecco la replica della divisa svedese","summary_no":"Phenix gjør den svenske alpinlandslags-drakten fra verdenscupen tilgjengelig for vanlige skiløpere, slik at fansen kan kle seg som sine favoritter på hjemmebakken.","spik_no":"Phenix lanserer en publikumsversjon av det svenske alpinlandslagets offisielle drakt for sesongen 2026/27, kalt Svezia AW26-kolleksjonen. Drakten er designet etter plaggene som brukes av blant andre Sara Hector og resten av det svenske landslaget i verdenscupen. En av nyhetene er det såkalte WIRE Ventilation System, der glidelåsene er flyttet til forsiden slik at luftsirkulasjonen kan reguleres uten å åpne drakten helt. Phenix har vært offisiell leverandør for det svenske alpinlandslaget og er kjent for å kombinere konkurranseteknologi med produkter tilgjengelig for vanlige skiløpere.","url":"https://www.neveitalia.it/materiali/abbigliamento/news/phenix-dalla-coppa-del-mondo-alle-piste-di-casa-ecco-la-replica-della-divisa-svedese","pub_date":"2026-11-19T07:56:35.000Z","fetched_at":"2026-11-19 08:00:03","lang_orig":"it","category":"goy","athletes":"Sara Hector","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122476,"source_name":"Neveitalia","country":"ITA","title_no":"Jakobsen vinner igjen og åpner svensk trippel i andre slalåm i Storklinten – Hansson og Wissting på pallen","title_orig":"Jakobsen cala il bis e apre la tripletta svedese nel secondo slalom a Storklinten: sul podio anche Hansson e Wissting","summary_no":"Jakobsen doblet seg med ny seier i Storklinten og sørget for svensk trippel på pallen, foran Hansson og Wissting.","spik_no":"Kristoffer Jakobsen vant begge FIS-slalåmrennene i Storklinten og sørget for svensk trippel i søndagens renn, der Hansson og Wissting fulgte på pallen. Den 32 år gamle svenske spesialisten hadde en tung Verdenscup-sesong i fjor der han knapt scoret poeng, men viser nå sterk form en uke før sesongåpningen i Levi. Belgiernes Armand Marchant, som nesten tok sin første seier i Gurgl forrige sesong, deltok bare i lørdagens renn og endte da som toer, over ett sekund bak Jakobsen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/jakobsen-cala-il-bis-e-apre-la-tripletta-svedese-nel-secondo-slalom-a-storklinten-sul-podio-anche-hansson-e-wissting","pub_date":"2026-11-08T10:35:00.000Z","fetched_at":"2026-11-09 09:32:41","lang_orig":"it","category":"sportslig","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":122453,"source_name":"Ski Racing","country":"INT","title_no":"Møt Lionel Agoutin – mannen bak Ski World Cup-bannerne","title_orig":"Meet Lionel Agoutin, the Man Behind the Ski World Cup Banners","summary_no":"Lionel Agoutin er personen som lager de ikoniske bannerne langs traseen under alpinske verdenscuprenn.","spik_no":"Lionel Agoutin er mannen bak de fargerike bannerne som preger tribunene under alpinske verdenscuprenn verden over. Den franske entusiasten driver Alpine Ski World Cup Fan Community og lager bannerne selv – med nasjonale teamfarger og portretter av utøvere fra hele startfeltet. Bannerne er ikke et kommersielt produkt fra FIS eller forbundene, men resultatet av én manns dedikasjon til sporten og fellesskapet rundt den. Agoutin er et kjent ansikt i verdenscupen og har blant annet blitt fotografert sammen med stjerner som Lindsey Vonn.","url":"https://skiracing.com/meet-lionel-agoutin-the-man-behind-the-ski-world-cup-banners/","pub_date":"2026-11-06T20:19:31.000Z","fetched_at":"2026-11-09 09:32:40","lang_orig":"en","category":"goy","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":103287,"source_name":"Neveitalia","country":"ITA","title_no":"SC Courmayeur tar imot Brignone igjen: – En forelder holder alltid døren åpen","title_orig":"\"Un genitore lascia sempre la porta aperta, Fede è rimasta la ragazza che ama sciare in libertà\": lo S.C. Courmayeur riaccoglie Brignone","summary_no":"Federica Brignone ønskes velkommen tilbake til skiklubben SC Courmayeur, som beskriver henne som jenta som alltid har elsket å stå fritt på ski.","spik_no":"Federica Brignones hjemklubb SC Courmayeur ønsker henne hjertelig velkommen tilbake og beskriver henne som «jenta som alltid har elsket å stå fritt på ski». Nyheten kommer dagen etter at Brignone kunngjorde at hun forlater sin stilling i Carabinieri, den italienske militærenheten mange alpinister er tilknyttet. Den 34-årige alpinisten fra La Salle er Italias mestvinnende utøver gjennom tidene med to olympiske gull og over 30 verdenscupseire, og er nå i gang med oppkjøringen mot en ny comeback-sesong etter skade.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-genitore-lascia-sempre-la-porta-aperta-fede-e-rimasta-la-ragazza-che-ama-sciare-in-liberta-lo-sc-courmayeur-riaccoglie-brign","pub_date":"2026-11-03T11:25:00.000Z","fetched_at":"2026-11-03 11:30:02","lang_orig":"it","category":"naert","athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":100827,"source_name":"RTV SLO","country":"SLO","title_no":"Houthi-raketter tvang asiatisk mesterskap fra januar til desember 2027","title_orig":"Rakete hutijev prestavile azijsko prvenstvo z januarja na december 2027","summary_no":"Asiatisk mesterskap i alpint er blitt flyttet fra januar til desember 2027 som følge av houthi-rakettangrep.","spik_no":"Det asiatiske alpinmesterskapet er flyttet fra januar til desember 2027 på grunn av houthi-rakettangrep i regionen. Houthi-bevegelsen i Jemen har siden 2023 gjennomført en rekke angrep mot skip og mål i Rødehavet og omkringliggende områder, noe som har skapt usikkerhet og sikkerhetsproblemer for arrangementer i nærheten. Det er uvanlig at geopolitiske konflikter direkte påvirker internasjonale alpinarrangementer, og beslutningen understreker hvor stor rekkevidden av konflikten har blitt.","url":"https://www.rtvslo.si/sport/rakete-hutijev-prestavile-azijsko-prvenstvo-z-januarja-na-december-2027/798849","pub_date":"2026-11-03T07:07:24.000Z","fetched_at":"2026-11-03 07:30:05","lang_orig":"sl","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":76731,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn klar for siste operasjon: – Mentalt tøff nedtelling","title_orig":"\"Countdown duro mentalmente, tra meno di due settimane mi opero\": Lindsey Vonn verso l'ultimo intervento alla gamba","summary_no":"Lindsey Vonn skal operere benet om mindre enn to uker og beskriver ventetiden som mentalt krevende.","spik_no":"Lindsey Vonn er klar for det hun beskriver som sin siste operasjon, og sier ventetiden på under to uker er mentalt krevende. Inngrepet innebærer fjerning av skruer og plater i venstre tibia, samt en operasjon på korsbåndet. Vonn, som er en av tidenes mestvinnende alpinister med 82 verdenscupseirer og OL-gull i utfor fra 2010, har tilbrakt store deler av 2026 med rehabilitering etter en alvorlig skade hun pådro seg tidligere i år. I høst har hun jobbet intenst i treningssalen for å styrke muskulaturen før det avsluttende inngrepet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/countdown-duro-mentalmente-tra-meno-di-due-settimane-mi-opero-lindsey-vonn-verso-l-ultimo-intervento-alla-gamba","pub_date":"2026-10-28T13:30:00.000Z","fetched_at":"2026-10-28 13:45:02","lang_orig":"it","category":"nyheter","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":59459,"source_name":"ORF Sport","country":"AUT","title_no":"Rennkalenderen skaper igjen debatt","title_orig":"Rennkalender sorgt erneut für Diskussionen","summary_no":"Alpinski-rennkalenderen er nok en gang gjenstand for diskusjon blant utøvere og organisasjoner.","spik_no":"Verdenscupkalenderen for alpint 2026/27 inneholder 40 renn for kvinner og 43 for menn, men balansen mellom fart- og teknikkøvelser er igjen skjev – særlig for kvinner, der teknikkrenn dominerer klart. Østerrike er største vertsland med 15 verdenscupavdelinger, inkludert en ny stopp i Dachstein West/Gosau. Østerriksk dametrener Johannes Zöchling peker på at logistikk og mange motstridende interesser gjør kalenderarbeidet svært krevende, og beklager at det ikke er fartshjemerenn for østerrikske kvinner denne vinteren.","url":"https://sport.orf.at/stories/3163844/","pub_date":"2026-10-24T07:43:47.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":48079,"source_name":"Neveitalia","country":"ITA","title_no":"Atomic og Braathen sammen til 2030 – sikter mot den store krystallkulen","title_orig":"Atomic e Lucas Pinheiro Braathen assieme sino al 2030: il prossimo obiettivo è la sfera di cristallo assoluta","summary_no":"Atomic og Lucas Pinheiro Braathen har forlenget samarbeidet til 2030, med den sammenlagte verdenscupseieren som neste store mål.","spik_no":"Lucas Pinheiro Braathen og utstyrsmerket Atomic har forlenget samarbeidet sitt frem til 2030, med den store krystallkulen – sammenlagttittelen i verdenscupen – som overordnet mål. Braathen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåmkula i 2022–23-sesongen og har etablert seg blant verdens beste teknikkjørere. En sammenlagtseier vil kreve at han hevder seg også utenfor slalåm, noe som gjenstår å bevise.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/atomic-e-lucas-pinheiro-braathen-assieme-sino-al-2030-il-prossimo-obiettivo-e-la-sfera-di-cristallo-assoluta","pub_date":"2026-10-21T10:20:00.000Z","fetched_at":"2026-10-22 10:54:36","lang_orig":"it","category":"viktig","athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":46668,"source_name":"SVT Sport","country":"SWE","title_no":"Treningsbildene av Anna Swenn-Larsson spres: «Viralt»","title_orig":"Träningsbilderna på Anna Swenn-Larsson sprids: ”Viralt”","summary_no":"Bilder av Anna Swenn-Larsson under trening sprer seg raskt på nett og har blitt et viralt fenomen.","spik_no":"Anna Swenn-Larsson har skapt oppmerksomhet på sosiale medier etter at treningsvideoer av henne har spredt seg viralt, blant anne function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';
  if (days <= 45) return '🎿 Forsesong — ' + nxt.venue + ' om ' + days + ' dager';
  return '💤 Sommerpause';
}

function getRace(str) {
  if (!str) return null;
  const d = new Date(str);
  if (isNaN(d)) return null;
  const s = d.toISOString().slice(0,10);
  return RACES.find(r => s >= r.date && s <= r.end) || null;
}

function fmt(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' kl. ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

        <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
      </div>
      <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="spik-card-title">${title}</a>
      ${a.spik_no ? `<div class="spik-card-body">${a.spik_no}</div>` : ''}
    </div>`;
  }
  return `<div class="card${a.norwegian ? ' card-nor' : ''}">
    <div class="card-meta">
      <span class="src src-${a.country}">${a.source_name}</span>
      ${a.norwegian ? '<span class="nor-chip">🇳🇴 Norsk</span>' : ''}
      ${a.also_sources && a.also_sources.length ? `<span class="multi-chip" title="Også dekket av: ${a.also_sources.join(', ')}">📰 ${a.also_sources.length + 1} kilder</span>` : ''}
      ${a.lang_orig && a.lang_orig !== 'no' ? `<span class="lang">${a.lang_orig.toUpperCase()} → NO</span>` : ''}
      ${a.athletes ? `<span style="font-size:10px;color:var(--sportslig)">👤 ${a.athletes.split(',')[0]}</span>` : ''}
      ${a.category ? `<span class="cat-chip cat-${a.category}">${CATS.find(c=>c.id===a.category)?.label||a.category}</span>` : ''}
      ${race ? `<span class="race-chip">🏁 ${race.venue}</span>` : ''}
      <span class="time">${fmt(a.pub_date||a.fetched_at)}</span>
    </div>
    <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="card-title">${title}</a>
    ${a.summary_no ? `<p class="card-summary">${a.summary_no}</p>` : ''}
    ${a.spik_no ? `<div class="card-spik"><span class="spik-label">📻 SPIK</span><span class="spik-text">${a.spik_no}</span></div>` : ''}
  </div>`;
}

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function render() {
  renderFilterRow();
  const words = norm(searchQ).split(/\s+/).filter(Boolean);
  const pool = words.length && extraLoaded ? ARTICLES_ALL : ARTICLES;
  const visible = pool.filter(a => {
    if (activeCountry === 'INT' ? a.country !== 'INT' : (activeCountry && !(a.athlete_nations || []).includes(activeCountry))) return false;
    if (activeCat && a.category !== activeCat) return false;
    if (activeAthlete && !(a.athletes||'').split(',').map(s=>s.trim()).includes(activeAthlete)) return false;
    if (words.length) {
      const hay = norm([a.title_no, a.title_orig, a.summary_no, a.spik_no, a.athletes, a.source_name, (a.also_sources||[]).join(' '), a.category,
        ...(a.athlete_nations||[]).map(c => c + ' ' + ((NATION_META[c]||[])[1]||''))].filter(Boolean).join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });

  document.getElementById('count').textContent = visible.length + ' saker';

  const feed = document.getElementById('feed');
  feed.innerHTML = visible.length
    ? visible.map(a => cardHtml(a, false)).join('')
    : `<div class="empty">${words.length || activeCountry || activeCat || activeAthlete ? 'Ingen treff' : 'Ingen saker'}</div>`;

  // Spik-liste: vis alle kategoriserte (ufiltrert på land/utøver/søk for sidepanelet, men respekter kategori-filter)
  const spikFilter = activeCat
    ? ARTICLES.filter(a => a.category === activeCat)
    : ARTICLES.filter(a => a.category);

  const spikEl = document.getElementById('spik-list');
  const spikLabel = document.getElementById('spik-label');
  spikLabel.textContent = 'Spik-liste (' + spikFilter.length + ')';

  if (!spikFilter.length) {
    spikEl.innerHTML = '<div class="sidebar-empty">Ingen saker valgt ut ennå</div>';
    return;
  }

  // Grupper etter kategori
  const grouped = {};
  CATS.forEach(c => { grouped[c.id] = []; });
  spikFilter.forEach(a => { if (grouped[a.category]) grouped[a.category].push(a); });

  spikEl.innerHTML = CATS.map(cat => {
    const items = grouped[cat.id];
    if (!items.length) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--${cat.id === 'goy' ? 'goy' : cat.id});padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${cat.label}</div>
      ${items.map(a => cardHtml(a, true)).join('')}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
