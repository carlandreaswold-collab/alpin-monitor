<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>

":"Det kjøres Europacup-slalåm for menn i Suomu i Finland onsdag 25. november. Suomu er et lite alpinsenter i Lappland og har vært en fast arrangørsted i Europacupen, som fungerer som den nest høyeste nivået i internasjonal alpinsport under verdenscupen. For mange unge løpere er Europacupen den viktigste arenaen for å kjempe seg opp mot verdenscupnivå.","url":"https://www.skinews.ch/video/2026/europacup-slalom-maenner-suomu/","pub_date":"2026-11-25T08:28:28.000Z","fetched_at":"2026-11-25 08:38:17","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230645,"source_name":"ORF Sport","country":"AUT","title_no":"Damereslaløpene i Mont-Tremblant avlyst","title_orig":"Damen-Riesentorläufe in Mont-Tremblant abgesagt","summary_no":"Damenesenes storslalåmrenn i Mont-Tremblant er avlyst.","spik_no":"De to planlagte verdenscup-storslalåmrennene for kvinner i Mont-Tremblant 5. og 6. desember er avlyst på grunn av snømangel. FIS bekreftet avlysningen onsdag og opplyser at det jobbes med å finne en erstatningsarena. Neste helg er det Killington som står for tur med storslalåm lørdag og slalåm søndag, før sesongens første fartsuker i Beaver Creek venter 11.–13. desember.","url":"https://sport.orf.at/stories/3165408/","pub_date":"2026-11-25T07:37:12.000Z","fetched_at":"2026-11-25 08:38:18","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230591,"source_name":"Neveitalia","country":"ITA","title_no":"Ingen snø i Mont-Tremblant – nok en bitter avlysning. FIS jobber med plan B","title_orig":"Non c'è neve a Mont-Trémblant, come nel 2024 è una cancellazione amarissima. La FIS lavora al piano B, ma...","summary_no":"Mangel på snø tvinger frem en ny avlysning i Mont-Tremblant, akkurat som i 2024. FIS jobber med en alternativ løsning.","spik_no":"De to verdenscup-storslalåmrennene for kvinner i Mont-Tremblant er avlyst for andre gang på tre sesonger – også i 2024 ble Canada-etappen strøket på grunn av snømangel. FIS hadde planlagt snøkontroll torsdag, men gikk ut med avlysningen allerede onsdag morgen fordi prognosene var for dårlige. Forbundet jobber nå med en plan B og forsøker å finne en erstatningsarena til de samme datoene 5.–6. desember, før fartsuken i Beaver Creek.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/non-c-e-neve-a-mont-tremblant-come-nel-2024-e-una-cancellazione-amarissima-la-fis-lavora-al-piano-b-ma","pub_date":"2026-11-25T07:25:00.000Z","fetched_at":"2026-11-25 08:38:15","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230627,"source_name":"VG","country":"NOR","title_no":"Verdenscuprenn avlyst etter snømangel","title_orig":"Verdenscuprenn avlyst etter snømangel","summary_no":"","spik_no":"Verdenscuprennene i storslalåm for kvinner i Mont-Tremblant 5. og 6. desember er avlyst på grunn av snømangel. FIS oppgir at snøkanonene kjøres på nattestid, men at plussgrader og lett regn om dagen gjør det umulig å bygge opp løypa. Forbundet jobber med å finne en alternativ arrangørby for de to rennene. Neste helg kjører alpinkvinnene storslalåm og slalåm i Killington i Vermont.","url":"https://www.vg.no/sport/i/9Bv9br/verdenscuprenn-avlyst-etter-snoemangel?utm_medium=rss","pub_date":"2026-11-25T07:20:52.000Z","fetched_at":"2026-11-25 08:38:18","lang_orig":"no","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230606,"source_name":"SkinEWS","country":"SUI","title_no":"Avlyst – ingen verdenscup-storslalåm i Tremblant","title_orig":"Abgesagt – keine Weltcup-Riesenslaloms in Tremblant","summary_no":"Verdenscup-rennene i storslalåm i Tremblant er avlyst og vil ikke bli gjennomført.","spik_no":"De to verdenscup-storslalåmrennene for kvinner i Mont-Tremblant 5. og 6. desember er avlyst på grunn av utilstrekkelig snø. Snøkanonene har gått for fullt om natten, men plussgrader og regn om dagen har gjort det umulig å forberede løypa på den kjente \"Flying Mile\"-traseen. FIS søker nå etter en alternativ arrangørby for de samme datoene. Avlysningen er en gjentakelse av situasjonen fra 2024, da Canada-etappen også ble strøket.","url":"https://www.skinews.ch/news/2026/abgesagt-riesenslaloms-tremblant/","pub_date":"2026-11-25T07:12:35.000Z","fetched_at":"2026-11-25 08:38:17","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":230695,"source_name":"Expressen","country":"SWE","title_no":"Caijsa Hennemann etter dramaet i Polen: – Det var grusomt","title_orig":"Caijsa Hennemann efter dramat i Polen: ”Det var hemskt”","summary_no":"Alpinisten Caijsa Hennemann forteller åpenhjertig om det dramatiske som skjedde under konkurransen i Polen og beskriver opplevelsen som grusom.","spik_no":"Den svenske alpinisten Caijsa Hennemann beskriver opplevelsen fra en konkurranse i Polen som grusom, og forteller åpenhjertig om et dramatisk hendelsesforløp. Hennemann er en av Sveriges mest lovende unge alpinister og har konkurrert på høyt nivå i Europa de siste årene. Detaljer om hva som faktisk skjedde er foreløpig ikke kjent fra artikkelteksten, men Hennemanns egne ord tyder på at episoden var betydelig og preget henne sterkt.","url":"https://www.expressen.se/sport/tennis/caijsa-hennemann-efter-dramat-i-polen-det-var-hemskt/","pub_date":"2026-11-24T22:22:10.000Z","fetched_at":"2026-11-25 08:38:18","lang_orig":"sv","category":null,"athletes":"Caijsa Hennemann","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":227275,"source_name":"Ski Racing","country":"INT","title_no":"Slik hjelper Steamboat Mountain School og Steamboat Springs Winter Sports Club familier med alpint","title_orig":"How Steamboat Mountain School and Steamboat Springs Winter Sports Club Help Families Make Ski Racing Work","summary_no":"Steamboat Mountain School og Steamboat Springs Winter Sports Club tilbyr familier gode rammer for å kombinere skolegang og alpintrening på høyt nivå.","spik_no":"Steamboat Mountain School og Steamboat Springs Winter Sports Club i Colorado tilbyr et integrert opplegg der unge alpinister kan kombinere skolegang og trening på høyt nivå. Steamboat Springs er et av USAs fremste alpinmiljøer og har fostret en rekke landslagsutøvere gjennom nettopp denne modellen, der koordinering mellom akademikere og idrett står sentralt. For familier som Brady-familien fra Cincinnati – uten alpinbakgrunn selv – gir et slikt miljø muligheten til å satse seriøst uten at utøveren må ofre verken utdanning eller fellesskap.","url":"https://skiracing.com/how-steamboat-mountain-school-and-steamboat-springs-winter-sports-club-help-families-make-ski-racing-work/","pub_date":"2026-11-24T18:57:14.000Z","fetched_at":"2026-11-24 19:00:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":225994,"source_name":"Ski Racing","country":"INT","title_no":"Kyle Negomirs VM-drøm startet i bakkene på Copper Mountain","title_orig":"Kyle Negomir’s World Cup Dream Started on This Copper Mountain Hill","summary_no":"Kyle Negomirs vei mot verdenscupen begynte på skibakken på Copper Mountain.","spik_no":"Kyle Negomir fra Littleton, Colorado, er tilbake på Copper Mountain – den samme bakken der han som 8-åring lekte at han kjørte verdenscup. Nå stiller han til start i Stifel Copper Cup super-G 28. november med et ekte verdenscupstoppur. Det er et følelsesladet comeback etter at Negomir fullførte på 10.-plass i OL-utforkjøringen i Bormio – hans olympiske debut. Veien dit gikk gjennom en tung kneskade som holdt ham utenfor Beijing-OL i 2022, der lagkameratene Ryan Cochran-Siegle og River Radamus henholdsvis vant sølv og ble nummer fire i GS.","url":"https://skiracing.com/kyle-negomir-copper-mountain/","pub_date":"2026-11-24T17:26:26.000Z","fetched_at":"2026-11-24 17:30:02","lang_orig":"en","category":null,"athletes":"Kyle Negomir","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":224734,"source_name":"Neveitalia","country":"ITA","title_no":"Rast og Holdener leder det sveitsiske laget i Killington","title_orig":"Rast e Holdener, Killington è sempre stata dolcissima: le punte elvetiche guidano il team anche nel Vermont","summary_no":"Wendy Holdener og Michelle Rast er Sveits' fremste kort i Killington, et sted som alltid har vært godt for sveitsiske alpinister.","spik_no":"Wendy Holdener og Camille Rast leder det sveitsiske laget inn til slalåm og storslalåm i Killington i Vermont denne helgen. Killington har historisk sett vært et godt sted for Sveits: Holdener har stått på pallen i slalåm de fire siste gangene på «Superstar»-løypa, inkludert seier i 2022, mens Rast vant sin aller første verdenscupseier nettopp her i fjor. Rast åpnet sesongen solid i Sölden, men slet noe i andre omgang i storslalåmen.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/rast-e-holdener-killington-e-sempre-stata-dolcissima-le-punte-elvetiche-guidano-il-team-anche-nel-vermont","pub_date":"2026-11-24T16:20:00.000Z","fetched_at":"2026-11-24 16:30:02","lang_orig":"it","category":null,"athletes":"Camille Rast,Wendy Holdener","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":224262,"source_name":"SVT Sport","country":"SWE","title_no":"Lisa Nyberg gjør comeback etter 15 måneder: – Kunne ikke bøye beina","title_orig":"Lisa Nyberg gör comeback efter 15 månader: ”Kunde inte böja benen”","summary_no":"Lisa Nyberg er tilbake i konkurranseform etter 15 måneder borte. Svenske alpinisten har slitt med alvorlige skader som gjorde det umulig å bøye beina.","spik_no":"Lisa Nyberg gjør comeback i verdenscupen denne helgen etter 15 måneder borte fra konkurranse. Den 24 år gamle svenske slalåmkjøreren skadet kneet alvorlig under et forsesongstreningsleir i fjor – skaden omfattet korsbåndet, begge meniskene og brusk, og krevde operasjoner på begge bena. Nyberg lå sengeliggende i ukesvis og klarte ikke å bøye beina i den første tiden etter operasjonen. I desember 2025 gjennomgikk hun ytterligere et inngrep, og har gradvis bygget opp styrken gjennom sommeren frem mot comebacket.","url":"https://www.svt.se/sport/alpint/lisa-nyberg-gor-comeback-efter-15-manader-kunde-inte-boja-benen","pub_date":"2026-11-24T15:49:28.000Z","fetched_at":"2026-11-24 16:00:04","lang_orig":"sv","category":null,"athletes":"Lisa Nyberg","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":223776,"source_name":"RTV SLO","country":"SLO","title_no":"Andreja Slokar hopper over amerikaturné: ett skritt tilbake for to fremover","title_orig":"Andreja Slokar izpušča ameriško turnejo: korak nazaj za dva naprej","summary_no":"Slovenske Andreja Slokar velger å stå over den amerikanske alpinturné i et strategisk grep for å komme sterkere tilbake.","spik_no":"Slovenska slalomspesialist Andreja Slokar velger å hoppe over den amerikanske alpinturnen og satser i stedet på å bygge seg opp til resten av sesongen. Slokar er en av Slovenias fremste alpinister og har vunnet World Cup-renn i slalåm, men har slitt med å finne stabilt toppnivå. Et bevisst valg om å stå over renn er uvanlig i alpinsporten, men kan gi gevinst når det gjelder fysisk overskudd og teknisk forberedelse frem mot vinterens viktigste konkurranser.","url":"https://www.rtvslo.si/sport/andreja-slokar-izpusca-amerisko-turnejo-korak-nazaj-za-dva-naprej/801119","pub_date":"2026-11-24T15:16:42.000Z","fetched_at":"2026-11-24 15:30:04","lang_orig":"sl","category":null,"athletes":"Andreja Slokar","athlete_nations":["SLO"],"also_sources":[],"norwegian":false},{"id":222564,"source_name":"Neveitalia","country":"ITA","title_no":"Mange italienske alpinister samlet i Solda til europacuptrening","title_orig":"Solda accoglie tantissimi azzurri: velocisti dei team femminile e maschile di Coppa Europa in pista","summary_no":"Både herrer og damer fra det italienske europacuplaget er i Solda for å trene på pisten.","spik_no":"Det italienske europacuplaget samler både herrer og damer til fartstrening i Solda i Sør-Tirol denne uken. På dameside er blant andre Camilla Vanni, Sofia Parravicini og Ambra Pomaré i arbeid, mens herrelaget med Emanuel Lamp, Leonardo Rigamonti og Pietro Broglio avslutter sitt opphold torsdag 26. november. Solda, som ligger ved foten av Ortler-massivet, er et klassisk italiensk treningssted for alpinister om høsten, og samlingene markerer den siste forberedelsen før europacupsesongen starter.","url":"https://www.neveitalia.it/sport/scialpino/news/solda-accoglie-tantissimi-azzurri-velocisti-dei-team-femminile-e-maschile-di-coppa-europa-in-pista","pub_date":"2026-11-24T13:55:00.000Z","fetched_at":"2026-11-24 14:00:02","lang_orig":"it","category":null,"athletes":"Ambra Pomaré","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":221649,"source_name":"Neveitalia","country":"ITA","title_no":"Tigeren er tilbake: Brignone på ski igjen etter 91 dager","title_orig":"La tigre è tornata, di nuovo! A 91 giorni dall'intervento, Federica Brignone in pista oggi a Cervinia","summary_no":"Federica Brignone er tilbake på ski bare 91 dager etter operasjonen, og trente i dag på pisten i Cervinia.","spik_no":"Federica Brignone er tilbake på ski 91 dager etter en operasjon i venstre bein, der hun fikk fjernet osteosyntesemateriell, og trente mandag på glacieret ved Cervinia i sin hjemregion Valle d'Aosta. Den 35 år gamle italieneren, som vant den samlede verdenscupen i 2020 og 2025 samt to OL-gull i Milano-Cortina 2026, har hatt en svært vanskelig høst — et forsøk på å teste skiene 30. juli gikk ikke bra og utløste beslutningen om ny operasjon. Nordamerika-rundene er trolig uaktuelle, og når hun kan debutere konkurransemessig i sesongen 2026/27 er fortsatt uklart.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/la-tigre-e-tornata-di-nuovo-a-91-giorni-dall-intervento-federica-brignone-in-pista-oggi-a-cervinia","pub_date":"2026-11-24T12:35:00.000Z","fetched_at":"2026-11-24 12:45:02","lang_orig":"it","category":null,"athletes":"Federica Brignone","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":220551,"source_name":"Neveitalia","country":"ITA","title_no":"Her er de italienske kvinnene som utfordrer «Superstjernen»","title_orig":"Ufficiali le azzurre che sfideranno la \"Superstar\": dal rientro di Goggia alla fame di Rossetti, si presenta l'Italdonne","summary_no":"Italia presenterer sitt kvinnelag, med Sofia Goggia tilbake etter skade og en sulten Rossetti klar for utfordringen.","spik_no":"Italia presenterer sitt kvinnelag til verdenscuphelgen i Killington, Vermont, der den ikoniske «Superstar»-løypa er tilbake på programmet etter to års fravær. Høydepunktet er Sofia Goggias sesongdebut — den regjerende olympiske utforkjøringsmesteren har øvet seg opp ved Copper Mountain og er klar for å kjempe i storslalåm lørdag. Italia stiller med elleve startnumre i storslalåm og ni i slalåm, der Marta Bassino og Federica Brignone normalt er lagets fremste kort i tekniske øvelser.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/ufficiali-le-azzurre-che-sfideranno-la-superstar-dal-rientro-di-goggia-alla-fame-di-rossetti-si-presenta-l-italdonne","pub_date":"2026-11-24T11:40:00.000Z","fetched_at":"2026-11-24 11:43:41","lang_orig":"it","category":null,"athletes":"Marta Rossetti,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":220646,"source_name":"Expressen","country":"SWE","title_no":"Ken Fagerberg er død – ble 37 år","title_orig":"Ken Fagerberg är död – blev 37 år","summary_no":"Den svenske alpinisten Ken Fagerberg er død, bare 37 år gammel.","spik_no":"Artikkelteksten handler ikke om alpinisten Ken Fagerberg, men om den svenske fotballspilleren Ken Fagerberg, som ble funnet død i sengen sin på Færøyene mandag, 37 år gammel. Fagerberg fikk sitt gjennombrudd i Örgryte IS i 2007 og spilte senere i flere danske klubber før han vendte tilbake til Sverige. Han har i intervjuer åpent fortalt om problemer med alkohol og rusmidler gjennom karrieren. Dødsårsaken er foreløpig uklar.","url":"https://www.expressen.se/sport/fotboll/ken-fagerberg-ar-dod--blev-37-ar/","pub_date":"2026-11-24T11:29:10.000Z","fetched_at":"2026-11-24 11:43:44","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":220002,"source_name":"Neveitalia","country":"ITA","title_no":"Schwarz dobbeltstart, Eichberger tilbake og Brennsteiners triumfbakke: Østerrike klart for Copper","title_orig":"Doppio impegno per Schwarz, il ritorno di Eichberger e la pista del trionfo di Brennsteiner: ecco l'Austria per Copper","summary_no":"Østerrike stiller med et bredt lag til Copper Mountain, med Schwarz i dobbelt oppdrag, comeback for Eichberger og en bakke der Brennsteiner tidligere har triumfert.","spik_no":"Østerrike stiller med et bredt lag til Copper Mountain, der Marco Schwarz er aktuell i to disipliner og Stefan Eichberger gjør comeback etter en alvorlig kneskade han pådro seg i Val Gardena i desember i fjor. Eichberger, som fyller 26 år nettopp nå, er klar for super-G-åpningen lørdag 28. november. Vincent Kriechmayr, som ble nummer to i Colorado i fjor, gjør sesongdebut, mens veteranen Stefan Brennsteiner stiller i kjempesvingen der han har tatt sin eneste verdenscupseier.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/doppio-impegno-per-schwarz-il-ritorno-di-eichberger-e-la-pista-del-trionfo-di-brennsteiner-ecco-l-austria-per-copper","pub_date":"2026-11-24T11:05:00.000Z","fetched_at":"2026-11-24 11:15:02","lang_orig":"it","category":null,"athletes":"Marco Schwarz,Stefan Brennsteiner","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":219652,"source_name":"SkinEWS","country":"SUI","title_no":"Østerrike stiller med tolv utøvere i Copper Mountain","title_orig":"Österreich in Copper Mountain mit einem Dutzend Athleten am Start","summary_no":"Det østerrikske alpinlandslaget stiller med et dusin utøvere til konkurransene i Copper Mountain.","spik_no":"Østerrike stiller med tolv utøvere totalt i Copper Mountain, der det er satt opp Super-G lørdag og storslalåm søndag 28.–29. november. Patrick Feurstein er blant de få som er nominert til begge renn, og han sikret den siste startplassen i Super-G. Det østerrikske alpinforbundet ÖSV er tradisjonelt ett av de sterkeste nasjonene i alpint og sender jevnlig store tropper til nordamerikanske Verdenscup-renn tidlig i sesongen.","url":"https://www.skinews.ch/news/2026/oesterreich-mountain-athleten/","pub_date":"2026-11-24T10:43:17.000Z","fetched_at":"2026-11-24 10:45:04","lang_orig":"de","category":null,"athletes":"Patrick Feurstein","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":219694,"source_name":"ORF Sport","country":"AUT","title_no":"Feurstein sikrer siste Super-G-billett til Copper","title_orig":"Feurstein holt letztes Super-G-Ticket für Copper","summary_no":"Feurstein har kvalifisert seg til Super-G-rennet i Copper Mountain og sikret den siste plassen på laget.","spik_no":"Patrick Feurstein har sikret den siste plassen i Super-G-rennet i Copper Mountain, som kjøres lørdag 28. november. Vorarlbergeren stiller sammen med blant andre Vincent Kriechmayr, Marco Schwarz og Raphael Haaser i det østerrikske laget på ti mann. Også Patricks yngre fetter Lukas Feurstein er nominert, og begge to er dessuten med i troppen til søndagens storslalåm. Copper Mountain er tradisjonelt den første nordamerikanske stopp på Verdenscup-programmet i alpint.","url":"https://sport.orf.at/stories/3165368/","pub_date":"2026-11-24T10:41:45.000Z","fetched_at":"2026-11-24 10:45:05","lang_orig":"de","category":null,"athletes":"Patrick Feurstein,Vincent Kriechmayr","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":219093,"source_name":"Neveitalia","country":"ITA","title_no":"Gode nyheter om Kilde: – Kan være klar til Kvitfjell i mars","title_orig":"Da Kilde arrivano ottime notizie: potrebbe rientrare per la tappa di Kvitfjell a marzo. \"E' un'opzione realistica\"","summary_no":"Det meldes om positive signaler rundt Aleksander Aamodt Kildes skadeopptrening. En retur til Kvitfjell-rennet i mars omtales som et realistisk alternativ.","spik_no":"Aleksander Aamodt Kilde opplyser at en retur til Kvitfjell-rennet i mars 2026 er et realistisk mål etter achillesseneskaden han pådro seg i Chile. 34-åringen var gjest på ServusTV og avviste tidlig enhver tanke om karriereslutt – dette til tross for at det er hans andre alvorlige skade på under tre år, etter knetragedien i Wengen i januar 2024. Kvitfjell-rennene 6.–7. mars er de siste fartsdistansene før verdenscupfinalen, og Kilde ser på dem som en mulig oppkjøring mot neste sesong.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/da-kilde-arrivano-ottime-notizie-potrebbe-rientrare-per-la-tappa-di-kvitfjell-a-marzo-e-un-opzione-realistica","pub_date":"2026-11-24T10:05:00.000Z","fetched_at":"2026-11-24 10:15:03","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":218369,"source_name":"Neveitalia","country":"ITA","title_no":"SKI-TEST: Völkls nyheter for neste sesong","title_orig":"SKI TEST: le novità della prossima stagione in casa Völkl","summary_no":"En gjennomgang av Völkls nye skimodeller og nyheter som er klare for kommende sesong.","spik_no":"Völkl presenterer nye skimodeller for sesongen 2026/27, og det italienske testpanelet NeveItalia har prøvekjørt elleve modeller fra produsentens sortiment. Høydepunktet er den nye Racetiger GS Master, en racingski med opphav fra konkurranseavdelingen, som beskrives som svært stabil i høy fart, men krever god teknikk og fysisk form. Racetiger SL og den nye allround-modellen Racetiger MC Blue mottar begge utmerkelsen «Valgt av testerne» — for henholdsvis kjøreegenskaper og komfort. Völkl er et av de store alpinmerkene med lang tradisjon innen både konkurranseski og breddemarkedet.","url":"https://www.neveitalia.it/test/news/ski-test-le-novita-della-prossima-stagione-in-casa-volkl","pub_date":"2026-11-24T09:10:00.000Z","fetched_at":"2026-11-24 09:15:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":218063,"source_name":"ORF Sport","country":"AUT","title_no":"Kilde planlegger comeback som forløper i Kvitfjell","title_orig":"Kilde plant Comeback als Vorläufer in Kvitfjell","summary_no":"Aleksander Aamodt Kilde planlegger å gjøre comeback som forløper under rennet i Kvitfjell.","spik_no":"Aleksander Aamodt Kilde planlegger å komme tilbake på verdenstoppen som forløper under Kvitfjell-rennet 6. eller 7. mars 2027. 34-åringen pådro seg et achillessenebrudd under trening i Chile i midten av oktober, og sier rehabiliteringen går fremover – han kan nå trene med større vekter og bevege seg mer fritt. Kilde, som har 21 verdenscupseire og to OL-medaljer, har vært hardt rammet av skader de siste årene; senest et alvorlig fall i Wengen-utforkjøringen i januar 2024 som skadet både legg og skulder.","url":"https://sport.orf.at/stories/3165363/","pub_date":"2026-11-24T08:47:54.000Z","fetched_at":"2026-11-24 09:00:04","lang_orig":"de","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":["RTV SLO"],"norwegian":true},{"id":217842,"source_name":"SkinEWS","country":"SUI","title_no":"Nick Rickenbach (21) velger ny vei utenfor løypene","title_orig":"Nick Rickenbach (21) schlägt einen neuen Weg abseits der Pisten ein","summary_no":"Den 21 år gamle alpinisten Nick Rickenbach har valgt å legge om kursen og satser på noe nytt utenfor skibakken.","spik_no":"Den 21 år gamle sveitsiske alpinisten Nick Rickenbach legger opp på grunn av helseproblemer, og avslutter dermed en kort karriere i ung alder. Rickenbach, som kommer fra Schwyz og konkurrerte i de raske disiplinene samt storslalåm, var en del av Swiss Skis C-lag. Han beskriver det selv som en «vanskelig, følelsesmessig krevende, men riktig avgjørelse». C-laget i Sveits er et utviklingsprogram for unge lovende utøvere, og det er uvanlig å avslutte karrieren så tidlig i denne fasen.","url":"https://www.skinews.ch/news/2026/rickenbach-schlaegt-abseits/","pub_date":"2026-11-24T08:41:43.000Z","fetched_at":"2026-11-24 08:45:03","lang_orig":"de","category":null,"athletes":"Nick Rickenbach","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":217645,"source_name":"Neveitalia","country":"ITA","title_no":"Via Buffalo mot Killington: De italienske alpinistene krysser USA foran lørdagens storslalåm","title_orig":"Volo su Buffalo e poi direzione Killington: le azzurre attraversano gli Stati Uniti verso il gigante di sabato","summary_no":"De italienske alpinistjentene er på vei til Killington via Buffalo for å forberede seg til lørdagens storslalåmrenn i USA.","spik_no":"Det italienske alpinlandslaget for kvinner er på vei til Killington i Vermont via Buffalo, der de skal delta i verdenscupens storslalåm lørdag. Kvartetten – Asja Zenere, Marta Bassino, Laura Pirovano og Sofia Goggia – har tilbrakt nesten to uker på treningssenteret i Copper Mountain i Colorado. Killington har en særlig plass i italiensk alpinhistorie: Bassino vant her i 2019, og Goggia tok sitt første verdenscuppall på denne bakken for ti år siden. Zenere gikk inn i reisen som lagets beste i åpningsrennet i Sölden.","url":"https://www.neveitalia.it/sport/scialpino/news/volo-su-buffalo-e-poi-direzione-killington-le-azzurre-attraversano-gli-stati-uniti-verso-il-gigante-di-sabato","pub_date":"2026-11-24T08:25:00.000Z","fetched_at":"2026-11-24 08:30:02","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino,Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":216202,"source_name":"Neveitalia","country":"ITA","title_no":"Sveriges nordamerikanske kampanje: Lisa Nyberg tilbake for tre storslalåmrenn","title_orig":"La campagna nordamericana della Svezia: torna Lisa Nyberg per i 3 giganti, Hector fu \"Superstar\" nel 2024","summary_no":"Sverige innleder sin nordamerikanske kampanje med Lisa Nyberg tilbake i troppen, mens Hector var en «Superstar» under 2024-sesongen.","spik_no":"Lisa Nyberg er tilbake i den svenske troppen etter over halvannet år med fravær, og skal delta i tre storslalåmrenn i Nord-Amerika – i Killington og Mont-Tremblant. Nyberg er datter av den tidligere alpinisten Pernilla Wiberg, som vant OL-gull og VM-titler på 1990-tallet. Sara Hector, som hadde en strålende sesong i 2024, leder an i det svenske kvinnelaget i storslalåm og kommer til Nord-Amerika i storform etter gode resultater i Gurgl. Felix Monsen er Sveriges fremste kort på herresiden i de raske disiplinene i Copper Mountain og Beaver Creek.","url":"https://www.neveitalia.it/sport/scialpino/news/la-campagna-nordamericana-della-svezia-torna-lisa-nyberg-per-i-3-giganti-hector-fu-superstar-nel-2024","pub_date":"2026-11-24T06:55:00.000Z","fetched_at":"2026-11-24 07:00:02","lang_orig":"it","category":null,"athletes":"Sara Hector","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":210754,"source_name":"Ski Racing","country":"INT","title_no":"Dr. Haley Perlus om mental trening i alpint","title_orig":"Dr. Haley Perlus on Training the Mental Side of Ski Racing","summary_no":"Dr. Haley Perlus deler sin ekspertise om hvordan alpinister kan trene den mentale siden av skiracing for å prestere bedre i konkurranser.","spik_no":"Dr. Haley Perlus, som har en PhD i idrettspsykologi, blir ny fast bidragsyter for Ski Racing Media og vil dele ekspertise om mental trening i alpint. Perlus har lang erfaring med å jobbe med utøvere på alle nivåer, og artikkelen peker på at mental trening fortsatt innføres for sent i mange utøveres karriere — ofte først etter skader. Idrettspsykologi har fått stadig større plass i toppidretten, men i alpint er fagfeltet ifølge bidragsyteren fremdeles underutnyttet i den daglige treningsstrukturen.","url":"https://skiracing.com/dr-haley-perlus-on-training-the-mental-side-of-ski-racing/","pub_date":"2026-11-24T00:43:22.000Z","fetched_at":"2026-11-24 00:45:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":207978,"source_name":"Ski Racing","country":"INT","title_no":"Killington World Cup Foundation deler ut over 250.000 dollar i ski-stipender","title_orig":"Killington World Cup Foundation Awards $250K+ in Ski Grants","summary_no":"Killington World Cup Foundation har tildelt mer enn 250.000 dollar i stipender til skiidretten.","spik_no":"Killington World Cup Foundation har tildelt over 250.000 dollar i stipender til 12 skiområder og ideelle organisasjoner i fem nordøstlige delstater i USA. En uvanlig finansieringskilde bidro tungt: 150.000 dollar kom fra salget av de originale gondolkabinene fra Skyeship-taubanen, som ble auksjonert bort sommeren 2025. Stiftelsen, som er knyttet til verdenscuprennet Stifel Killington Cup, bidro med ytterligere 100.000 dollar fra egne midler etter å ha gjennomgått hele 44 søknader. Midlene skal blant annet dekke taubane-reparasjoner, ny løypeprepperingsmaskin og snøproduksjonsutstyr.","url":"https://skiracing.com/killington-world-cup-foundation-grants-2026/","pub_date":"2026-11-23T21:38:34.000Z","fetched_at":"2026-11-23 21:45:02","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206655,"source_name":"Neveitalia","country":"ITA","title_no":"Blir Colturi Shiffrins største rival i søndagens slalåm i Killington?","title_orig":"Sarà Colturi la prima rivale di Shiffrin domenica? Probabile, Mikaela resta la grande favorita per lo slalom di Killington","summary_no":"Lara Colturi pekes ut som den fremste utfordreren til Mikaela Shiffrin i slalåmen i Killington søndag, men Shiffrin er fortsatt klar favoritt.","spik_no":"Lara Colturi ble utpekt som den fremste utfordreren til Mikaela Shiffrin foran slalåmen i Killington. Den 20 år gamle Colturi, som kjører for Albania, imponerte tidlig i sesongen med sterke resultater i slalåm og viste i Sölden at hun kan matche verdens beste. Shiffrin har historisk dominert på Killington, der hun har vunnet en rekke ganger og det amerikanske hjemmepublikumet alltid møter henne med enorm begeistring.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sara-colturi-la-prima-rivale-di-shiffrin-domenica-probabile-mikaela-resta-la-grande-favorita-per-lo-slalom-di-killington","pub_date":"2026-11-23T19:30:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":"Lara Colturi,Mikaela Shiffrin","athlete_nations":["ALB","USA"],"also_sources":[],"norwegian":false},{"id":206635,"source_name":"Ski Racing","country":"INT","title_no":"FIS godkjenner herrerenn i Beaver Creek i 2026","title_orig":"FIS Clears 2026 Men’s Stifel Birds of Prey Races at Beaver Creek","summary_no":"FIS har gitt klarsignal for Stifel Birds of Prey-rennene for menn i Beaver Creek i 2026-sesongen.","spik_no":"FIS ga grønt lys for Stifel Birds of Prey-rennene for menn i Beaver Creek i 2026-sesongen. Beaver Creek er en av de mest tradisjonsrike arenaene på herresirkusen, og Birds of Prey-løypen regnes som en av de mest krevende utforløypene i verdenscupen. Godkjenningen fra FIS var avhengig av at snø- og banestandarder ble oppfylt innen fastsatte frister, noe arrangørene altså klarte.","url":"https://skiracing.com/fis-clears-2026-mens-stifel-birds-of-prey-races-at-beaver-creek/","pub_date":"2026-11-23T18:29:22.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206657,"source_name":"Neveitalia","country":"ITA","title_no":"Sarrazin klar for comeback – ni franskmenn tatt ut til lørdag, én debutant fra Kroatia","title_orig":"Sarrazin, è tutto pronto per il gran rientro: \"Cyp\" tra i 9 francesi convocati per sabato, un esordiente nella Croazia","summary_no":"Cyprien Sarrazin er blant ni franske utøvere tatt ut til lørdagens renn, og Kroatia stiller med en debutant.","spik_no":"Cyprien Sarrazin var blant ni franske utøvere tatt ut til lørdagens renn i Beaver Creek, og comebacket hans ble fulgt med stor interesse. Den franske fartskjøreren har vært en av de mest spennende profilene i verdenscupen og har tidligere vist seg som en utfordrer i både utfor og super-G. I tillegg stilte Kroatia med en debutant, noe som understreker at alpinsporten stadig rekrutterer utøvere fra nye nasjoner.","url":"https://www.neveitalia.it/sport/scialpino/news/sarrazin-e-tutto-pronto-per-il-gran-rientro-cyp-tra-i-9-francesi-convocati-per-sabato-un-esordiente-nella-croazia","pub_date":"2026-11-23T18:15:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":206712,"source_name":"ORF Sport","country":"AUT","title_no":"Sarrazin tatt ut til super-G i Copper Mountain","title_orig":"Sarrazin für Super-G in Copper Mountain nominiert","summary_no":"Franske Cyprien Sarrazin er nominert til super-G-rennet i Copper Mountain i verdenscupen.","spik_no":"Cyprien Sarrazin er nominert til super-G-rennet i Copper Mountain og gjør dermed sitt etterlengtede comeback i alpint verdenscup, nesten to år etter at han pådro seg en hjerneblødning under en treningsulykke i Bormio i desember 2024. Den 32 år gamle franskmannen var blant verdens beste fartskjørere før skaden og vant begge utfor-rennene i Kitzbühel i 2024. Rennet i Copper Mountain lørdag blir hans første verdenscupstart siden ulykken.","url":"https://sport.orf.at/stories/3165353/","pub_date":"2026-11-23T18:12:14.000Z","fetched_at":"2026-11-23 19:52:44","lang_orig":"de","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":206714,"source_name":"ORF Sport","country":"AUT","title_no":"ØSV-laget håper på «oversjøisk effekt»","title_orig":"ÖSV-Team hofft auf „Übersee-Effekt“","summary_no":"Det østerrikske alpinlandslaget håper at rennene i USA vil gi dem en positiv «oversjøisk effekt» og bedre resultater.","spik_no":"Det østerrikske alpinlandslaget har hatt en skuffende sesongstart og sitter med kun én pallplass etter seks renn – Katharina Truppes tredjeplass i slalomen i Levi. I Gurgl endte damenes slalom uten østerrikere i topp ti, noe alpinsjef Christian Mitter betegnet som et negativt lavpunkt. Laget håper nå på en såkalt \"oversjøisk effekt\" når de reiser til Nord-Amerika, en effekt som historisk sett har gitt mange lag et løft utenfor hjemmebane. Joshua Sturm pekes ut som en av de lyspunktene fra en ellers vanskelig sesongstart.","url":"https://sport.orf.at/stories/3165328/","pub_date":"2026-11-23T17:59:39.000Z","fetched_at":"2026-11-23 19:52:44","lang_orig":"de","category":null,"athletes":"Katharina Truppe","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":206768,"source_name":"RTV SLO","country":"SLO","title_no":"Sarrazin tilbake i verdenscupen etter nesten to år","title_orig":"Sarrazin se po skoraj dveh letih vrača na tekme svetovnega pokala","summary_no":"Den franske alpinisten Sarrazin gjør comeback i verdenscupen etter en fravær på nesten to år.","spik_no":"Franske Cyprien Sarrazin er klar for comeback i verdenscupen nesten to år etter et alvorlig fall under trening i Bormio i desember 2024, der han pådro seg blant annet en hjerneblødning. Sarrazin var i 2024 en av alpinens mest formsterke utøvere og vant to påfølgende utfor-renn i Kitzbühel. Comebacket markerer slutten på en lang og krevende rehabiliteringsprosess for 32-åringen, som nå er nominert til super-G i Copper Mountain.","url":"https://www.rtvslo.si/sport/sarrazin-se-po-skoraj-dveh-letih-vraca-na-tekme-svetovnega-pokala/801030","pub_date":"2026-11-23T17:49:56.000Z","fetched_at":"2026-11-23 19:52:45","lang_orig":"sl","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":206716,"source_name":"ORF Sport","country":"AUT","title_no":"Grønt lys for verdenscuprenn i Beaver Creek","title_orig":"Grünes Licht für Weltcup-Bewerbe in Beaver Creek","summary_no":"Verdenscuprennene i Beaver Creek er offisielt godkjent og klare til gjennomføring.","spik_no":"FIS har godkjent snøforholdene i Beaver Creek og gitt grønt lys for herrenes verdenscuprenn i Colorado 3.–6. desember. Programmet inneholder to utfor-renn, et super-G og en storslalåm – og markerer starten på de klassiske nordamerikanske vinterdestinasjonene i verdenscupkalenderen. Beaver Creek er en av de mest prestisjefylte arenaene på herrenes program, kjent for den teknisk krevende Birds of Prey-bakken.","url":"https://sport.orf.at/stories/3165350/","pub_date":"2026-11-23T17:46:07.000Z","fetched_at":"2026-11-23 19:52:44","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206658,"source_name":"Neveitalia","country":"ITA","title_no":"Beaver Creek klart: fire herrerenn bekreftet 3.–6. desember","title_orig":"Beaver Creek ce l'ha fatta: superato il controllo neve, è confermato il poker di gare maschili dal 3 al 6 dicembre","summary_no":"Beaver Creek har bestått snøkontrollen og er klar for fire herrerenn i desember. Rennene er offisielt bekreftet av FIS.","spik_no":"FIS bekreftet offisielt fire herrerenn i Beaver Creek i perioden 3.–6. desember etter at snøkontrollen var bestått. Beaver Creek arrangerer tradisjonelt Birds of Prey-helgen, som er en av de mest prestisjefylte på herresirkusen med utfor og super-G i Colorado. Løypen er kjent for sin tekniske krevende karakter og bratte partier som tester kjørerne til det ytterste, og rennet trekker alltid et stort internasjonalt publikum.","url":"https://www.neveitalia.it/sport/scialpino/news/beaver-creek-ce-l-ha-fatta-superato-il-controllo-neve-e-confermato-il-poker-di-gare-maschili-dal-3-al-6-dicembre","pub_date":"2026-11-23T17:45:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206671,"source_name":"SkinEWS","country":"SUI","title_no":"FIS gir grønt lys for rennene i Beaver Creek","title_orig":"FIS gibt für die Rennen in Beaver Creek „grünes Licht“","summary_no":"Det internasjonale skiforbundet FIS har godkjent avviklingen av rennene i Beaver Creek.","spik_no":"FIS har gitt klarsignal for verdenscuprennene i Beaver Creek etter at en snøkontroll mandag 23. november ga positivt resultat. Kontrollen ble utsatt to dager, men lave temperaturer og noe natursnø har sikret tilstrekkelig underlag til å preparere den berømte «Birds of Prey»-løypa. Rennene er planlagt i perioden 3. til 6. desember, og Beaver Creek er et av alpinens mest tradisjonsrike steder for fart.","url":"https://www.skinews.ch/news/2026/rennen-beaver-gruenes/","pub_date":"2026-11-23T17:41:41.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206659,"source_name":"Neveitalia","country":"ITA","title_no":"Meillard går glipp av super-G i Copper – Piller trekker seg fra Killington","title_orig":"Niente super-g a Copper per Loic Meillard, ecco lo squadrone svizzero per il Colorado. Piller rinuncia a Killington","summary_no":"Loic Meillard er ikke med i den sveitsiske troppen til super-G i Copper Mountain. Piller har også trukket seg fra konkurransen i Killington.","spik_no":"Loic Meillard var ikke med i den sveitsiske troppen til super-G i Copper Mountain, noe som vakte oppsikt gitt hans sterke form i tekniske disipliner. Meillard er en allsidig kjører som har markert seg i både slalåm, storslalåm og kombinerte disipliner gjennom karrieren. I tillegg trakk Piller seg fra konkurransen i Killington, noe som svekket startfeltet ytterligere i det som er et travelt program tidlig i sesongen.","url":"https://www.neveitalia.it/sport/scialpino/news/niente-super-g-a-copper-per-loic-meillard-ecco-lo-squadrone-svizzero-per-il-colorado-piller-rinuncia-a-killington","pub_date":"2026-11-23T17:10:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":"Loïc Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":206787,"source_name":"franceinfo","country":"FRA","title_no":"Sarrazin klar for super-G nesten to år etter alvorlig fall i Bormio","title_orig":"Près de deux ans après sa grave chute à Bormio, le skieur français Cyprien Sarrazin annoncé sur le super-G de la prochaine étape de Coupe du monde","summary_no":"Franske Cyprien Sarrazin er nominert til super-G i neste verdenscupetappe, nesten to år etter sitt alvorlige fall i Bormio.","spik_no":"Cyprien Sarrazin er nominert til super-G i Copper Mountain, og gjør dermed comeback i verdenscupen nesten to år etter det alvorlige fallet i Bormio i desember 2024, der han pådro seg en hjerneblødning. Den franske alpinismen var i strålende form før ulykken og vant utfor-rennet i Kitzbühel to ganger på rad i 2024. Sarrazin er 32 år og representerer Frankrike, som har en sterk tradisjon i utfor- og super-G-greinene. Rennet i Copper Mountain, USA, finner sted lørdag.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/pres-de-deux-ans-apres-sa-grave-chute-a-bormio-le-skieur-francais-cyprien-sarrazin-annonce-sur-le-super-g-de-la-prochaine-etape-de-coupe-du-monde_8296386.html#xtor=RSS-3-%5Bsports%2Fsports-d-hiver%2Fski-alpin%5D","pub_date":"2026-11-23T16:38:02.000Z","fetched_at":"2026-11-23 19:52:45","lang_orig":"fr","category":null,"athletes":"Cyprien Sarrazin","athlete_nations":["FRA"],"also_sources":[],"norwegian":false},{"id":206672,"source_name":"SkinEWS","country":"SUI","title_no":"Flere comebacks og en forsinket debut i Copper Mountain","title_orig":"Mehrere Comebacks und eine verspätete Premiere in Copper Mountain","summary_no":"Flere utøvere gjør comeback i Copper Mountain, samtidig som én utøver endelig får sin forsinkede verdenscupdebut.","spik_no":"I Copper Mountain kjøres det super-G lørdag 28. november og storslalåm dagen etter som en del av herrenesernes verdenscupåpning for fartsøvelsene i 2026/27-sesongen. Det sveitsiske laget stiller med en sterk troika bestående av Marco Odermatt, Franjo von Allmen og Loic Meillard, men flere utøvere gjør også comeback etter skader, og én kjører venter på sin forsinkede verdenscupdebut. Rennarenaen i Colorado er et relativt nytt tilskudd til verdenscupkalenderen.","url":"https://www.skinews.ch/news/2026/comebacks-verspaetete-premiere/","pub_date":"2026-11-23T14:39:40.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206664,"source_name":"Neveitalia","country":"ITA","title_no":"Skitest: Vi har testet Head 2027-kolleksjonen","title_orig":"SKI TEST: abbiamo testato la nuova gamma Head 2027","summary_no":"Den nye Head-skikolleksjonen for 2027 er satt under lupen i en grundig skitest.","spik_no":"Head er et av de ledende skimerkene i alpinsporten og utstyrer en rekke toppkjørere på verdenscupsirkusen. Testen av 2027-kolleksjonen gir et tidlig innblikk i hvilken retning merket tar sin teknologi og konstruksjon. Skitester er viktige for både forhandlere og utøvere på mosjonsnivå, og Head har tradisjonelt investert tungt i utvikling basert på erfaringer fra toppidrettsarenaen.","url":"https://www.neveitalia.it/test/news/ski-test-abbiamo-testato-la-nuova-gamma-head-2027","pub_date":"2026-11-23T13:45:00.000Z","fetched_at":"2026-11-23 19:52:41","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206673,"source_name":"SkinEWS","country":"SUI","title_no":"Elleve sveitsiske kvinner skal kjøre verdenscuprenn i Killington","title_orig":"Elf Schweizerinnen werden die Weltcup-Rennen in Killington bestreiten","summary_no":"Sveits stiller med elleve utøvere til verdenscuprennene i Killington.","spik_no":"Sveits stiller med elleve utøvere til verdenscuprennene i Killington, Vermont, der det kjøres storslalåm 28. november og slalåm 29. november. Sue Piller og Janine Mächler er ikke med på grunn av helseproblemer. Det er niende gang Killington arrangerer verdenscuprenn for kvinner på «Super Star»-løypa, og sveitserne har tidligere hatt suksess her.","url":"https://www.skinews.ch/news/2026/schweizerinnen-killington-bestreiten/","pub_date":"2026-11-23T10:44:03.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206734,"source_name":"SVT Sport","country":"SWE","title_no":"Ekspert reagerer på ny FIS-regel: «Det kommer til å bli brutalt»","title_orig":"Experten reagerar på nya Fis-regeln: ”Det kommer bli brutalt”","summary_no":"En ekspert advarer om konsekvensene av en ny FIS-regel og mener den vil slå hardt ut for utøverne.","spik_no":"En ekspert har advart om at en ny FIS-regel vil få store og potensielt brutale konsekvenser for utøverne i alpint. FIS har de siste årene innført flere regelendringer knyttet til blant annet startprosedyrer, sikkerhetsutstyr og kvalifiseringssystemer, noe som jevnlig skaper debatt i alpinmiljøet. Detaljene rundt den konkrete regelen det reageres på fremgår ikke av artikkelen, men ekspertuttalelsen tyder på at den vil påvirke konkurransesituasjonen merkbart.","url":"https://www.svt.se/sport/langdskidor/experten-reagerar-pa-nya-fis-regeln-det-kommer-bli-brutalt","pub_date":"2026-11-23T10:26:16.000Z","fetched_at":"2026-11-23 19:52:44","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206797,"source_name":"Sportschau","country":"GER","title_no":"Lara Colturi skriver historie – med hele familiens hjelp","title_orig":"Lara Colturi schreibt Geschichte - mit Hilfe der ganzen Familie","summary_no":"Lara Colturi har skrevet alpin skihistorie, og hele familien har vært en viktig del av reisen.","spik_no":"20 år gamle Lara Colturi vant slalomrennet i Gurgl og satte dermed alpin skihistorie som den første representanten for Albania til å vinne et verdenscuprenn. Det var hennes første seier etter ni tidligere pallplasseringer i karrieren, og hun vant med 0,27 sekunder foran svenske Sara Hector. Colturi er italienskfødt, men valgte å konkurrere for Albania – på samme måte som Lucas Pinheiro Braathen skiftet nasjonalitet til Brasil. Med bare 20 år på baken regnes hun allerede som en av alpinens største talenter.","url":"https://www.sportschau.de/wintersport/ski-alpin/lara-colturi-schreibt-geschichte-mit-hilfe-der-ganzen-familie,ski-alpin-lara-colturi-schreibt-geschichte-100.html","pub_date":"2026-11-23T09:49:24.000Z","fetched_at":"2026-11-23 19:52:46","lang_orig":"de","category":null,"athletes":"Lara Colturi","athlete_nations":["ALB"],"also_sources":[],"norwegian":false},{"id":206674,"source_name":"SkinEWS","country":"SUI","title_no":"To nordmenn og Tangy Nef på pallen i Gurgl-slalåmen","title_orig":"Zwei Norweger und Tangy Nef auf dem Podest des Gurgl-Slaloms","summary_no":"To norske utøvere og sveitsiske Tangy Nef kapret pallplasser i slalåmen i Gurgl.","spik_no":"Timon Haugan og Eirik Hystad Solberg tok norsk dobbeltseier i verdenscupslalåmen i Gurgl, Østerrike, mens sveitsiske Tanguy Nef kom på tredjeplass og tok sitt første verdenscuppodium bare tre dager etter at han fylte 30 år. Det er fjerde gang herrene kjører slalåm på Kirchenkar-løypa i Gurgl, som har hatt vinnere fra Østerrike, Frankrike og nå Norge. Lucas Pinheiro Braathen, som hadde vunnet de to foregående verdenscuprennene, falt ut tidlig i første omgang.","url":"https://www.skinews.ch/video/2026/norweger-podest-slaloms/","pub_date":"2026-11-22T14:46:11.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Tanguy Nef,Timon Haugan","athlete_nations":["NOR","SUI"],"also_sources":[],"norwegian":true},{"id":206636,"source_name":"Ski Racing","country":"INT","title_no":"Haugan vinner slalåm i Gurgl – Solberg og Nef tar første pallplass i verdenscupen","title_orig":"Haugan Wins Gurgl Slalom as Solberg and Nef Celebrate First World Cup Podiums","summary_no":"Timon Haugan tok seieren i Gurgl-slalåmen. Henrik Solberg og Marc Nef kunne juble for sine første pallplasseringer i verdenscupen.","spik_no":"Timon Haugan vant slalåmen i Gurgl og befestet sin posisjon som en av Norges fremste teknikkjørere. Henrik Solberg og sveitseren Marc Nef kunne begge feire sine første pallplasseringer i verdenscupen – en milepæl for to av de yngre talentene i det internasjonale startfeltet. Gurgl i Østerrike er et relativt nytt stopp på verdenscupsirkusen, men har raskt etablert seg som et populært sted for tidlige slalåmrenn på herresiden.","url":"https://skiracing.com/haugan-wins-gurgl-slalom-as-solberg-and-nef-celebrate-first-world-cup-podiums/","pub_date":"2026-11-22T14:32:06.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Tanguy Nef,Timon Haugan","athlete_nations":["NOR","SUI"],"also_sources":[],"norwegian":true},{"id":206798,"source_name":"Sportschau","country":"GER","title_no":"Ski alpint – Straßer i skyggen av Haugans slalomseier","title_orig":"Ski Alpin - Straßer fährt bei Haugans Sieg im Slalom hinterher","summary_no":"Henrik Haugan vant slalomrennet, mens tyske Linus Straßer ikke klarte å henge med i kampen om seieren.","spik_no":"Timon Haugan vant herrenes slalom i Gurgl og tok sin sjette verdenscupseier i disiplinen, mens tyske Linus Straßer endte på en skuffende 18.-plass, 2,05 sekunder bak. Haugan satte bestid i første omgang og kontrollerte ledelsen i finaleomgangen uten å ta unødvendig risiko. Nordmennene dominerte totalpodiet, med Eirik Hystad Solberg på andreplass, mens Tanguy Nef fra Sveits tok tredjeplassen. Straßer, som er 34 år og et av Tysklands fremste slalomess, har hatt et vanskelig forhold til Gurgl-bakken og har aldri funnet formen sin der.","url":"https://www.sportschau.de/wintersport/ski-alpin/strasser-faehrt-bei-haugans-slalomsieg-hinterher,rennbericht-gurgl-slalom-maenner-100.html","pub_date":"2026-11-22T14:28:55.000Z","fetched_at":"2026-11-23 19:52:46","lang_orig":"de","category":null,"athletes":"Linus Straßer,Timon Haugan","athlete_nations":["GER","NOR"],"also_sources":[],"norwegian":true},{"id":206675,"source_name":"SkinEWS","country":"SUI","title_no":"Norsk dobbeltseier i Gurgl og første pallplass til Tangy Nef","title_orig":"Norwegischer Doppelsieg in Gurgl und das erste Podest für Tangy Nef","summary_no":"Norge tok dobbeltseier i slalåmen i Gurgl, mens Tangy Nef sikret sin første pallplass i verdenscupen.","spik_no":"Timon Haugan ledet etter første omgang og holdt unna for å vinne slalåmen i Gurgl foran lagkamerat Eirik Hystad Solberg, som dermed ga Norge en historisk dobbeltseier på Kirchenkar-løypa. Tanguy Nef tok sin første verdenscuppall i karrieren som 30-åring, bare tre dager etter bursdagen. Lucas Pinheiro Braathen, som kjører for Brasil, var storfavoritt etter seirer i Sølden og Levi, men falt ut på einfädler tidlig i første omgang og mistet sjansen til tre strake seirer.","url":"https://www.skinews.ch/news/2026/norwegischer-doppelsieg-podest/","pub_date":"2026-11-22T13:23:47.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Atle Lie McGrath,Clement Noel,Lucas Braathen,Manuel Feller,Tanguy Nef,Timon Haugan","athlete_nations":["AUT","BRA","FRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":206676,"source_name":"SkinEWS","country":"SUI","title_no":"EC: Anna Flatscher bekrefter formen med 6. plass","title_orig":"EC: Anna Flatscher liefert mit Rang 6 die Bestätigung","summary_no":"Anna Flatscher leverte en sterk prestasjon med en 6. plass i europacupen og bekreftet dermed sin gode form.","spik_no":"18 år gamle sveitsiske Anna Flatscher viste solid form med en sjetteplass i det andre europacup-slalåmrennet i Levi, bare et par dager etter at hun tok tredjeplass i åpningsrennet. Det var kun hennes tredje europacuprenn totalt, og resultatene peker mot en lovende karriere. Topp fem i rennet besto av utøvere med verdenscuperfaring, noe som gjør Flatschers plasseringer ekstra imponerende.","url":"https://www.skinews.ch/news/2026/flatscher-liefert-bestaetigung/","pub_date":"2026-11-22T13:05:09.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206637,"source_name":"Ski Racing","country":"INT","title_no":"Haugan leder i Gurgl med 0,01 sekund – Seymour på 10.-plass","title_orig":"Haugan Leads Gurgl by 0.01; Seymour Charges Into 10th","summary_no":"Timon Haugan leder etter første omgang i Gurgl med kun hundredelen til gode. Seymour imponerte med en tiendeplass fra startnummer 26.","spik_no":"Timon Haugan leder etter første omgang i slalåmrennet i Gurgl med kun én hundredel ned til nærmeste rival. Haugan er en av Norges mest stabile slalåmkjørere og har vært på pallen i verdenscupen tidligere, men venter fortsatt på sin første seier på øverste nivå. At Sebastian Seymour kjørte seg inn på 10.-plass fra startnummer 26 er også oppsiktsvekkende, og viser bredden i det norske slalåmlaget.","url":"https://skiracing.com/haugan-leads-gurgl-by-0-01-seymour-charges-into-10th/","pub_date":"2026-11-22T11:24:26.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Timon Haugan","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":206677,"source_name":"SkinEWS","country":"SUI","title_no":"Norske utøvere dominerte 1. omgang i Gurgl-slalåmen","title_orig":"Norweger drücken dem 1. Lauf des Gurgl-Slaloms den Stempel auf","summary_no":"Norske alpinister satte sitt preg på den første omgangen av slalåmen i Gurgl.","spik_no":"Norge dominerte første omgang av verdenscupslalåmen i Gurgl med Timon Haugan øverst, kun ett hundredels sekund foran lagkamerat Atle Lie McGrath. Belgianske Armand Marchant lå på tredjeplass etter første omgang, mens sveitsiske Tanguy Nef var beste sveitsiske løper på sjuendeplass. Storfavoritten Lucas Pinheiro Braathen, som nettopp hadde vunnet i Sølden og Levi, mistet staven og falt ut tidlig i løypa.","url":"https://www.skinews.ch/weltcup/2026/norweger-druecken-slaloms/","pub_date":"2026-11-22T10:21:48.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Atle Lie McGrath,Lucas Braathen,Tanguy Nef,Timon Haugan","athlete_nations":["BRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":206678,"source_name":"SkinEWS","country":"SUI","title_no":"EC-dameskalåm (2. omgang) sendes direkte fra Levi kl. 13","title_orig":"Der zweite EC-Frauen-Slalom (2. Lauf) ab 13 Uhr live aus Levi","summary_no":"Den andre omgangen av europacup-slalåmen for kvinner i Levi kan følges direkte fra klokken 13.","spik_no":"Andre omgang av europacup-slalåmen for kvinner i Levi ble sendt direkte fra klokken 13. Levi i Finland er et klassisk åpningssted for slalåmsesongen, og europacupen her gir unge og fremadstormende utøvere viktig konkurranseerfaring tidlig i sesongen. Rennet inngår i europacupkalenderen for 2026/27-sesongen.","url":"https://www.skinews.ch/video/2026/europacup-auftakt-frauen/","pub_date":"2026-11-22T08:00:25.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206679,"source_name":"SkinEWS","country":"SUI","title_no":"Korsbåndskade – sesongen over for Mary Bocock","title_orig":"Kreuzbandriss – Saison für Mary Bocock bereits zu Ende","summary_no":"Mary Bocock har pådratt seg et korsbåndsbrudd og er ferdig for sesongen.","spik_no":"23 år gamle amerikanske Mary Bocock har pådratt seg brudd på fremre korsbånd og ytre ligament i høyre kne og er allerede operert, noe som betyr at sesongen er over for henne. Skaden er et hardt slag ettersom 2026/27-sesongen er en VM-sesong, og Bocock fra Salt Lake City hadde håpet på å representere USA i fartsøvelsene og storslalåm på hjemmebane. Hun meldte om skaden via Instagram fra sykehussengen.","url":"https://www.skinews.ch/news/2026/kreuzbandriss-saison-bereits/","pub_date":"2026-11-22T07:44:58.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Mary Bocock","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":206638,"source_name":"Ski Racing","country":"INT","title_no":"Startliste herres slalåm Gurgl 2026: Braathen jakter historisk bragd","title_orig":"Gurgl Men’s Slalom Start List 2026: Braathen Chases History","summary_no":"Startlisten for herres slalåm i Gurgl er klar, med Lucas Braathen som en av de store favorittene i jakten på historisk suksess.","spik_no":"Lucas Braathen er blant favorittene i herres slalåm i Gurgl, og jakter det som omtales som en historisk bragd. Braathen, som tidligere kjørte for Norge, valgte i 2023 å skifte nasjonalitet til Brasil – et land han har tilknytning til gjennom sin mor. Han ble den første brasilianeren til å vinne et verdenscuprenn da han tok seier i Schladming i januar 2024, og en ny triumf i Gurgl ville ytterligere sementere hans plass i alpinhistorien.","url":"https://skiracing.com/gurgl-mens-slalom-start-list-2026-braathen-chases-history/","pub_date":"2026-11-21T19:04:24.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":206799,"source_name":"Sportschau","country":"GER","title_no":"Tåke ødela for Aichers neste slalombragd","title_orig":"Nebel verhindert Aichers nächsten Slalom-Coup","summary_no":"Tåke satte en stopper for Aicher og hindret ham i å gjenta en sterk slalomprestasjon.","spik_no":"Emma Aicher måtte nøye seg med en åttendeplass i Gurgl-slalomen, drøye to uker etter sin triumf i Levi, der hun vant sesongåpningen. Tåke i første omgang kostet henne dyrt, og hun innrømmet selv at hun \"chilte for mye og ga for lite gass\". Fra 13.-plass etter første omgang kjempet hun seg frem til åttende totalt, 1,05 sekunder bak vinneren Lara Colturi. Aicher, som representerer Tyskland, er i ferd med å etablere seg som en av de fremste slalomkjørerne i verdenscupen.","url":"https://www.sportschau.de/wintersport/ski-alpin/nebel-verhindert-naechsten-aicher-coup-in-gurgl-,rennbericht-gurgl-slalom-frauen-100.html","pub_date":"2026-11-21T14:42:28.000Z","fetched_at":"2026-11-23 19:52:46","lang_orig":"de","category":null,"athletes":"Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER"],"also_sources":[],"norwegian":false},{"id":206805,"source_name":"Sportschau","country":"GER","title_no":"Damenes slalom i Gurgl – oppsummering","title_orig":"Der Slalom der Frauen in Gurgl - die Zusammenfassung","summary_no":"Her er et sammendrag av damenes slalomrenn i Gurgl.","spik_no":"Damenes slalom i Gurgl ble avgjort i vanskelige forhold med tåke i første omgang og en teknisk krevende nøkkelpassasje i andre omgang. Lara Colturi vant foran to svenske løpere – Sara Hector og Anna Swenn Larsson – i fravær av Mikaela Shiffrin, som ikke deltok i rennet. Gurgl i Østerrike er en fast del av alpinkalenderen i november og er kjent for sin tekniske og krevende slalombakke.","url":"https://www.sportschau.de/wintersport/ski-alpin/der-slalom-der-frauen-in-gurgl-die-zusammenfassung,zusammenfassung-ski-alpin-gurl-slalom-frauen-100.html","pub_date":"2026-11-21T14:41:16.000Z","fetched_at":"2026-11-23 19:52:46","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":206639,"source_name":"Ski Racing","country":"INT","title_no":"Lara Colturi tar sin første verdenscupseier i Gurgl","title_orig":"Lara Colturi Claims First World Cup Win in Gurgl","summary_no":"Lara Colturi sikret seg sin aller første verdenscupseier i slalåmrennene i Gurgl.","spik_no":"Lara Colturi tok sin aller første verdenscupseier i slalåmrennet i Gurgl, en merkedag for den unge italiensk-albanskfødte utøveren. Colturi er født i 2006 og regnes som et av de største talentene i kvinnealpint de siste årene – hun ble verdensmester i slalåm i juniorklassen og har lenge vært ventet å slå gjennom på seniornivå. Seieren bekrefter at hun nå er klar for å utfordre de etablerte stjernene i verdenscupen.","url":"https://skiracing.com/lara-colturi-claims-first-world-cup-win-in-gurgl/","pub_date":"2026-11-21T14:23:52.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Lara Colturi","athlete_nations":["ALB"],"also_sources":["SkinEWS"],"norwegian":false},{"id":206681,"source_name":"SkinEWS","country":"SUI","title_no":"EC: Anna Flatscher på pallen i åpningsrennet i Levi","title_orig":"EC: Anna Flatscher fährt zum Auftakt in Levi auf das Podest","summary_no":"Anna Flatscher startet europacupsesongen sterkt med en pallplass i Levi.","spik_no":"18 år gamle sveitsiske Anna Flatscher tok tredjeplass i åpningsrennet av europacupsesongen i Levi, Finland, allerede i sitt andre europacuprenn noensinne. Italienske Beatrice Sola vant rennet foran norske Bianca Bakke Westhoff, mens syv sveitsiske løpere totalt klarte topp 25. Flatscher er fra Øst-Sveits og fremstår som et av de store sveitsiske slalåmtalentene i damealpint.","url":"https://www.skinews.ch/news/2026/flatscher-faehrt-auftakt/","pub_date":"2026-11-21T13:42:11.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Anna Flatscher","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":206682,"source_name":"SkinEWS","country":"SUI","title_no":"Lara Colturi sørger for Albanias første verdenscupseier","title_orig":"Lara Colturi sorgt für den ersten albanischen Weltcup-Sieg","summary_no":"Lara Colturi gikk til topps og ga Albania sin historiske første verdenscupseier i alpint.","spik_no":"Lara Colturi vant slalåmrennet i Gurgl og ga Albania sin aller første seier i alpint verdenscup. Den 20 år gamle utøveren er italiensk av fødsel, men konkurrerer under albansk flagg – en situasjon som har vakt oppsikt i alpinmiljøet. Seieren kom knapt overraskende: i sesongåpningen i Sölden skilte det bare ett hundredels sekund fra topplasseringen. Sara Hector og Anna Swenn Larsson tok de to neste plassene på pallen.","url":"https://www.skinews.ch/news/2026/colturi-albanischen-weltcup/","pub_date":"2026-11-21T13:27:12.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Anna Swenn-Larsson,Lara Colturi,Sara Hector","athlete_nations":["ALB","SWE"],"also_sources":[],"norwegian":false},{"id":206640,"source_name":"Ski Racing","country":"INT","title_no":"Swenn Larsson leder Gurgl-slalåm – Hurt stormer inn på sjetteplass","title_orig":"Anna Swenn Larsson Leads Gurgl Slalom as Hurt Charges Into Sixth From Bib 26","summary_no":"Anna Swenn Larsson leder etter første omgang i Gurgl. Paula Hurt imponerte med en sjetteplass fra startnummer 26.","spik_no":"Anna Swenn Larsson leder etter første omgang i dameslagåmrennet i Gurgl, og den svenske veteranen er godt kjent i rollen som ledende etter første omgang. Swenn Larsson har vært en av verdenscupens mest stabile slalåmkjørere gjennom flere sesonger, men har ventet lenge på sin første seier på øverste nivå. At Paula Hurt stormet inn på sjetteplass fra startnummer 26 er et overraskende og positivt innslag i andreomgangen.","url":"https://skiracing.com/anna-swenn-larsson-leads-gurgl-slalom-as-hurt-charges-into-sixth-from-bib-26/","pub_date":"2026-11-21T11:17:43.000Z","fetched_at":"2026-11-23 19:52:40","lang_orig":"en","category":null,"athletes":"Anna Swenn-Larsson","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":206683,"source_name":"SkinEWS","country":"SUI","title_no":"Anna Swenn Larsson jakter sin tredje slalåmseier","title_orig":"Anna Swenn Larsson greift nach dem dritten Slalom-Sieg","summary_no":"Svenske Anna Swenn Larsson sikter mot en tredje slalåmseier i verdenscupen.","spik_no":"Anna Swenn Larsson ledet etter første omgang i slalåmen i Gurgl og siktet mot sin tredje verdenscupseier. De to foregående utgavene av Gurgl-slalåmen ble begge vunnet av Mikaela Shiffrin, men amerikaneren var ikke i stand til å forsvare tittelen denne gang. Swenn Larsson, som er en av de mest erfarne slalåmkjørerne på den svenske troppen, har gjennom karrieren vist seg som en stødig pallkandidat i tekniske disipliner.","url":"https://www.skinews.ch/weltcup/2026/larsson-greift-dritten/","pub_date":"2026-11-21T10:21:57.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":"Anna Swenn-Larsson,Mikaela Shiffrin","athlete_nations":["SWE","USA"],"also_sources":[],"norwegian":false},{"id":206684,"source_name":"SkinEWS","country":"SUI","title_no":"Beaver Creek – et kappløp mot klokken","title_orig":"Beaver Creek – ein Wettlauf gegen die Zeit","summary_no":"Arrangørene i Beaver Creek kjemper mot tiden for å få rennene gjennomført.","spik_no":"Arrangørene i Beaver Creek stod overfor store utfordringer med å få rennene på plass til planlagt tid. Beaver Creek er et av de mest tradisjonsrike stoppene på herresirkusen, kjent for den krevende Birds of Prey-løypen som er godt egnet for utfor og super-G. Snø- og værforhold i Colorado kan skape uforutsigbare situasjoner tidlig i sesongen, og arrangørene har ved flere anledninger tidligere måttet jobbe intenst for å oppfylle FIS sine krav til baneforhold.","url":"https://www.skinews.ch/news/2026/beaver-creek-wettlauf/","pub_date":"2026-11-21T08:49:46.000Z","fetched_at":"2026-11-23 19:52:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":204619,"source_name":"SVT Sport","country":"SWE","title_no":"Splittrelsen i det norske kvinnelandslaget – én dukket opp på samlingen: «Ekstremt dårlig»","title_orig":"Splittringen i norska damlandslaget – en dök upp på lägret: ”Extremt dåligt”","summary_no":"Det norske kvinnelandslaget i alpint er preget av splittrelse, og kun én utøver møtte opp på samlingen. Situasjonen beskrives som «ekstremt dårlig».","spik_no":"Det norske kvinnelandslaget i langrenn er preget av alvorlig splittrelse – på en forberedelsessamling i Idre i begynnelsen av november møtte kun én av elleve uttatte løpere opp: 21 år gamle debutant Milla Grosberghaugen Andreassen, som trente alene med coach Marit Bjørgen. – Jeg synes det er ekstremt dårlig, sier Andreassen til NRK. Uroen i laget har pågått over tid, blant annet valgte Astrid Øyre Slind, Karoline Simpson-Larsen og Karoline Grøtting å prioritere privatlag fremfor landslaget, noe som midlertidig stengte dem ute fra verdenscupen. Situasjonen setter søkelys på en vedvarende kulturell og organisatorisk krise i norsk damlangrenn.","url":"https://www.svt.se/sport/langdskidor/splittringen-i-norska-damlandslaget-en-dok-upp-pa-lagret-extremt-daligt","pub_date":"2026-11-20T22:04:48.000Z","fetched_at":"2026-11-20 22:15:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":204428,"source_name":"ORF Sport","country":"AUT","title_no":"Alpinistene gir full gass i Gurgl","title_orig":"Truppe gibt in Gurgl wieder Vollgas","summary_no":"Alpintroppene er tilbake i Gurgl og kjører for fullt igjen.","spik_no":"Den østerrikske slalomkjøreren Katharina Truppe kom inn til helgens renn i Gurgl med god selvtillit etter en tredjeplass i sesongåpningen i Levi. 30-åringen fra Kärnten håper å gjenta bragden i hjemlig terreng, selv om treningsøktene i Gurgl har gått trått. De to tidligere slalomrennene i Gurgl – Europas høyest liggende ikke-bre-skisenter – ble begge vunnet av Mikaela Shiffrin, men amerikaneren er fraværende denne helgen og fokuserer på raskere disipliner frem mot Killington neste uke, noe som åpner feltet betraktelig.","url":"https://sport.orf.at/stories/3165180/","pub_date":"2026-11-20T21:50:14.000Z","fetched_at":"2026-11-20 22:00:03","lang_orig":"de","category":null,"athletes":"Katharina Truppe","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":203469,"source_name":"Ski Racing","country":"INT","title_no":"Lindsey Vonn starter ACL-rehabilitering etter niende operasjon","title_orig":"Lindsey Vonn Begins ACL Rehab After Ninth Surgery","summary_no":"Lindsey Vonn har påbegynt rehabilitering av korsbåndet etter å ha gjennomgått sin niende operasjon i karrieren.","spik_no":"Lindsey Vonn har påbegynt rehabilitering etter sin niende operasjon i karrieren — en ACL-rekonstruksjon i venstre kne som varte over fem timer. Den 42 år gamle amerikaneren skadet korsbåndet i et fall under verdenscuprenn i Crans-Montana i januar, og pådro seg deretter et lårbensbrudd under OL-utforsrennet i Cortina d'Ampezzo ni dager senere. Bruddet måtte først gro fullstendig før kirurgene kunne fjerne plater og skruer og rekonstruere korsbåndet i samme operasjon — derav den ni måneder lange ventetiden. Vonn, som er tidenes mestvinnende kvinne i alpint med 82 verdenscupseirer, anslår at hun trenger seks til ni måneder til med rehabilitering.","url":"https://skiracing.com/lindsey-vonn-begins-acl-rehab-after-ninth-surgery/","pub_date":"2026-11-20T20:43:12.000Z","fetched_at":"2026-11-20 20:45:02","lang_orig":"en","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":202665,"source_name":"ORF Sport","country":"AUT","title_no":"FIS-snøkontroll i Beaver Creek utsatt","title_orig":"FIS-Schneekontrolle in Beaver Creek verschoben","summary_no":"FIS-snøkontrollen i Beaver Creek er blitt utsatt.","spik_no":"FIS-snøkontrollen i Beaver Creek er utsatt på grunn av dårlige snøforhold, og åpningsrennene i herrealpint denne sesongen er dermed i fare. I Beaver Creek er det planlagt to utfor-renn 3. og 4. desember, super-G 5. desember og storslalåm 6. desember. Beaver Creek er en av de mest tradisjonsrike alpinbakkene i USA og har vært fast del av verdenscupkalenderen siden 1983. Usikkerhet rundt snøforhold tidlig i sesongen er ikke uvanlig i Colorado, men skaper ekstra press i et VM-år der lagene ønsker tidlig konkurransepraksis.","url":"https://sport.orf
