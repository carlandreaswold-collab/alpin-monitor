.skinews.ch/news/2026/pechvogel-weltcup-debuetanten/","pub_date":"2026-10-31T21:35:38.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Oscar Heine","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":84360,"source_name":"Neveitalia","country":"ITA","title_no":"Kildes mamma om lagkameratenes støtte: «En fantastisk gjeng»","title_orig":"Kilde, l'affetto dei compagni di squadra, il racconto di mamma Kristin: \"Un gruppo di persone fantastiche\"","summary_no":"Aleksander Aamodt Kildes mor Kristin forteller om den varme støtten sønnen har fått fra lagkameratene sine under rehabiliteringen.","spik_no":"Aleksander Aamodt Kildes mor Kristin forteller om den varme støtten sønnen har fått fra lagkameratene under rehabiliteringen etter akillessenen-skaden han pådro seg i Chile 15. oktober 2026. Skaden koster ham hele sesongen og kommer knapt tre år etter det alvorlige kneskaden i Wengen i januar 2023. Kilde skal selv ha sagt at han manglet bare ti prosent for å være på et nivå der han kunne kjempe om seire igjen. Også Steen Olsen sliter med kneproblemene, noe som skaper usikkerhet rundt norges alpinlag foran rennene i Copper Mountain og Beaver Creek.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/kilde-l-affetto-dei-compagni-di-squadra-il-racconto-di-mamma-kristin-un-gruppo-di-persone-fantastiche","pub_date":"2026-10-31T12:30:00.000Z","fetched_at":"2026-11-01 21:00:02","lang_orig":"it","category":null,"athletes":"Aleksander Aamodt Kilde","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":84331,"source_name":"Ski Racing","country":"INT","title_no":"Moltzans Sölden-seier viderefører collegeskiingens VM-arv","title_orig":"Paula Moltzan’s Sölden Win Extends Collegiate Skiing’s World Cup Legacy","summary_no":"Paula Moltzans verdenscupseier i Sölden bekrefter den sterke tradisjonen amerikanske collegeskiløpere har i verdenscupen.","spik_no":"Paula Moltzan vant åpningsrennets storslalåm i Sölden 24. oktober 2026 med 0,01 sekunds margin etter å ha gått fra femteplass til seier på andrerunden. 32-åringen ble dermed den eldste kvinnen som har vunnet sitt første verdenscuprenn i alpint. Med 13 sesonger på verdenscuptouren, ti pallplasser og OL-bronse i lagkonkurransen fra Milano-Cortina 2026 i bagasjen, var Sölden-seieren det resultatet som hadde unnsluppet henne lengst. Seieren løfter samlet pallstatistikk til 11, og bekrefter den sterke tradisjonen NCAA-utdannede løpere har for å lykkes på det høyeste nivået.","url":"https://skiracing.com/paula-moltzan-world-cup-ncaa-skiing/","pub_date":"2026-10-30T21:35:48.000Z","fetched_at":"2026-11-01 21:00:01","lang_orig":"en","category":null,"athletes":"Paula Moltzan","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":84332,"source_name":"Ski Racing","country":"INT","title_no":"Derfor valgte Lara Gut-Behrami livet etter skikarrieren","title_orig":"Why Lara Gut-Behrami chose life beyond ski racing","summary_no":"Den sveitsiske stjernen Lara Gut-Behrami forteller om valgene som førte henne bort fra toppidrettslivet og hva som venter henne videre.","spik_no":"Lara Gut-Behrami kunngjorde sin karriereslutt i august 2026, selv om hun hadde kommet seg fullt tilbake etter en alvorlig kneskade. I et intervju med Tages-Anzeiger forklarte hun at det ville koste for mye energi og kreve for mange måneders oppofringer å vende tilbake, og at skisporten de siste årene hadde føles mer som en byrde enn en frihet. Sveitseren rakk heller ikke la seg friste av utsikten til et hjemme-VM i Crans-Montana i februar 2027. Karrieren hennes teller 48 verdenscupseire, 101 pallplasser og sammenlagtseire i 2016 og 2024.","url":"https://skiracing.com/why-lara-gut-behrami-chose-life-beyond-ski-racing/","pub_date":"2026-10-30T20:23:30.000Z","fetched_at":"2026-11-01 21:00:01","lang_orig":"en","category":null,"athletes":"Lara Gut-Behrami","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":84334,"source_name":"Ski Racing","country":"INT","title_no":"SYNC Performance Elite: Det kuttresistente undertøyet løpere bør kjenne til","title_orig":"SYNC Performance Elite Cut Resistant Base Layer: What Racers Need to Know This Season","summary_no":"SYNC Performances nye kuttresistente base layer er designet spesielt for alpinister og kan bli et viktig sikkerhetstilskudd denne sesongen.","spik_no":"Fra og med sesongen 2026/27 krever FIS at alle utøvere i FIS-godkjente alpinrenn bruker kuttresistente bukser, en regel som tidligere kun gjaldt de øverste konkurransenivåene som verdenscup og kontinentalcup. SYNC Performance lanserer nå et kuttresistent base layer-plagg som er godkjent med tre stjerner etter FIS-DITF 2021-standarden og finnes i både voksen- og juniørstørrelser. Bakgrunnen for regelskjerpingen er at skikanter er skarpere enn noensinne og kan forårsake alvorlige kutt ved fall, særlig på beina.","url":"https://skiracing.com/sync-performance-elite-cut-resistant-base-layer-what-racers-need-to-know-this-season/","pub_date":"2026-10-30T11:30:00.000Z","fetched_at":"2026-11-01 21:00:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":84368,"source_name":"SkinEWS","country":"SUI","title_no":"Michelle Gisin – avgjørelsen nærmer seg","title_orig":"Michelle Gisin – die Entscheidung naht","summary_no":"For Michelle Gisin nærmer en viktig avgjørelse seg, trolig knyttet til hennes videre karriere i alpint.","spik_no":"Sveitsiske Michelle Gisin nærmer seg trolig en avgjørelse om sin fremtid i alpint. Gisin vant kombinasjon under OL i Pyeongchang 2018 og har gjennom karrieren kjempet mot gjentatte skadeproblemer, særlig kneskader. Hun er søster av den tidligere verdenscupvinneren Marc Gisin og kombinasjonsspesialisten Dominique Gisin, og har lenge vært en allrounder i det sveitsiske landslaget.","url":"https://www.skinews.ch/news/2026/michelle-gisin-entscheidung/","pub_date":"2026-10-30T10:50:54.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Michelle Gisin","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":84369,"source_name":"SkinEWS","country":"SUI","title_no":"BOSV: Franjo von Allmen gjest på sesongåpningen","title_orig":"BOSV: Franjo von Allmen als Gast beim Saison-Kick-off","summary_no":"Franjo von Allmen var æresgjest under Bayersk skiforbunds sesongkick-off og delte erfaringer med deltakerne.","spik_no":"Sveitsiske Franjo von Allmen var æresgjest under Bayersk skiforbunds sesongåpning og delte erfaringer fra sitt gjennombrudd på verdenscupnivå. Von Allmen markerte seg kraftig i sesongen 2023/24 med sterke resultater i utfør og super-G, og ble raskt regnet som et av alpinsportens største nye navn. At han inviteres som inspirasjonskilde for tysk ungdom understreker den imponerende gjennomslagskraften han har fått i hele alpinverden.","url":"https://www.skinews.ch/ski-insider/2026/franjo-allmen-saison/","pub_date":"2026-10-30T10:44:03.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Franjo von Allmen","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":84370,"source_name":"SkinEWS","country":"SUI","title_no":"Franjo von Allmen tildelt «Skieur d'Or»","title_orig":"Franjo von Allmen mit dem „Skieur d’Or“ ausgezeichnet","summary_no":"Franjo von Allmen er blitt tildelt den prestisjetunge prisen «Skieur d'Or» for sine prestasjoner i alpint.","spik_no":"Franjo von Allmen er tildelt «Skieur d'Or», en av alpinsportens mest prestisjefylte utmerkelser. Den sveitsiske fartsspesialisten hadde sitt store gjennombrudd i verdenscupsesongen 2023/24, da han tok flere pallplasseringer og imponerte i utfør og super-G. Prisen bekrefter at von Allmen allerede i ung alder er anerkjent som en av de fremste fartsutøverne i internasjonal alpint.","url":"https://www.skinews.ch/video/2026/franjo-allmen-ausgezeichnet/","pub_date":"2026-10-30T10:12:29.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Franjo von Allmen","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":84371,"source_name":"SkinEWS","country":"SUI","title_no":"Franjo von Allmen mottar «Skieur d'Or» for første gang","title_orig":"Franjo von Allmen erstmals mit dem „Skieur d’Or“ ausgezeichnet","summary_no":"For første gang er Franjo von Allmen hedret med «Skieur d'Or», en av alpinsportens gjeve utmerkelser.","spik_no":"Franjo von Allmen mottar «Skieur d'Or» for første gang og føyer seg dermed inn i en eksklusiv rekke av alpinstjerner som har mottatt utmerkelsen. Von Allmen fikk sitt internasjonale gjennombrudd i løpet av sesongen 2023/24 med imponerende resultater i de raske disiplinene utfør og super-G. For Sveits, som har en stolt tradisjon i fartsalpint, representerer den unge von Allmen et lysende håp for kommende sesonger.","url":"https://www.skinews.ch/news/2026/franjo-erstmals-ausgezeichnet/","pub_date":"2026-10-30T10:00:30.000Z","fetched_at":"2026-11-01 21:00:04","lang_orig":"de","category":null,"athletes":"Franjo von Allmen","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":82274,"source_name":"Neveitalia","country":"ITA","title_no":"Hirscher i Val Senales – italienske fartsjenter ankommer mandag","title_orig":"In Val Senales anche Hirscher e da lunedì le velociste azzurre di CdM, reduci dal blocco di lavoro allo Stelvio","summary_no":"Marcel Hirscher trener i Val Senales, og fra mandag slutter de italienske Verdenscup-fartsspesialistene seg til leiren etter treningsblokk på Stelvio.","spik_no":"Marcel Hirscher trener på breen i Val Senales og har ifølge italienske medier valgt å stå over åpningsrennet i Sölden – han vurderer nå om han vil delta i de to første slalomrennene i Levi og Gurgl. Den åttedobbelte verdenscupvinneren er tilbake i alpinsporten som nederlandsk statsborger etter å ha representert Østerrike gjennom hele sin storhetstid fra 2007 til 2019. Fra mandag slutter de italienske verdenscup-fartsjentene seg til leiren i Val Senales, etter en treningsblokk på Stelvio – blant dem søstrene Delago, Curtoni og Melesi.","url":"https://www.neveitalia.it/sport/scialpino/news/in-val-senales-anche-hirscher-e-da-lunedi-le-velociste-azzurre-di-cdm-reduci-dal-blocco-di-lavoro-allo-stelvio","pub_date":"2026-10-29T14:10:00.000Z","fetched_at":"2026-10-29 14:15:01","lang_orig":"it","category":null,"athletes":"Marcel Hirscher","athlete_nations":["NED"],"also_sources":[],"norwegian":false},{"id":82194,"source_name":"Expressen","country":"SWE","title_no":"Skiforbundets krisegrep – tvinges til å reise til Norge","title_orig":"Skidlandslagets krisdrag – tvingas åka till Norge","summary_no":"Det svenske alpinlandslaget er tvunget til å ta et drastisk grep i en krisesituasjon, og må reise til Norge.","spik_no":"Det svenske langrennlandslaget måtte avlyse det planlagte treningsleiren i Bruksvallarna og reiser i stedet til Trysil i Norge på grunn av snømangel. Den milde høsten har skapt krisestemning bare tre uker før sesongpremieren, og landslagsledelsen har den siste uken lett etter brukbare snøforhold i Sverige, Finland og Norge. Landslagssjef Niklas Jonsson bekrefter at Trysil til slutt ble valget. Situasjonen er et tegn på en stadig mer krevende treningshverdag for skandinaviske langrennsnasjoner i takt med mildere høsttemperaturer.","url":"https://www.expressen.se/sport/langdskidor/skidlandslagets-krisdrag-tvingas-aka-till-norge/","pub_date":"2026-10-29T13:51:35.000Z","fetched_at":"2026-10-29 14:00:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":["VG"],"norwegian":false},{"id":81167,"source_name":"Neveitalia","country":"ITA","title_no":"Marta Rossetti tok utdanning før comeback i Levi","title_orig":"In vista del gran ritorno a Levi dopo una stagione ai box, Marta Rossetti si è laureata","summary_no":"Etter en sesong utenfor løypene har Marta Rossetti fullført utdannelsen sin og er klar for retur til Levi.","spik_no":"Den italienske slalomkjøreren Marta Rossetti er klar for comeback i Levi 14. november etter en sesong utenfor løypene, og hun har i mellomtiden fullført en grad i økonomi og bedriftsledelse. Rossetti har vært ute med sitt andre korsbåndskade på 13 måneder, og Levi-rennet blir hennes første verdenscupstart siden skaden. Den brescianske utøveren var i sin tid regnet som et av de største håpene for italiensk slalom etter en rekke sterke macher, og det er 14 år siden Italia sist var på pallen i lagkonkurransen for kvinner.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/in-vista-del-gran-ritorno-a-levi-dopo-una-stagione-ai-box-marta-rossetti-si-e-laureata","pub_date":"2026-10-29T12:20:00.000Z","fetched_at":"2026-10-29 12:30:01","lang_orig":"it","category":null,"athletes":"Marta Rossetti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":80689,"source_name":"Neveitalia","country":"ITA","title_no":"Utfart og super-G på «La VolatA» i januar – første snø på Passo San Pellegrino og billetter til salgs","title_orig":"Discesa e super-g su \"La VolatA\" a gennaio, che spettacolo: prima neve a Passo San Pellegrino e... biglietti in vendita","summary_no":"Det blir utfart og super-G på løypa «La VolatA» i januar, og første snø har allerede falt på Passo San Pellegrino. Billetter er nå tilgjengelige for salg.","spik_no":"Verdenscupen i alpint for kvinner returnerer til Val di Fassa 9.–10. januar 2027, med utfart og super-G på løypa «La VolatA» på Passo San Pellegrino. Det blir bare tredje gang i historien at Val di Fassa er vertskap for verdenscupen i alpin for kvinner. Arrangementet kommer to måneder tidligere enn i 2026, i en periode der de beste alpinistene tradisjonelt trener i Ski Area San Pellegrino. Billetter er allerede lagt ut for salg, og løypa er valgt av det italienske skiforbundet FISI også til de nasjonale mesterskapene i april.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/discesa-e-super-g-su-la-volata-a-gennaio-che-spettacolo-prima-neve-a-passo-san-pellegrino-e-biglietti-in-vendita","pub_date":"2026-10-29T11:35:00.000Z","fetched_at":"2026-10-29 11:45:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":79663,"source_name":"RTV SLO","country":"SLO","title_no":"Alpinrennet for kvinner flyttet fra Narvik til Kvitfjell","title_orig":"Tekmi alpskih smučark iz Narvika preselili v Kvitfjell","summary_no":"Alpinrennene for kvinner som opprinnelig skulle arrangeres i Narvik, er flyttet til Kvitfjell.","spik_no":"Alpinrennene for kvinner som skulle arrangeres i Narvik er flyttet til Kvitfjell. Narvik har de siste årene profilert seg som alpinby og har arrangert verdenscuprenn, men logistiske eller værmessige utfordringer kan føre til at renn må flyttes. Kvitfjell i Gudbrandsdalen er Norges mest erfarne verdenscuparena for alpint og har siden 1990-tallet vært et fast innslag på sirkusen, særlig for fartsdisiplinene utfor og super-G.","url":"https://www.rtvslo.si/sport/tekmi-alpskih-smucark-iz-narvika-preselili-v-kvitfjell/798410","pub_date":"2026-10-29T09:47:52.000Z","fetched_at":"2026-10-29 10:00:04","lang_orig":"sl","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":79240,"source_name":"Neveitalia","country":"ITA","title_no":"FIS bekrefter: Kvitfjell overtar de avlyste Narvik-rennene for kvinner","title_orig":"Tutto secondo previsioni: la FIS annuncia la ricollocazione a Kvitfjell delle gare veloci femminili saltate a Narvik","summary_no":"FIS kunngjør at de avlyste fartsrennene for kvinner i Narvik flyttes til Kvitfjell, akkurat som ventet.","spik_no":"FIS bekrefter offisielt at de avlyste fartsrennene for kvinner i Narvik flyttes til Kvitfjell, med utfor og super-G planlagt 12.–13. mars 2027. Narvik måtte gi fra seg rennene på grunn av forsinkelser i infrastrukturen og pågående arbeider knyttet til VM i alpint 2029. Kvitfjell og løypa «Olympiabakken» er et populært og veletablert sted for fartsdisiplinene – i 2026 sikret Italia en historisk bragd der da Pirovano og Goggia tok henholdsvis seier og sammenlagtcup.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/tutto-secondo-previsioni-la-fis-annuncia-la-ricollocazione-a-kvitfjell-delle-gare-veloci-femminili-saltate-a-narvik","pub_date":"2026-10-29T09:25:00.000Z","fetched_at":"2026-10-29 09:30:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":["SkinEWS","ORF Sport"],"norwegian":false},{"id":79137,"source_name":"VG","country":"NOR","title_no":"Kvitfjell redder verdenscuprenn i alpint etter Narvik-nei: – Ekstremt viktig","title_orig":"Kvitfjell redder verdenscuprenn i alpint etter Narvik-nei: – Ekstremt viktig","summary_no":"","spik_no":"Kvitfjell stiller opp som reserve og overtar verdenscuprennene i alpint etter at Narvik trakk seg som arrangør så sent som forrige uke. Narvik sa fra seg utfor- og super-G-rennene for kvinner i mars fordi forberedelsene til VM 2027 ikke var kommet langt nok. Kvitfjell er eneste alternativ i Norge med FIS-godkjent utforløype på verdenscupnivå, og er en erfaren arrangør med lange tradisjoner fra verdenscup siden tidlig på 1990-tallet. Nå vil både kvinner og menn kjøre fartsrenn i OL-løypene fra Lillehammer-lekene i 1994, med renn med en ukes mellomrom.","url":"https://www.vg.no/sport/i/GrVPV6/kvitfjell-redder-verdenscuprenn-i-alpint-etter-narvik-nei-ekstremt-viktig","pub_date":"2026-10-29T09:11:50.000Z","fetched_at":"2026-10-29 09:15:03","lang_orig":"no","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":78518,"source_name":"Neveitalia","country":"ITA","title_no":"Bassino trener hardt på Diavolezza før amerikanske renn","title_orig":"Sul \"duro\" di Diavolezza un lavoro importante per Bassino (in pista con Pirovano e Zenere): quale Marta vedremo negli States?","summary_no":"Marta Bassino har gjennomført viktig trening på den krevende Diavolezza-pisten sammen med Pirovano og Zenere, i forkant av konkurransene i USA.","spik_no":"Marta Bassino har gjennomført intensiv trening på Diavolezza-breen i Sveits sammen med lagvenninnene Laura Pirovano og Asja Zenere, som forberedelse til rennene i USA. Bassino er en av Italias mest allsidige alpinister og har vunnet verdenscupseirer i disipliner som storslalåm, parallellslalåm og super-G. Den 28 år gamle piemonteseren har tidligere vist god evne til å toppe seg mot slutten av sesongen, og treningen på Diavolezza – en krevende og høytliggende piste – er en bevisst strategi for å holde formen oppe mellom rennene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sul-duro-di-diavolezza-un-lavoro-importante-per-bassino-in-pista-con-pirovano-e-zenere-quale-marta-vedremo-negli-states","pub_date":"2026-10-28T17:35:00.000Z","fetched_at":"2026-10-29 08:15:02","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":78191,"source_name":"Neveitalia","country":"ITA","title_no":"Tre uker på Stubai før sesongstart: Matteoli og lagkamerater forbereder seg i Østerrike","title_orig":"Ben tre settimane a Stubai prima dello start: Matteoli e compagni preparano in Austria una grande stagione","summary_no":"Matteoli og hans lagkamerater har tilbrakt hele tre uker på Stubai-breen i Østerrike for å forberede seg til den kommende alpinski-sesongen.","spik_no":"Det italienske alpinlandslaget i freesnow har tilbrakt tre uker på Stubai-breen i Østerrike som siste samling før sesongstart. Ian Matteoli leder troppen som også inkluderer Leo Framarin, Marilù Poluzzi, Alessia Vergani og Fanny Piantanida Chiesa. Sesongen åpner med Big Air i Innsbruck 26.–28. november, hvor verdenscupen i freesnow også sparker i gang. Stubai er et populært treningssenter for alpinnasjoner om høsten fordi breen gir snøsikre forhold langt før sesongstart i lavlandet.","url":"https://www.neveitalia.it/snowboard/news/ben-tre-settimane-a-stubai-prima-dello-start-matteoli-e-compagni-preparano-in-austria-una-grande-stagione","pub_date":"2026-10-28T15:45:00.000Z","fetched_at":"2026-10-28 16:00:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":78497,"source_name":"Ski Racing","country":"INT","title_no":"Kan nakketrening gi bedre skikjøring og redusere hjernerystelsesrisiko?","title_orig":"Could Neck Training Improve Ski Racing Performance and Reduce Concussion Risk?","summary_no":"Eksperter undersøker om målrettet nakketrening kan forbedre prestasjoner i alpint og samtidig redusere risikoen for hjernerystelse.","spik_no":"Forskningsmiljøer og eksperter undersøker nå om målrettet nakketrening kan gjøre alpinister raskere og samtidig redusere risikoen for hjernerystelse ved fall. Teorien er at en sterkere nakkemuskulator demper kraftoverføringen til hjernen ved støt, noe som er særlig relevant i fartsdisiplinene utfor og super-G der utøverne kan nå godt over 130 km/t. Hjernerystelse er et økende tema i alpinsporten, og flere utøvere – blant dem Aleksander Aamodt Kilde – har måttet stå over lengre perioder etter hodeskader. Forskningen på feltet er fortsatt i en tidlig fase, men interessen fra trenere og medisinske team er voksende.","url":"https://skiracing.com/could-neck-training-improve-ski-racing-performance-and-reduce-concussion-risk/","pub_date":"2026-10-28T15:30:00.000Z","fetched_at":"2026-10-29 08:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":77539,"source_name":"Neveitalia","country":"ITA","title_no":"Rikt verdenscupprogram i Dolomittene","title_orig":"Un programma ricchissimo sulle Dolomiti, tutti gli eventi di Coppa del Mondo dalla Val di Fassa a San Candido, Cortina...","summary_no":"Et innholdsrikt program av verdenscupkonkurranser venter i Dolomittene, med renn fra Val di Fassa til San Candido og Cortina.","spik_no":"Dolomittene presenterte nylig et omfattende verdenscupprogram for sesongen 2026/27, der alpint, nordiske grener, skicross, snowboard og telemark alle er representert. For alpint starter det med fire herrerenn i Val Gardena og Alta Badia 18.–21. desember, før kvinnenes verdenscup returnerer til den nye utforkjøringen «La VolatA» i Val di Fassa 9.–10. januar. Cortina d'Ampezzo, som er kjent fra OL-historien og er verdsatt som et av alpinsportens mest prestisjefylte arrangementssteder, inngår også i programmet. Dolomiti Superski koordinerer arrangørkomiteene og presenterte sesongen på Auditorium Testori i Milano.","url":"https://www.neveitalia.it/sport/eventi/news/un-programma-ricchissimo-sulle-dolomiti-tutti-gli-eventi-di-coppa-del-mondo-dalla-val-di-fassa-a-san-candido-cortina","pub_date":"2026-10-28T14:45:00.000Z","fetched_at":"2026-10-28 15:00:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":77356,"source_name":"Ski Racing","country":"INT","title_no":"Carrick-Smith satte britisk GS-historie med 12.-plass i Sölden","title_orig":"Freddy Carrick-Smith’s 12th in Sölden Makes British GS History","summary_no":"Freddy Carrick-Smith skrev britisk alpinhistorie med sin 12.-plass i storslalåm i Sölden.","spik_no":"Freddy Carrick-Smith skrev britisk alpinhistorie da han ble nummer 12 i åpningsrennets storslalåm i Sölden, som var hans første verdenscuppoeng. Det var Storbritannias beste plasering i en verdenscup-storslalåm for herrer siden mars 2022. Carrick-Smith, som startet med startnummer 46, var bare i sitt femte verdenscupstevne totalt og debuterte i Sölden for akkurat ett år siden. Han er sønn av firedobbel britisk olympier Emma Carrick-Anderson, og faren Phil Smith fungerer som hans tekniker.","url":"https://skiracing.com/freddy-carrick-smiths-12th-in-solden-makes-british-gs-history/","pub_date":"2026-10-28T14:39:30.000Z","fetched_at":"2026-10-28 14:45:01","lang_orig":"en","category":null,"athletes":"Freddy Carrick-Smith,Lucas Braathen","athlete_nations":["BRA","GBR"],"also_sources":[],"norwegian":false},{"id":77260,"source_name":"ORF Sport","country":"AUT","title_no":"Tvungen pause for slalomstjernen Gallhuber","title_orig":"Zwangspause für Slalom-Ass Gallhuber","summary_no":"Slalomspesialisten Gallhuber må ta en ufrivillig pause fra konkurransene.","spik_no":"Den østerrikske slalomspesialisten Katharina Gallhuber må gå glipp av starten på verdenscupsesongen etter en kneartroskopi. 29-åringen fra Niederøsterreich bekreftet selv på Instagram at hun vil miste de første rennene, deriblant åpningsrennene i Levi, Gurgl og Killington i november. Gallhuber er en erfaren profil på verdenscupsirkuset og har olympiske meritter: bronse i slalåm og sølv i lagkonkurransen under OL i Pyeongchang 2018. Målet er å komme tilbake til konkurransene så raskt som mulig.","url":"https://sport.orf.at/stories/3164155/","pub_date":"2026-10-28T14:17:16.000Z","fetched_at":"2026-10-28 14:30:05","lang_orig":"de","category":null,"athletes":"Katharina Gallhuber","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":77053,"source_name":"Neveitalia","country":"ITA","title_no":"McGrath trener super-g på Rettenbach med tanke på Colorado","title_orig":"Coppa di slalom da difendere, ma Atle Lie McGrath lavora sul Rettenbach in ottica super-g pensando al Colorado","summary_no":"Atle Lie McGrath har en slalomcup å forsvare, men norske har fokus på super-g-trening på Rettenbach med blikket rettet mot kommende konkurranser i Colorado.","spik_no":"Atle Lie McGrath trener super-g på Rettenbach-breen i Sölden, til tross for at han har en slalomcup å forsvare og kommende slalomrenn i Levi og Gurgl i november. Den 26 år gamle nordmannen gikk ut i andre omgang i åpningsrennets storslalåm, men har altså valgt å rette blikket mot fartsøvelser med tanke på konkurransene i Colorado – Copper Mountain og Beaver Creek. Det er særlig Beaver Creek som vekker minner: McGrath var imponerende der i 2022 før han pådro seg en ny kneskade. Sölden-breen er dessuten aktuell som arena for to super-g-renn i åpningen av 2027/28-sesongen.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/coppa-di-slalom-da-difendere-ma-atle-lie-mcgrath-lavora-sul-rettenbach-in-ottica-super-g-pensando-al-colorado","pub_date":"2026-10-28T14:05:00.000Z","fetched_at":"2026-10-28 14:15:01","lang_orig":"it","category":null,"athletes":"Atle Lie McGrath","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":76731,"source_name":"Neveitalia","country":"ITA","title_no":"Vonn klar for siste operasjon: – Mentalt tøff nedtelling","title_orig":"\"Countdown duro mentalmente, tra meno di due settimane mi opero\": Lindsey Vonn verso l'ultimo intervento alla gamba","summary_no":"Lindsey Vonn skal operere benet om mindre enn to uker og beskriver ventetiden som mentalt krevende.","spik_no":"Lindsey Vonn er klar for det hun beskriver som sin siste operasjon, og sier ventetiden på under to uker er mentalt krevende. Inngrepet innebærer fjerning av skruer og plater i venstre tibia, samt en operasjon på korsbåndet. Vonn, som er en av tidenes mestvinnende alpinister med 82 verdenscupseirer og OL-gull i utfor fra 2010, har tilbrakt store deler av 2026 med rehabilitering etter en alvorlig skade hun pådro seg tidligere i år. I høst har hun jobbet intenst i treningssalen for å styrke muskulaturen før det avsluttende inngrepet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/countdown-duro-mentalmente-tra-meno-di-due-settimane-mi-opero-lindsey-vonn-verso-l-ultimo-intervento-alla-gamba","pub_date":"2026-10-28T13:30:00.000Z","fetched_at":"2026-10-28 13:45:02","lang_orig":"it","category":"nyheter","athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":75937,"source_name":"SkinEWS","country":"SUI","title_no":"Østerrikske kvinner mister utøver i slalåmtroppen","title_orig":"Ausfall im Slalom-Team der Österreicherinnen","summary_no":"Det østerrikske kvinnelandslaget i slalåm må klare seg uten en av sine utøvere etter et nytt frafall.","spik_no":"Katharina Gallhuber må ta en pause fra årets slalåmsesong etter at hun gjennomgikk en kne-artroskopi. Den 29 år gamle østerrikeren fra Niederösterreich rangerer på 23.-plass på slalåmverdenscuplisten og er den fjerde beste østerrikske utøveren i disiplinen, bak Truppe, Liensberger og Huber. Frafallet svekker det østerrikske slalåmlaget foran sesongåpningen i Levi 14. november.","url":"https://www.skinews.ch/news/2026/ausfall-slalom-oesterreicherinnen/","pub_date":"2026-10-28T12:26:31.000Z","fetched_at":"2026-10-28 12:30:04","lang_orig":"de","category":null,"athletes":"Katharina Gallhuber,Katharina Liensberger","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":75436,"source_name":"Neveitalia","country":"ITA","title_no":"Østerrike i krise før Levi og Gurgl: Gallhuber må operere kneet","title_orig":"Austria in emergenza per Levi e Gurgl: artroscopia al ginocchio sinistro, si ferma anche Katharina Gallhuber","summary_no":"Katharina Gallhuber er den siste som melder forfall for Østerrike, etter en artroskopi på venstre kne før rennene i Levi og Gurgl.","spik_no":"Katharina Gallhuber må operere venstre kne og rekker dermed ikke sesongåpningene i Levi (14. november) og Gurgl, noe som forverrer en allerede krisepregete situasjon for det østerrikske kvinnelandslaget. Liensberger er fortsatt ikke klar etter ni måneder på sidelinjen, og Lisa Hörhager skadet ankelen under treningsleiren i Ushuaia. Gallhuber, som tok OL-bronse i slalåm i Beijing 2022, har tidligere slitt mye med skader. Hun håper selv å kunne returnere til konkurranser allerede 22. desember i nattslalåmen i Courchevel.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/austria-in-emergenza-per-levi-e-gurgl-artroscopia-al-ginocchio-sinistro-si-ferma-anche-katharina-gallhuber","pub_date":"2026-10-28T11:35:00.000Z","fetched_at":"2026-10-28 11:45:02","lang_orig":"it","category":null,"athletes":"Katharina Gallhuber,Katharina Liensberger","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":74953,"source_name":"Neveitalia","country":"ITA","title_no":"Pinheiro Braathen fortsetter treningen i Sölden før avreise til Levi","title_orig":"Prima di volare a Levi, ecco Pinheiro Braathen proseguire a Soelden con il training: \"La coppa generale? Conterà ogni punto\"","summary_no":"Pinheiro Braathen holder frem med treningen i Sölden før han flyr til Levi. Han understreker at hvert poeng vil telle i kampen om sammenlagtcupen.","spik_no":"Lucas Pinheiro Braathen fortsetter treningen på Rettenbach-breen i Sölden etter søndagens seier i sesongåpningens storslalåm, og forbereder seg til verdenscupslalåmen i Levi 15. november. 26-åringen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant nettopp den samme Levi-rennet for ett år siden – sin første seier i det han selv kaller sin «andre karriere». Braathen er tydelig på at hvert poeng vil telle i jakten på den store krystallkula, der hans fremste rival er Marco Odermatt. Seieren i Sölden er et sterkt signal om at den tidligere norske juniortalenten er klar for å utfordre sveitseren om sammenlagtseieren.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/prima-di-volare-a-levi-ecco-pinheiro-braathen-proseguire-a-soelden-con-il-training-la-coppa-generale-contera-ogni-punto","pub_date":"2026-10-28T10:55:00.000Z","fetched_at":"2026-10-28 11:00:01","lang_orig":"it","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":71625,"source_name":"Ski Racing","country":"INT","title_no":"Beaver Creek innfører automatisert snøproduksjon til verdenscupen","title_orig":"Beaver Creek Adds Automated Snowmaking for Stifel Birds of Prey FIS Ski World Cup","summary_no":"Beaver Creek har installert automatisert snøproduksjon for å sikre ideelle forhold under Stifel Birds of Prey FIS alpint verdenscup.","spik_no":"Beaver Creek har installert 16 automatiserte snøkanoner på den nedre tredjedelen av Birds of Prey-løypen for å sikre stabile forhold under verdenscupen 3.–13. desember. Bakgrunnen er at varmt vær i desember i fjor skapte problemer med snøproduksjonen, noe som tvang arrangørene til å endre start og mål og stryke ett utfor. Det nye systemet består av ti SMI Grizzly-kanoner og seks SMI Super Puma-vigsler, og er designet for å bruke mindre energi og vann enn tradisjonelt utstyr. Vail Valley Foundation, som organiserer rennet, peker på at den nedre løypeseksjonen er særlig sårbar for temperaturinversjoner tidlig i sesongen.","url":"https://skiracing.com/beaver-creek-stifel-birds-of-prey-snowmaking/","pub_date":"2026-10-27T20:02:36.000Z","fetched_at":"2026-10-27 20:15:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":71317,"source_name":"Neveitalia","country":"ITA","title_no":"Italia forbereder seg til Levi med samling i Val Senales","title_orig":"Levi si prepara in Val Senales: tutte le slalomiste azzurre di CdM in raduno, da Trocker a Peterlini","summary_no":"Alle italienske slalomkvinner på verdenscupnivå, fra Trocker til Peterlini, er samlet i Val Senales for å forberede seg til Levi.","spik_no":"Det italienske slalomlandslaget for kvinner samles på breen i Val Senales fra 28. til 30. oktober for å forberede seg til sesongåpningen i Levi 14. november. Alle åtte utøverne på verdenscupnivå er med i samlingen, ledet av trener Luca Agazzi og teknisk direktør Gianluca Rulfi. Blant deltakerne er Anna Trocker, som nettopp gjennomførte sin første sesongåpning i Sölden, samt Martina Peterlini og Marta Rossetti. Etter Levi venter også slalomrenn i Gurgl 21. november og Killington 29. november.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/levi-si-prepara-in-val-senales-tutte-le-slalomiste-azzurre-di-cdm-in-raduno-da-trocker-a-peterlini","pub_date":"2026-10-27T19:35:00.000Z","fetched_at":"2026-10-27 19:45:01","lang_orig":"it","category":null,"athletes":"Martina Peterlini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":67400,"source_name":"Neveitalia","country":"ITA","title_no":"Italienske utforkjørere trener på Stelvio – Goggia i Sölden før avreise til Copper","title_orig":"Sotto il sole dello Stelvio le velociste azzurre. Poi con Goggia (che si allena a Soelden) si vola a Copper","summary_no":"De italienske fartskvinnene trener under solen på Stelvio, mens Goggia forbereder seg i Sölden før videre til Copper Mountain.","spik_no":"De italienske fartskvinnene er samlet på Stelvio-breen for treningsdager i godt vær, etter at et planlagt samling uken før måtte avlyses. Utøvere som Elena Curtoni, Roberta Melesi, Nadia og Nicol Delago, Sara Allemand, Teresa Runggaldier og Sara Thaler er i gang under coach Feltrin, med blikket rettet mot sesongåpningen i Beaver Creek 11.–13. desember. Sofia Goggia trener separat på Sölden-breen i Østerrike før hele gruppen reiser til Copper Mountain i USA for videre forberedelser. Italia er en av de sterkeste fartsnasjoner på dameside, med Goggia som en av verdens beste utforkjørere gjennom flere år.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sotto-il-sole-dello-stelvio-le-velociste-azzurre-poi-con-goggia-che-si-allena-a-soelden-si-vola-a-copper","pub_date":"2026-10-27T10:00:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":67402,"source_name":"Neveitalia","country":"ITA","title_no":"Vlhovas comeback nesten utelukkende positivt – ser frem til Levi","title_orig":"Quasi solo note positive per il ritorno di Vlhova in coppa. E ora la \"sua\" Levi: \"Sono competitiva, non vedo l'ora della prossima\"","summary_no":"Petra Vlhovas retur til verdenscupen ble godt mottatt, og slovaken gleder seg til neste renn i Levi.","spik_no":"Petra Vlhova er tilbake i verdenscupen etter en lang og krevende rehabilitering følge av en alvorlig kneskade hun pådro seg under VM i Cortina i februar 2023, der hun rev over korsbåndet. Comebacket ble tatt svært godt imot av omgivelsene, og slovaken ser selv frem til neste renn i finske Levi, der slalåm tradisjonelt er første disiplin på damekalenderen. Vlhova er en av de mest vinnende slalåmkjørerne i verdenscuphistorien og var den totale verdenscupvinneren i sesongen 2021/22.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/quasi-solo-note-positive-per-il-ritorno-di-vlhova-in-coppa-e-ora-la-sua-levi-sono-competitiva-non-vedo-l-ora-della-prossima","pub_date":"2026-10-27T08:30:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":67378,"source_name":"Ski Racing","country":"INT","title_no":"Alex Leever bringer utøverperspektiv til SYNC Performance","title_orig":"Alex Leever Brings a Racer’s Perspective to SYNC Performance","summary_no":"Tidligere alpinist Alex Leever bidrar med sin erfaring som utøver i arbeidet med SYNC Performance.","spik_no":"Tidligere alpinist Alex Leever går inn i en ny rolle hos sportsprestasjonsselskapet SYNC Performance, der han bidrar med erfaringer direkte fra utøverens perspektiv. Overgangen fra aktiv karriere til arbeid med prestasjonsutvikling er et voksende felt i alpinsporten, der tidligere utøvere i stadig større grad brukes til å bygge bro mellom teori og praksis. SYNC Performance jobber med optimalisering av utøveres fysiske og mentale yteevne.","url":"https://skiracing.com/alex-leever-brings-a-racers-perspective-to-sync-performance/","pub_date":"2026-10-26T21:19:26.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67381,"source_name":"Ski Racing","country":"INT","title_no":"Raimund Plancker utnevnt til FIS' sjefsløpsdirektør for herrenes alpint verdenscup","title_orig":"Raimund Plancker Named FIS Chief Race Director for Men’s Alpine World Cup","summary_no":"Raimund Plancker er utnevnt til ny sjefsløpsdirektør i FIS for herrenes alpine verdenscup.","spik_no":"Raimund Plancker er utnevnt til ny sjefsløpsdirektør i FIS for herrenes alpine verdenscup, en av de mest sentrale administrative rollene i internasjonal alpinsport. Sjefsløpsdirektøren har ansvar for gjennomføring og sportslig koordinering av herrenes verdenscuprenn gjennom hele sesongen. FIS har de siste årene arbeidet med å profesjonalisere den administrative strukturen rundt sporten, og Planckers utnevnelse er en del av denne satsingen.","url":"https://skiracing.com/raimund-plancker-named-fis-chief-race-director-for-mens-alpine-world-cup/","pub_date":"2026-10-26T16:10:12.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67407,"source_name":"Neveitalia","country":"ITA","title_no":"Livigno og Diavolezza tar imot italienske alpinister","title_orig":"Livigno/Diavolezza accoglie gli azzurri: fino a venerdì i velocisti del team CdM, ma anche Bassino, Pirovano e Zenere","summary_no":"Italias fartskjørere fra verdenscuplaget samles i Livigno og Diavolezza denne uken, sammen med blant andre Bassino, Pirovano og Zenere.","spik_no":"Det italienske alpinlandslaget for herre-fart er samlet i Livigno og på Diavolezza-breen i begynnelsen av sesongforberedelsene, og blant deltakerne er Marta Bassino, Laura Pirovano og Asja Zenere. Italia satser bredt i alpint denne sesongen, med et av de mest ressurssterke landsforbundene i verden. Livigno og Diavolezza-området i Alpene er populære treningssteder tidlig på høsten takket være høyden og breforhold som gir gode snøbetingelser allerede i oktober.","url":"https://www.neveitalia.it/sport/scialpino/news/la-neve-di-livigno-accoglie-gli-azzurri-fino-a-venerdi-i-velocisti-del-team-cdm-ma-anche-bassino-pirovano-e-zenere","pub_date":"2026-10-26T13:15:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Laura Pirovano,Marta Bassino","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":67408,"source_name":"Neveitalia","country":"ITA","title_no":"Brignone tar noen timers pause ved havet – Goggia trener med Robinson i Sölden","title_orig":"Brignone e qualche ora di mare mentre prosegue il recupero, quando sulla neve? Goggia a Soelden si allena con Robinson","summary_no":"Federica Brignone kobler av ved havet under sin restitusjon, mens Sofia Goggia trener med Robinson i Sölden.","spik_no":"Federica Brignone tar en kortere pause ved havet som del av sin restitusjon mellom treningsblokker, mens Sofia Goggia er i aktivt arbeid på Sölden-breen i Østerrike sammen med Robinson. De to er begge sentrale i det italienske fartslandslaget og regnes blant verdens aller beste nedfartsutøvere. Brignone er særlig sterk i storslalåm og kombinasjon og er tidligere vinner av den totale verdenscupen, mens Goggia er en av de fremste spesialistene i utfor.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/brignone-e-qualche-ora-di-mare-mentre-prosegue-il-recupero-quando-sulla-neve-goggia-a-soelden-si-allena-con-robinson","pub_date":"2026-10-26T12:40:00.000Z","fetched_at":"2026-10-27 13:42:40","lang_orig":"it","category":null,"athletes":"Alice Robinson,Federica Brignone,Sofia Goggia","athlete_nations":["ITA","NZL"],"also_sources":[],"norwegian":false},{"id":67481,"source_name":"SVT Sport","country":"SWE","title_no":"Vlhova tilbake etter tre år: – Glad etter så langt opphold","title_orig":"Petra Vlhova tillbaka efter tre år: ”Glad efter ett så långt uppehåll”","summary_no":"Petra Vlhova er tilbake i konkurranse etter tre års fravær og uttrykker glede over å være tilbake på ski.","spik_no":"Petra Vlhova var tilbake i verdenscupen i Sölden etter hele 1008 dager — nesten tre år — utenfor toppsirkuset. Den slovakiske OL-mesteren fra Beijing 2022 i slalom pådro seg en alvorlig kneskade i januar 2024 og har siden jobbet seg tilbake. Hun endte på 23.-plass i Sölden etter å ha vært ellevte etter første omgang, men understreket at det er poengene og comebacket som teller, ikke plasseringen.","url":"https://www.svt.se/sport/alpint/petra-vlhova-tillbaka-efter-tre-ar-glad-efter-ett-sa-langt-uppehall","pub_date":"2026-10-26T12:21:36.000Z","fetched_at":"2026-10-27 13:42:44","lang_orig":"sv","category":null,"athletes":"Petra Vlhová","athlete_nations":["SVK"],"also_sources":[],"norwegian":false},{"id":67414,"source_name":"SkinEWS","country":"SUI","title_no":"Raimund Plancker blir ny FIS-rennsjef fra 1. november","title_orig":"Raimund Plancker ab 1. November neuer FIS-Renndirektor","summary_no":"Raimund Plancker overtar stillingen som FIS-rennsjef fra og med 1. november.","spik_no":"Raimund Plancker overtar som FIS-rennsjef for herrer fra 1. november, etter at Markus Waldner overraskende trakk seg like før sesongstart. Plancker, som er fra Sør-Tirol i likhet med Waldner, har fungert som assisterende rennsjef siden 2022 og er dermed godt kjent med rollen. Waldner hadde i mange år vært en sentral og kontroversiell skikkelse i alpinsirkuset, og skippertaksskiftet skjer midt i en viktig sesong med VM som høydepunkt.","url":"https://www.skinews.ch/news/2026/plancker-november-renndirektor/","pub_date":"2026-10-26T10:23:57.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67382,"source_name":"Ski Racing","country":"INT","title_no":"Didier Cuche og HEAD feirer 20 år med Supershape med limitert utgave","title_orig":"Didier Cuche and HEAD Celebrate 20 Years of Supershape With Limited-Edition Ski","summary_no":"Didier Cuche og skiproduusenten HEAD markerer 20-årsjubileet for Supershape-skien med en eksklusiv limitert utgave.","spik_no":"Didier Cuche og skiproduusenten HEAD markerer 20-årsjubileet for den ikoniske Supershape-skien med en limitert spesialutgave. Cuche, som vant fem verdenscuptitler i utfor og er en gåpningen i Sölden og slo dermed regjerende storkuleinnehaver Marco Odermatt med 0,49 sekunder, med Loic Meillard på andreplass. Den 26 år gamle brasilianeren, som er OL-mester i storslalåm, hadde på forhånd erklært at han ville utfordre Odermatt om den store krystallkulen — og fulgte opp med handling allerede i første renn. Odermatt har vunnet sammenlagtcupen fem år på rad, men Braathen endte som nummer to sammenlagt forrige sesong.","url":"https://www.sportschau.de/wintersport/ski-alpin/brasilianer-pinheiro-braathen-gewinnt-ski-auftakt-in-soelden,ski-alpin-soelden-riesenslalom-maenner-100.html","pub_date":"2026-10-25T15:06:38.000Z","fetched_at":"2026-10-27 13:42:46","lang_orig":"de","category":null,"athletes":"Loïc Meillard,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":67415,"source_name":"SkinEWS","country":"SUI","title_no":"Høydepunkter fra herrenes storslalåm i Sölden","title_orig":"Die Höhepunkte des Männer-Riesenslaloms von Sölden","summary_no":"Her er høydepunktene fra herrenes storslalåm i Sölden, som åpnet alpinverdenscupen.","spik_no":"Lucas Pinheiro Braathen vant herrenes storslalåm i Sölden foran Loic Meillard og Marco Odermatt, og sikret seg dermed sitt tredje verdenscuprenn i storslalåm på rad. For Sveits var det en sterk sesongåpning med to pallplasseringer, en oppmuntrende start med VM på hjemmebane som sesongmål. Braathen vant med startnummer 4, som har vist seg å bli en slags talisman for brasilianeren.","url":"https://www.skinews.ch/video/2026/hoehepunkte-maenner-riesenslaloms/","pub_date":"2026-10-25T14:21:24.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":"Loïc Meillard,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":67384,"source_name":"Ski Racing","country":"INT","title_no":"Sölden herrer storslalåm 2026: Pinheiro Braathen vinner, Radamus på fjerdeplass","title_orig":"Sölden Men’s GS 2026: Pinheiro Braathen Wins, Radamus Fourth","summary_no":"Lucas Pinheiro Braathen vant herrenes storslalåm i Sölden, mens amerikaneren Radamus endte på fjerdeplass.","spik_no":"Lucas Pinheiro Braathen vant herrenes storslalåm i sesongåpningen på Rettenbach-breen i Sölden, og tok dermed en sterk start på den alpine verdenscupsesongen 2025/26. Amerikaneren River Radamus imponerte med en fjerdeplass og viste at han er i utvikling som storslamlåmkjører på det høyeste nivået. Sölden er tradisjonelt første renn i alpinkalenderen og fungerer som en viktig pekepinn på hvem som er i form etter sommerens forberedelser.","url":"https://skiracing.com/solden-mens-gs-2026-pinheiro-braathen-wins-radamus-fourth/","pub_date":"2026-10-25T13:32:30.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":"Lucas Braathen,River Radamus","athlete_nations":["BRA","USA"],"also_sources":[],"norwegian":false},{"id":67482,"source_name":"franceinfo","country":"FRA","title_no":"Braathen dominerte riesenslalåmen i Sölden","title_orig":"Le Brésilien Lucas Pinheiro Braathen lamine la concurrence sur le géant de Sölden pour la reprise de la Coupe du monde de ski alpin","summary_no":"Brasilianske Lucas Pinheiro Braathen knuste konkurrentene i riesenslalåmen i Sölden og åpnet verdenscupen i alpint med en overlegen seier.","spik_no":"Brasilianeren Lucas Pinheiro Braathen dominerte storslalåmen i Sölden og åpnet dermed verdenscupsesongen med en overlegen seier foran Loic Meillard og Marco Odermatt. Braathen, som er forsvarende OL-mester i storslalåm etter Milano-Cortina 2026, vant med god margin og sendte et tydelig signal om at han er klar for å kjempe om sammenlagtseieren. Den brasiliansk-norske utøveren, som representerer Brasil etter å ha byttet nasjon fra Sveits i 2023, fortsetter å imponere i storslalåm-bakken.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/le-bresilien-lucas-pinheiro-braathen-lamine-la-concurrence-sur-le-geant-de-solden-pour-la-reprise-de-la-saison_8253163.html#xtor=RSS-3-%5Bgeneral%5D","pub_date":"2026-10-25T13:14:14.000Z","fetched_at":"2026-10-27 13:42:45","lang_orig":"fr","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":67416,"source_name":"SkinEWS","country":"SUI","title_no":"Braathen med storslalåm-hattrick fra startnummer 4","title_orig":"Lucas Pinheiro Braathen – Riesenslalom-Hattrick mit Startnummer 4","summary_no":"Lucas Pinheiro Braathen sikret seg en imponerende hattrick i storslalåm med startnummer 4 i Sölden.","spik_no":"Lucas Pinheiro Braathen vant storslalåmen i Sölden og fullførte dermed et bemerkelsesverdig hattrick: tre verdenscupseiere på rad i storslalåm, alle med startnummer 4. Det var hans fjerde verdenscupseier totalt som brasiliansk utøver — tre i storslalåm og én i slalom. Seieren i Sölden gjenskapte nesten pallen fra OL, der Braathen vant foran Odermatt og Meillard.","url":"https://www.skinews.ch/news/2026/pinheiro-riesenslalom-startnummer/","pub_date":"2026-10-25T12:49:48.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":"Loïc Meillard,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":67385,"source_name":"Ski Racing","country":"INT","title_no":"Sölden herrer storslalåm 2026: Pinheiro Braathen leder etter første omgang","title_orig":"Sölden Men’s GS 2026: Pinheiro Braathen Leads Run 1","summary_no":"Lucas Pinheiro Braathen tok ledelsen etter første omgang i herrenes storslalåm i Sölden.","spik_no":"Lucas Pinheiro Braathen satte seg øverst på listen etter første omgang i herrenes storslalåm i Sölden, og viste tidlig i rennet at han var i ekstraordinær form. Braathen er kjent for sin tekniske presisjon og angrepslyst i storslalåm, og Sölden-løypen på Rettenbach-breen stiller store krav til nettopp disse egenskapene. En ledelse etter første omgang i Sölden er et godt utgangspunkt, men andreetappen er notorisk krevende og har snudd mange renn tidligere.","url":"https://skiracing.com/solden-mens-gs-2026-pinheiro-braathen-leads-run-1/","pub_date":"2026-10-25T10:41:08.000Z","fetched_at":"2026-10-27 13:42:39","lang_orig":"en","category":null,"athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":67495,"source_name":"Sportschau","country":"GER","title_no":"Riesenslalåm i Sölden – første omgang for menn i re-live","title_orig":"Riesenslalom in Sölden - Der erste Lauf der Männer im Re-Live","summary_no":"Se første omgang av herreriesenslalåmen i Sölden i re-live.","spik_no":"Sesongåpningen i alpint for herrer gikk som vanlig i Sölden på Rettenbachferner-breen i Østerrike, med storslalåm som første disiplin. Sölden har siden 1992 vært det tradisjonelle startskuddet for verdenscupsesongen i alpint. Kraftig vind førte til at første omgang måtte kortes ned, noe som preget forholdene for utøverne.","url":"https://www.sportschau.de/video/riesenslalom-in-soelden-der-erste-lauf-der-maenner-im-re-live,re-live-slalom-soelden-maenner-100.html","pub_date":"2026-10-25T10:23:52.000Z","fetched_at":"2026-10-27 13:42:46","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":67417,"source_name":"SkinEWS","country":"SUI","title_no":"Braathen satte farten i Sölden-«spurten»","title_orig":"Lucas Pinheiro Braathen legt im „Sprint“ von Sölden vor","summary_no":"Lucas Pinheiro Braathen ledet an i det som beskrives som en «spurt» under storslalåmåpningen i Sölden.","spik_no":"Braathen ledet etter første omgang av storslalåmen i Sölden, som ble kortet ned på grunn av kraftig vind på Rettenbachferner. Den 26 år gamle brasilianeren endte forrige sesong som nummer to i sammendraget bak Odermatt og har åpent erklært at han vil utfordre Odermatt om den store krystallkulen. En sterk ledelse etter første omgang bekreftet at ambisjonene er realistiske.","url":"https://www.skinews.ch/weltcup/2026/pinheiro-braathen-soelden/","pub_date":"2026-10-25T09:49:07.000Z","fetched_at":"2026-10-27 13:42:43","lang_orig":"de","category":null,"athletes":"Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","SUI"],"also_sources":[],"norwegian":false},{"id":63934,"source_name":"ORF Sport","country":"AUT","title_no":"Gritsch reddet Østerrike fra total fiasko","title_orig":"Gritsch verhindert ÖSV-Totalausfall","summary_no":"Gritsch forhindret et totalt østerriksk fiasko da hun var eneste lyspunkt for ÖSV.","spik_no":"Franziska Gritsch reddet Østerrike fra et totalt fiasko i sesongåpningen i Sölden, der hun som eneste østerrikske løper tok seg videre til andreomgang og endte på niendeplass i storslalåm. Fjorårets vinner Julia Scheib styrtet ut i første omgang, noe som understreket hvor sårbart det østerrikske laget er bak sine fremste profiler. Gritsch, som trener alene adskilt fra landslaget, forbedret seg fra 15.- til 9.-plass i andreomgangen og leverte sitt beste storslalåmresultat på lang tid – hennes beste forrige sesong var en 18.-plass.","url":"https://sport.orf.at/stories/3164003/","pub_date":"2026-10-24T21:22:54.000Z","fetched_at":"2026-10-24 21:30:04","lang_orig":"de","category":null,"athletes":"Franziska Gritsch,Julia Scheib","athlete_nations":["AUT"],"also_sources":[],"norwegian":false},{"id":63948,"source_name":"SVT Sport","country":"SWE","title_no":"Kaos rundt Moa Lundgren etter comeback på A-landslaget","title_orig":"Moa Lundgrens kaos efter återkomsten i A-landslaget","summary_no":"Moa Lundgren opplevde kaotiske tilstander etter sin retur til det svenske alpinlandslaget.","spik_no":"Moa Lundgren er tilbake på det svenske alpinlandslaget etter fem år utenfor, men comebacket har vært preget av kaos etter gjentatte sykdomsperioder med covidliknende luftveisplager. Den 28 år gamle sprintspesialisten måtte avbryte eller miste alle treningssamlinger i løpet av forsommeren og høsten – i Riksgränsen, Torsby og norske Meråker – og var syk i over fire sammenhengende uker. Lundgren forteller at hun siden covid har hatt rundt 40 sykedager per år, og til tross for fem topp ti-plasseringer i verdenscupen forrige sesong ble hun ikke tatt ut til OL-troppen.","url":"https://www.svt.se/sport/langdskidor/moa-lundgrens-kaos-efter-aterkomsten-i-a-landslaget","pub_date":"2026-10-24T21:18:18.000Z","fetched_at":"2026-10-24 21:30:04","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":63582,"source_name":"ORF Sport","country":"AUT","title_no":"Østerrike skiller lag med trener Helm","title_orig":"Austria trennt sich von Trainer Helm","summary_no":"Østerrike har avsluttet samarbeidet med trener Helm.","spik_no":"Dette er ikke en alpinsak, men en fotballsak: Austria Wien i østerriksk Bundesliga har sparket treneren Stephan Helm etter en svak sesongstart. Helm, 43 år, hadde vært sjeftrener siden juli 2024 og fikk kontrakten forlenget så sent som i vår, men etter ti kamper med bare to seire og syv poeng står laget nest sist. Erstatteren blir Maximilian Uhlig, 33, som tidligere ledet reservelaget Young Violets.","url":"https://sport.orf.at/stories/3164020/","pub_date":"2026-10-24T20:39:43.000Z","fetched_at":"2026-10-24 20:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":63462,"source_name":"VG","country":"NOR","title_no":"Usikkerhet før alpinstarten: – Forventer at de finner ut av det","title_orig":"Usikkerhet før alpinstarten: – Forventer at de finner ut av det","summary_no":"","spik_no":"Bare to uker før sesongåpningen i Sölden kunngjorde Markus Waldner at han trekker seg som renndirektør for herrene etter tolv år i stillingen. Italieneren har vært en av alpinsportens mest innflytelsesrike skikkelser, med ansvar for konkurranseavvikling, sikkerhet og løypeforhold. Inntil en permanent erstatter er på plass, skal kvinnenes renndirektør lede begge sirklene – en løsning Atle Lie McGrath beskriver som kaotisk, særlig når kvinner og menn konkurrerer på ulike steder samtidig.","url":"https://www.vg.no/sport/i/oKg3JR/usikkerhet-foer-alpinstarten-forventer-at-de-finner-ut-av-det","pub_date":"2026-10-24T19:54:11.000Z","fetched_at":"2026-10-24 20:30:04","lang_orig":"no","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":63399,"source_name":"Ski Racing","country":"INT","title_no":"Sölden storslalåm menn 2026: Startliste, resultater og TV-tider","title_orig":"Sölden Men’s GS 2026: Start List, Rankings, Times & How to Watch","summary_no":"Her er alt du trenger å vite om herrenes storslalåm i Sölden, inkludert startliste, tider og hvor du kan se rennet.","spik_no":"Herrenes storslalåm i Sölden åpner verdenscupsesongen 2026/27 søndag med 69 utøvere fra 24 nasjoner på Rettenbachbreen. Atle Lie McGrath starter med startnummer 1, mens Lucas Pinheiro Braathen – regjerende OL-mester og verdenscupvinner i GS – starter som nummer 4. Braathen gikk ut i første omgang i Sölden i fjor, men avsluttet sesongen med titler i både OL og verdenscupen i disiplinen.","url":"https://skiracing.com/solden-mens-gs-2026-start-list-times-how-to-watch/","pub_date":"2026-10-24T18:54:32.000Z","fetched_at":"2026-10-24 20:30:01","lang_orig":"en","category":null,"athletes":"Atle Lie McGrath,Lucas Braathen","athlete_nations":["BRA","NOR"],"also_sources":[],"norwegian":true},{"id":63435,"source_name":"SkinEWS","country":"SUI","title_no":"Odermatt stiller i sitt 200. verdenscuprenn søndag","title_orig":"Am Sonntag bestreitet Marco Odermatt sein 200. Weltcup-Rennen","summary_no":"Marco Odermatt når en stor milepæl når han søndag stiller til start i sitt 200. verdenscuprenn.","spik_no":"Marco Odermatt stiller søndag til start i sitt 200. verdenscuprenn når storslalåmen i Sölden åpner sesongen 2026/27. Sveitseren fra Nidwalden er 29 år og jakter sin 55. verdenscupseier i jubileumsrennet. Odermatt er forsvarende vinner i Sölden og nummer to på GS-verdenscuplisten, bare slått av Lucas Pinheiro Braathen som tok OL-gull og verdenscuptittelen i storslalåm forrige sesong.","url":"https://www.skinews.ch/news/2026/sonntag-bestreitet-odermatt/","pub_date":"2026-10-24T18:07:28.000Z","fetched_at":"2026-10-24 20:30:04","lang_orig":"de","category":null,"athletes":"Marco Odermatt","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":59459,"source_name":"ORF Sport","country":"AUT","title_no":"Rennkalenderen skaper igjen debatt","title_orig":"Rennkalender sorgt erneut für Diskussionen","summary_no":"Alpinski-rennkalenderen er nok en gang gjenstand for diskusjon blant utøvere og organisasjoner.","spik_no":"Verdenscupkalenderen for alpint 2026/27 inneholder 40 renn for kvinner og 43 for menn, men balansen mellom fart- og teknikkøvelser er igjen skjev – særlig for kvinner, der teknikkrenn dominerer klart. Østerrike er største vertsland med 15 verdenscupavdelinger, inkludert en ny stopp i Dachstein West/Gosau. Østerriksk dametrener Johannes Zöchling peker på at logistikk og mange motstridende interesser gjør kalenderarbeidet svært krevende, og beklager at det ikke er fartshjemerenn for østerrikske kvinner denne vinteren.","url":"https://sport.orf.at/stories/3163844/","pub_date":"2026-10-24T07:43:47.000Z","fetched_at":"2026-10-24 08:24:39","lang_orig":"de","category":"nyheter","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":48079,"source_name":"Neveitalia","country":"ITA","title_no":"Atomic og Braathen sammen til 2030 – sikter mot den store krystallkulen","title_orig":"Atomic e Lucas Pinheiro Braathen assieme sino al 2030: il prossimo obiettivo è la sfera di cristallo assoluta","summary_no":"Atomic og Lucas Pinheiro Braathen har forlenget samarbeidet til 2030, med den sammenlagte verdenscupseieren som neste store mål.","spik_no":"Lucas Pinheiro Braathen og utstyrsmerket Atomic har forlenget samarbeidet sitt frem til 2030, med den store krystallkulen – sammenlagttittelen i verdenscupen – som overordnet mål. Braathen, som representerer Brasil etter å ha byttet nasjonalitet fra Norge, vant slalåmkula i 2022–23-sesongen og har etablert seg blant verdens beste teknikkjørere. En sammenlagtseier vil kreve at han hevder seg også utenfor slalåm, noe som gjenstår å bevise.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/atomic-e-lucas-pinheiro-braathen-assieme-sino-al-2030-il-prossimo-obiettivo-e-la-sfera-di-cristallo-assoluta","pub_date":"2026-10-21T10:20:00.000Z","fetched_at":"2026-10-22 10:54:36","lang_orig":"it","category":"viktig","athletes":"Lucas Braathen","athlete_nations":["BRA"],"also_sources":[],"norwegian":false},{"id":46668,"source_name":"SVT Sport","country":"SWE","title_no":"Treningsbildene av Anna Swenn-Larsson spres: «Viralt»","title_orig":"Träningsbilderna på Anna Swenn-Larsson sprids: ”Viralt”","summary_no":"Bilder av Anna Swenn-Larsson under trening sprer seg raskt på nett og har blitt et viralt fenomen.","spik_no":"Anna Swenn-Larsson har skapt oppmerksomhet på sosiale medier etter at treningsvideoer av henne har spredt seg viralt, blant annet med kommentarer fra alpinlegender som Anja Pärson og Lindsey Vonn. Den svenske slalåmstjernen, som er 35 år, vant bronsemedalje i slalåm under OL i Milano Cortina og regnes som en av de mest erfarne utøverne i verdenscupen. Swenn-Larsson er ydmyk overfor oppmerksomheten og påpeker at hardt treningsarbeid er normalt i alpinmiljøet. Til helgen er hun klar for verdenscuppremieren i Sölden 24. oktober.","url":"https://www.svt.se/sport/alpint/traningsbilderna-pa-anna-swenn-larsson-sprids-viralt","pub_date":"2026-10-20T07:51:11.000Z","fetched_at":"2026-10-20 08:00:04","lang_orig":"sv","category":"naert","athletes":"Anna Swenn-Larsson","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":31695,"source_name":"Ski Racing","country":"INT","title_no":"Breezy Johnson stiller spørsmål ved rettferdigheten i FIS' skivektregel","title_orig":"Breezy Johnson Questions Fairness of FIS Ski Weight Rule","summary_no":"Den amerikanske alpinisten Breezy Johnson kritiserer FIS-regelen om minimumsvekt på ski og mener den ikke er rettferdig.","spik_no":"Amerikanske Breezy Johnson, olympisk mester og verdensmester i utforkjøring, stiller spørsmål ved rettferdigheten i FIS' nye regel om minimumsvekt på racingski. Johnson sier at sommertrening på myk og jevn snø ikke har avslørt noen merkbar forskjell med de nye skiene, men understreker at renn på tøffe verdenscupbakker er en helt annen sak. Hun er særlig bekymret for regelens begrunnelse og mener den rammer et lite antall utøvere uforholdsmessig hardt. Johnson, som kjører på Atomic-ski for det amerikanske Stifel-laget, planlegger mer testing på Copper Mountain frem mot sesongstart.","url":"https://skiracing.com/breezy-johnson-fis-ski-weight-rule/","pub_date":"2026-10-14T17:48:11.000Z","fetched_at":"2026-10-15 08:45:03","lang_orig":"en","category":"naert","athletes":"Breezy Johnson","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":30501,"source_name":"SVT Sport","country":"SWE","title_no":"Kristoffer Jakobsen vil rette opp feilene – ved å gå tilbake til røttene","title_orig":"Kristoffer Jakobsens uråkningar ska bort – genom att backa i tiden","summary_no":"Kristoffer Jakobsen jobber med å eliminere sine tekniske feil ved å gå tilbake til grunnleggende prinsipper.","spik_no":"Kristoffer Jakobsen har hatt en svært skuffende sesong og gikk ut i første omgang i sju av elleve slalomrenn i fjor. For å komme tilbake til toppform går 32-åringen tilbake til det eksakt samme utstyret han brukte da han ledet slalomcupen sammenlagt og var på sitt beste. Et nytt støvelkonsept fra skimerkevaret hans fungerte dårlig, og de svake resultatene har kostet ham mye i rankingen, slik at han neste sesong starter med høyere startnummer. Jakobsen har fire pallplasser i karrieren, den siste fra november 2024.","url":"https://www.svt.se/sport/alpint/kristoffer-jakobsens-urakningar-ska-bort-genom-att-backa-i-tiden","pub_date":"2026-10-14T14:08:51.000Z","fetched_at":"2026-10-14 14:15:04","lang_orig":"sv","category":"nerding","athletes":"Kristoffer Jakobsen","athlete_nations":["SWE"],"also_sources":[],"norwegian":false},{"id":23913,"source_name":"Neveitalia","country":"ITA","title_no":"Giada D'Antonio: – Skader har lært meg mye, nå er jeg smertefri","title_orig":"\"Scio senza dolore, l'infortunio mi ha insegnato tanto\": Giada D'Antonio ora in Senales, probabile il debutto in Coppa Europa","summary_no":"Den italienske alpinisten Giada D'Antonio trener i Senales etter skade og er aktuell for debut i Europa-cupen denne sesongen.","spik_no":"Den italienske alpinisten Giada D'Antonio, født 2009, sier hun nå er smertefri etter korsbåndsskaden hun pådro seg 14. februar i trening i Dobbiaco – midt under OL-perioden. Etter nesten sju måneder med rehabilitering ved J Medical i Torino er hun tilbake på snø og trener nå i Val Senales. Planen er et mulig debut i Europa-cupen allerede fra åpningsrennene i Levi 21.–22. november, før hun vender tilbake til verdenscupsirkuset.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/scio-senza-dolore-l-infortunio-mi-ha-insegnato-tanto-giada-d-antonio-ora-in-senales-probabile-il-debutto-in-coppa-europa","pub_date":"2026-10-13T07:50:00.000Z","fetched_at":"2026-10-13 17:53:09","lang_orig":"it","category":"naert","athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":17879,"source_name":"Neveitalia","country":"ITA","title_no":"Grenier møtte hindringer på veien mot Sölden: skadet i Ushuaia, nå i Val Senales","title_orig":"Per Valérie Grenier un intoppo sulla strada per Soelden: infortunio a Ushuaia, ripresa allo Stelvio e ora... Val Senales","summary_no":"Valérie Grenier pådro seg en skade i Ushuaia og har trent på Stelvio, og er nå i Val Senales foran åpningsrennet i Sölden.","spik_no":"Canadiske Valérie Grenier avslørte at hun skadet brusk i sterno-klavikularleddet under en treningsfall i storslalåm på sommersamlingen i Ushuaia i Argentina, en skade som kostet henne rundt to uker av oppkjøringen. 1996-modellen måtte nøye seg med rehabilitering og friski mot slutten av Argentina-blokken, men er nå tilbake på snø i Italia og trener i Val Senales foran åpningsrennet i Sölden. Grenier regnes som en av de mer allsidige løperne på den kanadiske troppen og er spesielt sterk i de tekniske disiplinene.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/per-valerie-grenier-un-intoppo-sulla-strada-per-soelden-infortunio-a-ushuaia-ripresa-allo-stelvio-e-ora-val-senales","pub_date":"2026-10-12T07:25:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":"sportslig","athletes":"Valérie Grenier","athlete_nations":["CAN"],"also_sources":[],"norwegian":false},{"id":17882,"source_name":"Neveitalia","country":"ITA","title_no":"Sofia om sin form: «Det går bedre nå – jeg vil forstå nivået mitt på pisten»","title_orig":"Sofia, raccontaci come stai: \"Ora va meglio, solo in pista capirò il mio livello e potrò fissare gli obiettivi. Come nel 2024 ho perso tanto\"","summary_no":"Sofia åpner opp om sin situasjon og sier det går bedre, men at hun trenger å kjøre på pisten for å forstå sitt nivå og sette mål.","spik_no":"Sofia Goggia åpner opp om en svært krevende sommer, der hun etter hjemkomst fra Ushuaia pådro seg et dobbelt virus som rammet nervesystemet og påførte henne invalidiserende smerter – noe hun beskriver som det verste hun har opplevd i karrieren. Den flerfoldige verdenscupvinneren og olympiske mesteren i utfor sier hun har gjort store fremskritt den siste uken, men at hun trenger å kjøre på pisten for å forstå sitt reelle nivå. Neste stopp er Stelvio, og deretter håper hun på intensivt arbeid i novemberblokken i Copper Mountain.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/sofia-goggia-al-microfono-di-dario-puppo-fisi-media-day-2026","pub_date":"2026-10-11T12:50:00.000Z","fetched_at":"2026-10-12 08:58:21","lang_orig":"it","category":"naert","athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":17378,"source_name":"ORF Sport","country":"AUT","title_no":"Goggia beskriver personlig lidelseshistorie","title_orig":"Goggia schildert persönliches Martyrium","summary_no":"Den italienske alpinisten Sofia Goggia åpner opp om sitt personlige martyrium.","spik_no":"Sofia Goggia beskriver sommeren 2026 som den tøffeste og smertefulleste perioden i karrieren sin. Den 33 år gamle italienske fartsspesialisten ble først smittet av Chikungunya-viruset via et myggstikk, og ble deretter rammet av Parvovirus B19, noe som førte til kraftige nevrologiske symptomer og avbrudd i treningsleiren i Ushuaia i Sør-Amerika. Goggia fortalte i et ORF-intervju at hun blant annet fikk problemer med å snakke. Til tross for utfordringene vant hun Super-G-cupen sammenlagt sist sesong, og er regnet som en av verdens beste utøvere i de raske disiplinene.","url":"https://sport.orf.at/stories/3163391/","pub_date":"2026-10-09T11:03:37.000Z","fetched_at":"2026-10-09 11:15:13","lang_orig":"de","category":"naert","athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":10178,"source_name":"Ski Racing","country":"INT","title_no":"Henrik Kristoffersen bruker Protern for å finne hvor farten vinnes og tapes","title_orig":"Henrik Kristoffersen Uses Protern to Find Where Speed Is Gained and Lost","summary_no":"Henrik Kristoffersen benytter analyseverktøyet Protern for å identifisere hvor han vinner og taper tid i løypene.","spik_no":"Henrik Kristoffersen bruker GPS-baserte analyseverktøyet Protern for å kartlegge nøyaktig hvor han vinner og taper fart i løypene – noe tradisjonelle mellomtider, gjerne 15 sekunder fra hverandre, ikke kan gi svar på. Kristoffersen, som har 34 verdenscupseirer, 102 pallplasser, fem disiplinkuler og to VM-gull på merittlisten, jobber tett med faren og treneren Lars. Protern gir dem mulighet til å se hastigheten på ethvert punkt i løypa, slik at selv små tekniske feil kan kvantifiseres og brukes // Sesongstatus
function seasonStatus() {
  const today = new Date().toISOString().slice(0,10);
  const cur = RACES.find(r => today >= r.date && today <= r.end);
  if (cur) return '🏁 Renn nå — ' + cur.venue;
  const nxt = RACES.find(r => r.date > today);
  if (!nxt) return '⛷ Sesong avsluttet';
  const days = Math.ceil((new Date(nxt.date) - Date.now()) / 86400000);
  if (today >= '2026-10-24' && today <= '2027-03-21') return '⛷ Sesong pågår — ' + nxt.venue + ' om ' + days + ' dager';
  if (days <= 45) return '🎿 Forsesong — ' + nxt.venue + ' om ' + days + ' dager';
  return '💤 Sommerpause';
}

function getRace(str) {
  if (!str) return null;
  const d = new Date(str);
  if (isNaN(d)) return null;
  const s = d.toISOString().slice(0,10);
  return RACES.find(r => s >= r.date && s <= r.end) || null;
}

function fmt(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' kl. ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
