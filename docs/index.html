<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>
    <div class="season" id="season-badge"></div>
    <span class="readonly-badge">👁 Lesevisning</span>
    <span class="updated">Oppdatert 14.11., 14:00</span>
  </div>
  <div class="filter-rows"><div class="filter-row" id="cat-row"></div></div>
  <div class="search-row">
    <input class="search-input" type="search" id="search" placeholder="Søk i titler, utøvere…">
    <select class="athlete-select" id="country-select"><option value="">Alle land</option></select>
    <select class="athlete-select" id="athlete-select"><option value="">Alle utøvere</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="main">
  <div id="feed"></div>
  <div class="sidebar">
    <div class="section-label" id="spik-label">Spik-liste</div>
    <div id="spik-list"></div>
  </div>
</div>

<script>
const CATS = [{"id":"viktig","label":"⚡ Viktig"},{"id":"sportslig","label":"🎿 Sportslig"},{"id":"nyheter","label":"📰 Nyhet"},{"id":"goy","label":"😄 Gøy"},{"id":"nerding","label":"🔬 Nerding"},{"id":"kjendis","label":"🌟 Kjendis"},{"id":"naert","label":"🤝 Nært og nyttig"}];
const ARTICLES = [{"id":144367,"source_name":"Neveitalia","country":"ITA","title_no":"Samme Levi-resultat for Italia-kvinnene – Sola fornøyd, Della Mea skuffet","title_orig":"La \"solita\" Levi per l'Italdonne, ma sorride una positiva Sola: \"Buona partenza\". Della Mea: \"Non sono soddisfatta\"","summary_no":"Det italienske kvinnelaget leverte et kjent bilde i Levi. Sola var positiv til starten, mens Della Mea uttrykte misnøye med egen prestasjon.","spik_no":"Det italienske kvinnelaget leverte nok en gang et blandet resultat i Levi-slalåmen, der Beatrice Sola var beste italiener på 19.-plass med startnummer 50 — for tredje gang i karrieren har hun hentet poeng med et høyt startnummer. Martina Peterlini, som historisk har trives godt i Levi, var den eneste av de ni italienske utøverne som ikke var fast på verdenscuplaget. Luca Della Mea var derimot åpent misfornøyd med sin prestasjon, mens Peterlini selv valgte å se det positive etter å ha returnert fra en ny kneopérasjon.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/la-solita-levi-per-l-italdonne-ma-sorride-una-positiva-sola-buona-partenza-della-mea-non-sono-soddisfatta","pub_date":"2026-11-14T13:40:00.000Z","fetched_at":"2026-11-14 13:45:01","lang_orig":"it","category":null,"athletes":"Marta Rossetti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":144325,"source_name":"franceinfo","country":"FRA","title_no":"Aicher tok første slalåmstart – Chevrier og Lamure i topp 7","title_orig":"Le premier slalom de la saison de Coupe du monde pour Emma Aicher, Tops 7 pour les Françaises Marion Chevrier et Marie Lamure","summary_no":"Emma Aicher gjennomførte sin første verdenscupslalåm denne sesongen, mens franske Marion Chevrier og Marie Lamure begge endte på topp 7.","spik_no":"Emma Aicher vant sitt første slalåmrenn i verdenscupen da hun tok seieren i Levi i Finland lørdag – dette var også hennes første slalåmstart denne sesongen. Den unge tyske alpinisten dro fordel av at Mikaela Shiffrin var fraværende. For Frankrike var det grunn til optimisme: Marion Chevrier og Marie Lamure endte begge blant de syv beste, noe som lover godt for det franske slalåmlaget videre i sesongen.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/coupe-du-monde/le-premier-slalom-de-la-saison-de-coupe-du-monde-pour-emma-aicher-tops-7-pour-les-francaises-marion-chevrier-et-marie-lamure_8282492.html#xtor=RSS-3-%5Bsports%2Fsports-d-hiver%2Fski-alpin%5D","pub_date":"2026-11-14T13:18:16.000Z","fetched_at":"2026-11-14 13:30:05","lang_orig":"fr","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":144076,"source_name":"ORF Sport","country":"AUT","title_no":"Truppe klatret seg opp på slalompallen","title_orig":"Truppe katapultiert sich auf Slalom-Podest","summary_no":"Truppe sikret seg en pallplass i slalomrennet med en imponerende kjøring.","spik_no":"Katharina Truppe tok en sterk tredjeplass i åpningsslalomen i Levi, bare 0,07 sekunder bak andreplassen til Lara Colturi. Den 30 år gamle kärntnerindene kjørte beste tid i finaleomgangen og halvert dermed rykket fra halvtidsfemteplassen. Det er hennes syvende pallplass totalt i verdenscupen, og det er påfallende at nettopp Levi var stedet der hun for syv år siden tok sin aller første pallplass. Hennes hittil eneste verdenscupseier kom i Åre i mars 2025.","url":"https://sport.orf.at/stories/3164871/","pub_date":"2026-11-14T13:12:22.000Z","fetched_at":"2026-11-14 13:15:08","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi,Mikaela Shiffrin","athlete_nations":["ALB","AUT","GER","USA"],"also_sources":[],"norwegian":false},{"id":144158,"source_name":"Sportschau","country":"GER","title_no":"Første slalomseier – Aicher jubler i Levi","title_orig":"Erster Slalom-Sieg - Aicher jubelt in Levi","summary_no":"Aicher tok sin første slalomseier i Levi i en sterk prestasjon.","spik_no":"Emma Aicher tok sin første slalomseier i Levi lørdag, 43 hundredeler foran Lara Colturi. Den tyske alpinisten startet med startnummer én og holdt teten gjennom begge omganger i fraværet av slalomdominator Mikaela Shiffrin. Aicher, som representerer DSV, har tidligere vist lovende form i tekniske disipliner og omtalte kjøringen med startnummer én som nesten identisk med trening. Seieren er hennes første i slalåm, og hun noterer seg dermed for sin sjette verdenscupseier totalt.","url":"https://www.sportschau.de/wintersport/ski-alpin/erster-slalom-sieg-aicher-jubelt-in-levi,ski-alpin-levi-erster-slalom-sieg-emma-aicher-100.html","pub_date":"2026-11-14T13:08:26.000Z","fetched_at":"2026-11-14 13:15:09","lang_orig":"de","category":null,"athletes":"Emma Aicher,Mikaela Shiffrin","athlete_nations":["GER","USA"],"also_sources":[],"norwegian":false},{"id":144077,"source_name":"ORF Sport","country":"AUT","title_no":"Truppe tok tredjeplass da Aicher vant i Levi","title_orig":"Truppe Dritte bei Aicher-Sieg in Levi","summary_no":"Aicher vant slalomrennet i Levi, mens Truppe endte på tredjeplass.","spik_no":"Katharina Truppe kjørte seg opp fra femteplass til tredjeplass med beste tid i finaleomgangen i Levis åpningsslalom, og sikret dermed sin åttende pallplass i verdenscupen. Emma Aicher vant rennet med 0,43 sekunder foran Lara Colturi, som starter for Albania, mens Truppe lå ytterligere 0,07 sekunder bak. Det var en oppløftende sesongstart for den 30 år gamle østerrikeren, som tok sin hittil eneste verdenscupseier i Åre i mars 2025.","url":"https://sport.orf.at/stories/3164877/","pub_date":"2026-11-14T13:01:45.000Z","fetched_at":"2026-11-14 13:15:08","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi","athlete_nations":["ALB","AUT","GER"],"also_sources":[],"norwegian":false},{"id":143863,"source_name":"SkinEWS","country":"SUI","title_no":"Emma Aicher tok sin første slalåmseier","title_orig":"Erster Slalom-Erfolg für Emma Aicher","summary_no":"Emma Aicher sikret seg sin aller første verdenscupseier i slalåm.","spik_no":"Emma Aicher vant slalåmen i Levi og tok dermed sin aller første verdenscupseier i en teknisk disiplin. Den tyske alpinisten slo Lara Colturi fra Albania med 0,43 sekunder, mens Katharina Truppe tok tredjeplassen. Rennet markerte et historisk brudd i Levi: for første gang siden 2016 vant noen andre enn Mikaela Shiffrin eller Petra Vlhová en slalåm der — etter henholdsvis åtte og seks seire for de to. Shiffrin stilte ikke til start, mens Vlhová var tilbake etter lang skadepause.","url":"https://www.skinews.ch/news/2026/erster-slalom-erfolg/","pub_date":"2026-11-14T12:55:52.000Z","fetched_at":"2026-11-14 13:00:06","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi,Mikaela Shiffrin,Petra Vlhová","athlete_nations":["ALB","AUT","GER","SVK","USA"],"also_sources":[],"norwegian":false},{"id":143904,"source_name":"ORF Sport","country":"AUT","title_no":"Truppe tok tredjeplass etter Aichers seier i Levi","title_orig":"Truppe Dritte bei Aicher-Sieg in Levi","summary_no":"Katharina Truppe endte på tredjeplass i Levi, der Emma Aicher tok seieren i slalåmrennet.","spik_no":"Katharina Truppe tok tredjeplass i sesongåpningens slalåm i Levi, der tyske Emma Aicher vant foran albanske Lara Colturi. Den 30 år gamle østerrikeren fra Kärnten kjørte andredrag med løypens beste tid og avanserte fra femteplass til pallen — hennes åttende pallplass totalt i verdenscupen. Truppe er en erfaren slalåmspesialist som jevnlig har vært i nærheten av pallen, men uten å ha vunnet en verdenscupseier. Landslagskollega Katharina Huber endte på niendeplass som nest beste østerrikske.","url":"https://sport.orf.at/stories/3164875/","pub_date":"2026-11-14T12:54:45.000Z","fetched_at":"2026-11-14 13:00:07","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Truppe,Lara Colturi","athlete_nations":["ALB","AUT","GER"],"also_sources":[],"norwegian":false},{"id":143847,"source_name":"Neveitalia","country":"ITA","title_no":"Aicher slo Colturi og vant slalåm i Levi","title_orig":"Emma Aicher respinge Lara Colturi, a Levi la tedesca si prende anche il primo trionfo in slalom!","summary_no":"Emma Aicher holdt Lara Colturi bak seg og vant sitt første slalåmrenn i Levi.","spik_no":"Emma Aicher vant slalåmen i Levi og holdt Lara Colturi bak seg, noe som også betyr at albaneren fremdeles venter på sin første verdenscupseier. Aicher er en ung tysk allroundkjører som har markert seg jevnt i verdenscupen de siste sesongene, og seieren i Levi er hennes gjennombrudd i slalåm. Det var over et tiår siden en annen utøver enn Shiffrin eller Vlhová vant på Levi Black. Australske Hoffman overrasket med en sterk plassering, mens sveitsiske Holdener og Rast skuffet.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/emma-aicher-respinge-lara-colturi-a-levi-la-tedesca-si-prende-anche-il-primo-trionfo-in-slalom","pub_date":"2026-11-14T12:50:00.000Z","fetched_at":"2026-11-14 13:00:04","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi,Mikaela Shiffrin,Petra Vlhová","athlete_nations":["ALB","GER","SVK","USA"],"also_sources":[],"norwegian":false},{"id":143557,"source_name":"ORF Sport","country":"AUT","title_no":"Herzog imponerer ved verdenscupåpningen i Peking","title_orig":"Herzog glänzt bei Weltcup-Auftakt in Peking","summary_no":"Herzog leverte en strålende prestasjon under verdenscupåpningen i Peking.","spik_no":"Den østerrikske skøyteløperen Vanessa Herzog imponerte stort ved verdenscupåpningen i Peking, der hun rykket opp fra B-gruppen til A-gruppen på tre distanser i løpet av 24 timer – noe som ifølge ektemannen og treneren Thomas Herzog aldri tidligere er blitt gjort av en kvinnelig løper. Hun vant 500-meterrennet på 38,19 sekunder og ble nummer to på 1500 meter, kun 17 hundredeler bak seieren. Herzog, kåret til Østerrikes beste idrettsutøver i 2019, har de siste sesongene slitt med alvorlige ryggproblemer. Comebacket i Peking er derfor ekstra bemerkelsesverdig.","url":"https://sport.orf.at/stories/3164874/","pub_date":"2026-11-14T12:23:22.000Z","fetched_at":"2026-11-14 12:30:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":142636,"source_name":"Neveitalia","country":"ITA","title_no":"Aicher-Colturi leder, Ljutic og Rast truer – slalomavgjørelsen i Levi nærmer seg","title_orig":"Aicher-Colturi, poi Ljutic e la furia di Rast: si decide lo slalom di Levi, Della Mea, Sola e Peterlini in corsa per l'Italia","summary_no":"Aicher-Colturi er i tet foran Ljutic og en form for Rast i Levi-slalåmen. Italienske håp hviler på Della Mea, Sola og Peterlini.","spik_no":"Lara Colturi leder etter første omgang i slalåmen i Levi, med 36 hundredeler ned til tyske Emma Aicher, mens Zrinka Ljutic og Camille Rast også truer om pallplass. Colturi, som fyller 20 år i løpet av renndagen, representerer Albania og har allerede fem annenplasser i verdenscupen – nå jager hun sin første seier. Aicher søker på sin side sin aller første verdenscupseier i slalåm. Også Petra Vlhova er i nærheten av pallen, mens de italienske håpene hviler på Della Mea, Sola og Peterlini.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/aicher-colturi-poi-ljutic-e-la-furia-di-rast-si-decide-lo-slalom-di-levi-della-mea-sola-e-peterlini-in-corsa-per-l-italia","pub_date":"2026-11-14T11:10:00.000Z","fetched_at":"2026-11-14 11:15:02","lang_orig":"it","category":null,"athletes":"Camille Rast,Emma Aicher,Lara Colturi,Martina Peterlini,Zrinka Ljutic","athlete_nations":["ALB","CRO","GER","ITA","SUI"],"also_sources":[],"norwegian":false},{"id":142443,"source_name":"Ski Racing","country":"INT","title_no":"Aicher leder Levi-slalåmen – Hoffman imponerte fra startnummer 57","title_orig":"Aicher Leads Levi Slalom as Hoffman Surges From Bib 57","summary_no":"Aicher tok ledelsen i slalåmen i Levi, mens Hoffman gjennomførte en sterk kjøring fra startnummer 57.","spik_no":"Emma Aicher leder etter første omgang i sesongåpningens slalåm i Levi, 0,36 sekunder foran Lara Colturi, med Zrinka Ljutić på tredjeplass. Aicher, 23 år gamle og firedobbel disiplinstjerne for Tyskland, endte som nummer to sammenlagt i forrige sesongs verdenscup, men har ennå ikke vunnet en slalåm til tross for fem pallplasseringer. Colturi, som representerer Albania og bare er 19 år, er i samme situasjon med fem pallplasseringer uten seier. Fraværet av regjerende slalåmdronning Mikaela Shiffrin åpner dermed for at en av de to lederne kan ta sin aller første verdenscupseier i disiplinen. Australske Madison Hoffman imponerte med en sterk kjøring fra startnummer 57 og klatret opp til 13. plass.","url":"https://skiracing.com/aicher-leads-levi-slalom-as-hoffman-surges-from-bib-57/","pub_date":"2026-11-14T10:53:47.000Z","fetched_at":"2026-11-14 11:00:02","lang_orig":"en","category":null,"athletes":"Emma Aicher,Lara Colturi,Zrinka Ljutic","athlete_nations":["ALB","CRO","GER"],"also_sources":[],"norwegian":false},{"id":142291,"source_name":"Neveitalia","country":"ITA","title_no":"Tre italienske plasser i Levi – Sola strålende fornøyd: «Var avslappet»","title_orig":"Tre pass azzurri a Levi, la gioia è tutta di Sola: \"Occasione da sfruttare, ero spensierata\". Discreto rientro per Rossetti","summary_no":"Italia sikret tre startplasser i Levi, og Sola var særlig begeistret etter en sorgløs forberedelse. Rossetti gjorde en grei retur til konkurransen.","spik_no":"Italia sikret tre startplasser til andreomlaupen i Levi, der Beatrice Sola utmerket seg etter en avslappet forberedelse til sesongens første slalomrenn. Lara Della Mea var beste italiener på 19.-plass og uttrykte tilfredshet med den tekniske seksjonen. Martina Peterlini, som nylig kom tilbake etter en operasjon i rotulasenen, var fornøyd med tilnærmingen sin. Marta Rossetti endte på 32.-plass i det hun beskrev som sin første konkurranse på over halvannet år, etter et korsbåndsbrudd i oktober 2023 og et 8.-plass i Are som siste resultat.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/tre-pass-azzurri-a-levi-la-gioia-e-tutta-di-sola-occasione-da-sfruttare-ero-spensierata-discreto-rientro-per-rossetti","pub_date":"2026-11-14T10:40:00.000Z","fetched_at":"2026-11-14 10:45:02","lang_orig":"it","category":null,"athletes":"Marta Rossetti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":142003,"source_name":"ORF Sport","country":"AUT","title_no":"Østerriksk duo holder medaljesjansene i slalåm i live","title_orig":"ÖSV-Duo wahrt Chance auf Slalom-Podest","summary_no":"To østerrikske utøvere har sikret seg gode plasseringer og holder fortsatt muligheten åpen for plass på pallen i slalåmkonkurransen.","spik_no":"I første omgang av sesongåpningsslalåmen i Levi leder tyske Emma Aicher, 0,36 sekunder foran Lara Colturi fra Albania – i fravær av stjernen Mikaela Shiffrin. Østerrikernes beste håp er Katharina Truppe på femteplass, 1,05 sekunder bak Aicher, fulgt av landskvinnen Katharina Huber åtte hundredeler bak. Truppe begikk en kostbar feil tidlig i løypa og innrømmer at feilen kom på verst tenkelige sted, men er optimistisk foran annen omgang. Kroatiske Zrinka Ljutic er tredje halvveis og er blant de sterkeste utfordrerne til pallplass.","url":"https://sport.orf.at/stories/3164864/","pub_date":"2026-11-14T10:07:25.000Z","fetched_at":"2026-11-14 10:15:04","lang_orig":"de","category":null,"athletes":"Emma Aicher,Katharina Huber,Katharina Truppe,Lara Colturi,Mikaela Shiffrin,Zrinka Ljutic","athlete_nations":["ALB","AUT","CRO","GER","USA"],"also_sources":[],"norwegian":false},{"id":141775,"source_name":"Neveitalia","country":"ITA","title_no":"Aicher imponerte i Levi – kun Colturi nær bavareren etter første omgang","title_orig":"Aicher perfetta, solo Colturi resta vicina alla bavarese dopo la 1^ di Levi: out Moltzan, pagano Rast e Holdener","summary_no":"Aicher leverte en strålende kjøring i første omgang i Levi, med kun Colturi tett bak. Moltzan røk ut, mens Rast og Holdener betalte en høy pris.","spik_no":"Emma Aicher leverte en imponerende første omgang i Levi-slalåmen og leder med 36 hundredeler foran Lara Colturi, mens Zrinka Ljutic er best av de øvrige. Aicher, som nettopp fylte 23 år, er en av de store favorittkandidatene til verdenscupen sammenlagt denne sesongen, særlig med Mikaela Shiffrin fraværende. Amerikaneren Paula Moltzan røk ut, og erfarne navn som Wendy Holdener og Rahel Rast ligger mer enn ett sekund bak lederen etter første omgang.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/aicher-perfetta-solo-colturi-resta-vicina-alla-bavarese-dopo-la-1-di-levi-out-moltzan-pagano-rast-e-holdener","pub_date":"2026-11-14T09:50:00.000Z","fetched_at":"2026-11-14 10:00:01","lang_orig":"it","category":null,"athletes":"Camille Rast,Emma Aicher,Lara Colturi,Paula Moltzan,Wendy Holdener","athlete_nations":["ALB","GER","SUI","USA"],"also_sources":[],"norwegian":false},{"id":141791,"source_name":"SkinEWS","country":"SUI","title_no":"Aicher foran Colturi – bursdagsduel i Levi","title_orig":"Aicher vor Colturi – in Levi läuft das Duell der Geburtstagskinder","summary_no":"I Levi pågår en spennende duell mellom Aicher og Colturi, som begge feirer bursdag.","spik_no":"I åpningsslalåmen i Levi leder tyske Emma Aicher etter første omgang, tett fulgt av Lara Colturi som kjører for Albania. Det spesielle er at de to rivalene begge feirer bursdag i disse dager – Aicher fylte 23 år 13. november, mens Colturi fyller 20 år 15. november. Colturi, som er italiensk-født, men representerer Albania gjennom sin far Ervin Colturi, regnes som et av alpinens største talenter. De to ligger klart foran resten av feltet etter første omgang.","url":"https://www.skinews.ch/news/2026/aicher-colturi-geburtstagskinder/","pub_date":"2026-11-14T09:48:07.000Z","fetched_at":"2026-11-14 10:00:03","lang_orig":"de","category":null,"athletes":"Emma Aicher,Lara Colturi","athlete_nations":["ALB","GER"],"also_sources":[],"norwegian":false},{"id":140476,"source_name":"Neveitalia","country":"ITA","title_no":"Shiffrin trener storslalåm i Breckenridge før Killington","title_orig":"E in Colorado già si lavora verso Killington: Shiffrin si allena in gigante a Breckenridge con Robinson. Le azzurre a Copper","summary_no":"Mikaela Shiffrin trener storslalåm i Breckenridge i Colorado sammen med Robinson, mens de italienske utøverne forbereder seg på Copper Mountain.","spik_no":"Mikaela Shiffrin trener storslalåm i Breckenridge i Colorado sammen med newzealandske Alice Robinson, mens hun velger å stå over de to første slalåmrennene i Levi og Gurgl. Planen er klar: hun satser på de kommende tre storslalåmrennene i Killington, Mont-Tremblant og Mont-Tremblant igjen i løpet av én uke fra slutten av november. Shiffrin vant sammenlagt i forrige sesong og har historisk sett vært overlegen i slalåm, men ønsker nå å styrke seg spesielt i storslalåm – en disiplin der hun lenge har jaktet på mer dominans.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/e-in-colorado-gia-si-lavora-verso-killington-shiffrin-si-allena-in-gigante-a-breckenridge-con-robinson-le-azzurre-a-copper","pub_date":"2026-11-14T08:05:00.000Z","fetched_at":"2026-11-14 08:15:02","lang_orig":"it","category":null,"athletes":"Alice Robinson,Mikaela Shiffrin","athlete_nations":["NZL","USA"],"also_sources":[],"norwegian":false},{"id":140129,"source_name":"Neveitalia","country":"ITA","title_no":"Start kl. 10.00 på «Levi Black»: Ni italienske kvinner i første verdenscupslalåm","title_orig":"Alle 10.00 lo start, sulla \"Levi Black\" è sfida apertissima per il primo slalom di coppa: 9 le azzurre in gara","summary_no":"Den første slalåmkonkurransen i verdenscupen går av stabelen på Levi Black-løypen, med ni italienske løpere på startlisten.","spik_no":"Den første dameslalåmen i verdenscupen denne sesongen gikk av stabelen på Levi Black-løypen i Finland, med start klokken 10.00 lokal tid. Emma Aicher fra Bayern åpnet første omgang som nummer én, fulgt av Lara Colturi, som nesten vant i Sölden og er blant de store favorittene. Ni italienske løpere var med i konkurransen, anført av Lara Della Mea med startnummer 16, og Petra Vlhová vendte tilbake til «sin» løype der hun har vunnet seks ganger – alt dette uten Mikaela Shiffrin på startlisten.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/alle-1000-lo-start-sulla-levi-black-e-sfida-apertissima-per-il-primo-slalom-di-coppa-9-le-azzurre-in-gara","pub_date":"2026-11-14T07:05:00.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"it","category":null,"athletes":"Camille Rast,Emma Aicher,Lara Colturi,Wendy Holdener","athlete_nations":["ALB","GER","SUI"],"also_sources":[],"norwegian":false},{"id":140109,"source_name":"Ski Racing","country":"INT","title_no":"Startliste for dameslalåm i Levi: Vlhová er tilbake – Shiffrin står over","title_orig":"Levi Women’s Slalom Start List: Vlhova Returns as Shiffrin Sits Out","summary_no":"Petra Vlhová er tilbake i konkurransesporet når dameslalåmen i Levi åpner sesongen, mens Mikaela Shiffrin ikke stiller til start.","spik_no":"Petra Vlhová er tilbake i verdenscupen når dameslalåmen åpner i Levi, for første gang siden Flachau 14. januar 2024, etter over halvannet år borte fra konkurransesporet. Slovakiske Vlhová har vunnet Levi-slalåmen hele seks ganger og er en av løypas mestere. Mikaela Shiffrin, som vant ni av ti slalåmrenn forrige sesong, står over og starter sin slalåmsesong i Killington 29. november. Med Shiffrin fraværende og Vlhová på vei tilbake er åpningsrennet uvanlig åpent, med blant andre Camille Rast og Lara Colturi blant favorittene.","url":"https://skiracing.com/levi-womens-slalom-start-list-vlhova-returns-as-shiffrin-sits-out/","pub_date":"2026-11-14T01:02:35.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":"Camille Rast,Mikaela Shiffrin,Petra Vlhová","athlete_nations":["SUI","SVK","USA"],"also_sources":[],"norwegian":false},{"id":140110,"source_name":"Ski Racing","country":"INT","title_no":"Freddy Carrick-Smiths historiske resultat ga bare 2500 euro i premiepenger","title_orig":"Freddy Carrick-Smith’s Historic Finish: Just €2,500 in Prize Money","summary_no":"Freddy Carrick-Smith satte et historisk resultat, men måtte ta til takke med kun 2500 euro i premiepenger for bragden.","spik_no":"Den britiske alpinisten Freddy Carrick-Smith leverte et historisk resultat i åpningsrennet i Sölden da han kjørte seg opp fra en delt 21.-plass etter første omgang til 12.-plass sammenlagt – Storbritannias beste resultat i herrestorslalåm i verdenscupen siden Jeremy Palmer-Tomkinson ble nummer ni i Méribel i 1968. For den prestasjonen fikk han utbetalt 2 500 euro i premiepenger, som er 12.-plassens fastlagte beløp i FIS' premiestruktur. Totalpotten for et standard verdenscuprenn er minimum 168 000 euro, der vinneren tar 55 000 euro og 30.-plassen 750 euro.","url":"https://skiracing.com/freddy-carrick-smiths-historic-finish-just-e2500-in-prize-money/","pub_date":"2026-11-13T22:14:04.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":"Freddy Carrick-Smith","athlete_nations":["GBR"],"also_sources":[],"norwegian":false},{"id":140190,"source_name":"ORF Sport","country":"AUT","title_no":"Levi-slalåmen søker Shiffrin-arvtaker","title_orig":"Levi-Slalom sucht Shiffrins Nachfolgerin","summary_no":"Med Mikaela Shiffrin fraværende leter dameslalåmen i Levi etter en ny dominerende stjerne som kan fylle tomrommet etter amerikaneren.","spik_no":"Mikaela Shiffrin, som har vunnet slalomrennet i Levi hele ni ganger, er ikke med i helgens konkurranse — noe som gjør utgangspunktet mer åpent enn på lenge. Østerrikske Katharina Truppe, som starter med nummer tre og tok en pallplass i Levi i 2019, ser muligheten men vil ikke skru forventningene for høyt. Lara Colturi, Lena Dürr og Emma Aicher er blant dem som pekes ut som mulige arvtakere etter Shiffrin i den finske nattslalomen.","url":"https://sport.orf.at/stories/3164845/","pub_date":"2026-11-13T21:00:08.000Z","fetched_at":"2026-11-14 07:45:05","lang_orig":"de","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":142236,"source_name":"RTV SLO","country":"SLO","title_no":"Emma Aicher leder, Andreja Slokar brøt","title_orig":"V vodstvu Emma Aicher, Andreja Slokar odstopila","summary_no":"Emma Aicher tok ledelsen, mens sloveneren Andreja Slokar brøt i rennet.","spik_no":"Emma Aicher tok ledelsen i rennet, mens sloveneren Andreja Slokar brøt. Aicher er en tysk allroundkjører født i 2003 som har etablert seg i verdenstoppen de siste sesongene, med særlig styrke i tekniske disipliner. Slokar er en av Slovenias fremste slalåmkjørere og har tidligere vunnet verdenscuprenn, men brøt altså ut av dette rennet uten å fullføre.","url":"https://www.rtvslo.si/sport/v-vodstvu-emma-aicher-andreja-slokar-odstopila/800075","pub_date":"2026-11-13T19:54:41.000Z","fetched_at":"2026-11-14 10:30:05","lang_orig":"sl","category":null,"athletes":"Andreja Slokar,Emma Aicher","athlete_nations":["GER","SLO"],"also_sources":[],"norwegian":false},{"id":143448,"source_name":"RTV SLO","country":"SLO","title_no":"Slalomfinale: Emma Aicher leder – Neja Dvornik på 15. plass","title_orig":"Finale slaloma (v vodstvu Emma Aicher, Neja Dvornik 15.)","summary_no":"Emma Aicher leder etter første omgang i slalomfinalen. Neja Dvornik ligger på 15. plass.","spik_no":"Emma Aicher leder etter første omgang i slalomfinalen, mens slovenske Neja Dvornik ligger på 15. plass. Aicher er en tysk-fransk alpinist som representerer Tyskland, og har etablert seg som en av de mer fremadstormende slalomkjørerne på verdenscupturen de siste sesongene. Dvornik er en av Slovenias største håp i tekniske disipliner og har jevnlig plassert seg i verdenstoppen. Andre omgang vil avgjøre den endelige plasseringen.","url":"https://www.rtvslo.si/sport/finale-slaloma-v-vodstvu-emma-aicher-neja-dvornik-15/800075","pub_date":"2026-11-13T19:54:41.000Z","fetched_at":"2026-11-14 12:15:05","lang_orig":"sl","category":null,"athletes":"Emma Aicher","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":140130,"source_name":"Neveitalia","country":"ITA","title_no":"Slalåmsesongen i gang fra Levi: Aicher med startnummer 1, Colturi og Holdener klar","title_orig":"E' tempo di slalom, si parte dall'incanto di Levi: pettorale 1 per Aicher, poi Colturi, Holdener con il 7","summary_no":"Verdenscupslalåmen i Levi sparker i gang sesongen, med Aicher som nummer 1, etterfulgt av Colturi og Holdener med startnummer 7.","spik_no":"Verdenscupslalåmen i Levi åpnet sesongen med Emma Aicher, som feiret sin 23-årsdag på startsdag, som nummer én på startnummerlisten. Lara Colturi, som nesten tok sin første verdenscupseier i storslalåm i Sölden, var nummer to, mens Wendy Holdener fikk startnummer 7. Petra Vlhová, seksganger Levi-vinner, kom inn med startnummer 15 i det som var hennes første slalåmstart siden Flachau i januar 2024. Mikaela Shiffrin var fraværende, noe som gjør rennet til et av de mest åpne på mange år.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/e-tempo-di-slalom-si-parte-dall-incanto-di-levi-pettorale-1-per-aicher-poi-colturi-holdener-con-il-7","pub_date":"2026-11-13T17:50:00.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"it","category":null,"athletes":"Emma Aicher,Lara Colturi,Wendy Holdener","athlete_nations":["ALB","GER","SUI"],"also_sources":[],"norwegian":false},{"id":140111,"source_name":"Ski Racing","country":"INT","title_no":"Swiatek og Shiffrin møtes for å snakke om press, perspektiv og glede","title_orig":"Iga Swiatek Joins Mikaela Shiffrin to Talk Pressure, Perspective and Finding Joy","summary_no":"Tennisstjernen Iga Swiatek og alpinisten Mikaela Shiffrin har møttes for en samtale om det å håndtere press og finne glede i idretten.","spik_no":"Mikaela Shiffrin har invitert tennisstjernen Iga Swiatek til sin podkast «What's the Point» for en samtale om press, forventninger og glede i toppidrett. Swiatek, som har vunnet seks Grand Slam-titler og tok OL-bronse i Paris, beskriver blant annet sin semifinalenederlag i Paris-OL som karrierens største drama. Begge utøverne er kjent for å håndtere enormt press fra omgivelsene, og samtalen berører temaer som identitet, mentalt overskudd og det å finne mening i konkurransen utover resultatene.","url":"https://skiracing.com/iga-swiatek-joins-mikaela-shiffrin-to-talk-pressure-perspective-and-finding-joy/","pub_date":"2026-11-13T16:03:49.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":"Mikaela Shiffrin","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":140132,"source_name":"Neveitalia","country":"ITA","title_no":"Silvaplana er treningsbase for Tabanelli, Gasslitter og Donaggio før Innsbruck-åpningen","title_orig":"Silvaplana è sede degli ultimi allenamenti pre opening di Innsbruck per Flora e Miro Tabanelli, Gasslitter e Donaggio","summary_no":"Flora og Miro Tabanelli, Gasslitter og Donaggio gjennomfører de siste treningene i Silvaplana før sesongåpningen i Innsbruck.","spik_no":"Det italienske freeski-landslaget bruker Silvaplana i Sveits som treningsbase frem mot sesongåpningen i Innsbruck 26.–27. november, der Big Air-konkurransen åpner Freestyle-verdenscupen 2026/27. Kvartetten Flora og Miro Tabanelli, Leonardo Donaggio og Maria Gasslitter samles fra 15. til 22. november under ledelse av teknisk direktør Bartolomeo Pala og trenerne Valentino Mori og Mattia Fabrinetti. Big Air under kunstig belysning i Innsbruck er en ny innslag i verdenscupkalenderen, og de italienske utøverne prioriterer en hel uke på snø for å være best mulig forberedt.","url":"https://www.neveitalia.it/freestyle/news/silvaplana-e-sede-degli-ultimi-allenamenti-pre-opening-di-innsbruck-per-flora-e-miro-tabanelli-gasslitter-e-donaggio","pub_date":"2026-11-13T15:35:00.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140133,"source_name":"Neveitalia","country":"ITA","title_no":"Della Mea klar for Levi: – Kroppen svarer og følelsene er gode","title_orig":"\"Ho ritrovato buone sensazioni e il fisico risponde\": Della Mea alla vigilia di Levi, i pettorali delle azzurre","summary_no":"Lara Della Mea er optimistisk foran slalåmåpningen i Levi og forteller at formen er god og kroppen reagerer bra.","spik_no":"Den italienske slalåmkjøreren Lara Della Mea stiller optimistisk til start i Levi og melder at kroppen svarer bra og følelsene er gode. Den 25 år gamle friulanske utøveren starter med startnummer 16, noe som skyldes fravær av stjerner som Mikaela Shiffrin og Katharina Liensberger. Italia stiller med hele ni løpere i lørdagens slalåm, men Levi-rennet er historisk sett en bane som ikke har passet det italienske laget spesielt godt.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/ho-ritrovato-buone-sensazioni-e-il-fisico-risponde-della-mea-alla-vigilia-di-levi-i-pettorali-delle-azzurre","pub_date":"2026-11-13T14:45:00.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"it","category":null,"athletes":"Marta Rossetti,Martina Peterlini","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":140145,"source_name":"SkinEWS","country":"SUI","title_no":"Pressekonferanse før verdenscuphelgen i Levi","title_orig":"Pressekonferenz vor dem Weltcup-Wochenende in Levi","summary_no":"Det ble holdt pressekonferanse i forkant av verdenscuphelgen i Levi.","spik_no":"I forkant av verdenscuphelgen i Levi ble det holdt pressekonferanse der utøvere og trenere møtte pressen. Levi er et av de mest tradisjonsrike stoppene på verdenscupkalenderen og arrangerer hvert år slalomrenn for både kvinner og menn under arktiske forhold nord for polarsirkelen i Finland.","url":"https://www.skinews.ch/video/2026/pressekonferenz-weltcup-wochenende/","pub_date":"2026-11-13T14:32:03.000Z","fetched_at":"2026-11-14 07:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140134,"source_name":"Neveitalia","country":"ITA","title_no":"Nok et skuffende tilbakeslag for Mélanie Meillard: Skadet i trening – går glipp av sesongåpningen","title_orig":"Un'altra disdetta per Mélanie Meillard: caduta in allenamento, niente opening di specialità per l'elvetica","summary_no":"Sveitsiske Mélanie Meillard pådro seg en skade under trening og må stå over sesongåpningen i slalåm.","spik_no":"Sveitsiske Mélanie Meillard må stå over sesongåpningen i Levi etter å ha falt under trening og pådratt seg en forstuing i høyre kne. Den 28 år gamle Meillard har en tung skadehistorikk bak seg, særlig knyttet til venstre kne, og hadde sett frem til å revansjere en vanskelig sesong. Swiss-Ski bekrefter at videre undersøkelser gjennomføres etter hjemkomst, og Sveits velger ikke å sende en erstatningsløper til Levi.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-altra-disdetta-per-melanie-meillard-caduta-in-allenamento-niente-opening-di-specialita-per-l-elvetica","pub_date":"2026-11-13T14:00:00.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"it","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":140200,"source_name":"ORF Sport","country":"AUT","title_no":"Rosner på åttendeplass i World Cup-åpningen","title_orig":"Platz acht für Rosner bei Weltcup-Auftakt","summary_no":"Østerrikske Rosner innledet verdenscupsesongen med en åttendeplass i det første rennet og viste lovende form.","spik_no":"Dette er ikke en alpinsak — artikkelen handler om skøyteløp. Jeannine Rosner tok Østerrikes beste resultat under verdenscupåpningen i Beijing med en åttendeplass på 3000 meter. Vanessa Herzog sikret seg retur til A-divisjonen ved å vinne sitt heat i B-gruppen på 1000 meter.","url":"https://sport.orf.at/stories/3164842/","pub_date":"2026-11-13T13:48:36.000Z","fetched_at":"2026-11-14 07:45:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140135,"source_name":"Neveitalia","country":"ITA","title_no":"Lara Colturi i storslag før Levi-slalåm: – Forholdene er topp og Levi er spesielt","title_orig":"Un regalo di compleanno anticipato? Lara Colturi in super fiducia per il primo slalom: \"Levi è speciale e le condizioni sono top\"","summary_no":"Lara Colturi er full av selvtillit foran den første slalåmkonkurransen i Levi, som faller like før bursdagen hennes.","spik_no":"Lara Colturi er blant de store favorittene til lørdagens slalåm i Levi og fyller 20 år dagen etter rennet. Den Albania-representerende italienskfødte utøveren startet fjorårssesongen eksepsjonelt med fire pallplasser i de fem første slalåmrennene, og i Levi i fjor endte hun like bak Mikaela Shiffrin. Med Shiffrin fraværende denne helgen er Colturi en av de mest sannsynlige kandidatene til seieren, og hun understreker at hun allerede i søndags imponerte under trening.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/un-regalo-di-compleanno-anticipato-lara-colturi-in-super-fiducia-per-il-primo-slalom-levi-e-speciale-e-le-condizioni-sono-top","pub_date":"2026-11-13T13:35:00.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"it","category":null,"athletes":"Lara Colturi","athlete_nations":["ALB"],"also_sources":[],"norwegian":false},{"id":140146,"source_name":"SkinEWS","country":"SUI","title_no":"Melanie Meillard må stå over Levi-rennet","title_orig":"Melanie Meillard muss auf Levi-Start verzichten","summary_no":"Sveitsiske Melanie Meillard er ikke klar for start i Levi og må melde avbud til verdenscuprennet.","spik_no":"Sveitsiske Melanie Meillard er ikke klar for start i Levi og må stå over verdenscuprennet. Meillard er en allsidig teknikkutøver som har representert Sveits i både slalåm og storslalåm på verdenscupnivå, og har tidligere slitt med skader som har avbrutt sesonger. Fraværet hennes svekker Sveits' slalomtropp i åpningshelgen.","url":"https://www.skinews.ch/news/2026/melanie-meillard-verzichten/","pub_date":"2026-11-13T13:31:37.000Z","fetched_at":"2026-11-14 07:45:04","lang_orig":"de","category":null,"athletes":"Melanie Meillard","athlete_nations":["SUI"],"also_sources":[],"norwegian":false},{"id":140138,"source_name":"Neveitalia","country":"ITA","title_no":"Rossetti tilbake etter 615 dager: – Det tok lang tid å komme over skaden","title_orig":"Rossetti, 615 giorni dopo: \"Ci ho messo tanto a superare l'infortunio, voglio ripartire da quel 2025 dove stavo andando così bene\"","summary_no":"Rossetti er endelig tilbake etter 615 dager ute med skade og ønsker å gjenfinne formen han hadde tidlig i 2025.","spik_no":"Matteo Rossetti gjør comeback etter over 615 dager ute med skade og er klar for slalåmåpningen i Levi. Den italienske slalåmspesialisten pådro seg skaden tidlig i 2024 og har brukt lang tid på rehabilitering. Rossetti håper å gjenfinne formen han viste i begynnelsen av 2025, da han var en av de mest lovende italienske slalåmkjørerne på verdenscupnivå.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/rossetti-615-giorni-dopo-ci-ho-messo-tanto-a-superare-l-infortunio-voglio-ripartire-da-quel-2025-dove-stavo-andando-cosi-bene","pub_date":"2026-11-13T11:00:00.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"it","category":null,"athletes":"Marta Rossetti","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":140267,"source_name":"Sportschau","country":"GER","title_no":"Straßer før Levi – den ensomme tyske ulven i slalomverdenen","title_orig":"Straßer vor Levi - der einsame deutsche Wolf in der Slalomwelt","summary_no":"Linus Straßer stiller til start i Levi som Tysklands store slalomhåp, nærmest alene om å representere nasjonen i en disiplin dominert av andre nasjoner.","spik_no":"Linus Straßer innleder verdenscupsesongen i Levi nærmest som eneste tysk slalomutøver på toppnivå, etter at både Sebastian Holzmann og Anton Tremmel nylig har avsluttet karrierene sine. 33-åringen fra München har i over et tiår vært det tyske ankerfestet i slalomen og har selv beskrevet det som «uvant å reise alene etter 15 år i et team». Hans beste resultat i Levi er en sjuendeplass, og han håper å forbedre det i helgens renn.","url":"https://www.sportschau.de/regional/br/br-strasser-vor-levi-der-einsame-deutsche-wolf-in-der-slalomwelt-102.html","pub_date":"2026-11-13T10:56:13.000Z","fetched_at":"2026-11-14 07:45:06","lang_orig":"de","category":null,"athletes":"Linus Straßer","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":140139,"source_name":"Neveitalia","country":"ITA","title_no":"Optimale forhold i Levi: Alle de store kjørte på pisten 24 timer før slalåmstarten","title_orig":"Condizioni ottimali a Levi, sciata in pista per tutte le big a 24 ore dallo start della stagione di slalom: alle 18.00 i pettorali","summary_no":"Forholdene på Levi-pisten er optimale, og samtlige toppløpere var ute og trente dagen før slalåmsesongen sparkes i gang.","spik_no":"Forholdene på Levi-bakken beskrives som optimale før lørdagens sesongåpning i slalåm, og samtlige toppløpere gjennomførte trening på pisten dagen i forveien. Levi i Finland er et klassisk åpningssted for slalåmsesongen og har vært fast på verdenscupprogrammet i en årrekke. Den arktiske beliggenheten gir stabil snø og lave temperaturer, noe som normalt sikrer gode konkurranseforhold tidlig i november.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/condizioni-ottimali-a-levi-sciata-in-pista-per-tutte-le-big-a-24-ore-dallo-start-della-stagione-di-slalom-alle-1800-i-pettorali","pub_date":"2026-11-13T10:25:00.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140112,"source_name":"Ski Racing","country":"INT","title_no":"Sydney Daly og Ian Tezak pryder forsiden av Race Place Catalog 2026–2027","title_orig":"Sydney Daly and Ian Tezak Named 2026–2027 Race Place Catalog Cover Winners","summary_no":"Sydney Daly og Ian Tezak er kåret til vinnere av forsidekonkurransen for Race Place Catalog for sesongen 2026–2027.","spik_no":"Sydney Daly og Ian Tezak er kåret til vinnere av forsidekonkurransen for Race Place Catalog 2026–2027, et amerikansk utstyrsmagasin for alpinracere. Daly, som har vokst opp med ski i Whistler og nå representerer Park City Ski & Snowboard, pryder forsiden og mottar et gavekort verdt 3 000 dollar. Tezak, som oppdaget racing i åttende klasse i Wisconsin og har jobbet seg opp til FIS-nivå, er på baksiden og mottar 1 500 dollar. Konkurransen løfter frem unge, dedikerte utøvere fra bredden av nordamerikansk alpinsport.","url":"https://skiracing.com/sydney-daly-and-ian-tezak-named-2026-2027-race-place-catalog-cover-winners/","pub_date":"2026-11-12T19:01:29.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140113,"source_name":"Ski Racing","country":"INT","title_no":"CMC Ski Team tilbake på sporet etter finanskrise","title_orig":"CMC Ski Team Bounces Back After Funding Crisis","summary_no":"CMC Ski Team har kommet seg gjennom en alvorlig finansieringskrise og er klare for ny satsing.","spik_no":"Colorado Mountain College Eagles ski team er tilbake med full styrke til sesongen 2026–27 etter å ha overlevd en alvorlig finansieringskrise. Trenar Scott Tanner, som for åtte år siden måtte ringe rundt for å overtale utøvere til å bli med, fikk denne sesongen henvendelser fra 30 potensielle rekrutter og måtte avvise flere. CMC-programmet, med base i Steamboat Springs nær Steamboat Ski Resort og Howelsen Hill, er kjent for et sterkt skimiljø og gir utøvere som ikke er klare for Division I-nivå en reell mulighet til å utvikle seg videre.","url":"https://skiracing.com/cmc-ski-team-bounces-back-after-funding-crisis/","pub_date":"2026-11-12T18:24:05.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140114,"source_name":"Ski Racing","country":"INT","title_no":"Timon Haugan jobber med utstyrsproblem før Levi-slalåmen","title_orig":"Timon Haugan Works Through Equipment Issue Ahead of Levi Slalom","summary_no":"Norske Timon Haugan har hatt utfordringer med utstyret i forkant av slalåmåpningen i Levi.","spik_no":"Timon Haugan går inn i slalåmåpningen i Levi med usikkerhet etter et problem med bindingsoppsettet som ble avdekket bare dager før rennstart. En justering av bindingsplaten gjort under vårtreningen i april ble aldri rettet tilbake til hans vanlige innstilling, og han har trent gjennom hele forsessongen med feil oppsett uten å vite om det. Haugan er rangert som nummer tre på verdenscupslaglisten i slalåm, bak landsmenningene Atle Lie McGrath og Henrik Kristoffersen, og vant to verdenscuprenn i slalåm forrige sesong til tross for store ryggsmerter.","url":"https://skiracing.com/timon-haugan-works-through-equipment-issue-ahead-of-levi-slalom/","pub_date":"2026-11-12T16:35:16.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":"Atle Lie McGrath,Henrik Kristoffersen,Timon Haugan","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":140268,"source_name":"Sportschau","country":"GER","title_no":"Levi som godt varsel – tysk duo vil fortsette suksessrekken","title_orig":"Levi als gutes Omen - DSV-Duo will Erfolgsserie fortsetzen","summary_no":"Det tyske alpinparet ser på Levi som et lykkebringende sted og ønsker å videreføre en positiv resultatrekke i helgens slalomrenn.","spik_no":"Lena Dürr og Emma Aicher reiser til Levi med gode minner og store ambisjoner foran helgens slalomrenn. Dürr har stått på pallen i Levi hele fem ganger og er blant de mest konsekvente slalomkjørerne på verdenscupturen, mens Aicher tok sitt første slalompodium i Levi forrige sesong. Begge utnytter banens flate partier særlig godt med sin teknisk stilrene kjøring, og den finske løypa «Levi Black» passer begge utøvernes stil.","url":"https://www.sportschau.de/regional/br/br-levi-als-gutes-omen-dsv-duo-will-erfolgsserie-fortsetzen-102.html","pub_date":"2026-11-12T14:57:06.000Z","fetched_at":"2026-11-14 07:45:06","lang_orig":"de","category":null,"athletes":"Emma Aicher,Lena Dürr","athlete_nations":["GER"],"also_sources":[],"norwegian":false},{"id":140269,"source_name":"Sportschau","country":"GER","title_no":"Her er alpinsportens stoppesteder denne sesongen","title_orig":"Wo Ski Alpin in dieser Saison Station macht","summary_no":"En oversikt over alle arenaer og lokasjoner der alpint World Cup-sirkuset setter opp renn i løpet av den kommende sesongen.","spik_no":"Alpinverdenscupen 2026/27 byr på totalt 94 renn fra slutten av oktober til slutten av mars, med sesongstart på Rettenbachbreen i Sölden — slik tradisjonen tilsier. Etter Levi-åpningen i november venter klassikere som Wengen og Kitzbühel, før sesongens store høydepunkt blir VM i Crans-Montana i Sveits. Sesongfinalen arrangeres i Sun Valley i USA.","url":"https://www.sportschau.de/wintersport/ski-alpin/wo-ski-alpin-in-dieser-saison-station-macht,weltcup-orte-ski-alpin-100.html","pub_date":"2026-11-12T14:40:20.000Z","fetched_at":"2026-11-14 07:45:06","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140147,"source_name":"SkinEWS","country":"SUI","title_no":"Nok et nytt ansikt dukker opp i Levi","title_orig":"Ein weiteres „neues Gesicht“ taucht in Levi auf","summary_no":"En ny utøver gjør sin entre på verdenscupscenen i Levi og vekker oppsikt blant tilskuere og eksperter.","spik_no":"Levi-helgen er kjent for å gi debutanter en sjanse på verdenscupscenen, og i år dukker nok et nytt navn opp i startfeltet. Levi Black-løypa i Finland er en klassisk slalombane under flomlys, og åpningsrennet tiltrekker seg unge talenter som vil markere seg tidlig i sesongen.","url":"https://www.skinews.ch/news/2026/weiteres-gesicht-taucht/","pub_date":"2026-11-12T11:51:15.000Z","fetched_at":"2026-11-14 07:45:04","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":140148,"source_name":"SkinEWS","country":"SUI","title_no":"Piera Hudson legger opp etter historisk bragd","title_orig":"Piera Hudson – nach dem Eintrag ins Geschichtsbuch der Rücktritt","summary_no":"Piera Hudson avslutter karrieren etter å ha skrevet seg inn i historiebøkene med en bemerkelsesverdig prestasjon.","spik_no":"Nyzealandske Piera Hudson avslutter sin aktive karriere etter å ha skrevet seg inn i historiebøkene. Hudson har vært en pionér for nyzealandsk alpint på verdenscupnivå og representerte sitt land med heder over flere sesonger. Karriereavslutningen markerer slutten på et viktig kapittel for alpinsporten på den sørlige halvkule.","url":"https://www.skinews.ch/news/2026/eintrag-geschichtsbuch-ruecktritt/","pub_date":"2026-11-12T07:22:41.000Z","fetched_at":"2026-11-14 07:45:04","lang_orig":"de","category":null,"athletes":"Piera Hudson","athlete_nations":["NZL"],"also_sources":[],"norwegian":false},{"id":140115,"source_name":"Ski Racing","country":"INT","title_no":"Salomon satser på neste generasjon i nordamerikansk alpinsport","title_orig":"Salomon’s Next Chapter in North American Racing Starts With the Next Generation","summary_no":"Salomon innleder et nytt kapittel i nordamerikansk alpinracing med fokus på unge, kommende utøvere.","spik_no":"Salomon er i ferd med å gjenoppbygge sitt nordamerikanske racingprogram, med fokus på å nå unge utøvere og treningsmiljøer som kjenner merket best fra frikjøring og fottøy. Lauren Samuels og Tyler Theis leder satsingen, der Theis reiser rundt til lokale renn og utstyrskvelder for å bygge relasjoner med trenere og familier. Salomon var lenge en dominant kraft i alpinracing – blant annet kjørte Ingemar Stenmark på Salomon-ski – og merket ønsker nå å gjenvinne fotfeste blant neste generasjons racere i USA og Canada.","url":"https://skiracing.com/salomons-next-chapter-in-north-american-racing-starts-with-the-next-generation/","pub_date":"2026-11-11T20:55:21.000Z","fetched_at":"2026-11-14 07:45:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":139778,"source_name":"Ski Racing","country":"INT","title_no":"Hva FIS' nye klimaveiledning betyr for alpint","title_orig":"Preparing the Mountain: What New FIS Climate Guidance Means for Alpine Racing","summary_no":"FIS har utgitt ny klimaveiledning som vil påvirke hvordan alpinbakker forberedes og gjennomføres i fremtiden.","spik_no":"FIS og Verdens meteorologiorganisasjon (WMO) har gitt ut en ny felles rapport om hvordan skisentre og arrangører kan bruke vær- og klimainformasjon til å forberede løyper, forvalte ressurser og planlegge fremtidige investeringer. Rapporten kom 3. november og følges av en kortere praktisk veileder. Bakgrunnen er alvorlig: ifølge FIS' egne beregninger ble 25 verdenscuprenn avlyst på grunn av dårlig vær i sesongen 2025–26. Klimautfordringene rammer steder ulikt – fra Levi i Finland til Beaver Creek i Colorado – men felles for alle er problemet med å klargjøre en løype til en fastsatt dato under forhold man ikke kan kontrollere.","url":"https://skiracing.com/preparing-the-mountain-what-new-fis-climate-guidance-means-for-alpine-racing/","pub_date":"2026-11-11T19:34:14.000Z","fetched_at":"2026-11-11 19:45:04","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":139543,"source_name":"Expressen","country":"SWE","title_no":"Lindsey Vonn viser frem skruene etter den niende operasjonen","title_orig":"Lindsey Vonn visar upp skruvarna efter nionde operationen","summary_no":"Alpinstjernen Lindsey Vonn delte bilder av skruene etter sin niende operasjon.","spik_no":"Lindsey Vonn har gjennomgått sin niende operasjon av venstre kne, denne gangen for å fjerne skruer og plater slik at et nytt korsbånd kan settes inn. 42-åringen viste frem en pose med titalls skruer på Instagram etter at inngrepet gikk som planlagt. Vonn pådro seg den alvorlige skaden under utforkjøringen i OL tidligere i år, og har siden vært igjennom en rekke operasjoner. Den amerikanske alpinstjernen er en av tidenes beste i utfor, med rekordmange 82 verdenscupseirer og fire store kuletriumfer.","url":"https://www.expressen.se/sport/alpint/lindsey-vonn-visar-upp-skruvarna-efter-nionde-operationen/","pub_date":"2026-11-11T18:57:33.000Z","fetched_at":"2026-11-11 19:15:05","lang_orig":"sv","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":138768,"source_name":"Neveitalia","country":"ITA","title_no":"Razzoli og Mair lanserer Campiglio-slalåm på Senatets bibliotek","title_orig":"Alla Biblioteca del Senato il secondo lancio dello slalom di Campiglio con Giuliano Razzoli e \"Much\" Mair","summary_no":"Giuliano Razzoli og «Much» Mair deltok på den andre lanseringen av Campiglio-slalåmen ved Senatets bibliotek i Italia.","spik_no":"Giuliano Razzoli og Markus «Much» Mair deltok på en offisiell lansering av Campiglio-slalåmen i Senatets bibliotek i Roma. 3Tre på Canalone Miramonti er en av alpinsportens mest tradisjonsrike renn, og årets utgave er den 73. i rekken – planlagt til 23. desember. Razzoli er OL-gullvinner i slalåm fra Vancouver 2010 og har et nært forhold til nettopp dette rennet. Lanseringen understreker hvilken institusjonell status Madonna di Campiglio-slalåmen har i italiensk idrett.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/alla-biblioteca-del-senato-il-secondo-lancio-dello-slalom-di-campiglio-con-giuliano-razzoli-e-much-mair","pub_date":"2026-11-11T18:10:00.000Z","fetched_at":"2026-11-11 18:15:03","lang_orig":"it","category":null,"athletes":"Giuliano Razzoli","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":138068,"source_name":"Neveitalia","country":"ITA","title_no":"SKI-TEST: Salomon feier med seg gullmedaljer!","title_orig":"SKI TEST: Salomon fa incetta di Gold Medal!","summary_no":"Salomon gjør det svært sterkt i årets skitest og kaprer en rekke gullmedaljer i den prestisjetunge kåringen.","spik_no":"Salomon kaprer fem gullmedaljer i den prestisjetunge italienske skitesten NeveItalia for sesongen 2026/27, der totalt tretten Salomon-ski ble testet av et ekspertpanel. Det er spesielt den nye racinglinjen som utmerker seg, med debutmodellene EQUIPE og S/LAB EQUIPE innen storslalåm og slalåm. Salomon er et av de store, franske skimerkene med lang tradisjon i alpint, og resultatene bekrefter at produsenten har gjort et solid utviklingsarbeid med de nye modellene sine.","url":"https://www.neveitalia.it/test/news/ski-test-salomon-fa-incetta-di-gold-medal","pub_date":"2026-11-11T17:00:00.000Z","fetched_at":"2026-11-11 17:15:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":137792,"source_name":"SVT Sport","country":"SWE","title_no":"Her hopper Melwin Lycke Holm over skyhøye hekker – med vekter på kroppen","title_orig":"Här hoppar Melwin Lycke Holm över skyhöga häckar – med vikter på kroppen","summary_no":"Alpinisten Melwin Lycke Holm viser imponerende styrke og spenst ved å hoppe over skyhøye hekker med vekter festet til kroppen.","spik_no":"Den svenske alpinisten Melwin Lycke Holm, sønn av høydehopp-legenden Stefan Holm, trener nå med vekter på kroppen mens han hopper over 150 centimeter høye hekker – en metode han selv beskriver som «kanskje litt gal». Den 22-årige Lycke Holm har i flere år fulgt farens treningsprogram nøye, inkludert opplegget Stefan brukte da han vant OL-gull i Athen i 2004, uten å se fremgang. Nå har han flyttet fra Karlstad til Umeå og tar i større grad styringen over sin egen trening, på jakt etter en ny vri som kan gi utvikling.","url":"https://www.svt.se/sport/friidrott/har-hoppar-melwin-lycke-holm-over-skyhoga-hackar-med-vikter-pa-kroppen","pub_date":"2026-11-11T16:41:17.000Z","fetched_at":"2026-11-11 16:45:06","lang_orig":"sv","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":137307,"source_name":"RTV SLO","country":"SLO","title_no":"EM 2027 avholdes i Danmark","title_orig":"Po Šenčurju se bo za evropske naslove v letu 2027 dirkalo na Danskem","summary_no":"Etter Šenčur får Danmark æren av å arrangere de europeiske mesterskapene i alpint i 2027.","spik_no":"Danmark er tildelt arrangørrollen for de europeiske mesterskapene i alpint i 2027, etter at Slovenia og Šenčur arrangerer EM i 2025. Det er uvanlig at Danmark er vert for et alpint mesterskap, ettersom landet ikke har noen alpine fjell eller tradisjon for teknisk alpint på høyt nivå. EM i alpint samler europeiske nasjoner som ikke kvalifiserer til VM, og arrangeres typisk i mindre alpinnasjoner som et ledd i å spre sporten geografisk.","url":"https://www.rtvslo.si/sport/po-sencurju-se-bo-za-evropske-naslove-v-letu-2027-dirkalo-na-danskem/799789","pub_date":"2026-11-11T15:55:14.000Z","fetched_at":"2026-11-11 16:00:05","lang_orig":"sl","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":137193,"source_name":"Neveitalia","country":"ITA","title_no":"Lindsey Vonn etter ny operasjon: – Inngrepet gikk bra","title_orig":"Il primo aggiornamento di Lindsey Vonn dopo essere tornata sotto i ferri a Vail: \"L'intervento è andato bene\"","summary_no":"Lindsey Vonn har gjennomgått en ny operasjon i Vail og melder at alt gikk som planlagt.","spik_no":"Lindsey Vonn har gjennomgått sin niende operasjon siden comebacket, denne gangen på det fremre korsbåndet i venstre kne, og melder at inngrepet ved Steadman-klinikken i Vail gikk som planlagt. Skaden skjedde i forbindelse med et fall under utforrennet i Crans-Montana i februar 2025, bare dager etter at hun hadde ledet utforverdenscupen i comeback-sesongen sin. Vonn, som har 82 verdenscupseiere og regnes som en av tidenes beste alpinister, håper dette skal være den siste operasjonen i et langvarig skadedrama som har preget slutten av karrieren hennes.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/il-primo-aggiornamento-di-lindsey-vonn-dopo-essere-tornata-sotto-i-ferri-a-vail-l-intervento-e-andato-bene","pub_date":"2026-11-11T15:55:00.000Z","fetched_at":"2026-11-11 16:00:02","lang_orig":"it","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":136843,"source_name":"Neveitalia","country":"ITA","title_no":"Europakvp-start i Levi: Disse italienske kvinner stiller – fra Sola til talentet Klotz","title_orig":"Da Levi anche lo start di Coppa Europa: ecco le azzurre, da Sola ad un gran talento come Klotz","summary_no":"Fra Levi starter også Europacupen: Italia stiller med en rekke utøvere, blant dem Sola og det store talentet Klotz.","spik_no":"I helgen 21.–22. november arrangeres de to første slalomrennene i Europacupen for kvinner på «Levi Black» i Finland – den samme bakken der Verdenscupen allerede har vært i aksjon. Italia stiller med ti utøvere i forberedelsessamlingen, blant dem Marta Sola og det lovende talentet Klotz, samt Carolli, D'Antonio og Mathiou. Europacupen fungerer som et viktig springbrett til Verdenscupen, og Finland er også vertskap for herrenes Europacup-slalomer i Suomu 25.–26. november.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/da-levi-anche-lo-start-di-coppa-europa-ecco-le-azzurre-da-sola-ad-un-gran-talento-come-klotz","pub_date":"2026-11-11T15:15:00.000Z","fetched_at":"2026-11-11 15:30:02","lang_orig":"it","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":136102,"source_name":"franceinfo","country":"FRA","title_no":"Lindsey Vonn operert for niende gang – vil ikke gi opp konkurransekarrieren","title_orig":"\"Je ne veux pas fermer la porte à la compétition\"... Lindsey Vonn opérée pour la neuvième fois mais pas résignée à 42 ans","summary_no":"42-åringen Lindsey Vonn har gjennomgått sin niende operasjon, men er ikke klar til å legge opp og holder døren åpen for fortsatt konkurranseaktivitet.","spik_no":"Lindsey Vonn har gjennomgått sin niende operasjon, denne gangen på venstre bein som ble alvorlig skadet under utforrennet i OL i Milano-Cortina 2026, men 42-åringen holder likevel døren åpen for fortsatt konkurranseaktivitet. Vonn er en av alpinhistoriens største profiler, med 82 verdenscupseirer og OL-gull i utfor fra Vancouver 2010. Hun kom tilbake til konkurranse i 2024 etter seks år utenfor verdenscupen, og har gjennom karrieren kjempet seg tilbake etter en rekke alvorlige skader.","url":"https://www.franceinfo.fr/sports/sports-d-hiver/ski-alpin/je-ne-veux-pas-fermer-la-porte-a-la-competition-lindsey-vonn-operee-pour-la-neuvieme-fois-mais-pas-resignee-a-42-ans_8277866.html#xtor=RSS-3-%5Bsports%2Fsports-d-hiver%2Fski-alpin%5D","pub_date":"2026-11-11T14:09:02.000Z","fetched_at":"2026-11-11 14:15:06","lang_orig":"fr","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":135830,"source_name":"VG","country":"NOR","title_no":"Alpinprofil utsetter sesongstarten på nytt: – Trenger mer tid","title_orig":"Alpinprofil utsetter sesongstarten på nytt: – Trenger mer tid","summary_no":"","spik_no":"Alexander Steen Olsen utsetter sesongstarten nok en gang og stiller ikke i helgens slalåmrenn i Levi. 25-åringen ble kneoperert i 2024 og gikk glipp av hele OL-sesongen 2025/26 — han ble heller ikke med til sesongåpningen i Sölden i oktober. Landslagslegen understreker at rehabiliteringen går som planlagt, men det er foreløpig uklart når han kan gjøre comeback i verdenscupen. Steen Olsen regnes som et av Norges største alpintalenter og har tidligere vist lovende resultater i tekniske disipliner.","url":"https://www.vg.no/sport/i/lM1pVo/alpinprofil-utsetter-sesongstarten-paa-nytt-trenger-mer-tid?utm_medium=rss","pub_date":"2026-11-11T13:47:20.000Z","fetched_at":"2026-11-11 14:00:11","lang_orig":"no","category":null,"athletes":"Alexander Steen Olsen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":135794,"source_name":"Neveitalia","country":"ITA","title_no":"Goggia på vei til USA – usikker på Killington-deltakelse","title_orig":"Goggia direzione States verso la conferma della presenza a Killington: \"Vedremo come andrà\"","summary_no":"Sofia Goggia er på vei til USA og nærmer seg en bekreftelse på deltakelse i Killington. «Vi får se hvordan det går», sier hun.","spik_no":"Sofia Goggia er på vei til USA og nærmer seg en bekreftelse på start i storslalåmrennet i Killington 28. november, men er ikke helt sikker ennå. Den italienske utfartsstjernen fikk en tung sesongstart etter at en skade tvang henne til å avbryte oppholdet i Ushuaia tidlig i høst, noe som forrykket planene betraktelig. Goggia har trent på Stelvio og i Pitztal og skal nå forberede seg videre på Copper Mountain i Colorado. Hun er en av verdens beste i utfor og super-G, men kjører relativt sjelden storslalåm på høyt nivå.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/goggia-direzione-states-verso-la-conferma-della-presenza-a-killington-vedremo-come-andra","pub_date":"2026-11-11T13:45:00.000Z","fetched_at":"2026-11-11 14:00:09","lang_orig":"it","category":null,"athletes":"Sofia Goggia","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":135273,"source_name":"Neveitalia","country":"ITA","title_no":"Stefano Pizzato vant i Diavolezza: Tok seieren i første FIS-slalåm foran Maechler og Fux","title_orig":"Stefano Pizzato vince a Diavolezza: è del padovano il primo slalom FIS, battuti Maechler e Fux","summary_no":"Padovaneren Stefano Pizzato vant den første FIS-slalåmen i Diavolezza og slo dermed Maechler og Fux.","spik_no":"Den italienske alpinisten Stefano Pizzato vant den første FIS-slalåmen i Diavolezza og slo hjemmesterke sveitsere som Reto Maechler (2.) og junior-VM-mester Giuliano Fux (3.). Pizzato, født i 2003 og fra Padova-regionen, har fire verdenscupsta iller til start i slalåmen i Levi lørdag – ett år etter at hun pådro seg sitt andre alvorlige korsbåndskade på høyre kne under trening i Sölden. Den 29 år gamle sloveneren er en av slalåmens mest meritterte utøvere og har to Verdenscupseiere på merittlisten, men karrieren har vært sterkt preget av skader siden det første korsbåndet røk i Val Senales i oktober 2022. Slokar sier selv at hun ikke vet nøyaktig hvor god form hun er i, men at treningsarbeidet har vært bra – og det er Levi-starten som blir fasiten.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/slokar-ora-il-rientro-e-ufficiale-non-so-a-che-punto-sono-ma-il-lavoro-e-stato-buono-la-slovenia-per-levi","pub_date":"2026-11-11T12:40:00.000Z","fetched_at":"2026-11-11 12:45:02","lang_orig":"it","category":null,"athletes":"Andreja Slokar","athlete_nations":["SLO"],"also_sources":[],"norwegian":false},{"id":134621,"source_name":"Neveitalia","country":"ITA","title_no":"USA-reisen starter: Paris og co. drar til Copper Mountain","title_orig":"Missione USA, si parte: sabato il via direzione Copper Mountain per Paris & Co., già domani un quartetto femminile","summary_no":"Det alpine landslaget setter kursen mot USA, der Paris og resten av troppen ankommer Copper Mountain lørdag, mens fire kvinner reiser allerede fredag.","spik_no":"Det italienske alpinlandslaget drar til USA for treningsleir og konkurranser, med herretroppen rundt Dominik Paris på vei til Copper Mountain i Colorado lørdag. Paris og resten av fartsgjengen skal tilbringe to uker i det såkalte «Speed Center» før sesongens første renn – et super-G på Copper Mountain 28. november, etterfulgt av storslalåm dagen etter. Fire kvinner, blant dem Sofia Goggia og Marta Bassino, reiser allerede fredag og skal videre til Killington. Copper Mountain har vært et fast innslag i det italienske lagets oppkjøring de siste sesongene.","url":"https://www.neveitalia.it/sport/scialpino/news/missione-usa-si-parte-sabato-il-via-direzione-copper-mountain-per-paris-co-gia-domani-un-quartetto-femminile","pub_date":"2026-11-11T12:10:00.000Z","fetched_at":"2026-11-11 12:15:02","lang_orig":"it","category":null,"athletes":"Dominik Paris","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":134315,"source_name":"Neveitalia","country":"ITA","title_no":"Nervøs venting og håp om å redde sesongen: Tommaso Sala og diagnosen på høyre kne","title_orig":"Un'attesa snervante e la speranza di salvare l'inverno: Tommaso Sala e la diagnosi al ginocchio destro","summary_no":"Tommaso Sala venter spent på diagnosen etter en skade på høyre kne, med håp om å kunne redde resten av vintersesongen.","spik_no":"Den italienske slalomspesialisten Tommaso Sala skadet høyre kne under trening i Gurgl og venter spent på diagnosen. For tre år siden rev han det fremre korsbåndet i venstre kne i Val Senales, noe som kostet ham store deler av en sesong. Sala hadde nettopp funnet tilbake til godt nivå i 2025/26 og regnes sammen med Alex Vinatzer som Italias viktigste slalomutøver — noe som gjør en ny kneskade særlig dramatisk for det italienske alpinlandslaget.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/un-attesa-snervante-e-la-speranza-di-salvare-l-inverno-tommaso-sala-e-la-diagnosi-al-ginocchio-destro","pub_date":"2026-11-11T11:40:00.000Z","fetched_at":"2026-11-11 11:45:14","lang_orig":"it","category":null,"athletes":"Alex Vinatzer,Tommy Sala","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":134215,"source_name":"SVT Sport","country":"SWE","title_no":"Lindsey Vonn har gjennomgått sin niende operasjon etter OL-krasjet","title_orig":"Lindsey Vonn har gjort sin nionde operation efter kraschen i OS","summary_no":"Lindsey Vonn har gjennomgått sin niende operasjon etter den alvorlige krasjen hun pådro seg under OL.","spik_no":"Lindsey Vonn har gjennomgått sin niende operasjon etter den dramatiske krasjen i OL-utforen i Cortina d'Ampezzo i februar 2026, der hun falt ut av løypa etter bare 13 sekunder og måtte  for niende gang etter OL-fallet","summary_no":"","spik_no":"Lindsey Vonn er operert for niende gang etter OL-krasjen i Cortina d'Ampezzo i februar 2026, der hun falt 13 sekunder ut i utforen og pådro seg brudd i bein og ankel – ni dager etter at hun allerede hadde røket leddbånd i venstre kne. Under inngrepet fjernet legene metall fra åtte tidligere operasjoner og rekonstruerte det fremre korsbåndet, noe som betyr seks til ni måneder med rehabilitering. Norske Aksel Lund Svindal var treneren hennes under comebacket, men sa i etterkant at trenerforholdet trolig var over – han er siden ansatt som trener for det norske alpinlandslaget.","url":"https://www.vg.no/sport/i/dJd6rj/vonn-operert-for-niende-gang-etter-ol-smellen?utm_medium=rss","pub_date":"2026-11-11T10:20:26.000Z","fetched_at":"2026-11-11 11:30:05","lang_orig":"no","category":null,"athletes":"Lindsey Vonn","athlete_nations":["USA"],"also_sources":[],"norwegian":false},{"id":134256,"source_name":"RTV SLO","country":"SLO","title_no":"Naraločnik vender tilbake til verdenscupkaravanen smertefri og klar","title_orig":"Naraločnik se v karavano svetovnega pokala vrača brez bolečin in zadržkov","summary_no":"Naraločnik er tilbake i verdenscupen uten smerter og uten forbehold etter å ha vært borte fra karavanen.","spik_no":"Sloveneren Andreja Naraločnik er tilbake i verdenscupen uten smerter og reservasjoner etter en periode utenfor karavanen. Naraločnik er en av Slovenias profiler i tekniske disipliner og har tidligere vist gode resultater i slalåm og storslalåm på verdenscupnivå. Comebacket er ventet med interesse, særlig med tanke på åpningsrennene i Levi.","url":"https://www.rtvslo.si/sport/naralocnik-se-v-karavano-svetovnega-pokala-vraca-brez-bolecin-in-zadrzkov/799733","pub_date":"2026-11-11T10:03:04.000Z","fetched_at":"2026-11-11 11:30:06","lang_orig":"sl","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":134158,"source_name":"SkinEWS","country":"SUI","title_no":"L n etter nesten åtte måneder, og ser frem mot en retur til konkurranseskiingen.","spik_no":"Kajsa Vickhoff Lie er tilbake på snøen i Sulden i Sør-Tirol etter nesten åtte måneder utenfor pisten, og et mulig konkurransedebut i super-G i St. Moritz i desember er ikke utelukket. Den norske fartsspesialisten skadet seg 22. mars under sesongavslutningen i Kvitfjell, da hun pådro seg en alvorlig bruskskade i høyre kne. Usikkerheten var stor gjennom sommeren, men nå trener hun igjen mellom portene – blant annet sammen med landslagskollega Marte Monsen. Lie har tidligere vunnet verdenscuprenner i super-G og er regnet som en av Norges fremste fartskjørere.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/a-solda-un-ritorno-atteso-dopo-quasi-8-mesi-kajsa-vickhoff-lie-sulla-neve-vedendo-il-ritorno-agonistico","pub_date":"2026-11-10T15:55:00.000Z","fetched_at":"2026-11-10 16:00:02","lang_orig":"it","category":null,"athletes":"Kajsa Vickhoff Lie","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":132448,"source_name":"ORF Sport","country":"AUT","title_no":"Baumgartner tilbake i toppform","title_orig":"Baumgartner meldet sich in Topform zurück","summary_no":"Baumgartner er tilbake og viser strålende form etter en periode borte fra toppen av alpinsporten.","spik_no":"Dette er ikke en alpinsak – artikkelteksten handler om den østerrikske fotballspilleren Christoph Baumgartner, som er tilbake i ÖFB-landslaget etter en alvorlig lårskinneverveskade som kostet ham VM-deltakelsen. 27-åringen, som spiller for RB Leipzig, har scoret eller laget mål fem ganger på seks kamper siden comebacket sitt i slutten av oktober. Saken har ingen tilknytning til alpint.","url":"https://sport.orf.at/stories/3164731/","pub_date":"2026-11-10T14:00:55.000Z","fetched_at":"2026-11-10 14:15:05","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":132177,"source_name":"RTV SLO","country":"SLO","title_no":"Hrobat før utre
