<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlpinMonitor — NRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12151c;--surface:#1a1e28;--surface2:#222736;
  --border:#2c3347;--border2:#3a4160;
  --fg:#dde2f0;--fg2:#8892b0;--fg3:#4a5470;
  --viktig:#e05555;--sportslig:#4a9eff;--nyheter:#8892b0;
  --goy:#52c78a;--nerding:#a87ef0;--kjendis:#f0a04a;--naert:#3cc8c8;
}
body{background:var(--bg);color:var(--fg);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 0 6px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--sportslig)}
.season{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--goy);padding:3px 9px;border:1px solid #52c78a50;border-radius:5px}
.updated{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto;white-space:nowrap}
.readonly-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fg3);padding:2px 7px;border:1px solid var(--border);border-radius:4px}

/* FILTER TABS */
.filter-rows{display:flex;flex-direction:column;align-items:center;gap:2px}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;width:100%}
.ftab .flag{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ftab{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.ftab:hover{color:var(--fg2)}
.ftab.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-viktig.active{color:var(--viktig);border-bottom-color:var(--viktig)}
.ftab.cat-sportslig.active{color:var(--sportslig);border-bottom-color:var(--sportslig)}
.ftab.cat-nyheter.active{color:var(--nyheter);border-bottom-color:var(--nyheter)}
.ftab.cat-goy.active{color:var(--goy);border-bottom-color:var(--goy)}
.ftab.cat-nerding.active{color:var(--nerding);border-bottom-color:var(--nerding)}
.ftab.cat-kjendis.active{color:var(--kjendis);border-bottom-color:var(--kjendis)}
.ftab.cat-naert.active{color:var(--naert);border-bottom-color:var(--naert)}
.divider{width:1px;height:18px;background:var(--border2);margin:0 4px;flex-shrink:0}
.cbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.cbadge-viktig{background:#e0555530;color:var(--viktig)}
.cbadge-sportslig{background:#4a9eff30;color:var(--sportslig)}
.cbadge-nyheter{background:#8892b030;color:var(--nyheter)}
.cbadge-goy{background:#52c78a30;color:var(--goy)}
.cbadge-nerding{background:#a87ef030;color:var(--nerding)}
.cbadge-kjendis{background:#f0a04a30;color:var(--kjendis)}
.cbadge-naert{background:#3cc8c830;color:var(--naert)}

/* SEARCH ROW */
.search-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 0 6px}
.search-input{flex:1;min-width:140px;max-width:300px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:13px;outline:none}
.search-input:focus{border-color:var(--sportslig)}
.search-input::placeholder{color:var(--fg3)}
.athlete-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--fg);font-family:'Figtree',sans-serif;font-size:12px;outline:none;cursor:pointer}
.athlete-select:focus{border-color:var(--sportslig)}
.count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);white-space:nowrap}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;max-width:1200px;margin:0 auto;padding:14px 20px 60px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
.src-NOR{background:#52c78a18;color:var(--goy)}
.src-INT,.src-USA{background:#4a9eff18;color:var(--sportslig)}
.src-AUT{background:#e0555518;color:var(--viktig)}
.src-SUI{background:#f0a04a18;color:var(--kjendis)}
.src-SWE,.src-FIN{background:#a87ef018;color:var(--nerding)}
.src-ITA,.src-FRA,.src-GER{background:#4a9eff18;color:var(--sportslig)}
.lang{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px}
.cat-chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.cat-viktig{background:#e0555520;color:var(--viktig)}
.cat-sportslig{background:#4a9eff20;color:var(--sportslig)}
.cat-nyheter{background:#8892b020;color:var(--nyheter)}
.cat-goy{background:#52c78a20;color:var(--goy)}
.cat-nerding{background:#a87ef020;color:var(--nerding)}
.cat-kjendis{background:#f0a04a20;color:var(--kjendis)}
.cat-naert{background:#3cc8c820;color:var(--naert)}
.nor-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(186,12,47,.15);color:#e8566f;border:1px solid rgba(186,12,47,.35)}
.multi-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;cursor:help;background:rgba(80,160,255,.12);color:#6fb0ff;border:1px solid rgba(80,160,255,.3)}
.card-nor{border-left:3px solid #ba0c2f}
.race-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#f0a04a;background:#f0a04a15;border:1px solid #f0a04a40;padding:1px 6px;border-radius:3px}
.time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);margin-left:auto}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:3px}
.card-title:hover{color:var(--sportslig)}
.card-summary{font-size:12px;color:var(--fg2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-spik{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;background:#4a9eff0d;border-left:2px solid var(--sportslig);border-radius:0 4px 4px 0}
.spik-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--sportslig);white-space:nowrap;flex-shrink:0}
.spik-text{font-size:12px;color:var(--fg2);line-height:1.5;font-style:italic}
.empty{text-align:center;padding:60px 0;color:var(--fg3);font-size:13px}

/* SIDEBAR */
.sidebar{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding-left:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.spik-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:6px}
.spik-card-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.spik-card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--fg);display:block;margin-bottom:5px}
.spik-card-title:hover{color:var(--sportslig)}
.spik-card-body{font-size:12px;color:var(--fg2);font-style:italic;line-height:1.5;border-left:2px solid var(--sportslig);padding-left:8px}
.sidebar-empty{font-size:12px;color:var(--fg3);padding:16px 0;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⛷ Alpin<span>Monitor</span></div>
    <div class="season" id="season-badge"></div>
    <span class="readonly-badge">👁 Lesevisning</span>
    <span class="updated">Oppdatert 22.10., 21:30</span>
  </div>
  <div class="filter-rows"><div class="filter-row" id="cat-row"></div></div>

    <input class="search-input" type="search" id="search" placeholder="Søk i titler, utøvere…">
    <select class="athlete-select" id="country-select"><option value="">Alle land</option></select>
    <select class="athlete-select" id="athlete-select"><option value="">Alle utøvere</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="main">
  <div id="feed"></div>
  <div class="sidebar">
    <div class="section-label" id="spik-label">Spik-liste</div>
    <div id="spik-list"></div>
  </div>
</div>

<script>
const CATS = [{"id":"viktig","label":"⚡ Viktig"},{"id":"sportslig","label":"🎿 Sportslig"},{"id":"nyheter","label":"📰 Nyhet"},{"id":"goy","label":"😄 Gøy"},{"id":"nerding","label":"🔬 Nerding"},{"id":"kjendis","label":"🌟 Kjendis"},{"id":"naert","label":"🤝 Nært og nyttig"}];
const ARTICLES = [{"id":51667,"source_name":"Ski Racing","country":"INT","title_no":"Shiffrin endrer program mens Odermatt jager sjette strake verdenscuptittel","title_orig":"Shiffrin Shifts Schedule as Odermatt Chases Sixth Straight World Cup Title","summary_no":"Mikaela Shiffrin justerer sitt konkurranseprogram, mens Marcel Odermatt er i ferd med å sikre sin sjette strake verdenscuptittel.","spik_no":"Mikaela Shiffrin justerer programmet sitt for 2026–27-sesongen og hopper over de tidlige slalåmrennene i Levi og Gurgl, men planlegger å være tilbake i disiplinen til Killington. Den seksdobbelte sammenlagtvinneren kaller den kommende vinteren en «utforskningssesong» der hun vil prioritere mer trening i storslalåm og super-G mellom rennene. På herresiden jager Marcel Odermatt sin sjette strake verdenscuptittel, noe som ville plassere ham i eksklusivt selskap i alpinhistorien. Sveitseren har dominert herresiden siden 2021–22 og er allerede en av de mest dominerende utøverne i moderne alpint.","url":"https://skiracing.com/shiffrin-schedule-odermatt-world-cup-title/","pub_date":"2026-10-22T19:34:20.000Z","fetched_at":"2026-10-22 20:45:01","lang_orig":"en","category":null,"athletes":"Marco Odermatt,Mikaela Shiffrin","athlete_nations":["SUI","USA"],"also_sources":[],"norwegian":false},{"id":50873,"source_name":"Neveitalia","country":"ITA","title_no":"Europacup-utøverne samles på Stelvio og Val Senales","title_orig":"Allo Stelvio anche le velociste del team Coppa Europa, oltre a Guerinoni e Pomaré. Carolli, Sola e compagne in Val Senales da lunedì","summary_no":"Fartsspesialistene fra Europacup-laget trener på Stelvio sammen med Guerinoni og Pomaré, mens Carolli, Sola og lagvenninner reiser til Val Senales fra mandag.","spik_no":"Det italienske alpinlandslaget samler Europacup-utøverne til treningsleir på to ulike isbreer denne høsten. Fartsspesialistene Righi, Amigoni, Parravicini, Vanni og Putzer trener på Stelvio-breen, sammen med gigantistene Guerinoni og Pomaré som begge er på vei tilbake etter alvorlige skader fra forrige sesong. Carolli, Sola og resten av gigantistgruppen reiser til Val Senales fra mandag. Stelvio og Val Senales er de to viktigste høyfjellsglasierene i Italia for tidlig sesongforberedelse, og brukes jevnlig av alpinnasjoner fra hele Europa på høsten.","url":"https://www.neveitalia.it/sport/scialpino/femminile/news/allo-stelvio-anche-le-velociste-del-team-coppa-europa-oltre-a-guerinoni-e-pomare-carolli-sola-e-compagne-in-val-senales-da-lune","pub_date":"2026-10-22T17:05:00.000Z","fetched_at":"2026-10-22 17:15:01","lang_orig":"it","category":null,"athletes":"Ambra Pomaré","athlete_nations":["ITA"],"also_sources":[],"norwegian":false},{"id":50737,"source_name":"Ski Racing","country":"INT","title_no":"Alexander Steen Olsen klar for comeback i Sölden","title_orig":"Alexander Steen Olsen to Make World Cup Comeback in Sölden","summary_no":"Alexander Steen Olsen er klar for å returnere til verdenscupen når sesongen åpner i Sölden.","spik_no":"Alexander Steen Olsen gjør comeback i verdenscupen når sesongen åpner på Rettenbachbreen i Sölden denne søndagen – samme sted hvor han vant storslalåmåpningen i 2024. I desember i fjor valgte 24-åringen fra Oslo å operere et plagsomt hopperkne og gikk glipp av hele den olympiske sesongen. Steen Olsen er ett av de største norske alpintalentene på mange år: han vant både storslalåm og slalåm i junior-VM i 2022, og tok sin første verdenscupseier i slalåm i Palisades Tahoe i sesongen 2022–23.","url":"https://skiracing.com/alexander-steen-olsen-to-make-world-cup-comeback-in-solden/","pub_date":"2026-10-22T16:46:19.000Z","fetched_at":"2026-10-22 17:00:01","lang_orig":"en","category":null,"athletes":"Alexander Steen Olsen","athlete_nations":["NOR"],"also_sources":[],"norwegian":true},{"id":50157,"source_name":"Ski Racing","country":"INT","title_no":"Forhåndsvisning av kvinnenes verdenscupsesong 2026/27","title_orig":"Ski Racing Media’s Katie Twible Joins Skiing Is Believing to Preview the 2026/27 Women’s World Cup Season","summary_no":"Katie Twible fra Ski Racing Media deltar i Skiing Is Believing for å gi en forhåndsvisning av kvinnenes verdenscupsesong 2026/27.","spik_no":"Verdenscupsesongen 2026/27 i alpint starter om få dager med storslalåm i Sölden, og det er allerede knyttet stor spenning til feltets sammensetning. Mikaela Shiffrin, som er den mestdekorerte alpinisten i verdenscuphistorien med over 90 seire, har besluttet å stille i færre slalåmrenn denne sesongen – noe som kan åpne for at rivaler tar poeng. I tillegg er det tidlig usikkerhet rundt Federica Brignone, Sofia Goggia og Valérie Grenier, tre av verdenscupens jevneste profiler, som alle er ventet å mangle i åpningsrennene.","url":"https://skiracing.com/ski-racing-medias-katie-twible-joins-skiing-is-believing-to-preview-the-2026-27-womens-world-cup-season/","pub_date":"2026-10-22T15:30:43.000Z","fetched_at":"2026-10-22 15:45:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":49582,"source_name":"Ski Racing","country":"INT","title_no":"Žampa Cup går globalt: Syv land, to kontinenter og nytt samarbeid","title_orig":"Žampa Cup Goes Global: Seven Countries, Two Continents and a New Partnership with Ski Racing Media","summary_no":"Žampa Cup ekspanderer internasjonalt med deltakere fra syv land på to kontinenter, og inngår samtidig et nytt partnerskap med Ski Racing Media.","spik_no":"Žampa Cup ekspanderer internasjonalt i sesongen 2026/27 med renn i syv land på to kontinenter, og inngår samtidig et samarbeid med Ski Racing Media om dekning av serien. For første gang forlater cupen Europa, og sesongen åpner med en innendørs storslalåm i Ski Dubai i De forente arabiske emirater 14. november – seriens 12. sesong totalt. Žampa Cup er en gratis barneløpsserie opprinnelig startet av brødrene Žampa fra Slovakia, og har vokst til å bli et av de mer utbredte grassroots-initiativene i alpint.","url":"https://skiracing.com/zampa-cup-goes-global-seven-countries-two-continents-and-a-new-partnership-with-ski-racing-media/","pub_date":"2026-10-22T14:21:18.000Z","fetched_at":"2026-10-22 14:30:01","lang_orig":"en","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":49037,"source_name":"Neveitalia","country":"ITA","title_no":"«5x5» i herrecupen: Odermatt jakter «6», Braathen, Meillard og McGrath er utfordrerne","title_orig":"I \"5x5\" della coppa maschile: Odermatt per fare \"6\", sono Pinheiro Braathen, Meillard e McGrath le alternative","summary_no":"Marco Odermatt ønsker å vinne verdenscupen for sjette gang, mens Pinheiro Braathen, Meillard og McGrath regnes som de fremste alternativene.","spik_no":"Marco Odermatt går inn i sesongen 2026/27 på jakt etter sin sjette store krystallkule i verdenscupen sammenlagt — noe som ville gjøre ham til en av de aller største i historien. Sveitseren har dominert cupen siden 2022 og vant fire sammenlagtseirer på rad, men møter nå tøffere motstand fra Lucas Pinheiro Braathen, Loic Meillard og Atle Lie McGrath. Meillard og Odermatt er regnet som jevnbyrdige i storslalåm, mens Odermatt i super-G også må se opp for Franzoni og Kriechmayr.","url":"https://www.neveitalia.it/sport/scialpino/maschile/news/i-5x5-della-coppa-maschile-odermatt-per-fare-6-sono-pinheiro-braathen-meillard-e-mcgrath-le-alternative","pub_date":"2026-10-22T13:05:00.000Z","fetched_at":"2026-10-22 13:15:08","lang_orig":"it","category":null,"athletes":"Atle Lie McGrath,Loïc Meillard,Lucas Braathen,Marco Odermatt","athlete_nations":["BRA","NOR","SUI"],"also_sources":[],"norwegian":true},{"id":48956,"source_name":"SkinEWS","country":"SUI","title_no":"Ny trener for Lara Colturi","title_orig":"Ein neuer Coach für Lara Colturi","summary_no":"Lara Colturi har fått en ny trener.","spik_no":"Lara Colturi starter Weltcup-sesongen 2026/27 i Sölden med en ny trener ved sin side: franske Johan Clarey, som selv har 240 verdenscuprenn og en olympisk medalje bak seg. Den 19 år gamle Colturi konkurrerer for Albania, men er datter av italienske Daniela Ceccarelli, som vant OL-gull i super-G under lekene i Salt Lake City i 2002. Ambisjonen er nå at Colturi – i tillegg til de tekniske disiplinene slalåm og storslalåm der hun allerede har markert seg – også skal utvikle seg i nettopp super-G, morens spesialitet.","url":"https://www.skinews.ch/news/2026/neuer-coach-colturi/","pub_date":"2026-10-22T12:53:28.000Z","fetched_at":"2026-10-22 13:00:10","lang_orig":"de","category":null,"athletes":"Lara Colturi","athlete_nations":["ALB"],"also_sources":[],"norwegian":false},{"id":48084,"source_name":"SkinEWS","country":"SUI","title_no":"Make Skiracing great again – en glosse","title_orig":"Make Skiracing great again – eine Glosse","summary_no":"En satirisk kommentar om tilstanden i alpint og hva som skal til for å gjøre sporten stor igjen.","spik_no":"En satirisk kommentar fra skinews.ch bruker Donald Trump som metafor for tilstanden i alpinsporten foran sesongåpningen i Sölden. Teksten leker med tanken om at ego og personlighet har overtatt for det tekniske og atletiske i sporten. Innholdet er låst bak betalingsmur, men tonen er tydelig ironisk og peker på tendenser i tidens ånd – et gjenkjennelig grep i europeisk sportsjournalistikk.","url":"https://www.skinews.ch/news/2026/skiracing-great-glosse/","pub_date":"2026-10-22T10:22:24.000Z","fetched_at":"2026-10-22 10:54:38","lang_orig":"de","category":null,"athletes":null,"athlete_nations":[],"also_sources":[],"norwegian":false},{"id":48069,"source_name":"Neveitalia","country":"ITA","title_no":"Preparering av Rettenbach etter snøfall – ingen trening fredag morgen for damene","title_orig":"Si lavora sul Rettenbach dopo la nevicata, niente sciata in pista venerdì mattina per le ragazze alla vigilia del gigante","summary_no":"Arbeidet på Rettenbach-breen pågår etter kraftig snøfall, og damene får ikke trene på pisten fredag morgen før storslalåmrennet.","spik_no":"Et kraftig snøfall på rundt 20 centi
